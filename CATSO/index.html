<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#02594C">
<title>Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F4F6F3;--card:#FFFFFF;--ink:#1C1C1A;--muted:#5A6B6C;--green:#02594C;--teal:#02A78B;--line:#D7DEDB;--tint:#ECFBF6}
@media (prefers-color-scheme: dark){:root{--bg:#111716;--card:#1A2321;--ink:#E8EEEC;--muted:#9FB0AD;--green:#6FD3BF;--teal:#3CC4A6;--line:#2C3936;--tint:#16302B}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 -apple-system,"Segoe UI",Calibri,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px}
header{padding:8px 4px 12px}
header h1{margin:0 0 4px;font-size:22px;color:var(--green)}
header p{margin:0;color:var(--muted);font-size:14px}


.menu{position:fixed;top:10px;right:10px;z-index:10}.menu summary{list-style:none;width:44px;height:44px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.85}.menu summary::-webkit-details-marker{display:none}.menu[open] summary{opacity:1}.panel{position:absolute;top:52px;right:0;width:min(86vw,340px);max-height:75vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}.panel .row{display:flex;gap:6px;margin:0 0 8px}.panel button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--green);font:inherit;font-weight:700;border-radius:10px;cursor:pointer}.panel a{display:block;padding:10px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px}.panel a:active{background:var(--tint)}.toc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:0 0 14px}
.toc summary{font-weight:700;color:var(--green);cursor:pointer;padding:8px 0;list-style:none}
ol{margin:6px 0 8px;padding-left:22px} ol li{margin:6px 0} ol a{color:var(--ink);text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:12px 14px;margin:0 0 14px;scroll-margin-top:12px}
.card summary{list-style:none;cursor:pointer}
.card summary::-webkit-details-marker,.toc summary::-webkit-details-marker{display:none}
.lab{margin:0;padding-right:46px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h2{margin:2px 0 8px;font-size:20px;line-height:1.25;color:var(--green)}
.fl{margin:0 0 8px;padding:8px 10px;background:var(--tint);border-radius:8px;font-size:16px}
.fl span{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--teal)}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted);text-align:right}
details[open] .front{display:none}
details[open].card{border-left-color:var(--green)}
.tk{margin:0 0 8px;font-size:13px;font-style:italic;color:var(--muted)}
.txt{margin:0 0 8px} .txt b{color:var(--green)}
.ticks{border-left-color:#C98A1B} .ref{margin:6px 0;font-size:15px}
.top{display:block;text-align:center;color:var(--muted);font-size:14px;padding:8px 0 24px}

.lock{max-width:420px;margin:15vh auto 0;padding:24px 16px;text-align:center}
.lock h1{margin:0 0 8px;font-size:24px;color:var(--green)}
.lock p{margin:0 0 16px;color:var(--muted)}
.lock input{width:100%;min-height:48px;padding:10px 14px;font:inherit;font-size:17px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.lock button{width:100%;min-height:48px;margin-top:10px;border:0;border-radius:10px;background:var(--green);color:var(--card);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.lock label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;color:var(--muted);font-size:14px}
.lock label input{width:20px;min-height:20px}
.err{color:#B3261E;min-height:22px;margin-top:10px;font-size:14px}
.forget{display:block;margin:0 auto 24px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
<h1>Cards</h1>
<p>Enter your password</p>
<form id="f"><input id="pw" type="password" autocomplete="current-password" aria-label="Password" required>
<button type="submit" id="go">Open</button>
<label><input type="checkbox" id="rem" checked> Remember on this phone</label>
<div class="err" id="err" role="alert"></div></form>
</div>
<main id="app" hidden></main>

var ITER=600000;
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
var raw=b64(DATA),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
function db(){return new Promise(function(ok,no){var r=indexedDB.open('cards',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){ok(r.result)};r.onerror=no})}
function getKey(){return db().then(function(d){return new Promise(function(ok){var q=d.transaction('k').objectStore('k').get('key');q.onsuccess=function(){ok(q.result)};q.onerror=function(){ok(null)}})}).catch(function(){return null})}
function putKey(k){return db().then(function(d){d.transaction('k','readwrite').objectStore('k').put(k,'key')}).catch(function(){})}
function dropKey(){return db().then(function(d){d.transaction('k','readwrite').objectStore('k').delete('key')}).catch(function(){})}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(b){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt'])})}
function open_(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct).then(function(p){return new TextDecoder().decode(p)})}
function show(htmlText){
  var m=document.getElementById('app');m.innerHTML=htmlText+'<button type="button" class="forget" id="forget">Lock and forget on this phone</button>';
  document.getElementById('lock').hidden=true;m.hidden=false;
  var cs=m.querySelectorAll('details.card');
  document.getElementById('all').onclick=function(){cs.forEach(function(d){d.open=true})};
  document.getElementById('none').onclick=function(){cs.forEach(function(d){d.open=false})};
  var mn=document.getElementById('menu');mn.querySelectorAll('a,button').forEach(function(x){x.addEventListener('click',function(){mn.open=false})});
  document.getElementById('forget').onclick=function(){dropKey().then(function(){location.reload()})};
}
function ask(){document.getElementById('lock').hidden=false;document.getElementById('pw').focus()}
document.getElementById('f').onsubmit=function(e){
  e.preventDefault();var btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Opening...';err.textContent='';
  derive(document.getElementById('pw').value).then(function(k){return open_(k).then(function(t){
    if(document.getElementById('rem').checked)putKey(k);show(t)})})
  .catch(function(){err.textContent='That password did not work.';btn.disabled=false;btn.textContent='Open'});
};
getKey().then(function(k){if(!k)return ask();open_(k).then(show).catch(function(){dropKey();ask()})});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
