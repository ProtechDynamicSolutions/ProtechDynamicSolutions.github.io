<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05100A">
<meta name="robots" content="noindex, nofollow">
<title>Dubhglas Hub — Demo</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 80% 0%,#0B2116 0%,#05100A 60%);color:#F3F9F5;
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;text-align:center}
.crest{width:84px;height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:18px}
.tag{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;background:#D4A24C;color:#1B1204;
  font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
p.lead{color:rgba(243,249,245,.72);font-size:15px;line-height:1.55;margin:16px 0 22px}
form{display:flex;flex-direction:column;gap:12px;text-align:left}
input[type=password]{width:100%;padding:15px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);color:#F3F9F5;font:inherit;font-size:16px}
input[type=password]:focus{outline:none;border-color:#17C767;background:rgba(255,255,255,.09)}
label{display:flex;align-items:center;gap:9px;font-size:14px;color:rgba(243,249,245,.72)}
label input{width:18px;height:18px;accent-color:#00A651}
button{padding:15px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;color:#03150B;
  background:linear-gradient(175deg,#17C767,#00753A);cursor:pointer}
button[disabled]{opacity:.55}
.msg{min-height:20px;font-size:14px;color:#FF8A7A;text-align:center}
.by{margin-top:26px;font-size:12px;color:rgba(243,249,245,.45)}
</style>
</head>
<body>
<main class="card">
  <img class="crest" src="favicon.png" alt="" onerror="this.remove()">
  <h1>Dubhglas Hub</h1>
  <span class="tag">Demo</span>
  <p class="lead">This demo is private. Enter the password you were given.</p>
  <form id="f" autocomplete="off">
    <input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
    <label><input type="checkbox" id="keep" checked> Remember on this phone</label>
    <button id="go" type="submit">Open the demo</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="by">A Protech Dynamic Solutions demo</div>
</main>

      go.disabled = false; go.textContent = 'Open the demo';
      say('That password is not right.');
    }
  };
})();
})();
</script>
