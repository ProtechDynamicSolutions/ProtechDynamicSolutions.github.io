  /* what the tokens become on any dark surface (top chrome, hero) */
  --d-tx:#F3F9F5; --d-tx2:rgba(243,249,245,.76); --d-tx3:rgba(243,249,245,.58);
  --d-line:rgba(255,255,255,.13); --d-line2:rgba(255,255,255,.24);
  --d-surf:rgba(255,255,255,.06); --d-surf2:rgba(255,255,255,.12);
  --d-green:#4BEBA0;
  --gut:16px;
  --ff:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fd:'Instrument Serif',Georgia,serif;
}
:root[data-theme="day"]{
  /* white first: pure white cards floating on the barest tint of green,
     so a card reads by its own light rather than by a drawn box */
  --ink:#F5F8F6; --ink-2:#FFFFFF; --ink-3:#EFF4F1;
  --surf:rgba(6,18,12,.022); --surf-2:rgba(6,18,12,.05);
  --card:#FFFFFF;
  --card-sh:0 1px 2px rgba(8,40,24,.05), 0 12px 32px -20px rgba(8,40,24,.28);
  --line:rgba(6,18,12,.07); --line-2:rgba(6,18,12,.15);
  --tx:#0B1A12; --tx-2:#4A6154; --tx-3:#5E7468;   /* was #6E8478: 3.8:1 on the page, now 5:1 */
  --green-gl:#007A3B;                             /* was #008C44: 4.1:1 on the page, now 5.1:1 */
  /* the night-mode gold is too pale to read on white */
  --gold:#94680F; --warn:#A9730B;   /* gold eyebrows were 3.7:1, now 4.6:1 */ --danger:#C0392B;
  --sh-2:0 8px 24px -10px rgba(6,40,22,.20);
  --sh-3:0 24px 60px -24px rgba(6,40,22,.26);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--ff); background:var(--ink); color:var(--tx);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none; min-height:100svh;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 520px at 50% -10%, rgba(0,166,81,.16), transparent 70%),
    radial-gradient(700px 500px at 100% 100%, rgba(212,162,76,.07), transparent 70%);
}
:root[data-theme="day"] body::before{
  background:
    radial-gradient(900px 520px at 50% -10%, rgba(0,166,81,.055), transparent 70%),
    radial-gradient(700px 500px at 100% 100%, rgba(212,162,76,.04), transparent 70%);
}
img,svg,video{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--green-gl);outline-offset:3px;border-radius:6px}
::selection{background:rgba(0,166,81,.35)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

.crest{background:var(--crest) center/contain no-repeat;aspect-ratio:243/306}

/* ---------- type ---------- */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green-gl)}
.eyebrow.gold{color:var(--gold)}
.h1{font-size:clamp(30px,7.6vw,46px);font-weight:700;letter-spacing:-.032em;line-height:1.04}
.h2{font-size:clamp(22px,5.2vw,30px);font-weight:700;letter-spacing:-.026em;line-height:1.12}
.h3{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.h4{font-size:14px;font-weight:700}
.serif{font-family:var(--fd);font-weight:400;letter-spacing:-.01em}
.muted{color:var(--tx-2)}.dim{color:var(--tx-3)}
.small{font-size:13px}.tiny{font-size:11.5px}
.lede{font-size:15.5px;line-height:1.65;color:var(--tx-2)}
.up{text-transform:uppercase;letter-spacing:.1em}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gut);position:relative;z-index:1}
.stack{display:flex;flex-direction:column}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.gap-14{gap:14px}.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}.gap-28{gap:28px}.gap-36{gap:36px}
.row{display:flex;align-items:center}
.row-t{display:flex;align-items:flex-start}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.center{text-align:center}
.hide{display:none!important}
.nowrap{white-space:nowrap}
@media(min-width:700px){
  :root{--gut:24px}
  .g-md-2{grid-template-columns:repeat(2,1fr)}
  .g-md-3{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1000px){.g-lg-3{grid-template-columns:repeat(3,1fr)}.g-lg-4{grid-template-columns:repeat(4,1fr)}}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;
  position:relative;box-shadow:var(--card-sh)}
.card.pad-s{padding:14px}
.card.glow{box-shadow:var(--sh-2)}
/* a card that flags itself with a soft wash from one corner and a coloured hairline */
.card.accent-gold{border-color:rgba(212,162,76,.42);
  background:radial-gradient(120% 140% at 0% 0%,rgba(212,162,76,.16),transparent 55%),var(--card)}
.card.accent-green{border-color:rgba(0,166,81,.34);
  background:radial-gradient(120% 140% at 0% 0%,rgba(0,166,81,.13),transparent 55%),var(--card)}
.card-btn{width:100%;text-align:left;transition:border-color .18s,background .18s,transform .18s}
.card-btn:hover{border-color:var(--line-2);background:var(--surf-2)}
.card-btn:active{transform:scale(.988)}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-m);padding:15px}
.hair{height:1px;background:var(--line);border:0;margin:0}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--surf-2);border:1px solid var(--line);
  color:var(--tx-2);white-space:nowrap}
.chip.g{background:rgba(0,166,81,.16);border-color:rgba(0,166,81,.34);color:var(--green-gl)}
.chip.gold{background:rgba(212,162,76,.14);border-color:rgba(212,162,76,.36);color:var(--gold-br)}
.chip.solid{background:var(--green);border-color:transparent;color:#03150B;font-weight:700}
.chip.sm{padding:3px 8px;font-size:10.5px}
:root[data-theme="day"] .chip.gold{color:#8A5F16}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:14px;font-weight:600;font-size:15px;
  border:1px solid var(--line-2);background:var(--surf-2);color:var(--tx);
  transition:transform .15s,background .18s,border-color .18s,filter .18s;
  text-decoration:none;min-height:48px}
.btn:hover{background:var(--surf);border-color:var(--line-2)}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(175deg,var(--green-br),var(--green-dp));border-color:transparent;
  color:#02120A;font-weight:700;box-shadow:0 8px 22px -10px rgba(0,166,81,.85),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:linear-gradient(175deg,var(--gold-br),#B8863A);border-color:transparent;color:#1B1204;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 13px;font-size:13.5px;min-height:38px;border-radius:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surf);transition:background .18s,border-color .18s}
.icon-btn:hover{background:var(--surf-2);border-color:var(--line-2)}

/* ---------- inputs ---------- */
.field{width:100%;padding:14px 15px;border-radius:14px;background:var(--surf);
  border:1px solid var(--line-2);color:var(--tx);font-size:16px;transition:border-color .18s,background .18s}
.field::placeholder{color:var(--tx-3)}
.field:focus{outline:none;border-color:var(--green);background:var(--surf-2)}
select.field{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx-2) 50%),linear-gradient(135deg,var(--tx-2) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;
  background-repeat:no-repeat;padding-right:40px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin-bottom:7px;display:block}

/* ---------- club motifs ---------- */
.motif{color:var(--gold);opacity:.9;flex:none}
.rule{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.rule .ln{height:1px;flex:1;background:linear-gradient(90deg,var(--line-2),transparent)}
.rule .ln.l{background:linear-gradient(270deg,var(--line-2),transparent)}
/* ---------- the strike rule ----------
   A proper ground stroke under each section heading. The hurley swings from
   the hands (not the bas), takes a real backswing, pauses, whips through with
   a swoosh and a smear, and the sliotar squashes on contact, skips along the
   grass spinning, and the line is the track it leaves. Runs once per heading
   the first time it scrolls into view (see afterRender).
   Timeline: backswing 0-380ms, hold, downswing, contact at ~550ms, follow
   through to ~770ms, settle. The ball leaves at 550ms. */
.strike{--T:1.35s;--hit:.55s;--fly:1.15s;
  display:flex;align-items:stretch;height:36px;margin:2px 0 4px;max-width:min(340px,100%)}
.strike .sh{position:relative;flex:none;width:28px;height:36px;margin-right:-3.5px;color:var(--gold)}
.strike .hy{position:absolute;left:0;top:0;width:28px;height:36px;overflow:visible;transform-origin:14px 3px}
.strike .hy.g1,.strike .hy.g2{opacity:0}
.strike .hy.g1{--gp:.34}.strike .hy.g2{--gp:.16}
.strike .sw{position:absolute;left:0;top:0;width:28px;height:36px;overflow:visible;fill:none;
  stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
.strike .bz{position:absolute;left:24px;top:28px;width:0;height:0}
.strike .bz i{position:absolute;left:0;top:0;width:6px;height:1.6px;border-radius:2px;background:var(--gold);
  transform-origin:0 50%;opacity:0;transform:rotate(var(--r)) translateX(2px) scaleX(.2)}
.strike .bz i:nth-child(1){--r:-38deg}.strike .bz i:nth-child(2){--r:-4deg}.strike .bz i:nth-child(3){--r:30deg}
.strike .st{position:relative;flex:1;min-width:0;margin-right:16px}
.strike .sl{position:absolute;left:0;bottom:1.5px;height:2px;width:0;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--gold) 22%,var(--gold))}
.strike .sb{position:absolute;left:100%;bottom:.5px;width:11px;height:11px}
.strike .bsh{position:absolute;left:1px;right:1px;bottom:-2px;height:3px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent)}
.strike .sy{position:absolute;inset:0}
.strike .sy svg{width:11px;height:11px;display:block;transform-origin:50% 50%}

.strike.go .hy{animation:shSwing var(--T) linear forwards}
.strike.go .hy.g1{animation:shGhost var(--T) linear .02s forwards}
.strike.go .hy.g2{animation:shGhost var(--T) linear .04s forwards}
.strike.go .sw{animation:shSwoosh var(--T) linear forwards}
.strike.go .bz i{animation:shBurst .32s var(--hit) cubic-bezier(.2,.7,.3,1) forwards}
.strike.go .sl{animation:shLine var(--fly) var(--hit) cubic-bezier(.12,.72,.28,1) forwards}
.strike.go .sy{animation:shHop var(--fly) var(--hit) linear forwards}
.strike.go .bsh{animation:shShadow var(--fly) var(--hit) linear forwards}
.strike.go .sy svg{animation:shSpin var(--fly) var(--hit) cubic-bezier(.12,.72,.28,1) forwards}

/* hands are the pivot: + is the backswing (bas goes back and up), - is the follow through */
@keyframes shSwing{
  0%  {transform:rotate(0deg);animation-timing-function:cubic-bezier(.35,0,.5,1)}
  28% {transform:rotate(66deg)}
  34% {transform:rotate(69deg);animation-timing-function:cubic-bezier(.62,0,.96,.55)}
  41% {transform:rotate(-2deg);animation-timing-function:cubic-bezier(.08,.62,.38,1)}
  57% {transform:rotate(-84deg);animation-timing-function:cubic-bezier(.45,0,.35,1)}
  100%{transform:rotate(-4deg)}}
@keyframes shGhost{
  0%  {transform:rotate(0deg);opacity:0;animation-timing-function:cubic-bezier(.35,0,.5,1)}
  28% {transform:rotate(66deg);opacity:0}
  34% {transform:rotate(69deg);opacity:0;animation-timing-function:cubic-bezier(.62,0,.96,.55)}
  37% {opacity:var(--gp)}
  41% {transform:rotate(-2deg);opacity:var(--gp);animation-timing-function:cubic-bezier(.08,.62,.38,1)}
  49% {opacity:0}
  57% {transform:rotate(-84deg);opacity:0}
  100%{transform:rotate(-4deg);opacity:0}}
@keyframes shSwoosh{
  0%,33%{opacity:0;stroke-dashoffset:100}
  36% {opacity:.22;stroke-dashoffset:78}
  41% {opacity:.3;stroke-dashoffset:34}
  46% {opacity:.14;stroke-dashoffset:0}
  51%,100%{opacity:0;stroke-dashoffset:0}}
@keyframes shBurst{
  0%  {opacity:1;transform:rotate(var(--r)) translateX(1px) scaleX(.2)}
  100%{opacity:0;transform:rotate(var(--r)) translateX(7px) scaleX(1)}}
@keyframes shLine{from{width:0}to{width:100%}}
/* squash on the bas, then spin; the seam makes the spin readable */
@keyframes shSpin{
  0%  {transform:scale(.74,1.16) rotate(0deg)}
  6%  {transform:scale(1.07,.95) rotate(80deg)}
  13% {transform:scale(1,1) rotate(170deg)}
  100%{transform:scale(1,1) rotate(1080deg)}}
/* a ground stroke skips: two small hops, then it runs along the grass */
@keyframes shHop{
  0%  {transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  9%  {transform:translateY(-5px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
  18% {transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  25% {transform:translateY(-2.2px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
  32% {transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  37% {transform:translateY(-.8px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
  42%,100%{transform:translateY(0)}}
@keyframes shShadow{
  0%{transform:scaleX(1);opacity:1} 9%{transform:scaleX(.55);opacity:.45} 18%{transform:scaleX(1);opacity:1}
  25%{transform:scaleX(.8);opacity:.75} 32%,100%{transform:scaleX(1);opacity:1}}

/* reduced motion, or anything we never got to observe: the finished picture */
.strike.done .hy{transform:rotate(-4deg)}
.strike.done .sl{width:100%}
@media(prefers-reduced-motion:reduce){
  .strike .hy{transform:rotate(-4deg)}
  .strike .sl{width:100%}
  .strike.go *{animation:none!important}
}

/* stitched sliotar underline under a heading (kept for anything still using it) */
.stitch{position:relative;padding-bottom:9px;display:inline-block}
.stitch::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:3px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 7px,transparent 7px 13px);
  opacity:.55;border-radius:2px}

/* ==========================================================
   INTRO
   ========================================================== */
#intro{position:fixed;inset:0;z-index:200;background:#040D08;display:grid;place-items:center;overflow:hidden}
#intro.out{animation:introOut .75s cubic-bezier(.65,0,.35,1) forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.06);visibility:hidden}}
#introVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.30;transition:opacity .9s ease}
/* act one: the film on its own, at full strength; the card waits its turn */
#intro.film #introVid{opacity:1}
#intro.film .intro-in,#intro.film .intro-veil,#intro.film .intro-stripes{display:none}
.intro-skip.film-skip{display:none;position:absolute;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(22px + env(safe-area-inset-bottom));margin:0;background:rgba(4,13,8,.45);animation:none}
#intro.film .intro-skip.film-skip{display:inline-flex}
.intro-veil{position:absolute;inset:0;
  background:radial-gradient(70% 55% at 50% 42%,rgba(0,166,81,.20),transparent 70%),
             linear-gradient(180deg,rgba(4,13,8,.62),rgba(4,13,8,.90) 62%,#040D08)}
.intro-stripes{position:absolute;inset:0;opacity:.055;
  background:repeating-linear-gradient(90deg,#fff 0 46px,transparent 46px 92px)}
.intro-in{position:relative;z-index:2;text-align:center;padding:24px;width:100%;max-width:760px}
.intro-crest{width:104px;margin:0 auto 20px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6));
  animation:crestIn 1s cubic-bezier(.2,.9,.25,1) both}
@keyframes crestIn{from{opacity:0;transform:translateY(16px) scale(.86)}to{opacity:1;transform:none}}
.intro-name{font-family:var(--fd);font-size:clamp(38px,12vw,68px);color:#fff;line-height:1;
  letter-spacing:.02em;animation:fadeUp .9s .18s both}
.intro-sub{margin-top:10px;font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold-br);font-weight:600;animation:fadeUp .9s .3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:34px;
  animation:fadeUp .9s .5s both}
.ctr{text-align:center;padding:4px 2px}
.ctr .n{font-family:var(--fd);font-size:clamp(24px,7.4vw,42px);color:#fff;line-height:1;
  font-variant-numeric:tabular-nums}
.ctr .k{margin-top:7px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.62);font-weight:600;line-height:1.35}
.intro-skip{margin-top:34px;display:inline-flex;align-items:center;gap:8px;padding:10px 20px;
  border-radius:999px;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.88);
  font-size:13.5px;font-weight:600;background:rgba(255,255,255,.05);
  animation:fadeUp .9s .8s both;transition:background .2s,border-color .2s}
.intro-skip:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.4)}
@media(min-width:700px){.counters{gap:16px}}

/* ==========================================================
   GATE
   ========================================================== */
#gate{min-height:100svh;display:grid;place-items:center;padding:28px var(--gut) 40px;position:relative;z-index:1}
.gate-card{width:100%;max-width:420px;text-align:center}
.gate-crest{width:92px;margin:0 auto 18px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.45))}
.code-in{width:100%;padding:18px;border-radius:18px;background:var(--surf);border:1.5px solid var(--line-2);
  color:var(--tx);font-size:22px;font-weight:700;letter-spacing:.24em;text-align:center;text-transform:uppercase;
  transition:border-color .2s,background .2s}
.code-in::placeholder{letter-spacing:.12em;font-weight:500;color:var(--tx-3);font-size:16px}
.code-in:focus{outline:none;border-color:var(--green);background:var(--surf-2);
  box-shadow:0 0 0 4px rgba(0,166,81,.13)}
.code-in.bad{border-color:var(--danger);animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-5px)}}
.gate-note{font-size:12.5px;color:var(--tx-3);line-height:1.6}
.role-hint{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* ==========================================================
   APP CHROME
   ========================================================== */
#app{display:none;min-height:100svh;flex-direction:column;position:relative;z-index:1}
#app.on{display:flex}
/* the top chrome is always dark, whatever the theme: a dark band across the
   top with the white page running out from under it.
   Solid, not frosted - an always-on backdrop-filter repaints the whole bar
   on every scroll frame. */
.topbar{position:sticky;top:0;z-index:60;background:var(--dark-2);
  border-bottom:1px solid var(--d-line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px var(--gut);display:flex;align-items:center;gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
.tb-crest{width:34px;flex:none}
.tb-title{font-weight:800;letter-spacing:-.01em;font-size:16px;line-height:1.1}
.tb-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);font-weight:600}
main{flex:1;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){main{padding-bottom:40px}}
.page{padding:26px 0 12px;animation:pageIn .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .page,.intro-crest,.intro-name,.intro-sub,.counters,.intro-skip{animation:none!important}
  #intro.out{animation-duration:.01s}
}

/* bottom nav (mobile) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;
  /* lives inside the header, so it reads the dark tokens: the phone gets a dark
     frame top and bottom with the page running between them */
  background:var(--dark-2);
  border-top:1px solid var(--d-line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{display:flex;max-width:640px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;
  color:var(--tx-3);transition:color .18s;position:relative}
.tab.on{color:var(--green-gl)}
.tab.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--green-gl)}
.tab svg{width:21px;height:21px}
.tab span{font-size:10px;font-weight:600;letter-spacing:.01em}
@media(min-width:900px){
  /* on a desktop the tabs sit in the header row, between the name and the buttons,
     so the crest leads and there is one sticky band, not two stacked ones */
  .topbar-in .tb-name{flex:none}
  .tabbar{position:static;flex:1;background:transparent;border:0;padding:0;
    --green-gl:var(--d-green)}
  .tabbar-in{max-width:none;padding:0;justify-content:center;gap:2px;margin:0}
  .tab{flex:0 0 auto;flex-direction:row;gap:8px;padding:9px 13px;border-radius:11px;color:var(--d-tx2);
    transition:color .18s,background .18s}
  .tab:hover{color:var(--d-tx);background:var(--d-surf)}
  .tab.on{background:rgba(75,235,160,.12);color:var(--d-green)}
  .tab span{font-size:13.5px}
  .tab.on::before{display:none}
}

/* ==========================================================
   COMPONENTS
   ========================================================== */
/* hero */
/* ---------- the dark ----------
   One deliberate dark surface against all that white. Everything inside it
   re-reads the tokens, so chips, buttons and eyebrows follow without markup
   changes. Used for the hero and any other feature panel. */
.on-dark,.hero,.topbar,.demo-bar{
  --tx:var(--d-tx); --tx-2:var(--d-tx2); --tx-3:var(--d-tx3);
  --line:var(--d-line); --line-2:var(--d-line2);
  --surf:var(--d-surf); --surf-2:var(--d-surf2);
  --card:var(--d-surf); --card-sh:none;
  --green-gl:var(--d-green); --gold:var(--gold-br);
  color:var(--d-tx);
}
.hero{
  border-radius:var(--r-xl); padding:30px 26px; position:relative; overflow:hidden; border:0;
  background:
    radial-gradient(85% 105% at 4% -10%, rgba(0,196,96,.40), transparent 62%),
    radial-gradient(70% 90% at 104% 112%, rgba(212,162,76,.10), transparent 60%),
    linear-gradient(155deg, var(--dark-1), var(--dark-2) 80%);
  box-shadow:0 20px 50px -28px rgba(5,25,14,.85);
}
/* mown pitch stripes - only in the lit corner, so they suggest grass
   rather than banding the whole panel */
.hero::after{content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 44px,transparent 44px 88px);
  -webkit-mask-image:radial-gradient(75% 95% at 4% -10%,#000,transparent 60%);
  mask-image:radial-gradient(75% 95% at 4% -10%,#000,transparent 60%)}
.hero>*{position:relative;z-index:1}
.hero>.hero-mark{position:absolute;z-index:0;right:-34px;bottom:-46px;color:var(--gold-br);opacity:.11;pointer-events:none}
@media(max-width:620px){.hero>.hero-mark{right:-60px;bottom:-70px;opacity:.08}}
@media(min-width:700px){.hero{padding:38px 34px}}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--line);background:var(--card);border-radius:var(--r-m);padding:16px;box-shadow:var(--card-sh)}
.stat .n{font-family:var(--fd);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{margin-top:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3);font-weight:600}

/* list rows */
.rows{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--card);box-shadow:var(--card-sh)}
.lrow{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);transition:background .16s}
.rows .lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surf-2)}
.lrow .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:rgba(0,166,81,.14);color:var(--green-gl)}
.lrow .ic.gold{background:rgba(212,162,76,.14);color:var(--gold-br)}
.lrow .cv{width:8px;height:8px;border-radius:50%;background:var(--green-gl);flex:none}

/* grade pills scroller */
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;
  -ms-overflow-style:none;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{display:none}
.scroller>*{scroll-snap-align:start}
.gpill{padding:9px 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surf);
  font-size:14px;font-weight:600;white-space:nowrap;transition:background .18s,border-color .18s,color .18s;flex:none}
.gpill.on{background:var(--green);border-color:transparent;color:#03150B;font-weight:700;
  box-shadow:0 6px 16px -8px rgba(0,166,81,.9)}

/* skill card */
.sk{border:1px solid var(--line);border-radius:var(--r-l);background:var(--card);overflow:hidden;box-shadow:var(--card-sh);
  display:flex;flex-direction:column;transition:border-color .2s}
.sk:hover{border-color:var(--line-2)}
.sk-thumb{position:relative;aspect-ratio:16/9;background:#071A10;overflow:hidden;width:100%;display:block}
.sk-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s,opacity .3s}
.sk:hover .sk-thumb img{transform:scale(1.045)}
.sk-play{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(0deg,rgba(4,13,8,.75),rgba(4,13,8,.12))}
.sk-play .pbtn{width:48px;height:48px;border-radius:50%;background:rgba(0,166,81,.95);
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45);transition:transform .2s}
.sk:hover .pbtn{transform:scale(1.09)}
.sk-star{position:absolute;left:10px;bottom:9px;right:10px;font-size:11.5px;font-weight:600;
  color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8);display:flex;align-items:center;gap:5px}
.sk-body{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}
.cues{display:flex;flex-direction:column;gap:6px}
.cue{display:flex;gap:8px;font-size:13.5px;line-height:1.45;color:var(--tx-2)}
.cue b{color:var(--tx);font-weight:600}
.cue .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:7px;flex:none}

/* video modal */
.modal{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(2,8,5,.86);backdrop-filter:blur(8px);animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{position:relative;z-index:2;width:100%;max-width:820px;max-height:92svh;overflow:auto;
  background:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r-l);
  box-shadow:var(--sh-3);animation:sheetIn .3s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--ink-2);z-index:2}
.vframe{aspect-ratio:16/9;background:#000;width:100%}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vposter{display:grid;place-items:center;position:relative;background-size:cover;background-position:center;text-decoration:none}
.vposter::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.62))}
.vposter .pbtn{position:relative;transform:scale(1.25)}
.vposter .vnote{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:12.5px;font-weight:600;padding:0 14px}

/* session timeline */
.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:9px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--green),rgba(212,162,76,.5))}
.tl-item{position:relative;padding-bottom:14px}
.tl-item::before{content:'';position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;
  background:var(--ink);border:2.5px solid var(--green-gl)}
.tl-time{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}

/* accordion */
.acc{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surf);overflow:hidden}
.acc+.acc{margin-top:8px}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px;text-align:left}
.acc-h .cv{transition:transform .25s}
.acc.open .acc-h .cv{transform:rotate(90deg)}
.acc-b{display:none;padding:0 14px 15px;border-top:1px solid var(--line);padding-top:13px}
.acc.open .acc-b{display:block;animation:pageIn .25s}

/* challenge calendar */
/* minmax(0,1fr) or the labels force the columns wider than the screen */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cday{aspect-ratio:1/1.18;border-radius:11px;border:1px solid var(--line);background:var(--surf);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:13px;font-weight:700;transition:background .16s,border-color .16s;position:relative;padding:3px 1px;overflow:hidden}
.cday small{font-size:7.5px;font-weight:600;color:var(--tx-3);line-height:1.1;text-transform:uppercase;
  letter-spacing:.02em;width:100%;text-align:center;overflow:hidden;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cday:hover{border-color:var(--green);background:var(--surf-2)}
.cday.done{background:linear-gradient(170deg,var(--green-br),var(--green-dp));border-color:transparent;color:#03150B}
.cday.done small{color:rgba(3,21,11,.7)}
.cday.today{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,162,76,.2)}

/* progress */
.bar{height:7px;border-radius:99px;background:var(--surf-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--green),var(--green-gl));transition:width .7s cubic-bezier(.2,.8,.3,1)}

/* phase rail */
.phase{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;background:var(--surf);position:relative;overflow:hidden}
.phase.on{border-color:rgba(0,166,81,.45);background:rgba(0,166,81,.07)}
.phase .num{font-family:var(--fd);font-size:34px;line-height:1;color:var(--gold);opacity:.85}

/* upload */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-l);padding:28px 18px;text-align:center;
  background:var(--surf);transition:background .2s,border-color .2s;cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--green);background:rgba(0,166,81,.06)}
.ufile{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);
  border-radius:var(--r-m);background:var(--surf)}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);
  bottom:calc(var(--gut) + 78px + env(safe-area-inset-bottom,0px));z-index:300;
  background:var(--ink-3);border:1px solid var(--line-2);border-radius:14px;padding:13px 18px;
  box-shadow:var(--sh-3);font-size:14px;font-weight:600;max-width:calc(100vw - 32px);
  transition:transform .4s cubic-bezier(.2,.9,.3,1),opacity .25s,visibility 0s .4s;display:flex;align-items:center;gap:10px;
  opacity:0;visibility:hidden;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto;
  transition:transform .4s cubic-bezier(.2,.9,.3,1),opacity .2s}
@media(min-width:900px){#toast{bottom:calc(var(--gut) + 16px)}}

/* empty */
.empty{text-align:center;padding:44px 18px;color:var(--tx-3)}

/* print */
@media print{
  body::before,.tabbar,.topbar,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card,.panel,.rows{border-color:#bbb;background:#fff}
  .page{animation:none}
  main{padding:0}
}
</style>
</head>

<!-- ============ drawn hurley + sliotar for the strike rule ============
     Kept out of the display:none sprite: gradients inside a hidden SVG do not paint. -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">

      <stop offset="0" stop-color="#F4E0B4"/><stop offset=".45" stop-color="#DDB577"/><stop offset="1" stop-color="#A97B39"/>
    </linearGradient>
    <radialGradient id="slLeather" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F1EBDC"/><stop offset="1" stop-color="#CBBE9F"/>
    </radialGradient>

        fill="url(#hwWood)" stroke="#6B4A1C" stroke-width=".7" stroke-linejoin="round"/>
      <path d="M14.2 11l.3 9.2" stroke="#FFF6DF" stroke-opacity=".55" stroke-width=".7" stroke-linecap="round" fill="none"/>
      <path d="M13.4 22.2c-.8 3.6-.5 7.6 2.2 10.2M15.2 22.6c.4 3 1.6 5.6 3.4 7.4" stroke="#7A5424" stroke-opacity=".32" stroke-width=".55" fill="none"/>
      <path d="M19.6 26.4c3 1.2 5 3.6 3.8 5.8" stroke="#5E6461" stroke-width="2" stroke-linecap="round" fill="none"/>

         Built from m-hurley-real so it can never drift from the one that

         viewBox is trimmed to the painted bounds. -->
    <symbol id="m-crossed-real" viewBox="5.4 -3.5 41.2 36" overflow="visible">
      <g transform="rotate(-42 26 16)">

          <use href="#m-hurley-real" x="12" y="0" width="28" height="36"/>
        </g>
      </g>
    </symbol>
    <!-- sliotar: cream leather, raised rim, stitched -->
    <symbol id="m-sliotar-real" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="5.5" fill="url(#slLeather)" stroke="#8F805E" stroke-width=".5"/>

      <path d="M3.4 1.9C5.3 4 5.3 8 3.4 10.1M8.6 1.9C6.7 4 6.7 8 8.6 10.1" fill="none" stroke="#A8352B" stroke-width=".6" stroke-dasharray=".55 .8"/>
    </symbol>
  </defs>
</svg>

/* ========================================================================
   BACKEND  (Apps Script). Falls back to local codes when not configured.
   ======================================================================== */
function apiUrl(){ return S.api || CFG.apiUrl || ''; }
function apiOn(){ return !!apiUrl(); }

async function api(action, payload){
  const url = apiUrl();
  if(!url) throw new Error('offline');
  const res = await fetch(url, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   /* avoids CORS preflight */
    body: JSON.stringify(Object.assign({ action }, payload || {}))
  });
  if(!res.ok) throw new Error('http '+res.status);
  const j = await res.json();
  if(j && j.ok === false) throw new Error(j.error || 'failed');
  return j;
}

async function checkCode(code){
  code = String(code||'').trim().toUpperCase();
  if(!code) return null;
  if(apiOn()){
    try{
      const r = await api('auth', { code });
      return r.role || null;
    }catch(e){
      /* backend unreachable - fall through to local codes so the club is never locked out */
      const local = CFG.fallbackCodes[code];
      if(local) return local;
      throw e;
    }
  }
  return CFG.fallbackCodes[code] || null;
}

/* ========================================================================
   INTRO
   ======================================================================== */
function runIntro(done){
  const box = $('#intro');
  box.classList.remove('hide');
  const v = $('#introVid');

  /* ---- the way out: fade, release the video, carry on ---- */
  let closed = false, cardTimer = null;
  const finish = () => {
    if(closed) return; closed = true;
    clearTimeout(cardTimer);
    box.classList.add('out');
    S.seenIntro = true; save();
    setTimeout(()=>{
      box.classList.add('hide'); box.classList.remove('out','film');
      /* display:none does NOT stop a video decoding - without this it sits
         in the background for the whole session and eats a core */
      if(v){
        try{
          v.pause(); v.innerHTML = ''; v.removeAttribute('src');
          v.load();   /* drops it to readyState 0 and frees the decoder */
          v.pause();  /* again: load() can leave a pending play promise behind */
        }catch(e){}
      }
      done();
    }, 720);
  };

  /* ---- act two: the title card, with the club figures counting up ---- */
  let carded = false;
  const showCard = () => {
    if(carded || closed) return; carded = true;
    box.classList.remove('film');                 /* the film dims behind the card */
    $$('#counters .n').forEach(el => {
      const to = +el.dataset.to, suf = el.dataset.suffix || '', plain = el.dataset.plain === '1';
      const dur = 1500, t0 = performance.now();
      const fmt = n => plain ? String(n) : n.toLocaleString('en-IE');
      (function step(now){
        const k = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - k, 3);                      /* ease out cubic */
        el.textContent = fmt(Math.round(to * e)) + (k === 1 ? suf : '');
        if(k < 1) requestAnimationFrame(step);
      })(t0);
    });
    cardTimer = setTimeout(finish, 4200);
  };
  $('#skipIntro').onclick = finish;
  $('#skipFilm').onclick  = finish;

  /* ---- act one: the club's opening film, full screen, played once ----
     Two cuts: a portrait one for phones, a landscape one for a desktop. Pick
     by the shape of the screen, and fall back to the other if only one has
     been uploaded. If neither plays (missing, blocked, reduced motion) the
     title card simply opens on its own, as it did before. */
  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!v || calm){ showCard(); return; }

  const wide   = window.innerWidth >= window.innerHeight;
  const first  = wide ? 'intro-desktop.mp4' : 'intro-mobile.mp4';
  const second = wide ? 'intro-mobile.mp4'  : 'intro-desktop.mp4';
  box.classList.add('film');

  let rolling = false;
  const tryPlay = () => { const p = v.play(); if(p && p.catch) p.catch(()=>{ if(!rolling) showCard(); }); };
  v.addEventListener('playing', () => { rolling = true; }, { once:true });
  v.addEventListener('loadeddata', tryPlay, { once:true });
  v.addEventListener('ended', showCard);
  v.addEventListener('error', () => {
    if(v.dataset.fallback){ showCard(); return; }  /* neither cut is there */
    v.dataset.fallback = '1';
    /* the other cut is the wrong shape for this screen, so show all of it */
    v.style.objectFit = 'contain';
    v.src = second; v.load();
  });
  v.loop = false;
  v.src = first;
  /* a film that has not started within four seconds is not going to */
  setTimeout(() => { if(!rolling) showCard(); }, 4000);
}

function showGate(){

$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const inp = $('#codeIn'), msg = $('#gateMsg'), btn = $('#gateBtn');
  const code = inp.value.trim();
  if(!code) return;
  msg.textContent = ''; btn.disabled = true; btn.textContent = 'Checking...';
  try{
    const role = await checkCode(code);
    if(!role){
      inp.classList.add('bad'); setTimeout(()=>inp.classList.remove('bad'), 500);
      msg.textContent = 'That code was not recognised. Check with your child’s coach.';
    }else{
      S.role = role; S.code = code.toUpperCase(); save();
      $('#gate').classList.add('hide');
      enterApp();
    }
  }catch(err){
    msg.textContent = 'Could not reach the club server. Try again in a moment.';
  }finally{
    btn.disabled = false;
    btn.innerHTML = ic('i-lock',18,2.2)+' Sign in';
  }
});

function copyText(id){
  const t = $('#'+id).innerText;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('Copied','i-check'), ()=>toast('Could not copy'));

    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); toast('Copied','i-check'); }catch(e){ toast('Could not copy'); }
    document.body.removeChild(ta);
  }
}

<script>
/* ======================================================================
   COACH : SESSION PLANNER
   ====================================================================== */
VIEWS['coach:session'] = function(){
  const gid = S.viewGrade || S.grade, g = grade(gid);
  const mins = S.mins || 60;
  const code = S.planCode || 'hurling';

  return ''+
  sectionHead('Session planner', 'A timed plan you can stand over')+
  '<div class="card stack gap-14">'+
    '<div class="grid g-md-3">'+
      '<div><label class="lbl">Grade</label><select class="field" id="pGrade" onchange="planChange()">'+
        GRADES.map(x=>'<option value="'+x.id+'"'+(x.id===gid?' selected':'')+'>'+x.n+'</option>').join('')+'</select></div>'+
      '<div><label class="lbl">Code</label><select class="field" id="pCode" onchange="planChange()">'+
        '<option value="hurling"'+(code==='hurling'?' selected':'')+'>Hurling &amp; Camogie</option>'+
        '<option value="football"'+(code==='football'?' selected':'')+'>Gaelic &amp; Ladies Football</option>'+
        '</select></div>'+
      '<div><label class="lbl">Length</label><select class="field" id="pMins" onchange="planChange()">'+
        [45,60,75,90].map(m=>'<option value="'+m+'"'+(m===mins?' selected':'')+'>'+m+' minutes</option>').join('')+'</select></div>'+
    '</div>'+
    '<button class="btn primary wide" onclick="buildPlan()">'+ic('i-whistle',17,2.2)+' Build the session</button>'+
  '</div>'+
  '<div id="planOut" style="margin-top:18px">'+ (S.plan ? renderPlan(S.plan) : planEmpty(g)) +'</div>';
};

function planEmpty(g){
  return '<div class="card center stack gap-10" style="padding:32px 20px">'+
    '<span class="motif" style="margin:0 auto">'+ic('m-cone',38,1.5)+'</span>'+
    '<h3 class="h3">Nothing planned yet</h3>'+
    '<p class="small muted" style="max-width:420px;margin:0 auto">Pick the grade and the length above and the hub will lay out a '+
    'Phase '+g.phase+' session &mdash; arrival game, skill of the day on both sides, a conditioned game and a finish.</p></div>';
}
function planChange(){
  S.viewGrade = $('#pGrade').value; S.planCode = $('#pCode').value; S.mins = +$('#pMins').value; save();
}
function buildPlan(){
  planChange();
  const gid = S.viewGrade, g = grade(gid), mins = S.mins, code = S.planCode;
  const shape = SESSION_SHAPE[g.phase];
  const base = shape.reduce((a,b)=>a+b.p, 0);

  /* scale the standard shape to the chosen length, rounded to 5 minutes */
  let blocks = shape.map(b => ({ t:b.t, d:b.d, p: Math.max(5, Math.round(b.p * mins / base / 5) * 5) }));
  let total = blocks.reduce((a,b)=>a+b.p,0);
  /* trim or pad the biggest block so the total lands exactly on the target */
  if(total !== mins){
    const big = blocks.reduce((a,b)=> b.p > a.p ? b : a, blocks[0]);
    big.p = Math.max(5, big.p + (mins - total));
  }

  const pool  = skillsFor(gid, code);
  const both  = pool.filter(s => s.both);
  const pick  = (both.length ? both : pool)[Math.floor(Math.random() * (both.length ? both.length : pool.length))] || pool[0];
  const games = GAMES.filter(x => x.grades.includes(gid));
  const game  = games[Math.floor(Math.random() * games.length)] || GAMES[0];

  S.plan = { gid, code, mins, blocks, skill: pick ? pick.id : null, game: game.id, at: Date.now() };
  save();
  $('#planOut').innerHTML = renderPlan(S.plan);
  $('#planOut').scrollIntoView({ behavior:'smooth', block:'start' });
}

function renderPlan(p){
  const g = grade(p.gid), sk = p.skill ? skill(p.skill) : null, gm = byId(GAMES, p.game);
  let t = 0;

  const rows = p.blocks.map(b => {
    const from = t; t += b.p;
    const isSkill = /skill of the day|technical/i.test(b.t);
    const isGame  = /conditioned game|principles game|^game$|small sided/i.test(b.t);
    return '<div class="tl-item">'+
      '<div class="tl-time">'+from+'&ndash;'+t+' min</div>'+
      '<div class="h4" style="margin:2px 0 3px">'+b.t+'</div>'+
      '<p class="small muted">'+b.d+'</p>'+
      (isSkill && sk ? '<button class="panel card-btn" style="margin-top:9px;width:100%;text-align:left" onclick="playSkill(\''+sk.id+'\')">'+
          '<div class="row gap-10"><span style="color:var(--green-gl)">'+ic('i-play',17,2.2)+'</span>'+
          '<span class="grow"><b class="small" style="display:block">'+sk.n+'</b>'+
          '<span class="tiny dim">'+(sk.star||'')+(sk.both?' &middot; both sides, every rep':'')+'</span></span>'+
          '<span class="dim">'+ic('i-chev',14,2.4)+'</span></div></button>' : '')+
      (isGame && gm ? '<button class="panel card-btn" style="margin-top:9px;width:100%;text-align:left" onclick="openGame(\''+gm.id+'\')">'+
          '<div class="row gap-10"><span style="color:var(--gold)">'+ic('i-whistle',17,2.2)+'</span>'+
          '<span class="grow"><b class="small" style="display:block">'+gm.n+'</b>'+
          '<span class="tiny dim">'+gm.rules.length+' constraints &middot; tap for the setup</span></span>'+
          '<span class="dim">'+ic('i-chev',14,2.4)+'</span></div></button>' : '')+
    '</div>';
  }).join('');

  return '<div class="card glow">'+
    '<div class="row between gap-10" style="margin-bottom:4px">'+
      '<div><div class="eyebrow gold">Session plan</div>'+
        '<h2 class="h2" style="margin-top:3px">'+g.n+' &middot; '+(p.code==='hurling'?'Hurling':'Football')+'</h2>'+
        '<p class="small muted">'+p.mins+' minutes &middot; Phase '+g.phase+'</p></div>'+
      '<span class="motif">'+ic(p.code==='hurling'?'m-hurley':'m-football',34,1.5)+'</span>'+
    '</div>'+
    '<hr class="hair" style="margin:14px 0 18px">'+
    '<div class="tl">'+rows+'</div>'+
    '<div class="panel" style="margin-top:6px"><div class="row gap-10 row-t">'+
      '<span style="color:var(--gold)">'+ic('i-star',17,2.2)+'</span>'+
      '<div><b class="small">Before you leave the pitch</b>'+
      '<p class="small muted" style="margin-top:4px">Tell them the one thing to practise this week, and say it again to the parents at the gate. '+
      'That single sentence is what turns a session into progress.</p></div></div></div>'+
    '<div class="row gap-8 wrapf noprint" style="margin-top:14px">'+
      '<button class="btn sm primary" onclick="window.print()">'+ic('i-print',15,2.2)+' Print</button>'+
      '<button class="btn sm" onclick="buildPlan()">'+ic('i-refresh',15,2.2)+' Shuffle</button>'+
      '<button class="btn sm ghost" onclick="openToolbox()">Adjust the games</button>'+
    '</div>'+
  '</div>';
}

   GAMES + TOOLBOX
   ====================================================================== */

function openUpload(){
  openModal('Upload a clip', 'Goes to a private club folder',
   '<div style="padding:16px" class="stack gap-14">'+
     '<p class="small muted">Send a short video to the club &mdash; a skill demo for the group, or a clip of your own child for their coach to look at. '+
     'It goes straight into a private Google Drive folder that only club coaches can open. It is never posted anywhere.</p>'+
     '<label class="drop" id="drop">'+
       '<input type="file" id="vfile" accept="video/*,image/*" style="display:none">'+
       '<span class="motif" style="display:block;margin:0 auto 10px">'+ic('i-upload',30,1.8)+'</span>'+
       '<b class="small" style="display:block">Choose a video</b>'+
       '<span class="tiny dim">Up to 25 MB. Longer clips: trim on the phone first.</span>'+
     '</label>'+
     '<div id="fileBox"></div>'+
     '<div><label class="lbl">Grade</label><select class="field" id="uGrade">'+
       GRADES.map(x=>'<option value="'+x.id+'"'+(x.id===S.grade?' selected':'')+'>'+x.n+'</option>').join('')+'</select></div>'+
     '<div><label class="lbl">Who is it from / what is it</label>'+
       '<input class="field" id="uNote" placeholder="e.g. Sean, jab lift on the left" maxlength="120"></div>'+
     '<label class="row gap-10 row-t" style="cursor:pointer">'+
       '<input type="checkbox" id="uOk" style="width:20px;height:20px;margin-top:2px;accent-color:var(--green)">'+
       '<span class="small muted">I am the parent or guardian of any child in this clip, or I am a club coach sending a coaching clip, '+
       'and I am happy for club coaches to view it.</span></label>'+
     '<button class="btn primary wide" id="upBtn" onclick="doUpload()">'+ic('i-upload',16,2.2)+' Send to the club</button>'+
     '<p class="tiny dim" id="upMsg"></p>'+
   '</div>');

  const input = $('#vfile'), drop = $('#drop');
  input.onchange = () => showFile(input.files[0]);
  ['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', ev => {
    const f = ev.dataTransfer.files[0];
    if(f){ input.files = ev.dataTransfer.files; showFile(f); }
  });
}
let UP_FILE = null;
function showFile(f){
  UP_FILE = f || null;
  const box = $('#fileBox'); if(!box) return;
  if(!f){ box.innerHTML = ''; return; }
  const mb = (f.size/1048576).toFixed(1);
  const big = f.size > 25*1048576;
  box.innerHTML = '<div class="ufile">'+
    '<span style="color:'+(big?'var(--danger)':'var(--green-gl)')+'">'+ic(big?'i-info':'i-check',20,2.2)+'</span>'+
    '<span class="grow"><b class="small" style="display:block">'+esc(f.name)+'</b>'+
    '<span class="tiny '+(big?'':'dim')+'" style="'+(big?'color:var(--danger)':'')+'">'+mb+' MB'+(big?' — too big, trim it first':'')+'</span></span></div>';
}
async function doUpload(){
  const btn = $('#upBtn'), msg = $('#upMsg');
  if(!UP_FILE){ msg.textContent = 'Choose a video first.'; return; }
  if(UP_FILE.size > 25*1048576){ msg.textContent = 'That file is over 25 MB. Trim it on your phone and try again.'; return; }
  if(!$('#uOk').checked){ msg.textContent = 'Please tick the consent box.'; return; }
  if(!apiOn()){ msg.textContent = 'No club server is connected on this device yet. Ask the club admin to finish setup.'; return; }

  btn.disabled = true; btn.textContent = 'Uploading...'; msg.textContent = 'Do not close this window.';
  try{
    const data = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload  = () => res(String(fr.result).split(',')[1]);
      fr.onerror = rej;
      fr.readAsDataURL(UP_FILE);
    });
    await api('upload', {
      code: S.code, role: S.role, grade: $('#uGrade').value,
      note: $('#uNote').value, name: UP_FILE.name, mime: UP_FILE.type || 'video/mp4', data
    });
    closeModal(); toast('Sent to the club', 'i-check');
  }catch(e){
    msg.textContent = 'Upload failed. Check the connection and try again.';
    btn.disabled = false; btn.innerHTML = ic('i-upload',16,2.2)+' Send to the club';
  }
}

/* Views are self-wiring via inline handlers. The one thing that needs a hook
   is the strike rule under each section heading: swing it the first time that
   heading comes into view, once, then stop watching it. */
function afterRender(){
  const els = $$('.strike:not(.go):not(.done)');
  if(!els.length) return;

  const still = !('IntersectionObserver' in window) ||
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(still){ els.forEach(e => e.classList.add('done')); return; }

  if(!afterRender._io){
    afterRender._io = new IntersectionObserver((rows, obs) => {
      rows.forEach(r => {
        if(!r.isIntersecting) return;
        r.target.classList.add('go');
        obs.unobserve(r.target);
      });
    }, { threshold:.2 });
  }
  els.forEach(e => afterRender._io.observe(e));
}

<script>
/* ==========================================================================

   Same app as index.html, with the code gate removed so the club can click

const DEMO = true;

function demoPlan(){
  const gid = 'u9', code = 'hurling', mins = 60, g = grade(gid);
  const shape = SESSION_SHAPE[g.phase], base = shape.reduce((a,b)=>a+b.p, 0);
  const blocks = shape.map(b => ({ t:b.t, d:b.d, p: Math.max(5, Math.round(b.p*mins/base/5)*5) }));
  const tot = blocks.reduce((a,b)=>a+b.p, 0);
  if(tot !== mins){
    const big = blocks.reduce((a,b)=> b.p > a.p ? b : a, blocks[0]);
    big.p = Math.max(5, big.p + (mins - tot));
  }
  return { gid, code, mins, blocks, skill:'h-both', game:'g8', at:Date.now() };
}

function seedDemo(){
  S.role      = S.demoRole || 'coach';
  S.code      = 'DEMO';
  S.grade     = 'u9';
  S.lastGrade = 'u8';          /* so the "you moved up" card is on show */
  S.viewGrade = null;
  S.api       = '';            /* the demo never talks to a backend */
  if(!S.may || !S.may.length) S.may = [1,2,3,4,5,8,9,10,12,15,16,19];
  if(!S.plan) S.plan = demoPlan();
  save();
}

/* header: DEMO tag, role switcher, one line of explanation */
function demoChrome(){
  let bar = document.getElementById('demoBar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'demoBar'; bar.className = 'demo-bar';
    bar.innerHTML =
      '<div class="demo-in">'+
