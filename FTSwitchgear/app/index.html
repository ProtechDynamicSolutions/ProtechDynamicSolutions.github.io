<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FT Inspections</title>
<meta name="description" content="FT Switchgear inspections: checklists, photos, notes and PDF reports on the phone.">
<meta name="theme-color" content="#0e1c2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FT Inspections">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* FT Switchgear Inspections. Colours and type from the FT Switchgear design system.
   Built for someone who is not comfortable on a phone: big words, big targets, one job per screen. */
:root{
  --surface:#f3f4f5;--raised:#ffffff;--panel:#0e1c2b;--panel-2:#162a3f;--on-panel:#ffffff;--on-panel-muted:#aab6c2;
  --ink:#0e1c2b;--muted:#56636f;--line:#d3d9df;--line-strong:#7d8a96;
  --signal:#f2a900;--on-signal:#0e1c2b;--copper:#b35c24;
  --action:#0e1c2b;--on-action:#ffffff;--action-hover:#23384f;--focus:#0b5cad;
  --safe:#1c6b50;--fault:#b3261e;--idle:#56636f;--on-status:#ffffff;
  --safe-tint:#e2efe9;--fault-tint:#f8e4e2;--signal-tint:#fdf0d2;
  --shadow:0 1px 2px rgba(14,28,43,.08),0 4px 12px rgba(14,28,43,.06);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --sans:Barlow,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --bar-h:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --surface:#0b1621;--raised:#13212f;--panel:#07111b;--panel-2:#13243a;
  --ink:#eef1f4;--muted:#a3b0bc;--line:#2a3b4d;--line-strong:#6c7d8e;
  --signal:#f5b82e;--copper:#d9824a;--action:#f5b82e;--on-action:#0e1c2b;--action-hover:#ffc94d;--focus:#7fb8ff;
  --safe:#5cc39a;--fault:#ff8a80;--idle:#a3b0bc;--on-status:#0e1c2b;
  --safe-tint:#12352a;--fault-tint:#3d1c1a;--signal-tint:#3a2d0c;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;
  --surface:#0b1621;--raised:#13212f;--panel:#07111b;--panel-2:#13243a;
  --ink:#eef1f4;--muted:#a3b0bc;--line:#2a3b4d;--line-strong:#6c7d8e;
  --signal:#f5b82e;--copper:#d9824a;--action:#f5b82e;--on-action:#0e1c2b;--action-hover:#ffc94d;--focus:#7fb8ff;
  --safe:#5cc39a;--fault:#ff8a80;--idle:#a3b0bc;--on-status:#0e1c2b;
  --safe-tint:#12352a;--fault-tint:#3d1c1a;--signal-tint:#3a2d0c;--shadow:0 1px 2px rgba(0,0,0,.4)}

html{font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-size="l"]{font-size:20px}
html[data-size="xl"]{font-size:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:400 1rem/1.5 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
svg.i{width:1.3rem;height:1.3rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--panel);color:var(--on-panel);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:64px;padding:0 12px}
.top .back{display:inline-flex;align-items:center;gap:2px;min-height:48px;padding:0 12px 0 4px;border:0;border-radius:6px;background:transparent;color:var(--on-panel);font-weight:600;font-size:1.05rem}
.top .back:active{background:rgba(255,255,255,.12)}
.top .brand{display:flex;align-items:center;gap:10px;padding-left:4px}
.top .brand svg{width:38px;height:38px;flex:none}
.top-t{flex:1;min-width:0}
.top-t b{display:block;font:700 1.3rem/1.1 var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t small{display:block;font-size:.8rem;line-height:1.2;color:var(--on-panel-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tool{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;border:1.5px solid rgba(255,255,255,.35);border-radius:6px;background:transparent;color:var(--on-panel);font-weight:600;font-size:.95rem}
.prog{height:6px;background:rgba(255,255,255,.14)}
.prog i{display:block;height:100%;background:var(--signal);transition:width .25s}

/* ---------- page ---------- */
.page{max-width:640px;margin:0 auto;padding:20px 16px calc(var(--bar-h) + 40px);display:flex;flex-direction:column;gap:20px}
.h1{font:700 2rem/1.05 var(--display);letter-spacing:.005em}
.lead{margin:0;color:var(--muted);font-size:1.02rem}
.label{font:600 .72rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.label.copper{color:var(--copper)}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.center{text-align:center}
.small{font-size:.85rem;line-height:1.4}
hr.rule{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
[hidden]{display:none!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile .grow{flex:1;min-width:0}
.btn.mini{min-height:46px;font-size:.92rem;padding:6px 10px}
.edit-item{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:10px 18px;border-radius:8px;border:2px solid transparent;font-weight:600;font-size:1.1rem;line-height:1.2;text-align:center;text-decoration:none}
.btn.big{min-height:72px;font-size:1.2rem}
.btn svg.i{width:1.5rem;height:1.5rem}
.btn-primary{background:var(--action);color:var(--on-action)}
.btn-primary:active{background:var(--action-hover)}
.btn-signal{background:var(--signal);color:var(--on-signal)}
.btn-secondary{background:var(--raised);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:active{background:var(--surface)}
.btn-danger{background:var(--raised);color:var(--fault);border-color:var(--fault)}
.btn-quiet{background:transparent;color:var(--ink);border-color:transparent;min-height:52px;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.btn[disabled]{opacity:.45}
.btn-row{display:flex;gap:12px}
.btn-row>.btn{flex:1}

/* bottom action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--raised);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(14,28,43,.08)}
.bar-in{max-width:608px;margin:0 auto;display:flex;gap:12px}
.bar-in>.btn{flex:1}
.bar-in>.btn.narrow{flex:0 0 auto;width:auto;padding:10px 16px}

/* ---------- cards and lists ---------- */
.card{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.hi{border:2px solid var(--signal);box-shadow:var(--shadow)}
.card h2{font:700 1.45rem/1.1 var(--display)}
.list{display:flex;flex-direction:column;background:var(--raised);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 14px 12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface)}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row b{font-weight:600;font-size:1.05rem;line-height:1.3;overflow-wrap:anywhere}
.row small{color:var(--muted);font-size:.85rem;line-height:1.35;overflow-wrap:anywhere}
.row .chev{color:var(--muted)}
.row small .mono{white-space:nowrap}
.row .ico{display:grid;place-items:center;width:48px;height:48px;border-radius:8px;background:var(--panel);color:var(--signal);flex:none}
.row .ico svg.i{width:1.6rem;height:1.6rem}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.sec-t h2{font:700 1.45rem/1.1 var(--display)}

/* status badge, always colour plus a word */
.badge{display:inline-flex;align-items:center;gap:6px;font:600 .68rem/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:3px;white-space:nowrap;flex:none}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.safe{background:var(--safe);color:var(--on-status)}
.badge.fault{background:var(--fault);color:var(--on-status)}
.badge.live{background:var(--signal);color:var(--on-signal)}
.badge.idle{background:var(--idle);color:var(--on-status)}

.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--signal)}

/* ---------- forms ---------- */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font:600 .95rem/1.3 var(--sans);color:var(--ink)}
.fld label em{font-style:normal;font-weight:400;color:var(--muted)}
.in{width:100%;min-height:56px;padding:12px 14px;border:2px solid var(--line-strong);border-radius:6px;background:var(--raised);color:var(--ink);font-size:1.05rem}
textarea.in{min-height:140px;line-height:1.45;resize:vertical}
.in:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.help{font-size:.85rem;color:var(--muted)}
details.more{border:1px solid var(--line);border-radius:8px;background:var(--raised)}
details.more summary{min-height:56px;display:flex;align-items:center;padding:0 16px;font-weight:600;cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";margin-left:auto;font-size:1.4rem;color:var(--muted)}
details.more[open] summary::after{content:"\2212"}
details.more .stack{padding:0 16px 16px}
.seg{display:flex;border:2px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:52px;border:0;border-right:1px solid var(--line);background:var(--raised);font-weight:600}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--action);color:var(--on-action)}

/* ---------- the check screen ---------- */
.q-sec{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q-text{font:600 1.45rem/1.3 var(--sans);margin:0;overflow-wrap:anywhere}
.q-hint{margin:0;color:var(--muted);font-size:1rem}
.answers{display:flex;flex-direction:column;gap:12px}
.ans{display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:10px 16px;border-radius:10px;border:2px solid var(--line-strong);background:var(--raised);color:var(--ink);font-weight:700;font-size:1.3rem;text-align:left}
.ans .dot{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;flex:none;color:var(--on-status)}
.ans .dot svg.i{width:1.6rem;height:1.6rem;stroke-width:2.6}
.ans small{display:block;font-weight:400;font-size:.85rem;color:var(--muted);line-height:1.3}
.ans.ok .dot{background:var(--safe)} .ans.fault .dot{background:var(--fault)} .ans.na .dot{background:var(--idle)}
.ans.on.ok{background:var(--safe);border-color:var(--safe);color:var(--on-status)}
.ans.on.fault{background:var(--fault);border-color:var(--fault);color:var(--on-status)}
.ans.on.na{background:var(--idle);border-color:var(--idle);color:var(--on-status)}
.ans.on small{color:inherit;opacity:.9}
.ans.on .dot{background:rgba(255,255,255,.22)}
.problem{background:var(--fault-tint);border:2px solid var(--fault);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.problem h3{font:700 1.3rem/1.15 var(--display);color:var(--ink)}
.sev{display:flex;flex-direction:column;gap:8px}
.sev button{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border:2px solid var(--line-strong);border-radius:8px;background:var(--raised);color:var(--ink);font-weight:600;text-align:left}
.sev button i{width:14px;height:14px;border-radius:50%;flex:none}
.sev button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.sev button.on::after{content:"Chosen";margin-left:auto;font:600 .68rem/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.note-box{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;width:100%;color:var(--ink);font-size:1rem}
.note-box .label{display:block;margin-bottom:4px}

/* photos */
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--line);border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:6px;bottom:6px;background:rgba(14,28,43,.8);color:#fff;font-size:.7rem;font-weight:600;padding:2px 6px;border-radius:3px}
.gallery-link{align-self:center}

/* overview list of checks */
.chk{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink)}
.chk:last-child{border-bottom:0}
.chk .st{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;flex:none;border:2px dashed var(--line-strong);color:var(--muted);font-weight:700;font-size:.8rem}
.chk .st svg.i{width:1.2rem;height:1.2rem;stroke-width:2.6}
.chk .st.ok{background:var(--safe);border:0;color:var(--on-status)}
.chk .st.fault{background:var(--fault);border:0;color:var(--on-status)}
.chk .st.na{background:var(--idle);border:0;color:var(--on-status)}
.chk .grow{flex:1;min-width:0}
.chk .grow b{display:block;font-weight:600;font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.chk .grow small{color:var(--muted);font-size:.8rem}
.chk.here{background:var(--signal-tint)}
.group-t{padding:14px 16px 6px;background:var(--surface);border-bottom:1px solid var(--line)}

/* survey: the room card, quick-pick chips */
.room-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);color:var(--on-panel);border-radius:10px;padding:16px 16px 16px 18px}
.room-card .grow{flex:1;min-width:140px;display:flex;flex-direction:column;gap:2px}
.room-card .label{color:var(--signal)}
.room-card b{font:700 1.6rem/1.1 var(--display);overflow-wrap:anywhere}
.room-card .btn{width:auto;flex:0 0 auto;background:transparent;color:var(--on-panel);border-color:rgba(255,255,255,.45);min-height:52px}
.room-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--line-strong);background:var(--raised);color:var(--ink);font-weight:600;font-size:1rem}
.chip:active{background:var(--signal-tint);border-color:var(--signal)}
.linkish{border:0;background:none;padding:6px 2px;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.big-in{font-size:1.2rem;min-height:60px}

/* the office sheet: one quiet line that says whether everything has reached it */
.sync{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 14px;border-radius:24px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-size:.9rem;font-weight:600;text-align:left}
.sync i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--safe)}
.sync.wait i{background:var(--signal)}
.sync.busy i{background:var(--signal);animation:pulse 1s ease-in-out infinite}
.office{display:flex;align-items:center;gap:10px;margin:0;font-size:.9rem;color:var(--muted)}
.office i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--signal)}
.office.ok i{background:var(--safe)}
.pin-in{font-size:1.25rem;letter-spacing:.08em}
.pin-in::placeholder{font-family:var(--sans);font-size:1rem;letter-spacing:0}

/* result summary */
.result{border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--on-status)}
.result.safe{background:var(--safe)} .result.fault{background:var(--fault)} .result.live{background:var(--signal);color:var(--on-signal)}
.result b{font:700 1.7rem/1.1 var(--display)}
.result span{font-size:.95rem;opacity:.95}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.9rem}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* signature */
.sig-wrap{position:relative;background:#fff;border:2px dashed var(--line-strong);border-radius:10px;touch-action:none}
.sig-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:3/1;touch-action:none}
.sig-wrap .sig-line{position:absolute;left:16px;right:16px;bottom:26%;border-bottom:1.5px solid #c8cfd6;pointer-events:none}
.sig-wrap .sig-x{position:absolute;left:18px;bottom:28%;color:#7d8a96;font-weight:700;pointer-events:none}

/* tiles for choosing a checklist */
.tile{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;padding:14px 16px;border-radius:10px;border:2px solid var(--line);background:var(--raised);color:var(--ink);text-align:left}
.tile:active{border-color:var(--ink)}
.tile .ico{display:grid;place-items:center;width:56px;height:56px;border-radius:10px;background:var(--panel);color:var(--signal);flex:none}
.tile .ico svg.i{width:1.9rem;height:1.9rem}
.tile b{display:block;font:700 1.35rem/1.1 var(--display)}
.tile small{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;z-index:65;background:rgba(7,17,27,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--raised);color:var(--ink);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font:700 1.6rem/1.1 var(--display)}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:16px}}
.viewer{position:fixed;inset:0;z-index:60;background:#05090d;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.viewer .stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px;position:relative}
.viewer .stage img,.viewer .stage canvas{max-width:100%;max-height:100%;object-fit:contain;display:block;touch-action:none}
.viewer .vbar{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#0e1c2b}
.viewer .vbar .btn{flex:1;min-height:56px;font-size:1rem}
.viewer .vbar .btn-secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.viewer .vbar .btn-danger{background:transparent;color:#ff8a80;border-color:#ff8a80}
.viewer .vtop{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;color:#fff;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:30px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;pointer-events:none;animation:toast 2.6s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.busy{position:fixed;inset:0;z-index:80;background:rgba(7,17,27,.55);display:grid;place-items:center}
.busy div{background:var(--raised);color:var(--ink);padding:24px 28px;border-radius:12px;font-weight:600;display:flex;align-items:center;gap:14px;max-width:80%}
.spin{width:28px;height:28px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--signal);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.listening{display:flex;align-items:center;gap:10px;color:var(--fault);font-weight:600}
.listening::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--fault);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.banner{background:var(--signal-tint);border:1px solid var(--signal);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.banner.warn{background:var(--fault-tint);border-color:var(--fault)}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:var(--muted);font-size:.8rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* screen changes: a short slide in the direction of travel. The clip stops the sliding screen
   making the page wider than the phone, which makes mobile browsers zoom the whole app out. */
body{overflow-x:hidden}
#app{overflow-x:clip}
@keyframes inFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.page.in-fwd{animation:inFwd .26s cubic-bezier(.3,.7,.2,1) both}
.page.in-back{animation:inBack .26s cubic-bezier(.3,.7,.2,1) both}
.prog i{transition:width .45s cubic-bezier(.3,.7,.2,1)}
/* an answer lands like a switch closing */
@keyframes clunk{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes press{0%{transform:scale(.985)}100%{transform:none}}
.ans.just{animation:press .22s ease-out}
.ans.just .dot{animation:clunk .3s cubic-bezier(.3,.7,.2,1)}
.ans{transition:background .15s,border-color .15s,color .15s}
.veil{animation:fade .2s ease-out}.sheet{animation:up .28s cubic-bezier(.3,.7,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function joinText(a, b) {
  a = (a || '').replace(/\s+$/, ''); b = (b || '').trim();
  if (!b) return a;
  if (!a) return b.charAt(0).toUpperCase() + b.slice(1);
  return a + (/[.!?]$/.test(a) ? ' ' + b.charAt(0).toUpperCase() + b.slice(1) : ' ' + b);
}
// Voice typing into a text box. onState(true/false) lets the caller show Listening and a Stop button.
function talker(box, onState) {
  var rec = null, on = false;
  function stop() { if (rec) { try { rec.stop(); } catch (e) {} } }
  function start() {
    rec = new SR();
    rec.lang = 'en-IE'; rec.continuous = true; rec.interimResults = true;
    var base = box.value;
    rec.onresult = function (e) {
      var fin = '', mid = '';
      for (var i = 0; i < e.results.length; i++) {
        var t = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) fin = joinText(fin, t); else mid = joinText(mid, t);
      }
      box.value = joinText(base, joinText(fin, mid));
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('The phone would not let the app listen. Use the microphone on the keyboard instead.');
      else if (e.error === 'no-speech') toast('Nothing heard. Tap Speak and try again.');
      else if (e.error !== 'aborted') toast('Voice typing stopped. Use the microphone on the keyboard instead.');
    };
    rec.onend = function () { on = false; rec = null; onState(false); };
    try { rec.start(); on = true; onState(true); } catch (err) { onState(false); toast('Voice typing is not available here. Use the microphone on the keyboard.'); }
  }
  return { toggle: function () { if (on) stop(); else start(); }, stop: stop };
}
function noteSheet(o) {
  var html = '<h2>' + esc(o.title) + '</h2>' +
    '<textarea class="in" id="nt" style="font-size:1.15rem;min-height:170px" placeholder="' + esc(o.placeholder || '') + '">' + esc(o.value || '') + '</textarea>' +
    (SR ? '<button class="btn btn-secondary" data-k="talk">' + icon('mic') + '<span id="nt-b">Speak instead of typing</span></button><div class="listening" id="nt-l" hidden>Listening. Speak now, then tap Stop.</div>'
      : '<p class="help">To talk instead of typing, tap the microphone on your keyboard.</p>') +
    '<div class="btn-row"><button class="btn btn-secondary" data-k="cancel">Cancel</button><button class="btn btn-primary" data-k="save">' + esc(o.saveWord || 'Save note') + '</button></div>' +
    (o.value && !o.keep ? '<button class="btn btn-quiet" data-k="clear">Delete this note</button>' : '');
  var tk = null, v = sheet(html, function () { if (tk) tk.stop(); }), ta = $('#nt', v);
  if (!SR) setTimeout(function () { ta.focus(); }, 80);
  else tk = talker(ta, function (on) {
    var l = $('#nt-l', v), b = $('#nt-b', v);
    if (l) l.hidden = !on;
    if (b) b.textContent = on ? 'Stop' : 'Speak instead of typing';
  });
  v.addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]'); if (!b) return;

    if (k === 'cancel') closeOverlay(v);
    if (k === 'save') { if (tk) tk.stop(); var t = ta.value.trim(); closeOverlay(v); o.onSave(t); }
    if (k === 'clear') { if (tk) tk.stop(); closeOverlay(v); o.onSave(''); }
  });
}

function sigPad(insp) {
  var cv = $('#sig'), g = cv.getContext('2d'), strokes = insp.sign.strokes || (insp.sign.strokes = []), cur = null;
  function paint() {
    g.clearRect(0, 0, cv.width, cv.height);
    g.strokeStyle = '#0e1c2b'; g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round';
    strokes.forEach(function (st) {
      g.beginPath(); g.moveTo(st[0][0] * cv.width, st[0][1] * cv.height);
      for (var i = 1; i < st.length; i++) g.lineTo(st[i][0] * cv.width, st[i][1] * cv.height);
      if (st.length === 1) g.lineTo(st[0][0] * cv.width + 0.5, st[0][1] * cv.height);
      g.stroke();
    });
  }
  function pt(e) { var r = cv.getBoundingClientRect(); return [Math.round(1e4 * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))) / 1e4, Math.round(1e4 * Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))) / 1e4]; }

  paint();
}

// Runs fn(c) with the PDF, waiting for it if needed. Sharing needs a fresh tap, so a long wait asks for another tap.
function withPdf(fn, needsTap) {
  var insp = curInsp(), c = PDFC[insp.id], t0 = Date.now();
  if (c && c.blob && c.v === insp.updated) return fn(insp, c, false);
  var stop = busy('Getting the report ready');
  preparePdf(insp).then(function (c) {
    stop();
    if (needsTap && Date.now() - t0 > 3500) toast('The report is ready. Tap the button again.');
    else fn(insp, c, true);
  }, function (e) { stop(); toast(e.message || 'The report could not be made.'); });
}
ACT.share = function () {
  withPdf(function (insp, c, late) {
    var file;
    try { file = new File([c.blob], c.name, { type: 'application/pdf' }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: c.name.replace(/\.pdf$/i, '') }).then(function () {
        insp.shared = Date.now(); saveInsp(insp, true); rerender(); toast('Report sent');
      }, function (e) {
        if (e && e.name === 'AbortError') return;
        if (late && e && e.name === 'NotAllowedError') { toast('The report is ready. Tap Send the report again.'); return; }
        saveFile(c.blob, c.name); toast('Saved to Downloads instead. Attach it to an email.');
      });
    } else { saveFile(c.blob, c.name); toast('Saved to Downloads. Attach it to an email or WhatsApp.'); }

};

// ---------- backup ----------
function blobToB64(b) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(b); });
}
function b64ToBlob(s, type) {
  var bin = atob(s), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: type || 'image/jpeg' });
}
ACT.backup = function () {
  var stop = busy('Making the backup');
  DB.all('photos').then(function (ps) {
    return ps.reduce(function (p, ph) {
      return p.then(function (arr) { return blobToB64(ph.blob).then(function (d) { arr.push({ id: ph.id, w: ph.w, h: ph.h, at: ph.at, insp: ph.insp, drawn: ph.drawn, demo: ph.demo, data: d }); return arr; }); });
    }, Promise.resolve([]));
  }).then(function (photos) {
    var d = new Date(), stamp = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    var out = { app: 'ft-inspections', v: 1, at: Date.now(), settings: S.settings, sites: S.sites, templates: S.templates, equipment: S.equipment, insps: S.insps, photos: photos };
    stop();
    saveFile(new Blob([JSON.stringify(out)], { type: 'application/json' }), 'FT-Inspections-backup-' + stamp + '.json');
    S.settings.lastBackup = Date.now(); saveKV('settings');
    toast('Backup saved to Downloads');
  }).catch(function () { stop(); toast('The backup could not be made.'); });
};
ACT.restore = function () {
  $$('input[data-cap]').forEach(function (x) { x.remove(); });
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json'; inp.setAttribute('data-cap', '1'); inp.style.cssText = 'position:fixed;left:-999px;opacity:0';
  document.body.appendChild(inp);
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    f.text().then(function (txt) {
      var b = JSON.parse(txt);
      if (!b || b.app !== 'ft-inspections' || !Array.isArray(b.insps)) throw new Error('bad');
      var fin = b.insps.filter(function (i) { return i.status !== 'draft'; }).length;
      return ask({ title: 'Load this backup?', text: 'It was saved ' + fmtDate(b.at) + ' and has ' + plural(fin, 'report') + ' and ' + plural((b.sites || []).length, 'site') + '. Nothing on this phone is removed. Where both have the same inspection, the newer one is kept.', yes: 'Load the backup', no: 'Cancel' })
        .then(function (y) { if (y) return mergeBackup(b); });
    }).catch(function () { toast('That file is not an FT Inspections backup.'); });
  });
  inp.click();
};
function mergeBackup(b) {
  var stop = busy('Loading the backup');
  function union(mine, theirs) {
    var ids = {}; mine.forEach(function (x) { ids[x.id] = 1; });
    (theirs || []).forEach(function (x) { if (!ids[x.id]) mine.push(x); });
  }
  union(S.sites, b.sites); union(S.templates, b.templates); union(S.equipment, b.equipment);
  var added = 0;
  (b.insps || []).forEach(function (x) {
    var m = inspById(x.id);
    if (!m) { S.insps.push(x); added++; DB.put('insp', x); }
    else if ((x.updated || 0) > (m.updated || 0)) { S.insps[S.insps.indexOf(m)] = x; DB.put('insp', x); added++; }
  });
  if (b.settings && b.settings.prefix === S.settings.prefix && b.settings.next > S.settings.next) S.settings.next = b.settings.next;
  if (!S.settings.inspector && b.settings) S.settings.inspector = b.settings.inspector || '';
  return (b.photos || []).reduce(function (p, ph) {
    return p.then(function () { return DB.one('photos', ph.id).then(function (have) { if (!have) return DB.put('photos', { id: ph.id, w: ph.w, h: ph.h, at: ph.at, insp: ph.insp, drawn: ph.drawn, demo: ph.demo, blob: b64ToBlob(ph.data) }).then(function () { if (!ph.demo) queuePhoto(ph.id); }); }); });
  }, Promise.resolve()).then(function () {
    return Promise.all([saveKV('sites'), saveKV('templates'), saveKV('equipment'), saveKV('settings')]);
  }).then(function () { stop(); toast('Backup loaded: ' + plural(added, 'inspection') + ' added or updated'); rerender(); })
    .catch(function () { stop(); toast('Part of the backup could not be loaded.'); });
}

function roomsOf(insp) {

  (insp.items || []).forEach(function (it) { if (it.sec && !out.some(function (r) { return sameText(r, it.sec); })) out.push(it.sec); });
  if (insp.freeform && insp.room && !out.some(function (r) { return sameText(r, insp.room); })) out.push(insp.room);
  return out;
}

function startSurvey(t, site) {

    .sort(function (a, b) { return (b.finished || 0) - (a.finished || 0); })[0];
  function create(copy) {
    var insp = { id: 'i' + uid(), siteId: site.id, tplId: t.id, tplName: t.name, title: t.reportTitle || 'Survey report', thing: 'area', freeform: true,
      items: [], ans: {}, room: '', equip: { name: '', location: '', make: '', rating: '', serial: '', plate: [] }, general: { note: '', photos: [] },
      status: 'draft', created: Date.now(), updated: Date.now(), pos: 0, by: CONN ? { email: CONN.email, name: CONN.name } : undefined };
    if (site.demo) delete site.demo;
    // last time's rooms and items come across; the answers never do
    if (copy) {
      insp.items = prev.items.map(function (it) { return { id: 'x' + uid(), sec: it.sec, q: it.q, hint: '', custom: true }; });
      insp.room = insp.items[0].sec; insp.fromPrev = prev.id;
    }
    S.insps.push(insp); site.lastUsed = Date.now(); saveKV('sites'); saveInsp(insp);
    go('survey', { id: insp.id });
  }
  if (!prev) return create(false);
  ask({ title: 'Use the list from last time?', text: 'The survey here on ' + fmtDate(prev.created) + ' had ' + plural(prev.items.length, 'item') + ' in ' +
    plural(roomsOf(prev).length, 'room') + '. You get the same rooms and items, with every answer blank.', yes: 'Yes, use that list', no: 'No, start with an empty list' })
    .then(function (y) { if (y) create(true); else if (y === false) create(false); });
}

  insp.room = same || name.charAt(0).toUpperCase() + name.slice(1);

}
function roomSheet(insp) {

  var earlier = [];
  S.insps.forEach(function (i) { if (i.freeform && i.siteId === insp.siteId && i !== insp) roomsOf(i).forEach(function (r) { if (!used[fold(r)] && earlier.indexOf(r) < 0) earlier.push(r); }); });
  var picks = earlier.concat(COMMON_ROOMS.filter(function (r) { return !used[fold(r)] && !earlier.some(function (e) { return sameText(e, r); }); })).slice(0, 12);

    '<div class="fld"><label for="rm-new">Room or area name</label><input class="in" id="rm-new" autocomplete="off" autocapitalize="words" enterkeyhint="go" placeholder="e.g. Classroom 3"></div>' +

// quick picks: the survey checklist's own list first (they stay in the same place every time),
// then things added on earlier surveys, leaving out what is already in this room
function itemPicks(insp, room) {
  var have = {}, out = [], seen = {};
  insp.items.forEach(function (it) { if (sameText(it.sec, room)) have[fold(it.q)] = 1; });
  var base = [], tpl = tplById(insp.tplId);
  if (tpl) tpl.sections.forEach(function (s) { s.items.forEach(function (it) { if (trim(it.q)) base.push(trim(it.q)); }); });
  // an earlier item comes back only if it was used at this site, or on more than one survey anywhere
  var freq = {};
  S.insps.forEach(function (i) {
    if (!i.freeform || i === insp) return;
    var once = {};
    i.items.forEach(function (it) {
      var k = fold(it.q); if (once[k]) return; once[k] = 1;
      if (!freq[k]) freq[k] = { t: it.q, n: 0, here: false };
      freq[k].n++; if (i.siteId === insp.siteId) freq[k].here = true;
    });
  });
  var learned = Object.keys(freq).map(function (k) { return freq[k]; }).filter(function (x) { return x.here || x.n > 1; })
    .sort(function (a, b) { return (b.here - a.here) || (b.n - a.n); }).map(function (x) { return x.t; });
  var extra = 0;
  base.forEach(function (t) { var k = fold(t); if (!k || seen[k] || have[k]) return; seen[k] = 1; out.push(t); });
  learned.forEach(function (t) { var k = fold(t); if (!k || seen[k] || have[k] || extra >= 6) return; seen[k] = 1; out.push(t); extra++; });
  return out;
}

// ==== sync.js ====
// ---------- the office copy: Google Sheet and Drive, through the Apps Script ----------
// With host/config.js (written by SET_LINK.bat) the phone signs in once with an email and the PIN, then
// keeps everything in step with the office sheet in the background. The phone always works on its own
// first: nothing waits for signal, and whatever has not gone yet goes the next time there is some.
// Without config.js the app runs on this phone only, exactly as before.
var CONF = window.FT_CONFIG || null;
function linked() { return !!(CONF && CONF.execStart); }
var CONN = null;   // { pin, email, name, role }, kept in localStorage so it never goes into a backup file
function loadConn() {
  try { CONN = JSON.parse(localStorage.getItem('ft-conn') || 'null'); } catch (e) { CONN = null; }
  if (CONN && !(CONN.pin && CONN.email)) CONN = null;
}
function saveConn() { try { if (CONN) localStorage.setItem('ft-conn', JSON.stringify(CONN)); else localStorage.removeItem('ft-conn'); } catch (e) { } }
function needsSignIn() { return linked() && !CONN; }

// One request to the Apps Script. Errors carry kind: offline, pin, slow or server.
function call(action, payload, o) {
  o = o || {};
  var pin = o.pin || (CONN && CONN.pin), email = o.email || (CONN && CONN.email);
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = ctl ? setTimeout(function () { ctl.abort(); }, o.timeout || 60000) : 0;
  return fetch(CONF.execStart + pin + '/exec', {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', cache: 'no-store',
    body: JSON.stringify({ action: action, payload: payload || {}, email: email }), signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    if (!r.ok) throw failure('server', 'The office sheet did not answer properly (' + r.status + ').');
    return r.json();
  }).then(function (out) {
    clearTimeout(timer);
    if (!out || !out.ok) { var e = failure('server', (out && out.error) || 'Something went wrong.'); e.code = out && out.code; throw e; }
    return out.data;
  }, function (e) {
    clearTimeout(timer);
    if (e && e.kind) throw e;
    return whyFailed(e);
  });
}
function failure(kind, msg) { var e = new Error(msg || kind); e.kind = kind; return e; }
// A wrong PIN comes back from Google as a 404 without the header that lets the app read it, which looks
// just like having no signal. Reaching our own site tells the two apart.
function whyFailed(e) {
  if (!navigator.onLine) return Promise.reject(failure('offline'));
  return fetch('manifest.webmanifest?reach=' + Date.now(), { cache: 'no-store' }).then(function () {
    throw failure(e && e.name === 'AbortError' ? 'slow' : 'pin');
  }, function (x) { if (x && x.kind) throw x; throw failure('offline'); });
}

// ---------- what has changed since it last reached the office ----------
var SY = { busy: false, last: 0, err: '', pending: 0 }, SYNCED = {}, LASTPULL = 0, PHOTOQ = [], DELQ = [];
function loadSyncState() {
  loadConn();
  return Promise.all([DB.get('synced'), DB.get('lastPull'), DB.get('photoQ'), DB.get('delQ'), DB.get('lastSync')]).then(function (r) {
    SYNCED = r[0] || {}; LASTPULL = r[1] || 0; PHOTOQ = r[2] || []; DELQ = r[3] || []; SY.last = r[4] || 0;
  }).catch(function () { });
}
function saveSyncState() { return Promise.all([DB.set('synced', SYNCED), DB.set('lastPull', LASTPULL), DB.set('photoQ', PHOTOQ), DB.set('delQ', DELQ), DB.set('lastSync', SY.last)]).catch(storageFail); }
function hsh(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + '.' + s.length; }

function isDirty(t, r) { return SYNCED[skey(t, r.id)] !== hsh(JSON.stringify(r)); }
function markSynced(t, r) { SYNCED[skey(t, r.id)] = hsh(JSON.stringify(r)); }
function companyRec() { var s = S.settings; return { id: 'company', company: s.company, prefix: s.prefix, updated: s.companyUpdated || 0 }; }
// the readable columns for the register; the full record goes with it
function summary(i) {
  var r = resultOf(i), site = siteOf(i), plain = function (t) { return String(t || '').replace(/ /g, ' '); };
  return {
    status: i.status === 'done' ? 'Report made' : 'Not finished', date: plain(fmtDate(i.created)), site: site.name, client: site.client || '',
    type: i.tplName, equipment: i.freeform ? plural(i.items.length, 'item') + ', ' + plural(roomsOf(i).length, 'room') : equipLabel(i),
    result: i.status === 'done' ? r.title + (r.sub ? ', ' + r.sub : '') : '', problems: r.c.fault, dangerous: r.c.danger,
    inspector: (i.sign && i.sign.name) || (i.by && i.by.name) || S.settings.inspector,
    made: i.status === 'done' && i.sign && i.sign.at ? plain(fmtDate(i.sign.at)) + ' ' + fmtTime(i.sign.at) : '',
    sent: i.shared ? plain(fmtDate(i.shared)) + ' ' + fmtTime(i.shared) : ''
  };
}
function shareable() {
  var out = [];
  S.sites.forEach(function (r) { if (!r.demo) out.push({ t: 'site', r: r }); });
  S.equipment.forEach(function (r) { if (!r.demo) out.push({ t: 'equip', r: r, sum: { site: (siteById(r.siteId) || {}).name || '', type: (tplById(r.tplId) || {}).name || '' } }); });
  S.templates.forEach(function (r) { out.push({ t: 'tpl', r: r }); });
  S.insps.forEach(function (r) { if (!r.demo && !isEmptyInsp(r)) out.push({ t: 'insp', r: r }); });
  out.push({ t: 'settings', r: companyRec() });
  return out;
}
function reportsDue() { return S.insps.filter(function (i) { return !i.demo && i.status === 'done' && i.no && i.pdfFor !== i.updated; }); }
function countPending() {
  if (!linked() || !CONN) { SY.pending = 0; return 0; }
  var n = PHOTOQ.length + DELQ.length + reportsDue().length;
  shareable().forEach(function (it) { if (isDirty(it.t, it.r)) n++; });
  SY.pending = n; return n;
}

// ---------- sending and fetching ----------
var syncTimer = 0;
function syncSoon(ms) {
  if (!linked() || !CONN) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function () { syncNow(); }, ms == null ? 4000 : ms);
  clearTimeout(syncSoon.count); syncSoon.count = setTimeout(function () { countPending(); showSync(); }, 600);
}
function syncNow() {
  if (!linked() || !CONN) return Promise.resolve();
  if (SY.busy) { syncSoon(3000); return Promise.resolve(); }
  if (!navigator.onLine) { countPending(); showSync(); return Promise.resolve(); }
  SY.busy = true; showSync();
  return pushRecords().then(pushPhotos).then(pushReports).then(pullRecords).then(topUpNumbers).then(function () {
    SY.err = ''; SY.last = Date.now();
  }, function (e) {
    SY.err = (e && (e.code || e.kind)) || 'server';
    if (e && e.code === 'not-person') { toast('This email has been taken off the People list. Ask the office.'); }
  }).then(function () {
    SY.busy = false; countPending(); saveSyncState(); showSync();
  });
}
function pushRecords() {
  var items = [], stamped = {};
  shareable().forEach(function (it) {
    if (!isDirty(it.t, it.r)) return;
    // shared lists are stamped when they leave, so the newest edit anywhere wins
    if (it.t === 'settings') { S.settings.companyUpdated = Date.now(); it.r = companyRec(); stamped.settings = 1; }
    else if (it.t !== 'insp') { it.r.updated = Date.now(); stamped[it.t] = 1; }
    else if (!it.r.by) { it.r.by = { email: CONN.email, name: CONN.name }; DB.put('insp', it.r); }
    items.push({ t: it.t, r: it.r, sum: it.t === 'insp' ? summary(it.r) : it.sum, h: hsh(JSON.stringify(it.r)) });
  });
  DELQ.forEach(function (id) { items.push({ t: 'del', id: id }); });
  if (stamped.site) saveKV('sites', true); if (stamped.equip) saveKV('equipment', true); if (stamped.tpl) saveKV('templates', true); if (stamped.settings) saveKV('settings', true);
  if (!items.length) return Promise.resolve();
  // in chunks, so one slow request never carries too much
  var chunks = [], cur = [], size = 0;
  items.forEach(function (it) {
    var n = JSON.stringify(it).length;
    if (cur.length && (size + n > 350000 || cur.length >= 25)) { chunks.push(cur); cur = []; size = 0; }
    cur.push(it); size += n;
  });
  if (cur.length) chunks.push(cur);
  return chunks.reduce(function (p, chunk) {
    return p.then(function () {
      return call('push', { items: chunk.map(function (it) { return it.t === 'del' ? { t: 'del', id: it.id } : { t: it.t, r: it.r, sum: it.sum }; }) }).then(function (res) {
        chunk.forEach(function (it) {
          if (it.t === 'del') DELQ = DELQ.filter(function (x) { return x !== it.id; });
          else SYNCED[skey(it.t, it.r.id)] = it.h;
        });
        (res.stale || []).forEach(function (st) { takeServerCopy(st.t, st.r); });
        return saveSyncState();
      });
    });
  }, Promise.resolve());
}
function takeServerCopy(t, r) {
  if (!r || !r.id) return;
  var list = t === 'site' ? S.sites : t === 'equip' ? S.equipment : t === 'tpl' ? S.templates : t === 'insp' ? S.insps : null;

// ---------- the PDF report (jsPDF, A4 portrait, millimetres) ----------
// jsPDF's built-in Helvetica only has Latin-1, so every string goes through pdfText first:
// the euro sign, dashes and curly quotes would otherwise silently vanish, and emoji become junk.
function pdfText(s) {
  return String(s == null ? '' : s)
    .replace(/€\s*/g, 'EUR ')
    .replace(/[‘’‚‛′]/g, "'")
    .replace(/[“”„‟″]/g, '"')
    .replace(/[–—―−]/g, '-')
    .replace(/…/g, '...')
    .replace(/[•●▪‣]/g, '-')
    .replace(/[ΩΩ]/g, ' ohm')
    .replace(/[ -​  ]/g, ' ')
    .replace(/\r\n?/g, '\n')
    .replace(/[^\n\x20-\x7E\xA1-\xFF]/g, '')
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/ +([.,;:!?])(?=\s|$)/g, '$1');   // where an emoji was dropped before a full stop
}

function sentence(a, b) { a = trim(a); if (!a) return b; if (!b) return a; return a + (/[.!?]$/.test(a) ? ' ' : '. ') + b; }

    });

}

function buildReport(ctx) {

      equip: { name: o.eq[0] || '', location: o.eq[1] || '', make: o.eq[2] || '', rating: o.eq[3] || '', serial: o.eq[4] || '', plate: [] },
      general: { note: o.note || '', photos: [] }, status: o.draft ? 'draft' : 'done', created: started, updated: started + 5400e3, pos: 0 };
    var chain = Promise.resolve();
    items.forEach(function (it, i) {
      if (o.draft && i >= o.draft) return;
      var spec = (o.ans || {})[it.id] || ['ok'];
      insp.ans[it.id] = { r: spec[0], sev: spec[1] || undefined, note: spec[2] || '', photos: [] };
      if (spec[3]) chain = chain.then(function () { return photos(spec[3], id).then(function (ids) { insp.ans[it.id].photos = ids; }); });
    });
    if (o.plate) chain = chain.then(function () { return photos(['plate'], id).then(function (ids) { insp.equip.plate = ids; }); });
    if (o.gphotos) chain = chain.then(function () { return photos(o.gphotos, id).then(function (ids) { insp.general.photos = ids; }); });
    return chain.then(function () {
      if (o.draft) { insp.pos = o.draft; insp.updated = now - 40 * 60e3; }
      else {
        insp.no = 'DEMO-' + pad4(o.n);
        insp.sign = { name: 'Frank Treharne', client: o.client || '', strokes: demoSignature(o.n), at: started + 5400e3 };
        insp.finished = started + 5400e3;
        insp.siteSnap = JSON.parse(JSON.stringify(sites[o.site]));
        if (o.shared) insp.shared = started + 7200e3;
      }
      S.insps = S.insps.filter(function (x) { return x.id !== id; });
      S.insps.push(insp); made.push(insp);
      var e = insp.equip;
      if (e.name) S.equipment.push({ id: 'edemo' + o.n, demo: true, siteId: insp.siteId, tplId: insp.tplId, name: e.name, location: e.location, make: e.make, rating: e.rating, serial: e.serial, last: insp.created });
      return DB.put('insp', insp);
    });
  }
  var specs = [
    { n: 1, site: 0, tpl: 'msb', days: 24, shared: 1, plate: 1, client: "Liam O'Brien", eq: ['MDB-01', 'Main switchroom, ground floor', 'Form 4 Type 2 switchboard', '1600 A, 50 kA', 'SB-14-0317'],

        ['Classroom 2', [['Sockets (8)', 'ok'], ['Light fittings', 'fault', 'improve', 'Two diffusers cracked.'], ['Floor box by the teacher’s desk', 'fault', 'danger', 'Lid broken, live terminals reachable. Taped off and the principal told.', ['dbgap']]]],
        ['Staff room', [['Sockets', 'ok'], ['Fridge and kettle spur', 'ok'], ['Light fittings', 'ok']]],

    { n: 9, site: 8, tpl: 'msb', days: 150, shared: 1, plate: 1, eq: ['MSB-A', 'Electrical room A', 'Form 4 Type 6', '2500 A, 65 kA'],
      ans: { 'msb-a1': ['fault', 'soon', 'Pallets of UPS batteries stored in front of the board.', ['panel']], 'msb-d5': ['fault', 'danger', 'SPD showing red on phase L3. Replaced the cartridge the same day.'] } }
  ];
  return specs.reduce(function (p, o) { return p.then(function () { return make(o); }); }, Promise.resolve()).then(function () {
    return Promise.all([saveKV('sites'), saveKV('equipment')]);
  }).then(function () { return made.filter(function (i) { return i.status !== 'draft'; }).length; });
}
