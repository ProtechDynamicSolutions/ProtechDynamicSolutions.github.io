/* App key: the last 10 characters of the deployment URL before /exec.
   The server derives the same value from its own URL and rejects anything else,
   so a stray request with no key gets nowhere. Treat it as a gate on the
   endpoint, not as a secret, since anything shipped to a browser can be read.
   The real controls are the hashed PIN, the server side session and the
   lockout below. */
function appKey(){
  const m = String(CONFIG.API_URL).match(/([A-Za-z0-9_-]{10})\/exec\/?$/);
  return m ? m[1] : '';
}

const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = s => { if(!s) return ''; const d = parse(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
const fmtLong = s => { if(!s) return ''; const d = parse(s); return DAYS[d.getDay()].slice(0,3)+' '+pad(d.getDate())+' '+MONS[d.getMonth()]; };
const eur = n => '\u20AC'+(Number(n)||0).toFixed(2);
function weekStart(d){ const x = new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
function toMin(t){ if(!t) return null; const a = t.split(':').map(Number); return a[0]*60+a[1]; }
function hoursWorked(start, finish, brk){
  const a = toMin(start), b = toMin(finish);
  if(a===null||b===null) return 0;
  let d = b-a; if(d<0) d += 1440;
  d -= (Number(brk)||0);
  return Math.max(0, Math.round(d/6)/10);
}
function workingDaysBetween(a,b){ let n=0,d=parse(a),e=parse(b); while(d<=e){ const w=d.getDay(); if(w!==0&&w!==6) n++; d=addDays(d,1);} return n; }

const mem = {};
const store = {
  get(k,fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : (k in mem ? mem[k] : fb); }catch(e){ return k in mem ? mem[k] : fb; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} mem[k]=v; },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} delete mem[k]; }
};

async function sha256(text){
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let h = 5381; for(let i=0;i<text.length;i++){ h = ((h*33) ^ text.charCodeAt(i)) >>> 0; }
    return 'fb'+h.toString(16);
  }
}
const PIN_SALT = 'glenview-2026';
const hashPin = pin => sha256(PIN_SALT+':'+String(pin).trim());

function shrinkImage(file, max=1400, q=0.72){
  return new Promise((res,rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => { const s = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
      img.onerror = () => rej(new Error('That file could not be read as an image.')); img.src = fr.result; };
    fr.onerror = () => rej(new Error('That file could not be read.'));
    fr.readAsDataURL(file);
  });
}
const readAsDataUrl = f => new Promise((res,rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('That file could not be read.')); fr.readAsDataURL(f); });

/* ============================== API ============================== */
async function api(action, payload){
  if(!CONFIG.API_URL) return { ok:true, offline:true };
  try {
    const r = await fetch(CONFIG.API_URL, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, key: appKey(), token: store.get('gh_token',''), payload })
    });
    return await r.json();
  } catch(e){ return { ok:false, error:'No connection. Saved on this device and will send when you are back online.' }; }
}

function SignaturePad({value,onChange}){
  const ref = useRef(null), drawing = useRef(false);
  useEffect(() => {
    const c = ref.current; if(!c) return;
    const dpr = window.devicePixelRatio||1, r = c.getBoundingClientRect();
    c.width = r.width*dpr; c.height = r.height*dpr;
    const ctx = c.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth = 2; ctx.lineCap='round'; ctx.strokeStyle='#1F2544';
    if(value){ const i = new Image(); i.onload = () => ctx.drawImage(i,0,0,r.width,r.height); i.src = value; }
  }, []);
  const pos = e => { const r = ref.current.getBoundingClientRect(); const p = e.touches?e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; };
  const down = e => { e.preventDefault(); drawing.current = true; const c = ref.current.getContext('2d'); const p = pos(e); c.beginPath(); c.moveTo(p.x,p.y); };
  const move = e => { if(!drawing.current) return; e.preventDefault(); const c = ref.current.getContext('2d'); const p = pos(e); c.lineTo(p.x,p.y); c.stroke(); };
  const up = () => { if(!drawing.current) return; drawing.current = false; onChange(ref.current.toDataURL('image/png')); };
  return (<div>
    <canvas ref={ref} className="sigpad" onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
      onTouchStart={down} onTouchMove={move} onTouchEnd={up} />
    <button type="button" onClick={() => { const c = ref.current; c.getContext('2d').clearRect(0,0,c.width,c.height); onChange(''); }}
      className="mt-2 text-xs font-semibold text-mute hover:text-ink">Clear signature</button>
  </div>);
}
function Gauge({start,end,max,unit}){
  const s = parseFloat(start), e = parseFloat(end), m = parseFloat(max)||1;
  const top = Math.max(m*1.35, (isFinite(s)?s:0)*1.2, 0.1);
  const ang = v => -210 + (Math.min(Math.max(v,0),top)/top)*240;
  const R = 78, cx = 100, cy = 96;
  const pt = (a,r) => [cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const arc = (a1,a2,r) => { const p1 = pt(a1,r), p2 = pt(a2,r); return 'M '+p1[0]+' '+p1[1]+' A '+r+' '+r+' 0 '+(Math.abs(a2-a1)>180?1:0)+' 1 '+p2[0]+' '+p2[1]; };
  const drop = (isFinite(s)&&isFinite(e)) ? s-e : 0;
  const n = pt(ang(isFinite(e)?e:0), R-16), t1 = pt(ang(isFinite(s)?s:0), R), t2 = pt(ang(isFinite(s)?s:0), R-11);
  return (
    <svg viewBox="0 0 200 132" className="w-full max-w-[230px] mx-auto">
      <path d={arc(-210,30,R)} fill="none" stroke="#E6E1D8" strokeWidth="11" strokeLinecap="round" />
      <path d={arc(-210,ang(isFinite(e)?e:0),R)} fill="none" stroke="#C9A063" strokeWidth="11" strokeLinecap="round" />
      <line x1={t1[0]} y1={t1[1]} x2={t2[0]} y2={t2[1]} stroke="#1F2544" strokeWidth="2.5" strokeLinecap="round" />
      <line x1={cx} y1={cy} x2={n[0]} y2={n[1]} stroke="#1F2544" strokeWidth="3" strokeLinecap="round" />
      <circle cx={cx} cy={cy} r="5" fill="#1F2544" />
      <text x="100" y="122" textAnchor="middle" fontSize="13" fontWeight="600" fill="#1F2544" fontFamily="Poppins">{(isFinite(e)?e:0)+' '+unit}</text>
      <text x="100" y="66" textAnchor="middle" fontSize="9.5" fill="#7A8099" fontFamily="Inter">{drop>0?('drop '+drop.toFixed(2)):'holding'}</text>
    </svg>
  );
}

function Login({users, onIn, toast}){
  const [ident, setIdent] = useState(() => store.get('gh_last_ident',''));
  const [pin, setPin] = useState('');
  const [remember, setRemember] = useState(true);
  const [busy, setBusy] = useState(false);
  const lock = store.get('gh_lock', null);
  const [lockedUntil, setLockedUntil] = useState(lock && lock.until > Date.now() ? lock.until : 0);

  useEffect(() => {
    if(!lockedUntil) return;
    const t = setInterval(() => { if(Date.now() >= lockedUntil){ setLockedUntil(0); store.del('gh_lock'); } }, 1000);
    return () => clearInterval(t);
  }, [lockedUntil]);

  const fail = () => {
    const rec = store.get('gh_attempts', { n:0 });
    rec.n = (rec.n||0)+1;
    store.set('gh_attempts', rec);
    const left = CONFIG.MAX_ATTEMPTS - rec.n;
    if(left <= 0){
      const until = Date.now() + CONFIG.LOCKOUT_MINS*60000;
      store.set('gh_lock', { until }); store.set('gh_attempts', { n:0 }); setLockedUntil(until);
      toast('Too many attempts. Locked for '+CONFIG.LOCKOUT_MINS+' minutes.');
    } else {
      toast('That did not match. '+left+' '+(left===1?'try':'tries')+' left before the app locks.');
    }
  };

  const go = async () => {
    if(lockedUntil) return;
    setBusy(true);
    const key = String(ident).trim().toLowerCase();
    const u = users.find(x => x.active && (x.code.toLowerCase()===key || x.email.toLowerCase()===key || x.id.toLowerCase()===key));
    const hash = await hashPin(pin);
    let ok = false, user = null, token = '';
    if(CONFIG.API_URL){
      const r = await api('login', { ident:key, pinHash:hash, remember });
      ok = !!(r && r.ok); user = r && r.user; token = (r && r.token) || '';
      if(!ok && r && r.error) toast(r.error);
    } else {
      ok = !!u && (await hashPin(u.pin)) === hash;
      user = u; token = ok ? uid('TK') : '';
    }
    setBusy(false);
    if(!ok){ if(!CONFIG.API_URL) fail(); setPin(''); return; }
    store.set('gh_attempts', { n:0 });
    store.set('gh_last_ident', ident);
    if(remember){ store.set('gh_token', token); store.set('gh_device', { userId:user.id, until: Date.now()+CONFIG.DEVICE_DAYS*86400000 }); }
    onIn(user);
  };

  const mins = lockedUntil ? Math.ceil((lockedUntil-Date.now())/60000) : 0;

  return (
    <div className="min-h-screen bg-ink flex items-center justify-center p-5">
      <div className="w-full max-w-sm">
        <div className="flex justify-center mb-8"><Logo h="h-24" /></div>
        <div className="card p-7">
          <div className="rule mb-5">
            <div className="text-[.68rem] font-semibold tracking-[.14em] uppercase text-gold">Staff portal</div>
            <h1 className="text-2xl font-semibold text-ink mt-1">Sign in</h1>
          </div>
          {lockedUntil ? (
            <div className="text-center py-6">
              <p className="text-fail font-semibold">Locked for {mins} more {mins===1?'minute':'minutes'}.</p>
              <p className="text-sm text-mute mt-2">Ring the office on {CONFIG.PHONE} if you are stuck.</p>
            </div>
          ) : (
            <div className="space-y-4">
              <Field label="Staff name or email">
                <input className="fld" autoComplete="username" value={ident} onChange={e => setIdent(e.target.value)} placeholder="declan" />
              </Field>
              <Field label="PIN">
                <input className="fld tracking-[.5em] text-center text-lg" type="password" inputMode="numeric" maxLength="6"
                  autoComplete="current-password" value={pin}
                  onChange={e => setPin(e.target.value.replace(/\D/g,''))}
                  onKeyDown={e => { if(e.key==='Enter') go(); }} placeholder="0000" />
              </Field>
              <label className="flex items-center gap-3 text-sm text-inksoft">
                <input type="checkbox" className="w-5 h-5 accent-[#C9A063]" checked={remember} onChange={e => setRemember(e.target.checked)} />
                Keep me signed in on this phone
              </label>
              <Btn className="w-full" onClick={go} disabled={busy || !ident || pin.length < 4}>{busy ? 'Checking' : 'Sign in'}</Btn>
              {!CONFIG.API_URL && <p className="text-xs text-mute text-center pt-1">Demo: declan, aoife, tomasz, sinead or admin. PIN 1234.</p>}
            </div>
          )}
        </div>
        <p className="text-center text-white/40 text-xs mt-6">Built by Protech Dynamic Solutions Ltd.</p>
      </div>
    </div>
  );
}

function Timesheets({me, isOffice, sheets, setSheets, jobs, toast}){
  const [mode, setMode] = useState(() => store.get('gh_tsmode','job'));
  const [monday, setMonday] = useState(() => iso(weekStart(new Date())));
  const [dayFocus, setDayFocus] = useState(() => iso(new Date()));
  const [editing, setEditing] = useState(null);   // { dayIndex, entry, isNew }
  const [review, setReview] = useState(null);
  useEffect(() => store.set('gh_tsmode', mode), [mode]);

  const blankDays = m => Array.from({length:7}, (_,i) => {
    const d = addDays(parse(m),i), w = d.getDay();
    return { date: iso(d), type: (w===0||w===6)?'Day off':'Worked', entries:[], notes:'', certUrl:'', certReceived:false };
  });

  const findSheet = m => sheets.find(s => s.staffId===me.id && s.weekStart===m);
  const [draft, setDraft] = useState(() => {
    const f = findSheet(iso(weekStart(new Date())));
    return f ? JSON.parse(JSON.stringify(f)) : { id:uid('TS'), staffId:me.id, name:me.name, weekStart:iso(weekStart(new Date())), days:blankDays(iso(weekStart(new Date()))), status:'Draft', approver:'', comment:'' };
  });

  useEffect(() => {
    const f = findSheet(monday);
    setDraft(f ? JSON.parse(JSON.stringify(f)) : { id:uid('TS'), staffId:me.id, name:me.name, weekStart:monday, days:blankDays(monday), status:'Draft', approver:'', comment:'' });
  }, [monday, me.id, sheets]);

  useEffect(() => {  // keep the focused day inside the shown week
    const m = iso(weekStart(parse(dayFocus)));
    if(m !== monday) setMonday(m);
  }, [dayFocus]);

  const locked = draft.status==='Approved' || draft.status==='Submitted';
  const setDay = (i, patch) => setDraft(d => { const days = d.days.slice(); days[i] = {...days[i], ...patch}; return {...d, days}; });
  const dayIndex = date => draft.days.findIndex(d => d.date===date);
  const dayHours = d => (d.entries||[]).reduce((a,e) => a+hoursWorked(e.start,e.finish,e.brk), 0);

  const totals = useMemo(() => {
    let worked = 0, al = 0, sick = 0, ph = 0, unpaid = 0, cert = 0;
    draft.days.forEach(d => {
      worked += dayHours(d);
      if(d.type==='Annual leave') al++;
      if(d.type==='Public holiday') ph++;
      if(d.type==='Unpaid leave') unpaid++;
      if(d.type==='Sick leave'){ sick++; if(!d.certReceived) cert++; }
    });
    worked = Math.round(worked*10)/10;
    return { worked, al, sick, ph, unpaid, cert, ot: Math.max(0, Math.round((worked-CONFIG.STANDARD_WEEK)*10)/10) };
  }, [draft]);

  /* new entry starts where the last one finished */
  const openEntry = (date, entry) => {
    let i = dayIndex(date);
    if(i < 0){ toast('That day is outside the week you are looking at.'); return; }
    if(entry) return setEditing({ i, entry: {...entry}, isNew:false });
    const list = draft.days[i].entries || [];
    const last = list[list.length-1];
    setEditing({ i, isNew:true, entry:{ id:uid('E'), jobId:'', site:'', task:'', start: last ? last.finish : '08:00', finish:'', brk:0, notes:'' } });
  };
  const saveEntry = () => {
    const { i, entry, isNew } = editing;
    if(!entry.jobId && !entry.site) return toast('Pick a job or type where you were.');
    if(!entry.start || !entry.finish) return toast('Both a start and a finish time are needed.');
    setDraft(d => {
      const days = d.days.slice();
      const list = (days[i].entries||[]).slice();
      const at = list.findIndex(x => x.id===entry.id);
      if(at >= 0) list[at] = entry; else list.push(entry);
      list.sort((a,b) => (a.start||'').localeCompare(b.start||''));
      days[i] = {...days[i], entries:list, type: days[i].type==='Day off' && list.length ? 'Worked' : days[i].type };
      return {...d, days};
    });
    setEditing(null);
    toast(isNew ? 'Job logged.' : 'Entry updated.');
  };
  const dropEntry = (i, id) => setDraft(d => { const days = d.days.slice(); days[i] = {...days[i], entries: days[i].entries.filter(e => e.id!==id)}; return {...d, days}; });

  const attachCert = async (i, file) => {
    if(!file) return;
    try {
      const data = file.type.startsWith('image/') ? await shrinkImage(file,1600,0.7) : await readAsDataUrl(file);
      let url = data;
      const r = await api('upload', { folder:'Sick certs', name: me.name+' '+draft.days[i].date+'.jpg', data });
      if(r && r.url) url = r.url;
      setDay(i, { certUrl:url, certReceived:true });
      toast('Cert attached.');
    } catch(err){ toast(err.message); }
  };

  const save = async status => {
    if(status==='Submitted'){
      const bad = draft.days.some(d => (d.entries||[]).some(e => !e.jobId && !e.site));
      if(bad) return toast('Every entry needs a job before the week goes in.');
    }
    const rec = {...draft, status, submittedAt: iso(new Date())};
    setSheets(list => { const i = list.findIndex(s => s.id===rec.id); const out = list.slice(); if(i>=0) out[i]=rec; else out.push(rec); return out; });
    await api('saveTimesheet', rec);
    toast(status==='Submitted' ? 'Week sent to the office.' : 'Saved.');
  };
  const decide = async (sheet, status) => {
    const rec = {...sheet, status, approver: me.name, decidedAt: iso(new Date())};
    setSheets(list => list.map(s => s.id===rec.id ? rec : s));
    await api('saveTimesheet', rec);
    setReview(null);
    toast(status==='Approved' ? sheet.name+"'s week approved." : 'Sent back to '+sheet.name+'.');
  };

  const jobLabel = e => { const j = jobs.find(x => x.id===e.jobId); return j ? j.id+', '+j.site : (e.site||'No job'); };

  const DayCard = ({d, i, open}) => (
    <div className={'card p-4 sm:p-5 '+(DAY_TINT[d.type]||'bg-white')}>
      <div className="flex flex-wrap items-center gap-3">
        <div className="w-[5.5rem]">
          <div className="font-display font-semibold text-ink leading-none">{DAYS[parse(d.date).getDay()].slice(0,3)}</div>
          <div className="text-xs text-mute mt-1">{fmt(d.date).slice(0,5)}</div>
        </div>
        <select className="fld flex-1 min-w-[9rem]" value={d.type} disabled={locked} onChange={e => setDay(i,{type:e.target.value})}>
          {LEAVE_TYPES.map(t => <option key={t}>{t}</option>)}
        </select>
        <div className="font-display font-semibold text-ink text-lg tabular-nums w-16 text-right">
          {dayHours(d).toFixed(1)}<span className="text-xs text-mute ml-1">h</span>
        </div>
      </div>

      {open && d.type==='Worked' && (
        <div className="mt-4 space-y-2">
          {(d.entries||[]).map(e => (
            <div key={e.id} className="flex items-center gap-3 bg-paper rounded-2xl px-4 py-3">
              <div className="flex-1 min-w-0">
                <div className="font-semibold text-sm text-ink truncate">{jobLabel(e)}</div>
                <div className="text-xs text-mute">{e.start} to {e.finish}{e.brk>0 ? ', break '+e.brk+' min':''}{e.task ? ' \u00B7 '+e.task : ''}</div>
              </div>
              <div className="font-display font-semibold text-sm tabular-nums">{hoursWorked(e.start,e.finish,e.brk).toFixed(1)}h</div>
              {!locked && <>
                <button onClick={() => openEntry(d.date, e)} className="text-xs font-semibold text-gold">Edit</button>
                <button onClick={() => dropEntry(i, e.id)} className="text-xs text-mute hover:text-fail">&times;</button>
              </>}
            </div>
          ))}
          {!locked && (
            <button onClick={() => openEntry(d.date)} className="w-full py-3 rounded-2xl border-2 border-dashed border-line text-sm font-semibold text-mute hover:border-gold hover:text-ink">
              + Add job {(d.entries||[]).length ? 'from '+d.entries[d.entries.length-1].finish : ''}
            </button>
          )}
        </div>
      )}

      {open && d.type==='Sick leave' && (
        <div className="mt-4">
          <Field label="Doctor's cert" hint={'Needed from sick day '+CONFIG.CERT_REQUIRED_FROM_DAY+' onwards.'}>
            {d.certUrl
              ? <div className="flex items-center gap-3">
                  <span className="pill px-3 py-1 text-xs font-semibold bg-[#E8F1EC] text-pass">Cert on file</span>
                  <a href={d.certUrl} target="_blank" rel="noopener" className="text-xs font-semibold text-gold underline">View</a>
                  {!locked && <button className="text-xs text-mute hover:text-fail" onClick={() => setDay(i,{certUrl:'',certReceived:false})}>Remove</button>}
                </div>
              : <label className="inline-flex items-center gap-2 pill bg-white border border-line px-4 py-2.5 text-sm font-semibold cursor-pointer hover:border-gold">
                  Attach cert
                  <input type="file" accept="image/*,application/pdf" capture="environment" className="hidden" disabled={locked} onChange={e => attachCert(i, e.target.files[0])} />
                </label>}
          </Field>
        </div>
      )}
    </div>
  );

  const focusIdx = dayIndex(dayFocus);
  const queue = sheets.filter(s => s.status==='Submitted');

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-6">
        {[['job','After each job'],['day','Fill a day'],['week','Fill the week']].map(m => (
          <button key={m[0]} onClick={() => setMode(m[0])}
            className={'pill px-5 py-2.5 text-sm font-display font-semibold border transition '+(mode===m[0]?'bg-ink text-white border-ink':'bg-white text-inksoft border-line hover:border-gold')}>{m[1]}</button>
        ))}
      </div>

      {mode==='job' && (
        <Section kicker={fmtLong(dayFocus)} title="Log a job"
          right={<input type="date" className="fld !w-auto" value={dayFocus} onChange={e => setDayFocus(e.target.value)} />}>
          {focusIdx >= 0 ? <DayCard d={draft.days[focusIdx]} i={focusIdx} open={true} /> : <Empty line="Pick a date to log against." />}
          <p className="text-xs text-mute mt-3">Each new job starts where the last one finished, so a full day is a few taps.</p>
        </Section>
      )}

      {mode==='day' && (
        <Section kicker="One day at a time" title={fmtLong(dayFocus)}
          right={<div className="flex gap-2">
            <button onClick={() => setDayFocus(iso(addDays(parse(dayFocus),-1)))} className="w-11 h-11 pill bg-white border border-line hover:border-gold">&#8592;</button>
            <button onClick={() => setDayFocus(iso(addDays(parse(dayFocus),1)))} className="w-11 h-11 pill bg-white border border-line hover:border-gold">&#8594;</button>
          </div>}>
          {focusIdx >= 0 && <DayCard d={draft.days[focusIdx]} i={focusIdx} open={true} />}
        </Section>
      )}

      {mode==='week' && (
        <Section kicker="Week ending" title={fmt(iso(addDays(parse(monday),6)))}
          right={<div className="flex gap-2">
            <button onClick={() => setMonday(iso(addDays(parse(monday),-7)))} className="w-11 h-11 pill bg-white border border-line hover:border-gold">&#8592;</button>
            <button onClick={() => setMonday(iso(addDays(parse(monday),7)))} className="w-11 h-11 pill bg-white border border-line hover:border-gold">&#8594;</button>
          </div>}>
          <div className="space-y-3">{draft.days.map((d,i) => <DayCard key={d.date} d={d} i={i} open={true} />)}</div>
        </Section>
      )}

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
        <Stat label="Hours this week" value={totals.worked} sub={totals.ot>0 ? totals.ot+' h overtime' : 'within '+CONFIG.STANDARD_WEEK+' h'} />
        <Stat label="Annual leave" value={totals.al} sub="days" />
        <Stat label="Sick leave" value={totals.sick} sub={totals.cert ? totals.cert+' cert outstanding' : 'certs in order'} warn={totals.cert>0} />
        <Stat label="Week status" value={draft.status} sub={draft.approver ? 'by '+draft.approver : 'not sent yet'} text />
      </div>

      <div className="flex flex-wrap gap-3 mb-10">
        {!locked && <Btn kind="ghost" onClick={() => save('Draft')}>Save</Btn>}
        {!locked && <Btn onClick={() => save('Submitted')}>Send week for approval &#8594;</Btn>}
        {draft.status==='Submitted' && !isOffice && <Btn kind="ghost" onClick={() => save('Draft')}>Pull back and edit</Btn>}
        {draft.status==='Approved' && <span className="text-sm text-mute self-center">Approved by {draft.approver}. Locked for payroll.</span>}
      </div>

      {isOffice && (
        <Section kicker="Office" title="Timesheets waiting on you">
          {queue.length===0 ? <Empty line="Nothing to approve. Submitted weeks land here." /> :
            <div className="space-y-3">
              {queue.map(s => {
                const h = s.days.reduce((a,d) => a + (d.entries||[]).reduce((b,e) => b+hoursWorked(e.start,e.finish,e.brk),0), 0);
                const al = s.days.filter(d => d.type==='Annual leave').length;
                const sl = s.days.filter(d => d.type==='Sick leave').length;
                const nc = s.days.filter(d => d.type==='Sick leave' && !d.certReceived).length;
                return (
                  <button key={s.id} onClick={() => setReview(s)} className="card w-full text-left p-5 hover:border-gold">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                      <div>
                        <div className="font-display font-semibold text-ink">{s.name}</div>
                        <div className="text-sm text-mute">Week ending {fmt(iso(addDays(parse(s.weekStart),6)))}</div>
                      </div>
                      <div className="flex items-center gap-3 text-sm">
                        <span className="font-display font-semibold">{h.toFixed(1)} h</span>
                        {al>0 && <span className="pill px-3 py-1 bg-goldsoft text-golddeep text-xs font-semibold">{al} AL</span>}
                        {sl>0 && <span className="pill px-3 py-1 bg-[#FBE9E7] text-fail text-xs font-semibold">{sl} sick</span>}
                        {nc>0 && <span className="pill px-3 py-1 bg-fail text-white text-xs font-semibold">{nc} cert missing</span>}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>}
        </Section>
      )}

      <Modal open={!!editing} onClose={() => setEditing(null)} title={editing && editing.isNew ? 'Log a job' : 'Edit entry'}>
        {editing && (
          <div className="space-y-4">
            <Field label="Job">
              <select className="fld" value={editing.entry.jobId}
                onChange={e => { const j = jobs.find(x => x.id===e.target.value);
                  setEditing({...editing, entry:{...editing.entry, jobId:e.target.value, site: j ? j.site : editing.entry.site}}); }}>
                <option value="">Not on the job list</option>
                {jobs.filter(j => j.status!=='Invoiced').map(j => <option key={j.id} value={j.id}>{j.id+' \u00B7 '+j.site}</option>)}
              </select>
            </Field>
            {!editing.entry.jobId &&
              <Field label="Where were you"><input className="fld" value={editing.entry.site} onChange={e => setEditing({...editing, entry:{...editing.entry, site:e.target.value}})} placeholder="Address or yard" /></Field>}
            <Field label="What you did"><input className="fld" value={editing.entry.task} onChange={e => setEditing({...editing, entry:{...editing.entry, task:e.target.value}})} placeholder="Second fix, service call, collection" /></Field>
            <div className="grid grid-cols-3 gap-3">
              <Field label="Start"><input type="time" className="fld" value={editing.entry.start} onChange={e => setEditing({...editing, entry:{...editing.entry, start:e.target.value}})} /></Field>
              <Field label="Finish"><input type="time" className="fld" value={editing.entry.finish} onChange={e => setEditing({...editing, entry:{...editing.entry, finish:e.target.value}})} /></Field>
              <Field label="Break, min"><input type="number" min="0" step="15" className="fld" value={editing.entry.brk} onChange={e => setEditing({...editing, entry:{...editing.entry, brk:e.target.value}})} /></Field>
            </div>
            <div className="pill bg-paper px-4 py-3 text-sm">
              <strong className="font-display">{hoursWorked(editing.entry.start, editing.entry.finish, editing.entry.brk).toFixed(1)} hours</strong>
              <span className="text-mute"> on this entry</span>
            </div>
            <Field label="Notes"><textarea className="fld" rows="2" value={editing.entry.notes} onChange={e => setEditing({...editing, entry:{...editing.entry, notes:e.target.value}})} placeholder="Parts needed, return visit, anything the office should know" /></Field>
            <div className="flex gap-3"><Btn onClick={saveEntry}>Save entry</Btn><Btn kind="quiet" onClick={() => setEditing(null)}>Cancel</Btn></div>
          </div>
        )}
      </Modal>

      <Modal open={!!review} onClose={() => setReview(null)} wide title={review ? review.name+', week ending '+fmt(iso(addDays(parse(review.weekStart),6))) : ''}>
        {review && (
          <div>
            <div className="space-y-3">
              {review.days.filter(d => d.type!=='Day off' || (d.entries||[]).length).map(d => (
                <div key={d.date} className={'rounded-2xl p-4 '+(DAY_TINT[d.type]||'bg-white')}>
                  <div className="flex justify-between items-center">
                    <span className="font-display font-semibold">{fmtLong(d.date)}</span>
                    <span className="text-sm">{d.type}
                      {d.type==='Sick leave' && (d.certReceived
                        ? <span className="ml-2 text-xs text-pass font-semibold">cert on file</span>
                        : <span className="ml-2 text-xs text-fail font-semibold">no cert</span>)}
                    </span>
                  </div>
                  {(d.entries||[]).map(e => (
                    <div key={e.id} className="flex justify-between text-sm text-inksoft mt-2 border-t border-line pt-2">
                      <span>{jobLabel(e)} <span className="text-mute">{e.start} to {e.finish}</span></span>
                      <span className="tabular-nums">{hoursWorked(e.start,e.finish,e.brk).toFixed(1)}h</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
            <div className="flex gap-3 mt-6">
              <Btn onClick={() => decide(review,'Approved')}>Approve</Btn>
              <Btn kind="danger" onClick={() => decide(review,'Draft')}>Send back</Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================== LEAVE ============================== */
function LeaveModule({me, isOffice, leave, setLeave, toast}){
  const [open, setOpen] = useState(false);
  const [decide, setDecide] = useState(null);
  const [comment, setComment] = useState('');
  const [form, setForm] = useState({ type:'Annual leave', start:iso(new Date()), end:iso(new Date()), halfDay:false, reason:'', certUrl:'' });

  const mine = leave.filter(l => l.staffId===me.id).sort((a,b) => b.start.localeCompare(a.start));
  const ent = me.entitlement || CONFIG.ANNUAL_ENTITLEMENT;
  const taken = mine.filter(l => l.type==='Annual leave' && l.status==='Approved').reduce((a,l) => a+l.days,0);
  const pend = mine.filter(l => l.type==='Annual leave' && l.status==='Pending').reduce((a,l) => a+l.days,0);
  const sick = mine.filter(l => l.type==='Sick leave' && l.status!=='Declined').reduce((a,l) => a+l.days,0);
  const remaining = ent - taken - pend;
  const days = form.halfDay ? 0.5 : workingDaysBetween(form.start, form.end);
  const clashes = useMemo(() => !decide ? [] : leave.filter(l => l.id!==decide.id && l.status==='Approved' && l.staffId!==decide.staffId && !(l.end<decide.start || l.start>decide.end)), [decide, leave]);

  const attachCert = async file => {
    if(!file) return;
    try {
      const data = file.type.startsWith('image/') ? await shrinkImage(file,1600,0.7) : await readAsDataUrl(file);
      let url = data;
      const r = await api('upload', { folder:'Sick certs', name: me.name+' cert '+form.start+'.jpg', data });
      if(r && r.url) url = r.url;
      setForm(f => ({...f, certUrl:url})); toast('Cert attached.');
    } catch(err){ toast(err.message); }
  };
  const submit = async () => {
    if(form.end < form.start) return toast('The end date is before the start date.');
    if(days <= 0) return toast('Those dates land on a weekend. Pick working days.');
    if(form.type==='Annual leave' && days > remaining) return toast('That is '+days+' days and only '+remaining+' remain.');
    const rec = { id:uid('LV'), staffId:me.id, name:me.name, type:form.type, start:form.start, end:form.end, days,
      reason:form.reason, certUrl:form.certUrl, certReceived:!!form.certUrl, status:'Pending', approver:'', comment:'', raisedAt:iso(new Date()) };
    setLeave(l => [rec, ...l]);
    await api('saveLeave', rec);
    setOpen(false);
    setForm({ type:'Annual leave', start:iso(new Date()), end:iso(new Date()), halfDay:false, reason:'', certUrl:'' });
    toast('Request sent to the office.');
  };
  const settle = async status => {
    const rec = {...decide, status, approver:me.name, comment, decidedAt:iso(new Date())};
    setLeave(list => list.map(l => l.id===rec.id ? rec : l));
    await api('decideLeave', rec);
    setDecide(null); setComment('');
    toast(status==='Approved' ? 'Approved.' : 'Declined with a note.');
  };
  const queue = leave.filter(l => l.status==='Pending');

  return (
    <div>
      <Section kicker="Leave year" title="Your balance" right={<Btn onClick={() => setOpen(true)}>Request leave &#8594;</Btn>}>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <Stat label="Entitlement" value={ent} sub="days" />
          <Stat label="Taken" value={taken} sub="approved" />
          <Stat label="Pending" value={pend} sub="with the office" />
          <Stat label="Remaining" value={remaining} sub={'sick days used '+sick+' of '+CONFIG.PAID_SICK_DAYS} warn={remaining<0} />
        </div>
      </Section>

      <Section kicker="History" title="Your requests">
        {mine.length===0 ? <Empty line="No requests yet." /> :
          <div className="space-y-3">{mine.map(l => (
            <div key={l.id} className="card p-5">
              <div className="flex flex-wrap items-start justify-between gap-3">
                <div>
                  <div className="font-display font-semibold text-ink">{l.type}</div>
                  <div className="text-sm text-mute mt-0.5">{fmt(l.start)}{l.start!==l.end?' to '+fmt(l.end):''} &middot; {l.days} {l.days===1?'day':'days'}</div>
                  {l.reason && <div className="text-sm text-inksoft mt-2">{l.reason}</div>}
                  {l.comment && <div className="text-sm text-mute mt-2 italic">Office: {l.comment}</div>}
                  {l.type==='Sick leave' && (l.certUrl
                    ? <a href={l.certUrl} target="_blank" rel="noopener" className="inline-block mt-2 text-xs font-semibold text-gold underline">Cert attached</a>
                    : <div className="mt-2 text-xs font-semibold text-fail">Cert outstanding</div>)}
                </div>
                <Badge status={l.status} />
              </div>
            </div>))}
          </div>}
      </Section>

      {isOffice && (
        <Section kicker="Office" title="Requests waiting on you">
          {queue.length===0 ? <Empty line="Nothing pending." /> :
            <div className="space-y-3">{queue.map(l => (
              <button key={l.id} onClick={() => { setDecide(l); setComment(''); }} className="card w-full text-left p-5 hover:border-gold">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div className="font-display font-semibold text-ink">{l.name}</div>
                    <div className="text-sm text-mute">{l.type} &middot; {fmt(l.start)}{l.start!==l.end?' to '+fmt(l.end):''} &middot; {l.days}d</div>
                  </div>
                  {l.type==='Sick leave' && !l.certUrl
                    ? <span className="pill px-3 py-1 bg-fail text-white text-xs font-semibold">No cert</span>
                    : <Badge status="Pending" />}
                </div>
              </button>))}
            </div>}
        </Section>
      )}

      <Modal open={open} onClose={() => setOpen(false)} title="Request leave">
        <div className="space-y-4">
          <Field label="Type">
            <select className="fld" value={form.type} onChange={e => setForm({...form, type:e.target.value})}>
              {['Annual leave','Sick leave','Unpaid leave','Parental leave','Force majeure'].map(t => <option key={t}>{t}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="From"><input type="date" className="fld" value={form.start} onChange={e => setForm({...form, start:e.target.value, end: e.target.value>form.end ? e.target.value : form.end})} /></Field>
            <Field label="To"><input type="date" className="fld" value={form.end} onChange={e => setForm({...form, end:e.target.value})} /></Field>
          </div>
          <label className="flex items-center gap-3 text-sm text-inksoft">
            <input type="checkbox" className="w-5 h-5 accent-[#C9A063]" checked={form.halfDay} onChange={e => setForm({...form, halfDay:e.target.checked, end: e.target.checked ? form.start : form.end})} />
            Half day only
          </label>
          <div className="pill bg-paper px-4 py-3 text-sm text-inksoft">
            <strong className="font-display">{days}</strong> working {days===1?'day':'days'}
            {form.type==='Annual leave' && <span className="text-mute"> &middot; {remaining-days} would remain</span>}
          </div>
          {form.type==='Sick leave' && (
            <Field label="Doctor's cert" hint="Attach it now or the office will chase it.">
              {form.certUrl ? <span className="pill px-3 py-1 text-xs font-semibold bg-[#E8F1EC] text-pass">Cert attached</span>
                : <label className="inline-flex items-center gap-2 pill bg-white border border-line px-4 py-2.5 text-sm font-semibold cursor-pointer hover:border-gold">
                    Attach cert<input type="file" accept="image/*,application/pdf" capture="environment" className="hidden" onChange={e => attachCert(e.target.files[0])} /></label>}
            </Field>
          )}
          <Field label="Reason, optional"><textarea className="fld" rows="3" value={form.reason} onChange={e => setForm({...form, reason:e.target.value})} /></Field>
          <div className="flex gap-3 pt-2"><Btn onClick={submit}>Send request</Btn><Btn kind="quiet" onClick={() => setOpen(false)}>Cancel</Btn></div>
        </div>
      </Modal>

      <Modal open={!!decide} onClose={() => setDecide(null)} title={decide ? decide.name+', '+decide.type : ''}>
        {decide && (
          <div className="space-y-4">
            <div className="rounded-2xl bg-paper p-4">
              <div className="text-sm text-inksoft">{fmt(decide.start)}{decide.start!==decide.end?' to '+fmt(decide.end):''} &middot; {decide.days} {decide.days===1?'day':'days'}</div>
              {decide.reason && <div className="text-sm text-mute mt-2">{decide.reason}</div>}
              {decide.type==='Sick leave' && (decide.certUrl
                ? <a href={decide.certUrl} target="_blank" rel="noopener" className="inline-block mt-2 text-xs font-semibold text-gold underline">View cert</a>
                : <div className="mt-2 text-xs font-semibold text-fail">No cert on file. Chase before payroll.</div>)}
            </div>
            <div>
              <span className="lbl">Cover check</span>
              {clashes.length===0 ? <p className="text-sm text-pass">Nobody else is off across those dates.</p>
                : <ul className="text-sm text-fail space-y-1">{clashes.map(c => <li key={c.id}>{c.name} is off {fmt(c.start)} to {fmt(c.end)}</li>)}</ul>}
            </div>
            <Field label="Note back to them, optional"><input className="fld" value={comment} onChange={e => setComment(e.target.value)} /></Field>
            <div className="flex gap-3 pt-1"><Btn onClick={() => settle('Approved')}>Approve</Btn><Btn kind="danger" onClick={() => settle('Declined')}>Decline</Btn></div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================== JOBS AND JOB SHEETS ============================== */
function Jobs({me, isOffice, jobs, setJobs, jobSheets, setJobSheets, products, setProducts, toast}){
  const [tab, setTab] = useState('board');
  const [jobForm, setJobForm] = useState(null);
  const [sheet, setSheet] = useState(null);       // job sheet being filled
  const [picker, setPicker] = useState(false);
  const [q, setQ] = useState('');

  const nextJobId = () => {
    const yr = new Date().getFullYear();
    const nums = jobs.map(j => Number(String(j.id).split('-')[2]||0)).filter(n => !isNaN(n));
    return CONFIG.JOB_PREFIX+'-'+yr+'-'+pad(Math.max(0,...nums)+1);
  };

  const saveJob = async () => {
    if(!jobForm.client || !jobForm.site) return toast('A client and a site are needed on every job.');
    const rec = {...jobForm};
    setJobs(list => { const i = list.findIndex(j => j.id===rec.id); const out = list.slice(); if(i>=0) out[i]=rec; else out.unshift(rec); return out; });
    await api('saveJob', rec);
    setJobForm(null); toast('Job '+rec.id+' saved.');
  };

  const newSheet = job => setSheet({ id:uid('JS'), jobId:job.id, staffId:me.id, name:me.name, date:iso(new Date()), lines:[], notes:'', status:'Draft' });
  const addLine = p => {
    setSheet(s => ({...s, lines:[...s.lines, { key:uid('L'), pid:p.pid, code:p.code, desc:p.desc, size:p.size, qtyOut:1, qtyBack:0, price:p.price }]}));
    setPicker(false); setQ('');
  };
  const setLine = (key, patch) => setSheet(s => ({...s, lines: s.lines.map(l => l.key===key ? {...l, ...patch} : l)}));
  const lineTotal = l => ((Number(l.qtyOut)||0) - (Number(l.qtyBack)||0)) * (Number(l.price)||0);
  const sheetTotal = sheet ? sheet.lines.reduce((a,l) => a+lineTotal(l), 0) : 0;

  const saveSheet = async status => {
    if(!sheet.lines.length) return toast('Add at least one item before saving.');
    const rec = {...sheet, status, total: Math.round(sheetTotal*100)/100 };
    setJobSheets(list => { const i = list.findIndex(s => s.id===rec.id); const out = list.slice(); if(i>=0) out[i]=rec; else out.unshift(rec); return out; });
    if(status==='Submitted'){
      setProducts(list => list.map(p => {
        const used = rec.lines.filter(l => l.pid===p.pid).reduce((a,l) => a+((Number(l.qtyOut)||0)-(Number(l.qtyBack)||0)), 0);
        return used ? {...p, stock: (Number(p.stock)||0) - used} : p;
      }));
    }
    await api('saveJobSheet', rec);
    setSheet(null);
    toast(status==='Submitted' ? 'Job sheet booked out. Stock adjusted.' : 'Draft saved.');
  };

  const results = useMemo(() => {
    const t = q.trim().toLowerCase();
    if(!t) return products.slice(0,40);
    return products.filter(p =>
      String(p.desc).toLowerCase().includes(t) || String(p.code).toLowerCase().includes(t) ||
      String(p.size).toLowerCase().includes(t) || String(p.pid).toLowerCase()===t).slice(0,60);
  }, [q, products]);

  const jobById = id => jobs.find(j => j.id===id);

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-6">
        {[['board','Job board'],['sheets','Job sheets']].map(t => (
          <button key={t[0]} onClick={() => setTab(t[0])}
            className={'pill px-5 py-2.5 text-sm font-display font-semibold border transition '+(tab===t[0]?'bg-ink text-white border-ink':'bg-white text-inksoft border-line hover:border-gold')}>{t[1]}</button>
        ))}
      </div>

      {tab==='board' && (
        <Section kicker="Register" title="Jobs"
          right={isOffice ? <Btn onClick={() => setJobForm({ id:nextJobId(), client:'', site:'', address:'', contact:'', type:'', status:'Open', opened:iso(new Date()), notes:'' })}>New job &#8594;</Btn> : null}>
          <div className="space-y-3">
            {jobs.map(j => {
              const mats = jobSheets.filter(s => s.jobId===j.id).reduce((a,s) => a+(s.total||0), 0);
              return (
                <div key={j.id} className="card p-5">
                  <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="min-w-0">
                      <div className="flex items-center gap-3">
                        <span className="font-display font-semibold text-ink">{j.id}</span><Badge status={j.status} />
                      </div>
                      <div className="text-sm text-inksoft mt-1">{j.site}</div>
                      <div className="text-xs text-mute mt-1">{j.client}{j.address ? ' \u00B7 '+j.address : ''}</div>
                      {mats>0 && <div className="text-xs text-golddeep font-semibold mt-2">Materials {eur(mats)}</div>}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <Btn kind="ghost" className="!px-4 !py-2 !text-sm" onClick={() => newSheet(j)}>Job sheet</Btn>
                      {isOffice && <Btn kind="quiet" className="!px-3 !py-2 !text-sm" onClick={() => setJobForm({...j})}>Edit</Btn>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </Section>
      )}

      {tab==='sheets' && (
        <Section kicker="Materials" title="Job sheets">
          {jobSheets.length===0 ? <Empty line="No job sheets yet. Open a job and tap Job sheet." /> :
            <div className="space-y-3">
              {jobSheets.map(s => (
                <button key={s.id} onClick={() => setSheet({...s})} className="card w-full text-left p-5 hover:border-gold">
                  <div className="flex flex-wrap justify-between items-start gap-3">
                    <div>
                      <div className="font-display font-semibold text-ink">{s.jobId}</div>
                      <div className="text-sm text-mute">{(jobById(s.jobId)||{}).site} &middot; {s.name} &middot; {fmt(s.date)}</div>
                    </div>
                    <div className="text-right">
                      <div className="font-display font-semibold text-ink">{eur(s.total)}</div>
                      <div className="mt-1"><Badge status={s.status} /></div>
                    </div>
                  </div>
                </button>
              ))}
            </div>}
        </Section>
      )}

      <Modal open={!!jobForm} onClose={() => setJobForm(null)} title={jobForm && jobs.some(j => j.id===jobForm.id) ? 'Edit '+jobForm.id : 'New job'}>
        {jobForm && (
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <Field label="Job number"><input className="fld" value={jobForm.id} onChange={e => setJobForm({...jobForm, id:e.target.value})} /></Field>
              <Field label="Status">
                <select className="fld" value={jobForm.status} onChange={e => setJobForm({...jobForm, status:e.target.value})}>
                  {['Open','Complete','Invoiced'].map(s => <option key={s}>{s}</option>)}
                </select>
              </Field>
            </div>
            <Field label="Client"><input className="fld" value={jobForm.client} onChange={e => setJobForm({...jobForm, client:e.target.value})} /></Field>
            <Field label="Site"><input className="fld" value={jobForm.site} onChange={e => setJobForm({...jobForm, site:e.target.value})} /></Field>
            <Field label="Address"><input className="fld" value={jobForm.address} onChange={e => setJobForm({...jobForm, address:e.target.value})} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Contact"><input className="fld" value={jobForm.contact} onChange={e => setJobForm({...jobForm, contact:e.target.value})} /></Field>
              <Field label="Work type"><input className="fld" value={jobForm.type} onChange={e => setJobForm({...jobForm, type:e.target.value})} placeholder="Boiler service" /></Field>
            </div>
            <Field label="Notes"><textarea className="fld" rows="3" value={jobForm.notes} onChange={e => setJobForm({...jobForm, notes:e.target.value})} /></Field>
            <div className="flex gap-3"><Btn onClick={saveJob}>Save job</Btn><Btn kind="quiet" onClick={() => setJobForm(null)}>Cancel</Btn></div>
          </div>
        )}
      </Modal>

      <Modal open={!!sheet} onClose={() => setSheet(null)} wide title={sheet ? 'Job sheet, '+sheet.jobId : ''}>
        {sheet && (
          <div className="space-y-5">
            <div className="grid sm:grid-cols-3 gap-3">
              <Field label="Job">
                <select className="fld" value={sheet.jobId} onChange={e => setSheet({...sheet, jobId:e.target.value})}>
                  {jobs.map(j => <option key={j.id} value={j.id}>{j.id}</option>)}
                </select>
              </Field>
              <Field label="Employee"><input className="fld" value={sheet.name} readOnly /></Field>
              <Field label="Date"><input type="date" className="fld" value={sheet.date} onChange={e => setSheet({...sheet, date:e.target.value})} /></Field>
            </div>

            <div className="space-y-2">
              {sheet.lines.map(l => (
                <div key={l.key} className="rounded-2xl bg-paper p-4">
                  <div className="flex justify-between items-start gap-3 mb-3">
                    <div className="min-w-0">
                      <div className="font-semibold text-sm text-ink">{l.desc}</div>
                      <div className="text-xs text-mute">{l.code} &middot; {l.size} &middot; {eur(l.price)} each</div>
                    </div>
                    <button onClick={() => setSheet(s => ({...s, lines: s.lines.filter(x => x.key!==l.key)}))} className="text-mute hover:text-fail">&times;</button>
                  </div>
                  <div className="grid grid-cols-3 gap-3 items-end">
                    <Field label="Taken"><input type="number" min="0" className="fld" value={l.qtyOut} onChange={e => setLine(l.key,{qtyOut:e.target.value})} /></Field>
                    <Field label="Returned"><input type="number" min="0" className="fld" value={l.qtyBack} onChange={e => setLine(l.key,{qtyBack:e.target.value})} /></Field>
                    <div className="text-right pb-2 font-display font-semibold text-ink">{eur(lineTotal(l))}</div>
                  </div>
                </div>
              ))}
              <button onClick={() => setPicker(true)} className="w-full py-3 rounded-2xl border-2 border-dashed border-line text-sm font-semibold text-mute hover:border-gold hover:text-ink">+ Add material</button>
            </div>

            <div className="flex justify-between items-center pill bg-ink text-white px-5 py-4">
              <span className="font-display font-semibold">Sheet total</span>
              <span className="font-display text-xl font-semibold">{eur(sheetTotal)}</span>
            </div>

            <Field label="Notes"><textarea className="fld" rows="2" value={sheet.notes} onChange={e => setSheet({...sheet, notes:e.target.value})} /></Field>
            <div className="flex flex-wrap gap-3">
              <Btn onClick={() => saveSheet('Submitted')}>Book out and send</Btn>
              <Btn kind="ghost" onClick={() => saveSheet('Draft')}>Save draft</Btn>
              <Btn kind="quiet" onClick={() => setSheet(null)}>Cancel</Btn>
            </div>
            <p className="text-xs text-mute">Booking out drops the quantity in stock by taken minus returned, the same sum as the spreadsheet.</p>
          </div>
        )}
      </Modal>

      <Modal open={picker} onClose={() => setPicker(false)} wide title="Pick a material">
        <input className="fld mb-4" autoFocus value={q} onChange={e => setQ(e.target.value)} placeholder="Search description, code or size" />
        <div className="space-y-2 max-h-[55vh] overflow-y-auto">
          {results.map(p => (
            <button key={p.pid} onClick={() => addLine(p)} className="w-full text-left rounded-2xl border border-line p-3 hover:border-gold flex justify-between gap-3">
              <div className="min-w-0">
                <div className="font-semibold text-sm text-ink truncate">{p.desc}</div>
                <div className="text-xs text-mute">{p.code} &middot; {p.size} &middot; {Number(p.stock)||0} in stock</div>
              </div>
              <div className="font-display font-semibold text-sm whitespace-nowrap">{eur(p.price)}</div>
            </button>
          ))}
          {results.length===0 && <p className="text-sm text-mute text-center py-6">Nothing matched. Try the code, like 315.</p>}
        </div>
      </Modal>
    </div>
  );
}

/* ============================== PRESSURE TESTS ============================== */
function PressureTests({me, jobs, tests, setTests, toast}){
  const [open, setOpen] = useState(false);
  const [view, setView] = useState(null);
  const [remaining, setRemaining] = useState(null);
  const tick = useRef(null);
  const empty = () => ({ id:uid('PT'), jobId:'', site:'', client:'', system:'Heating, sealed system', medium:'Water',
    standard:TEST_PRESETS['Heating, sealed system'].standard, unit:'bar', testPressure:'3', holdMins:30,
    startPressure:'', endPressure:'', ambient:'', engineer:me.name, regNo:me.rgi||'', witness:'', date:iso(new Date()),
    notes:'', photos:[], signature:'' });
  const [f, setF] = useState(empty);
  useEffect(() => () => clearInterval(tick.current), []);

  const set = p => setF(x => ({...x, ...p}));
  const preset = sys => { const p = TEST_PRESETS[sys]; set({ system:sys, medium:p.medium, standard:p.standard, testPressure:p.pressure, holdMins:p.hold, unit:p.unit }); };
  const tol = TEST_PRESETS[f.system] ? TEST_PRESETS[f.system].tol : 0;
  const result = useMemo(() => {
    const s = parseFloat(f.startPressure), e = parseFloat(f.endPressure);
    if(!isFinite(s)||!isFinite(e)) return '';
    return (s-e) <= tol+1e-9 ? 'Pass' : 'Fail';
  }, [f.startPressure, f.endPressure, tol]);

  const startHold = () => {
    if(!f.startPressure) return toast('Log the pressure at the start of the hold first.');
    clearInterval(tick.current);
    let left = (Number(f.holdMins)||0)*60; setRemaining(left);
    tick.current = setInterval(() => { left--; setRemaining(left);
      if(left<=0){ clearInterval(tick.current); toast('Hold finished. Read the gauge and log the end pressure.'); } }, 1000);
  };
  const addPhotos = async files => {
    for(const file of Array.from(files||[]).slice(0,8)){
      try {
        const data = await shrinkImage(file,1400,0.72);
        let url = data;
        const r = await api('upload', { folder:'Pressure tests', name:(f.jobId||'test')+'.jpg', data });
        if(r && r.url) url = r.url;
        setF(x => ({...x, photos:[...x.photos, { url, dataUrl:data, caption:'' }]}));
      } catch(err){ toast(err.message); }
    }
  };
  const save = async () => {
    if(!f.jobId && !f.site) return toast('Pick the job this test belongs to.');
    if(!f.startPressure || !f.endPressure) return toast('Log both the start and end pressure.');
    if(!f.signature) return toast('Sign the report before saving it.');
    const rec = {...f, result};
    setTests(list => [rec, ...list]);
    await api('savePressureTest', rec);
    setOpen(false); setF(empty()); setRemaining(null);
    toast('Test saved as '+result+'.');
  };

  return (
    <div>
      <Section kicker="Site records" title="Pressure tests" right={<Btn onClick={() => { setF(empty()); setOpen(true); }}>New test &#8594;</Btn>}>
        {tests.length===0 ? <Empty line="No tests logged yet." /> :
          <div className="grid sm:grid-cols-2 gap-3">
            {tests.map(t => (
              <button key={t.id} onClick={() => setView(t)} className="card p-5 text-left hover:border-gold">
                <div className="flex items-start justify-between gap-3 mb-2">
                  <div className="font-display font-semibold text-ink">{t.jobId||'No job'}</div><Badge status={t.result} />
                </div>
                <div className="text-sm text-inksoft">{t.site}</div>
                <div className="text-xs text-mute mt-2">{t.system} &middot; {t.testPressure} {t.unit} for {t.holdMins} min &middot; {fmt(t.date)}</div>
              </button>
            ))}
          </div>}
      </Section>

      <Modal open={open} onClose={() => setOpen(false)} wide title="Pressure test record">
        <div className="space-y-5">
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Job">
              <select className="fld" value={f.jobId} onChange={e => { const j = jobs.find(x => x.id===e.target.value); set({ jobId:e.target.value, site: j?j.site:f.site, client: j?j.client:f.client }); }}>
                <option value="">Not on the job list</option>
                {jobs.map(j => <option key={j.id} value={j.id}>{j.id+' \u00B7 '+j.site}</option>)}
              </select>
            </Field>
            <Field label="Date"><input type="date" className="fld" value={f.date} onChange={e => set({date:e.target.value})} /></Field>
            <Field label="Site"><input className="fld" value={f.site} onChange={e => set({site:e.target.value})} /></Field>
            <Field label="Client"><input className="fld" value={f.client} onChange={e => set({client:e.target.value})} /></Field>
          </div>
          <div className="grid sm:grid-cols-3 gap-3">
            <Field label="System"><select className="fld" value={f.system} onChange={e => preset(e.target.value)}>{Object.keys(TEST_PRESETS).map(k => <option key={k}>{k}</option>)}</select></Field>
            <Field label="Medium"><select className="fld" value={f.medium} onChange={e => set({medium:e.target.value})}>{['Water','Air','Nitrogen','Glycol'].map(m => <option key={m}>{m}</option>)}</select></Field>
            <Field label="Reference"><input className="fld" value={f.standard} onChange={e => set({standard:e.target.value})} /></Field>
          </div>

          <div className="rounded-3xl bg-paper p-5">
            <div className="grid sm:grid-cols-2 gap-5 items-center">
              <div className="grid grid-cols-2 gap-3">
                <Field label={'Test pressure, '+f.unit}><input className="fld" inputMode="decimal" value={f.testPressure} onChange={e => set({testPressure:e.target.value})} /></Field>
                <Field label="Hold, minutes"><input className="fld" inputMode="numeric" value={f.holdMins} onChange={e => set({holdMins:e.target.value})} /></Field>
                <Field label="At start"><input className="fld" inputMode="decimal" value={f.startPressure} onChange={e => set({startPressure:e.target.value})} /></Field>
                <Field label="At end"><input className="fld" inputMode="decimal" value={f.endPressure} onChange={e => set({endPressure:e.target.value})} /></Field>
                <Field label="Ambient, C"><input className="fld" inputMode="decimal" value={f.ambient} onChange={e => set({ambient:e.target.value})} /></Field>
                <div className="flex items-end">
                  <Btn kind="ghost" className="w-full !px-3" onClick={startHold}>
                    {remaining===null ? 'Start hold' : remaining>0 ? pad(Math.floor(remaining/60))+':'+pad(remaining%60) : 'Hold done'}
                  </Btn>
                </div>
              </div>
              <div className="text-center">
                <Gauge start={f.startPressure} end={f.endPressure} max={f.testPressure} unit={f.unit} />
                {result && <div className={'inline-block mt-1 pill px-6 py-2 font-display font-semibold '+(result==='Pass'?'bg-[#E8F1EC] text-pass':'bg-[#FBE9E7] text-fail')}>{result}</div>}
                <div className="text-xs text-mute mt-2">Allowable drop {tol} {f.unit}</div>
              </div>
            </div>
          </div>

          <div>
            <span className="lbl">Photos</span>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              {f.photos.map((p,i) => (
                <div key={i} className="card overflow-hidden">
                  <img src={p.dataUrl||p.url} alt="" className="w-full h-32 object-cover" />
                  <div className="p-2">
                    <input className="fld !py-1.5 !text-xs" value={p.caption} placeholder="Caption"
                      onChange={e => setF(x => { const ph = x.photos.slice(); ph[i] = {...ph[i], caption:e.target.value}; return {...x, photos:ph}; })} />
                    <button onClick={() => setF(x => ({...x, photos:x.photos.filter((_,j) => j!==i)}))} className="mt-1 text-[11px] text-mute hover:text-fail">Remove</button>
                  </div>
                </div>
              ))}
              <label className="card border-2 border-dashed border-line h-[7.5rem] flex flex-col items-center justify-center cursor-pointer hover:border-gold text-mute text-sm">
                <span className="text-2xl leading-none mb-1 text-gold">+</span>Add photo
                <input type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={e => addPhotos(e.target.files)} />
              </label>
            </div>
          </div>

          <Field label="Observations"><textarea className="fld" rows="3" value={f.notes} onChange={e => set({notes:e.target.value})} /></Field>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Engineer"><input className="fld" value={f.engineer} onChange={e => set({engineer:e.target.value})} /></Field>
            <Field label="Registration no."><input className="fld" value={f.regNo} onChange={e => set({regNo:e.target.value})} /></Field>
            <div className="sm:col-span-2"><Field label="Witnessed by"><input className="fld" value={f.witness} onChange={e => set({witness:e.target.value})} /></Field></div>
          </div>
          <Field label="Engineer signature"><SignaturePad value={f.signature} onChange={s => set({signature:s})} /></Field>
          <div className="flex flex-wrap gap-3">
            <Btn onClick={save}>Save test</Btn>
            <Btn kind="ghost" onClick={() => makePdf({...f, result}, toast)}>Preview PDF</Btn>
            <Btn kind="quiet" onClick={() => setOpen(false)}>Cancel</Btn>
          </div>
        </div>
      </Modal>

      <Modal open={!!view} onClose={() => setView(null)} wide title={view ? 'Test, '+(view.jobId||view.site) : ''}>
        {view && (
          <div className="space-y-4">
            <div className="grid sm:grid-cols-2 gap-4 items-center">
              <dl className="text-sm space-y-2">
                {[['Site',view.site],['Client',view.client],['System',view.system],['Medium',view.medium],
                  ['Reference',view.standard],['Test pressure',view.testPressure+' '+view.unit+' held '+view.holdMins+' min'],
                  ['Start to end',view.startPressure+' to '+view.endPressure+' '+view.unit],
                  ['Engineer',view.engineer+(view.regNo?', '+view.regNo:'')],['Date',fmt(view.date)]].map(r => (
                  <div key={r[0]} className="flex gap-3 border-b border-line pb-1.5">
                    <dt className="w-32 shrink-0 text-mute text-xs uppercase tracking-wider pt-0.5">{r[0]}</dt>
                    <dd className="text-ink">{r[1]||'Not recorded'}</dd>
                  </div>
                ))}
              </dl>
              <div className="text-center">
                <Gauge start={view.startPressure} end={view.endPressure} max={view.testPressure} unit={view.unit} />
                <div className={'inline-block pill px-6 py-2 font-display font-semibold '+(view.result==='Pass'?'bg-[#E8F1EC] text-pass':'bg-[#FBE9E7] text-fail')}>{view.result}</div>
              </div>
            </div>
            {view.notes && <p className="text-sm text-inksoft">{view.notes}</p>}
            <Btn onClick={() => makePdf(view, toast)}>Download PDF report</Btn>
          </div>
        )}
      </Modal>
    </div>
  );
}

function Admin({me, users, setUsers, products, setProducts, jobs, toast}){

    if(!form.name || !form.code) return toast('A name and a short sign in name are needed.');

    const rec = {...form};
    const payload = {...rec};
    if(rec.pin){ payload.pinHash = await hashPin(rec.pin); delete payload.pin; }
    setUsers(list => { const i = list.findIndex(u => u.id===rec.id); const out = list.slice(); if(i>=0) out[i]=rec; else out.push(rec); return out; });
    await api('saveUser', payload);

let LOGO_CACHE = null;
async function getLogo(){
  if(CONFIG.LOGO_DATA) return CONFIG.LOGO_DATA;   // no fetch, so no CORS to fight
  if(LOGO_CACHE !== null) return LOGO_CACHE;
  try {
    const r = await fetch(CONFIG.LOGO, { mode:'cors' });
    const b = await r.blob();
    LOGO_CACHE = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
  } catch(e){ LOGO_CACHE = ''; }
  return LOGO_CACHE;
}
async function makePdf(t, toast){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W = 210, M = 16, navy = [31,37,68], gold = [201,160,99], grey = [122,128,153];
  doc.setFillColor(...navy); doc.rect(0,0,W,34,'F');
  const logo = await getLogo();
  if(logo){
    try { doc.addImage(logo,'PNG',M,7,44,20); }
    catch(e){ doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('GLENVIEW HEATING', M, 19); }
  }
  else { doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('GLENVIEW HEATING', M, 19); }
  doc.setTextColor(255,255,255); doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(CONFIG.PHONE+'   '+CONFIG.WEB, W-M, 15, { align:'right' });
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('PRESSURE TEST CERTIFICATE', W-M, 24, { align:'right' });

  let y = 46;
  doc.setDrawColor(...gold); doc.setLineWidth(1.1); doc.line(M, y-8, M+16, y-8);
  const col = (W-M*2-8)/2;
  const pair = (l,v,x,yy,w) => {
    doc.setFontSize(7.5); doc.setTextColor(...grey); doc.setFont('helvetica','bold'); doc.text(String(l).toUpperCase(), x, yy);
    doc.setFontSize(10); doc.setTextColor(...navy); doc.setFont('helvetica','normal');
    doc.text(doc.splitTextToSize(String(v||'-'), w), x, yy+5);
  };
  pair('Job number', t.jobId, M, y, col); pair('Date of test', fmt(t.date), M+col+8, y, col); y += 15;
  pair('Site', t.site, M, y, col); pair('Client', t.client, M+col+8, y, col); y += 15;
  pair('System tested', t.system, M, y, col); pair('Test medium', t.medium, M+col+8, y, col); y += 15;
  pair('Reference standard', t.standard, M, y, W-M*2); y += 16;

  doc.setFillColor(246,244,240); doc.roundedRect(M, y, W-M*2, 30, 4, 4, 'F');
  const cells = [['Test pressure',t.testPressure+' '+t.unit],['Hold period',t.holdMins+' min'],
    ['At start',t.startPressure+' '+t.unit],['At end',t.endPressure+' '+t.unit],['Ambient',(t.ambient||'-')+' C']];
  const cw = (W-M*2)/cells.length;
  cells.forEach((c,i) => {
    doc.setFontSize(7); doc.setTextColor(...grey); doc.setFont('helvetica','bold'); doc.text(c[0].toUpperCase(), M+cw*i+5, y+9);
    doc.setFontSize(12); doc.setTextColor(...navy); doc.text(String(c[1]), M+cw*i+5, y+19);
  });
  y += 38;
  const pass = t.result==='Pass';
  doc.setFillColor(...(pass?[232,241,236]:[251,233,231])); doc.roundedRect(M, y, 46, 14, 7, 7, 'F');
  doc.setTextColor(...(pass?[46,125,91]:[178,58,52])); doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('RESULT: '+(t.result||'-').toUpperCase(), M+8, y+9.5);
  y += 22;
  if(t.notes){
    doc.setFontSize(7.5); doc.setTextColor(...grey); doc.setFont('helvetica','bold'); doc.text('OBSERVATIONS', M, y); y += 5;
    doc.setFontSize(9.5); doc.setTextColor(...navy); doc.setFont('helvetica','normal');
    const lines = doc.splitTextToSize(t.notes, W-M*2); doc.text(lines, M, y); y += lines.length*4.6+8;
  }
  doc.setFontSize(7.5); doc.setTextColor(...grey); doc.setFont('helvetica','bold');
  doc.text('TESTED BY', M, y); doc.text('WITNESSED BY', M+col+8, y);
  if(t.signature){ try { doc.addImage(t.signature,'PNG',M,y+2,44,16); } catch(e){} }
  doc.setDrawColor(220,215,205); doc.setLineWidth(0.3);
  doc.line(M, y+20, M+col-6, y+20); doc.line(M+col+8, y+20, W-M, y+20);
  doc.setFontSize(9.5); doc.setTextColor(...navy); doc.setFont('helvetica','normal');
  doc.text(String(t.engineer||'')+(t.regNo?'   '+t.regNo:''), M, y+25);
  doc.text(String(t.witness||'-'), M+col+8, y+25);

  const photos = (t.photos||[]).filter(p => p.dataUrl || String(p.url||'').startsWith('data:'));
  if(photos.length){
    doc.addPage(); doc.setFillColor(...navy); doc.rect(0,0,W,18,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('SITE PHOTOGRAPHS  \u00B7  '+(t.jobId||''), M, 12);
    let px = M, py = 28; const pw = (W-M*2-6)/2, ph = 58;
    photos.slice(0,8).forEach((p,i) => {
      try { doc.addImage(p.dataUrl||p.url,'JPEG',px,py,pw,ph); } catch(e){}
      doc.setFontSize(8); doc.setTextColor(...grey); doc.setFont('helvetica','normal');
      doc.text(doc.splitTextToSize(p.caption||('Photo '+(i+1)), pw), px, py+ph+4.5);
      if(i%2===0) px = M+pw+6; else { px = M; py += ph+14; }
      if(py > 250 && i < photos.length-1){ doc.addPage(); py = 20; px = M; }
    });
  }
  const pages = doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(...grey); doc.setFont('helvetica','normal');
    doc.text(CONFIG.COMPANY+'  \u00B7  '+CONFIG.PHONE+'  \u00B7  '+CONFIG.WEB, M, 289);
    doc.text('Page '+i+' of '+pages, W-M, 289, { align:'right' });
  }
  doc.save('Pressure test '+(t.jobId||'report')+'.pdf');
  if(toast) toast('PDF generated.');
}

function App(){
  const [users, setUsers] = useState(() => store.get('gh_users', seedUsers()));
  const [me, setMe] = useState(null);
  const [booted, setBooted] = useState(false);
  const [tab, setTab] = useState('home');
  const [sheets, setSheets] = useState(() => store.get('gh_sheets', seedSheets()));
  const [leave, setLeave] = useState(() => store.get('gh_leave', seedLeave()));
  const [jobs, setJobs] = useState(() => store.get('gh_jobs', seedJobs()));
  const [jobSheets, setJobSheets] = useState(() => store.get('gh_jobsheets', seedJobSheets()));
  const [tests, setTests] = useState(() => store.get('gh_tests', seedTests()));
  const [products, setProducts] = useState(() => store.get('gh_products', PRODUCTS_SEED));
  const [msg, setMsg] = useState('');
  const toast = useCallback(m => setMsg(m), []);

  /* remembered device: sign straight back in */
  useEffect(() => {
    (async () => {
      const dev = store.get('gh_device', null);
      if(dev && dev.until > Date.now()){
        if(CONFIG.API_URL){
          const r = await api('session', {});
          if(r && r.ok && r.user) setMe(r.user);
        } else {
          const u = users.find(x => x.id===dev.userId && x.active);
          if(u) setMe(u);
        }
      }
      setBooted(true);
    })();
  }, []);

  useEffect(() => store.set('gh_users', users), [users]);
  useEffect(() => store.set('gh_sheets', sheets), [sheets]);
  useEffect(() => store.set('gh_leave', leave), [leave]);
  useEffect(() => store.set('gh_jobs', jobs), [jobs]);
  useEffect(() => store.set('gh_jobsheets', jobSheets), [jobSheets]);
  useEffect(() => store.set('gh_tests', tests), [tests]);
  useEffect(() => store.set('gh_products', products), [products]);

  const signOut = () => { store.del('gh_device'); store.del('gh_token'); setMe(null); setTab('home'); };

  if(!booted) return <div className="min-h-screen bg-ink" />;
  if(!me) return (<><Login users={users} toast={toast} onIn={u => { setMe(u); setTab('home'); }} /><Toast msg={msg} onDone={() => setMsg('')} /></>);

  const isOffice = me.role==='Office' || me.role==='Admin';
  const isAdmin = me.role==='Admin';
  const tabs = [
    { id:'home', label: isOffice ? 'Dashboard' : 'Today' },
    { id:'time', label:'Timesheets' },
    { id:'leave', label:'Leave' },
    { id:'jobs', label:'Jobs' },
    { id:'test', label:'Tests' }
  ].concat(isAdmin ? [{ id:'admin', label:'Admin' }] : []);
  const pending = leave.filter(l => l.status==='Pending').length + sheets.filter(s => s.status==='Submitted').length;

  return (
    <div className="min-h-screen pb-28 sm:pb-12">
      <header className="bg-ink text-white">
        <div className="max-w-5xl mx-auto px-5 pt-5 pb-6">
          <div className="flex items-center justify-between gap-4">
            <Logo />
            <div className="flex items-center gap-3">
              {isOffice && pending>0 && <span className="pill bg-gold text-white text-xs font-semibold px-3 py-1.5">{pending} to action</span>}
              <button onClick={signOut} className="pill bg-white/10 border border-white/20 text-white text-sm px-4 py-2 hover:bg-white/20">Sign out</button>
            </div>
          </div>
          <div className="mt-6">
            <div className="text-[.68rem] font-semibold tracking-[.16em] uppercase text-gold">Staff portal</div>
            <h1 className="font-display text-[1.7rem] sm:text-4xl font-semibold mt-1 leading-tight">
              {isOffice ? 'Approvals and records' : 'Good day, '+me.name.split(' ')[0]}
            </h1>
            <p className="text-white/60 text-sm mt-1.5">{me.trade}{me.rgi ? ' \u00B7 '+me.rgi : ''}</p>
          </div>
        </div>
        <nav className="hidden sm:block max-w-5xl mx-auto px-5">
          <div className="flex gap-1">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={'px-5 py-3 rounded-t-2xl font-display font-semibold text-sm transition '+(tab===t.id?'bg-paper text-ink':'text-white/65 hover:text-white')}>{t.label}</button>
            ))}
          </div>
        </nav>
      </header>

      <main className="max-w-5xl mx-auto px-5 pt-8">
        {tab==='home'  && <Dashboard me={me} isOffice={isOffice} users={users} sheets={sheets} leave={leave} jobs={jobs} jobSheets={jobSheets} tests={tests} go={setTab} />}
        {tab==='time'  && <Timesheets me={me} isOffice={isOffice} sheets={sheets} setSheets={setSheets} jobs={jobs} toast={toast} />}
        {tab==='leave' && <LeaveModule me={me} isOffice={isOffice} leave={leave} setLeave={setLeave} toast={toast} />}
        {tab==='jobs'  && <Jobs me={me} isOffice={isOffice} jobs={jobs} setJobs={setJobs} jobSheets={jobSheets} setJobSheets={setJobSheets} products={products} setProducts={setProducts} toast={toast} />}
        {tab==='test'  && <PressureTests me={me} jobs={jobs} tests={tests} setTests={setTests} toast={toast} />}
        {tab==='admin' && isAdmin && <Admin me={me} users={users} setUsers={setUsers} products={products} setProducts={setProducts} jobs={jobs} toast={toast} />}

        <footer className="mt-14 pt-6 border-t border-line text-center text-xs text-mute">
          <div className="font-display font-semibold text-ink text-sm">{CONFIG.COMPANY}</div>
          <div className="mt-1">{CONFIG.PHONE} &middot; {CONFIG.WEB}</div>
          <div className="mt-3">Built by Protech Dynamic Solutions Ltd. &copy; 2026 Protech Dynamic Solutions Ltd.</div>
          {!CONFIG.API_URL && <div className="mt-2 text-gold font-semibold">Demo mode. Data stays on this device until the Sheets backend is connected.</div>}
        </footer>
      </main>

      <nav className="sm:hidden fixed bottom-0 inset-x-0 bg-white border-t border-line z-30">
        <div className="flex">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={'flex-1 py-4 text-[.7rem] font-display font-semibold '+(tab===t.id?'text-ink border-t-[3px] border-gold -mt-[1px]':'text-mute')}>{t.label}</button>
          ))}
        </div>
      </nav>

      <Toast msg={msg} onDone={() => setMsg('')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
