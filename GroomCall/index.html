<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B6E7F">
<meta name="description" content="GroomCall demo: open grooming slots at Perth daycares, filled by on call groomers.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%230B6E7F%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%3E%3Ccircle%20cx%3D%227%22%20cy%3D%228%22%20r%3D%222.5%22%2F%3E%3Ccircle%20cx%3D%227%22%20cy%3D%2216%22%20r%3D%222.5%22%2F%3E%3Cpath%20d%3D%22M9.2%209.2L19%2019M9.2%2014.8L19%205%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>GroomCall Showcase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Light only. Layout: chapter strip on top, live phones and panels on the stage, narration beside it on wide screens, above it with one panel at a time on phones */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --sunk:#F5F8F9; --ink:#10242B; --muted:#56707A; --line:#D3DFE2;
  --accent:#0B6E7F; --accent-ink:#FFFFFF; --accent-soft:#DDEFF2;
  --gold:#E8A317; --gold-soft:#FCEFCF; --gold-ink:#6B4500; --gold-btn:#2A1B00;
  --ok:#2C7A47; --ok-soft:#E1F1E6; --no:#A3392F; --no-soft:#F6E1DE;
  --sea:#D3E6EB; --river:#B5D6DE; --shadow:0 10px 30px rgba(16,36,43,.12); --finger:rgba(16,36,43,.28);
  color-scheme:light;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-0.01em}
p{margin:0}
.ti{width:1em;height:1em;flex:none;vertical-align:-0.14em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button,.btnlink{font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:9px 14px;min-height:42px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .12s,filter .12s}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.gold{background:var(--gold);color:var(--gold-btn);border-color:var(--gold)}
button:disabled{opacity:.5;cursor:default}
button.mini{min-height:34px;padding:5px 10px;font-size:13px}
.pressed{transform:scale(.95);filter:brightness(.92)}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark .ti{width:22px;height:22px}
.brand h1{font-size:28px;line-height:1}
.brand p{margin-top:4px;color:var(--muted);font-size:14px;max-width:52ch}
.hctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modes{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.modes button{border:0;background:transparent;color:var(--muted);min-height:36px;padding:6px 14px}
.modes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.iconbtn{width:44px;padding:0}

/* chapters */
.chapters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.chip{flex:none;font-size:13px;min-height:36px;padding:6px 12px;border-radius:99px;color:var(--muted)}
.chip.seen{color:var(--ink)}
.chip[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.narr{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));grid-column:2;grid-row:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.narr h2{font-size:24px;line-height:1.15}
.narr p{font-size:15px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:600}
.hood{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.hood p{font-size:13.5px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:44px 1fr auto;gap:8px}
.ctl button[data-act="prev"]{padding:0}
.narr ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stagecol{grid-column:1;grid-row:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.stage{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start}
.ptabs{display:none;gap:6px;overflow-x:auto}
.ptabs button{flex:none;min-height:36px;font-size:13px;padding:6px 12px;border-radius:99px;color:var(--muted)}
.ptabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.note{font-size:12px;color:var(--muted)}
.foot{text-align:center}
.mbar{display:none}

/* panels */
.panel{display:flex;flex-direction:column;gap:8px;min-width:0}
.panel.is-phone{width:310px}
.panel.is-card{width:360px}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 6px}
.ptitle h3{font-size:16px}
.ptitle span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:right}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:10px;position:relative;overflow:hidden;transition:box-shadow .3s}
.phone.lit{box-shadow:0 0 0 3px var(--gold)}
.screen{background:var(--sunk);border-radius:22px;height:600px;overflow-y:auto;padding:0 12px 14px;display:flex;flex-direction:column;gap:10px;position:relative;scrollbar-width:thin}
.cardpanel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.pbody{display:flex;flex-direction:column;gap:12px;position:relative}
.shead{position:sticky;top:0;z-index:2;background:var(--sunk);padding:12px 0 6px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.apptabs{display:flex;gap:4px}
.apptabs button{flex:1;min-height:34px;padding:4px;font-size:13px;color:var(--muted)}
.apptabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);border-color:transparent}

/* cards inside phones */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:16px}
.sub{font-size:13px;color:var(--muted)}
.sub.ok{color:var(--ok);font-weight:600}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.err{font-size:13px;color:var(--no);font-weight:600;min-height:0}
.err:empty{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
select,input{font:inherit;font-size:14px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);width:100%;min-width:0;min-height:40px}
input.typing{outline:2px solid var(--accent);outline-offset:1px}
.tier{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.tier b{font-weight:600}
.tier .sub{white-space:nowrap}
select{padding-right:4px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;align-self:flex-start}
.pill.sm{font-size:11px;padding:2px 8px;margin-top:4px}
.p-gold{background:var(--gold-soft);color:var(--gold-ink)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.p-no{background:var(--no-soft);color:var(--no)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.slot div{min-width:0}
.slot p{font-size:14px;font-weight:600}
.slot small{color:var(--muted);font-size:12px}
.slot .pill{align-self:center}
.rows{display:flex;flex-direction:column;gap:6px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px}
.row>span:first-child{color:var(--muted)}
.row>span:last-child{text-align:right}
.row.tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.row.tot>span:first-child{color:var(--ink)}
.alert{border:2px solid var(--gold)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:100%;transition:width .1s linear}
.dog{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.grow1{flex:1;min-width:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none;font-size:13px}
.av.lg{width:44px;height:44px;font-size:18px}
.tick{width:28px;height:28px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.feed ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.feed li{list-style:none;display:flex;gap:8px}
.feed time{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;flex:none;min-width:52px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle .tl{font-weight:600;font-size:14px}
.sw{width:46px;height:26px;min-height:26px;border-radius:99px;border:0;padding:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:23px}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:14px;align-items:center}
.empty .ti{width:30px;height:30px}
.empty b{color:var(--ink)}
.notice{display:flex;gap:8px;align-items:flex-start;background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;padding:10px;font-size:13px}
.okbox{display:flex;gap:10px;align-items:center;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px;font-size:13px}
.okbox b,.okbox small{display:block}
.okbox small{color:var(--ink);opacity:.8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.grow-row{display:flex;gap:6px;align-items:center}
.gsel{flex:1;justify-content:flex-start;text-align:left;border:1px solid transparent;background:transparent;padding:6px;min-height:48px;gap:10px}
.gsel[aria-pressed="true"]{background:var(--accent-soft)}
.gsel b,.gsel small{display:block}
.gsel small{color:var(--muted);font-weight:500;font-size:12px}
.star{width:40px;padding:0;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--gold);background:var(--gold-soft);border-color:transparent}
.star[aria-pressed="true"] .ti{fill:currentColor}
.stars{display:flex;align-items:center;gap:4px;color:var(--gold);font-size:14px}
.stars b{color:var(--ink)}
.stars .ti.filled{fill:currentColor}
.att{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.att b,.att small{display:block}
.att small{color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.checks li>.ti,.checks li>.spin{margin-top:3px}
.checks b,.checks small{display:block}
.checks small{color:var(--muted)}
.checks li.ok>.ti{color:var(--ok)}
.checks li.wait{opacity:.6}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.tile{border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.tile b,.tile small{display:block}
.tile small{color:var(--muted)}
.obsteps{display:flex;gap:4px}
.obsteps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.obsteps i.on{background:var(--accent)}
.plain{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.howto{display:flex;flex-direction:column;gap:8px}
.hstep{display:flex;gap:10px;align-items:center;font-size:13px}
.hicon{width:34px;height:34px;border-radius:9px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.hicon.mk{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sysdlg{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.sysdlg b{font-size:14px}
.sysdlg small{color:var(--muted);font-size:12px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics.sm{max-width:120px;gap:4px;margin-top:6px}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-align:center}
.pic{width:100%;height:auto;display:block;border-radius:10px}
.picbg{fill:var(--sunk)}
.head{fill:var(--gold-soft);stroke:var(--gold-ink);stroke-width:.6}
.ear{fill:var(--gold)}
.eye,.nose{fill:var(--ink)}
.fur{fill:none;stroke:var(--gold-ink);stroke-width:1.1;stroke-linecap:round}
.bow{fill:var(--accent)}

/* push banner and finger */
.banner{position:absolute;top:16px;left:16px;right:16px;z-index:5;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;line-height:1.35;animation:bannerIn .45s cubic-bezier(.2,.8,.2,1)}
.banner.out{animation:bannerOut .45s forwards}
@keyframes bannerIn{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
@keyframes bannerOut{to{transform:translateY(-130%);opacity:0}}
.bmark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.btxt{display:grid;grid-template-columns:1fr auto;gap:0 8px;min-width:0}
.btxt b{font-weight:600}
.bnow{color:var(--muted)}
.btxt span:last-child{grid-column:1/-1}
#fingers{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:60}
.finger{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--finger);border:2px solid var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:left .6s cubic-bezier(.3,.7,.2,1),top .6s cubic-bezier(.3,.7,.2,1),opacity .25s,transform .15s}
.finger.on{opacity:1}
.finger.tap{transform:scale(.78)}
.finger::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);opacity:0}
.finger.tap::after{animation:ripple .5s ease-out}
@keyframes ripple{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}

/* map */
.map svg{width:100%;height:auto;display:block;border-radius:14px}
.map .land{fill:var(--sunk)}
.map .sea{fill:var(--sea)}
.map .river{fill:none;stroke:var(--river);stroke-width:9;stroke-linecap:round}
.map .radius{fill:var(--accent-soft);fill-opacity:.5;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:6 5}
.map text{font-family:var(--body);font-size:11.5px;fill:var(--ink);font-weight:500}
.map .place{fill:var(--muted);font-size:10.5px}
.map .sealbl{fill:var(--muted);font-size:12px;letter-spacing:2px}
.map .cml{font-weight:600;fill:var(--accent)}
.cm circle{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.cm path{stroke:var(--accent-ink);stroke-width:2.4;stroke-linecap:round;fill:none}
.gd .dot{fill:var(--line);stroke:var(--surface);stroke-width:2.5}
.gd.alert .dot{fill:var(--gold)}
.gd.won .dot{fill:var(--ok)}
.gd.won text{font-weight:700;fill:var(--ok)}
.gd.pass .dot,.gd.lost .dot{fill:var(--muted)}
.gd.pass text,.gd.lost text,.gd.skip text{fill:var(--muted)}
.gd.skip .dot{fill:var(--surface);stroke:var(--muted);stroke-width:1.8;stroke-dasharray:3 2.5}
.gd .ping{fill:none;stroke:var(--gold);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ping 1.4s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.wave{fill:none;stroke:var(--gold);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:wave 1.6s ease-out forwards}
@keyframes wave{from{transform:scale(.05);opacity:1}to{transform:scale(1);opacity:0}}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.k{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--line)}
.k.alert{background:var(--gold)} .k.won{background:var(--ok)} .k.pass{background:var(--muted)}
.k.skip{background:transparent;border:1.5px dashed var(--muted)}
.k.c{border-radius:3px;background:var(--accent-soft);border:1px solid var(--accent)} .k.a{border-radius:3px;background:var(--gold)}
.k.f{border-radius:3px;background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 3px,var(--line) 3px,var(--line) 5px)}
.skips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.skips b{color:var(--ink);font-weight:600}
.mstat{font-size:14px}

/* race */
.log{list-style:none;margin:0;font-variant-numeric:tabular-nums;font-size:12.5px;display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:12px;padding:10px 12px;min-height:118px}
.log li{display:flex;gap:10px}
.log .t{color:var(--muted);flex:none}
.log li.ok span:last-child{color:var(--ok);font-weight:600}
.log li.no span:last-child{color:var(--no);font-weight:600}
.grid20{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.grid20 i{aspect-ratio:3/5;border-radius:5px;background:var(--line);border:1px solid var(--line)}
.grid20 i.win{background:var(--ok);border-color:var(--ok)}
.grid20 i.lose{background:var(--sunk)}
.grid20.flick i.win{animation:pop .35s}
.score{font-size:14px;font-variant-numeric:tabular-nums}

/* capacity */

.seg{height:100%;border-right:2px solid var(--surface);display:grid;place-items:center;font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;flex:none}
.seg.c{background:var(--accent-soft);color:var(--accent)}
.seg.a{background:var(--gold);color:var(--gold-btn)}
.grow{animation:grow .7s ease-out;transform-origin:left}

.offer{display:flex;gap:10px;align-items:center;font-size:13px}
.offer b,.offer small{display:block}
.offer small{color:var(--muted)}

/* money */
.mblock{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mtot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.total{font-family:var(--display);font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.split{display:flex;height:30px;border-radius:8px;overflow:hidden;transform-origin:left}
.split span{flex:1;display:grid;place-items:center;font-size:12px;font-weight:600}
.split .g{background:var(--accent-soft);color:var(--accent)}
.split .c{background:var(--ok-soft);color:var(--ok)}

/* rules */
.seg-btns{display:grid;gap:6px}
.seg-btns button{justify-content:flex-start}
.seg-btns button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tl{display:flex;flex-direction:column;gap:4px}
.tlbar{position:relative;height:14px;border-radius:7px;background:var(--sunk);border:1px solid var(--line)}
.tlbar .late{position:absolute;top:0;bottom:0;right:0;width:50%;background:var(--gold-soft);border-radius:0 7px 7px 0}
.tlbar .mk{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.tlx{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.outs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.outs li{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--sunk)}
.outs li .ti{color:var(--accent)}
.meter{display:inline-flex;align-items:center;gap:3px}
.meter i{width:14px;height:10px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--gold)}

.enter{animation:drop .45s ease-out both}
@keyframes drop{from{transform:translateY(-12px);opacity:.3}to{transform:none;opacity:1}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:none}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
body.paused .ping,body.paused .wave,body.paused .spin{animation-play-state:paused}

  .stagecol{grid-row:2}

/* actions */
function archive() {
  const s = S.slot; S.other.push({ day: s.day, time: s.time, dogs: s.dogs, pay: s.pay, groomer: s.groomer, st: 'confirmed' });
  Object.values(S.g).forEach(g => { g.alerted = g.declined = g.taken = false; });
  S.offers = []; S.job = { done: {}, photos: {}, checkIn: '', checkOut: '' }; S.slot = null;
}
function post() {
  const f = S.form, dogs = parseInt(f.dogs, 10), pay = parseFloat(f.pay);
  if (S.slot && S.slot.st !== 'confirmed') return;
  if (!(dogs >= 1 && dogs <= 12)) { S.err = 'Enter between 1 and 12 dogs.'; mark('err'); render(); return; }
  if (!(pay >= 50)) { S.err = 'Pay needs to be at least A$50.'; mark('err'); render(); return; }
  if (S.slot) archive();
  S.err = '';
  const s = S.slot = { day: f.day, time: f.hours, mins: HOURS[f.hours], dogs, pay, st: 'fav', groomer: '', filledAt: '' };
  let n = 0;
  Object.keys(G).forEach(id => { if (isFav(id) && !reason(id)) { S.g[id].alerted = true; n++; } });
  S.hs = { elapsed: 0, running: MODE === 'sandbox' };
  log(`Slot posted. ${n} favourite${n === 1 ? '' : 's'} alerted.`);
  mark('post');
  motion('centre', 'snip', 'Sending alert', `${n} favourites first, then everyone nearby`, 1300);
  if (S.g.jess.alerted) push('jess', alertCopy(s, true));
  render();
}
function openToAll() {
  const s = S.slot; if (!s || s.st !== 'fav') return;
  s.st = 'all'; S.hs.running = false; let n = 0;
  Object.keys(G).forEach(id => { const g = S.g[id]; if (!g.alerted && !g.declined && !reason(id)) { g.alerted = true; n++; } });
  log(`Head start over. ${n} more groomer${n === 1 ? '' : 's'} alerted.`);
  mark('wave');
  if (S.g.priya.alerted) push('priya', alertCopy(s, false));
  if (!S.g.jess.declined && S.g.jess.alerted) mark('jess-all');
  if (MODE === 'sandbox' && (S.g.jess.declined || !S.g.jess.alerted)) later(() => accept('priya'), 4000);
  render();
}
function pass(id) {
  const s = S.slot; if (!s || !(s.st === 'fav' || s.st === 'all')) return;
  S.g[id].declined = true; log(G[id].name + ' passed');
  if (MODE === 'sandbox' && id === 'jess' && s.st === 'all') later(() => accept('priya'), 4000);
  render();
}
function accept(id) {
  const s = S.slot;
  if (!s || !(s.st === 'fav' || s.st === 'all')) { S.g[id].taken = true; mark('taken'); render(); return { ok: false, reason: 'taken' }; }
  if (s.st === 'fav' && !isFav(id)) return { ok: false, reason: 'favourites' };
  s.st = 'filled'; s.groomer = id; s.filledAt = S.when.time; S.hs.running = false;
  Object.keys(S.g).forEach(o => { if (o !== id && S.g[o].alerted && !S.g[o].declined) S.g[o].taken = true; });
  log(`${G[id].name} accepted ${dayLong(s)}`);
  mark('fill');
  if (id === 'jess' || id === 'priya') motion(id, 'waggy', "It's yours", `${dayLong(s)} ${s.time} at Osborne Park`, 2000);
  push('centre', `${G[id].name} is in for ${dayLong(s)} ${s.time}.`);
  if (id !== 'jess' && S.g.jess.alerted && !S.g.jess.declined) push('jess', "That one's gone to another groomer. We'll ping you for the next one.");
  if (MODE === 'sandbox') later(sendOffers, 1600);

}
function sendOffers() {
  const s = S.slot; if (!s || !s.groomer || S.offers.length) return;
  const cands = ODOGS.filter(d => d.day === s.day && (d.id !== 'biscuit' || S.owner.on));
  if (!cands.length) { log('No opted in dogs at daycare that day'); render(); return; }
  if (freeMins() < Math.min(...cands.map(d => SIZE_MIN[d.size]))) { log('No spare time on the table for owner grooms'); render(); return; }
  S.offers = cands.map(d => ({ dog: d.id, st: 'sent' }));
  log(`Groom offers sent to ${cands.length} owners`);
  mark('offers');
  if (S.offers.some(o => o.dog === 'biscuit')) push('owner', `A groomer is in on ${dayLong(s)}. Add a full groom for Biscuit for A$95?`);
  if (MODE === 'sandbox') { later(() => book('bella'), 6000); later(() => book('luna'), 9000); }
  render();
}
function book(id) {

  o.st = 'booked'; mark('book-' + id);
  if (id === 'biscuit') motion('owner', 'bath', 'Booking the groom', 'Checking there is room on the table', 1300, () => motion('owner', 'waggy', 'Groom booked', 'A$95 at pickup', 1700));
  log(`${d.owner} added a groom for ${d.name}, ${money(d.price)}`);

  render();
}

    ${fav ? `${MO.fetch(hsP())}<p class="sub">Head start for favourites: <span class="hs-left">10 min left</span></p>` : ''}
    <div class="rows"><div class="row"><span>Dogs</span><span>${s.dogs} booked</span></div><div class="row"><span>Pay</span><span><b>${money(s.pay)}</b> for the slot</span></div><div class="row"><span>Supplied</span><span>${CENTRE.kit}</span></div></div>

function jessPay() { const s = S.slot; return s && s.groomer === 'jess' ? s.pay + addonCount() * ADDON * SHARE : 0; }
function earnedNow() { const s = S.slot; return s && s.groomer === 'jess' && (s.st === 'done' || s.st === 'confirmed') ? jessPay() : 0; }
function gHome(id) {
  const s = S.slot, g = S.g[id], open = s && (s.st === 'fav' || s.st === 'all');
  let h = '';
  if (s && s.groomer === id) h += gBrief(id);
  else if (open && g.alerted && !g.declined && !g.taken) h += gAlert(id);
  else if (s && g.taken) h += `<div class="card empty${fx('fill', ' enter')}${fx('taken', ' enter')}">${ic('moon')}<b>Slot filled</b>That one's gone to another groomer. We'll ping you for the next one.</div>`;
  else if (open && g.declined) h += `<div class="card empty">${ic('moon')}You passed on Osborne Park. We'll ping you for the next one.</div>`;
  else h += `<div class="card empty">${ic('bell')}No open slots right now. Alerts come straight to your phone.</div>`;
  if (id === 'jess') h += `<div class="card"><span class="lbl">October so far</span><div class="big">${money(1580 + earnedNow())}</div><p class="sub">Paid every Friday for finished slots</p></div>`;
  else h += `<div class="card"><span class="lbl">This week</span><p class="sub">2 slots booked at other centres</p></div>`;
  return h;
}
function gEarn() {
  const s = S.slot, mine = s && s.groomer === 'jess', n = mine ? addonCount() : 0, pay = jessPay(), earned = earnedNow();
  return `<div class="card"><span class="lbl">October so far</span><div class="big count" data-to="${1580 + earned}">${money(1580 + earned)}</div><p class="sub">${7 + (earned ? 1 : 0)} slots across 3 centres</p></div>

/* map */
function mapState(id) {
  const s = S.slot, g = S.g[id];
  if (!s) return reason(id) ? 'skip' : 'idle';

  m.innerHTML = `${MO[kind]()}<b>${title}</b>${sub ? `<small>${sub}</small>` : ''}`;

}

  f.style.left = x + 'px'; f.style.top = y + 'px';
}
const relTop = (el, sc) => el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
async function ensureVisible(el) {
  const sc = el.closest('.screen');
  if (sc) {
    const top = relTop(el, sc);
    if (top < sc.scrollTop + 80 || top + el.offsetHeight > sc.scrollTop + sc.clientHeight - 16) {
      sc.scrollTo({ top: Math.max(0, top - sc.clientHeight / 2 + el.offsetHeight / 2), behavior: reduceMotion ? 'auto' : 'smooth' }); await wait(450);
    }
  }
  if (isNarrow()) { const r = el.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight - 100) { window.scrollBy({ top: r.top - innerHeight / 2, behavior: reduceMotion ? 'auto' : 'smooth' }); await wait(450); } }
}
async function scrollScreen(id, sel) {
  const sc = SCREENS[id], el = sc && sc.querySelector(sel); if (!el) return;
  sc.scrollTo({ top: Math.max(0, relTop(el, sc) - 70), behavior: reduceMotion ? 'auto' : 'smooth' }); await wait(600);
}
async function tap(id, sel, opt = {}) {
  if (isNarrow() && focusId !== id) setFocus(id);
  const root = panelEl(id); let el = root && root.querySelector(sel);
  if (!el) return false;
  await ensureVisible(el);
  const f = opt.finger === 2 ? F2 : F1;
  moveFinger(f, el); await wait(opt.fast ? 380 : 700);
  f.classList.add('tap'); el.classList.add('pressed'); await wait(200);
  f.classList.remove('tap'); el.classList.remove('pressed');
  el = root.querySelector(sel) || el;
  if (!opt.noClick) el.click();
  await wait(250);
  return true;
}
async function typeInto(id, sel, text) {
  if (!await tap(id, sel, { noClick: true })) return;
  const el = panelEl(id).querySelector(sel); el.classList.add('typing');
  el.value = ''; el.dispatchEvent(new Event('input', { bubbles: true }));
  for (const ch of text) { await wait(120); el.value += ch; el.dispatchEvent(new Event('input', { bubbles: true })); }
  el.classList.remove('typing');
}

/* controller */
function stopAll() { runId++; timers.forEach(clearTimeout); timers = []; fingersOff(); $$('.banner, .mov').forEach(b => b.remove()); }
function setFocus(id) {
  focusId = id;
  $$('.panel').forEach(p => p.classList.toggle('focus', p.dataset.p === id));
  $$('#ptabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === id));
}
function showPanels(list, focus) {
  curPanels = list;
  $$('.panel').forEach(p => { const i = list.indexOf(p.dataset.p); p.hidden = i < 0; p.style.order = i; });
  Object.values(SCREENS).forEach(sc => sc.scrollTop = 0);
  $('#ptabs').innerHTML = list.map(id => `<button data-act="focus" data-p="${id}" aria-pressed="false">${PANELS[id].tab}</button>`).join('');
  setFocus(focus || list[0]);
}
function setPaused(v) { paused = v; document.body.classList.toggle('paused', v); renderNarr(); }
function startTour(ix) {
  stopAll(); MODE = 'tour'; finale = false; paused = false; document.body.classList.remove('paused');
  S = fresh(); QUIET = true; for (let i = 0; i < ix; i++) { SCENES[i].prep(); SCENES[i].ff(); } QUIET = false;
  sceneIx = ix; seen.add(ix);
  const sc = SCENES[ix]; sc.prep();
  showPanels(sc.panels, sc.focus); renderNarr(); render();
  runScene(ix);
}
async function runScene(ix) {
  try {
    await SCENES[ix].run(); fingersOff(); S.sceneDone = true; renderNarr();
    await wait(3500);
    if (ix + 1 < SCENES.length) startTour(ix + 1); else showFinale();
  } catch (e) { if (e !== STOP) console.error(e); }
}
function showFinale() { stopAll(); finale = true; renderNarr(); }
function startSandbox() {
  stopAll(); MODE = 'sandbox'; finale = false; paused = false; document.body.classList.remove('paused');
  S = fresh(); showPanels(['centre', 'jess', 'owner', 'map', 'admin', 'chloe'], 'centre'); renderNarr(); render();
}
function ctlHtml() {
  return `<div class="ctl"><button data-act="prev" aria-label="Previous chapter"${sceneIx === 0 ? ' disabled' : ''}>${ic('chev-left')}</button><button class="primary" data-act="pause">${paused ? ic('play') + ' Play' : ic('pause') + ' Pause'}</button><button data-act="next">Next ${ic('chev-right')}</button></div>`;
}
function renderNarr() {
  const n = $('#narr'), m = $('#mbar'), ch = $('#chapters');
  $('#m-tour').setAttribute('aria-pressed', MODE === 'tour'); $('#m-play').setAttribute('aria-pressed', MODE === 'sandbox');
  if (MODE === 'sandbox') {
    ch.hidden = true; m.hidden = true;
    n.innerHTML = `<p class="eyebrow">Try it yourself</p><h2>Everything on these phones works</h2>
      <ol><li>Post a slot from the centre phone.</li><li>Watch the map, then accept or pass as Jess.</li><li>As Amy, add or skip Biscuit's groom.</li><li>As Jess, check in, mark dogs done, add photos and check out.</li><li>Confirm the job on the centre phone, then look at the invoice.</li><li>Sign Chloe up, then check and verify her as admin.</li></ol>
      <div class="hood"><p>Other groomers and owners act on their own. Pass as Jess and Priya takes the slot. The 10 minute head start runs in 8 seconds.</p></div>
      <div class="grid2"><button data-act="reset">${ic('refresh')} Start again</button><button class="primary" data-act="mode-tour">${ic('play')} Watch the tour</button></div>`;
    return;
  }
  ch.hidden = false;
  $$('#chapters .chip').forEach((c, i) => { c.setAttribute('aria-current', !finale && i === sceneIx ? 'step' : 'false'); c.classList.toggle('seen', seen.has(i)); });
  const act = $$('#chapters .chip')[sceneIx]; if (act && !finale) ch.scrollLeft = Math.max(0, act.offsetLeft - ch.clientWidth / 2 + act.offsetWidth / 2);
  if (finale) {
    m.hidden = true;
    n.innerHTML = `<p class="eyebrow">The whole loop</p><h2>That's GroomCall</h2><p>Centres fill grooming gaps in minutes. Groomers pick up paid work close to home. Owners get their dog groomed without a separate trip.</p>
      <div class="hood"><span class="lbl">${ic('shield')} Built for Perth</span><p>Prices in AUD including GST, Perth time, ABN checks, contractor agreements and Australian privacy rules from day one.</p></div>
      <div class="grid2"><button data-act="restart">${ic('refresh')} Watch again</button><button class="primary" data-act="mode-play">Try it yourself</button></div>`;
    return;
  }
  const sc = SCENES[sceneIx];
  const status = paused ? 'Paused. Tap around the phones, or press Play to carry on.' : S.sceneDone ? 'Next chapter in a moment.' : 'Plays on its own. Tap any phone to take over.';
  n.innerHTML = `<p class="eyebrow">Chapter ${sceneIx + 1} of ${SCENES.length}</p><h2>${sc.h}</h2><p>${sc.p}</p>
    <div class="hood"><span class="lbl">${ic('shield')} Behind the scenes</span><p>${sc.hood}</p></div>${ctlHtml()}<p class="note">${status}</p>`;
  m.hidden = false; m.innerHTML = `<span class="mt"><b>${sceneIx + 1}/${SCENES.length}</b> ${sc.short}</span>${ctlHtml()}`;
}

/* events */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  if (e.isTrusted && MODE === 'tour' && !finale && b.closest('#stage') && !paused) setPaused(true);
  switch (a) {
    case 'post': post(); break;
    case 'accept': { const r = accept(d.g); if (!r.ok && r.reason === 'taken') push(d.g, "That one's gone to another groomer. We'll ping you for the next one."); break; }
    case 'pass': pass(d.g); break;
    case 'tab': S.tabs[d.panel] = d.tab; SCREENS[d.panel].scrollTop = 0; if (d.tab === 'earnings') mark('count');
      if (['earnings', 'invoice', 'history'].includes(d.tab) || (d.panel === 'admin' && d.tab === 'slots')) motion(d.panel, 'brush', 'Syncing your week', '', 1000);
      render(); break;
    case 'book': book(d.dog); break;
    case 'skip': skip(d.dog); break;
    case 'toggle': S.owner.on = !S.owner.on; render(); break;
    case 'enroute': enRoute(); break;
    case 'checkin': checkIn(); break;
    case 'done': markDone(d.dog); break;
    case 'photos': photos(d.dog); break;
    case 'checkout': checkOut(); break;
    case 'confirm': confirmJob(); break;
    case 'maps': return;
    case 'fav': S.favs[d.g] = !S.favs[d.g]; render(); break;
    case 'profile': S.profile = d.g; render(); break;
    case 'adm-check': runChecks(); break;
    case 'adm-verify': verify(); break;
    case 'adm-remind': remind(); break;
    case 'renew': S.renewed = true; mark('renew'); render(); break;
    case 'ob-next': obNext(); break;
    case 'ob-abn': obAbn(); break;
    case 'ob-doc': S.ob.docs[d.doc] = true; mark('doc-' + d.doc); render(); break;
    case 'ob-agree': S.ob.agreed = `${S.when.day} 2026 at ${S.when.time}`; render(); break;
    case 'ob-stripe': S.ob.stripe = true; motion('chloe', 'bath', 'Setting up payouts', 'Secure setup with Stripe', 1300); render(); break;
    case 'ob-install': S.ob.installed = true; render(); break;
    case 'ob-alerts': S.ob.dialog = true; render(); break;
    case 'ob-allow': obAllow(); break;
    case 'ob-deny': S.ob.dialog = false; S.ob.denied = true; render(); break;
    case 'rule': S.rule = d.rule; mark('rule'); render(); break;
    case 'stress': stressBurst(10, 180); break;
    case 'focus': setFocus(d.p); break;
    case 'chapter': startTour(+d.i); break;
    case 'prev': startTour(Math.max(0, sceneIx - 1)); break;
    case 'next': if (finale) break; if (sceneIx + 1 < SCENES.length) startTour(sceneIx + 1); else showFinale(); break;
    case 'pause': setPaused(!paused); break;
    case 'restart': case 'mode-tour': startTour(0); break;
    case 'mode-play': case 'reset': startSandbox(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-dogs') S.form.dogs = t.value;
  else if (t.id === 'f-pay') S.form.pay = t.value;
  else if (t.id === 'ob-abn') { S.ob.abn = t.value.replace(/\D/g, '').slice(0, 11); S.ob.abnErr = ''; }
  else return;
  if (S.err) { S.err = ''; const el = $('#post-err'); if (el) el.textContent = ''; }
  if (e.isTrusted && MODE === 'tour' && !finale && !paused) setPaused(true);
});
document.addEventListener('change', e => { const t = e.target; if (t.id === 'f-day') S.form.day = t.value; else if (t.id === 'f-hours') S.form.hours = t.value; });

/* boot */
(function init() {
  $('#stage').innerHTML = Object.entries(PANELS).map(([id, p]) => `<section class="panel ${p.phone ? 'is-phone' : 'is-card'}" data-p="${id}" hidden><div class="ptitle"><h3>${p.t}</h3><span>${p.s}</span></div>${p.phone ? '<div class="phone"><div class="screen"></div></div>' : '<div class="cardpanel"><div class="pbody"></div></div>'}</section>`).join('');
  Object.keys(PANELS).forEach(id => SCREENS[id] = panelEl(id).querySelector('.screen, .pbody'));
  $('#chapters').innerHTML = SCENES.map((s, i) => `<button class="chip" data-act="chapter" data-i="${i}">${i + 1}. ${s.short}</button>`).join('');
  setInterval(() => {
    if (paused || !S || !S.hs.running) return;
    S.hs.elapsed += 100;
    if (S.hs.elapsed >= HEAD_MS) { S.hs.running = false; openToAll(); } else updateHs();
  }, 100);
  const m = location.hash.match(/^#ch(\d+)$/);
  if (location.hash === '#play') startSandbox();
  else startTour(m ? Math.min(SCENES.length, Math.max(1, +m[1])) - 1 : 0);
})();
