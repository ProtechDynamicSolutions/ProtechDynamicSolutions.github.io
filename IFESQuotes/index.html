<style>:root{
  --navy:#013663;--navy2:#012a4f;--blue:#02588e;--bright:#0087c8;--cyan:#22b5ec;--sky:#e8f4fc;--sky2:#d4eaf9;
  --ink:#0f1c2e;--ink2:#46566c;--muted:#7d8ba0;--line:#dfe6ee;--line2:#eef2f6;--bg:#f1f5f9;--card:#fff;
  --good:#0c8a0c;--goodbg:#e3f5e3;--warn:#a86e00;--warnbg:#fff4d6;--crit:#c22f2f;--critbg:#fbe3e3;--violet:#4a3aa7;--violetbg:#ebe8fb;
  --grey:#6b7686;--greybg:#eceff3;
  --r:16px;--shadow:0 1px 2px rgba(1,54,99,.06),0 6px 20px rgba(1,54,99,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{overflow-x:clip;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--bright)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;color:#fff;overflow:hidden;
  background:radial-gradient(90% 260% at 88% -60%,#0b95d6 0%,#0373b3 22%,#02588e 42%,#013663 70%,#012a4f 100%);
  box-shadow:0 2px 14px rgba(1,30,60,.28);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:14px;padding:8px 20px;max-width:1500px;margin:0 auto;min-height:60px}
.brand{display:flex;align-items:center;gap:11px;flex:none;text-decoration:none;color:#fff}
.brand img{height:44px;width:auto;display:block;filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 3px 8px rgba(0,0,0,.3))}
.brand b{display:block;font-size:17px;letter-spacing:.01em}
.brand span{display:block;font-size:10.5px;color:#a9d6f2;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{appearance:none;border:0;background:transparent;color:#cfe6f7;font-weight:600;font-size:14.5px;padding:9px 16px;border-radius:22px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tab .cnt{background:var(--bright);color:#fff;border-radius:10px;font-size:11.5px;padding:1px 7px;font-weight:700}
.tab.on .cnt{background:var(--navy)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#cfe6f7;min-width:0}
.sync{display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;background:none;border:0;color:inherit;padding:6px 8px;border-radius:10px}
.sync:hover{background:rgba(255,255,255,.08)}
.dot{width:8px;height:8px;border-radius:50%;background:#46d36a;box-shadow:0 0 0 3px rgba(70,211,106,.25);flex:none}
.dot.busy{background:#ffd34d;box-shadow:0 0 0 3px rgba(255,211,77,.25);animation:pulse 1s infinite}
.dot.bad{background:#ff7a6b;box-shadow:0 0 0 3px rgba(255,122,107,.25)}
@keyframes pulse{50%{opacity:.4}}
.who{appearance:none;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:22px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.demo-bar{background:linear-gradient(90deg,#fff4d6,#fff9ea);color:#6b4b00;font-size:13px;border-bottom:1px solid #f2dfa6}
.demo-bar .in{max-width:1500px;margin:0 auto;padding:7px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-bar b{color:#4d3600}
.demo-bar .sp{flex:1}

/* bottom nav on phones */
.bnav{display:none}

/* ---------- layout ---------- */
main{max-width:1500px;margin:0 auto;padding:20px 20px 120px}
.narrow{max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(1,54,99,.05)}
.view{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:20px;color:var(--navy);margin:0}
.sub{color:var(--muted);font-size:13.5px}
.page-h{display:flex;align-items:flex-end;gap:12px;margin:2px 2px 14px;flex-wrap:wrap}
.page-h .grow{flex:1}

/* ---------- controls ---------- */
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s;text-decoration:none;min-height:42px}
.btn:hover{border-color:#c8d3df;background:#f8fafc}
.btn.primary{background:var(--bright);border-color:var(--bright);color:#fff;box-shadow:0 2px 8px rgba(0,135,200,.3)}
.btn.primary:hover{background:#0079b4}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--bright)}
.btn.ghost:hover{background:var(--sky)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px;min-height:34px}
.btn.danger{color:var(--crit)}
.btn.huge{width:100%;font-size:18px;padding:16px 20px;border-radius:16px;min-height:60px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;outline:none;min-height:46px;transition:border-color .15s,box-shadow .15s;font-size:16px}
.input:focus,.select:focus{border-color:var(--bright);box-shadow:0 0 0 3px rgba(0,135,200,.15)}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.input.big{font-size:18px;font-weight:600}
.input.money{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 2px 5px;letter-spacing:.01em}
label.l .opt{font-weight:500;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip:hover{border-color:var(--bright);color:var(--bright)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{background:var(--line2);color:var(--ink2);border-radius:10px;padding:0 7px;font-size:12px}
.chip.on .c{background:rgba(255,255,255,.2);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-New{background:var(--warnbg);color:var(--warn)}
.st-Priced{background:var(--sky);color:var(--blue)}
.st-Sent{background:var(--violetbg);color:var(--violet)}
.st-Won{background:var(--goodbg);color:var(--good)}
.st-Lost{background:var(--greybg);color:var(--grey)}
.st-Cancelled{background:var(--greybg);color:var(--grey)}
.st-Waiting{background:#fdeadf;color:#b4501d}

/* ---------- gate / who ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 85% -10%,#0b95d6 0%,#0373b3 25%,#02588e 45%,#013663 72%,#012a4f 100%)}
.gate-card{width:100%;max-width:420px;background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,20,50,.35);padding:30px 26px 26px;text-align:center}
.gate-card img{height:86px;display:block;margin:0 auto 6px}
.gate-card h1{margin:4px 0 2px;color:var(--navy);font-size:24px}
.gate-card p{color:var(--ink2);margin:8px 0 18px}
.code{text-align:center;font:700 24px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.14em}
.err{color:var(--crit);font-weight:600;font-size:14px;margin-top:10px;min-height:20px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px;text-align:left}
.name-btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:52px;font-size:15px}
.name-btn:hover{border-color:var(--bright);background:var(--sky)}
.name-btn .av{background:var(--sky2)}
.name-btn small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.small{font-size:12.5px;color:var(--muted)}

/* ---------- new request ---------- */
.hello{margin:4px 4px 14px}
.hello h2{font-size:22px}
.step{padding:16px 18px 18px;margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step-h h3{margin:0;font-size:16.5px;color:var(--navy)}
.step-h .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.step-h .opt{color:var(--muted);font-size:13px;margin-left:auto}
.step .input+.input,.step .grid2+.input,.step .input+.grid2{margin-top:9px}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(1,30,60,.16);z-index:30;max-height:300px;overflow:auto}
.ac-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line2)}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item.hl{background:var(--sky)}
.ac-item b{display:block}
.ac-item span{font-size:13px;color:var(--muted)}
.mic{appearance:none;width:100%;border:2px dashed #b9d7ec;background:linear-gradient(180deg,#f6fbff,#eaf5fd);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;color:var(--navy);margin:6px 0 10px}
.mic .ring{width:58px;height:58px;border-radius:50%;background:var(--bright);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(0,135,200,.4)}
.mic .ring svg{width:28px;height:28px}
.mic b{display:block;font-size:17px}
.mic span{display:block;font-size:13px;color:var(--ink2)}
.mic.on{border-style:solid;border-color:#e45b4c;background:linear-gradient(180deg,#fff6f5,#ffeceb)}
.mic.on .ring{background:#e0443a;box-shadow:0 0 0 0 rgba(224,68,58,.5);animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,68,58,.45)}70%{box-shadow:0 0 0 16px rgba(224,68,58,0)}100%{box-shadow:0 0 0 0 rgba(224,68,58,0)}}
.mic.work .ring{background:var(--warn)}
.interim{color:var(--muted);font-style:italic;min-height:0;margin:-4px 2px 8px;font-size:14px}
.tidy-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.tidy-row .small{flex:1;min-width:180px}
.tidied{margin-top:14px;border-top:1px dashed var(--line);padding-top:4px}
.callout{background:var(--warnbg);border-radius:12px;padding:10px 13px;font-size:14px;color:#5c4100;margin-top:10px}
.callout.blue{background:var(--sky);color:var(--navy)}
.labour{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.stepper label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:6px 2px 5px}
.stepper .box{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.stepper button{appearance:none;border:0;background:var(--line2);width:48px;height:50px;font-size:24px;font-weight:600;color:var(--navy);cursor:pointer}
.stepper button:active{background:var(--sky2)}
.stepper input{width:64px;border:0;text-align:center;font-size:20px;font-weight:700;outline:none;height:50px;background:#fff}
.lab-total{font-size:17px;font-weight:700;color:var(--navy);padding-bottom:12px}
.mat{display:grid;grid-template-columns:84px 1fr 44px;gap:8px;margin-bottom:8px}
.mat .x{appearance:none;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--muted);cursor:pointer;font-size:20px}
.send-bar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(241,245,249,0),var(--bg) 30%);z-index:20}
.done{text-align:center;padding:40px 22px}
.done .tick{width:74px;height:74px;border-radius:50%;background:var(--goodbg);color:var(--good);display:grid;place-items:center;margin:0 auto 12px}
.done .tick svg{width:40px;height:40px;stroke-width:2.6}
.done h2{font-size:24px}
.std{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.std .chip{font-weight:500;font-size:12.5px;padding:5px 10px;white-space:normal;text-align:left;max-width:100%}

/* ---------- list ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{padding:14px 16px;cursor:pointer;border:1px solid transparent;text-align:left;appearance:none;font:inherit;color:inherit}
.stat:hover{border-color:var(--sky2)}
.stat .k{font-size:12.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:28px;font-weight:800;color:var(--navy);line-height:1.15;margin-top:4px}
.stat .s{font-size:13px;color:var(--muted)}
.stat.warn .v{color:var(--warn)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px;min-height:42px;font-size:15px}
table.qt{width:100%;border-collapse:separate;border-spacing:0}
.qt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:12px 12px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
.qt td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:14px}
.qt tr.r{cursor:pointer}
.qt tr.r:hover td{background:#f7fbfe}
.qt .ref{font-weight:800;color:var(--navy);white-space:nowrap}
.qt .cl b{display:block}
.qt .cl span{color:var(--muted);font-size:13px}
.qt .money{text-align:right;font-weight:700;white-space:nowrap}
.qt .when{white-space:nowrap;color:var(--ink2)}
.qt .when small{display:block;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.cards{display:none}
.qcard{padding:14px 16px;margin-bottom:10px;cursor:pointer;display:block}
.qcard .t{display:flex;align-items:center;gap:8px}
.qcard .t .ref{font-weight:800;color:var(--navy)}
.qcard .t .grow{flex:1}
.qcard h4{margin:6px 0 2px;font-size:16px}
.qcard .m{color:var(--muted);font-size:13.5px}
.qcard .b{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13.5px;color:var(--ink2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(1,20,40,.42);z-index:60;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100vw);background:var(--bg);z-index:61;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,20,50,.25);animation:slideIn .2s ease}
@keyframes slideIn{from{transform:translateX(30px);opacity:.4}}
.d-head{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.d-head .ref{font-size:19px;font-weight:800;color:var(--navy)}
.d-head .grow{flex:1;min-width:0}
.d-head .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-body{flex:1;overflow:auto;padding:16px 18px 30px;-webkit-overflow-scrolling:touch}
.d-foot{background:#fff;border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.d-foot .grow{flex:1}
.sec{padding:14px 16px 16px;margin-bottom:12px}
.sec h3{margin:0 0 2px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
.sec h3 .grow{flex:1}
.saved{font-size:12.5px;color:var(--muted);white-space:nowrap}
.saved.bad{color:var(--crit);font-weight:600}
.price-box{background:linear-gradient(180deg,#f6fbff,#eef7fd);border:1px solid var(--sky2);border-radius:14px;padding:12px 14px;margin-top:10px}
.helper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sugg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--ink2)}
.sugg b{color:var(--navy);font-size:16px}
.note-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2)}
.note-row:last-child{border-bottom:0}
.note-row input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--navy)}
.hist{list-style:none;margin:6px 0 0;padding:0}
.hist li{padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px;display:flex;gap:12px}
.hist li:last-child{border-bottom:0}
.hist .t{color:var(--muted);white-space:nowrap;min-width:128px}
.sentbox{display:flex;gap:12px;align-items:center;background:var(--violetbg);color:#2f2470;border-radius:12px;padding:11px 14px;margin-bottom:12px;flex-wrap:wrap}
.sentbox b{color:#241a63}
.ro{white-space:pre-wrap;padding:4px 2px;color:var(--ink)}
.ro-l{font-size:12px;color:var(--muted);font-weight:700;margin-top:10px;text-transform:uppercase;letter-spacing:.05em}
ul.desc{margin:6px 0 0;padding-left:22px}
ul.desc li{margin:3px 0}
ul.desc li span{display:block;color:var(--ink2)}
details.said summary{cursor:pointer;color:var(--muted);font-size:13.5px;margin-top:10px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(1,20,40,.5);animation:fadeIn .15s}
.m-card{background:#fff;border-radius:20px;width:100%;max-width:620px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,20,50,.35)}
.m-card.wide{max-width:980px;height:calc(100vh - 32px)}
.m-head{padding:16px 20px 6px;display:flex;align-items:center;gap:10px}
.m-head h3{margin:0;font-size:18px;color:var(--navy);flex:1}
.m-body{padding:4px 20px 14px;overflow:auto;flex:1}
.m-foot{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line2)}
.attach{display:flex;align-items:center;gap:10px;background:var(--line2);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.attach .pdf{background:#d93025;color:#fff;font-weight:800;font-size:11px;border-radius:6px;padding:4px 6px}
.x-btn{appearance:none;border:0;background:var(--line2);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;color:var(--ink2);flex:none}
iframe.pdf-frame{width:100%;height:100%;border:0;border-radius:10px;background:#525659}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto;animation:fade .2s;display:flex;gap:12px;align-items:center}
.toast.bad{background:#8d1f1f}
.toast button{appearance:none;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer}

/* ---------- settings ---------- */
.set-sec{padding:16px 18px;margin-bottom:14px}
.set-sec h3{margin:0 0 4px;color:var(--navy);font-size:16px}
table.team{width:100%;border-collapse:collapse;margin-top:8px}
.team th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;font-weight:700}
.team td{padding:5px 6px;border-top:1px solid var(--line2);vertical-align:middle}
.team .input{min-height:38px;padding:7px 10px;font-size:14px}
.team .select{min-height:38px;padding:6px 8px;font-size:14px}
.team td.c{text-align:center}
.team input[type=checkbox]{width:19px;height:19px;accent-color:var(--navy)}
.keyline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.okline{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:700}
.badline{display:flex;align-items:center;gap:8px;color:var(--warn);font-weight:700}
.menu{position:absolute;right:16px;top:64px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 14px 40px rgba(0,20,50,.25);min-width:240px;z-index:70;padding:6px;overflow:hidden}
.menu button,.menu a{display:flex;width:100%;appearance:none;border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:600;gap:10px;align-items:center;color:var(--ink);text-decoration:none;font-size:14.5px}
.menu button:hover,.menu a:hover{background:var(--sky)}
.menu .mi{padding:8px 12px 10px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line2);margin-bottom:4px}

.phone-only{display:none}

/* ---------- phone ---------- */
@media (max-width:860px){
  .tabs{display:none}
  .top-in{padding:6px 14px;min-height:56px}
  .brand img{height:38px}
  .brand b{font-size:16px}
  .sync .txt{display:none}
  .who .nm{display:none}
  .who{padding:4px}
  main{padding:14px 12px 120px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(1,30,60,.08)}
  .bnav button{flex:1;appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 4px;border-radius:12px;cursor:pointer;position:relative}
  .bnav button svg{width:24px;height:24px}
  .bnav button.on{color:var(--navy);background:var(--sky)}
  .bnav .cnt{position:absolute;top:2px;left:calc(50% + 8px);background:var(--bright);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px}
  .send-bar{bottom:calc(64px + env(safe-area-inset-bottom))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat .v{font-size:24px}
  .tablewrap{display:none}
  .cards{display:block}
  .drawer{width:100vw}
  .d-body{padding:12px 12px 24px}
  .d-foot{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .d-foot .grow{display:none}
  .d-foot .btn{flex:1 1 0;padding:8px 8px;font-size:13.5px}
  .d-foot .btn.primary,.d-foot .btn.good{order:-1;flex:1 1 100%;min-height:50px;font-size:16px}
  .d-foot .btn.good,.d-foot [data-status=Lost]{order:-2;flex:1 1 40%;min-height:50px;font-size:16px}
  .tools .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .tools .chips::-webkit-scrollbar{display:none}
  .tools [data-view-go=new]{display:none}
  .d-foot #d-download span{display:none}
  .grid2,.grid3,.helper{grid-template-columns:1fr}
  .names{grid-template-columns:1fr 1fr}
  .team thead{display:none}
  .team tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line2)}
  .team td{border:0;padding:0}
  .team td.c{text-align:left;font-size:13px}
  .phone-only{display:inline}
  .toasts{bottom:calc(150px + env(safe-area-inset-bottom))}
  .m-card.wide{height:calc(100vh - 32px)}
}
@media (max-width:380px){
  .names{grid-template-columns:1fr}
  .mat{grid-template-columns:70px 1fr 40px}
}
@media print{.top,.bnav,.demo-bar{display:none}}
</style>
</head>

<script>// IFES Quotes: the logic shared by the page, the Apps Script (it is pasted in at the top of Code.gs)
// and the tests, so the phone, the office copy and the demo always agree.
var QC = (function () {
  var STATUSES = ['New', 'Priced', 'Sent', 'Won', 'Lost', 'Cancelled'];
  // what the office sees, and what the person who asked for the quote sees
  var LABEL = { New: 'To price', Priced: 'Ready to send', Sent: 'Sent', Won: 'Won', Lost: 'Lost', Cancelled: 'Cancelled' };
  var FIELD_LABEL = { New: 'With the office', Priced: 'With the office', Sent: 'Sent to the client', Won: 'Won', Lost: 'Not won', Cancelled: 'Cancelled' };

  // Who is on the Team tab to start with: the office (prices and sends) and the site staff.
  // The public demo build swaps this list for made-up names.
  var DEFAULT_TEAM = [
    { name: 'Chris', role: 'Office', newReq: true, sentNote: false },
    { name: 'David', role: 'Field', newReq: false, sentNote: true }
  ];

  var DEFAULT_SETTINGS = {
    prefix: 'Q-', next: 1, digits: 4,
    fromName: 'IFES Electrical Services Ltd',
    // lines anyone can add to a quote with one tap
    lines: [
      'Survey and site visit',
      'Safe isolation and powering down of existing services',
      'Associated containment',
      'Associated chemical anchors and fixings',
      'Administration, issue of RAMS',
      'Testing, commissioning & labelling',
      'Issue of certification'
    ],
    // the "Please note" list at the bottom of the quote; on = ticked on every new quote
    notes: [
      { t: 'The above cost excludes VAT.', on: true },
      { t: 'The above cost is based on normal working hours.', on: true },
      { t: 'All civil works to be completed by others.', on: false },
      { t: 'Temporary shut down of the distribution may be needed during normal working hours.', on: false }
    ],
    subject: 'Quotation {ref}: {title}',
    message: 'Dear {first},\n\nPlease find attached our quotation {ref} for {what}.\n\nIf you have any questions, just reply to this email.\n\nKind regards,\n{me}',
    signature: 'IFES Electrical Services Ltd\n(address, phone and website go here)',
    signOff: '',          // printed under the notes on the quote, e.g. a name; blank prints nothing, like the example
    rate: 0,              // labour euro per hour, for the price helper only (never printed)
    markup: 0,            // per cent on materials, for the price helper only
    appUrl: ''
  };

  // ---------------------------------------------------------------- small helpers
  function str(v, max) {
    if (v === null || v === undefined) return '';
    var s = String(v).replace(/\r\n?/g, '\n').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '').trim();
    return max && s.length > max ? s.slice(0, max) : s;
  }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function num(v) {

et a key at aistudio.google.com, then paste it in the app under Settings.\n * Handy to run from the editor: showLinks (logs the sheet and folder links).\n */\n\n// ---------------------------------------------------------------- shared with the app (src/core.js)\n// IFES Quotes: the logic shared by the page, the Apps Script (it is pasted in at the top of Code.gs)\n// and the tests, so the phone, the office copy and the demo always agree.\nvar QC = (function () {\n  var STATUSES = ['New', 'Priced', 'Sent', 'Won', 'Lost', 'Cancelled'];\n  // what the office sees, and what the person who asked for the quote sees\n  var LABEL = { New: 'To price', Priced: 'Ready to send', Sent: 'Sent', Won: 'Won', Lost: 'Lost', Cancelled: 'Cancelled' };\n  var FIELD_LABEL = { New: 'With the office', Priced: 'With the office', Sent: 'Sent to the client', Won: 'Won', Lost: 'Not won', Cancelled: 'Cancelled' };\n\n  // Who is on the Team tab to start with: the office (prices and sends) and the site staff.\n  // The public demo build swaps this list for made-up names.\n  var DEFAULT_TEAM = [\n    { name: 'Chris', role: 'Office', newReq: true, sentNote: false },\n    { name: 'David', role: 'Field', newReq: false, sentNote: true }\n  ];\n\n  var DEFAULT_SETTINGS = {\n    prefix: 'Q-', next: 1, digits: 4,\n    fromName: 'IFES Electrical Services Ltd',\n    // lines anyone can add to a quote with one tap\n    lines: [\n      'Survey and site visit',\n      'Safe isolation and powering down of existing services',\n      'Associated containment',\n      'Associated chemical anchors and fixings',\n      'Administration, issue of RAMS',\n      'Testing, commissioning & labelling',\n      'Issue of certification'\n    ],\n    // the \"Please note\" list at the bottom of the quote; on = ticked on every new quote\n    notes: [\n      { t: 'The above cost excludes VAT.', on: true },\n      { t: 'The above cost is based on normal working hours.', on: true },\n      { t: 'All civil works to be completed by     refreshing = API.call('list', { since: since, appUrl: appUrl }).then(function (r) {

      D.pricers = r.pricers || []; D.gemini = !!r.gemini; D.since = r.now; if (r.full) D.full = Date.now();
      if (r.team) D.team = r.team;

      if (r.me && r.me.role !== ME.role) { ME.role = r.me.role; LS.set('ifq-me', ME); shell(); }

  function toggleMic(ta) {
    if (MIC) { stopMic(); return; }
    if (Speech.hasLive && !UI.noLive) {
      var base = ta.value.replace(/\s+$/, '');
      MIC = Speech.live(function (finalText, interim) {
        ta.value = (base ? base + (/[.!?]$/.test(base) ? ' ' : '. ') : '') + finalText;
        DR.raw = ta.value; saveDraft();
        $('#interim').textContent = interim;
      }, function (st, why) {
        if (st === 'on') micLook('on', 'Talk normally. Tap again when you\'re done.');
        if (st === 'off') { MIC = null; micLook('off', 'Tap again to add more'); $('#interim').textContent = ''; }
        if (st === 'denied') {
          MIC = null; UI.noLive = true; micLook('off');
          if (Speech.hasRecord && D.gemini) { toast('The phone\'s own speech-to-text is blocked, so this will record instead.'); toggleMic(ta); }
          else toast('The microphone is blocked. Allow it in the browser settings, or use the mic on your keyboard.', { bad: true });
        }
        if (st === 'error' && why === 'network') toast('Speech-to-text needs signal. Use the mic on your keyboard, or type.', { bad: true });
      });
      return;
    }
    if (Speech.hasRecord && D.gemini) {
      var rec = Speech.record(function (st, secs) {
        if (st === 'on') micLook('on', 'Recording ' + Math.floor(secs / 60) + ':' + QC.pad(secs % 60, 2) + ' of ' + Speech.MAX_SECS / 60 + ':00. Tap to stop.');
        if (st === 'working') micLook('work', 'Gemini is writing out what you said');
        if (st === 'denied') { MIC = null; micLook('off'); toast('The microphone is blocked. Allow it in the browser settings, or use the mic on your keyboard.', { bad: true }); }
      });
      MIC = rec;
      rec.done.then(function (wav) {
        return API.call('transcribe', { audio: wav.b64, mime: wav.mime }, { timeout: 240000 });
      }).then(function (r) {
        MIC = null; micLook('off', 'Tap again to add more');
        var t = QC.str(r.text);
        if (!t) return toast('Nothing was heard. Try again a bit closer to the phone.');
        ta.value = (ta.value.replace(/\s+$/, '') + (ta.value.trim() ? '\n' : '') + t);
        DR.raw = ta.value; saveDraft();
      }, function (e) {
        MIC = null; micLook('off');
        if (e && e.kind) toast(API.words(e), { bad: true });
      });
      return;
    }
    toast('Tap the microphone on your keyboard to talk instead of typing.');
    ta.focus();
  }

  // ---- tidy
  function tidyNow(btn) {
    stopMic();
    var text = QC.str(DR.raw);
    if (!text && DR.itemsText) text = DR.itemsText;
    if (text.length < 3) { toast('Say or type a bit about the job first.'); $('#n-raw').focus(); return; }
    var before = { job: DR.job, title: DR.title, intro: DR.intro, itemsText: DR.itemsText, men: DR.men, hours: DR.hours, materials: JSON.parse(JSON.stringify(DR.materials)), fieldNotes: DR.fieldNotes, shown: DR.shown };
    function apply(r, gem) {
      DR.undo = before;
      if (r.job && !DR.job) DR.job = r.job;
      if (r.title) DR.title = r.title;
      if (r.intro) DR.intro = r.intro;
      if (r.items && r.items.length) DR.itemsText = QC.itemsToText(r.items);
      if (r.hours && !QC.num(DR.hours)) { DR.hours = r.hours; if (r.men) DR.men = r.men; }
      else if (r.men && QC.num(DR.men) <= 1 && r.hours === QC.num(DR.hours)) DR.men = r.men;
      (r.materials || []).forEach(function (m) {
        if (!DR.materials.some(function (x) { return x.t.toLowerCase() === m.t.toLowerCase(); })) DR.materials.push(m);
      });
      DR.materials = DR.materials.filter(function (x) { return x.t || x.q; });
      if (r.forOffice && DR.fieldNotes.indexOf(r.forOffice) < 0) DR.fieldNotes = (DR.fieldNotes ? DR.fieldNotes + '\n' : '') + r.forOffice;
      DR.checks = r.check || [];
      DR.shown = true;
      saveDraft();
      renderView();
      var t = $('#tidied'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast(gem ? 'Tidied. Check it over and change anything that\'s not right.' : 'Made into a list. Check it over.');
    }
    if (!D.gemini) { var l = QC.localTidy(text); apply({ items: l.items, men: l.men, hours: l.hours }, false); return; }
    btn.disabled = true; btn.innerHTML = ic('spark') + 'Tidying…';
    API.call('tidy', { text: text, company: DR.company, site: DR.site }, { timeout: 200000 }).then(function (r) { apply(r.result, true); }, function (e) {
      btn.disabled = false; btn.innerHTML = ic('spark') + 'Tidy it up';
      if (e.code === 'no-key') { D.gemini = false; saveCache(); }
      toast(API.words(e) + (e.code === 'busy' ? '' : ''), { bad: true, action: 'Make a plain list instead', run: function () { var l = QC.localTidy(text); apply({ items: l.items, men: l.men, hours: l.hours }, false); } });
    });
  }

    if (same.length === 1 && !QC.str(DR.contact) && !QC.str(DR.email)) { DR.contact = same[0].contact; DR.email = same[0].email; DR.phone = DR.phone || same[0].phone; saveDraft(); }
    var set = draftToSet();

  function setSaved(t, bad) { var s = $('#saved'); if (s) { s.textContent = t; s.classList.toggle('bad', !!bad); } }

  }
  // Send only what changed, with what the app last saw, so two people at once don't overwrite each other.
  function saveOpen() {
    clearTimeout(saveTimer);
    if (!EDIT || !BASE) return Promise.resolve();
    if (inflight) return inflight.then(saveOpen);
    var id = EDIT.id, set = {}, base = {};
    keys().forEach(function (k) { var v = norm(k, EDIT[k]); if (!QC.same(v, BASE[k])) { set[k] = v; base[k] = BASE[k]; } });
    if (!Object.keys(set).length) { setSaved(''); return Promise.resolve(); }
    setSaved('Saving…');
    inflight = API.call('save', { id: id, set: set, base: base }).then(function (r) {
      inflight = null;
      var q = r.quote;
      D.quotes[q.id] = q; saveCache();
      if (UI.open !== id) return;
      var redraw = false;
      // fields typed into while this was saving stay as typed
      keys().forEach(function (k) {
        var sentIt = Object.prototype.hasOwnProperty.call(set, k);
        var mine = norm(k, EDIT[k]);
        if (sentIt ? QC.same(mine, set[k]) : QC.same(mine, BASE[k])) { if (!QC.same(EDIT[k], q[k]) && !QC.same(mine, q[k])) { EDIT[k] = clone(q[k]); redraw = true; } }
      });
      ['status', 'ref', 'v', 'upd', 'log', 'pricedBy', 'pricedAt', 'sentAt', 'sentBy', 'sentTo', 'pdfUrl', 'outcomeAt', 'outcomeBy', 'quoteDate'].forEach(function (k) { if (!QC.same(EDIT[k], q[k])) { EDIT[k] = clone(q[k]); if (k === 'status') redraw = true; } });
      BASE = clone(q);
      if (r.conflicts && r.conflicts.length) {
        r.conflicts.forEach(function (k) { EDIT[k] = clone(q[k]); });
        toast('Someone else changed ' + r.conflicts.join(', ') + ' a moment ago, so that shows their version now.', { bad: true, ms: 9000 });
        redraw = true;
      }
      if (redraw) { var st = $('.d-body') ? $('.d-body').scrollTop : 0; renderDrawer(); if ($('.d-body')) $('.d-body').scrollTop = st; }
      setSaved('Saved ' + hhmm(Date.now()));
      updateCounts();
    }, function (e) {
      inflight = null;
      setSaved('Not saved: ' + API.words(e), true);
      if (e.kind === 'offline' || e.kind === 'slow') setTimeout(function () { if (UI.open === id && dirty()) saveOpen(); }, 15000);
      throw e;
    });
    return inflight;
  }

      '<div class="card set-sec"><h3>Wording on the quote</h3>' +
      '<label class="l">Lines anyone can add with one tap</label><textarea class="input" rows="7" data-s="lines">' + esc((S.lines || []).join('\n')) + '</textarea>' +
      '<label class="l">"Please note" lines <span class="opt">(ticked = on every new quote)</span></label><div id="set-notes">' + notesRows() + '</div><button class="btn sm" id="note-add" style="margin-top:6px">' + ic('plus') + 'Add a line</button>' +
      '<label class="l">Signed off as <span class="opt">(printed under the notes; blank prints nothing, like the example)</span></label><textarea class="input" rows="2" data-s="signOff">' + esc(S.signOff) + '</textarea></div>' +

      '<div class="card set-sec"><h3>The email to the client</h3><div class="sub">{first} first name · {ref} quote number · {title} heading · {what} the job · {company} · {site} · {me} who sends it</div>' +
      '<label class="l">From name</label><input class="input" data-s="fromName" value="' + esc(S.fromName) + '">' +
      '<label class="l">Subject</label><input class="input" data-s="subject" value="' + esc(S.subject) + '">' +
      '<label class="l">Message</label><textarea class="input" rows="7" data-s="message">' + esc(S.message) + '</textarea>' +
      '<label class="l">Signature</label><textarea class="input" rows="3" data-s="signature">' + esc(S.signature) + '</textarea></div>' +

      '<div class="card set-sec"><h3>Price helper</h3><div class="sub">Only used to suggest a price. Never printed.</div><div class="grid2"><div><label class="l">Labour rate (€/hour)</label><input class="input" inputmode="decimal" data-smoney="rate" value="' + esc(S.rate ? QC.moneyTyped(S.rate) : '') + '"></div>' +
      '<div><label class="l">Mark-up on materials (%)</label><input class="input" inputmode="decimal" data-s="markup" value="' + esc(S.markup || '') + '"></div></div></div>' +
      '<div class="send-bar"><button class="btn primary huge" id="set-save">Save the wording and numbers</button></div></div>';
  }
  function teamRows() {
    return TEAM.map(function (p, i) {
      return '<tr data-t="' + i + '"><td><input class="input" data-tk="name" value="' + esc(p.name) + '" placeholder="Name"></td><td><input class="input" type="email" data-tk="email" value="' + esc(p.email) + '" placeholder="name@example.ie"></td>' +
        '<td><select class="select" data-tk="role"><option' + (p.role === 'Office' ? ' selected' : '') + '>Office</option><option value="Field"' + (p.role !== 'Office' ? ' selected' : '') + '>On site</option></select></td>' +
        '<td class="c"><label><input type="checkbox" data-tk="newReq"' + (p.newReq ? ' checked' : '') + '> <span class="phone-only">New requests</span></label></td>' +
        '<td class="c"><label><input type="checkbox" data-tk="sentNote"' + (p.sentNote ? ' checked' : '') + '> <span class="phone-only">Told when sent</span></label></td>' +
        '<td class="c"><label><input type="checkbox" data-tk="active"' + (p.active !== false ? ' checked' : '') + '> <span class="phone-only">Active</span></label></td></tr>';
    }).join('');
  }
  function notesRows() {
    return (SET.notes || []).map(function (n, i) { return '<div class="note-row"><input type="checkbox" data-sn="' + i + '"' + (n.on ? ' checked' : '') + '><input class="input" data-snt="' + i + '" value="' + esc(n.t) + '"><button class="x-btn" data-snx="' + i + '" aria-label="Remove">×</button></div>'; }).join('');
  }
  function wireSettings() {
    var m = $('#main');
    var rows = $('#team-rows');
    rows.addEventListener('input', onTeam); rows.addEventListener('change', onTeam);
    function onTeam(e) {
      var tr = e.target.closest('[data-t]'), k = e.target.getAttribute('data-tk'); if (!tr || !k) return;
      var p = TEAM[+tr.getAttribute('data-t')];
      p[k] = e.target.type === 'checkbox' ? e.target.checked : k === 'role' ? (e.target.value === 'Office' ? 'Office' : 'Field') : e.target.value;
      UI.setDirty = true;
    }
    $('#team-add').onclick = function () { TEAM.push({ name: '', email: '', role: 'Field', newReq: false, sentNote: false, active: true }); rows.innerHTML = teamRows(); var x = $$('[data-tk="name"]', rows).pop(); if (x) x.focus(); };
    $('#team-save').onclick = function () {
      var b = this, clean = TEAM.filter(function (p) { return QC.str(p.name); });
      var bad = clean.filter(function (p) { return p.email && !QC.isEmail(p.email); })[0];
      if (bad) return toast(bad.name + '\'s email doesn\'t look right.', { bad: true });
      if (!clean.some(function (p) { return p.newReq && p.active !== false && QC.isEmail(p.email); })) { if (!confirm('Nobody with an email is down for new requests, so nobody will be told when one comes in. Save anyway?')) return; }
      b.disabled = true;
      API.call('settings', { team: clean }).then(function (r) { D.team = r.team; TEAM = clone(r.team); saveCache(); b.disabled = false; UI.setDirty = false; toast('Team saved.'); }, function (e) { b.disabled = false; toast(API.words(e), { bad: true }); });
    };
    m.addEventListener('input', function (e) {
      var k = e.target.getAttribute('data-s');
      if (k) { SET[k] = k === 'lines' ? e.target.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean) : e.target.value; UI.setDirty = true; }
      var mk = e.target.getAttribute('data-smoney');
      if (mk) { moneyInput(e.target); SET[mk] = QC.parseMoney(e.target.value) || 0; UI.setDirty = true; }
      var snt = e.target.getAttribute('data-snt'); if (snt !== null) { SET.notes[+snt].t = e.target.value; UI.setDirty = true; }
      if (/prefix|next|digits/.test(k || '')) $('#ref-eg').textContent = QC.refFor(SET.prefix, SET.next, SET.digits);
    });
    m.addEventListener('change', function (e) { var sn = e.target.getAttribute('data-sn'); if (sn !== null) { SET.notes[+sn].on = e.target.checked; UI.setDirty = true; } });
    $('#set-notes').addEventListener('click', function (e) { var x = e.target.closest('[data-snx]'); if (!x) return; SET.notes.splice(+x.getAttribute('data-snx'), 1); $('#set-notes').innerHTML = notesRows(); UI.setDirty = true; });
    $('#note-add').onclick = function () { SET.notes.push({ t: '', on: false }); $('#set-notes').innerHTML = notesRows(); var x = $$('[data-snt]').pop(); if (x) x.focus(); };
    $('#set-save').onclick = function () {
      var b = this; b.disabled = true;
      SET.notes = SET.notes.filter(function (n) { return QC.str(n.t); });
      API.call('settings', { settings: SET }).then(function (r) { D.settings = r.settings; saveCache(); b.disabled = false; UI.setDirty = false; toast('Saved.'); }, function (e) { b.disabled = false; toast(API.words(e), { bad: true }); });
    };
    $('#g-save').onclick = function () {
      var k = $('#g-key').value.trim(); if (!k) return;
      var b = this; b.disabled = true;
      API.call('setKey', { key: k }).then(function () {
        D.gemini = true; saveCache(); toast('Key saved. Testing it…');
        return API.call('testAi', {}, { timeout: 200000 }).then(function (r) { D.model = r.model; saveCache(); toast('Gemini works (' + r.model + ').'); renderView(); });
      }).catch(function (e) { b.disabled = false; toast(API.words(e), { bad: true }); renderView(); });
    };
    var t = $('#g-test'); if (t) t.onclick = function () { t.disabled = true; API.call('testAi', {}, { timeout: 200000 }).then(function (r) { t.disabled = false; D.model = r.model; saveCache(); toast('Gemini works (' + r.model + ').'); }, function (e) { t.disabled = false; toast(API.words(e), { bad: true }); }); };
    var off = $('#g-off'); if (off) off.onclick = function () { if (!confirm('Switch Gemini off? Tidy will make plain lists instead.')) return; API.call('setKey', { key: '' }).then(function () { D.gemini = false; saveCache(); renderView(); }, function (e) { toast(API.words(e), { bad: true }); }); };
  }

  window.addEventListener('beforeunload', function (e) { if (UI.open && dirty()) { saveOpen(); e.preventDefault(); e.returnValue = ''; } });
  window.QuotesApp = { boot: boot, state: function () { return { D: D, UI: UI, ME: ME, DR: DR, EDIT: EDIT }; }, refresh: refresh, openQuote: openQuote };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
