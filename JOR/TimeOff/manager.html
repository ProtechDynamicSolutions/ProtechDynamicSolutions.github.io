<script>/* engine.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Leave — the engine
   Dates, working days, balances, coverage and the conflict rules. No DOM
   in this file: everything here takes state in and gives an answer back,
   so the rules can be reasoned about (and changed) on their own.
   ═══════════════════════════════════════════════════════════════════════ */

window.Engine = (function () {

  /* ── Dates ──────────────────────────────────────────────────────────── *
     Everything is an ISO 'YYYY-MM-DD' string and every calculation is done
     in UTC, so an Irish clock change can never move a leave day.          */

  const DAY = 86400000;
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  const MON3 = MONTHS.map(function (m) { return m.slice(0, 3); });
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function D(iso) { return new Date(iso + 'T00:00:00Z'); }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function add(isoStr, n) { return iso(new Date(D(isoStr).getTime() + n * DAY)); }
  function diff(a, b) { return Math.round((D(b) - D(a)) / DAY); }
  function dow(isoStr) { return D(isoStr).getUTCDay(); }              // 0 Sun … 6 Sat
  function isWeekend(isoStr) { const d = dow(isoStr); return d === 0 || d === 6; }
  function range(a, b) {
    const out = [];
    for (let d = a; d <= b; d = add(d, 1)) out.push(d);
    return out;
  }
  function monthKey(isoStr) { return isoStr.slice(0, 7); }
  function startOfWeek(isoStr) {                                       // Monday
    const d = dow(isoStr);
    return add(isoStr, d === 0 ? -6 : 1 - d);
  }
  function endOfMonth(y, m) { return iso(new Date(Date.UTC(y, m + 1, 0))); }
  function startOfMonth(y, m) { return iso(new Date(Date.UTC(y, m, 1))); }

  function fmt(isoStr, style) {
    if (!isoStr) return '—';
    const d = D(isoStr);
    const day = d.getUTCDate(), mo = d.getUTCMonth(), yr = d.getUTCFullYear();
    if (style === 'short') return day + ' ' + MON3[mo];
    if (style === 'day') return DOW[d.getUTCDay()] + ' ' + day + ' ' + MON3[mo];
    if (style === 'long') return DOW[d.getUTCDay()] + ' ' + day + ' ' + MONTHS[mo] + ' ' + yr;
    return day + ' ' + MON3[mo] + ' ' + yr;
  }
  /* "12–16 Oct 2026", collapsing whatever the two ends share. */
  function fmtRange(a, b) {
    if (a === b) return fmt(a, 'day') + ' ' + D(a).getUTCFullYear();
    const da = D(a), db = D(b);
    const sameY = da.getUTCFullYear() === db.getUTCFullYear();
    const sameM = sameY && da.getUTCMonth() === db.getUTCMonth();
    if (sameM) return da.getUTCDate() + '–' + db.getUTCDate() + ' ' + MON3[db.getUTCMonth()] + ' ' + db.getUTCFullYear();
    if (sameY) return fmt(a, 'short') + ' – ' + fmt(b, 'short') + ' ' + db.getUTCFullYear();
    return fmt(a) + ' – ' + fmt(b);
  }
  function relative(isoStr, today) {
    const n = diff(today, isoStr);
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    if (n === -1) return 'yesterday';
    if (n > 0) return 'in ' + (n < 14 ? n + ' days' : n < 60 ? Math.round(n / 7) + ' weeks' : Math.round(n / 30) + ' months');
    const m = -n;
    return (m < 14 ? m + ' days' : m < 60 ? Math.round(m / 7) + ' weeks' : Math.round(m / 30) + ' months') + ' ago';
  }

  /* ── Public holidays ────────────────────────────────────────────────── */
  function holidayMap(holidays) {
    const m = {};
    holidays.forEach(function (h) { m[h.date] = h.name; });
    return m;
  }

  /* ── Working days ───────────────────────────────────────────────────── *
     Returns the day-by-day breakdown as well as the total, because the
     request panel shows people exactly which days were not counted.       */
  function workingDays(req, hmap) {
    const days = [];
    let total = 0;
    const all = range(req.from, req.to);
    all.forEach(function (d, i) {
      let frac = 1, why = null;
      if (isWeekend(d)) { frac = 0; why = 'weekend'; }
      else if (hmap[d]) { frac = 0; why = hmap[d]; }
      else {
        const first = i === 0, last = i === all.length - 1;
        if (first && req.halfStart) frac = 0.5;
        if (last && req.halfEnd) frac = (first && req.halfStart) ? 0.5 : 0.5;
      }
      total += frac;
      days.push({ date: d, frac: frac, why: why });
    });
    return { total: Math.round(total * 2) / 2, days: days };
  }

  /* Does a request cover this date at all (any fraction)? */
  function covers(req, date, hmap) {
    if (date < req.from || date > req.to) return 0;
    if (isWeekend(date) || (hmap && hmap[date])) return 0;
    if (date === req.from && req.halfStart) return 0.5;
    if (date === req.to && req.halfEnd) return 0.5;
    return 1;
  }

  function overlaps(a, b) { return a.from <= b.to && b.from <= a.to; }

  /* ── Balances ───────────────────────────────────────────────────────── */
  const LIVE = { approved: 1, pending: 1 };

  function balance(person, state, opts) {
    const hmap = state.hmap;
    const yStart = state.policy.leaveYearStart, yEnd = state.policy.leaveYearEnd;
    const today = state.today;
    const skipId = (opts && opts.skip) || null;

    let taken = 0, booked = 0, pending = 0, toilUsed = 0, toilPending = 0;
    let unpaid = 0, sick = 0, other = 0;

    state.requests.forEach(function (rq) {
      if (rq.personId !== person.id) return;
      if (rq.id === skipId) return;
      if (rq.status === 'declined' || rq.status === 'cancelled') return;
      if (rq.to < yStart || rq.from > yEnd) return;
      const wd = workingDays(rq, hmap).total;
      const t = state.typeMap[rq.type];
      if (!t) return;
      if (t.deducts === 'annual') {
        if (rq.status === 'pending') pending += wd;
        else if (rq.to < today) taken += wd;
        else booked += wd;
      } else if (t.deducts === 'toil') {
        if (rq.status === 'pending') toilPending += wd; else toilUsed += wd;
      } else if (rq.type === 'sick') sick += wd;
      else if (rq.type === 'unpaid') unpaid += wd;
      else other += wd;
    });

    const allow = person.entitlement + person.carry;
    const remaining = Math.round((allow - taken - booked - pending) * 2) / 2;
    return {
      entitlement: person.entitlement, carry: person.carry, allowance: allow,
      taken: taken, booked: booked, pending: pending, remaining: remaining,
      committed: Math.round((taken + booked + pending) * 2) / 2,
      pct: allow ? Math.min(100, Math.round(((taken + booked + pending) / allow) * 100)) : 0,
      toil: person.toil, toilUsed: toilUsed, toilPending: toilPending,
      toilLeft: Math.round((person.toil - toilUsed - toilPending) * 2) / 2,
      sick: sick, unpaid: unpaid, other: other
    };
  }

  /* ── Who is off ─────────────────────────────────────────────────────── */
  function offOn(date, state, opts) {
    const o = opts || {};
    const out = [];
    state.requests.forEach(function (rq) {
      if (rq.id === o.skip) return;
      if (rq.status !== 'approved' && !(o.includePending && rq.status === 'pending')) return;
      const frac = covers(rq, date, state.hmap);
      if (!frac) return;
      const p = state.personMap[rq.personId];
      if (!p) return;
      if (o.dept && p.dept !== o.dept) return;
      if (o.exclude && p.id === o.exclude) return;
      out.push({ person: p, req: rq, frac: frac });
    });
    return out;
  }

  /* Cover for one department on one date. */
  function cover(date, deptId, state, opts) {
    const o = opts || {};
    const dept = state.deptMap[deptId];
    const head = state.people.filter(function (p) { return p.dept === deptId; }).length;
    const off = offOn(date, state, {
      dept: deptId, includePending: o.includePending !== false && state.policy.countPendingInCover,
      skip: o.skip, exclude: o.exclude
    });
    const extra = (o.extraOff || []).filter(function (x) { return x.dept === deptId; }).length;
    const offCount = off.length + extra;
    const available = head - offCount;
    return {
      dept: dept, head: head, off: off, offCount: offCount, available: available,
      min: dept ? dept.minCover : 0,
      short: dept ? Math.max(0, dept.minCover - available) : 0,
      pct: head ? offCount / head : 0,
      weekend: isWeekend(date) || !!state.hmap[date]
    };
  }

  /* ── Blackouts ──────────────────────────────────────────────────────── */
  function blackoutsFor(person, from, to, state) {
    return state.blackouts.filter(function (b) {
      return b.from <= to && from <= b.to &&
        (!b.depts || !b.depts.length || b.depts.indexOf(person.dept) >= 0);
    });
  }

  /* ── Conflicts ──────────────────────────────────────────────────────── *
     The heart of it. Given a request (saved or not yet saved) this returns
     a level and the reasons behind it. Levels rank clear < note < caution
     < clash < blocked.                                                    */
  const RANK = { clear: 0, note: 1, caution: 2, clash: 3, blocked: 4 };
  const LEVEL_LABEL = { clear: 'Clear', note: 'For information', caution: 'Caution', clash: 'Clash', blocked: 'Blocked' };

  function worst(items) {
    let lv = 'clear';
    items.forEach(function (i) { if (RANK[i.level] > RANK[lv]) lv = i.level; });
    return lv;
  }

  function analyse(req, state) {
    const person = state.personMap[req.personId];
    const items = [];
    if (!person) return { level: 'clear', items: items, wd: { total: 0, days: [] }, coverDays: [] };

    const hmap = state.hmap;
    const wd = workingDays(req, hmap);
    const type = state.typeMap[req.type] || {};
    const today = state.today;
    const skip = req.id || '__new__';

    /* 1 — no working days at all */
    if (wd.total === 0) {
      items.push({ level: 'caution', key: 'nodays', icon: '◔',
        title: 'No working days in these dates',
        detail: 'Every day selected is a weekend or a public holiday, so nothing would be deducted.' });
    }

    /* 2 — already booked over the same dates */
    const own = state.requests.filter(function (r) {
      return r.personId === person.id && r.id !== skip &&
        (r.status === 'approved' || r.status === 'pending') && overlaps(r, req);
    });
    if (own.length) {
      items.push({ level: 'blocked', key: 'own', icon: '⊘',
        title: 'Already booked over these dates',
        detail: own.map(function (r) {
          return (state.typeMap[r.type] || {}).name + ' ' + fmtRange(r.from, r.to) + ' (' + r.status + ')';
        }).join(' · ') });
    }

    /* 3 — balance */
    if (type.deducts === 'annual') {
      const bal = balance(person, state, { skip: skip });
      if (wd.total > bal.remaining) {
        items.push({ level: 'blocked', key: 'balance', icon: '⊘',
          title: 'Not enough annual leave left',
          detail: 'This asks for ' + num(wd.total) + ' day' + (wd.total === 1 ? '' : 's') +
            ' and ' + num(bal.remaining) + ' remain' + (bal.remaining === 1 ? 's' : '') + ' for ' +
            D(state.policy.leaveYearStart).getUTCFullYear() + '.' });
      } else if (bal.remaining - wd.total <= 1 && bal.remaining - wd.total >= 0) {
        items.push({ level: 'note', key: 'balancelow', icon: '◔',
          title: 'This uses nearly all of the allowance',
          detail: num(bal.remaining - wd.total) + ' day' + (bal.remaining - wd.total === 1 ? '' : 's') + ' would be left for the rest of the year.' });
      }
    }
    if (type.deducts === 'toil') {
      const bal = balance(person, state, { skip: skip });
      if (wd.total > bal.toilLeft) {
        items.push({ level: 'blocked', key: 'toil', icon: '⊘',
          title: 'Not enough time off in lieu banked',
          detail: num(bal.toilLeft) + ' day' + (bal.toilLeft === 1 ? '' : 's') + ' in the bank against ' + num(wd.total) + ' asked for.' });
      }
    }

    /* 4 — notice, counted from the day it was asked for */
    if (req.from >= today && type.approval) {
      const askedOn = req.submitted && req.submitted <= today ? req.submitted : today;
      const notice = diff(askedOn, req.from);
      const need = wd.total >= 5 ? state.policy.noticeLong : state.policy.noticeShort;
      if (notice < need) {
        items.push({ level: notice < Math.ceil(need / 3) ? 'clash' : 'caution', key: 'notice', icon: '⏱',
          title: 'Short notice',
          detail: notice + ' day' + (notice === 1 ? '' : 's') + '’ notice where the policy asks for ' + need +
            ' on a request of ' + num(wd.total) + ' day' + (wd.total === 1 ? '' : 's') + '.' });
      }
    } else if (req.from < today && type.approval && !req.id) {
      items.push({ level: 'caution', key: 'past', icon: '⏱',
        title: 'These dates are in the past',
        detail: 'Retrospective leave can be recorded, but it needs a word with the line manager.' });
    }

    /* 5 — length */
    if (wd.total > state.policy.maxConsecutive) {
      items.push({ level: 'clash', key: 'long', icon: '⇥',
        title: 'Longer than one unbroken block allows',
        detail: num(wd.total) + ' working days against a limit of ' + state.policy.maxConsecutive + '. It needs sign-off above the line manager.' });
    }

    /* 6 — blackout */
    blackoutsFor(person, req.from, req.to, state).forEach(function (b) {
      items.push({ level: b.level === 'block' ? 'blocked' : 'caution', key: 'bk-' + b.id,
        icon: b.level === 'block' ? '⊘' : '▲',
        title: (b.level === 'block' ? 'Closed period — ' : 'Busy period — ') + b.name,
        detail: b.why + ' (' + fmtRange(b.from, b.to) + ')' });
    });

    /* 7 — the same area of the company, day by day */
    const coverDays = [];
    let shortDays = 0, worstShort = 0;
    const peerTally = {};      // personId → days overlapping
    const roleTally = {};      // personId → days overlapping, same job
    wd.days.forEach(function (d) {
      if (!d.frac) return;
      /* Exclude every other booking this person already holds, then add them
         back exactly once — otherwise an overlapping request counts twice. */
      const c = cover(d.date, person.dept, state, { skip: skip, exclude: person.id, extraOff: [person] });
      coverDays.push({ date: d.date, cover: c });
      if (c.short > 0) { shortDays++; worstShort = Math.max(worstShort, c.short); }
      c.off.forEach(function (o) {
        if (o.person.id === person.id) return;
        peerTally[o.person.id] = (peerTally[o.person.id] || 0) + 1;
        if (o.person.roleKey === person.roleKey) roleTally[o.person.id] = (roleTally[o.person.id] || 0) + 1;
      });
    });

    const peers = Object.keys(peerTally).map(function (id) {
      return { person: state.personMap[id], days: peerTally[id] };
    }).sort(function (a, b) { return b.days - a.days; });

    if (shortDays) {
      items.push({
        level: state.policy.hardBlockBelowCover ? 'blocked' : 'clash', key: 'cover', icon: '▲',
        title: (state.deptMap[person.dept] || {}).name + ' drops below minimum cover',
        detail: shortDays + ' of the ' + wd.days.filter(function (d) { return d.frac; }).length +
          ' working day' + (shortDays === 1 ? '' : 's') + ' would leave the team ' + worstShort +
          ' short of the ' + (state.deptMap[person.dept] || {}).minCover + ' people it needs on the floor.'
      });
    }

    const roleMates = Object.keys(roleTally).map(function (id) {
      return { person: state.personMap[id], days: roleTally[id] };
    });
    if (roleMates.length) {
      items.push({ level: 'clash', key: 'role', icon: '⚑',
        title: 'Nobody covering the ' + person.role + ' desk',
        detail: roleMates.map(function (m) { return m.person.name; }).join(', ') +
          ' ' + (roleMates.length === 1 ? 'does' : 'do') + ' the same job and ' +
          (roleMates.length === 1 ? 'is' : 'are') + ' off across ' +
          roleMates[0].days + ' of these days.' });
    } else if (peers.length) {
      items.push({ level: 'caution', key: 'peers', icon: '◔',
        title: peers.length + ' other' + (peers.length === 1 ? '' : 's') + ' in ' + (state.deptMap[person.dept] || {}).name + ' off at the same time',
        detail: peers.slice(0, 4).map(function (m) {
          return m.person.name + ' (' + m.person.role + ')';
        }).join(' · ') + (peers.length > 4 ? ' and ' + (peers.length - 4) + ' more' : '') });
    }

    /* 8 — the only one who does this job */
    if (person.sole && wd.total >= 3) {
      items.push({ level: 'note', key: 'sole', icon: '◇',
        title: 'Nobody else does this job',
        detail: person.name.split(' ')[0] + ' is the only ' + person.role +
          ' — the request should name who picks the work up.' });
    }

    /* 9 — the manager away too */
    if (person.manager) {
      const mgr = state.personMap[person.manager];
      const mgrOff = mgr && wd.days.some(function (d) {
        return d.frac && offOn(d.date, state, { includePending: true, skip: skip })
          .some(function (o) { return o.person.id === mgr.id; });
      });
      if (mgrOff) {
        items.push({ level: 'caution', key: 'mgr', icon: '◔',
          title: mgr.name + ' is away over these dates too',
          detail: 'With the line manager off as well, escalations would go to ' +
            ((state.personMap[mgr.manager] || {}).name || 'the MD') + '.' });
      }
    }

    /* 10 — a whole department emptying out */
    const deptSize = state.people.filter(function (p) { return p.dept === person.dept; }).length;
    if (peers.length + 1 >= Math.ceil(deptSize / 2) && deptSize > 2) {
      items.push({ level: 'clash', key: 'half', icon: '⚑',
        title: 'Half of ' + (state.deptMap[person.dept] || {}).name + ' would be away',
        detail: (peers.length + 1) + ' of ' + deptSize + ' people off together.' });
    }

    /* 11 — carry-over about to lapse */
    if (type.deducts === 'annual' && person.carry > 0 && req.from > state.policy.carryOverExpires) {
      items.push({ level: 'note', key: 'carry', icon: '◇',
        title: num(person.carry) + ' carried-over day' + (person.carry === 1 ? '' : 's') + ' lapse on ' + fmt(state.policy.carryOverExpires, 'short'),
        detail: 'Booking before then uses those first.' });
    }

    return { level: worst(items), items: items, wd: wd, coverDays: coverDays, peers: peers, roleMates: roleMates };
  }

  /* ── Alternative windows ────────────────────────────────────────────── *
     When a request clashes, offer the nearest dates of the same length that
     do not. Searched outwards from the wanted start so the closest wins.   */
  function suggest(req, state, limit) {
    const want = workingDays(req, state.hmap).total;
    if (!want) return [];
    const span = diff(req.from, req.to);
    const out = [];
    const offsets = [];
    for (let k = 1; k <= 63; k++) { offsets.push(k); offsets.push(-k); }
    for (let i = 0; i < offsets.length && out.length < (limit || 3); i++) {
      const from = add(req.from, offsets[i]);
      if (from < state.today) continue;
      const cand = Object.assign({}, req, { from: from, to: add(from, span) });
      const wdc = workingDays(cand, state.hmap);
      if (wdc.total !== want) continue;
      const a = analyse(cand, state);
      if (RANK[a.level] >= RANK.clash) continue;
      if (out.some(function (o) { return Math.abs(diff(o.from, from)) < 3; })) continue;
      out.push({ from: cand.from, to: cand.to, level: a.level, days: wdc.total, shift: offsets[i] });
    }
    return out.sort(function (a, b) {
      return (RANK[a.level] - RANK[b.level]) || (Math.abs(a.shift) - Math.abs(b.shift));
    }).slice(0, limit || 3);
  }

  /* ── Coverage across a span, for the charts ─────────────────────────── */
  function coverSeries(from, to, deptId, state) {
    return range(from, to).map(function (d) {
      const c = cover(d, deptId, state, {});
      return { date: d, off: c.offCount, head: c.head, available: c.available, min: c.min, short: c.short, weekend: c.weekend };
    });
  }

  /* Days in a span where any department is short. */
  function riskDays(from, to, state) {
    const out = [];
    range(from, to).forEach(function (d) {
      if (isWeekend(d) || state.hmap[d]) return;
      state.departments.forEach(function (dep) {
        const c = cover(d, dep.id, state, {});
        if (c.short > 0) out.push({ date: d, dept: dep, short: c.short, off: c.off });
      });
    });
    return out;
  }

  /* Leave days by month, for the seasonality chart. */
  function monthlySpread(state, filter) {
    const buckets = {};
    for (let m = 0; m < 12; m++) buckets[m] = { annual: 0, other: 0, sick: 0 };
    const yStart = state.policy.leaveYearStart, yEnd = state.policy.leaveYearEnd;
    state.requests.forEach(function (rq) {
      if (rq.status === 'declined' || rq.status === 'cancelled') return;
      const p = state.personMap[rq.personId];
      if (!p) return;
      if (filter && filter.dept && p.dept !== filter.dept) return;
      workingDays(rq, state.hmap).days.forEach(function (d) {
        if (!d.frac || d.date < yStart || d.date > yEnd) return;
        const m = D(d.date).getUTCMonth();
        const t = state.typeMap[rq.type] || {};
        if (rq.type === 'sick') buckets[m].sick += d.frac;
        else if (t.deducts === 'annual') buckets[m].annual += d.frac;
        else buckets[m].other += d.frac;
      });
    });
    return Object.keys(buckets).map(function (m) {
      return { month: +m, name: MON3[m], full: MONTHS[m] };
    }).map(function (o) { return Object.assign(o, buckets[o.month]); });
  }

  function num(n) {
    if (n === null || n === undefined || isNaN(n)) return '0';
    return (Math.round(n * 2) / 2).toString().replace(/\.0$/, '');
  }

  return {
    DAY: DAY, MONTHS: MONTHS, MON3: MON3, DOW: DOW, RANK: RANK, LEVEL_LABEL: LEVEL_LABEL,
    D: D, iso: iso, add: add, diff: diff, dow: dow, isWeekend: isWeekend, range: range,
    monthKey: monthKey, startOfWeek: startOfWeek, startOfMonth: startOfMonth, endOfMonth: endOfMonth,
    fmt: fmt, fmtRange: fmtRange, relative: relative, num: num,
    holidayMap: holidayMap, workingDays: workingDays, covers: covers, overlaps: overlaps,
    balance: balance, offOn: offOn, cover: cover, blackoutsFor: blackoutsFor,
    analyse: analyse, suggest: suggest, coverSeries: coverSeries, riskDays: riskDays,
    monthlySpread: monthlySpread, worst: worst
  };
})();

</script>
<script>/* core.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Leave — shared core
   Used by both apps: the staff booking app (staff.html) and the manager app
   (manager.html). Holds the storage, sign-in, live sync between the two, and
   the drawing helpers both of them use. The rules themselves are engine.js.

   Both apps read and write the same localStorage key. Opened from the same
   folder (or the same website) they share it, so a request sent from the
   staff app appears in the manager app straight away, and a decision made
   there appears back in the staff app — the 'storage' event carries it.
   ═══════════════════════════════════════════════════════════════════════ */

window.Core = (function () {
  'use strict';

  const E = window.Engine, DATA = window.JOR_DATA;
  const KEY = 'jor.leave.v3';
  const C = { E: E, DATA: DATA, KEY: KEY, S: null };

  /* ══ State ════════════════════════════════════════════════════════════ */

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function fresh() {
    const people = clone(DATA.PEOPLE);
    people.forEach(function (p) { p.pinHash = sha256('jorleave:' + DATA.DEMO_PINS[p.access || 'staff']); });
    return {
      policy: clone(DATA.POLICY),
      departments: clone(DATA.DEPARTMENTS),
      leaveTypes: clone(DATA.LEAVE_TYPES),
      holidays: clone(DATA.HOLIDAYS),
      blackouts: clone(DATA.BLACKOUTS),
      people: people,
      requests: DATA.buildRequests(),
      today: DATA.TODAY,
      log: []
    };
  }

  function hydrate(s) {
    s.personMap = {}; s.people.forEach(function (p) { s.personMap[p.id] = p; });
    s.deptMap = {}; s.departments.forEach(function (d) { s.deptMap[d.id] = d; });
    s.typeMap = {}; s.leaveTypes.forEach(function (t) { s.typeMap[t.id] = t; });
    s.hmap = E.holidayMap(s.holidays);
    return s;
  }

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) {
      C.S = hydrate(fresh());
      save();                                   // so the other app starts from the same seed
      return C.S;
    }
    try {
      const d = JSON.parse(raw);
      const s = fresh();
      ['policy', 'departments', 'blackouts', 'people', 'requests', 'today', 'log'].forEach(function (k) {
        if (d[k]) s[k] = d[k];
      });
      /* The owner is Bernard O'Reilly and the manager is Iain Dearden, the COO:
         correct a record saved before either was put right. */
      s.people.forEach(function (p) {
        if (p.id === 'p01' && p.name === "Joe O'Reilly") {
          p.name = "Bernard O'Reilly"; p.initials = 'BO'; p.email = 'bernard.oreilly@jorireland.ie';
        }
        if (p.id === 'p02' && p.name === 'Aoife Ní Bhriain') {
          p.name = 'Iain Dearden'; p.initials = 'ID'; p.email = 'iain.dearden@jorireland.ie';
          p.role = 'Chief Operating Officer'; p.roleKey = 'coo';
        }
      });
      C.S = hydrate(s);
    } catch (e) { C.S = hydrate(fresh()); }
    return C.S;
  }

  function save() {
    const S = C.S;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        policy: S.policy, departments: S.departments, blackouts: S.blackouts, people: S.people,
        requests: S.requests, today: S.today, log: S.log, savedAt: Date.now()
      }));
    } catch (e) { /* a full or blocked store must never stop the app */ }
  }

  function reset() {
    try { localStorage.removeItem(KEY); } catch (e) { }
    return load();
  }

  /* The other app wrote something: reload and tell the caller what changed. */
  function onSync(cb) {
    window.addEventListener('storage', function (ev) {
      if (ev.key !== KEY) return;
      const before = {};
      (C.S ? C.S.requests : []).forEach(function (r) { before[r.id] = r.status; });
      load();
      const added = [], changed = [];
      C.S.requests.forEach(function (r) {
        if (!(r.id in before)) added.push(r);
        else if (before[r.id] !== r.status) changed.push(r);
      });
      cb({ added: added, changed: changed });
    });
  }

  function logIt(what, r, by, detail) {
    const who = C.S.personMap[r.personId];
    C.S.log.push({
      at: C.S.today, what: what, by: by,
      detail: (who ? who.name + ' · ' : '') + E.fmtRange(r.from, r.to) + (detail ? ' · ' + detail : '')
    });
    if (C.S.log.length > 400) C.S.log = C.S.log.slice(-400);
  }

  /* ══ Sign-in ══════════════════════════════════════════════════════════ *
     A demo on one machine: the codes are hashed, never stored as typed, but
     anyone with the files could change them. Real use needs a server that
     checks the code — see the README.                                      */

  function sessionKey(app) { return 'jor.leave.session.' + app; }
  function signIn(app, personId, code) {
    const p = C.S.personMap[personId];
    if (!p) return 'Pick your name.';
    if (!code) return 'Enter your code.';
    if (sha256('jorleave:' + code) !== p.pinHash) return 'That code is not right.';
    if (app === 'manager' && p.access !== 'manager' && p.access !== 'owner') {
      return 'Only the manager and the owner can open this app.';
    }
    try { sessionStorage.setItem(sessionKey(app), personId); } catch (e) { }
    return null;
  }
  function current(app) {
    let id = null;
    try { id = sessionStorage.getItem(sessionKey(app)); } catch (e) { }
    const p = id && C.S.personMap[id];
    if (!p) return null;
    if (app === 'manager' && p.access !== 'manager' && p.access !== 'owner') return null;
    return p;
  }
  function signOut(app) { try { sessionStorage.removeItem(sessionKey(app)); } catch (e) { } }
  function setCode(personId, code) {
    const p = C.S.personMap[personId];
    if (p) p.pinHash = sha256('jorleave:' + code);
  }

  /* ══ SHA-256 ═════════════════════════════════════════════════════════ *
     Synchronous and self-contained, so it works straight off the disk where
     the browser's own crypto may not be offered.                           */
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    const str = unescape(encodeURIComponent(ascii));
    const K = [], H = [];
    let primes = 0;
    const isComposite = {};
    for (let c = 2; primes < 64; c++) {
      if (!isComposite[c]) {
        for (let i = 0; i < 313; i += c) isComposite[i] = c;
        H[primes] = (Math.pow(c, 0.5) * 4294967296) | 0;
        K[primes++] = (Math.pow(c, 1 / 3) * 4294967296) | 0;
      }
    }
    const hash = H.slice(0, 8);
    const words = [];
    const bitLen = str.length * 8;
    let s = str + '\x80';
    while (s.length % 64 - 56) s += '\x00';
    for (let i = 0; i < s.length; i++) {
      const j = s.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (bitLen / 4294967296) | 0;
    words[words.length] = bitLen;
    for (let j = 0; j < words.length;) {
      const w = words.slice(j, j += 16);
      const old = hash.slice(0);
      for (let i = 0; i < 64; i++) {
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = hash[0], e = hash[4];
        const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + K[i] +
          (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] +
            (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash.unshift((t1 + t2) | 0);
        hash[4] = (hash[4] + t1) | 0;
        hash.pop();
      }
      for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
    }
    let out = '';
    for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      out += (b < 16 ? '0' : '') + b.toString(16);
    }
    return out;
  }

  /* ══ Small helpers ═══════════════════════════════════════════════════ */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function n(v) { return E.num(v); }
  function plural(v, s, p) { return n(v) + ' ' + (Math.abs(v) === 1 ? s : (p || s + 's')); }
  function dept(id) { return C.S.deptMap[id] || { name: '—', tint: '#888', minCover: 0, short: '' }; }
  function type(id) { return C.S.typeMap[id] || { name: id, tint: '#888', short: '?' }; }
  function tint(p) { return dept(p.dept).tint; }
  function uid(prefix) { return (prefix || 'r') + Math.random().toString(36).slice(2, 9); }
  function first(p) { return p ? p.name.split(' ')[0] : ''; }
  function find(id) { return C.S.requests.filter(function (x) { return x.id === id; })[0]; }
  function approverOf(p) { return C.S.personMap[p.manager] || null; }

  function toast(msg, kind) {
    const t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'on' + (kind ? ' ' + kind : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, 3800);
  }

  function download(name, text, mime) {
    const b = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function exportCSV(rows, name) {
    const csv = rows.map(function (r) {
      return r.map(function (c) {
        const s = String(c === null || c === undefined ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    download(name, '﻿' + csv, 'text/csv;charset=utf-8');
  }

  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  }
  function nextWorking(d) {
    let g = 0;
    while ((E.isWeekend(d) || C.S.hmap[d]) && g++ < 20) d = E.add(d, 1);
    return d;
  }

  /* ══ Little pieces of markup ═════════════════════════════════════════ */

  function avatar(p, cls) {
    return '<span class="av ' + (cls || '') + '" style="background:' + tint(p) + '">' + esc(p.initials) + '</span>';
  }
  function personCell(p, sub) {
    return '<div class="person">' + avatar(p, 'sm') +
      '<div class="pn"><b>' + esc(p.name) + '</b><span>' + esc(sub === undefined ? p.role : sub) + '</span></div></div>';
  }
  function statusPill(st) {
    const label = { pending: 'Awaiting decision', approved: 'Approved', declined: 'Declined', cancelled: 'Cancelled' }[st] || st;
    return '<span class="status s-' + st + '">' + label + '</span>';
  }
  function levelPill(lv) {
    const map = { clear: 'pill', note: 'pill grey', caution: 'pill amber', clash: 'pill orange', blocked: 'pill red' };
    return '<span class="' + map[lv] + '">' + E.LEVEL_LABEL[lv] + '</span>';
  }
  function typeChip(t) {
    return '<span class="pill" style="background:' + t.tint + '18;border-color:' + t.tint + '44;color:' + t.tint + '">' +
      '<i class="dot" style="background:' + t.tint + '"></i>' + esc(t.name) + '</span>';
  }
  function tile(label, value, sub, cls, act) {
    return '<div class="tile ' + (cls || '') + (act ? ' clickable' : '') + '"' + (act ? ' data-act="' + act + '"' : '') + '>' +
      '<div class="tl">' + esc(label) + '</div><div class="tv">' + value + '</div>' +
      '<div class="ts">' + esc(sub) + '</div></div>';
  }
  const ICON = { clear: '✓', note: '◇', caution: '▲', clash: '⚑', blocked: '⊘' };
  function flags(items, emptyTitle, emptyText) {
    if (!items.length) {
      return '<div class="flag l-note"><div class="fi">✓</div><div><b>' + esc(emptyTitle) + '</b><p>' + esc(emptyText) + '</p></div></div>';
    }
    return '<div class="flags">' + items.map(function (i) {
      return '<div class="flag l-' + i.level + '"><div class="fi">' + i.icon + '</div><div>' +
        '<b>' + esc(i.title) + '</b><p>' + esc(i.detail) + '</p></div></div>';
    }).join('') + '</div>';
  }
  function coverStrip(coverDays, title) {
    if (!coverDays.length || coverDays.length > 21) return '';
    return '<div class="mini" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">' +
      esc(title) + '</div><div class="coverstrip">' +
      coverDays.map(function (c) {
        const cls = c.cover.available <= 0 ? 'zero' : c.cover.short > 0 ? 'short' : '';
        return '<div class="cd ' + cls + '"><div class="cdl">' + E.DOW[E.dow(c.date)][0] + '<br>' + E.D(c.date).getUTCDate() +
          '</div><div class="cdb" title="' + esc(E.fmt(c.date, 'day') + ': ' + c.cover.available + ' of ' + c.cover.head + ' at work') +
          '">' + c.cover.available + '</div></div>';
      }).join('') + '</div>';
  }
  function label(text) {
    return '<div class="mini" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">' + esc(text) + '</div>';
  }

  /* ══ Charts ══════════════════════════════════════════════════════════ */

  function donut(segs, total, big, small) {
    const R = 66, Cc = 2 * Math.PI * R, W = 20;
    let at = 0;
    const arcs = segs.filter(function (s) { return s.v > 0; }).map(function (s) {
      const len = (s.v / (total || 1)) * Cc;
      const el = '<circle cx="84" cy="84" r="' + R + '" fill="none" stroke="' + s.tint + '" stroke-width="' + W +
        '" stroke-dasharray="' + len.toFixed(2) + ' ' + (Cc - len).toFixed(2) + '" stroke-dashoffset="' + (-at).toFixed(2) + '"></circle>';
      at += len;
      return el;
    }).join('');
    return '<div class="donut"><svg width="168" height="168" viewBox="0 0 168 168">' +
      '<circle cx="84" cy="84" r="' + R + '" fill="none" stroke="#EDF4F1" stroke-width="' + W + '"></circle>' +
      arcs + '</svg><div class="dmid"><div><b>' + big + '</b><span>' + small + '</span></div></div></div>';
  }
  function legendRows(segs) {
    return '<div class="legend">' + segs.map(function (s) {
      return '<div class="lr"><i class="sw" style="background:' + s.tint + '"></i><span>' + esc(s.label) + '</span><b>' + n(s.v) + '</b></div>';
    }).join('') + '</div>';
  }
  function allowanceDonut(bal) {
    return '<div class="donutwrap">' +
      donut([
        { v: bal.taken, tint: '#00A66E' }, { v: bal.booked, tint: '#6FCBA8' }, { v: bal.pending, tint: '#D9C27E' }
      ], bal.allowance, n(bal.remaining), 'days left') +
      legendRows([
        { v: bal.taken, tint: '#00A66E', label: 'Taken so far' },
        { v: bal.booked, tint: '#6FCBA8', label: 'Booked ahead' },
        { v: bal.pending, tint: '#D9C27E', label: 'Awaiting a decision' },
        { v: bal.remaining, tint: '#EDF4F1', label: 'Still to book' }
      ]) + '</div>';
  }

  function spreadChart(rows) {
    const W = 640, H = 170, padL = 26, padB = 24, padT = 10;
    const peak = Math.max.apply(null, rows.map(function (r) { return r.annual + r.other + r.sick; }));
    const step = peak <= 12 ? 4 : peak <= 30 ? 10 : peak <= 100 ? 20 : 50;
    const max = Math.max(step * 2, Math.ceil(peak / step) * step);
    const bw = (W - padL - 8) / rows.length;
    const y = function (v) { return padT + (H - padT - padB) * (1 - v / max); };
    let g = '';
    for (let i = 0; i <= max / step; i++) {
      const v = step * i;
      g += '<line class="gl" x1="' + padL + '" y1="' + y(v) + '" x2="' + W + '" y2="' + y(v) + '"></line>' +
        '<text class="ax" x="' + (padL - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">' + v + '</text>';
    }
    const bars = rows.map(function (r, i) {
      const x = padL + i * bw + bw * 0.16, w = bw * 0.68;
      let acc = 0, out = '';
      [{ v: r.annual, c: '#00A66E' }, { v: r.other, c: '#B08D2E' }, { v: r.sick, c: '#B3261E' }].forEach(function (s) {
        if (s.v <= 0) return;
        const h = (H - padT - padB) * (s.v / max);
        out += '<rect x="' + x.toFixed(1) + '" y="' + (y(acc) - h).toFixed(1) + '" width="' + w.toFixed(1) +
          '" height="' + h.toFixed(1) + '" fill="' + s.c + '" rx="2"><title>' + r.full + ' — ' + n(s.v) + ' days</title></rect>';
        acc += s.v;
      });
      out += '<text class="ax" x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + r.name + '</text>';
      return out;
    }).join('');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;max-height:' + (H * 1.6) + 'px">' + g + bars + '</svg>';
  }

  /* Staffing across the coming weeks, one row per department. */
  function coverHeat(weeks, onlyDept) {
    const S = C.S;
    const start = E.startOfWeek(S.today);
    const cols = [];
    for (let w = 0; w < weeks; w++) cols.push(E.add(start, w * 7));
    const head = '<tr><th style="width:150px"></th>' + cols.map(function (c) {
      return '<th style="font-size:9.5px;font-weight:700;color:var(--ink-3);padding:3px 0;text-align:center">' + E.fmt(c, 'short') + '</th>';
    }).join('') + '</tr>';
    const body = S.departments.filter(function (d) { return !onlyDept || d.id === onlyDept; }).map(function (d) {
      const cells = cols.map(function (c) {
        let worstShort = 0, maxOff = 0, headN = 0;
        for (let i = 0; i < 7; i++) {
          const day = E.add(c, i);
          if (E.isWeekend(day) || S.hmap[day]) continue;
          const cv = E.cover(day, d.id, S, {});
          headN = cv.head;
          worstShort = Math.max(worstShort, cv.short);
          maxOff = Math.max(maxOff, cv.offCount);
        }
        let bg = '#F5FAF8', fg = 'var(--ink-3)';
        if (worstShort >= 2) { bg = '#F5C9C4'; fg = '#8E1F19'; }
        else if (worstShort === 1) { bg = '#F6D9C4'; fg = '#8E3D0B'; }
        else if (maxOff >= 2) { bg = '#CDE7DC'; fg = '#0A5C41'; }
        else if (maxOff === 1) { bg = '#E8F3EE'; fg = '#127051'; }
        const t = d.name + ', week of ' + E.fmt(c, 'short') + ': ' + maxOff + ' of ' + headN + ' away' +
          (worstShort ? ', ' + worstShort + ' below the minimum' : '');
        return '<td style="text-align:center;padding:2px"><div title="' + esc(t) + '" style="background:' + bg +
          ';color:' + fg + ';border-radius:5px;height:26px;display:grid;place-items:center;font-size:11px;font-weight:700">' +
          (maxOff || '') + '</div></td>';
      }).join('');
      return '<tr><td style="font-size:11.5px;font-weight:600;color:var(--ink-2);padding-right:8px;white-space:nowrap">' +
        '<i class="dot" style="display:inline-block;background:' + d.tint + ';margin-right:6px"></i>' + esc(d.name) +
        ' <span class="mini">min ' + d.minCover + '</span></td>' + cells + '</tr>';
    }).join('');
    const key = function (bg, t) { return '<span><i class="dot" style="display:inline-block;background:' + bg + ';margin-right:5px"></i>' + t + '</span>'; };
    return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:640px">' + head + body + '</table></div>' +
      '<div class="row mini" style="margin-top:9px;gap:14px">' +
      key('#E8F3EE', 'quiet') + key('#CDE7DC', 'two or more away') +
      key('#F6D9C4', 'one below the minimum') + key('#F5C9C4', 'two or more below') +
      '<span class="rowend">The number is the most people away on any weekday of that week.</span></div>';
  }

  /* ══ Modal ═══════════════════════════════════════════════════════════ */

  let confirmFn = null;
  function openModal(title, body, foot) {
    $('#modal-title').innerHTML = title;
    $('#modal-body').innerHTML = body;
    $('#modal-foot').innerHTML = foot || '<button class="btn" data-act="closemodal">Close</button>';
    $('#scrim').classList.add('on');
    $('#modal').classList.add('on');
  }
  function closeModal() {
    $('#scrim').classList.remove('on');
    $('#modal').classList.remove('on');
  }
  function confirmDialog(title, body, okLabel, fn, danger) {
    confirmFn = fn;
    openModal(esc(title), body,
      '<button class="btn" data-act="closemodal">Back</button>' +
      '<button class="btn ' + (danger ? 'dngr' : 'p') + '" data-act="confirmyes">' + esc(okLabel) + '</button>');
  }
  function wireModal() {
    $('#scrim').addEventListener('click', closeModal);
    $('#modal-x').addEventListener('click', closeModal);
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });
    document.addEventListener('click', function (ev) {
      const el = ev.target.closest && ev.target.closest('[data-act]');
      if (!el) return;
      if (el.dataset.act === 'closemodal') closeModal();
      if (el.dataset.act === 'confirmyes') { const f = confirmFn; confirmFn = null; closeModal(); if (f) f(); }
    });
  }

  function brand() {
    if (!window.JOR_MARKS) return;
    document.querySelectorAll('img[data-logo]').forEach(function (i) { i.src = window.JOR_MARKS.logo; });
    const link = document.querySelector('link[rel="icon"]');
    if (link) link.href = window.JOR_MARKS.icon;
  }

  /* The sign-in card, shared by both apps. */
  function gate(opts) {
    const people = C.S.people.filter(opts.who);
    const byDept = {};
    people.forEach(function (x) { (byDept[x.dept] = byDept[x.dept] || []).push(x); });
    const options = opts.flat
      ? people.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + ' — ' + esc(x.role) + '</option>'; }).join('')
      : C.S.departments.map(function (d) {
        const list = byDept[d.id] || [];
        if (!list.length) return '';
        return '<optgroup label="' + esc(d.name) + '">' + list.map(function (x) {
          return '<option value="' + x.id + '">' + esc(x.name) + '</option>';
        }).join('') + '</optgroup>';
      }).join('');
    const el = document.createElement('div');
    el.className = 'gate';
    el.id = 'gate';
    el.innerHTML = '<div class="gatecard"><div class="gh"><span class="logobg"><img data-logo alt="JOR Ireland"></span>' +
      '<h1>' + esc(opts.title) + '</h1><p>' + esc(opts.sub) + '</p></div>' +
      '<form class="gb" id="gateform" autocomplete="off">' +
      '<div class="demohint">' + opts.hint + '</div>' +
      '<label class="f"><span>' + esc(opts.whoLabel) + '</span><select class="in" id="gatewho">' +
      '<option value="">Choose…</option>' + options + '</select></label>' +
      '<label class="f"><span>' + esc(opts.codeLabel) + '</span><input class="in" id="gatecode" type="password" ' +
      'inputmode="' + (opts.numeric ? 'numeric' : 'text') + '" autocomplete="off"></label>' +
      '<div class="err" id="gateerr"></div>' +
      '<button class="btn p block" type="submit">Sign in</button></form>' +
      '<div class="gf">' + opts.foot + '</div></div>';
    document.body.appendChild(el);
    brand();
    $('#gateform').addEventListener('submit', function (ev) {
      ev.preventDefault();
      const err = signIn(opts.app, $('#gatewho').value, $('#gatecode').value);
      if (err) { $('#gateerr').textContent = err; $('#gatecode').select(); return; }
      el.remove();
      opts.onIn();
    });
  }

  return Object.assign(C, {
    fresh: fresh, hydrate: hydrate, load: load, save: save, reset: reset, onSync: onSync, logIt: logIt,
    signIn: signIn, current: current, signOut: signOut, setCode: setCode, sha256: sha256, gate: gate,
    $: $, esc: esc, n: n, plural: plural, dept: dept, type: type, tint: tint, uid: uid, first: first, find: find,
    approverOf: approverOf, toast: toast, download: download, exportCSV: exportCSV, greeting: greeting,
    nextWorking: nextWorking, avatar: avatar, personCell: personCell, statusPill: statusPill, levelPill: levelPill,
    typeChip: typeChip, tile: tile, ICON: ICON, flags: flags, coverStrip: coverStrip, label: label,
    donut: donut, legendRows: legendRows, allowanceDonut: allowanceDonut, spreadChart: spreadChart, coverHeat: coverHeat,
    openModal: openModal, closeModal: closeModal, confirmDialog: confirmDialog, wireModal: wireModal, brand: brand
  });
})();

</script>
<script>/* manager.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Leave — Leave Manager (the manager and owner app)
   Only two people can sign in here: the COO, who decides on
   everyone's leave, and the owner, who decides on the manager's and can
   decide on anyone's. Everyone else is turned away at the sign-in.
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  const C = window.Core, E = window.Engine;
  const $ = C.$, esc = C.esc, n = C.n, plural = C.plural;
  const APP = 'manager';

  let me = null;
  const U = {
    tab: 'dash',
    cal: { mode: 'month', month: null, dept: '', type: '', status: 'all', q: '', span: 3 },
    teamSort: { k: 'used', dir: -1 }, teamQ: '', teamDept: '',
    fresh: {}                                    // request ids that arrived live, to flash
  };

  /* ══ Who decides what ═════════════════════════════════════════════════ *
     Nobody decides on their own leave. The owner can decide on anything
     else; the COO on everything except his own, which goes to the owner. */
  function canDecide(r) {
    if (!me || r.personId === me.id) return false;
    if (me.access === 'owner') return true;
    const who = C.S.personMap[r.personId];
    return !!who && who.access !== 'owner';
  }
  function queue() {
    return C.S.requests.filter(function (r) { return r.status === 'pending' && canDecide(r); })
      .sort(function (a, b) { return a.from < b.from ? -1 : 1; });
  }

  /* ══ Chrome ═══════════════════════════════════════════════════════════ */

  const TABS = [
    { id: 'dash', label: 'Dashboard' },
    { id: 'approve', label: 'Approvals' },
    { id: 'cal', label: 'Calendar' },
    { id: 'team', label: 'Team' },
    { id: 'people', label: 'People' },
    { id: 'settings', label: 'Settings' }
  ];

  function chrome() {
    const q = queue().length;
    $('#tabs').innerHTML = TABS.map(function (t) {
      const badge = t.id === 'approve' && q ? '<span class="badge">' + q + '</span>' : '';
      return '<button class="tab' + (U.tab === t.id ? ' on' : '') + '" data-tab="' + t.id + '">' + esc(t.label) + badge + '</button>';
    }).join('');
    $('#whoav').textContent = me.initials;
    $('#whoav').style.background = 'var(--gold)';
    $('#whoav').style.color = '#231B04';
    $('#whoname').textContent = me.name;
    $('#whorole').textContent = me.access === 'owner' ? 'Owner' : 'Chief Operating Officer';
    document.title = (q ? '(' + q + ') ' : '') + 'JOR Leave Manager';
  }

  function show(tab) {
    U.tab = tab;
    TABS.forEach(function (t) {
      const el = document.getElementById('v-' + t.id);
      if (el) el.classList.toggle('on', t.id === tab);
    });
    chrome(); render();
    const el = document.getElementById('v-' + tab);
    if (el) el.scrollTop = 0;
  }
  function render() {
    ({ dash: renderDash, approve: renderApprove, cal: renderCal, team: renderTeam, people: renderPeople, settings: renderSettings })[U.tab]();
  }

  /* ══ Dashboard ════════════════════════════════════════════════════════ */

  function renderDash() {
    const S = C.S, q = queue();
    const todayOff = E.offOn(S.today, S, {});
    const risk = E.riskDays(S.today, E.add(S.today, 84), S);
    const riskDates = {}; risk.forEach(function (r) { riskDates[r.date] = 1; });
    const liability = S.people.reduce(function (a, x) { return a + E.balance(x, S, {}).remaining; }, 0);
    const avgUsed = Math.round(S.people.reduce(function (a, x) { return a + E.balance(x, S, {}).pct; }, 0) / S.people.length);
    const clashes = q.filter(function (r) { return E.RANK[E.analyse(r, S).level] >= E.RANK.clash; }).length;
    const mineWaiting = S.requests.filter(function (r) { return r.personId === me.id && r.status === 'pending'; });

    let h = '<div class="wrap wide">';
    h += '<div class="pagehead"><div class="ph-row"><div><h2>' + esc(C.greeting()) + ', ' + esc(C.first(me)) + '</h2>' +
      '<p>' + esc(E.fmt(S.today, 'long')) + '. ' +
      (q.length ? q.length + ' request' + (q.length === 1 ? ' is' : 's are') + ' waiting on you' +
        (clashes ? ', ' + clashes + ' of them with a clash' : '') + '.' : 'Nothing is waiting on you.') +
      ' ' + todayOff.length + ' ' + (todayOff.length === 1 ? 'person is' : 'people are') + ' out today.' +
      (mineWaiting.length ? ' Your own request is with ' + esc((C.approverOf(me) || {}).name || 'the owner') + '.' : '') + '</p></div>' +
      (q.length ? '<div class="rowend"><button class="btn g" data-act="goapprove">Review ' + q.length + '</button></div>' : '') +
      '</div></div>';

    h += '<div class="tiles">' +
      C.tile('Waiting on you', q.length, q.length ? 'oldest asked ' + E.relative(q[0].submitted, S.today) : 'all decided', q.length ? 'accent' : '', 'goapprove') +
      C.tile('Of those, clashes', clashes, 'a team below its minimum, or the same job', clashes ? 'warn' : '', 'goapprove') +
      C.tile('Staffing risk, 12 weeks', Object.keys(riskDates).length, 'days a department is short', Object.keys(riskDates).length ? 'warn' : '', 'gocal') +
      C.tile('Out today', todayOff.length + ' <small>of ' + S.people.length + '</small>', E.fmt(S.today, 'day'), '', '') +
      C.tile('Leave owed', n(liability), 'days not yet taken · ' + avgUsed + '% used on average', '', 'goteam') + '</div>';

    h += leadership();

    if (q.length) {
      h += '<div class="card"><div class="card-h"><h3>Waiting on you</h3><div class="rowend">' +
        '<button class="btn p sm" data-act="goapprove">Open approvals</button></div></div><div class="card-b tight">' +
        '<table class="t"><thead><tr><th>Who</th><th>Dates</th><th class="num">Days</th><th>Type</th><th>Check</th><th></th></tr></thead><tbody>' +
        q.slice(0, 8).map(function (r) {
          const who = S.personMap[r.personId], a = E.analyse(r, S);
          return '<tr class="' + (U.fresh[r.id] ? 'flash' : '') + '" data-act="req" data-id="' + r.id + '" style="cursor:pointer">' +
            '<td>' + C.personCell(who, who.role + ' · ' + C.dept(who.dept).name) + '</td>' +
            '<td>' + esc(E.fmtRange(r.from, r.to)) + '<div class="mini">asked ' + esc(E.relative(r.submitted, S.today)) + '</div></td>' +
            '<td class="num">' + n(a.wd.total) + '</td><td>' + C.typeChip(C.type(r.type)) + '</td><td>' + C.levelPill(a.level) + '</td>' +
            '<td class="num"><button class="btn sm" data-act="req" data-id="' + r.id + '">Review</button></td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    h += '<div class="card"><div class="card-h"><h3>Staffing over the next twelve weeks</h3><span class="note">every department, weekdays only</span></div>' +
      '<div class="card-b">' + C.coverHeat(12) + '</div></div>';

    h += '<div class="grid g2" style="align-items:start">';
    h += '<div class="card"><div class="card-h"><h3>Out today</h3><span class="note">' + E.fmt(S.today, 'day') + '</span></div>' +
      '<div class="card-b' + (todayOff.length ? ' tight' : '') + '">' +
      (todayOff.length ? '<table class="t"><tbody>' + todayOff.map(function (o) {
        return '<tr data-act="req" data-id="' + o.req.id + '" style="cursor:pointer"><td>' + C.personCell(o.person) + '</td>' +
          '<td>' + C.typeChip(C.type(o.req.type)) + '</td>' +
          '<td class="num mini">back ' + esc(E.fmt(C.nextWorking(E.add(o.req.to, 1)), 'short')) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<div class="empty"><b>A full house</b>Nobody is off today.</div>') + '</div></div>';

    h += '<div class="card"><div class="card-h"><h3>Allowance used by department</h3></div><div class="card-b"><div class="bars">' +
      S.departments.map(function (d) {
        const list = S.people.filter(function (x) { return x.dept === d.id; });
        const tot = list.reduce(function (a, x) { const b = E.balance(x, S, {}); return { c: a.c + b.committed, a: a.a + b.allowance }; }, { c: 0, a: 0 });
        const pct = tot.a ? Math.round(tot.c / tot.a * 100) : 0;
        return '<div class="bar"><div class="bl">' + esc(d.name) + '</div><div class="bt"><i style="width:' + pct + '%;background:' + d.tint +
          '"></i></div><div class="bv">' + pct + '%</div></div>';
      }).join('') + '</div></div></div>';
    h += '</div>';

    h += '<div class="card"><div class="card-h"><h3>When leave lands</h3><span class="note">working days, ' +
      E.D(S.policy.leaveYearStart).getUTCFullYear() + '</span></div><div class="card-b">' + C.spreadChart(E.monthlySpread(S, null)) +
      '<div class="row mini" style="gap:14px;margin-top:6px">' +
      '<span><i class="dot" style="display:inline-block;background:#00A66E;margin-right:5px"></i>Annual</span>' +
      '<span><i class="dot" style="display:inline-block;background:#B08D2E;margin-right:5px"></i>Time in lieu and other</span>' +
      '<span><i class="dot" style="display:inline-block;background:#B3261E;margin-right:5px"></i>Sick</span></div></div></div>';

    h += '</div>';
    $('#v-dash').innerHTML = h;
  }

  /* The two people who run the Leave Manager, side by side: the owner first,
     then the COO, with what is waiting on each and their own leave. */
  function leadership() {
    const S = C.S;
    const heads = S.people.filter(function (p) { return p.access === 'owner' || p.access === 'manager'; })
      .sort(function (a, b) { return a.access === 'owner' ? -1 : b.access === 'owner' ? 1 : 0; });
    if (!heads.length) return '';
    return '<div class="grid g2" style="margin-bottom:16px">' + heads.map(function (p) {
      const owner = p.access === 'owner';
      const waiting = S.requests.filter(function (r) {
        if (r.status !== 'pending' || r.personId === p.id) return false;
        const who = S.personMap[r.personId];
        if (!who) return false;
        /* the manager decides on staff; the owner is the one who decides on the manager */
        return owner ? who.access === 'manager' : who.access === 'staff';
      }).length;
      const bal = E.balance(p, S, {});
      const offToday = E.offOn(S.today, S, {}).filter(function (o) { return o.person.id === p.id; })[0];
      const next = S.requests.filter(function (r) {
        return r.personId === p.id && (r.status === 'approved' || r.status === 'pending') && r.to >= S.today;
      }).sort(function (a, b) { return a.from < b.from ? -1 : 1; })[0];
      const isMe = p.id === me.id;
      return '<div class="card" style="margin:0;border-top:3px solid ' + (owner ? 'var(--gold)' : 'var(--jor)') + '">' +
        '<div class="card-b"><div class="row" style="gap:13px;align-items:center">' +
        '<span class="av lg" style="background:' + (owner ? 'var(--gold)' : 'var(--jor)') + ';color:' + (owner ? '#231B04' : '#fff') + '">' + esc(p.initials) + '</span>' +
        '<div style="min-width:0"><div style="font-family:var(--serif);font-size:18px;font-weight:700">' + esc(p.name) +
        (isMe ? ' <span class="pill grey" style="vertical-align:3px">you</span>' : '') + '</div>' +
        '<div class="mini">' + (owner ? 'Owner & Managing Director' : 'Chief Operating Officer (COO)') + '</div></div>' +
        '<div class="rowend">' + (offToday ? '<span class="pill amber">Away today</span>' : '<span class="pill">In today</span>') + '</div></div>' +
        '<hr class="sep"><dl class="kv" style="margin:0">' +
        '<dt>Decides on</dt><dd>' + (owner ? 'the COO’s leave, and anyone’s' : 'everyone’s leave on the team') + '</dd>' +
        '<dt>Waiting on ' + 'him' + '</dt><dd>' + (waiting ? '<b>' + plural(waiting, 'request') + '</b>' : 'nothing') + '</dd>' +
        '<dt>Own leave</dt><dd>' + plural(bal.remaining, 'day') + ' left of ' + n(bal.allowance) + '</dd>' +
        '<dt>Next off</dt><dd>' + (next ? esc(E.fmtRange(next.from, next.to)) + (next.status === 'pending' ? ' <span class="pill amber">waiting</span>' : '') : 'nothing booked') + '</dd>' +
        '</dl></div></div>';
    }).join('') + '</div>';
  }

  /* ══ Approvals ════════════════════════════════════════════════════════ */

  function renderApprove() {
    const S = C.S, q = queue();
    const clear = q.filter(function (r) { return E.RANK[E.analyse(r, S).level] <= E.RANK.note; });
    let h = '<div class="wrap"><div class="sechead"><h2>Approvals</h2><div class="rowend">' +
      (clear.length > 1 ? '<button class="btn p sm" data-act="approveclear">Approve the ' + clear.length + ' with nothing against them</button>' : '') +
      '</div></div><p class="hint">Every request has been checked against staffing, the people doing the same job, closed periods and ' +
      'the notice the policy asks for. Clashes open automatically.</p>';

    if (!q.length) {
      h += '<div class="card"><div class="empty"><b>Nothing waiting</b>Every request has had a decision. New ones appear here the moment they are sent.</div></div>';
    } else {
      const counts = { clear: 0, note: 0, caution: 0, clash: 0, blocked: 0 };
      q.forEach(function (r) { counts[E.analyse(r, S).level]++; });
      h += '<div class="tiles">' +
        C.tile('Waiting', q.length, 'oldest asked ' + E.relative(q[0].submitted, S.today), 'accent') +
        C.tile('Straightforward', counts.clear + counts.note, 'nothing against them') +
        C.tile('Worth a look', counts.caution, 'notice, busy season, a colleague away') +
        C.tile('Clashes', counts.clash + counts.blocked, 'staffing or the same job', counts.clash + counts.blocked ? 'warn' : '') + '</div>';
      h += q.map(card).join('');
    }

    const decided = S.requests.filter(function (r) {
      return (r.status === 'approved' || r.status === 'declined') && r.decidedAt && r.decidedBy && r.decidedBy !== r.personId &&
        (r.decidedBy === 'p01' || r.decidedBy === 'p02');
    }).sort(function (a, b) { return a.decidedAt < b.decidedAt ? 1 : a.decidedAt > b.decidedAt ? -1 : 0; }).slice(0, 14);
    if (decided.length) {
      h += '<div class="card"><div class="card-h"><h3>Recent decisions</h3></div><div class="card-b tight"><table class="t">' +
        '<thead><tr><th>Who</th><th>Dates</th><th>Type</th><th>Outcome</th><th>Decided by</th><th>Reason</th></tr></thead><tbody>' +
        decided.map(function (r) {
          const who = S.personMap[r.personId];
          if (!who) return '';
          return '<tr data-act="req" data-id="' + r.id + '" style="cursor:pointer"><td>' + C.personCell(who) + '</td>' +
            '<td>' + esc(E.fmtRange(r.from, r.to)) + '</td><td>' + C.typeChip(C.type(r.type)) + '</td><td>' + C.statusPill(r.status) + '</td>' +
            '<td class="mini">' + esc(C.first(S.personMap[r.decidedBy])) + ' · ' + esc(E.fmt(r.decidedAt, 'short')) + '</td>' +
            '<td class="mini">' + (r.decisionNote ? esc(r.decisionNote) : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    h += '</div>';
    $('#v-approve').innerHTML = h;
  }

  function card(r) {
    const S = C.S, who = S.personMap[r.personId], a = E.analyse(r, S);
    const bal = E.balance(who, S, { skip: r.id }), t = C.type(r.type);
    const open = E.RANK[a.level] >= E.RANK.clash || U.fresh[r.id];
    let h = '<div class="reqcard lv-' + a.level + (open ? ' open' : '') + (U.fresh[r.id] ? ' flash' : '') + '" data-card="' + r.id + '">' +
      '<div class="reqcard-h" data-act="togglecard" data-id="' + r.id + '">' + C.avatar(who) +
      '<div style="min-width:0"><div class="when">' + esc(who.name) + ' — ' + esc(E.fmtRange(r.from, r.to)) + '</div>' +
      '<div class="wd">' + esc(who.role) + ' · ' + esc(C.dept(who.dept).name) + ' · ' + plural(a.wd.total, 'working day') +
      ' · asked ' + esc(E.relative(r.submitted, S.today)) + '</div></div>' +
      '<div class="rowend row" style="gap:7px">' + (U.fresh[r.id] ? '<span class="pill gold">New</span>' : '') +
      C.typeChip(t) + C.levelPill(a.level) + '</div></div><div class="reqcard-b">';
    if (r.note) h += '<div class="notebox"><i>' + esc(C.first(who)) + ' wrote</i>' + esc(r.note) + '</div>';
    h += '<div class="grid g2" style="align-items:start;gap:14px"><div>' +
      C.flags(a.items, 'Nothing against it', 'Enough of the team is in every day and nobody doing the same job is away.') + '</div><div>' +
      '<dl class="kv" style="margin:0 0 12px"><dt>Allowance</dt><dd>' + n(bal.allowance) + ' days (' + n(bal.entitlement) + ' + ' + n(bal.carry) + ' carried)</dd>' +
      '<dt>Used so far</dt><dd>' + n(bal.taken) + ' taken, ' + n(bal.booked) + ' booked ahead</dd>' +
      '<dt>If approved</dt><dd><b>' + plural(bal.remaining - (t.deducts === 'annual' ? a.wd.total : 0), 'day') + ' left</b></dd>' +
      '<dt>Notice given</dt><dd>' + plural(E.diff(r.submitted, r.from), 'day') + '</dd></dl>' +
      C.coverStrip(a.coverDays, C.dept(who.dept).name + ' at work if approved') +
      (a.coverDays.length ? '<div class="mini" style="margin-top:5px">The team needs ' + C.dept(who.dept).minCover + ' in each day.</div>' : '') +
      '</div></div>';
    if (E.RANK[a.level] >= E.RANK.caution) {
      const sug = E.suggest(r, S, 3);
      if (sug.length) {
        h += '<hr class="sep">' + C.label('Dates that would work instead') + '<div class="row" style="gap:7px">' +
          sug.map(function (s) { return '<span class="pill ' + (s.level === 'clear' ? '' : 'gold') + '">' + esc(E.fmtRange(s.from, s.to)) + '</span>'; }).join('') +
          '<span class="mini">— offer one when you decline.</span></div>';
      }
    }
    h += '<hr class="sep"><div class="row"><button class="btn p" data-act="approve" data-id="' + r.id + '">Approve</button>' +
      '<button class="btn dngr" data-act="decline" data-id="' + r.id + '">Decline…</button>' +
      '<span class="mini rowend">' + esc(C.first(who)) + ' sees your decision straight away.</span></div></div></div>';
    return h;
  }

  function decide(r, status, note) {
    C.load(); me = C.S.personMap[me.id];
    const x = C.find(r.id);
    if (!x || x.status !== 'pending') { C.toast('That request has changed since — refreshed.', 'bad'); render(); chrome(); return; }
    x.status = status; x.decidedBy = me.id; x.decidedAt = C.S.today; x.decisionNote = note || ''; x.seen = false;
    const a = E.analyse(x, C.S);
    C.logIt(status, x, me.name, note ? note.slice(0, 80) : (status === 'approved' && a.level !== 'clear' ? 'approved over a ' + a.level : ''));
    C.save();
    delete U.fresh[x.id];
    C.closeModal(); render(); chrome();
    const who = C.S.personMap[x.personId];
    C.toast((status === 'approved' ? 'Approved' : 'Declined') + ' — ' + C.first(who) + ' can see it now.', status === 'approved' ? 'good' : '');
  }

  function approve(id) {
    const r = C.find(id);
    if (!r || !canDecide(r)) return;
    const a = E.analyse(r, C.S);
    if (E.RANK[a.level] >= E.RANK.clash) {
      C.confirmDialog('Approve despite the clash?',
        C.flags(a.items.filter(function (i) { return E.RANK[i.level] >= E.RANK.clash; })) +
        '<p class="mini" style="margin:11px 0 0">The audit trail records that you saw this and went ahead.</p>',
        'Approve anyway', function () { decide(r, 'approved'); });
    } else decide(r, 'approved');
  }

  function declineModal(id) {
    const r = C.find(id);
    if (!r) return;
    const who = C.S.personMap[r.personId], a = E.analyse(r, C.S), sug = E.suggest(r, C.S, 3);
    const reasons = a.items.filter(function (i) { return E.RANK[i.level] >= E.RANK.caution; }).map(function (i) { return i.title + '. ' + i.detail; });
    let b = '<p style="margin:0 0 12px">Declining ' + esc(who.name) + '’s request for <b>' + esc(E.fmtRange(r.from, r.to)) +
      '</b>. They see exactly what you write, so say what would work instead.</p>';
    if (reasons.length) b += C.label('Use a reason the check found') + '<div class="suggest" style="margin-bottom:12px">' +
      reasons.map(function (t) { return '<button class="sugg" data-act="usereason" data-t="' + esc(t) + '"><b>' + esc(t.split('.')[0]) + '</b><span class="sd">use this</span></button>'; }).join('') + '</div>';
    if (sug.length) b += C.label('Offer dates that work') + '<div class="row" style="gap:6px;margin-bottom:12px">' +
      sug.map(function (s) { return '<button class="btn sm" data-act="usedates" data-t="' + esc(E.fmtRange(s.from, s.to)) + '">' + esc(E.fmtRange(s.from, s.to)) + '</button>'; }).join('') + '</div>';
    b += '<label class="f"><span>Your reason</span><textarea class="in" id="declinenote" rows="4" placeholder="We are two short in Operations that week — would the following week work?"></textarea></label>';
    C.openModal('Decline a request', b, '<button class="btn" data-act="closemodal">Back</button>' +
      '<button class="btn dngr" data-act="declineconfirm" data-id="' + r.id + '">Decline and send</button>');
  }

  function requestModal(id) {
    const S = C.S, r = C.find(id);
    if (!r) return;
    const who = S.personMap[r.personId], a = E.analyse(r, S);
    let b = '<div class="row" style="gap:11px;margin-bottom:13px">' + C.avatar(who, 'lg') +
      '<div><div style="font-family:var(--serif);font-size:17px;font-weight:660">' + esc(who.name) + '</div>' +
      '<div class="mini">' + esc(who.role) + ' · ' + esc(C.dept(who.dept).name) + '</div></div>' +
      '<div class="rowend row" style="gap:6px">' + C.typeChip(C.type(r.type)) + C.statusPill(r.status) + '</div></div>' +
      '<dl class="kv" style="margin-bottom:13px"><dt>Dates</dt><dd>' + esc(E.fmtRange(r.from, r.to)) + '</dd>' +
      '<dt>Counted</dt><dd>' + plural(a.wd.total, 'working day') + '</dd>' +
      '<dt>Asked for</dt><dd>' + esc(E.fmt(r.submitted)) + ' — ' + esc(E.relative(r.submitted, S.today)) + '</dd>' +
      (r.decidedAt ? '<dt>Decided</dt><dd>' + esc(E.fmt(r.decidedAt)) + ' by ' + esc((S.personMap[r.decidedBy] || {}).name || '—') + '</dd>' : '') + '</dl>';
    if (r.note) b += '<div class="notebox"><i>Their note</i>' + esc(r.note) + '</div>';
    if (r.decisionNote) b += '<div class="notebox" style="background:var(--clash-bg);border-color:#F2D3BE"><i>Reason given</i>' + esc(r.decisionNote) + '</div>';
    b += '<div class="verdict v-' + a.level + '" style="margin-bottom:11px"><div class="vi">' + C.ICON[a.level] + '</div><div><b>' + E.LEVEL_LABEL[a.level] +
      '</b><p>' + (a.items.length ? a.items.length + ' thing' + (a.items.length === 1 ? '' : 's') + ' the check raised' : 'Nothing against it.') + '</p></div></div>';
    if (a.items.length) b += C.flags(a.items);
    let f = '<button class="btn" data-act="closemodal">Close</button>';
    if (r.status === 'pending' && canDecide(r)) f += '<button class="btn dngr" data-act="decline" data-id="' + r.id + '">Decline…</button>' +
      '<button class="btn p" data-act="approve" data-id="' + r.id + '">Approve</button>';
    else if (r.status === 'pending' && r.personId === me.id) f = '<span class="mini" style="margin-right:auto">Your own request — it is with ' +
      esc((C.approverOf(me) || {}).name || 'the owner') + '.</span>' + f;
    C.openModal(esc(E.fmtRange(r.from, r.to)), b, f);
  }

  /* ══ Calendar ═════════════════════════════════════════════════════════ */

  function visible() {
    const S = C.S;
    return S.requests.filter(function (r) {
      if (r.status === 'cancelled' || r.status === 'declined') return false;
      if (U.cal.status !== 'all' && r.status !== U.cal.status) return false;
      const p = S.personMap[r.personId];
      if (!p) return false;
      if (U.cal.dept && p.dept !== U.cal.dept) return false;
      if (U.cal.type && r.type !== U.cal.type) return false;
      if (U.cal.q && p.name.toLowerCase().indexOf(U.cal.q.toLowerCase()) < 0) return false;
      return true;
    });
  }

  function renderCal() {
    const S = C.S, mode = U.cal.mode;
    if (!U.cal.month) U.cal.month = S.today.slice(0, 7);
    const sel = function (k, opts) {
      return '<select class="in" style="width:auto" data-c="' + k + '">' + opts.map(function (o) {
        return '<option value="' + o[0] + '"' + (String(U.cal[k]) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select>';
    };
    let h = '<div class="wrap wide"><div class="sechead"><h2>Company calendar</h2><div class="rowend"><div class="seg">' +
      [['month', 'Month'], ['planner', 'Wall planner'], ['timeline', 'Timeline']].map(function (o) {
        return '<button data-act="calmode" data-v="' + o[0] + '"' + (mode === o[0] ? ' class="on"' : '') + '>' + o[1] + '</button>';
      }).join('') + '</div></div></div><p class="hint">' +
      (mode === 'month' ? 'One month at a time. A department below its minimum that day is marked down the left edge of the day.'
        : mode === 'planner' ? 'The whole company on one sheet — a row per person, a column per day, and a staffing ribbon over each department.'
          : 'Everything booked over the coming ten weeks, grouped by department.') + '</p>';
    h += '<div class="card"><div class="card-b" style="padding:11px 15px"><div class="row" style="gap:10px">' +
      sel('dept', [['', 'Every department']].concat(S.departments.map(function (d) { return [d.id, d.name]; }))) +
      sel('type', [['', 'Every type']].concat(S.leaveTypes.map(function (t) { return [t.id, t.name]; }))) +
      sel('status', [['all', 'Approved and waiting'], ['approved', 'Approved only'], ['pending', 'Waiting only']]) +
      '<input class="in" style="width:180px" placeholder="Find a name…" data-c="q" value="' + esc(U.cal.q) + '">' +
      (mode === 'planner' ? sel('span', [[3, 'Three months'], [6, 'Six months'], [12, 'The whole year']]) : '') +
      (mode !== 'timeline' ? '<div class="rowend row" style="gap:6px"><button class="btn sm" data-act="calprev">‹</button>' +
        '<button class="btn sm" data-act="caltoday">Today</button><button class="btn sm" data-act="calnext">›</button>' +
        '<b style="font-family:var(--serif);font-size:16px;margin-left:8px;min-width:140px;text-align:right">' +
        esc(E.MONTHS[+U.cal.month.slice(5, 7) - 1] + ' ' + U.cal.month.slice(0, 4)) + '</b></div>' : '') +
      '</div></div></div><div id="calbody"></div>';
    h += '<div class="card"><div class="card-b" style="padding:11px 15px"><div class="row mini" style="gap:16px">' +
      S.leaveTypes.map(function (t) { return '<span><i class="dot" style="display:inline-block;background:' + t.tint + ';margin-right:5px"></i>' + esc(t.name) + '</span>'; }).join('') +
      '<span><i style="display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;' +
      'background:repeating-linear-gradient(135deg,#B08D2E,#B08D2E 3px,#fff 3px,#fff 6px)"></i>hatched = waiting on a decision</span></div></div></div></div>';
    $('#v-cal').innerHTML = h;
    calBody();
  }

  function calBody() {
    const el = $('#calbody');
    if (!el) return;
    el.innerHTML = U.cal.mode === 'month' ? monthView() : U.cal.mode === 'planner' ? plannerView() : timelineView();
  }

  function monthView() {
    const S = C.S, y = +U.cal.month.slice(0, 4), m = +U.cal.month.slice(5, 7) - 1;
    const first = E.startOfMonth(y, m), last = E.endOfMonth(y, m);
    const reqs = visible();
    let h = '<div class="card"><div class="card-b"><div class="calhead">' +
      ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d) { return '<div>' + d + '</div>'; }).join('') + '</div><div class="calgrid">';
    E.range(E.startOfWeek(first), E.add(E.startOfWeek(last), 6)).forEach(function (d) {
      const out = d < first || d > last, we = E.isWeekend(d), hol = S.hmap[d];
      const on = reqs.filter(function (r) { return E.covers(r, d, S.hmap); });
      const short = [];
      if (!we && !hol && !out) S.departments.forEach(function (dep) {
        if (U.cal.dept && dep.id !== U.cal.dept) return;
        const c = E.cover(d, dep.id, S, {});
        if (c.short > 0) short.push(dep.short + ' −' + c.short);
      });
      h += '<div class="' + ['cell', out ? 'out' : '', we ? 'we' : '', hol ? 'hol' : '', d === S.today ? 'today' : '', short.length ? 'short' : ''].filter(Boolean).join(' ') + '">' +
        '<div class="cn">' + E.D(d).getUTCDate() + (hol ? '<span class="hn">' + esc(hol) + '</span>' : '') +
        (short.length ? '<span class="cx" title="Below the minimum: ' + esc(short.join(', ')) + '">' + esc(short.join(' ')) + '</span>' : '') + '</div>';
      on.slice(0, 4).forEach(function (r) {
        const p = S.personMap[r.personId];
        h += '<div class="chip' + (r.status === 'pending' ? ' pending' : '') + '" data-act="req" data-id="' + r.id + '" style="border-left-color:' +
          C.type(r.type).tint + '" title="' + esc(p.name + ' — ' + C.type(r.type).name + ' ' + E.fmtRange(r.from, r.to)) + '"><b>' +
          esc(C.first(p)) + '</b> ' + esc(C.dept(p.dept).short) + '</div>';
      });
      if (on.length > 4) h += '<div class="more" data-act="dayall" data-d="' + d + '">+' + (on.length - 4) + ' more</div>';
