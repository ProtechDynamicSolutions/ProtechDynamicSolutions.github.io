  function plannerView() {
    const S = C.S, span = +U.cal.span || 3;
    let from, to;
    if (span === 12) { from = S.policy.leaveYearStart; to = S.policy.leaveYearEnd; }
    else {
      const y = +U.cal.month.slice(0, 4), m = +U.cal.month.slice(5, 7) - 1;
      from = E.startOfMonth(y, m);
      to = E.endOfMonth(y + Math.floor((m + span - 1) / 12), (m + span - 1) % 12);
    }
    const days = E.range(from, to), reqs = visible(), byP = {};
    reqs.forEach(function (r) { (byP[r.personId] = byP[r.personId] || []).push(r); });
    let mrow = '<tr><th class="pname"></th>';
    for (let i = 0; i < days.length;) {
      let j = i;
      while (j < days.length && days[j].slice(0, 7) === days[i].slice(0, 7)) j++;
      mrow += '<th class="mname" colspan="' + (j - i) + '">' + E.MONTHS[+days[i].slice(5, 7) - 1] + ' ' + days[i].slice(0, 4) + '</th>';
      i = j;
    }
    mrow += '</tr>';
    const drow = '<tr><th class="pname"></th>' + days.map(function (d) {
      return '<th class="dh' + (E.isWeekend(d) ? ' we' : '') + (d.slice(8) === '01' ? ' mstart' : '') + '">' + (E.D(d).getUTCDate() % 2 ? E.D(d).getUTCDate() : '') + '</th>';
    }).join('') + '</tr>';
    const base = function (d) {
      return 'd' + (E.isWeekend(d) ? ' we' : '') + (S.hmap[d] ? ' hol' : '') + (d.slice(8) === '01' ? ' mstart' : '') + (d === S.today ? ' today' : '');
    };
    let body = '';
    S.departments.forEach(function (dep) {
      if (U.cal.dept && dep.id !== U.cal.dept) return;
      const list = S.people.filter(function (p) {
        return p.dept === dep.id && (!U.cal.q || p.name.toLowerCase().indexOf(U.cal.q.toLowerCase()) >= 0);
      });
      if (!list.length) return;
      body += '<tr class="dhead"><td class="pname"><div class="pnamecell"><b>' + esc(dep.name) + '</b><span class="pr">min ' + dep.minCover +
        '</span></div></td><td colspan="' + days.length + '"></td></tr>';
      body += '<tr class="coverrow"><td class="pname"><div class="pnamecell"><span class="mini">at work</span></div></td>' + days.map(function (d) {
        if (E.isWeekend(d) || S.hmap[d]) return '<td class="' + base(d) + '"></td>';
        const c = E.cover(d, dep.id, S, {});
        const col = c.available <= 0 ? '#E89C93' : c.short > 0 ? '#EFB183' : c.offCount ? '#A9DCC6' : '#E8F3EE';
        return '<td class="' + base(d) + '"><i class="cv" style="background:' + col + '" title="' +
          esc(E.fmt(d, 'day') + ': ' + c.available + ' of ' + c.head + ' at work' + (c.short ? ', ' + c.short + ' below the minimum' : '')) + '"></i></td>';
      }).join('') + '</tr>';
      list.forEach(function (p) {
        const mine = byP[p.id] || [];
        body += '<tr><td class="pname"><div class="pnamecell">' + C.avatar(p, 'sm') + '<b>' + esc(p.name) + '</b><span class="pr">' +
          n(E.balance(p, S, {}).remaining) + 'd</span></div></td>' + days.map(function (d) {
            const r = mine.filter(function (x) { return d >= x.from && d <= x.to; })[0];
            if (!r) return '<td class="' + base(d) + '"></td>';
            const t = C.type(r.type);
            return '<td class="' + base(d) + '"><i class="' + (d === r.from ? 's ' : '') + (d === r.to ? 'e ' : '') + (r.status === 'pending' ? 'pend' : '') +
              '" style="background:' + t.tint + (E.isWeekend(d) || S.hmap[d] ? ';opacity:.32' : '') + '" data-act="req" data-id="' + r.id +
              '" title="' + esc(p.name + ' — ' + t.name + ' ' + E.fmtRange(r.from, r.to) + ' (' + r.status + ')') + '"></i></td>';
          }).join('') + '</tr>';
      });
    });
    return '<div class="planner"><table class="ptable"><thead>' + mrow + drow + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  function timelineView() {
    const S = C.S, weeks = 10, from = E.startOfWeek(S.today), total = weeks * 7, to = E.add(from, total - 1);
    const byP = {};
    visible().filter(function (r) { return r.to >= from && r.from <= to; })
      .forEach(function (r) { (byP[r.personId] = byP[r.personId] || []).push(r); });
    let h = '<div class="tlhead"><div class="mini" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 0">Next ' + weeks + ' weeks</div>' +
      '<div class="tlweeks" style="grid-template-columns:repeat(' + weeks + ',1fr)">' +
      Array.apply(null, { length: weeks }).map(function (_, i) { return '<div>' + E.fmt(E.add(from, i * 7), 'short') + '</div>'; }).join('') + '</div></div>';
    const grid = '<div class="grid" style="grid-template-columns:repeat(' + total + ',1fr)">' +
      E.range(from, to).map(function (d) { return '<i class="' + (E.isWeekend(d) || S.hmap[d] ? 'we' : '') + '"></i>'; }).join('') + '</div>';
    const nowPct = (E.diff(from, S.today) / total * 100).toFixed(2);
    let any = false;
    S.departments.forEach(function (dep) {
      if (U.cal.dept && dep.id !== U.cal.dept) return;
      const list = S.people.filter(function (p) {
        return p.dept === dep.id && (byP[p.id] || []).length && (!U.cal.q || p.name.toLowerCase().indexOf(U.cal.q.toLowerCase()) >= 0);
      });
      if (!list.length) return;
      any = true;
      h += '<div class="tldept"><i class="dot" style="display:inline-block;background:' + dep.tint + ';margin-right:6px"></i>' + esc(dep.name) + '</div>';
      list.forEach(function (p) {
        const bars = byP[p.id].map(function (r) {
          const s = Math.max(0, E.diff(from, r.from)), e = Math.min(total - 1, E.diff(from, r.to));
          const t = C.type(r.type);
          return '<div class="tlbar' + (r.status === 'pending' ? ' pend' : '') + '" data-act="req" data-id="' + r.id + '" style="left:' +
            (s / total * 100).toFixed(2) + '%;width:' + ((e - s + 1) / total * 100).toFixed(2) + '%;background:' + t.tint + '" title="' +
            esc(t.name + ' ' + E.fmtRange(r.from, r.to) + ' (' + r.status + ')') + '">' + esc(t.short) + '</div>';
        }).join('');
        h += '<div class="tlrow"><div style="padding-right:10px">' + C.personCell(p) + '</div><div class="tllane">' + grid + bars +
          '<div class="tlnow" style="left:' + nowPct + '%"></div></div></div>';
      });
    });
    if (!any) h += '<div class="empty"><b>Nothing booked</b>No leave in the next ' + weeks + ' weeks with these filters.</div>';
    return '<div class="card"><div class="card-b"><div class="tl">' + h + '</div></div></div>';
  }

  function renderTeam() {

    });
    const k = U.teamSort.k, dir = U.teamSort.dir;

    h += '<div class="card"><div class="card-h"><h3>Balances</h3><div class="rowend">' +
      '<select class="in" style="width:auto" data-t="dept"><option value="">Every department</option>' + S.departments.map(function (d) {
        return '<option value="' + d.id + '"' + (U.teamDept === d.id ? ' selected' : '') + '>' + esc(d.name) + '</option>';
      }).join('') + '</select><input class="in" style="width:200px" placeholder="Find a name or a job…" data-t="q" id="teamq" value="' + esc(U.teamQ) + '">' +
      '</div></div><div class="card-b tight"><div class="tscroll"><table class="t"><thead><tr>' +
      th('name', 'Person') + th('dept', 'Department') + '<th class="num">Allowance</th>' + th('used', 'Used', 1) + th('left', 'Left', 1) +
      th('pending', 'Waiting', 1) + th('sick', 'Sick', 1) + th('next', 'Next off') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        const b = r.b, late = b.remaining > 12 && b.pct < 50, d = C.dept(r.p.dept);
        return '<tr data-act="person" data-id="' + r.p.id + '" style="cursor:pointer"><td>' + C.personCell(r.p) + '</td>' +
          '<td><span class="pill" style="background:' + d.tint + '14;border-color:' + d.tint + '33;color:' + d.tint + '">' + esc(d.name) + '</span></td>' +
          '<td class="num">' + n(b.allowance) + '</td><td class="num"><div class="row" style="gap:8px;justify-content:flex-end">' +
          '<div style="width:60px;height:7px;border-radius:99px;background:var(--line-2);overflow:hidden"><i style="display:block;height:100%;width:' +
          b.pct + '%;background:' + (late ? 'var(--gold)' : 'var(--jor)') + '"></i></div><b>' + b.pct + '%</b></div></td>' +
          '<td class="num"' + (late ? ' style="color:var(--clash);font-weight:700"' : '') + '>' + n(b.remaining) + '</td>' +
          '<td class="num">' + (b.pending ? '<span class="pill amber">' + n(b.pending) + '</span>' : '—') + '</td>' +
          '<td class="num">' + (b.sick ? n(b.sick) : '—') + '</td>' +
          '<td class="mini">' + (r.next ? esc(E.fmtRange(r.next.from, r.next.to)) + (r.next.status === 'pending' ? ' <span class="pill amber">waiting</span>' : '') : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div></div></div>';

    /* who covers whom */
    const byRole = {};
    S.people.forEach(function (p) { (byRole[p.dept + '|' + p.roleKey] = byRole[p.dept + '|' + p.roleKey] || []).push(p); });
    h += '<div class="card"><div class="card-h"><h3>Who covers whom</h3><span class="note">people doing the same job — two away together is the clash that bites</span></div>' +
      '<div class="card-b"><div class="grid g3">' + Object.keys(byRole).filter(function (key) {

          (sole ? 'Only one person does this — their leave needs a named stand-in.' : g.length + ' people cover each other.') + '</div></div>';
      }).join('') + '</div></div></div></div>';
    $('#v-team').innerHTML = h;

  function personForm(p) {
    const S = C.S, isNew = !p;
    p = p || { name: '', email: '', dept: S.departments[0].id, role: '', roleKey: '', entitlement: 21, carry: 0, toil: 0, sole: false };

      '<div class="grid g2"><label class="f"><span>Department</span><select class="in" id="pf-dept">' + S.departments.map(function (d) {

      '<datalist id="pf-roles">' + Object.keys(roles).map(function (k) { return '<option value="' + esc(roles[k]) + '">'; }).join('') + '</datalist></label></div>' +

      '<div class="grid g3"><label class="f"><span>Days a year</span><input class="in" type="number" step="0.5" min="0" id="pf-ent" value="' + p.entitlement + '"></label>' +
      '<label class="f"><span>Carried over</span><input class="in" type="number" step="0.5" min="0" id="pf-carry" value="' + p.carry + '"></label>' +
      '<label class="f"><span>Time in lieu</span><input class="in" type="number" step="0.5" min="0" id="pf-toil" value="' + p.toil + '"></label></div>' +
      (isNew ? '<label class="f"><span>Their PIN, to sign in to Book Time Off</span><input class="in" id="pf-pin" inputmode="numeric" placeholder="4 to 8 digits"></label>' : ''),
      (isNew ? '' : (p.access === 'staff' ? '<button class="btn dngr" data-act="removeperson" data-id="' + p.id + '" style="margin-right:auto">Remove</button>' : '')) +
      '<button class="btn" data-act="closemodal">Back</button><button class="btn p" id="pf-save">' + (isNew ? 'Add them' : 'Save') + '</button>');
    $('#pf-save').onclick = function () {
      const name = $('#pf-name').value.trim(), role = $('#pf-role').value.trim(), deptId = $('#pf-dept').value;
      if (!name || !role) { C.toast('A name and a job title are needed.', 'bad'); return; }
      if (isNew && !/^\d{4,8}$/.test($('#pf-pin').value.trim())) { C.toast('The PIN must be 4 to 8 digits.', 'bad'); return; }
      C.load(); me = C.S.personMap[me.id];
      const same = C.S.people.filter(function (x) { return x.dept === deptId && x.role.toLowerCase() === role.toLowerCase() && x.id !== p.id; })[0];
      const target = isNew ? { id: C.uid('p'), access: 'staff', manager: 'p02', since: C.S.today } : C.S.personMap[p.id];
      Object.assign(target, {
        name: name, email: $('#pf-email').value.trim(), dept: deptId, role: role,
        roleKey: same ? same.roleKey : (target.roleKey && target.dept === deptId && target.role === role ? target.roleKey : C.uid('role')),
        entitlement: +$('#pf-ent').value || 0, carry: +$('#pf-carry').value || 0, toil: +$('#pf-toil').value || 0
      });
      target.initials = name.split(' ').filter(function (w) { return w.length > 1; }).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
      if (isNew) { C.S.people.push(target); C.hydrate(C.S); C.setCode(target.id, $('#pf-pin').value.trim()); }
      /* sole: nobody else in the department does this job */
      C.S.people.forEach(function (x) {
        x.sole = !C.S.people.some(function (y) { return y.id !== x.id && y.dept === x.dept && y.roleKey === x.roleKey; });
      });
      C.S.log.push({ at: C.S.today, what: isNew ? 'person added' : 'person edited', by: me.name, detail: name + ' · ' + role });
      C.hydrate(C.S); C.save(); C.closeModal(); render(); chrome();
      C.toast(isNew ? name + ' can sign in to Book Time Off now.' : 'Saved.', 'good');
    };
  }

  function setPin(id) {
    const p = C.S.personMap[id];
    if (!p) return;
    const staff = p.access === 'staff';
    C.openModal((staff ? 'New PIN for ' : 'New password for ') + esc(p.name),
      '<p style="margin:0 0 12px">' + (staff ? 'They use this to sign in to Book Time Off. Tell them in person — it is not sent anywhere.' :
        'This is the password for the Leave Manager.') + '</p>' +
      '<label class="f"><span>' + (staff ? 'PIN' : 'Password') + '</span><input class="in" id="np" type="password" ' + (staff ? 'inputmode="numeric"' : '') + '></label>',
      '<button class="btn" data-act="closemodal">Back</button><button class="btn p" id="np-save">Set it</button>');
    $('#np-save').onclick = function () {
      const v = $('#np').value.trim();
      if (staff ? !/^\d{4,8}$/.test(v) : v.length < 6) { C.toast(staff ? 'The PIN must be 4 to 8 digits.' : 'At least 6 characters.', 'bad'); return; }
      C.load(); me = C.S.personMap[me.id];
      C.setCode(id, v);
      C.S.log.push({ at: C.S.today, what: staff ? 'PIN changed' : 'password changed', by: me.name, detail: p.name });
      C.save(); C.closeModal(); C.toast('Done.', 'good');
    };
  }

  /* ══ Settings ═════════════════════════════════════════════════════════ */

  function renderSettings() {
    const S = C.S, P = S.policy;
    const num = function (lbl, key, sub) {
      return '<label class="f"><span>' + esc(lbl) + '</span><input class="in" type="number" min="0" data-p="' + key + '" value="' + P[key] + '">' +
        '<span class="mini" style="display:block;margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400">' + esc(sub) + '</span></label>';
    };
    let h = '<div class="wrap"><div class="sechead"><h2>Settings</h2></div><p class="hint">The rules every request is checked against. Changes apply at once, in both apps.</p>';
    h += '<div class="card"><div class="card-h"><h3>Leave policy</h3></div><div class="card-b"><div class="grid g3">' +
      num('Notice for a short request', 'noticeShort', 'days, for under 5 working days') +
      num('Notice for a week or more', 'noticeLong', 'days, for 5 working days or more') +
      num('Longest unbroken block', 'maxConsecutive', 'working days') +
      num('Carry-over allowed', 'carryOverMax', 'days into the new year') +
      '<label class="f"><span>Carry-over lapses on</span><input class="in" type="date" data-p="carryOverExpires" value="' + P.carryOverExpires + '"></label>' +
      '<label class="f"><span>Today, for the demo</span><input class="in" type="date" data-p="today" value="' + S.today + '">' +
      '<span class="mini" style="display:block;margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400">Shows both apps at another point in the year.</span></label>' +
      '</div><hr class="sep"><div class="row" style="gap:20px">' +
      '<label class="row" style="gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" data-p="countPendingInCover"' + (P.countPendingInCover ? ' checked' : '') +
      '> A request still waiting counts as away when checking staffing</label>' +
      '<label class="row" style="gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" data-p="hardBlockBelowCover"' + (P.hardBlockBelowCover ? ' checked' : '') +
      '> Refuse outright anything that takes a department below its minimum</label></div></div></div>';

    h += '<div class="card"><div class="card-h"><h3>Minimum in each day, by department</h3></div><div class="card-b tight"><table class="t">' +
      '<thead><tr><th>Department</th><th class="num">People</th><th class="num">Must be in</th><th class="num">Most that can be off</th></tr></thead><tbody>' +
      S.departments.map(function (d) {
        const head = S.people.filter(function (p) { return p.dept === d.id; }).length;
        return '<tr><td><i class="dot" style="display:inline-block;background:' + d.tint + ';margin-right:8px"></i><b style="font-weight:600">' + esc(d.name) + '</b></td>' +
          '<td class="num">' + head + '</td><td class="num"><input class="in" type="number" min="0" max="' + head + '" style="width:72px;text-align:right" data-dept="' +
          d.id + '" value="' + d.minCover + '"></td><td class="num">' + Math.max(0, head - d.minCover) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';

    h += '<div class="card"><div class="card-h"><h3>Closed and busy periods</h3><div class="rowend"><button class="btn sm" data-act="addblackout">Add a period</button></div></div>' +
      '<div class="card-b tight"><table class="t"><thead><tr><th>Period</th><th>Dates</th><th>Departments</th><th>Effect</th><th></th></tr></thead><tbody>' +
      (S.blackouts.length ? S.blackouts.map(function (b) {
        return '<tr><td><b style="font-weight:600">' + esc(b.name) + '</b><div class="mini">' + esc(b.why || '') + '</div></td><td>' + esc(E.fmtRange(b.from, b.to)) + '</td>' +
          '<td class="mini">' + (b.depts && b.depts.length ? b.depts.map(function (d) { return esc(C.dept(d).name); }).join(', ') : 'Everyone') + '</td>' +
          '<td>' + (b.level === 'block' ? '<span class="pill red">Refused</span>' : '<span class="pill amber">Cautioned</span>') + '</td>' +
          '<td class="num"><button class="btn sm dngr" data-act="delblackout" data-id="' + b.id + '">Remove</button></td></tr>';
      }).join('') : '<tr><td colspan="5"><div class="empty">None set.</div></td></tr>') + '</tbody></table></div></div>';

    h += '<div class="card"><div class="card-h"><h3>Public holidays</h3><span class="note">never taken from anyone’s allowance</span></div><div class="card-b"><div class="row" style="gap:7px">' +
      S.holidays.map(function (x) { return '<span class="pill' + (x.date < S.today ? ' grey' : ' gold') + '">' + esc(E.fmt(x.date, 'short')) + ' ' + x.date.slice(0, 4) + ' · ' + esc(x.name) + '</span>'; }).join('') +
      '</div></div></div>';

    h += '<div class="card"><div class="card-h"><h3>Demo data</h3></div><div class="card-b"><div class="row">' +
      '<button class="btn" data-act="exportall">Save everything as a file</button><button class="btn" data-act="importall">Bring in a file</button>' +
      '<button class="btn dngr rowend" data-act="resetall">Reset the demo</button></div>' +
      '<div class="mini" style="margin-top:10px">' + S.requests.length + ' requests · ' + S.people.length + ' people · ' + S.log.length + ' entries in the audit trail</div></div></div>';
    if (S.log.length) {
      h += '<div class="card"><div class="card-h"><h3>Audit trail</h3></div><div class="card-b tight"><table class="t"><thead><tr><th>When</th><th>What</th><th>By</th><th>Detail</th></tr></thead><tbody>' +
        S.log.slice(-25).reverse().map(function (l) {
          return '<tr><td class="mini">' + esc(E.fmt(l.at, 'short')) + '</td><td><b style="font-weight:600">' + esc(l.what) + '</b></td><td class="mini">' + esc(l.by) +
            '</td><td class="mini">' + esc(l.detail) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    $('#v-settings').innerHTML = h + '</div>';
  }

  function addBlackout() {
    const S = C.S;
    C.openModal('Add a closed or busy period',
      '<label class="f"><span>Name</span><input class="in" id="bk-name" placeholder="Trade show, festival week, year-end…"></label>' +
      '<div class="grid g2"><label class="f"><span>From</span><input class="in" type="date" id="bk-from" value="' + S.today + '"></label>' +
      '<label class="f"><span>To</span><input class="in" type="date" id="bk-to" value="' + E.add(S.today, 6) + '"></label></div>' +
      '<label class="f"><span>Applies to</span><select class="in" id="bk-dept"><option value="">Everyone</option>' +
      S.departments.map(function (d) { return '<option value="' + d.id + '">' + esc(d.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="f"><span>Effect</span><select class="in" id="bk-level"><option value="warn">Caution — it can still be asked for</option>' +
      '<option value="block">Refuse — it cannot be sent</option></select></label>' +
      '<label class="f"><span>Why</span><input class="in" id="bk-why" placeholder="Shown to anyone who tries to book it"></label>',
      '<button class="btn" data-act="closemodal">Back</button><button class="btn p" id="bk-save">Add it</button>');
    $('#bk-save').onclick = function () {
      const name = $('#bk-name').value.trim();
      if (!name) { C.toast('It needs a name.', 'bad'); return; }
      C.load(); me = C.S.personMap[me.id];
      C.S.blackouts.push({ id: C.uid('bk'), name: name, from: $('#bk-from').value, to: $('#bk-to').value,
        depts: $('#bk-dept').value ? [$('#bk-dept').value] : [], level: $('#bk-level').value, why: $('#bk-why').value.trim() });
      C.save(); C.closeModal(); renderSettings(); C.toast('Added.', 'good');
    };
  }

  /* ══ Events ═══════════════════════════════════════════════════════════ */

  document.addEventListener('click', function (ev) {
    const tabBtn = ev.target.closest && ev.target.closest('[data-tab]');
    if (tabBtn) { show(tabBtn.dataset.tab); return; }
    const el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el || !me) return;
    const id = el.dataset.id;
    switch (el.dataset.act) {
      case 'goapprove': show('approve'); break;
      case 'gocal': show('cal'); break;
      case 'goteam': show('team'); break;
      case 'req': requestModal(id); break;
      case 'person': personModal(id); break;
      case 'togglecard': { const c = document.querySelector('[data-card="' + id + '"]'); if (c) c.classList.toggle('open'); break; }
      case 'approve': C.closeModal(); approve(id); break;
      case 'decline': C.closeModal(); setTimeout(function () { declineModal(id); }, 10); break;
      case 'declineconfirm': {
        const note = ($('#declinenote') || {}).value || '';
        if (!note.trim()) { C.toast('Say why before declining — they will see it.', 'bad'); break; }
        decide(C.find(id), 'declined', note.trim());
        break;
      }
      case 'usereason': { const t = $('#declinenote'); if (t) { t.value = el.dataset.t; t.focus(); } break; }
      case 'usedates': { const t = $('#declinenote'); if (t) { t.value = (t.value ? t.value.replace(/\s*$/, ' ') : '') + 'Would ' + el.dataset.t + ' work instead?'; t.focus(); } break; }
      case 'approveclear': {
        const clear = queue().filter(function (r) { return E.RANK[E.analyse(r, C.S).level] <= E.RANK.note; });
        C.confirmDialog('Approve ' + clear.length + ' requests?', '<p style="margin:0 0 9px">Nothing was found against any of these:</p><table class="t"><tbody>' +
          clear.map(function (r) { return '<tr><td>' + C.personCell(C.S.personMap[r.personId]) + '</td><td>' + esc(E.fmtRange(r.from, r.to)) + '</td></tr>'; }).join('') +
          '</tbody></table>', 'Approve all ' + clear.length, function () {
            C.load(); me = C.S.personMap[me.id];
            clear.forEach(function (r) {
              const x = C.find(r.id);
              if (!x || x.status !== 'pending') return;
              x.status = 'approved'; x.decidedBy = me.id; x.decidedAt = C.S.today; x.seen = false;
              C.logIt('approved', x, me.name, 'in a batch');
            });
            C.save(); render(); chrome(); C.toast(clear.length + ' approved.', 'good');
          });
        break;
      }
      case 'calmode': U.cal.mode = el.dataset.v; renderCal(); break;
      case 'calprev': case 'calnext': {
        const y = +U.cal.month.slice(0, 4), m = +U.cal.month.slice(5, 7) - 1 + (el.dataset.act === 'calnext' ? 1 : -1);
        U.cal.month = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7); renderCal();
        break;
      }
      case 'caltoday': U.cal.month = C.S.today.slice(0, 7); renderCal(); break;
      case 'dayall': dayModal(el.dataset.d); break;
      case 'teamsort': {
        const k = el.dataset.k;
        if (U.teamSort.k === k) U.teamSort.dir *= -1; else U.teamSort = { k: k, dir: k === 'name' || k === 'dept' || k === 'next' ? 1 : -1 };
        renderTeam();
        break;
      }
      case 'exportteam': {
        const rows = [['Name', 'Job', 'Department', 'Entitlement', 'Carried over', 'Taken', 'Booked', 'Waiting', 'Left', '% used', 'Sick days']];
        C.S.people.forEach(function (p) {
          const b = E.balance(p, C.S, {});
          rows.push([p.name, p.role, C.dept(p.dept).name, b.entitlement, b.carry, b.taken, b.booked, b.pending, b.remaining, b.pct, b.sick]);
        });
        C.exportCSV(rows, 'JOR leave balances ' + C.S.today + '.csv');
        break;
      }
      case 'addperson': personForm(null); break;
      case 'editperson': C.closeModal(); setTimeout(function () { personForm(C.S.personMap[id]); }, 10); break;
      case 'setpin': setPin(id); break;
      case 'removeperson': {
        const p = C.S.personMap[id];
        C.closeModal();
        setTimeout(function () {
          C.confirmDialog('Remove ' + p.name + '?', '<p style="margin:0">They will no longer be able to sign in, and their requests are removed with them.</p>',
            'Remove', function () {
              C.load(); me = C.S.personMap[me.id];
              C.S.people = C.S.people.filter(function (x) { return x.id !== id; });
              C.S.requests = C.S.requests.filter(function (r) { return r.personId !== id; });
              C.S.log.push({ at: C.S.today, what: 'person removed', by: me.name, detail: p.name });
              C.hydrate(C.S); C.save(); render(); chrome(); C.toast(p.name + ' removed.');
            }, true);
        }, 10);
        break;
      }
      case 'addblackout': addBlackout(); break;
      case 'delblackout':
        C.load(); me = C.S.personMap[me.id];
        C.S.blackouts = C.S.blackouts.filter(function (b) { return b.id !== id; });
        C.save(); renderSettings();
        break;
      case 'exportall':
        C.download('JOR leave ' + C.S.today + '.json', JSON.stringify({
          policy: C.S.policy, departments: C.S.departments, blackouts: C.S.blackouts, people: C.S.people,
          requests: C.S.requests, today: C.S.today, log: C.S.log
        }, null, 2), 'application/json');
        break;
      case 'importall': {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = '.json,application/json';
        inp.onchange = function () {
          const f = inp.files && inp.files[0];
          if (!f) return;
          const rd = new FileReader();
          rd.onload = function () {
            try {
              const d = JSON.parse(rd.result), s = C.fresh();
              ['policy', 'departments', 'blackouts', 'people', 'requests', 'today', 'log'].forEach(function (k) { if (d[k]) s[k] = d[k]; });
              C.S = C.hydrate(s); C.save();
              me = C.S.personMap[me.id];
              if (!me) { C.signOut(APP); location.reload(); return; }
              render(); chrome(); C.toast('Brought in.', 'good');
            } catch (e) { C.toast('That file could not be read.', 'bad'); }
          };
          rd.readAsText(f);
        };
        inp.click();
        break;
      }
      case 'resetall':
        C.confirmDialog('Reset the demo?', '<p style="margin:0">Every request, decision, person and setting goes back to how it started — in both apps.</p>',
          'Reset it', function () { C.reset(); me = C.S.personMap[me.id]; U.fresh = {}; render(); chrome(); C.toast('Back to the start.', 'good'); }, true);
        break;
      case 'signout': C.signOut(APP); location.reload(); break;
    }
  });

  document.addEventListener('input', function (ev) {
    const t = ev.target;
    if (!t.dataset || !me) return;
    if (t.dataset.c !== undefined) {
      U.cal[t.dataset.c] = t.value;
      if (t.dataset.c === 'q') calBody(); else renderCal();
      return;
    }
    if (t.dataset.t !== undefined) {
      if (t.dataset.t === 'q') {
        U.teamQ = t.value; renderTeam();
        const q = $('#teamq'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
      } else { U.teamDept = t.value; renderTeam(); }
      return;
    }
    if (t.dataset.p !== undefined || t.dataset.dept !== undefined) {
      C.load(); me = C.S.personMap[me.id];
      if (t.dataset.p === 'today') C.S.today = t.value;
      else if (t.dataset.p !== undefined) C.S.policy[t.dataset.p] = t.type === 'checkbox' ? t.checked : (t.type === 'number' ? +t.value : t.value);
      else { const d = C.S.deptMap[t.dataset.dept]; if (d) d.minCover = Math.max(0, +t.value || 0); }
      C.save(); chrome();
    }
  });

  /* A request sent from Book Time Off arrives here live. */
  C.onSync(function (chg) {
    if (!me) return;
    me = C.S.personMap[me.id];
    if (!me) { C.signOut(APP); location.reload(); return; }
    chg.added.forEach(function (r) {
      if (r.status !== 'pending' || !canDecide(r)) return;
      U.fresh[r.id] = true;
      const who = C.S.personMap[r.personId], a = E.analyse(r, C.S);
      C.toast('New request — ' + (who ? who.name : '') + ', ' + E.fmtRange(r.from, r.to) +
        (E.RANK[a.level] >= E.RANK.clash ? ' (clashes)' : ''), E.RANK[a.level] >= E.RANK.clash ? 'bad' : 'good');
    });
    chg.changed.forEach(function (r) {
      if (r.status === 'cancelled') { delete U.fresh[r.id]; C.toast(C.first(C.S.personMap[r.personId]) + ' cancelled ' + E.fmtRange(r.from, r.to) + '.'); }
    });
    chrome();
    if (!document.getElementById('modal').classList.contains('on')) render();
  });

  /* ══ Start ════════════════════════════════════════════════════════════ */

  C.load();
  C.brand();
  C.wireModal();
  function start() {
    me = C.current(APP);
    U.cal.month = C.S.today.slice(0, 7);
    document.getElementById('app').style.visibility = 'visible';
    show('dash');
  }
  if (C.current(APP)) start();
  else C.gate({
    app: APP, title: 'Leave Manager', sub: 'For the COO and the owner only.',
    who: function (p) { return p.access === 'manager' || p.access === 'owner'; }, flat: true,
    whoLabel: 'Who are you', codeLabel: 'Password',
    hint: '<b>Demo:</b> both passwords are <b>jor2026</b>. Staff cannot sign in here — try it in Book Time Off instead.',
    foot: 'Booking your own leave? Use <a href="staff.html?v=202609191406">Book Time Off</a>.',
    onIn: start
  });
})();

</script>
</body>
</html>
