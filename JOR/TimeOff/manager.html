<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOR Leave Manager</title>
<link rel="icon" href="data:,">
<style>
/* ══════════════════════════════════════════════════════════════════════
   1. TOKENS — the house green from JOR A4 Day Template.docx (fill 00A66E)
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --jor:#00A66E; --jor-dp:#00A66E; --jor-deep:#00875A;
  --on-jor:#FFC81E;
  --gold:#B08D2E; --gold-lt:#D9C27E; --gold-pale:#F3EBD6;
  --mist:#CDE7DC; --mist-2:#E8F3EE; --mist-3:#F5FAF8;
  --ink:#13251E; --ink-2:#41564D; --ink-3:#72877D; --slate:#5F6E70;
  --line:#DBE7E1; --line-2:#EDF4F1; --paper:#fff; --bg:#ECF1EF;
  --err:#B3261E; --err-bg:#FDEDEC; --warn:#9A6209; --warn-bg:#FDF4E3;
  --clash:#C2550F; --clash-bg:#FCEFE6;
  --r:10px;
  --shadow:0 1px 2px rgba(9,40,30,.05),0 10px 28px rgba(9,40,30,.08);
  --shadow-sm:0 1px 2px rgba(9,40,30,.06);
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Cambria,"Georgia","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--jor-dp)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#c2d4cc;border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a5bcb2;background-clip:content-box;border:3px solid transparent}

/* ══════════════════════════════════════════════════════════════════════
   2. APP CHROME
   ══════════════════════════════════════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:58px;flex:0 0 58px;
  background:var(--jor);color:#fff;z-index:40;box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.brandmark{display:flex;align-items:center;gap:11px;white-space:nowrap}
.brandmark img{height:30px;width:auto;display:block}
.brandmark .bt{font-family:var(--serif);font-size:15.5px;letter-spacing:.02em;opacity:.92;
  padding-left:11px;border-left:1px solid rgba(217,194,126,.42)}
.tabs{display:flex;gap:2px;margin-left:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:rgba(255,255,255,.72);padding:8px 12px;border-radius:8px;
  cursor:pointer;font-size:13.5px;font-weight:520;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{background:rgba(255,255,255,.09);color:#fff}
.tab.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600;box-shadow:0 1px 0 var(--gold-lt) inset}
.tab .badge{background:var(--gold);color:#231B04;border-radius:999px;font-size:10.5px;font-weight:800;
  padding:1px 6px;min-width:18px;text-align:center;line-height:1.5}
.tab.on .badge{background:var(--on-jor)}
.spacer{flex:1}
.whoami{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:999px;padding:4px 6px 4px 5px;cursor:pointer;position:relative}
.whoami:hover{background:rgba(255,255,255,.18)}
.whoami .av{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#231B04;display:grid;place-items:center;
  font-size:12px;font-weight:800;letter-spacing:.02em;flex:0 0 auto}
.whoami .wt{line-height:1.15;text-align:left;padding-right:4px}
.whoami .wt b{display:block;font-size:12.5px;font-weight:620;white-space:nowrap}
.whoami .wt span{display:block;font-size:10.5px;opacity:.8;white-space:nowrap}
.whoami select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rolepill{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 9px;opacity:.95}
/* On a narrower window the tabs matter more than the name badge. */
@media(max-width:1475px){.rolepill{display:none}}
@media(max-width:1550px){.live{display:none}}
@media(max-width:1400px){.whoami .wt{display:none}.whoami{padding:4px}}
@media(max-width:1025px){.brandmark .bt{display:none}}

.tbtn{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.07);color:#fff;padding:7px 12px;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:520;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn.primary{background:var(--gold);border-color:transparent;font-weight:640;color:#231B04}
.tbtn.primary:hover{background:var(--gold-lt)}

.work{flex:1;overflow-y:auto;overflow-x:hidden;display:none;padding:22px 24px 90px}
.work.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
.wrap.wide{max-width:1500px}
.sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;flex-wrap:wrap}
.sechead h2{margin:0;font-size:21px;font-weight:640;letter-spacing:-.015em;font-family:var(--serif)}
.sechead .rowend{margin-left:auto}
.hint{color:var(--ink-3);font-size:12.5px;margin:0 0 18px;max-width:86ch}

/* ══════════════════════════════════════════════════════════════════════
   3. SURFACES, BUTTONS, FORMS
   ══════════════════════════════════════════════════════════════════════ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:660;display:flex;align-items:center;gap:8px}
.card-h .note{color:var(--ink-3);font-size:12px}
.card-h .rowend{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card-b{padding:15px}
.card-b.tight{padding:0}
.card-b.flush{padding:0 15px 15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media(max-width:1350px){.split{grid-template-columns:1fr}.g4,.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:975px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

label.f>span{display:block;font-size:11px;font-weight:660;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
label.f{display:block;margin-bottom:12px}
.in{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;font-size:13.5px}
.in:focus{border-color:var(--jor);box-shadow:0 0 0 3px rgba(0,166,110,.13)}
textarea.in{resize:vertical;min-height:74px;line-height:1.6}
select.in{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2372877D' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;
  font-size:13px;font-weight:540;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--mist-3);border-color:var(--jor)}
.btn.p{background:var(--jor);color:#fff;border-color:transparent;font-weight:620}
.btn.p:hover{background:var(--jor-deep)}
.btn.g{background:var(--gold);color:#231B04;border-color:transparent;font-weight:620}
.btn.g:hover{background:var(--gold-lt)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.dngr{color:var(--err)}
.btn.dngr:hover{background:var(--err-bg);border-color:var(--err)}
.btn:disabled{opacity:.42;cursor:default;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowend{margin-left:auto}
.mini{font-size:11.5px;color:var(--ink-3)}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:14px 0}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-size:14px;font-weight:620;margin-bottom:4px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 13px;font-size:12.5px;font-weight:560;cursor:pointer;color:var(--ink-2);
  border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--jor);color:#fff;font-weight:640}
.seg button:not(.on):hover{background:var(--mist-2)}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--mist-2);color:var(--jor-dp);
  border:1px solid var(--mist);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:620;white-space:nowrap}
.pill.gold{background:var(--gold-pale);border-color:#E7D9AE;color:#7A6018}
.pill.grey{background:#F0F3F2;border-color:var(--line);color:var(--ink-3)}
.pill.amber{background:var(--warn-bg);border-color:#EDD9AC;color:var(--warn)}
.pill.red{background:var(--err-bg);border-color:#F0C7C3;color:var(--err)}
.pill.orange{background:var(--clash-bg);border-color:#F2D3BE;color:var(--clash)}
.pill.solid{background:var(--jor);border-color:transparent;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;
  color:#fff;flex:0 0 auto;letter-spacing:.01em}
.av.sm{width:24px;height:24px;font-size:9.5px}
.av.lg{width:46px;height:46px;font-size:16px}
.person{display:flex;align-items:center;gap:9px;min-width:0}
.person .pn{min-width:0}
.person .pn b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .pn span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══════════════════════════════════════════════════════════════════════
   4. STAT TILES & DONUT
   ══════════════════════════════════════════════════════════════════════ */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:16px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-26px;top:-26px;width:70px;height:70px;border-radius:50%;
  background:var(--mist-3);z-index:0}
.tile>*{position:relative;z-index:1}
.tile .tl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.tile .tv{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tile .tv small{font-size:14px;font-weight:600;color:var(--ink-3);font-family:var(--sans);margin-left:3px}
.tile .ts{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.tile.accent{background:var(--jor);border-color:transparent;color:#fff}
.tile.accent::after{background:rgba(255,255,255,.08)}
.tile.accent .tl{color:rgba(255,255,255,.75)}
.tile.accent .ts{color:rgba(255,255,255,.82)}
.tile.warn .tv{color:var(--clash)}
.tile.danger .tv{color:var(--err)}
.tile.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s}
.tile.clickable:hover{transform:translateY(-1px);box-shadow:var(--shadow)}

.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{flex:0 0 auto;position:relative;width:168px;height:168px}
.donut svg{transform:rotate(-90deg)}
.donut .dmid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.donut .dmid b{font-family:var(--serif);font-size:38px;font-weight:700;display:block;letter-spacing:-.02em}
.donut .dmid span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:block;margin-top:3px}
.legend{display:flex;flex-direction:column;gap:9px;min-width:190px;flex:1}
.legend .lr{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .lr b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:660}
.legend .lr .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.legend .lr span{color:var(--ink-2)}

.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:132px 1fr 56px;gap:11px;align-items:center;font-size:12.5px}
.bar .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-weight:560}
.bar .bt{height:9px;border-radius:99px;background:var(--line-2);overflow:hidden;position:relative}
.bar .bt i{display:block;height:100%;border-radius:99px;background:var(--jor)}
.bar .bt em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--clash);opacity:.65}
.bar .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}

/* ══════════════════════════════════════════════════════════════════════
   5. CHARTS
   ══════════════════════════════════════════════════════════════════════ */
.chart{width:100%;display:block;overflow:visible}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-size:10px;font-family:var(--sans)}
.chart .lbl{fill:var(--ink-2);font-size:10.5px;font-weight:600;font-family:var(--sans)}
.chart .thr{stroke:var(--clash);stroke-width:1.4;stroke-dasharray:4 3}
.sparkrow{display:flex;gap:2px;align-items:flex-end;height:38px}
.sparkrow i{flex:1;background:var(--mist);border-radius:2px 2px 0 0;min-height:2px}
.sparkrow i.hot{background:var(--clash)}

/* ══════════════════════════════════════════════════════════════════════
   6. CONFLICT PANEL
   ══════════════════════════════════════════════════════════════════════ */
.verdict{border-radius:var(--r);padding:14px 15px;display:flex;gap:13px;align-items:flex-start;margin-bottom:13px;
  border:1px solid transparent}
.verdict .vi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:0 0 auto;
  background:rgba(255,255,255,.6)}
.verdict b{display:block;font-size:15px;font-weight:660;font-family:var(--serif);letter-spacing:-.01em}
.verdict p{margin:3px 0 0;font-size:12.5px;line-height:1.5}
.v-clear{background:var(--mist-2);border-color:var(--mist);color:#0A5C41}
.v-note{background:var(--mist-3);border-color:var(--line);color:var(--ink-2)}
.v-caution{background:var(--warn-bg);border-color:#EDD9AC;color:var(--warn)}
.v-clash{background:var(--clash-bg);border-color:#F2D3BE;color:var(--clash)}
.v-blocked{background:var(--err-bg);border-color:#F0C7C3;color:var(--err)}

.flags{display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:#fff;font-size:12.5px}
.flag .fi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;flex:0 0 auto;
  background:var(--mist-2);color:var(--jor-dp)}
.flag b{display:block;font-size:12.8px;font-weight:640;margin-bottom:2px;color:var(--ink)}
.flag p{margin:0;color:var(--ink-2);line-height:1.5}
.flag.l-caution{background:var(--warn-bg);border-color:#EDD9AC}
.flag.l-caution .fi{background:#F6E4BE;color:var(--warn)}
.flag.l-clash{background:var(--clash-bg);border-color:#F2D3BE}
.flag.l-clash .fi{background:#F6DAC6;color:var(--clash)}
.flag.l-blocked{background:var(--err-bg);border-color:#F0C7C3}
.flag.l-blocked .fi{background:#F7D4D1;color:var(--err)}
.flag.l-note{background:var(--mist-3)}

.coverstrip{display:flex;gap:3px;margin-top:4px}
.coverstrip .cd{flex:1;min-width:0;text-align:center}
.coverstrip .cd .cdl{font-size:9.5px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.coverstrip .cd .cdb{height:32px;border-radius:5px;background:var(--mist-2);position:relative;overflow:hidden;
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--jor-dp);margin-top:3px}
.coverstrip .cd.short .cdb{background:var(--clash-bg);color:var(--clash);box-shadow:0 0 0 1px #EFC7AB inset}
.coverstrip .cd.zero .cdb{background:var(--err-bg);color:var(--err);box-shadow:0 0 0 1px #EFBFBA inset}
.coverstrip .cd.off .cdb{background:#F2F5F4;color:#AFC0B8}

.suggest{display:flex;flex-direction:column;gap:7px}
.sugg{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;
  cursor:pointer;font-size:12.5px;text-align:left;width:100%}
.sugg:hover{border-color:var(--jor);background:var(--mist-3)}
.sugg b{font-weight:640}
.sugg .sd{margin-left:auto;color:var(--ink-3);font-size:11.5px;white-space:nowrap}

/* ══════════════════════════════════════════════════════════════════════
   7. CALENDARS
   ══════════════════════════════════════════════════════════════════════ */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.calhead div{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  text-align:center;padding:4px 0}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:104px;padding:6px 7px;position:relative;
  display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cell.out{background:#F4F7F6;border-color:var(--line-2)}
.cell.out .cn{color:#B5C5BD}
.cell.we{background:var(--mist-3)}
.cell.today{border-color:var(--jor);box-shadow:0 0 0 2px rgba(0,166,110,.16)}
.cell.hol{background:var(--gold-pale);border-color:#EADFC0}
.cell.short::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--clash)}
.cell .cn{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.cell .cn .hn{font-size:9.5px;font-weight:700;color:#7A6018;text-transform:uppercase;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cx{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--clash);letter-spacing:.03em}
.chip{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 6px;border-radius:5px;background:var(--mist-2);
  color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid var(--jor)}
.chip:hover{filter:brightness(.97)}
.chip.pending{background:repeating-linear-gradient(135deg,var(--warn-bg),var(--warn-bg) 5px,#fff 5px,#fff 10px)}
.chip b{font-weight:640}
.cell .more{font-size:10.5px;color:var(--ink-3);font-weight:600;cursor:pointer}
.cell .more:hover{color:var(--jor-dp)}

/* Wall planner ─────────────────────────────────────────────────────── */
.planner{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:70vh;position:relative}
.ptable{border-collapse:separate;border-spacing:0;font-size:11px}
.ptable th,.ptable td{padding:0;margin:0}
.ptable thead th{position:sticky;top:0;z-index:3;background:#fff;box-shadow:0 1px 0 var(--line)}
.ptable .pname{position:sticky;left:0;z-index:2;background:#fff;box-shadow:1px 0 0 var(--line);
  min-width:176px;max-width:176px;padding:0 9px;text-align:left}
.ptable thead .pname{z-index:4}
.ptable .mname{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding-left:4px;border-left:1px solid var(--line);white-space:nowrap;height:22px}
.ptable .dh{font-size:8.5px;color:var(--ink-3);text-align:center;height:18px;font-weight:600;
  border-left:1px solid var(--line-2)}
.ptable .dh.we{background:var(--mist-3);color:#A9BCB3}
.ptable .dh.mstart{border-left:1px solid var(--line)}
.ptable tbody tr:hover .pname{background:var(--mist-3)}
.ptable tbody td.d{width:15px;height:26px;border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);
  position:relative}
.ptable tbody td.d.we{background:var(--mist-3)}
.ptable tbody td.d.hol{background:var(--gold-pale)}
.ptable tbody td.d.mstart{border-left:1px solid var(--line)}
.ptable tbody td.d.today{box-shadow:inset 2px 0 0 var(--jor)}
.ptable tbody td.d i{position:absolute;inset:3px 0;display:block}
.ptable tbody td.d i.s{border-radius:4px 0 0 4px;left:2px}
.ptable tbody td.d i.e{border-radius:0 4px 4px 0;right:2px}
.ptable tbody td.d i.pend{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.55) 3px,transparent 3px,transparent 6px)}
.ptable tbody tr.dhead td{background:var(--mist-3);height:24px;font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);border-top:1px solid var(--line)}
.ptable tbody tr.dhead .pname{background:var(--mist-2);color:var(--jor-dp)}
.pnamecell{display:flex;align-items:center;gap:7px;height:26px}
.pnamecell b{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnamecell .pr{margin-left:auto;font-size:9.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.coverrow td.d{height:20px}
.coverrow .cv{position:absolute;inset:2px 1px;border-radius:2px}

/* Timeline ─────────────────────────────────────────────────────────── */
.tl{display:flex;flex-direction:column;gap:2px}
.tlhead{display:grid;grid-template-columns:172px 1fr;gap:0;position:sticky;top:0;background:#fff;z-index:2;
  border-bottom:1px solid var(--line);padding-bottom:4px}
.tlweeks{display:grid}
.tlweeks div{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  text-align:center;border-left:1px solid var(--line-2);padding:4px 0}
.tlrow{display:grid;grid-template-columns:172px 1fr;align-items:center;min-height:32px;border-bottom:1px solid var(--line-2)}
.tlrow:hover{background:var(--mist-3)}
.tllane{position:relative;height:26px;margin:3px 0}
.tllane .grid{position:absolute;inset:0;display:grid;pointer-events:none}
.tllane .grid i{border-left:1px solid var(--line-2)}
.tllane .grid i.we{background:var(--mist-3)}
.tlbar{position:absolute;top:3px;bottom:3px;border-radius:5px;display:flex;align-items:center;padding:0 6px;
  font-size:10.5px;font-weight:650;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;
  box-shadow:0 1px 2px rgba(9,40,30,.14)}
.tlbar.pend{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.5) 4px,transparent 4px,transparent 8px)}
.tlnow{position:absolute;top:0;bottom:0;width:2px;background:var(--jor);z-index:3;pointer-events:none}
.tldept{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  padding:9px 0 4px;border-top:1px solid var(--line);margin-top:6px}

/* ══════════════════════════════════════════════════════════════════════
   8. LISTS & TABLES
   ══════════════════════════════════════════════════════════════════════ */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--mist-3);position:sticky;top:0;z-index:1}
table.t th.num,table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tbody tr:hover{background:var(--mist-3)}
table.t th.sortable{cursor:pointer;user-select:none}
table.t th.sortable:hover{color:var(--jor-dp)}
table.t th .sa{opacity:.5;font-size:9px;margin-left:3px}
.tscroll{max-height:64vh;overflow:auto;border-radius:0 0 var(--r) var(--r)}

.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;
  letter-spacing:.02em;white-space:nowrap}
.s-pending{background:var(--warn-bg);color:var(--warn)}
.s-approved{background:var(--mist-2);color:#0A5C41}
.s-declined{background:var(--err-bg);color:var(--err)}
.s-cancelled{background:#F0F3F2;color:var(--ink-3)}

.reqcard{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:12px;overflow:hidden;
  box-shadow:var(--shadow-sm)}
.reqcard.lv-clash{border-color:#EFC7AB}
.reqcard.lv-blocked{border-color:#EFBFBA}
.reqcard-h{display:flex;align-items:center;gap:11px;padding:12px 14px;background:linear-gradient(180deg,#fff,var(--mist-3));
  flex-wrap:wrap;cursor:pointer}
.reqcard-h .when{font-family:var(--serif);font-size:15px;font-weight:660;letter-spacing:-.01em}
.reqcard-h .wd{font-size:11.5px;color:var(--ink-3)}
.reqcard-b{padding:0 14px 14px;display:none}
.reqcard.open .reqcard-b{display:block}
.reqcard.open .reqcard-h{border-bottom:1px solid var(--line-2)}
.notebox{background:var(--mist-3);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;font-size:12.5px;
  color:var(--ink-2);line-height:1.55;margin:0 0 12px}
.notebox i{color:var(--ink-3);font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  display:block;margin-bottom:3px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--ink-3);white-space:nowrap}
.kv dd{margin:0;font-weight:560}

/* ══════════════════════════════════════════════════════════════════════
   9. MODAL, DRAWER, TOAST
   ══════════════════════════════════════════════════════════════════════ */
#scrim{position:fixed;inset:0;background:rgba(9,32,24,.42);backdrop-filter:blur(2px);z-index:60;display:none}
#scrim.on{display:block}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);
  max-height:86vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(9,40,30,.3);display:none}
.modal.on{display:block}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-family:var(--serif);font-size:18px;font-weight:660;letter-spacing:-.01em}
.modal-h .x{margin-left:auto;border:0;background:transparent;font-size:19px;cursor:pointer;color:var(--ink-3);line-height:1;padding:2px 6px}
.modal-h .x:hover{color:var(--ink)}
.modal-b{padding:16px 18px}
.modal-f{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;
  background:var(--mist-3);border-radius:0 0 14px 14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:560;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(9,40,30,.3);max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--err)}
#toast.good{background:var(--jor-deep)}

/* ══════════════════════════════════════════════════════════════════════
   10. WEDGE — the JOR device, used on the page headers
   ══════════════════════════════════════════════════════════════════════ */
.pagehead{position:relative;background:var(--jor);color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:16px;
  overflow:hidden;box-shadow:var(--shadow)}
.pagehead::after{content:"";position:absolute;right:-60px;top:-30px;width:230px;height:190px;
  background:rgba(255,255,255,.07);transform:skewX(-18deg)}
.pagehead h2{margin:0;font-family:var(--serif);font-size:23px;font-weight:660;letter-spacing:-.015em;position:relative;z-index:1}
.pagehead p{margin:5px 0 0;font-size:13px;opacity:.88;max-width:78ch;position:relative;z-index:1}
.pagehead .ph-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.pagehead .rowend{margin-left:auto}

@media print{
  .topbar,.tabs,#toast,.btn,.tbtn,.seg{display:none!important}
  .work{overflow:visible;height:auto;padding:0}
  body,#app{height:auto;overflow:visible;background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}

/* ══════════════════════════════════════════════════════════════════════
   11. SIGN-IN, LAUNCHER, APP BADGE
   ══════════════════════════════════════════════════════════════════════ */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;
  background:var(--jor);overflow:auto}
.gate::before{content:"";position:absolute;right:-140px;top:-80px;width:620px;height:520px;
  background:rgba(255,255,255,.07);transform:skewX(-18deg);pointer-events:none}
.gate::after{content:"";position:absolute;left:-160px;bottom:-120px;width:420px;height:360px;
  background:rgba(0,0,0,.05);transform:skewX(-18deg);pointer-events:none}
.gatecard{position:relative;z-index:1;background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(4,40,26,.35);
  width:min(430px,100%);overflow:hidden}
.gatecard .gh{padding:26px 28px 18px;border-bottom:1px solid var(--line-2)}
.gatecard .gh img{height:40px;display:block;margin-bottom:16px;filter:none}
.gatecard .gh .logobg{background:var(--jor);border-radius:10px;padding:10px 14px;display:inline-block;margin-bottom:16px}
.gatecard .gh .logobg img{margin:0;height:34px}
.gatecard h1{margin:0;font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-.015em}
.gatecard .gh p{margin:6px 0 0;color:var(--ink-3);font-size:13px}
.gatecard .gb{padding:20px 28px 24px}
.gatecard .gf{padding:13px 28px;background:var(--mist-3);border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3)}
.gatecard .gf a{font-weight:600}
.gatecard .err{color:var(--err);font-size:12.5px;min-height:18px;margin:-4px 0 8px}
.demohint{background:var(--gold-pale);border:1px solid #EADFC0;color:#6B5413;border-radius:8px;padding:8px 11px;
  font-size:12px;margin-bottom:14px}
.btn.block{width:100%;justify-content:center;padding:10px 12px;font-size:14px}
.appbadge{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.14);
  border-radius:999px;padding:3px 9px;margin-left:4px}
.signout{white-space:nowrap;flex:0 0 auto;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 11px;
  font-size:12.5px;cursor:pointer}
.signout:hover{background:rgba(255,255,255,.14)}
.whoami.static{cursor:default}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:rgba(255,255,255,.85)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--on-jor);box-shadow:0 0 0 0 rgba(255,200,30,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,30,.6)}70%{box-shadow:0 0 0 8px rgba(255,200,30,0)}100%{box-shadow:0 0 0 0 rgba(255,200,30,0)}}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--on-jor)}100%{box-shadow:var(--shadow-sm)}}
.launch{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:0 auto}
@media(max-width:950px){.launch{grid-template-columns:1fr}}
.lcard{background:#fff;border-radius:16px;padding:26px;text-decoration:none;color:var(--ink);box-shadow:0 20px 50px rgba(4,40,26,.28);
  display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.lcard:hover{transform:translateY(-3px)}
.lcard .li{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;font-size:26px;background:var(--mist-2)}
.lcard h2{margin:0;font-family:var(--serif);font-size:23px}
.lcard p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.55}
.lcard .lk{margin-top:auto;font-weight:700;color:var(--jor-dp);font-size:13.5px}
.lcard.mgr .li{background:var(--gold-pale)}
.lcard.mgr .lk{color:#7A6018}

/* ══════════════════════════════════════════════════════════════════════
   12. A QUARTER BIGGER
   Everything — text, spacing, charts — is drawn at 125%. zoom scales the
   whole layout together; anything sized to the window is divided back by
   the same factor so the app still fits the screen exactly. Change --z to
   make it bigger or smaller. The breakpoints above are already multiplied
   by 1.25 so the layout folds at the same point on screen as before.
   ══════════════════════════════════════════════════════════════════════ */
:root{--z:1.25}
body{zoom:var(--z)}
#app{height:calc(100vh / var(--z))}
.modal{max-height:calc(86vh / var(--z))}
.planner{max-height:calc(70vh / var(--z))}
.tscroll{max-height:calc(64vh / var(--z))}
.gate{min-height:calc(100vh / var(--z))}

</style>
</head>
<body>
<div id="app" style="visibility:hidden">
  <header class="topbar">
    <div class="brandmark"><img data-logo alt="JOR Ireland"><span class="bt">Leave Manager</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="spacer"></div>
    <span class="live" title="New requests from Book Time Off appear here as they are sent"><i></i>Live</span>
    <div class="whoami static">
      <span class="av" id="whoav"></span>
      <span class="wt"><b id="whoname"></b><span id="whorole"></span></span>
    </div>
    <button class="signout" data-act="signout">Sign out</button>
  </header>
  <main class="work on" id="v-dash"></main>
  <main class="work" id="v-approve"></main>
  <main class="work" id="v-cal"></main>
  <main class="work" id="v-team"></main>
  <main class="work" id="v-people"></main>
  <main class="work" id="v-settings"></main>
</div>

<div id="scrim"></div>
<div class="modal" id="modal">
  <div class="modal-h"><h3 id="modal-title"></h3><button class="x" id="modal-x">✕</button></div>
  <div class="modal-b" id="modal-body"></div>
  <div class="modal-f" id="modal-foot"></div>
</div>
<div id="toast"></div>

    { id: 'p20', name: 'Eoghan Flaherty',   dept: 'sales', role: 'Business Development Mgr', roleKey: 'bdm',     sole: false, manager: 'p18', entitlement: 22, carry: 1, toil: 0,   admin: false, approver: false, since: '2022-06-20' },

    // Transport & Guiding
    { id: 'p21', name: 'Pádraig Moloney',   dept: 'trans', role: 'Transport Manager',        roleKey: 'transmgr',sole: true,  manager: 'p01', entitlement: 24, carry: 0, toil: 4,   admin: false, approver: true,  since: '2010-02-08' },
    { id: 'p22', name: 'Clíona Fennelly',   dept: 'trans', role: 'Fleet Controller',         roleKey: 'fleet',   sole: true,  manager: 'p21', entitlement: 21, carry: 2, toil: 1,   admin: false, approver: false, since: '2019-01-07' },
    { id: 'p23', name: 'Séamus Quirke',     dept: 'trans', role: 'Guide Coordinator',        roleKey: 'guides',  sole: false, manager: 'p21', entitlement: 21, carry: 0, toil: 2.5, admin: false, approver: false, since: '2020-09-28' },

    // Finance
    { id: 'p24', name: 'Deirdre Sheehan',   dept: 'fin',   role: 'Financial Controller',     roleKey: 'fc',      sole: true,  manager: 'p01', entitlement: 25, carry: 3, toil: 0,   admin: true,  approver: true,  since: '2016-04-11' },
    { id: 'p25', name: 'Killian Dwyer',     dept: 'fin',   role: 'Accounts & Payroll',       roleKey: 'payroll', sole: true,  manager: 'p24', entitlement: 21, carry: 1, toil: 0,   admin: false, approver: false, since: '2021-11-08' },

    // Marketing
    { id: 'p26', name: 'Laoise Kavanagh',   dept: 'mkt',   role: 'Marketing Manager',        roleKey: 'mktmgr',  sole: true,  manager: 'p01', entitlement: 23, carry: 0, toil: 1,   admin: false, approver: true,  since: '2020-02-17' },
    { id: 'p27', name: 'Barra Twomey',      dept: 'mkt',   role: 'Content & Digital Exec',   roleKey: 'content', sole: true,  manager: 'p26', entitlement: 20, carry: 2, toil: 0,   admin: false, approver: false, since: '2024-01-15' }
  ];

  /* Two people run the manager app: the owner and the COO.
     Every request goes to the COO; his own go to the owner. */
  PEOPLE.forEach(function (p) {
    p.access = p.id === 'p01' ? 'owner' : p.id === 'p02' ? 'manager' : 'staff';
    p.manager = p.id === 'p01' ? null : p.id === 'p02' ? 'p01' : 'p02';
    delete p.approver; delete p.admin;
  });

  /* Demo sign-in codes. The app keeps only a hash of each one. */
  const DEMO_PINS = { staff: '1234', manager: 'jor2026', owner: 'jor2026' };

  PEOPLE.forEach(function (p) {
    p.email = p.name.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z ]/g, '').split(' ').filter(Boolean).slice(0, 2).join('.') + '@jorireland.ie';
    p.initials = p.name.split(' ').filter(function (w) { return w.length > 1; })
      .map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
  });

  /* ── Seeded requests ────────────────────────────────────────────────── *
     A deterministic generator so the demo looks the same every time it is
     opened, with a handful of hand-placed requests that put the conflict
     engine on show. TODAY is the date the demo is written around.         */
  const TODAY = '2026-09-17';

  function rng(seed) {
    let s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function shiftDate(iso, n) {
    const d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function weekdayOf(iso) { return new Date(iso + 'T00:00:00Z').getUTCDay(); }
  function nextMonday(iso) {
    let d = iso, guard = 0;
    while (weekdayOf(d) !== 1 && guard++ < 10) d = shiftDate(d, 1);
    return d;
  }

  /* Hand-placed — each one exists to demonstrate something.               */
  const FIXED = [
    // Three Operations people converging on the same October week: this drops
    // Operations under its minimum cover and puts two Operations Executives
    // (the same roleKey) off together.
    { p: 'p05', type: 'annual', from: '2026-10-12', to: '2026-10-16', status: 'approved', note: 'Half term with the kids.' },
    { p: 'p06', type: 'annual', from: '2026-10-13', to: '2026-10-15', status: 'approved', note: '' },
    { p: 'p07', type: 'annual', from: '2026-10-12', to: '2026-10-19', status: 'pending',  note: 'Wedding in Donegal on the 17th, travelling either side.' },

    // A sole-holder clash: the Fleet Controller and the Transport Manager
    // both out, leaving Transport with nobody who can move a coach.
    { p: 'p21', type: 'annual', from: '2026-11-02', to: '2026-11-06', status: 'approved', note: '' },
    { p: 'p22', type: 'annual', from: '2026-11-04', to: '2026-11-10', status: 'pending',  note: 'Flights already held.' },

    // Straight into a blackout: Finance at year-end close.
    { p: 'p25', type: 'annual', from: '2027-01-04', to: '2027-01-08', status: 'pending',  note: 'Ski week.' },

    // Two Reservations Agents on the same days in peak season.
    { p: 'p10', type: 'annual', from: '2026-09-28', to: '2026-10-02', status: 'approved', note: '' },
    { p: 'p11', type: 'annual', from: '2026-09-30', to: '2026-10-02', status: 'pending',  note: '' },

    // Clean requests, so the queue is not all red.
    { p: 'p15', type: 'annual', from: '2026-11-16', to: '2026-11-20', status: 'pending',  note: '' },
    { p: 'p27', type: 'study',  from: '2026-10-05', to: '2026-10-06', status: 'pending',  note: 'Digital marketing diploma exams.' },
    { p: 'p19', type: 'toil',   from: '2026-09-25', to: '2026-09-25', status: 'pending',  note: 'Owed from the Lisbon roadshow weekend.' },
    { p: 'p03', type: 'annual', from: '2026-12-21', to: '2026-12-24', status: 'pending',  note: '' },

    // Currently off, so "who is out today" has something in it.
    { p: 'p13', type: 'annual', from: '2026-09-14', to: '2026-09-18', status: 'approved', note: '' },
    { p: 'p16', type: 'annual', from: '2026-09-16', to: '2026-09-22', status: 'approved', note: '' },
    { p: 'p23', type: 'sick',   from: '2026-09-17', to: '2026-09-18', status: 'approved', note: 'Chest infection, certificate to follow.' },

    // The COO's own request: only the owner can decide on it.
    { p: 'p02', type: 'annual', from: '2026-11-09', to: '2026-11-13', status: 'pending', note: 'Family week in Lisbon. Cian has agreed to hold the fort.' },

    // A declined one, for the decision log.
    { p: 'p12', type: 'annual', from: '2026-08-10', to: '2026-08-21', status: 'declined', note: 'Two weeks home to Poland.',
      decisionNote: 'Peak fortnight with Orla already away — can we look at the last week of September instead?' },

    // Parental and compassionate, so the type mix is real.
    { p: 'p04', type: 'parent', from: '2026-11-23', to: '2026-12-04', status: 'approved', note: 'Parental leave block 2 of 4.' },
    { p: 'p17', type: 'compass',from: '2026-06-15', to: '2026-06-17', status: 'approved', note: '' }
  ];

  function buildRequests() {
    const out = [];
    let n = 1;
    const id = function () { return 'r' + String(n++).padStart(3, '0'); };

    /* Nobody may be booked twice over the same days — the app treats that as
       a blocked request, so the seed must never contain one. */
    const held = {};
    function free(personId, from, to) {
      return !(held[personId] || []).some(function (h) { return h[0] <= to && from <= h[1]; });
    }
    function hold(personId, from, to) {
      (held[personId] = held[personId] || []).push([from, to]);
    }

    /* Nothing can have been asked for in the future. */
    function askedOn(from, back) {
      const d = shiftDate(from, -back);
      return d > TODAY ? shiftDate(TODAY, -(1 + back % 9)) : d;
    }

    FIXED.forEach(function (f) {
      out.push({
        id: id(), personId: f.p, type: f.type, from: f.from, to: f.to,
        halfStart: false, halfEnd: false, note: f.note || '',
        status: f.status,
        submitted: askedOn(f.from, 21 + (out.length * 3) % 30),
        decidedBy: f.status === 'pending' ? null : (PEOPLE.filter(function (x) { return x.id === f.p; })[0] || {}).manager || 'p01',
        decidedAt: f.status === 'pending' ? null : askedOn(f.from, 14),
        decisionNote: f.decisionNote || ''
      });
      if (f.status !== 'declined') hold(f.p, f.from, f.to);
    });

    // A believable history for the year already gone, so balances are not
    // all sitting at full entitlement in September.
    const r = rng(20260917);
    const windows = [
      ['2026-01-05', 4], ['2026-02-09', 3], ['2026-02-16', 5], ['2026-03-23', 4],
      ['2026-04-13', 5], ['2026-04-27', 2], ['2026-05-11', 3], ['2026-06-08', 5],
      ['2026-06-22', 4], ['2026-07-06', 5], ['2026-07-20', 5], ['2026-08-03', 5],
      ['2026-08-17', 4], ['2026-08-24', 3], ['2026-09-07', 2]
    ];
    /* Working days in a span, so the generator can keep every person inside
       their own allowance — the app treats an overdrawn balance as blocked. */
    const HOL = {};
    HOLIDAYS.forEach(function (h) { HOL[h.date] = 1; });
    function wdays(from, to) {
      let d = from, c = 0;
      while (d <= to) {
        const w = new Date(d + 'T00:00:00Z').getUTCDay();
        if (w !== 0 && w !== 6 && !HOL[d]) c++;
        d = shiftDate(d, 1);
      }
      return c;
    }

    /* Whatever the fixed requests already committed comes off first. */
    const spent = {};
    PEOPLE.forEach(function (p) { spent[p.id] = 0; });
    out.forEach(function (rq) {
      if (rq.status === 'declined' || rq.type !== 'annual') return;
      spent[rq.personId] += wdays(rq.from, rq.to);
    });

    PEOPLE.forEach(function (p, pi) {
      /* By the middle of September most people should be two thirds of the
         way through their year, not sitting on an untouched allowance —
         but nobody may end up overdrawn. */
      const allowance = p.entitlement + p.carry;
      const target = allowance * (0.55 + r() * 0.16);
      const used = {};
      for (let k = 0; k < 9; k++) {
        if (spent[p.id] >= target) break;
        let w = Math.floor(r() * windows.length), guard = 0;
        while (used[w] && guard++ < 20) w = Math.floor(r() * windows.length);
        used[w] = true;
        const start = nextMonday(shiftDate(windows[w][0], Math.floor(r() * 3)));
        const len = Math.max(1, Math.min(windows[w][1], 2 + Math.floor(r() * windows[w][1])));
        const end = shiftDate(start, len - 1);
        if (end >= TODAY) continue;
        if (!free(p.id, start, end)) continue;
        const kind = r() < 0.08 ? 'sick' : (r() < 0.12 ? 'toil' : 'annual');
        const cost = wdays(start, end);
        if (kind === 'annual' && spent[p.id] + cost > allowance - 3) continue;
        hold(p.id, start, end);
        if (kind === 'annual') spent[p.id] += cost;
        out.push({
          id: id(), personId: p.id, type: kind,
          from: start, to: end, halfStart: false, halfEnd: r() < 0.12,
          note: '', status: 'approved',
          submitted: shiftDate(start, -(20 + Math.floor(r() * 30))),
          decidedBy: p.manager || 'p01', decidedAt: shiftDate(start, -(10 + Math.floor(r() * 8))),
          decisionNote: ''
        });
      }
      // A few forward bookings beyond the fixed set.
      if (r() < 0.45 && pi % 3 !== 0) {
        const start = nextMonday(shiftDate('2026-10-05', Math.floor(r() * 80)));
        const len = 1 + Math.floor(r() * 5);
        if (!free(p.id, start, shiftDate(start, len - 1))) return;
        if (spent[p.id] + wdays(start, shiftDate(start, len - 1)) > allowance) return;
        spent[p.id] += wdays(start, shiftDate(start, len - 1));
        hold(p.id, start, shiftDate(start, len - 1));
        out.push({
          id: id(), personId: p.id, type: 'annual', from: start, to: shiftDate(start, len - 1),
          halfStart: false, halfEnd: false, note: '',
          status: r() < 0.55 ? 'approved' : 'pending',
          submitted: shiftDate(TODAY, -Math.floor(r() * 25)),
          decidedBy: null, decidedAt: null, decisionNote: ''
        });
      }
    });
    return out;
  }

  return {
    POLICY: POLICY,
    DEPARTMENTS: DEPARTMENTS,
    LEAVE_TYPES: LEAVE_TYPES,
    HOLIDAYS: HOLIDAYS,
    BLACKOUTS: BLACKOUTS,
    PEOPLE: PEOPLE,
    TODAY: TODAY,
    DEMO_PINS: DEMO_PINS,
    buildRequests: buildRequests
  };
})();
