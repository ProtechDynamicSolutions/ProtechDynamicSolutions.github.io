<style>
:root{
  --brand:#00A66E;
  --green:#00875A;
  --gold-strong:#B08D2E;
  --gold:#8A6A12;
  --amber:#FEC010;
  --mint:#E6F4EF;
  --ink:#231F20;
  --muted:#56635E;
  --bg:#F4F7F5;
  --surface:#FFFFFF;
  --line:#D6E3DD;
  --head:Cambria,"Cambria Math",Georgia,"Times New Roman",serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);overflow-x:hidden}
h1,h2,h3{font-family:var(--head);line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
a{color:var(--green)}
[hidden]{display:none!important}

.band{position:relative;background:var(--brand);color:#fff;padding:14px 16px 26px;overflow:hidden}
.band::after{content:"";position:absolute;right:0;bottom:0;width:min(46%,400px);height:12px;background:var(--gold-strong);clip-path:polygon(18px 0,100% 0,100% 100%,0 100%)}
.band-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.logo img{display:block;height:46px;width:auto}
.title{display:flex;align-items:center;gap:14px;flex:1 1 280px;min-width:0;border-left:2px solid var(--amber);padding-left:16px;flex-wrap:wrap}
.title h1{margin:0;font-size:1.9rem}
.title .sub{font-size:1.05rem;opacity:.95}
@media (max-width:600px){.logo img{height:36px}.title{flex-basis:100%;border-left:0;padding-left:0}.title h1{font-size:1.55rem}}

main{max-width:1180px;margin:0 auto;padding:18px 16px 32px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.t{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:44px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:8px 14px;min-height:44px;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--green);border-color:var(--line)}
.btn.small{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--ink)}

.where{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.where label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);flex:1 1 240px}
.where select{width:100%}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin:16px 0 12px}
.tile{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:64px;font-weight:700;line-height:1.2}
.tile svg{flex:0 0 auto;width:30px;height:30px;color:var(--green)}
.tile .n{display:block;font-weight:400;font-size:.82rem;color:var(--muted);margin-top:2px}
.tile[aria-pressed="true"]{border-color:var(--brand);background:var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.92rem;color:var(--muted);min-height:40px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 360px}.mapcol{position:sticky;top:12px;order:2}}
.mapcol .box{padding:10px}
.mapcol svg{display:block;width:100%;height:auto;max-height:440px}
@media (max-width:959px){.mapcol svg{max-height:300px}}
.cty{fill:#EAF0ED;stroke:#B5C9C0;stroke-width:1px;vector-effect:non-scaling-stroke}
.pin{cursor:pointer}
.lead{stroke:var(--muted);stroke-width:1px;vector-effect:non-scaling-stroke}
.dot{fill:var(--brand);stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.dot.on{fill:var(--amber);stroke:var(--ink)}
.pnum{fill:#fff;font-weight:700;font-family:var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .dot.on + .pnum{fill:var(--ink)}
.home{fill:var(--gold-strong);stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.mapcap{margin:2px 4px 6px;font-weight:700;font-size:.9rem;color:var(--muted)}
.more{margin-top:4px}
.count{margin:0 0 10px;font-weight:700}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;scroll-margin-top:12px}
.card.on{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.card h3{margin:0;font-size:1.3rem;color:var(--green)}
.card .where2{font-size:.92rem;color:var(--muted);margin:2px 0 8px}
.card .where2 b{color:var(--ink)}
.card p{margin:0 0 8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--mint);color:var(--green)}
.badge.gold{background:#FBF1D2;color:var(--gold)}
.badge.pick{background:var(--amber);color:var(--ink)}
.card.pick{border-color:var(--amber);border-width:2px}
.facts{font-size:.9rem;color:var(--muted);margin-bottom:10px}
.facts span + span::before{content:" \00b7\00a0"}
.rank{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--ink);font-weight:700;font-size:.85rem;margin-right:8px;vertical-align:3px}
.far{margin:6px 0 0;font-weight:700;color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:30px 16px}

/* distances */
function km(a, b) {
  const r = Math.PI / 180, h = Math.sin((b[0] - a[0]) * r / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}
function howFar(d, town) {
  if (d < 2) { const m = Math.max(5, Math.round(d * 1.3 / 5 * 60 / 5) * 5); return `${m} min walk`; }
  const road = d * 1.3, mins = Math.round(road / 60 * 60 / 5) * 5;
  return `${Math.round(road)} km, about ${mins < 60 ? mins + ' min' : Math.floor(mins / 60) + ' hr' + (mins % 60 ? ' ' + mins % 60 + ' min' : '')} by road`;
}

const musicTonight = p => p.m === 'nightly' || (Array.isArray(p.m) && p.m.includes(today));

const TESTS = {
  tonight: musicTonight, oldest: p => !!p.y, locals: p => p.tag.includes('locals'), rainy: p => p.tag.includes('rainy'),

function results() {
  let r = ITEMS.filter(p => (!S.cat || p.cat.includes(S.cat)) && Object.keys(S.f).filter(k => S.f[k]).every(k => TESTS[k](p)));
  const o = origin();
  r = r.map(p => ({ p, d: o ? km(o, [p.la, p.lo]) : null }));
  if (S.f.oldest) r.sort((a, b) => a.p.y - b.p.y);
  else if (S.f.top || (CFG.votes && !o)) r.sort((a, b) => votes(b.p) - votes(a.p));
  // JOR's pick for the town comes first for anyone staying there, then nearest first
  else if (o) r.sort((a, b) => (isPick(b.p) - isPick(a.p)) || a.d - b.d);

/* map */
const PROJ = GEO.proj;
const xy = (la, lo) => [((lo - PROJ.LON0) * PROJ.K * PROJ.S).toFixed(1), ((PROJ.LAT1 - la) * PROJ.S).toFixed(1)];

const BASEMAP = COUNTIES.map(n => `<path class="cty" d="${GEO.counties[n].d}" fill-rule="evenodd"/>`).join('');
// With a town chosen the map closes in on the pins being listed, numbered as in the list;
// otherwise it shows the whole island with a plain pin for each.
function drawMap(shown, numbered, zoom) {
  const o = origin();
  const pts = shown.map(({ p }) => xy(p.la, p.lo).map(Number));
  let vx = 0, vy = 0, vw = GEO.w, vh = GEO.h;
  if (zoom && o) {
    const all = pts.concat([xy(o[0], o[1]).map(Number)]);
    let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0])), y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
    const ar = GEO.w / GEO.h, min = 5;              // never closer than about 7 km across
    let w = Math.max(x1 - x0, min) * 1.35, h = Math.max(y1 - y0, min) * 1.35;
    if (w / h > ar) h = w / ar; else w = h * ar;
    vx = (x0 + x1) / 2 - w / 2; vy = (y0 + y1) / 2 - h / 2; vw = w; vh = h;
  }
  const r = vw * (zoom ? .032 : .013), fs = r * 1.15;
  // pins that would sit on top of each other (pubs on the same street) fan out in a small ring,
  // each with a thin line back to its real spot, so every number can be read and tapped
  const at = pts.map(p => p.slice()), groups = [];
  pts.forEach((p, i) => { const g = groups.find(g => Math.hypot(g.x - p[0], g.y - p[1]) < r * 2.4); if (g) { g.ids.push(i); g.x = (g.x * (g.ids.length - 1) + p[0]) / g.ids.length; g.y = (g.y * (g.ids.length - 1) + p[1]) / g.ids.length; } else groups.push({ x: p[0], y: p[1], ids: [i] }); });
  let leaders = '';
  for (const g of groups) if (g.ids.length > 1) {
    const R = r * (g.ids.length > 6 ? 3.6 : 2.6);
    g.ids.forEach((id, k) => { const a = -Math.PI / 2 + k * 2 * Math.PI / g.ids.length; at[id] = [g.x + R * Math.cos(a), g.y + R * Math.sin(a)]; leaders += `<line class="lead" x1="${pts[id][0]}" y1="${pts[id][1]}" x2="${at[id][0].toFixed(2)}" y2="${at[id][1].toFixed(2)}"/>`; });
  }
  let h = `<svg viewBox="${vx.toFixed(2)} ${vy.toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}" role="img" aria-label="${esc(zoom ? `Map of the ${CFG.noun}s near ${originName()}` : `Map of the ${CFG.noun}s shown`)}">${BASEMAP}`;
  if (o) { const [x, y] = xy(o[0], o[1]).map(Number), s = r * 1.5; h += `<path class="home" d="M${x} ${y - s}L${x + s * .3} ${y - s * .38}L${x + s * .95} ${y - s * .3}L${x + s * .48} ${y + s * .14}L${x + s * .6} ${y + s * .8}L${x} ${y + s * .5}L${x - s * .6} ${y + s * .8}L${x - s * .48} ${y + s * .14}L${x - s * .95} ${y - s * .3}L${x - s * .3} ${y - s * .38}Z"><title>${esc(here ? 'You are here' : 'Staying in ' + S.stay)}</title></path>`; }
  h += leaders;
  shown.forEach(({ p }, i) => {
    const [x, y] = at[i].map(v => +v.toFixed(2));
    h += `<g class="pin" data-n="${esc(p.n)}"><circle class="dot${picked === p.n ? ' on' : ''}" cx="${x}" cy="${y}" r="${r.toFixed(3)}"/>${numbered ? `<text x="${x}" y="${y}" font-size="${fs.toFixed(3)}" class="pnum">${i + 1}</text>` : ''}<title>${numbered ? (i + 1) + '. ' : ''}${esc(p.n)}, ${esc(p.t)}</title></g>`;
  });
  $('map').innerHTML = `<p class="mapcap">${esc(zoom ? `Near ${originName() === 'you' ? 'you' : originName()}` : 'All of Ireland')}</p>` + h + '</svg>';
}

/* list */
const catName = k => (CFG.cats.find(c => c[0] === k) || [k, k])[1];
const dirs = p => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n + ', ' + p.t + ', Ireland')}`;
function facts(p) {
  const f = [];
  if (p.y) f.push(p.y < 1000 ? `History traced to about ${p.y} AD` : `Says it dates from ${p.y}`);
  if (p.m) f.push(`Music ${p.m === 'nightly' ? 'every night' : 'on ' + p.m.map(d => DAYS[d]).join(', ')}`);
  if (p.food) f.push('Food served');
  if (p.h) f.push(`Allow ${p.h}`);
  if (CFG.votes) f.push(`${votes(p)} votes from past tours`);
  return f.map(x => `<span>${esc(x)}</span>`).join('');
}
function card({ p, d }, i, numbered) {
  const badges = p.cat.map(k => `<span class="badge">${esc(catName(k))}</span>`)
    .concat(p.tag.map(k => ({ locals: "Locals' favourite", rainy: CFG.votes ? 'Good for a rainy day' : 'Good for a rainy afternoon', easy: 'Easy walking', gem: 'Hidden gem' }[k])).filter(Boolean).map(t => `<span class="badge gold">${esc(t)}</span>`));
  if (p.m && musicTonight(p)) badges.unshift('<span class="badge gold">Music tonight</span>');
  if (p.pick) badges.unshift(`<span class="badge pick">JOR's pick in ${esc(p.t)}</span>`);
  const rank = numbered ? `<span class="rank">${i + 1}</span>` : '';
  return `<article class="card${picked === p.n ? ' on' : ''}${p.pick ? ' pick' : ''}" data-n="${esc(p.n)}">
    <h3>${rank}${esc(p.n)}</h3>
    <div class="where2"><b>${esc(p.t)}</b>, County ${esc(p.c)}${d != null ? ` &middot; ${esc(howFar(d))}${here ? ' from you' : ''}` : ''}</div>
    <p>${esc(p.b)}</p>
    <div class="badges">${badges.join('')}</div>
    <div class="facts">${facts(p)}</div>
    <div class="row"><a class="btn small" href="${dirs(p)}" target="_blank" rel="noopener">Directions</a>${CFG.votes ? `<button class="btn ghost small" data-vote="${esc(p.n)}" aria-pressed="${!!S.mine[p.n]}" type="button">${S.mine[p.n] ? 'You loved it' : 'We loved it'}</button>` : ''}</div>
  </article>`;
}
const NEAR_KM = 40;
let showFar = false;
const plural = n => `${n} ${CFG.noun}${n === 1 ? '' : 's'}`;
function render() {
  const r = results(), o = origin();
  // with a town chosen and nearest-first order, the list and map keep to that area; the rest wait behind "Show more"
  const local = !!o && !S.f.oldest && !S.f.top;
  let near = local ? r.filter(x => x.d <= NEAR_KM) : r, far = local ? r.filter(x => x.d > NEAR_KM) : [];
  const none = local && !near.length && r.length;
  if (none) { near = r.slice(0, 5); far = r.slice(5); }
  const numbered = local || (CFG.votes && (S.f.top || !o));
  // counts on the tiles follow the filters and the area, so a guest never taps into nothing
  $('tiles').innerHTML = CFG.cats.map(([k, label]) => {
    const n = ITEMS.filter(p => p.cat.includes(k) && Object.keys(S.f).filter(f => S.f[f]).every(f => TESTS[f](p)) && (!local || km(o, [p.la, p.lo]) <= NEAR_KM)).length;
    return `<button class="tile" type="button" data-cat="${k}" aria-pressed="${S.cat === k}">${icon(k)}<span>${esc(label)}<span class="n">${plural(n)}${local ? ' nearby' : ''}</span></span></button>`;
  }).join('');
  $('chips').innerHTML = CFG.filters.map(([k, label]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${!!S.f[k]}">${esc(label)}</button>`).join('');
  const what = S.cat ? ' for ' + catName(S.cat).toLowerCase() : '';
  const place = originName() === 'you' ? 'you' : originName();
  $('count').textContent = !r.length ? '' : none ? `Nothing${what} within ${NEAR_KM} km of ${place}, so here are the nearest` :
    local ? `${plural(near.length)}${what} within ${NEAR_KM} km of ${place}, nearest first` :
    `${plural(r.length)}${what}${S.f.oldest ? ', oldest first' : S.f.top || CFG.votes ? ', most votes first' : ''}`;
  let html = near.map((x, i) => card(x, i, numbered)).join('');
  if (far.length) html += showFar ? '<p class="far">Further afield</p>' + far.map((x, i) => card(x, near.length + i, numbered)).join('')
    : `<button class="btn ghost more" id="more" type="button">Show ${plural(far.length)} further afield</button>`;
  $('list').innerHTML = html || `<div class="box empty"><h2>Nothing matches all of that</h2><p class="muted">Try taking off a filter.</p><button class="btn ghost" id="clear" type="button">Clear the filters</button></div>`;
  drawMap(showFar ? near.concat(far) : near, numbered, local && !showFar);
}

/* events */
$('stay').innerHTML = `<option value="">Anywhere in Ireland</option>` + Object.keys(BASES).sort().map(t => `<option${t === S.stay ? ' selected' : ''}>${esc(t)}</option>`).join('');
$('stay').addEventListener('change', e => { S.stay = e.target.value; here = null; showFar = false; picked = null; $('near').setAttribute('aria-pressed', 'false'); save(); render(); });
$('near').addEventListener('click', () => {
  showFar = false; picked = null;
  if (here) { here = null; $('near').setAttribute('aria-pressed', 'false'); render(); return; }
  if (!navigator.geolocation) { toast('This browser cannot share your location. Pick a town instead.'); return; }
  $('near').textContent = 'Finding you...';
  navigator.geolocation.getCurrentPosition(pos => {
    here = { ll: [pos.coords.latitude, pos.coords.longitude] };
    $('near').textContent = 'Use where I am'; $('near').setAttribute('aria-pressed', 'true'); $('stay').value = ''; S.stay = ''; save(); render();
  }, () => { $('near').textContent = 'Use where I am'; toast('Location was not shared. Pick the town you are staying in instead.'); }, { timeout: 10000, maximumAge: 300000 });
});
$('tiles').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; S.cat = S.cat === b.dataset.cat ? '' : b.dataset.cat; showFar = false; save(); render(); });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  const k = b.dataset.f; S.f[k] = !S.f[k]; showFar = false;
  if (S.f[k] && (k === 'oldest' || k === 'top')) for (const x of ['oldest', 'top']) if (x !== k) S.f[x] = false;
  save(); render();
});
$('list').addEventListener('click', e => {
  if (e.target.id === 'clear') { S.f = {}; S.cat = ''; save(); render(); return; }
  if (e.target.id === 'more') { showFar = true; render(); return; }
  const v = e.target.closest('[data-vote]');
  if (v) { const n = v.dataset.vote; S.mine[n] = !S.mine[n]; save(); render(); if (S.mine[n]) toast('Thank you. Your vote helps the next group.'); return; }
  const c = e.target.closest('.card'); if (c && !e.target.closest('a,button')) { picked = c.dataset.n; render(); }
});
$('map').addEventListener('click', e => {
  const d = e.target.closest('[data-n]'); if (!d) return;
  picked = d.dataset.n; render();
  const c = [...document.querySelectorAll('.card')].find(x => x.dataset.n === picked);
  if (c) c.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
});
let tt = 0;
function toast(m) { $('toast').textContent = m; $('toast').hidden = false; clearTimeout(tt); tt = setTimeout(() => { $('toast').hidden = true; }, 5000); }
render();
})();
</script>
</body>
</html>
