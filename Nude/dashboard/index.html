<style>
html,body{margin:0;height:100%;background:#4a3530;color:#f3e8e0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;box-sizing:border-box}
.m{width:190px;max-width:60vw;animation:b 1.6s ease-in-out infinite alternate}
@keyframes b{from{opacity:.55}to{opacity:1}}
form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}
input{height:46px;border-radius:12px;border:1px solid #6a514a;background:#5a423b;color:#f3e8e0;padding:0 14px;font:inherit;text-align:center;letter-spacing:.05em}
input:focus{outline:2px solid #c48d81}
button{height:46px;border-radius:999px;border:0;background:#f3e8e0;color:#4a3530;font:500 15px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:20px;text-align:center;font-size:14px;opacity:.75}
#msg.bad{color:#c0574c;opacity:1}
</style>
