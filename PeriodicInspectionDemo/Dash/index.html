.btn-a{ background:var(--c2); color:#fff; box-shadow:0 4px 14px rgba(18,180,140,.32); } .btn-a:hover{ filter:brightness(1.07); }

const fmtDate = (iso) => { if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-IE',{day:'2-digit',month:'short',year:'numeric'}); };
const monthKey = (iso) => (iso || '').slice(0,7);
const monthLabel = (k) => { const [y,m] = k.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m,10)-1] + ' ' + y.slice(2); };
const downloadBlob = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); };
const hexToRgb = (h) => { h=(h||'#0f172a').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const luminance = (h) => { const [r,g,b]=hexToRgb(h); return (0.299*r+0.587*g+0.114*b)/255; };
const textOn = (h) => luminance(h) > 0.6 ? '#0f172a' : '#ffffff';
const argb = (h) => 'FF' + (h||'#0f172a').replace('#','').toUpperCase();
const safeName = (s) => String(s || 'record').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'record';
/* Map popups are built as HTML strings, and site names come from whatever was
   typed on site, so they get escaped before going anywhere near innerHTML. */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC_MAP[c]);
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
function fitBox(natW, natH, maxW, maxH){ if(!natW || !natH) return {w:maxW,h:maxH}; const r = Math.min(maxW/natW, maxH/natH); return { w:natW*r, h:natH*r }; }
function addInterval(dateStr, value, unit){
  const n = parseFloat(value);
  if(!dateStr || !n || isNaN(n)) return '';
  const d = new Date(dateStr); if(isNaN(d)) return '';
  if(unit === 'months') d.setMonth(d.getMonth() + Math.round(n)); else d.setFullYear(d.getFullYear() + Math.round(n));

}

const pirQFlat = () => PIR_Q.reduce((a,g)=> a.concat(g.items.map(i=>i[0])), []);

/* Signed off = every check answered, a condition recorded, and a signature. */
function isSignedOff(job){
  const a = audit(job);
  return a.unanswered.length === 0 && !!(job.pir || {}).condition && !!((job.sig || {}).sig);
}

function audit(job){
  const p = job.pir || {};
  const q = p.q || {};
  const nums = pirQFlat();
  const unanswered = nums.filter(n => !q['q'+n]);
  const nos = nums.filter(n => q['q'+n] === 'No');
  const obs = (p.obs || []).filter(o => (o.comment||'').trim());
  const urgent = obs.filter(o => o.code === '1');
  return { unanswered, nos, obs, urgent, answered: nums.length - unanswered.length, total: nums.length,
    condition: urgent.length ? 'Unsatisfactory' : (p.condition || ''),
    nextDue: addInterval(job.date, p.intervalValue, p.intervalUnit) };
}

/* ================= API (read only) ================= */
/* Same reasoning as the inspection app: an Apps Script web app has to be
   published as "Anyone", so a key written into this file would be readable by
   anyone who opens the page. The view code is typed once and kept in the
   browser instead. It is read only — it cannot change or delete a thing. */
const store = {
  get(k, fb){ try{ const v = localStorage.getItem('ppid_' + k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem('ppid_' + k, JSON.stringify(v)); }catch(e){} }
};
const API = {
  url: BRAND.apiUrl || '',

  company: (BRAND.companyCode || 'default').toLowerCase() + (DEMO ? '-demo' : ''),
  get configured(){ return !!this.url; },
  get on(){ return !!(this.url && this.key); },
  saveKey(k){ this.key = k; store.set('viewKey', k); },
  forget(){ this.key = ''; store.set('viewKey', ''); },
  async call(action, payload){
    const res = await fetch(this.url, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ key:this.key, company:this.company, action, payload: payload || {} })
    });
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Request failed');
    return json.data;
  }
};
API.key = store.get('viewKey', '') || (BRAND.viewKey || '');

/* Demo records are signed so the sample reports carry a signature block.
   The squiggle is drawn from the id, so it is stable per record. */
function demoSignature(seedStr){
  const c = document.createElement('canvas');
  c.width = 260; c.height = 90;
  const x = c.getContext('2d');
  let s = 7;
  for(let i = 0; i < seedStr.length; i++) s = (s*31 + seedStr.charCodeAt(i)) % 2147483647;
  const rnd = () => { s = (s*1103515245 + 12345) % 2147483648; return s/2147483648; };
  x.strokeStyle = '#0f172a'; x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath();
  let px = 18, py = 62;
  x.moveTo(px, py);
  for(let i = 0; i < 6; i++){
    const nx = px + 26 + rnd()*14, ny = 50 + rnd()*20;
    x.bezierCurveTo(px + 8 + rnd()*14, py - 28 - rnd()*18, px + 18 + rnd()*14, py + 8 + rnd()*16, nx, ny);
    px = nx; py = ny;
  }
  x.stroke();
  return c.toDataURL('image/png');
}

function makeDemoJobs(n = 58){
  /* Deterministic, so the same demo shown twice looks identical. */
  let seed = 20260810;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const jobs = [];
  for(let i = 0; i < n; i++){
    const site = DEMO_SITES[i % DEMO_SITES.length];
    const j = blankJob();
    const d = new Date();
    d.setDate(d.getDate() - Math.floor(rnd() * 640));
    j.id = 'demo-' + i;
    j.date = d.toISOString().slice(0,10);
    j.prNo = 'PR-' + (2400 + i);
    j.customerName = site[0];
    j.address = site[1];
    j.lat = site[4]; j.lng = site[5];
    j.inspector = pick(DEMO_INSPECTORS);
    const p = j.pir;
    p.category = site[2]; p.reason = site[3]; p.occupant = site[0];
    p.occupantAttended = rnd() > 0.4 ? 'Yes' : 'No';
    p.approxAge = (5 + Math.floor(rnd()*35)) + ' years';
    p.entireInstall = rnd() > 0.25 ? 'Yes' : 'No';
    if(p.entireInstall === 'No') p.partialDetail = 'Distribution board DB2 and associated final circuits only.';
    p.earthing = rnd() > 0.3 ? 'TNCS' : 'TT';
    p.phase = site[2] === 'Domestic' ? 'Single Phase' : (rnd() > 0.4 ? 'Three Phase' : 'Single Phase');
    p.v1 = String(228 + Math.floor(rnd()*12));
    if(p.phase === 'Three Phase'){ p.v2 = String(228+Math.floor(rnd()*12)); p.v3 = String(228+Math.floor(rnd()*12)); p.v12='400'; p.v23='400'; p.v31='400'; }
    p.pscc = String(1 + Math.floor(rnd()*6)) + '.2';
    p.mainIsolation = pick(['Switch Fuse','MCB','MCCB']);
    p.nominalRating = pick(['63','80','100','125']);
    p.minIR = (rnd() > 0.85 ? (0.4 + rnd()*0.5) : (2 + rnd()*198)).toFixed(1);
    p.maxRp = (0.05 + rnd()*0.5).toFixed(2);
    p.maxZs = (0.2 + rnd()*1.2).toFixed(2);
    p.zsDeviceType = pick(['B','C']); p.zsDeviceSize = pick(['16A','20A','32A','40A']);
    p.workmanship = rnd() > 0.75 ? 'Very Good' : (rnd() > 0.15 ? 'Satisfactory' : 'Poor');
    p.instContinuity = 'MFT-' + (1000 + Math.floor(rnd()*900));
    p.instIR = p.instContinuity; p.instLoop = p.instContinuity; p.instRcd = p.instContinuity;
    p.q17type = rnd() > 0.2 ? 'Mcb' : 'Fuse';
    p.rcds = [
      { id: uid(), desc:'Sockets', trip:'30', time:String(20 + Math.floor(rnd()*40)) },
      { id: uid(), desc:'Lighting', trip:'30', time:String(20 + Math.floor(rnd()*40)) }
    ];
    if(rnd() > 0.85) p.rcds.push({ id: uid(), desc:'External supply', trip:'30', time:String(310 + Math.floor(rnd()*60)) });

    /* A weighted set of "usual suspects" so the failed-question chart tells a story. */
    const common = [15,22,10,26,2,19,25,11];
    const failCount = Math.floor(rnd()*4);
    const failing = [];
    for(let f = 0; f < failCount; f++) failing.push(rnd() > 0.35 ? pick(common) : pick(pirQFlat()));
    pirQFlat().forEach(nq => { p.q['q'+nq] = failing.indexOf(nq) > -1 ? 'No' : (rnd() > 0.94 ? 'N/A' : 'Yes'); });

    p.obs = [];
    const obsN = failCount + (rnd() > 0.6 ? 1 : 0);
    for(let o = 0; o < obsN; o++){
      const src = pick(DEMO_OBS);
      p.obs.push({ id: uid(), ref: String(o+1), comment: src[0], code: src[1] });
    }
    p.noRemedial = p.obs.length ? 'The following observations are made' : 'No remedial work is required';
    /* Mixed intervals so the demo shows a realistic spread of sites overdue,
       falling due soon, and comfortably in date. */
    p.intervalValue = site[2] === 'Domestic' ? '10' : pick(['1','2','3']);
    p.intervalUnit = 'years';
    p.condition = p.obs.some(o => o.code === '1') ? 'Unsatisfactory' : (rnd() > 0.12 ? 'Satisfactory' : 'Unsatisfactory');
    p.certifierNo = 'CN-' + (700 + Math.floor(rnd()*200));
    j.sig = { name: j.inspector, sig: demoSignature(j.id + j.inspector), date: j.date };
    j.createdAt = j.updatedAt = new Date(j.date).toISOString();
    jobs.push(j);
  }
  return jobs.sort((a,b) => (b.date||'').localeCompare(a.date||''));
}

/* ================= ANALYTICS ================= */
function analyse(jobs){
  const total = jobs.length;
  let sat = 0, unsat = 0, obsAll = [], urgent = 0;
  const byMonth = {}, byCat = {}, byInspector = {}, byCode = {'1':0,'2':0,'3':0,'4':0}, qFail = {}, sites = {};
  jobs.forEach(j => {
    const a = audit(j), p = j.pir || {};
    if(a.condition === 'Satisfactory') sat++;
    else if(a.condition === 'Unsatisfactory') unsat++;
    urgent += a.urgent.length;
    a.obs.forEach(o => { obsAll.push({ job:j, obs:o }); byCode[o.code] = (byCode[o.code]||0) + 1; });
    const mk = monthKey(j.date);
    if(mk){
      if(!byMonth[mk]) byMonth[mk] = { total:0, sat:0, unsat:0 };
      byMonth[mk].total++;
      if(a.condition === 'Satisfactory') byMonth[mk].sat++; else if(a.condition === 'Unsatisfactory') byMonth[mk].unsat++;
    }
    const cat = p.category || 'Unspecified';
    byCat[cat] = (byCat[cat]||0) + 1;
    const insp = j.inspector || (j.sig||{}).name || 'Unassigned';
    if(!byInspector[insp]) byInspector[insp] = { n:0, obs:0 };
    byInspector[insp].n++; byInspector[insp].obs += a.obs.length;
    a.nos.forEach(n => { qFail[n] = (qFail[n]||0) + 1; });
    const key = j.customerName || 'Unnamed site';
    if(!sites[key]) sites[key] = { count:0, lat:null, lng:null };
    sites[key].count++;
    const la = parseFloat(j.lat), ln = parseFloat(j.lng);
    if(!isNaN(la) && !isNaN(ln)){ sites[key].lat = la; sites[key].lng = ln; }
    /* Site-level facts always come from the most recent visit. */
    if(!sites[key].date || (j.date||'') > (sites[key].date||'')){
      Object.assign(sites[key], { date:j.date, nextDue:a.nextDue, condition:a.condition, urgent:a.urgent.length, address:j.address, job:j });
    }
  });

  /* Last 12 months, including quiet ones, so the trend line does not lie.
     Built from year/month directly: toISOString() would shift a month backwards
     during summer time and produce a duplicated bucket. */
  const months = [];
  const now = new Date();
  for(let i = 11; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    months.push(Object.assign({ key:k, label: monthLabel(k) }, byMonth[k] || { total:0, sat:0, unsat:0 }));
  }

  const today = todayInput();
  const due = Object.keys(sites).map(k => Object.assign({ site:k }, sites[k]))
    .filter(s => s.nextDue)
    .map(s => Object.assign({}, s, { days: daysBetween(today, s.nextDue) }))
    .sort((a,b) => a.days - b.days);

  const topQ = Object.keys(qFail).map(n => ({ n: Number(n), count: qFail[n], text: Q_TEXT[n] || ('Question ' + n) }))
    .sort((a,b) => b.count - a.count).slice(0, 8);

  const mapPoints = Object.keys(sites)
    .filter(k => sites[k].lat !== null && sites[k].lng !== null)
    .map(k => Object.assign({ site:k }, sites[k]));

  return {
    total, sat, unsat, urgent,
    obsTotal: obsAll.length, obsAll,
    satRate: pct(sat, sat + unsat),
    months, byCat, byInspector, byCode, topQ,
    mapPoints, mapMissing: Object.keys(sites).length - mapPoints.length,
    sites: Object.keys(sites).length,
    due, overdue: due.filter(d => d.days < 0), due90: due.filter(d => d.days >= 0 && d.days <= 90),
    avgObs: total ? (obsAll.length / total).toFixed(1) : '0.0'
  };
}

/* ---- Site map ----
   A real map: OpenStreetMap tiles through Leaflet, with each site plotted from
   the coordinates the electrician captured at the board. The dashboard already
   loads React and ExcelJS from a CDN, so a tile layer costs nothing extra
   architecturally. If Leaflet or the tiles cannot be reached, the markers still
   draw on a plain background and the panel says so. */
function SiteMap({points, onPick}){
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const pickRef = useRef(onPick);
  pickRef.current = onPick;
  const [tilesFailed, setTilesFailed] = useState(false);

  const colorOf = (p) => p.urgent > 0 ? '#dc2626'
    : p.condition === 'Unsatisfactory' ? '#f97316'
    : p.condition === 'Satisfactory' ? '#059669' : '#94a3b8';

  useEffect(() => {
    if(!window.L || !elRef.current || mapRef.current) return;
    const map = window.L.map(elRef.current, { scrollWheelZoom:false, attributionControl:true });
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).on('tileerror', () => setTilesFailed(true)).addTo(map);
    map.setView([53.35, -7.9], 7);
    mapRef.current = map;
    /* Leaflet measures the container on creation; inside a freshly laid-out
       card that measurement can be stale. */
    setTimeout(() => map.invalidateSize(), 60);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  useEffect(() => {
    const map = mapRef.current;
    if(!map) return;
    if(layerRef.current) layerRef.current.remove();
    const group = window.L.layerGroup().addTo(map);
    layerRef.current = group;
    if(!points.length) return;

    const maxCount = Math.max(...points.map(p => p.count));
    points.forEach(p => {
      const r = 7 + Math.sqrt(p.count / maxCount) * 9;
      const m = window.L.circleMarker([p.lat, p.lng], {
        radius: r, color: '#fff', weight: 2, fillColor: colorOf(p), fillOpacity: 0.9
      }).addTo(group);
      m.bindTooltip(p.site, { direction:'top', offset:[0,-6] });
      m.bindPopup(
        '<div style="font:600 13px Inter,sans-serif;color:#0f172a">' + esc(p.site) + '</div>' +
        '<div style="font:400 11.5px Inter,sans-serif;color:#64748b;margin-top:2px">' + esc(p.address || '') + '</div>' +
        '<div style="font:400 11.5px Inter,sans-serif;color:#334155;margin-top:6px">' +
          p.count + ' inspection' + (p.count===1?'':'s') + ' · last ' + fmtDate(p.date) + '</div>' +
        '<div style="font:700 11.5px Inter,sans-serif;margin-top:4px;color:' + colorOf(p) + '">' +
          esc(p.condition || 'Not rated') + (p.urgent ? ' · ' + p.urgent + ' urgent' : '') + '</div>' +
        '<div style="font:600 11.5px Inter,sans-serif;margin-top:8px;color:#1b3bc7;cursor:pointer" data-open="1">Open record →</div>'
      );
      m.on('popupopen', (e) => {
        const link = e.popup.getElement().querySelector('[data-open]');
        if(link) link.onclick = () => pickRef.current && pickRef.current(p.job);
      });
    });

    /* Re-measure before fitting. This effect can run before the card has
       finished laying out, and fitting against a stale container size leaves the
       pins clustered in a corner. */
    map.invalidateSize();
    const bounds = window.L.latLngBounds(points.map(p => [p.lat, p.lng]));
    map.fitBounds(bounds, { padding:[40,40], maxZoom: points.length === 1 ? 14 : 13 });
  }, [points]);

  if(!window.L){
    return <p className="text-sm text-slate-400">The map library could not be loaded. Check the connection and refresh.</p>;
  }
  if(!points.length){
    return <p className="text-sm text-slate-400">No coordinates recorded yet. Tap "Use my location" on site and inspections will appear here.</p>;
  }

  return (<div>
    <div ref={elRef} style={{ height:'440px', width:'100%', borderRadius:'12px', zIndex:0 }}
      className="border border-slate-200"/>
    {tilesFailed && (
      <p className="text-xs text-amber-700 mt-2">
        Map tiles could not be reached, so the background is blank. The pins are still in the right places.
      </p>
    )}
    <div className="flex gap-4 mt-3 text-xs text-slate-500 flex-wrap">
      <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-full inline-block" style={{background:'#059669'}}/>Satisfactory</span>
      <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-full inline-block" style={{background:'#f97316'}}/>Unsatisfactory</span>
      <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-full inline-block" style={{background:'#dc2626'}}/>Urgent finding</span>
      <span className="text-slate-400">Pin size = inspections at that site. Click a pin for the record.</span>
    </div>
  </div>);
}

/* ================= PDF FURNITURE ================= */
/* A gradient band drawn as thin slices, so paper matches the on-screen header.
   jsPDF has no gradient fill of its own. */
function lerp(a, b, t){ return a + (b - a) * t; }
function gradBand(doc, x, y, w, h, stops){
  /* A slim per-page rule does not need as many slices as a full cover band. */
  const N = h > 18 ? 96 : 44;
  for(let i = 0; i < N; i++){
    const t = i / (N - 1);
    let a = stops[0], b = stops[stops.length - 1];
    for(let s = 0; s < stops.length - 1; s++){
      if(t >= stops[s].p && t <= stops[s+1].p){ a = stops[s]; b = stops[s+1]; break; }
    }
    const span = (b.p - a.p) || 1;
    const lt = Math.min(Math.max((t - a.p) / span, 0), 1);
    doc.setFillColor(
      Math.round(lerp(a.c[0], b.c[0], lt)),
      Math.round(lerp(a.c[1], b.c[1], lt)),
      Math.round(lerp(a.c[2], b.c[2], lt))
    );
    doc.rect(x + (w * i / N), y, w / N + 0.4, h, 'F');
  }
}
function brandStops(st){
  const c1 = hexToRgb(st.c1), c2 = hexToRgb(st.c2), c3 = hexToRgb(st.c3);
  return [{p:0, c:c1}, {p:0.38, c:c3}, {p:0.68, c:c2}, {p:1, c:c1}];
}

/* DRAFT on anything not signed off, DEMO on every demo export. */
function stampWatermarks(doc, opts){
  /* One diagonal only. DRAFT wins when both apply: two overlapping stamps made
     the page unreadable, and DRAFT is the more urgent fact on the page. */
  const draft = !!(opts && opts.draft);
  const marks = [];
  if(draft) marks.push({ text:'DRAFT', rgb:[100,116,139], op:0.12 });
  else if(DEMO) marks.push({ text:'DEMO', rgb:[15,23,42], op:0.10 });
  if(!marks.length) return;
  const total = doc.internal.getNumberOfPages();
  for(let i = 1; i <= total; i++){
    doc.setPage(i);
    marks.forEach((m, mi) => {
      let restore = false;
      try{ doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity:m.op })); restore = true; }catch(e){}
      doc.setTextColor(restore ? m.rgb[0] : 226, restore ? m.rgb[1] : 232, restore ? m.rgb[2] : 240);
      doc.setFont('helvetica','bold'); doc.setFontSize(52);
      for(let row = 0; row < 4; row++) doc.text(m.text, 105, 62 + row*62 + mi*22, { align:'center', angle:32 });
      if(restore){ try{ doc.restoreGraphicsState(); }catch(e){} }
    });
    const notes = [];
    if(draft) notes.push('INCLUDES DRAFT RECORDS');
    if(DEMO) notes.push('SAMPLE DATA — NOT A REAL INSPECTION');
    if(notes.length){
      doc.setFont('helvetica','bold'); doc.setFontSize(7);
      doc.setTextColor(DEMO ? 185 : 100, DEMO ? 28 : 116, DEMO ? 28 : 139);
      doc.text(notes.join('     ·     '), 105, 292, { align:'center' });
    }
    doc.setTextColor(15,23,42);
  }
}
const DEMO_XL_NOTE = 'DEMO — SAMPLE DATA, NOT A REAL INSPECTION RECORD';

/* ================= PDF: full periodic report ================= */
/* Renders one inspection into an existing document, so a single PDF can hold
   the whole programme. */
function renderPir(doc, job, st){
  const W = 210, M = 12, BOT = 272;
  const p = job.pir || {};
  const a = audit(job);
  const rgb1 = hexToRgb(st.c1), rgb2 = hexToRgb(st.c2);
  const onC1 = textOn(st.c1) === '#ffffff' ? [255,255,255] : [15,23,42];
  const OHM = 'ohms', MOHM = 'Mohms';

  /* Full banner on the report's first page, a slim rule after that. */
  let firstPage = true;
  const head = () => {
    const stops = brandStops(st);
    if(firstPage){
      firstPage = false;
      gradBand(doc, 0, 0, W, 15, stops);
      let tx = M;
      if(st.logo){
        try{
          const pr = doc.getImageProperties(st.logo);
          const fit = fitBox(pr.width, pr.height, 22, 9);
          const ly = 3 + (9 - fit.h)/2;
          if(st.logoBox !== false){ doc.setFillColor(255,255,255); doc.roundedRect(M-1.2, ly-1.2, fit.w+2.4, fit.h+2.4, 1.2, 1.2, 'F'); }
          doc.addImage(st.logo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, ly, fit.w, fit.h, undefined, 'FAST');
          tx = M + fit.w + 5;
        }catch(e){}
      }
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      doc.text('PERIODIC INSPECTION REPORT', tx, 7.6);
      doc.setFont('helvetica','normal'); doc.setFontSize(6.6);
      doc.text([st.companyName, st.regNo && ('Reg ' + st.regNo)].filter(Boolean).join('   ·   '), tx, 11.6);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
      doc.text(job.prNo || '', W - M, 7.6, { align:'right' });
      doc.setFont('helvetica','normal'); doc.setFontSize(6.6);
      doc.text(fmtDate(job.date), W - M, 11.6, { align:'right' });
      doc.setTextColor(15,23,42);
      return 22;
    }
    gradBand(doc, 0, 0, W, 4, stops);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(120,133,150);
    doc.text((st.companyName || '').toUpperCase() + '   ·   PERIODIC INSPECTION REPORT', M, 9);
    doc.text([job.prNo, fmtDate(job.date)].filter(Boolean).join('   ·   '), W - M, 9, { align:'right' });
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.2); doc.line(M, 11.5, W - M, 11.5);
    doc.setTextColor(15,23,42);
    return 18;
  };

  doc.addPage();
  let y = head();

  /* At-a-glance strip, same as the on-site app produces. */
  const badge = a.condition === 'Unsatisfactory' ? [220,38,38] : a.condition === 'Satisfactory' ? [5,150,105] : [148,163,184];
  doc.setFillColor(248,250,252); doc.roundedRect(M, y - 3, W - M*2, 17, 2, 2, 'F');
  doc.setFillColor(badge[0],badge[1],badge[2]); doc.rect(M, y - 3, 1.6, 17, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(15,23,42);
  doc.text(doc.splitTextToSize(job.customerName || 'Site', 104)[0], M + 5, y + 3);
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(100,116,139);
  doc.text(doc.splitTextToSize(job.address || '', 104)[0], M + 5, y + 8);
  [
    ['CONDITION', a.condition || 'Not recorded', badge],
    ['OBSERVATIONS', String(a.obs.length) + (a.urgent.length ? ' (' + a.urgent.length + ' urgent)' : ''), a.urgent.length ? [220,38,38] : [15,23,42]],
    ['NEXT DUE', fmtDate(a.nextDue) || '—', [15,23,42]]
  ].forEach((f, i) => {
    const fx = M + 116 + i*24;
    doc.setFont('helvetica','bold'); doc.setFontSize(5.2); doc.setTextColor(148,163,184);
    doc.text(f[0], fx, y + 1);
    doc.setFontSize(6.8); doc.setTextColor(f[2][0], f[2][1], f[2][2]);
    doc.text(doc.splitTextToSize(String(f[1]), 23), fx, y + 5.5);
  });
  doc.setTextColor(15,23,42);
  y += 21;
  const room = (need) => { if(y + need > BOT){ doc.addPage(); y = head(); } };
  const tick = (x, yy, on) => {
    doc.setDrawColor(120,133,150); doc.setLineWidth(0.25);
    doc.rect(x, yy - 2.7, 3.4, 3.4);
    if(on){ doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1); doc.text('X', x+0.7, yy+0.1); doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); }
  };
  const opts = (x, yy, list, val) => {
    let cx = x;
    doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(15,23,42);
    list.forEach(o => { doc.text(o, cx, yy); const w = doc.getTextWidth(o); tick(cx + w + 1.5, yy, val === o); cx += w + 9; });
  };
  const line = (label, val, x, yy, w) => {
    doc.setFontSize(7.2); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
    doc.text(label, x, yy);
    const lw = doc.getTextWidth(label);
    doc.setDrawColor(210,218,228); doc.setLineWidth(0.2); doc.line(x + lw + 2, yy + 0.9, x + w, yy + 0.9);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    doc.text(String(val || ''), x + lw + 3.5, yy);
    doc.setFont('helvetica','normal');
  };
  const sect = (t) => {
    room(12);
    doc.setFillColor(240,244,248); doc.rect(M, y-4.2, W - M*2, 6.4, 'F');
    doc.setFillColor(...rgb2); doc.rect(M, y-4.2, 1.6, 6.4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1);
    doc.text(t.toUpperCase(), M + 4, y);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    y += 8;
  };
  const COL2 = 108, HALF = 90;

  sect('Registered contractor');
  line('Name', st.companyName, M, y, 96); line('Reg No.', st.regNo, COL2, y, COL2+HALF); y += 7;
  line('Address', st.address, M, y, 96); line('Phone', st.phone, COL2, y, COL2+HALF); y += 9;

  sect('Installation details');
  line('Occupant / trading as', p.occupant || job.customerName, M, y, 96);
  line('Approx age', p.approxAge, COL2, y, COL2+HALF); y += 7;
  line('Address', job.address, M, y, 96);
  doc.setFontSize(7.2); doc.setTextColor(100,116,139);
  doc.text('Occupant in attendance?', COL2, y);
  doc.setTextColor(15,23,42);
  opts(COL2 + 40, y, ['Yes','No'], p.occupantAttended); y += 9;

  sect('Category and reason');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Installation category', M, y);
  doc.setFont('helvetica','normal'); opts(M + 42, y, ['Domestic','Commercial','Industrial','Other'], p.category); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Reason for inspection', M, y);
  doc.setFont('helvetica','normal'); opts(M + 42, y, ['Insurance Inspection','Safety Audit','Other'], p.reason); y += 6.5;
  if(p.reasonOther){ line('If other, specify', p.reasonOther, M, y, W - M); y += 7; }
  y += 2;

  sect('Extent of installation covered by this report');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Entire installation?', M, y);
  doc.setFont('helvetica','normal'); opts(M + 40, y, ['Yes','No'], p.entireInstall); y += 5.5;
  doc.setFontSize(6.5); doc.setTextColor(120,133,150);
  doc.text('Cables concealed within trunking, conduit, the fabric of the building or underground have not been inspected unless stated otherwise.', M, y);
  doc.setTextColor(15,23,42); y += 5;
  if(p.entireInstall === 'No'){
    doc.setFontSize(7.2);
    const ls = doc.splitTextToSize('This report refers to: ' + (p.partialDetail || ''), W - M*2);
    room(ls.length*4 + 4); doc.text(ls, M, y); y += ls.length*4 + 2;
  }
  y += 3;

  sect('Supply characteristics');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Type of system earthing', M, y);
  doc.setFont('helvetica','normal'); opts(M + 46, y, ['TNCS','TT','TNS','IT'], p.earthing); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Installation voltage', M, y);
  doc.setFont('helvetica','normal'); opts(M + 46, y, ['Single Phase','Three Phase'], p.phase); y += 6.5;
  const volts = [['L1',p.v1],['L2',p.v2],['L3',p.v3],['L1-L2',p.v12],['L2-L3',p.v23],['L3-L1',p.v31]].filter(v => v[1]);
  if(volts.length){ let vx = M; volts.forEach(v => { line(v[0], v[1] + ' V', vx, y, vx + 26); vx += 31; }); y += 7; }
  line('Max prospective S/C current (A)', p.pscc, M, y, 96);
  line('Nominal rating (A)', p.nominalRating, COL2, y, COL2+HALF); y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Main isolation / overcurrent device', M, y);
  doc.setFont('helvetica','normal'); opts(M + 62, y, ['None','Switch Fuse','MCB','MCCB'], p.mainIsolation); y += 7;
  line('If main RCD: rated current In (A)', p.mainRcdIn, M, y, 96);
  line('Tripping current (mA)', p.mainRcdIdn, COL2, y, COL2+HALF); y += 4;

  /* Flows on from the supply section: a forced break here left half of the
     first page empty. */
  y += 6;
  sect('Inspection checks');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.2); doc.setTextColor(185,28,28);
  doc.text('Any question answered "No" must be referred to in the observations section. All questions must be answered.', M, y);
  doc.setTextColor(15,23,42); y += 6;

  const q = p.q || {};
  const ANSX = W - M - 40;
  const drawQ = (n, label, na) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
    const lines = doc.splitTextToSize(n + '.   ' + label, ANSX - M - 6);
    const h = Math.max(lines.length*3.9, 5) + 2.4;
    room(h + 2);
    const val = q['q'+n] || '';
    if(val === 'No'){
      doc.setFillColor(254,242,242); doc.rect(M-1.5, y-3.4, W - M*2 + 3, h, 'F');
      doc.setDrawColor(220,38,38); doc.setLineWidth(0.7); doc.line(M-1.5, y-3.4, M-1.5, y-3.4+h);
    }
    doc.setTextColor(15,23,42); doc.text(lines, M + 2, y);
    let bx = ANSX;
    ['Yes','No'].concat(na ? ['N/A'] : []).forEach(o => {
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(90,103,120);
      doc.text(o, bx, y); tick(bx + doc.getTextWidth(o) + 1.2, y, val === o); bx += doc.getTextWidth(o) + 7.5;
    });
    doc.setTextColor(15,23,42);
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.15); doc.line(M, y-3.4+h, W - M, y-3.4+h);
    y += h;
  };

  PIR_Q.forEach(g => {
    room(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.8); doc.setTextColor(...rgb1);
    doc.text(g.g.toUpperCase(), M, y);
    doc.setTextColor(15,23,42); y += 5;
    if(g.g === 'Distribution board(s)'){
      g.items.filter(it => it[0] < 17).forEach(it => drawQ(it[0], it[1], it[2]));
      room(12);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
      doc.text('17.   Sub circuit isolation and overcurrent device type', M + 2, y);
      opts(ANSX, y, ['Fuse','Mcb'], p.q17type);
      doc.setDrawColor(232,238,244); doc.setLineWidth(0.15); doc.line(M, y + 2.2, W - M, y + 2.2);
      y += 7.4;
      g.items.filter(it => it[0] > 17).forEach(it => drawQ(it[0], it[1], it[2]));
      room(26);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.text('20.   RCDs', M + 2, y); y += 1.5;
      doc.autoTable({
        startY: y, margin:{ left: M + 2, right: M },
        head: [['Circuit description','Tripping current (mA)','Longest tripping time (ms)']],
        body: (p.rcds||[]).length ? p.rcds.map(r => [r.desc||'', r.trip||'', r.time||'']) : [['','',''],['','','']],
        theme:'grid', styles:{ fontSize:7, cellPadding:1.6, lineColor:[210,218,228], minCellHeight:6 },
        headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7, fontStyle:'bold' },
        columnStyles:{ 1:{ cellWidth:32, halign:'center' }, 2:{ cellWidth:40, halign:'center' } },
        didParseCell: function(d){
          if(d.section === 'body' && d.column.index === 2){
            const t = parseFloat(d.cell.raw);
            if(!isNaN(t) && t > 300){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
          }
        }
      });
      y = doc.lastAutoTable.finalY + 7;
    } else { g.items.forEach(it => drawQ(it[0], it[1], it[2])); y += 3; }
  });

  y += 4;
  sect('Summary test data');
  line('Min insulation resistance (' + MOHM + ')', p.minIR, M, y, 96);
  line('Max resistance of protective conductor (' + OHM + ')', p.maxRp, COL2, y, COL2+HALF); y += 7;
  line('Max fault loop impedance (' + OHM + ')', p.maxZs, M, y, 96);
  line('Associated device type / size', [p.zsDeviceType, p.zsDeviceSize].filter(Boolean).join(' '), COL2, y, COL2+HALF); y += 9;

  sect('Quality of workmanship');
  opts(M, y, ['Very Good','Satisfactory','Poor'], p.workmanship); y += 9;

  sect('Test instrument serial numbers');
  line('Continuity tester', p.instContinuity, M, y, 96);
  line('Insulation resistance tester', p.instIR, COL2, y, COL2+HALF); y += 7;
  line('Loop impedance tester', p.instLoop, M, y, 96);
  line('RCD tester', p.instRcd, COL2, y, COL2+HALF); y += 9;

  sect('Observations and recommendations');
  opts(M, y, ['No remedial work is required','The following observations are made'], p.noRemedial); y += 6;
  doc.autoTable({
    startY: y, margin:{ left:M, right:M },
    head: [['Ref No.','Comments','Recommendation']],
    body: a.obs.length ? a.obs.map((o,i) => [o.ref || String(i+1), o.comment, '(' + o.code + ')  ' + (PIR_CODES[o.code]||'')])
                       : [['','',''],['','',''],['','','']],
    theme:'grid', styles:{ fontSize:7.2, cellPadding:1.8, lineColor:[210,218,228], minCellHeight:7 },
    headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7.2, fontStyle:'bold' },
    columnStyles:{ 0:{ cellWidth:16, halign:'center' }, 2:{ cellWidth:52 } },
    didParseCell: function(d){
      if(d.section === 'body' && d.column.index === 2 && String(d.cell.raw).indexOf('(1)') === 0){
        d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold';
      }
    }
  });
  y = doc.lastAutoTable.finalY + 4;

  doc.setFontSize(6.6); doc.setTextColor(100,116,139);
  doc.text('Each observation is given one of the following numbers to indicate the action recommended:', M, y); y += 3.3;
  doc.text('(1) Requires urgent attention     (2) Requires improvements     (3) Requires some attention     (4) Does not comply with current National Rules for Electrical Installations.', M, y); y += 3.3;
  doc.text('Using (4) does not necessarily imply that the electrical installation inspected is unsafe.', M, y); y += 6;
  doc.setTextColor(15,23,42);

  if(a.urgent.length){
    room(11);
    doc.setFillColor(220,38,38); doc.rect(M, y-4, W - M*2, 7.5, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
    doc.text('URGENT ATTENTION REQUIRED. The person responsible for the installation must be notified without delay.', M + 3, y + 0.8);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); y += 11;
  }

  doc.setFontSize(7.4);
  const rec = doc.splitTextToSize('On the basis that all observations requiring urgent attention have been completed without delay, we recommend that this installation is further inspected and tested after an interval of not more than ' +
    (p.intervalValue || '____') + ' ' + (p.intervalUnit || 'years') + '.', W - M*2);
  room(rec.length*4 + 6); doc.text(rec, M, y); y += rec.length*4 + 5;

  sect('Overall condition of the installation');
  opts(M, y, ['Satisfactory','Unsatisfactory'], a.condition); y += 12;

  sect('Declaration');
  doc.setFontSize(6.8); doc.setTextColor(100,116,139);
  const dec = doc.splitTextToSize('I/We are responsible for the inspection and testing of the electrical installation described in this report, and confirm to the best of my/our knowledge that the tests and observations recorded represent an accurate assessment, within the limits specified, of the condition of the electrical installation.', W - M*2);
  doc.text(dec, M, y); y += dec.length*3.2 + 6;
  doc.setTextColor(15,23,42);

  const sg = job.sig || {};
  room(26);
  if(sg.sig){ try{ doc.addImage(sg.sig, 'PNG', M + 2, y - 1, 44, 15); }catch(e){} }
  const sy = y + 16;
  doc.setDrawColor(150,163,180); doc.setLineWidth(0.25);
  doc.line(M, sy, M + 62, sy); doc.line(M + 70, sy, M + 124, sy); doc.line(M + 132, sy, W - M, sy);
  doc.setFontSize(7.4); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
  doc.text((sg.name || '').toUpperCase(), M + 2, sy - 2);
  doc.text(p.certifierNo || '', M + 72, sy - 2);
  doc.text(fmtDate(sg.date || job.date), M + 134, sy - 2);
  doc.setFontSize(6.6); doc.setFont('helvetica','normal'); doc.setTextColor(120,133,150);
  doc.text('Inspected and tested by (signed)', M, sy + 3.6);
  doc.text('Certifier No.', M + 70, sy + 3.6);
  doc.text('Date', M + 132, sy + 3.6);
}

  for(let i=1; i<=total; i++){

    doc.setDrawColor(226,232,240); doc.setLineWidth(0.25);
    doc.line(M, 283, W - M, 283);
    doc.setFontSize(6.4); doc.setFont('helvetica','normal'); doc.setTextColor(140,152,168);

      doc.text('Issued for record purposes. The official Safe Electric Periodic Inspection Report must still be completed and submitted.', M, 287);

}

/* ================= PDF: dashboard report ================= */
function drawColumns(doc, x, y, w, h, data, colA, colB){
  const max = Math.max(1, ...data.map(d => d.total));
  const bw = w / Math.max(data.length, 1);
  doc.setDrawColor(232,238,244); doc.setLineWidth(0.2);
  [0, 0.5, 1].forEach(g => doc.line(x, y + h - g*h, x + w, y + h - g*h));
  data.forEach((d, i) => {
    const bh = (d.total / max) * h;
    const unH = d.total ? (d.unsat / d.total) * bh : 0;
    const bx = x + i*bw + bw*0.22, bwid = bw*0.56;
    doc.setFillColor(...colA); doc.rect(bx, y + h - bh, bwid, Math.max(bh - unH, 0), 'F');
    if(unH > 0){ doc.setFillColor(...colB); doc.rect(bx, y + h - unH, bwid, unH, 'F'); }
    doc.setFontSize(5.4); doc.setTextColor(150,160,175);
    doc.text(d.label.split(' ')[0], bx + bwid/2, y + h + 3.4, { align:'center' });
    if(d.total){ doc.setFontSize(5.6); doc.setTextColor(90,103,120); doc.text(String(d.total), bx + bwid/2, y + h - bh - 1.4, { align:'center' }); }
  });
  doc.setTextColor(15,23,42);
}

function drawHBars(doc, x, y, w, rows, rowH){
  const max = Math.max(1, ...rows.map(r => r.value));
  rows.forEach((r, i) => {
    const ry = y + i*rowH;
    doc.setFontSize(6.6); doc.setTextColor(70,85,105); doc.setFont('helvetica','normal');
    const label = doc.splitTextToSize(r.label, w - 14)[0];
    doc.text(label, x, ry);
    doc.setFillColor(241,245,249); doc.roundedRect(x, ry + 1.2, w - 12, 2.4, 1.2, 1.2, 'F');
    const c = hexToRgb(r.color || '#cd7f32');
    doc.setFillColor(...c);
    doc.roundedRect(x, ry + 1.2, Math.max((r.value/max) * (w - 12), 1.2), 2.4, 1.2, 1.2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.6); doc.setTextColor(15,23,42);
    doc.text(String(r.value), x + w - 10, ry + 3.4);
  });
  doc.setFont('helvetica','normal');
}

function buildDashboardPdf(jobs, st, filterNote){
  const doc = new jspdf.jsPDF({ unit:'mm', format:'a4', compress:true });
  const W = 210, M = 14;
  const a = analyse(jobs);
  const rgb1 = hexToRgb(st.c1), rgb2 = hexToRgb(st.c2);
  const onC1 = textOn(st.c1) === '#ffffff' ? [255,255,255] : [15,23,42];

  /* ---- cover ---- */
  gradBand(doc, 0, 0, W, 74, brandStops(st));
  if(st.logo){
    try{
      const pr = doc.getImageProperties(st.logo);
      const fit = fitBox(pr.width, pr.height, 40, 18);
      if(st.logoBox !== false){ doc.setFillColor(255,255,255); doc.roundedRect(M-2, 14, fit.w+4, fit.h+4, 2, 2, 'F'); }
      doc.addImage(st.logo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, 16, fit.w, fit.h, undefined, 'FAST');
    }catch(e){}
  }
  doc.setTextColor(...onC1); doc.setFont('helvetica','bold'); doc.setFontSize(22);
  doc.text('Periodic Inspection Programme', M, 48);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text([st.clientName, st.companyName].filter(Boolean).join('   |   '), M, 56);
  doc.setFontSize(8);
  doc.text('Generated ' + new Date().toLocaleDateString('en-IE') + (filterNote ? '   |   ' + filterNote : ''), M, 63);
  doc.setTextColor(15,23,42);

  let y = 90;
  const H = (t) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...rgb2);
    doc.text(t.toUpperCase(), M, y);
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.4); doc.line(M, y + 2, W - M, y + 2);
    doc.setTextColor(15,23,42); y += 9;
  };

  /* ---- KPI tiles ---- */
  H('At a glance');
  const tiles = [
    ['Inspections', String(a.total)],
    ['Sites covered', String(a.sites)],
    ['Satisfactory', a.satRate + '%'],
    ['Urgent (C1)', String(a.urgent)],
    ['Observations', String(a.obsTotal)],
    ['Overdue', String(a.overdue.length)]
  ];
  const tw = (W - M*2 - 5*3) / 6;
  tiles.forEach((t, i) => {
    const x = M + i*(tw + 3);
    doc.setFillColor(248,250,252); doc.roundedRect(x, y, tw, 20, 2, 2, 'F');
    doc.setFillColor(...rgb2); doc.rect(x, y + 3, 1.1, 14, 'F');
    doc.setFontSize(5.6); doc.setTextColor(140,152,168); doc.setFont('helvetica','bold');
    doc.text(t[0].toUpperCase(), x + 3.4, y + 7);
    doc.setFontSize(13); doc.setTextColor(15,23,42);
    doc.text(t[1], x + 3.4, y + 15.5);
  });
  y += 29;

  /* ---- trend ---- */
  H('Inspections by month');
  drawColumns(doc, M, y, W - M*2, 34, a.months, rgb2, [220,38,38]);
  y += 44;
  doc.setFontSize(6.4); doc.setTextColor(120,133,150);
  doc.setFillColor(...rgb2); doc.rect(M, y - 2.4, 2.4, 2.4, 'F');
  doc.text('Satisfactory', M + 4, y);
  doc.setFillColor(220,38,38); doc.rect(M + 26, y - 2.4, 2.4, 2.4, 'F');
  doc.text('Unsatisfactory', M + 30, y);
  doc.setTextColor(15,23,42); y += 9;

  /* ---- two columns of bars ---- */
  const half = (W - M*2 - 8) / 2;
  const yStart = y;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(15,23,42);
  doc.text('Observations by code', M, y);
  drawHBars(doc, M, y + 6, half, ['1','2','3','4'].map(c => ({
    label: '(' + c + ') ' + PIR_CODES[c], value: a.byCode[c] || 0, color: CODE_COLOR[c]
  })), 8);

  doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.text('Installation category', M + half + 8, yStart);
  drawHBars(doc, M + half + 8, yStart + 6, half,
    Object.keys(a.byCat).map(k => ({ label:k, value:a.byCat[k], color: st.c2 })), 8);
  y = yStart + 6 + Math.max(4, Object.keys(a.byCat).length) * 8 + 6;

  /* ---- most failed checks ---- */
  if(a.topQ.length){
    H('Checks most often answered "No"');
    drawHBars(doc, M, y, W - M*2, a.topQ.map(q => ({ label: 'Q' + q.n + '  ' + q.text, value: q.count, color:'#dc2626' })), 8);
    y += a.topQ.length * 8 + 6;
  }

  /* ---- tables ---- */
  doc.addPage(); y = 20;
  H('Every inspection');
  doc.autoTable({
    startY: y, margin:{ left:M, right:M },
    head: [['Date','Site','Category','Inspector','Condition','Obs','C1','Next due']],
    body: jobs.map(j => {
      const au = audit(j);
      return [fmtDate(j.date), j.customerName || '', (j.pir||{}).category || '',
              j.inspector || (j.sig||{}).name || '', au.condition || '—',
              String(au.obs.length), String(au.urgent.length), fmtDate(au.nextDue)];
    }),
    theme:'striped', styles:{ fontSize:7, cellPadding:1.8, lineColor:[226,232,240] },
    headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7, fontStyle:'bold' },
    alternateRowStyles:{ fillColor:[250,251,252] },
    columnStyles:{ 5:{ halign:'center', cellWidth:10 }, 6:{ halign:'center', cellWidth:10 } },
    didParseCell: function(d){
      if(d.section !== 'body') return;
      if(d.column.index === 4 && d.cell.raw === 'Unsatisfactory'){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
      if(d.column.index === 6 && Number(d.cell.raw) > 0){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
    }
  });
  y = doc.lastAutoTable.finalY + 10;

  if(a.obsAll.length){
    if(y > 220){ doc.addPage(); y = 20; }
    H('All observations');
    doc.autoTable({
      startY: y, margin:{ left:M, right:M },
      head: [['Date','Site','Ref','Observation','Code']],
      body: a.obsAll.map(o => [fmtDate(o.job.date), o.job.customerName || '', o.obs.ref || '', o.obs.comment, '(' + o.obs.code + ') ' + PIR_CODES[o.obs.code]]),
      theme:'striped', styles:{ fontSize:7, cellPadding:1.8, lineColor:[226,232,240] },
      headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7, fontStyle:'bold' },
      alternateRowStyles:{ fillColor:[250,251,252] },
      columnStyles:{ 0:{ cellWidth:20 }, 2:{ cellWidth:10, halign:'center' }, 4:{ cellWidth:44 } },
      didParseCell: function(d){
        if(d.section === 'body' && d.column.index === 4 && String(d.cell.raw).indexOf('(1)') === 0){
          d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold';
        }
      }
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  const dueRows = a.overdue.concat(a.due90);
  if(dueRows.length){
    if(y > 220){ doc.addPage(); y = 20; }
    H('Re-inspection due');
    doc.autoTable({
      startY: y, margin:{ left:M, right:M },
      head: [['Site','Address','Last inspected','Due','Status']],
      body: dueRows.map(d => [d.site, d.address || '', fmtDate(d.date), fmtDate(d.nextDue),
        d.days < 0 ? Math.abs(d.days) + ' days overdue' : 'due in ' + d.days + ' days']),
      theme:'striped', styles:{ fontSize:7, cellPadding:1.8, lineColor:[226,232,240] },
      headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7, fontStyle:'bold' },
      alternateRowStyles:{ fillColor:[250,251,252] },
      didParseCell: function(d){
        if(d.section === 'body' && d.column.index === 4 && String(d.cell.raw).indexOf('overdue') > -1){
          d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold';
        }
      }
    });
  }

  pageFurniture(doc, st);
  stampWatermarks(doc, { draft: jobs.some(j => !isSignedOff(j)) });
  doc.save((DEMO ? 'DEMO-' : '') + 'inspection-dashboard-' + todayInput() + '.pdf');
}

function buildAllReportsPdf(jobs, st){

  const rgb1 = hexToRgb(st.c1), rgb2 = hexToRgb(st.c2);

  /* contents page */
  gradBand(doc, 0, 0, W, 60, brandStops(st));
  if(st.logo){
    try{
      const pr = doc.getImageProperties(st.logo);
      const fit = fitBox(pr.width, pr.height, 36, 16);
      if(st.logoBox !== false){ doc.setFillColor(255,255,255); doc.roundedRect(M-2, 12, fit.w+4, fit.h+4, 2, 2, 'F'); }
      doc.addImage(st.logo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, 14, fit.w, fit.h, undefined, 'FAST');
    }catch(e){}
  }
  doc.setTextColor(...onC1); doc.setFont('helvetica','bold'); doc.setFontSize(19);
  doc.text('Periodic Inspection Reports', M, 44);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);

  doc.autoTable({
    startY: 74, margin:{ left:M, right:M },
    head: [['#','Date','Site','PR No','Condition']],
    body: jobs.map((j, i) => [String(i+1), fmtDate(j.date), j.customerName || '', j.prNo || '', audit(j).condition || '—']),

}

function buildOnePirPdf(job, st){
  const doc = new jspdf.jsPDF({ unit:'mm', format:'a4', compress:true });
  renderPir(doc, job, st);
  doc.deletePage(1);   /* renderPir opens its own first page */
  pageFurniture(doc, st);
  const draft = !isSignedOff(job);
  stampWatermarks(doc, { draft });
  doc.save((draft ? 'DRAFT-' : DEMO ? 'DEMO-' : '') + 'PIR-' + safeName(job.customerName) + '-' + (job.date || todayInput()) + '.pdf');
}

/* ================= EXCEL ================= */
async function buildWorkbook(jobs, st){
  const wb = new ExcelJS.Workbook();
  wb.creator = st.companyName || 'Protech';
  const a = analyse(jobs);
  const head1 = argb(st.c1), head2 = argb(st.c2);

  const banner = (ws, title, cols) => {
    ws.mergeCells(1, 1, 1, cols);
    const c = ws.getCell(1,1);
    c.value = (DEMO ? DEMO_XL_NOTE + '   |   ' : '') + title + '   |   ' + (st.companyName || '');
    c.font = { bold:true, size:12, color:{ argb: DEMO ? 'FFB91C1C' : 'FFFFFFFF' } };
    c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: DEMO ? 'FFFDE8D2' : head2 } };
    c.alignment = { vertical:'middle', horizontal:'left', indent:1 };
    ws.getRow(1).height = 24;
  };
  const styleHeader = (ws, row, cols) => {
    const r = ws.getRow(row);
    r.font = { bold:true, color:{ argb:'FFFFFFFF' }, size:10 };
    r.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: head1 } };
    r.height = 20; r.alignment = { vertical:'middle' };
    ws.autoFilter = { from:{ row:row, column:1 }, to:{ row:row, column:cols } };
    ws.views = [{ state:'frozen', ySplit: row }];
  };

  /* --- Summary --- */
  const wsum = wb.addWorksheet('Summary');
  banner(wsum, 'Programme summary', 4);
  wsum.addRow([]);
  const sumRows = [
    ['Inspections', a.total], ['Sites covered', a.sites],
    ['Satisfactory', a.sat], ['Unsatisfactory', a.unsat],
    ['Satisfactory rate', a.satRate + '%'],
    ['Total observations', a.obsTotal], ['Average per inspection', a.avgObs],
    ['Urgent (code 1)', a.urgent],
    ['Overdue for re-inspection', a.overdue.length],
    ['Due within 90 days', a.due90.length],
    ['Report generated', new Date().toLocaleString('en-IE')]
  ];
  wsum.addRow(['Measure','Value']);
  styleHeader(wsum, 3, 2);
  sumRows.forEach(r => wsum.addRow(r));
  wsum.getColumn(1).width = 32; wsum.getColumn(2).width = 20;
  wsum.addRow([]); wsum.addRow(['Observations by code','Count']);
  ['1','2','3','4'].forEach(c => wsum.addRow(['(' + c + ') ' + PIR_CODES[c], a.byCode[c] || 0]));
  wsum.addRow([]); wsum.addRow(['Checks most often answered "No"','Count']);
  a.topQ.forEach(q => wsum.addRow(['Q' + q.n + ' ' + q.text, q.count]));

  /* --- Inspections --- */
  const ws = wb.addWorksheet('Inspections');
  const cols = ['PR No','Date','Site','Address','Category','Reason','Inspector','Condition',
                'Observations','Urgent (C1)','Checks answered','Workmanship','Earthing','Next due','Latitude','Longitude'];
  banner(ws, 'Periodic inspections', cols.length);
  ws.addRow([]); ws.addRow(cols);
  styleHeader(ws, 3, cols.length);
  jobs.forEach(j => {
    const au = audit(j), p = j.pir || {};
    ws.addRow([j.prNo||'', j.date||'', j.customerName||'', j.address||'', p.category||'', p.reason||'',
      j.inspector || (j.sig||{}).name || '', au.condition||'', au.obs.length, au.urgent.length,
      au.answered + ' of ' + au.total, p.workmanship||'', p.earthing||'', au.nextDue,
      j.lat || '', j.lng || '']);
  });
  ws.columns.forEach((c,i) => { c.width = [10,12,28,32,13,20,16,14,13,11,16,14,10,12,11,11][i] || 14; });
  ws.eachRow((row,n) => {
    if(n < 4) return;
    if(String(row.getCell(8).value) === 'Unsatisfactory') row.getCell(8).font = { bold:true, color:{argb:'FFB91C1C'} };
    if(Number(row.getCell(10).value) > 0) row.getCell(10).font = { bold:true, color:{argb:'FFB91C1C'} };
  });

  /* --- Observations --- */
  const wo = wb.addWorksheet('Observations');
  const ocols = ['Date','Site','Address','Ref','Observation','Code','Meaning'];
  banner(wo, 'Observations and recommendations', ocols.length);
  wo.addRow([]); wo.addRow(ocols);
  styleHeader(wo, 3, ocols.length);
  a.obsAll.forEach(o => wo.addRow([o.job.date||'', o.job.customerName||'', o.job.address||'',
    o.obs.ref||'', o.obs.comment, o.obs.code, PIR_CODES[o.obs.code]||'']));
  wo.columns.forEach((c,i) => { c.width = [12,26,28,7,60,7,34][i] || 14; });
  wo.eachRow((row,n) => { if(n > 3 && String(row.getCell(6).value) === '1') row.font = { bold:true, color:{argb:'FFB91C1C'} }; });

  /* --- Re-inspection due --- */
  const wd = wb.addWorksheet('Re-inspection due');
  const dcols = ['Site','Address','Last inspected','Condition','Due','Days'];
  banner(wd, 'Re-inspection schedule', dcols.length);
  wd.addRow([]); wd.addRow(dcols);
  styleHeader(wd, 3, dcols.length);
  a.due.forEach(d => wd.addRow([d.site, d.address||'', d.date, d.condition||'', d.nextDue, d.days]));
  wd.columns.forEach((c,i) => { c.width = [28,30,14,14,12,10][i] || 14; });
  wd.eachRow((row,n) => { if(n > 3 && Number(row.getCell(6).value) < 0) row.font = { bold:true, color:{argb:'FFB91C1C'} }; });

  /* --- Question results --- */
  const wq = wb.addWorksheet('Question results');
  const qnums = pirQFlat();
  const qcols = ['Date','Site'].concat(qnums.map(n => 'Q' + n));
  banner(wq, 'Answers to every question', qcols.length);
  wq.addRow([]); wq.addRow(qcols);
  styleHeader(wq, 3, qcols.length);
  jobs.forEach(j => {
    const q = (j.pir||{}).q || {};
    wq.addRow([j.date||'', j.customerName||''].concat(qnums.map(n => q['q'+n] || '')));
  });
  wq.getColumn(1).width = 12; wq.getColumn(2).width = 28;
  qnums.forEach((n,i) => { wq.getColumn(i+3).width = 6; });
  wq.eachRow((row, rn) => {
    if(rn < 4) return;
    row.eachCell((cell, cn) => { if(cn > 2 && cell.value === 'No') cell.font = { bold:true, color:{argb:'FFB91C1C'} }; });
  });

  /* --- Question key --- */
  const wk = wb.addWorksheet('Question key');
  banner(wk, 'What each question number means', 2);
  wk.addRow([]); wk.addRow(['Question','Text']);
  styleHeader(wk, 3, 2);
  qnums.forEach(n => wk.addRow(['Q' + n, Q_TEXT[n]]));
  wk.getColumn(1).width = 10; wk.getColumn(2).width = 82;

  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

                  <div className="min-w-0">

            {a.nos.map(n => <li key={n} className="text-sm text-slate-600 flex gap-2"><span className="font-bold text-red-600 shrink-0">Q{n}</span>{Q_TEXT[n]}</li>)}
          </ul>
        </div>)}
      </div>
    </div>
  </div>);
}

/* ================= APP ================= */
const RANGES = [['all','All time'],['12m','Last 12 months'],['6m','Last 6 months'],['90d','Last 90 days']];

function App(){
  const [jobs, setJobs] = useState(() => DEMO && !API.on ? makeDemoJobs() : []);
  const [locked, setLocked] = useState(API.configured && !API.on);
  const [loading, setLoading] = useState(!!API.on);
  const [error, setError] = useState('');
  const [range, setRange] = useState('all');
  const [cat, setCat] = useState('');
  const [cond, setCond] = useState('');
  const [insp, setInsp] = useState('');
  const [q, setQ] = useState('');
  const [sort, setSort] = useState({ key:'date', dir:-1 });
  const [detail, setDetail] = useState(null);
  const [busy, setBusy] = useState('');

  useEffect(()=>{
    document.title = (DEMO ? 'DEMO · ' : '') + (settings.clientName || settings.companyName) + ' — Inspection Dashboard';
  }, []);

  const load = async () => {
    if(!API.on) return;
    setLoading(true); setError('');
    try{
      const data = await API.call('pull', {});
      setJobs((data.jobs || []).filter(j => !j.deleted).sort((a,b) => (b.date||'').localeCompare(a.date||'')));
    }catch(e){ setError(e.message); }
    setLoading(false);
  };
  useEffect(()=>{ load(); }, []);

  const filtered = useMemo(()=>{
    const now = new Date();
    const cutoff = range === 'all' ? null
      : new Date(now.getFullYear(), now.getMonth() - (range === '12m' ? 12 : range === '6m' ? 6 : 3), now.getDate()).toISOString().slice(0,10);
    return jobs.filter(j => {
      if(cutoff && (j.date || '') < cutoff) return false;
      if(cat && (j.pir||{}).category !== cat) return false;
      if(cond && audit(j).condition !== cond) return false;
      if(insp && (j.inspector || (j.sig||{}).name || 'Unassigned') !== insp) return false;
      if(q){
        const hay = ((j.customerName||'') + ' ' + (j.address||'') + ' ' + (j.prNo||'') + ' ' + ((j.pir||{}).obs||[]).map(o=>o.comment).join(' ')).toLowerCase();
        if(!hay.includes(q.toLowerCase())) return false;
      }
      return true;
    });
  }, [jobs, range, cat, cond, insp, q]);

  const a = useMemo(()=>analyse(filtered), [filtered]);
  const allCats = useMemo(()=>Array.from(new Set(jobs.map(j => (j.pir||{}).category).filter(Boolean))).sort(), [jobs]);
  const allInsp = useMemo(()=>Array.from(new Set(jobs.map(j => j.inspector || (j.sig||{}).name || 'Unassigned'))).sort(), [jobs]);

  const sorted = useMemo(()=>{
    const val = (j) => {
      const au = audit(j);
      switch(sort.key){
        case 'site': return (j.customerName || '').toLowerCase();
        case 'cat': return ((j.pir||{}).category || '').toLowerCase();
        case 'insp': return (j.inspector || (j.sig||{}).name || '').toLowerCase();
        case 'cond': return au.condition || '';
        case 'obs': return au.obs.length;
        case 'urgent': return au.urgent.length;
        case 'due': return au.nextDue || '9999';
        default: return j.date || '';
      }
    };
    return [...filtered].sort((x,y) => {
      const vx = val(x), vy = val(y);
      if(vx === vy) return 0;
      return (vx > vy ? 1 : -1) * sort.dir;
    });
  }, [filtered, sort]);

  const filterNote = [
    RANGES.find(r => r[0] === range)[1],
    cat && ('category: ' + cat), cond && ('condition: ' + cond), insp && ('inspector: ' + insp), q && ('search: ' + q)
  ].filter(Boolean).join(', ');

  const th = (key, label, align) => (
    <th onClick={()=>setSort(s => ({ key, dir: s.key === key ? -s.dir : (key === 'date' ? -1 : 1) }))}
      style={{ textAlign: align || 'left', color: sort.key === key ? C2 : undefined }}>
      {label}{sort.key === key ? (sort.dir === 1 ? ' ▲' : ' ▼') : ''}
    </th>
  );

  const exportPdf = () => { setBusy('pdf'); setTimeout(()=>{ try{ buildDashboardPdf(sorted, settings, filterNote); } finally { setBusy(''); } }, 30); };
  const exportAll = () => { setBusy('all'); setTimeout(()=>{ try{ buildAllReportsPdf(sorted, settings); } finally { setBusy(''); } }, 30); };
  const exportXl = async () => {
    setBusy('xl');
    try{
      const blob = await buildWorkbook(sorted, settings);
      downloadBlob(blob, (DEMO ? 'DEMO-' : '') + 'inspection-data-' + todayInput() + '.xlsx');
    } finally { setBusy(''); }
  };

  if(locked) return <UnlockView onDone={()=>{ setLocked(false); load(); }}/>;

  return (<div className="min-h-screen">
    {DEMO && <div className="demobar h-1.5 noprint"/>}

    <header className="noprint brandgrad" style={{ color:textOn(C1) }}>
      <div className="max-w-7xl mx-auto px-5 py-5 flex items-center gap-4 flex-wrap">
        {settings.logo
          ? <img src={settings.logo} className="h-11 max-w-[150px] object-contain bg-white rounded-lg p-1"/>
          : <Mark size={44}/>}
        <div className="min-w-0 flex-1">
          <h1 className="serif text-2xl font-bold leading-tight truncate">{settings.clientName || settings.companyName}</h1>
          <p className="text-xs opacity-70">{BRAND.tagline || 'Periodic Inspection Programme'}{DEMO ? ' · demonstration with sample data' : ''}</p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button className="btn btn-a" disabled={!!busy || !sorted.length} onClick={exportPdf}>{busy==='pdf' ? 'Building…' : 'Dashboard PDF'}</button>
          <button className="btn btn-o" disabled={!!busy || !sorted.length} onClick={exportAll}>{busy==='all' ? 'Building…' : 'All reports PDF'}</button>
          <button className="btn btn-o" disabled={!!busy || !sorted.length} onClick={exportXl}>{busy==='xl' ? 'Building…' : 'Excel'}</button>
          {API.on && <button className="btn btn-o" onClick={load} disabled={loading}>{loading ? 'Loading…' : 'Refresh'}</button>}
          {API.on && <button className="btn btn-o" title="Forget the view code on this browser"
            onClick={()=>{ if(confirm('Forget the view code on this browser?')){ API.forget(); location.reload(); } }}>Lock</button>}
        </div>
      </div>
      <div style={{height:3, background:'rgba(255,255,255,.22)'}}/>
    </header>

    {DEMO && (<div className="max-w-7xl mx-auto px-5 pt-4 noprint">
      <div className="rounded-xl px-4 py-3 text-sm font-semibold flex items-start gap-2" style={{ background:'#fff8f1', border:'1px solid #fcd9b6', color:'#8a5220' }}>
        <span className="text-base leading-none mt-0.5">●</span>
        <span>
          Demonstration build. All {jobs.length} inspections shown are invented sample records for fictional sites, and every
          PDF and Excel export is watermarked "DEMO".
          {API.on ? ' Data is live from a demo-only area of the sheet, kept separate from any real records.' : ''}
        </span>
      </div>
    </div>)}

    <main className="max-w-7xl mx-auto px-5 py-6 space-y-6">
      {error && <div className="card p-4 text-sm text-red-700 bg-red-50 border-red-200">Could not load data: {error}</div>}
      {!DEMO && !API.on && !jobs.length && (
        <div className="card p-8 text-center">
          <h2 className="font-bold text-slate-800 text-lg mb-2">Not connected yet</h2>
          <p className="text-sm text-slate-500 max-w-md mx-auto">This dashboard has no API URL or view key set. Generate it again from the Factory with the Apps Script web-app URL and the read-only key.</p>
        </div>
      )}
      {loading && !jobs.length && <div className="card p-8 text-center text-slate-400 text-sm">Loading inspections…</div>}

      {jobs.length > 0 && (<>
        {/* ---- filters ---- */}
        <div className="card p-4 noprint">
          <div className="flex gap-2 flex-wrap items-center">
            {RANGES.map(r => (
              <button key={r[0]} className={'pill ' + (range === r[0] ? 'on' : '')} onClick={()=>setRange(r[0])}>{r[1]}</button>
            ))}
            <div className="w-px h-6 bg-slate-200 mx-1"/>
            <select className="field !w-auto !min-h-[38px] !py-1.5" value={cat} onChange={e=>setCat(e.target.value)}>
              <option value="">All categories</option>
              {allCats.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <select className="field !w-auto !min-h-[38px] !py-1.5" value={cond} onChange={e=>setCond(e.target.value)}>
              <option value="">Any condition</option>
              <option value="Satisfactory">Satisfactory</option>
              <option value="Unsatisfactory">Unsatisfactory</option>
            </select>
            <select className="field !w-auto !min-h-[38px] !py-1.5" value={insp} onChange={e=>setInsp(e.target.value)}>
              <option value="">All inspectors</option>
              {allInsp.map(i => <option key={i} value={i}>{i}</option>)}
            </select>
            <input className="field !w-auto !min-h-[38px] !py-1.5 flex-1 min-w-[180px]" placeholder="Search site, address or observation…" value={q} onChange={e=>setQ(e.target.value)}/>
            {(cat || cond || insp || q || range !== 'all') && (
              <button className="text-xs font-bold" style={{color:C2}} onClick={()=>{ setCat(''); setCond(''); setInsp(''); setQ(''); setRange('all'); }}>Clear</button>
            )}
          </div>
          <p className="text-xs text-slate-400 mt-2.5">Showing {filtered.length} of {jobs.length} inspections. Every export uses exactly what is shown here.</p>
        </div>

        {/* ---- KPIs ---- */}
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
          <Kpi label="Inspections" value={a.total} sub={a.sites + ' sites'} accent={C2}/>
          <Kpi label="Satisfactory" value={a.satRate + '%'} sub={a.sat + ' of ' + (a.sat + a.unsat) + ' rated'} accent="#059669" tone={a.satRate >= 80 ? 'ok' : a.satRate >= 60 ? 'warn' : 'bad'}/>
          <Kpi label="Unsatisfactory" value={a.unsat} sub="need remedial work" accent="#dc2626" tone={a.unsat ? 'bad' : null}/>
          <Kpi label="Urgent (C1)" value={a.urgent} sub="notify without delay" accent="#dc2626" tone={a.urgent ? 'bad' : 'ok'}/>
          <Kpi label="Observations" value={a.obsTotal} sub={a.avgObs + ' per inspection'} accent={C3}/>
          <Kpi label="Re-inspection" value={a.overdue.length} sub={a.due90.length + ' more due in 90 days'} accent="#d97706" tone={a.overdue.length ? 'warn' : 'ok'}/>
        </div>

        {/* ---- charts ---- */}
        <div className="grid lg:grid-cols-3 gap-5">
          <div className="card p-5 lg:col-span-2">
            <h3 className="font-bold text-slate-800 mb-1">Inspections by month</h3>
            <p className="text-xs text-slate-400 mb-4">Last 12 months, split by overall condition</p>
            <ColumnChart data={a.months}/>
          </div>
          <div className="card p-5">
            <h3 className="font-bold text-slate-800 mb-1">Overall condition</h3>
            <p className="text-xs text-slate-400 mb-4">Across the filtered inspections</p>
            <Donut centerTop={a.satRate + '%'} centerSub="SATISFACTORY" slices={[
              { label:'Satisfactory', value:a.sat, color:'#059669' },
              { label:'Unsatisfactory', value:a.unsat, color:'#dc2626' },
              { label:'Not rated', value: Math.max(a.total - a.sat - a.unsat, 0), color:'#cbd5e1' }
            ]}/>
          </div>
        </div>

        <div className="card p-5">
          <div className="flex items-start justify-between gap-3 flex-wrap mb-1">
            <div>
              <h3 className="font-bold text-slate-800">Site map</h3>
              <p className="text-xs text-slate-400">
                Plotted from coordinates captured on site
                {a.mapMissing > 0 ? ' · ' + a.mapMissing + ' site' + (a.mapMissing===1?'':'s') + ' without coordinates yet' : ''}
              </p>
            </div>
            <span className="chip chip-n">{a.mapPoints.length} located</span>
          </div>
          <div className="mt-4"><SiteMap points={a.mapPoints} onPick={setDetail}/></div>
        </div>

        <div className="grid lg:grid-cols-3 gap-5">
          <div className="card p-5">
            <h3 className="font-bold text-slate-800 mb-1">Observations by code</h3>
            <p className="text-xs text-slate-400 mb-4">What the findings are asking for</p>
            <BarList rows={['1','2','3','4'].map(c => ({ label:'(' + c + ') ' + PIR_CODES[c], value:a.byCode[c]||0, color:CODE_COLOR[c] }))}/>
          </div>
          <div className="card p-5 lg:col-span-2">
            <h3 className="font-bold text-slate-800 mb-1">Checks most often answered "No"</h3>
            <p className="text-xs text-slate-400 mb-4">Where the estate keeps falling down — the best place to spend money</p>
            <BarList color="#dc2626" rows={a.topQ.map(qq => ({ label:'Q' + qq.n + ' · ' + qq.text, value:qq.count }))}/>
          </div>
        </div>

        <div className="grid lg:grid-cols-2 gap-5">
          <div className="card p-5">
            <h3 className="font-bold text-slate-800 mb-1">Installation category</h3>
            <p className="text-xs text-slate-400 mb-4">Mix of sites inspected</p>
            <Donut centerTop={a.total} centerSub="INSPECTIONS" slices={Object.keys(a.byCat).map((k,i) => ({
              label:k, value:a.byCat[k], color:[C2, C1, C3, '#94a3b8', '#0e7490'][i % 5]
            }))}/>
          </div>
          <div className="card p-5">
            <h3 className="font-bold text-slate-800 mb-1">By inspector</h3>
            <p className="text-xs text-slate-400 mb-4">Inspections completed, with observations raised</p>
            <BarList rows={Object.keys(a.byInspector).sort((x,y)=>a.byInspector[y].n - a.byInspector[x].n)
              .map(k => ({ label: k + '  ·  ' + a.byInspector[k].obs + ' obs', value:a.byInspector[k].n }))}/>
          </div>
        </div>

        {/* ---- due ---- */}
        {(a.overdue.length > 0 || a.due90.length > 0) && (
          <div className="card p-5">
            <h3 className="font-bold text-slate-800 mb-1">Re-inspection due</h3>
            <p className="text-xs text-slate-400 mb-4">Overdue first, then anything falling due in the next 90 days</p>
            <div className="scrollx">
              <table className="data">
                <thead><tr><th>Site</th><th>Address</th><th>Last inspected</th><th>Condition</th><th>Due</th><th>Status</th></tr></thead>
                <tbody>
                  {a.overdue.concat(a.due90).map((d,i) => (
                    <tr key={i} onClick={()=>setDetail(d.job)}>
                      <td className="font-semibold text-slate-800">{d.site}</td>
                      <td className="text-slate-500">{d.address}</td>
                      <td>{fmtDate(d.date)}</td>
                      <td>{d.condition ? <span className={'chip ' + (d.condition === 'Unsatisfactory' ? 'chip-bad' : 'chip-ok')}>{d.condition}</span> : '—'}</td>
                      <td>{fmtDate(d.nextDue)}</td>
                      <td>{d.days < 0
                        ? <span className="chip chip-bad">{Math.abs(d.days)} days overdue</span>
                        : <span className="chip chip-warn">in {d.days} days</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* ---- table ---- */}
        <div className="card p-5">
          <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
            <div>
              <h3 className="font-bold text-slate-800">Every inspection</h3>
              <p className="text-xs text-slate-400">Click any row for the full record</p>
            </div>
            <span className="chip chip-n">{sorted.length} shown</span>
          </div>
          <div className="scrollx">
            <table className="data">
              <thead><tr>
                {th('date','Date')}{th('site','Site')}{th('cat','Category')}{th('insp','Inspector')}
                {th('cond','Condition')}{th('obs','Obs','center')}{th('urgent','C1','center')}{th('due','Next due')}
              </tr></thead>
              <tbody>
                {sorted.map(j => {
                  const au = audit(j);
                  return (<tr key={j.id} onClick={()=>setDetail(j)}>
                    <td className="whitespace-nowrap">{fmtDate(j.date)}</td>
                    <td className="font-semibold text-slate-800">{j.customerName}<div className="text-xs font-normal text-slate-400">{j.address}</div></td>
                    <td>{(j.pir||{}).category || '—'}</td>
                    <td>{j.inspector || (j.sig||{}).name || '—'}</td>
                    <td>{au.condition ? <span className={'chip ' + (au.condition === 'Unsatisfactory' ? 'chip-bad' : 'chip-ok')}>{au.condition}</span> : <span className="chip chip-n">Open</span>}</td>
                    <td style={{textAlign:'center'}}>{au.obs.length || '—'}</td>
                    <td style={{textAlign:'center'}} className={au.urgent.length ? 'text-red-600 font-bold' : 'text-slate-300'}>{au.urgent.length || '—'}</td>
                    <td className="whitespace-nowrap">{fmtDate(au.nextDue) || '—'}</td>
                  </tr>);
                })}
                {sorted.length === 0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">Nothing matches those filters.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </>)}
    </main>

    {detail && <Detail job={detail} onClose={()=>setDetail(null)}/>}

    <footer className="max-w-7xl mx-auto px-5 py-8 text-center text-xs text-slate-400">
      {settings.companyName}{settings.regNo ? ' · Reg ' + settings.regNo : ''} · Records issued for programme management.
      The official Safe Electric Periodic Inspection Report must still be completed and submitted.
      <div className="mt-1">Dashboard by Protech Dynamic Solutions</div>
    </footer>
  </div>);
}

try{
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  var boot = document.getElementById('boot'); if(boot) boot.style.display = 'none';
}catch(err){ window.__err(err && err.message ? err.message : err); }
</script>
</body>
</html>
