<style>
:root{
  --c1:#1b3bc7; --c2:#12b48c; --c3:#2f80ed;
  --c1-soft:rgba(27,59,199,.06);
  --hdr:66px;   /* header height, so the tab strip can stick right under it */
}
/* The brand gradient: deep blue into teal and back, used on the header and on
   every PDF banner so screen and paper match. */
.brandgrad{ background:linear-gradient(100deg, var(--c1) 0%, var(--c3) 38%, var(--c2) 68%, var(--c1) 100%); }
html{ -webkit-text-size-adjust:100%; }
body{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f1f5f9; overscroll-behavior-y:none; color:#334155; }
input,select,textarea{ font-size:16px !important; }
.field{ width:100%; border:1.5px solid #cbd5e1; border-radius:10px; padding:10px 12px; background:#fff; min-height:46px; }
.field:focus{ outline:2px solid var(--c2); outline-offset:1px; border-color:var(--c2); }
.field.warn{ border-color:#f59e0b; background:#fffbeb; }
.field.bad{ border-color:#dc2626; background:#fef2f2; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; padding:12px 18px; font-weight:600; min-height:48px; user-select:none; cursor:pointer; border:0; transition:filter .12s, transform .05s; }
.btn:active{ transform:scale(.985); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-p{ background:var(--c1); color:#fff; } .btn-p:hover{ filter:brightness(1.35); }
.btn-a{ background:var(--c2); color:#fff; } .btn-a:hover{ filter:brightness(1.08); }
.btn-o{ background:#fff; color:var(--c1); border:1.5px solid var(--c1); }
.btn-g{ background:#e2e8f0; color:#334155; }
.btn-d{ background:#fef2f2; color:#b91c1c; border:1.5px solid #fecaca; }

.tabbtn.on{ background:var(--c1); color:#fff; }
.tabbtn.off{ background:#fff; color:#475569; border-color:#e2e8f0; }
.chip{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }
.chip-ok{ background:rgba(5,150,105,.12); color:#047857; }
.chip-bad{ background:rgba(220,38,38,.12); color:#b91c1c; }
.chip-open{ background:rgba(205,127,50,.14); color:#8a5220; }
.sigpad{ touch-action:none; background:#fff; border:1.5px dashed #94a3b8; border-radius:12px; width:100%; height:150px; }
.fadein{ animation:fi .18s ease-out; } @keyframes fi{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }
.scrollx{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.scrollx::-webkit-scrollbar{ height:0; }
.demobar{ background:repeating-linear-gradient(45deg,#12b48c,#12b48c 12px,#0e8f70 12px,#0e8f70 24px); }
.chip-draft{ background:rgba(100,116,139,.14); color:#475569; }

<script>
window.__err = function(msg){
  var b = document.getElementById('boot'); if(!b) return;
  b.style.display = 'flex';
  b.innerHTML = '<div style="max-width:520px;padding:24px;text-align:left"><div style="font-weight:700;color:#b91c1c;font-size:16px;margin-bottom:8px">The app could not start</div><pre style="white-space:pre-wrap;font-size:12px;color:#334155;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px">' + String(msg) + '</pre></div>';
};
window.addEventListener('error', function(e){ window.__err((e.message||'Error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
window.addEventListener('load', function(){
  var missing = [];
  if(!window.React) missing.push('React');
  if(!window.Babel) missing.push('Babel');
  if(!window.jspdf) missing.push('jsPDF');
  if(!window.ExcelJS) missing.push('ExcelJS');
  if(missing.length) window.__err('These libraries did not load: ' + missing.join(', ') + '.\nThe page needs internet access the first time it is opened.');
});
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ================= BRANDING ================= */
const BRAND = window.APP_CONFIG || {};
const DEMO = !!BRAND.demo;

/* Protech maintenance unlock: tap the header title 7 times, enter the PIN, and
   the branding controls appear in Settings. Client-side gate only — it hides
   controls from the customer, it is not protection against reading the source. */
const LOCAL_PIN = BRAND.protechPin || '';
const protechUnlocked = () => { try{ return sessionStorage.getItem('protech_unlocked') === '1'; }catch(e){ return false; } };

/* ================= LOCAL STORAGE ================= */
/* Namespaced per company: localStorage is shared across a whole github.io
   domain, so two deployments must never collide. */
const STORE_NS = 'ppi_' + ((BRAND.companyCode || BRAND.companyName || 'app').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16)) + (DEMO ? '_demo_' : '_');
const memStore = {};
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(STORE_NS+k); return v ? JSON.parse(v) : fb; }catch(e){ return memStore[k] !== undefined ? memStore[k] : fb; } },
  set(k, v){ try{ localStorage.setItem(STORE_NS+k, JSON.stringify(v)); }catch(e){ memStore[k] = v; } }
};

/* ================= SMALL HELPERS ================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const nowISO = () => new Date().toISOString();
const todayInput = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-IE', {day:'2-digit', month:'short', year:'numeric'}); };
const downloadBlob = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); };
const hexToRgb = (h) => { h=(h||'#0f172a').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const luminance = (h) => { const [r,g,b]=hexToRgb(h); return (0.299*r+0.587*g+0.114*b)/255; };
const textOn = (h) => luminance(h) > 0.6 ? '#0f172a' : '#ffffff';
const argb = (h) => 'FF' + (h||'#0f172a').replace('#','').toUpperCase();
const safeName = (s) => String(s || 'record').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'record';

/* Fit an image inside a box without squashing it. */
function fitBox(natW, natH, maxW, maxH){
  if(!natW || !natH) return { w:maxW, h:maxH };
  const r = Math.min(maxW/natW, maxH/natH);
  return { w:natW*r, h:natH*r };
}

/* Add N months/years to a yyyy-mm-dd date. Used for the next-inspection date. */
function addInterval(dateStr, value, unit){
  const n = parseFloat(value);
  if(!dateStr || !n || isNaN(n)) return '';
  const d = new Date(dateStr);
  if(isNaN(d)) return '';
  if(unit === 'months') d.setMonth(d.getMonth() + Math.round(n));
  else d.setFullYear(d.getFullYear() + Math.round(n));
  return d.toISOString().slice(0,10);
}

/* ================= API (Google Apps Script) ================= */
/* The access code is NOT baked into this file. An Apps Script web app has to be
   published as "Anyone", so anything embedded in the page source is readable by
   anyone who views source. Instead the code is typed once per device and kept in
   that device's storage, which keeps it out of the deployed HTML, out of the
   repo and out of anything shared by link.
   BRAND.apiKey stays supported for a throwaway build, but the Factory leaves it
   empty by default. */
const API = {
  url: BRAND.apiUrl || '',
  key: '',
  /* Demo data lives in its own namespace on the server, so a demo can be shown
     live without ever touching, or being confused with, real records. */
  company: (BRAND.companyCode || 'default').toLowerCase() + (DEMO ? '-demo' : ''),
  get configured(){ return !!this.url; },
  get on(){ return !!(this.url && this.key); },
  async call(action, payload){
    if(!this.on) throw new Error('Not signed in on this device.');
    /* text/plain avoids a CORS preflight, which Apps Script cannot answer. */
    const res = await fetch(this.url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ key:this.key, company:this.company, action, payload: payload || {} })
    });
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Request failed');
    return json.data;
  },
  saveKey(k){ this.key = k; store.set('accessKey', k); },
  forget(){ this.key = ''; store.set('accessKey', ''); }
};
API.key = store.get('accessKey', '') || (BRAND.apiKey || '');

/* Everything saves to the device first. A queue of changed ids is flushed to
   Apps Script whenever the network allows, so the app works with no signal. */
const queue = {
  get list(){ return store.get('queue', []); },
  add(id){ const q = this.list; if(q.indexOf(id) === -1){ q.push(id); store.set('queue', q); } },
  clear(ids){ store.set('queue', this.list.filter(x => ids.indexOf(x) === -1)); }
};

/* ================= REFERENCE DATA ================= */
/* The questions from the Safe Electric Periodic Inspection Report.
   Third value = whether N/A is an allowed answer. */
const PIR_Q = [
  { g:'Outlets & accessories', items:[
    [1,'Have all electrical outlets / accessories been inspected?', false],
    [2,'Are all outlets / accessories undamaged?', false],
    [3,'Are all live parts covered?', false],
  ]},
  { g:'Earthing / bonding', items:[
    [4,'If TNCS, is main protective conductor connected?', true],
    [5,'If present, is it the correct size?', true],
    [6,'Earth Electrode Inspection Chamber?', false],
    [7,'If yes, is earth electrode visible?', false],
    [8,'If yes, is protective tape used?', false],
    [9,'If visible, is the earthing conductor the correct size?', false],
    [10,'Is all main equipotential bonding correct?', true],
    [11,'All supplementary bonding correct and connections verified?', true],
    [12,'Protective earthing sleeved where appropriate?', true],
    [13,'Polarity and earthing of all switches / outlets correct?', false],
    [14,'All metallic switches / outlets earthed?', false],
  ]},
  { g:'Distribution board(s)', items:[
    [15,'Labelled correctly?', false],
    [16,'Located correctly?', false],
    [18,'Are all devices correctly rated for S/C and O/L?', false],
    [19,'Circuit sequence correct for P, N, +E?', false],
  ]},
  { g:'General', items:[
    [21,'Correct cable colours used at the time of installation?', false],
    [22,'Are cables in good condition?', false],
    [23,'Cables correctly selected?', false],
    [24,'Correct routing of cables in attic area?', true],
    [25,'Cables correctly installed where visible?', false],
    [26,'All excessive heating effects from luminaires avoided?', false],
    [27,'Correctly selected accessories and switches?', false],
    [28,'Are they in a good condition?', false],
    [29,'Are they correctly located?', false],
    [30,'Are they suitable for their environment?', false],
  ]},
];
const PIR_CODES = {
  '1':'Requires urgent attention',
  '2':'Requires improvements',
  '3':'Requires some attention',
  '4':'Does not comply with current National Rules'
};
const Q_TEXT = (() => { const m = {}; PIR_Q.forEach(g => g.items.forEach(i => { m[i[0]] = i[1]; })); return m; })();
const pirQFlat = () => PIR_Q.reduce((a,g)=> a.concat(g.items.map(i=>i[0])), []);

/* Unanswered questions, "No" answers and urgent observations, in one place. */
function audit(job){
  const p = job.pir || {};
  const q = p.q || {};
  const nums = pirQFlat();
  const unanswered = nums.filter(n => !q['q'+n]);
  const nos = nums.filter(n => q['q'+n] === 'No');
  const obs = (p.obs || []).filter(o => (o.comment||'').trim());
  const urgent = obs.filter(o => o.code === '1');
  return {
    unanswered, nos, obs, urgent,
    answered: nums.length - unanswered.length,
    total: nums.length,
    condition: urgent.length ? 'Unsatisfactory' : (p.condition || ''),
    complete: unanswered.length === 0 && !!p.condition && !!((job.sig||{}).sig)
  };
}

const defaultSettings = () => ({
  companyName: BRAND.companyName || 'Protech Dynamic Solutions',
  address:'', phone: BRAND.phone || '', email: BRAND.email || '',
  website: BRAND.website || '', regNo: BRAND.regNumber || '',
  officeEmail: BRAND.email || '',
  logo: BRAND.logoDataUri || BRAND.logoUrl || '',
  footerText: BRAND.tagline || '',
  logoBox: BRAND.logoBox !== false,
  disclaimer: true,
  c1: BRAND.primaryColor || '#1b3bc7',
  c2: BRAND.accentColor || '#12b48c',
  c3: BRAND.thirdColor || '#2f80ed'
});

/* Branding always comes from the config block, so a stored settings object from
   another deployment can never show the wrong company. */
function applyBrand(stored){
  const base = defaultSettings();
  if(!stored) return base;
  return Object.assign({}, stored, {
    companyName: base.companyName, logo: base.logo, footerText: base.footerText,
    website: base.website, logoBox: base.logoBox,
    c1: base.c1, c2: base.c2, c3: base.c3
  });
}

const blankJob = () => ({
  id: uid(),
  prNo:'', date: todayInput(),
  customerId:'', customerName:'', address:'', phone:'', email:'',
  lat:'', lng:'',
  inspector:'',
  pir: {
    approxAge:'', occupant:'', occupantAttended:'',
    category:'', reason:'', reasonOther:'',
    entireInstall:'', partialDetail:'',
    earthing:'', phase:'', v1:'', v2:'', v3:'', v12:'', v23:'', v31:'',
    pscc:'', mainIsolation:'', nominalRating:'', mainRcdIn:'', mainRcdIdn:'',
    q:{}, q17type:'', rcds:[],
    workmanship:'',
    minIR:'', maxRp:'', maxZs:'', zsDeviceType:'', zsDeviceSize:'',
    instContinuity:'', instIR:'', instLoop:'', instRcd:'',
    noRemedial:'', obs:[],
    intervalValue:'5', intervalUnit:'years',
    condition:'', certifierNo:''
  },
  photos:[],
  sig:{ name:'', sig:'', date:'' },
  createdAt: nowISO(), updatedAt: nowISO()
});

/* PR numbers run on automatically: take the highest number already used and add
   one. Still editable, in case a job has to match a number from elsewhere. */
function nextPrNo(jobs){
  let max = 0;
  (jobs || []).forEach(j => {
    const m = /(\d+)\s*$/.exec(j.prNo || '');
    if(m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'PR-' + String(max + 1).padStart(5, '0');
}

/* Everything that does not change between visits to the same site is carried
   forward, so a repeat inspection starts most of the way filled in. The checks,
   the observations and the readings always start blank. */
const CARRY_FIELDS = ['category','reason','reasonOther','approxAge','occupant','entireInstall','partialDetail',
                      'earthing','phase','pscc','mainIsolation','nominalRating','mainRcdIn','mainRcdIdn',
                      'q17type','intervalValue','intervalUnit','certifierNo',
                      'instContinuity','instIR','instLoop','instRcd'];
function carryForward(target, prev){
  if(!prev) return target;
  const pp = prev.pir || {};
  CARRY_FIELDS.forEach(k => { if(pp[k]) target.pir[k] = pp[k]; });
  if((pp.rcds || []).length){
    target.pir.rcds = pp.rcds.map(r => ({ id: uid(), desc: r.desc, trip: r.trip, time: '' }));
  }
  target.inspector = prev.inspector || target.inspector;
  target.sig.name = (prev.sig || {}).name || target.sig.name;
  return target;
}

/* The flat columns the dashboard reads straight out of the sheet. */
function jobMeta(job){
  const a = audit(job);
  const p = job.pir || {};
  return {
    date: job.date || '',
    customerName: job.customerName || '',
    address: job.address || '',
    category: p.category || '',
    condition: a.condition || p.condition || '',
    urgent: a.urgent.length,
    obsCount: a.obs.length,
    inspector: job.inspector || (job.sig||{}).name || '',
    nextDue: addInterval(job.date, p.intervalValue, p.intervalUnit),
    lat: job.lat || '', lng: job.lng || ''
  };
}

/* ================= SHARED UI ================= */
function Field({label, value, onChange, type='text', placeholder, required, area, hint, className, inputMode}){
  const missing = required && !String(value||'').trim();
  const cls = 'field' + (missing ? ' warn' : '') + (className ? ' '+className : '');
  return (<label className="block">
    {label && <span className="text-[13px] font-semibold text-slate-600 mb-1 flex items-center gap-1.5">{label}{required && <span style={{color:'var(--c2)'}}>•</span>}</span>}
    {area
      ? <textarea className={cls} rows={3} value={value||''} placeholder={placeholder} onChange={e=>onChange(e.target.value)}/>
      : <input className={cls} type={type} inputMode={inputMode} value={value||''} placeholder={placeholder} onChange={e=>onChange(e.target.value)}/>}
    {hint && <span className="text-xs text-slate-400 mt-0.5 block">{hint}</span>}
  </label>);
}

/* Select with an "Other (specify)" escape hatch, so site reality always fits. */
function Dropdown({label, value, onChange, options, required}){
  const [custom, setCustom] = useState(value !== '' && value != null && !options.includes(value));
  const missing = required && !String(value||'').trim();
  const cls = 'field' + (missing ? ' warn' : '');
  if(custom){
    return (<label className="block">
      <span className="text-[13px] font-semibold text-slate-600 mb-1 flex items-center gap-1.5">{label}{required && <span style={{color:'var(--c2)'}}>•</span>}</span>
      <div className="flex gap-1">
        <input className={cls} value={value||''} onChange={e=>onChange(e.target.value)} autoFocus placeholder="Specify…"/>
        <button className="btn btn-g !min-h-[46px] !py-0 px-3" type="button" onClick={()=>{ setCustom(false); onChange(''); }}>✕</button>
      </div>
    </label>);
  }
  return (<label className="block">
    <span className="text-[13px] font-semibold text-slate-600 mb-1 flex items-center gap-1.5">{label}{required && <span style={{color:'var(--c2)'}}>•</span>}</span>
    <select className={cls} value={value||''} onChange={e=>{
      if(e.target.value === '___OTHER___'){ setCustom(true); onChange(''); }
      else onChange(e.target.value);
    }}>
      <option value="" disabled hidden>Select…</option>
      {options.map(o => <option key={o} value={o}>{o}</option>)}
      <option value="___OTHER___">Other (specify)…</option>
    </select>
  </label>);
}

function Seg({label, value, onChange, options}){
  return (<div>
    {label && <span className="text-[13px] font-semibold text-slate-600 mb-1 block">{label}</span>}
    <div className="flex flex-wrap gap-2">
      {options.map(o => (
        <button key={o} type="button" onClick={()=>onChange(value===o ? '' : o)}
          className={'tabbtn ' + (value===o ? 'on' : 'off')}>{o}</button>
      ))}
    </div>
  </div>);
}

function Section({title, chip, children, right}){
  return (<div className="card p-4 sm:p-5 fadein">
    <div className="flex items-center justify-between mb-3 gap-2">
      <h3 className="font-bold text-slate-800 text-[15px] flex items-center gap-2">{title}{chip}</h3>
      {right}
    </div>
    {children}
  </div>);
}

/* House mark: a clipboard with a tick. Reads as "inspection signed off" rather
   than a generic electrical bolt. */
function Mark({size=34}){
  return (<svg width={size} height={size} viewBox="0 0 32 32" fill="none" className="shrink-0">
    <rect x="1" y="1" width="30" height="30" rx="8" fill="rgba(255,255,255,.14)"/>
    <rect x="9" y="6.5" width="14" height="19" rx="2.6" stroke="#fff" strokeWidth="1.9"/>
    <path d="M13 6.5V5.2A1.2 1.2 0 0 1 14.2 4h3.6A1.2 1.2 0 0 1 19 5.2v1.3" stroke="#fff" strokeWidth="1.9" strokeLinecap="round"/>
    <path d="M12.4 16.4l2.6 2.7 5-5.4" stroke="#fff" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>);
}

function Toast({msg}){
  if(!msg) return null;
  return <div className="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full text-sm font-medium shadow-xl z-50 fadein">{msg}</div>;
}

function TriState({n, label, na, value, onChange}){
  const opts = na ? ['Yes','No','N/A'] : ['Yes','No'];
  return (<div className="flex items-start gap-2 py-2 border-b border-slate-100 last:border-0">
    <span className="text-xs font-bold text-slate-400 w-6 pt-1.5">{n}</span>
    <span className="text-sm text-slate-700 flex-1 pt-1">{label}</span>
    <div className="flex gap-1 shrink-0">
      {opts.map(o => (
        <button key={o} onClick={()=>onChange(value===o ? '' : o)}
          className={'text-xs px-2.5 py-1.5 rounded-md border font-semibold ' +
            (value===o
              ? (o==='No' ? 'bg-red-600 text-white border-red-600' : o==='Yes' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-500 text-white border-slate-500')
              : 'border-slate-300 text-slate-500 bg-white')}>{o}</button>
      ))}
    </div>
  </div>);
}

function SignaturePad({value, onChange}){
  const ref = useRef(null); const drawing = useRef(false); const dirty = useRef(false);
  useEffect(()=>{
    const c = ref.current; if(!c) return;
    const scale = window.devicePixelRatio || 1;
    const w = c.offsetWidth, h = c.offsetHeight;
    c.width = w*scale; c.height = h*scale;
    const ctx = c.getContext('2d'); ctx.scale(scale, scale);
    ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f172a';
    if(value){ const img = new Image(); img.onload = ()=>ctx.drawImage(img,0,0,w,h); img.src = value; }
  },[]);
  const pos = (e) => { const r = ref.current.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const down = (e) => { drawing.current = true; const ctx = ref.current.getContext('2d'); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ref.current.setPointerCapture(e.pointerId); };
  const move = (e) => { if(!drawing.current) return; const ctx = ref.current.getContext('2d'); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); dirty.current = true; };
  const up = () => { if(drawing.current && dirty.current) onChange(ref.current.toDataURL('image/png')); drawing.current = false; };
  const clear = () => { const c = ref.current; const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); onChange(''); dirty.current = false; };
  return (<div>
    <canvas ref={ref} className="sigpad" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerLeave={up}/>
    <button type="button" className="btn btn-g mt-2 !min-h-[38px] !py-1.5 text-sm" onClick={clear}>Clear signature</button>
  </div>);
}

function compressImage(file, maxDim=1200, quality=0.68){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(Math.max(w,h) > maxDim){ const r = maxDim/Math.max(w,h); w = Math.round(w*r); h = Math.round(h*r); }
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

/* ================= PDF FURNITURE ================= */
/* A gradient band drawn as thin slices, so paper matches the on-screen header.
   jsPDF has no gradient fill of its own. */
function lerp(a, b, t){ return a + (b - a) * t; }
function gradBand(doc, x, y, w, h, stops){
  /* A slim per-page rule does not need as many slices as a full cover band. */
  const N = h > 18 ? 96 : 44;
  for(let i = 0; i < N; i++){
    const t = i / (N - 1);
    let a = stops[0], b = stops[stops.length - 1];
    for(let s = 0; s < stops.length - 1; s++){
      if(t >= stops[s].p && t <= stops[s+1].p){ a = stops[s]; b = stops[s+1]; break; }
    }
    const span = (b.p - a.p) || 1;
    const lt = Math.min(Math.max((t - a.p) / span, 0), 1);
    doc.setFillColor(
      Math.round(lerp(a.c[0], b.c[0], lt)),
      Math.round(lerp(a.c[1], b.c[1], lt)),
      Math.round(lerp(a.c[2], b.c[2], lt))
    );
    doc.rect(x + (w * i / N), y, w / N + 0.4, h, 'F');
  }
}
function brandStops(st){
  const c1 = hexToRgb(st.c1), c2 = hexToRgb(st.c2), c3 = hexToRgb(st.c3);
  return [{p:0, c:c1}, {p:0.38, c:c3}, {p:0.68, c:c2}, {p:1, c:c1}];
}

/* DRAFT until it is signed off, DEMO whenever this is a demo build. Both can
   appear at once: an unsigned record in a demo pack is both. */
function stampWatermarks(doc, opts){
  /* One diagonal only. DRAFT wins when both apply: two overlapping stamps made
     the page unreadable, and DRAFT is the more urgent fact on the page. */
  const draft = !!(opts && opts.draft);
  const marks = [];
  if(draft) marks.push({ text:'DRAFT', rgb:[100,116,139], op:0.12 });
  else if(DEMO) marks.push({ text:'DEMO', rgb:[15,23,42], op:0.10 });
  if(!marks.length) return;
  const total = doc.internal.getNumberOfPages();
  for(let i = 1; i <= total; i++){
    doc.setPage(i);
    marks.forEach((m, mi) => {
      let restore = false;
      try{ doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity:m.op })); restore = true; }
      catch(e){ /* older jsPDF: fall back to a pale colour instead of alpha */ }
      doc.setTextColor(restore ? m.rgb[0] : 226, restore ? m.rgb[1] : 232, restore ? m.rgb[2] : 240);
      doc.setFont('helvetica','bold'); doc.setFontSize(52);
      for(let row = 0; row < 4; row++) doc.text(m.text, 105, 62 + row*62 + mi*22, { align:'center', angle:32 });
      if(restore){ try{ doc.restoreGraphicsState(); }catch(e){} }
    });
    /* The footer still states both facts — it is one small line, and a demo
       report must never be mistakable for a real one. */
    const notes = [];
    if(draft) notes.push('DRAFT — NOT YET SIGNED OFF');
    if(DEMO) notes.push('SAMPLE DATA — NOT A REAL INSPECTION');
    if(notes.length){
      doc.setFont('helvetica','bold'); doc.setFontSize(7);
      doc.setTextColor(DEMO ? 185 : 100, DEMO ? 28 : 116, DEMO ? 28 : 139);
      doc.text(notes.join('     ·     '), 105, 292, { align:'center' });
    }
    doc.setTextColor(15,23,42);
  }
}
const DEMO_XL_NOTE = 'DEMO — SAMPLE DATA, NOT A REAL INSPECTION RECORD';

/* ================= PDF REPORT ================= */
function buildPirPdf(job, settings, save=true){
  const doc = new jspdf.jsPDF({ unit:'mm', format:'a4', compress:true });
  const W = 210, M = 12, BOT = 272;
  const p = job.pir || {};
  const a = audit(job);
  const rgb1 = hexToRgb(settings.c1);
  const rgb2 = hexToRgb(settings.c2);
  const onC1 = textOn(settings.c1) === '#ffffff' ? [255,255,255] : [15,23,42];
  /* jsPDF's built-in fonts cannot encode ohm or delta, so use plain words. */
  const OHM = 'ohms', MOHM = 'Mohms';

  /* Page 1 gets the full banner; later pages get a slim rule, so the report
     stops spending a fifth of every page repeating itself. */
  let firstPage = true;
  const head = () => {
    const stops = brandStops(settings);
    if(firstPage){
      firstPage = false;
      gradBand(doc, 0, 0, W, 15, stops);
      let tx = M;
      if(settings.logo){
        try{
          const pr = doc.getImageProperties(settings.logo);
          const fit = fitBox(pr.width, pr.height, 22, 9);
          const ly = 3 + (9 - fit.h)/2;
          if(settings.logoBox !== false){ doc.setFillColor(255,255,255); doc.roundedRect(M-1.2, ly-1.2, fit.w+2.4, fit.h+2.4, 1.2, 1.2, 'F'); }
          doc.addImage(settings.logo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, ly, fit.w, fit.h, undefined, 'FAST');
          tx = M + fit.w + 5;
        }catch(e){}
      }
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      doc.text('PERIODIC INSPECTION REPORT', tx, 7.6);
      doc.setFont('helvetica','normal'); doc.setFontSize(6.6);
      doc.text([settings.companyName, settings.regNo && ('Reg ' + settings.regNo)].filter(Boolean).join('   ·   '), tx, 11.6);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
      doc.text(job.prNo || '', W - M, 7.6, { align:'right' });
      doc.setFont('helvetica','normal'); doc.setFontSize(6.6);
      doc.text(fmtDate(job.date), W - M, 11.6, { align:'right' });
      doc.setTextColor(15,23,42);
      return 22;
    }
    gradBand(doc, 0, 0, W, 4, stops);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(120,133,150);
    doc.text((settings.companyName || '').toUpperCase() + '   ·   PERIODIC INSPECTION REPORT', M, 9);
    doc.text([job.prNo, fmtDate(job.date)].filter(Boolean).join('   ·   '), W - M, 9, { align:'right' });
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.2); doc.line(M, 11.5, W - M, 11.5);
    doc.setTextColor(15,23,42);
    return 18;
  };

  let y = head();

  /* At-a-glance strip: the three things anyone opening this looks for first. */
  const badge = a.condition === 'Unsatisfactory' ? [220,38,38] : a.condition === 'Satisfactory' ? [5,150,105] : [148,163,184];
  doc.setFillColor(248,250,252); doc.roundedRect(M, y - 3, W - M*2, 17, 2, 2, 'F');
  doc.setFillColor(badge[0],badge[1],badge[2]); doc.rect(M, y - 3, 1.6, 17, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(15,23,42);
  doc.text(doc.splitTextToSize(job.customerName || 'Site', 104)[0], M + 5, y + 3);
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(100,116,139);
  doc.text(doc.splitTextToSize(job.address || '', 104)[0], M + 5, y + 8);
  [
    ['CONDITION', a.condition || 'Not recorded', badge],
    ['OBSERVATIONS', String(a.obs.length) + (a.urgent.length ? ' (' + a.urgent.length + ' urgent)' : ''), a.urgent.length ? [220,38,38] : [15,23,42]],
    ['NEXT DUE', fmtDate(addInterval(job.date, p.intervalValue, p.intervalUnit)) || '—', [15,23,42]]
  ].forEach((f, i) => {
    const fx = M + 116 + i*24;
    doc.setFont('helvetica','bold'); doc.setFontSize(5.2); doc.setTextColor(148,163,184);
    doc.text(f[0], fx, y + 1);
    doc.setFontSize(6.8); doc.setTextColor(f[2][0], f[2][1], f[2][2]);
    doc.text(doc.splitTextToSize(String(f[1]), 23), fx, y + 5.5);
  });
  doc.setTextColor(15,23,42);
  y += 21;
  const room = (need) => { if(y + need > BOT){ doc.addPage(); y = head(); } };

  const tick = (x, yy, on) => {
    doc.setDrawColor(120,133,150); doc.setLineWidth(0.25);
    doc.rect(x, yy - 2.7, 3.4, 3.4);
    if(on){
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1);
      doc.text('X', x + 0.7, yy + 0.1);
      doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    }
  };
  const opts = (x, yy, list, val) => {
    let cx = x;
    doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(15,23,42);
    list.forEach(o => {
      doc.text(o, cx, yy);
      const w = doc.getTextWidth(o);
      tick(cx + w + 1.5, yy, val === o);
      cx += w + 9;
    });
  };
  const line = (label, val, x, yy, w) => {
    doc.setFontSize(7.2); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
    doc.text(label, x, yy);
    const lw = doc.getTextWidth(label);
    doc.setDrawColor(210,218,228); doc.setLineWidth(0.2);
    doc.line(x + lw + 2, yy + 0.9, x + w, yy + 0.9);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    doc.text(String(val || ''), x + lw + 3.5, yy);
    doc.setFont('helvetica','normal');
  };
  const sect = (t) => {
    room(12);
    doc.setFillColor(240,244,248); doc.rect(M, y - 4.2, W - M*2, 6.4, 'F');
    doc.setFillColor(...rgb2); doc.rect(M, y - 4.2, 1.6, 6.4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1);
    doc.text(t.toUpperCase(), M + 4, y);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    y += 8;
  };

  const COL2 = 108, HALF = 90;

  sect('Registered contractor');
  line('Name', settings.companyName, M, y, 96); line('Reg No.', settings.regNo, COL2, y, COL2+HALF); y += 7;
  line('Address', settings.address, M, y, 96); line('Phone', settings.phone, COL2, y, COL2+HALF); y += 9;

  sect('Installation details');
  line('Occupant / trading as', p.occupant || job.customerName, M, y, 96);
  line('Approx age', p.approxAge, COL2, y, COL2+HALF); y += 7;
  line('Address', job.address, M, y, 96);
  doc.setFontSize(7.2); doc.setTextColor(100,116,139);
  doc.text('Occupant in attendance?', COL2, y);
  doc.setTextColor(15,23,42);
  opts(COL2 + 40, y, ['Yes','No'], p.occupantAttended); y += 9;

  sect('Category and reason');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Installation category', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 42, y, ['Domestic','Commercial','Industrial','Other'], p.category); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Reason for inspection', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 42, y, ['Insurance Inspection','Safety Audit','Other'], p.reason); y += 6.5;
  if(p.reasonOther){ line('If other, specify', p.reasonOther, M, y, W - M); y += 7; }
  y += 2;

  sect('Extent of installation covered by this report');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Entire installation?', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 40, y, ['Yes','No'], p.entireInstall); y += 5.5;
  doc.setFontSize(6.5); doc.setTextColor(120,133,150);
  doc.text('Cables concealed within trunking, conduit, the fabric of the building or underground have not been inspected unless stated otherwise.', M, y);
  doc.setTextColor(15,23,42); y += 5;
  if(p.entireInstall === 'No'){
    doc.setFontSize(7.2);
    const ls = doc.splitTextToSize('This report refers to: ' + (p.partialDetail || ''), W - M*2);
    room(ls.length*4 + 4);
    doc.text(ls, M, y); y += ls.length*4 + 2;
  }
  y += 3;

  sect('Supply characteristics');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Type of system earthing', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 46, y, ['TNCS','TT','TNS','IT'], p.earthing); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Installation voltage', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 46, y, ['Single Phase','Three Phase'], p.phase); y += 6.5;
  const volts = [['L1',p.v1],['L2',p.v2],['L3',p.v3],['L1-L2',p.v12],['L2-L3',p.v23],['L3-L1',p.v31]].filter(v => v[1]);
  if(volts.length){
    let vx = M;
    volts.forEach(v => { line(v[0], v[1] + ' V', vx, y, vx + 26); vx += 31; });
    y += 7;
  }
  line('Max prospective S/C current (A)', p.pscc, M, y, 96);
  line('Nominal rating (A)', p.nominalRating, COL2, y, COL2+HALF); y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Main isolation / overcurrent device', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 62, y, ['None','Switch Fuse','MCB','MCCB'], p.mainIsolation); y += 7;
  line('If main RCD: rated current In (A)', p.mainRcdIn, M, y, 96);
  line('Tripping current (mA)', p.mainRcdIdn, COL2, y, COL2+HALF); y += 4;

  /* ---------- the questions ----------
     Flows on from the supply section rather than starting a fresh page. A forced
     break here left the bottom half of page 1 empty for no reason. */

  sect('Inspection checks');

    if(val === 'No'){
      doc.setFillColor(254,242,242); doc.rect(M-1.5, y-3.4, W - M*2 + 3, h, 'F');
      doc.setDrawColor(220,38,38); doc.setLineWidth(0.7); doc.line(M-1.5, y-3.4, M-1.5, y-3.4+h);
    }
    doc.setTextColor(15,23,42);
    doc.text(lines, M + 2, y);
    let bx = ANSX;
    ['Yes','No'].concat(na ? ['N/A'] : []).forEach(o => {

      doc.autoTable({

        theme:'grid', styles:{ fontSize:7, cellPadding:1.6, lineColor:[210,218,228], minCellHeight:6 },
        headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7, fontStyle:'bold' },
        columnStyles:{ 1:{ cellWidth:32, halign:'center' }, 2:{ cellWidth:40, halign:'center' } },
        didParseCell: function(d){

          }

      y = doc.lastAutoTable.finalY + 7;
    } else {
      g.items.forEach(it => drawQ(it[0], it[1], it[2]));
      y += 3;

  /* ---------- summary and declaration ---------- */
  y += 4;
  sect('Summary test data');
  line('Min insulation resistance (' + MOHM + ')', p.minIR, M, y, 96);
  line('Max resistance of protective conductor (' + OHM + ')', p.maxRp, COL2, y, COL2+HALF); y += 7;
  line('Max fault loop impedance (' + OHM + ')', p.maxZs, M, y, 96);
  line('Associated device type / size', [p.zsDeviceType, p.zsDeviceSize].filter(Boolean).join(' '), COL2, y, COL2+HALF); y += 9;

  sect('Quality of workmanship');
  opts(M, y, ['Very Good','Satisfactory','Poor'], p.workmanship); y += 9;

  sect('Test instrument serial numbers');
  line('Continuity tester', p.instContinuity, M, y, 96);
  line('Insulation resistance tester', p.instIR, COL2, y, COL2+HALF); y += 7;
  line('Loop impedance tester', p.instLoop, M, y, 96);
  line('RCD tester', p.instRcd, COL2, y, COL2+HALF); y += 9;

  sect('Observations and recommendations');
  opts(M, y, ['No remedial work is required','The following observations are made'], p.noRemedial); y += 6;
  const obsRows = a.obs;
  doc.autoTable({
    startY: y, margin:{ left:M, right:M },

  doc.setFontSize(6.6); doc.setTextColor(100,116,139);
  doc.text('Each observation is given one of the following numbers to indicate the action recommended:', M, y); y += 3.3;
  doc.text('(1) Requires urgent attention     (2) Requires improvements     (3) Requires some attention     (4) Does not comply with current National Rules for Electrical Installations.', M, y); y += 3.3;
  doc.text('Using (4) does not necessarily imply that the electrical installation inspected is unsafe.', M, y); y += 6;
  doc.setTextColor(15,23,42);

  if(a.urgent.length){

    doc.setFillColor(220,38,38); doc.rect(M, y-4, W - M*2, 7.5, 'F');

    doc.text('URGENT ATTENTION REQUIRED. The person responsible for the installation must be notified without delay.', M + 3, y + 0.8);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); y += 11;
  }

  doc.setFontSize(7.4);
  const rec = doc.splitTextToSize('On the basis that all observations requiring urgent attention have been completed without delay, we recommend that this installation is further inspected and tested after an interval of not more than ' +
    (p.intervalValue || '____') + ' ' + (p.intervalUnit || 'years') + '.', W - M*2);
  room(rec.length*4 + 6);
  doc.text(rec, M, y); y += rec.length*4 + 5;

  sect('Overall condition of the installation');
  opts(M, y, ['Satisfactory','Unsatisfactory'], a.condition); y += 12;

  sect('Declaration');
  doc.setFontSize(6.8); doc.setTextColor(100,116,139);
  const dec = doc.splitTextToSize('I/We are responsible for the inspection and testing of the electrical installation described in this report, and confirm to the best of my/our knowledge that the tests and observations recorded represent an accurate assessment, within the limits specified, of the condition of the electrical installation.', W - M*2);
  doc.text(dec, M, y); y += dec.length*3.2 + 6;
  doc.setTextColor(15,23,42);

  const sg = job.sig || {};
  room(26);
  if(sg.sig){ try{ doc.addImage(sg.sig, 'PNG', M + 2, y - 1, 44, 15); }catch(e){} }
  const sy = y + 16;
  doc.setDrawColor(150,163,180); doc.setLineWidth(0.25);
  doc.line(M, sy, M + 62, sy);
  doc.line(M + 70, sy, M + 124, sy);
  doc.line(M + 132, sy, W - M, sy);
  doc.setFontSize(7.4); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
  doc.text((sg.name || '').toUpperCase(), M + 2, sy - 2);
  doc.text(p.certifierNo || '', M + 72, sy - 2);
  doc.text(fmtDate(sg.date || job.date), M + 134, sy - 2);
  doc.setFontSize(6.6); doc.setFont('helvetica','normal'); doc.setTextColor(120,133,150);
  doc.text('Inspected and tested by (signed)', M, sy + 3.6);
  doc.text('Certifier No.', M + 70, sy + 3.6);
  doc.text('Date', M + 132, sy + 3.6);

  /* ---------- photos ---------- */
  const pics = (job.photos || []).filter(ph => ph.data);
  if(pics.length){
    y += 6;
    room(70);          /* only break if a row of photos will not fit */
    sect('Photographs');
    let px = M, rowH = 0;
    pics.forEach(ph => {
      const w = 60, h = 45;
      if(px + w > W - M){ px = M; y += rowH + 10; rowH = 0; }
      room(h + 14);
      try{ doc.addImage(ph.data, 'JPEG', px, y, w, h, undefined, 'FAST'); }catch(e){}
      doc.setFontSize(6.6); doc.setTextColor(100,116,139);
      const cap = doc.splitTextToSize((ph.obsRef ? 'Obs ' + ph.obsRef + ' — ' : '') + (ph.caption || ''), w);
      doc.text(cap.slice(0,2), px, y + h + 3.5);
      doc.setTextColor(15,23,42);
      rowH = Math.max(rowH, h + 6);
      px += w + 5;
    });
  }

  /* ---------- page furniture ---------- */
  const total = doc.internal.getNumberOfPages();
  for(let i=1; i<=total; i++){
    doc.setPage(i);
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.25);
    doc.line(M, 283, W - M, 283);
    doc.setFontSize(6.4); doc.setFont('helvetica','normal'); doc.setTextColor(140,152,168);
    if(settings.disclaimer !== false){
      doc.text('This report is issued for record purposes. The official Safe Electric Periodic Inspection Report must still be completed and submitted.', M, 287);
    }
    doc.setTextColor(100,116,139); doc.setFont('helvetica','bold'); doc.setFontSize(6.8);
    doc.text('Page ' + i + ' of ' + total, W - M, 287, { align:'right' });
  }

  stampWatermarks(doc, { draft: !a.complete });
  if(save) doc.save((!a.complete ? 'DRAFT-' : DEMO ? 'DEMO-' : '') + 'PIR-' + safeName(job.customerName) + '-' + (job.date || todayInput()) + '.pdf');
  return doc;
}

/* ================= SEND TO THE OFFICE ================= */
/* Best route by a distance: hand the PDF to Apps Script and let the server send
   it, attachment and all. It behaves the same on every phone, needs no share
   sheet, and leaves a record in the Log tab. The share sheet and mailto paths
   below are only the fallback for a device with no access code or no signal. */
async function emailViaServer(job, settings, blob){
  const b64 = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
  return API.call('emailReport', {
    subject: mailSubject(job),
    body: mailBody(job, settings),
    filename: mailFilename(job),
    fromName: settings.companyName || 'Periodic Inspections',
    pdfBase64: b64
  });
}

function mailSubject(job){
  const a = audit(job);
  return (DEMO ? '[DEMO] ' : '') + (a.complete ? '' : '[DRAFT] ')
    + 'Periodic inspection · ' + (job.customerName || 'site') + (job.prNo ? ' · ' + job.prNo : '');
}
function mailBody(job, settings){
  const a = audit(job);
  return [
    'Site: ' + (job.customerName || ''),
    'Address: ' + (job.address || ''),
    (job.lat && job.lng) ? 'Location: ' + job.lat + ', ' + job.lng : '',
    'Date: ' + fmtDate(job.date),
    'Inspector: ' + (job.inspector || (job.sig||{}).name || ''),
    'Condition: ' + (a.condition || 'not recorded'),
    'Observations: ' + a.obs.length + (a.urgent.length ? ' (' + a.urgent.length + ' requiring urgent attention)' : ''),
    'Next due: ' + (fmtDate(addInterval(job.date, (job.pir||{}).intervalValue, (job.pir||{}).intervalUnit)) || 'not set'),
    '',
    a.complete ? '' : 'NOTE: this is a DRAFT — the inspection is not signed off yet.',
    DEMO ? 'NOTE: DEMO build. Sample data, not a real inspection.' : '',
    '',
    'Sent from the ' + (settings.companyName || '') + ' inspection app.'
  ].filter(Boolean).join('\n');
}
function mailFilename(job){
  const a = audit(job);
  /* One prefix, matching the watermark: DRAFT wins over DEMO. */
  return (!a.complete ? 'DRAFT-' : DEMO ? 'DEMO-' : '') + 'PIR-' + safeName(job.customerName) + '.pdf';
}

async function emailToOffice(job, settings, toast){
  const office = (settings.officeEmail || '').trim();
  const subject = mailSubject(job);
  const body = mailBody(job, settings);
  const fname = mailFilename(job);
  const blob = buildPirPdf(job, settings, false).output('blob');

  /* Preferred path: the server sends it, with the PDF really attached. */
  if(API.on){
    try{
      const res = await emailViaServer(job, settings, blob);
      toast('Emailed to the office' + (res && res.to ? ' (' + res.to + ')' : ''));
      return;
    }catch(e){
      toast('Server send failed — falling back');
    }
  }

  try{
    const file = new File([blob], fname, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: subject, text: body });
      toast('Shared');
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;   /* user closed the share sheet */
  }

  downloadBlob(blob, fname);
  window.location.href = 'mailto:' + encodeURIComponent(office)
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body + '\n\nThe PDF has just been saved to this device — attach it to this email.');
  toast('PDF saved — attach it to the email');
}

async function buildJobsExcel(jobs, settings){

  const styleHeader = (ws, row, cols) => {
    const r = ws.getRow(row);
    r.font = { bold:true, color:{ argb:'FFFFFFFF' }, size:10 };
    r.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: head1 } };
    r.height = 20;
    r.alignment = { vertical:'middle' };
    ws.autoFilter = { from:{ row:row, column:1 }, to:{ row:row, column:cols } };
    ws.views = [{ state:'frozen', ySplit: row }];
  };
  const banner = (ws, title, cols) => {
    ws.mergeCells(1, 1, 1, cols);
    const c = ws.getCell(1,1);

    c.alignment = { vertical:'middle', horizontal:'left', indent:1 };
    ws.getRow(1).height = 24;
  };

  /* --- Inspections --- */
  const ws = wb.addWorksheet('Inspections');
  const cols = ['PR No','Date','Site / customer','Address','Category','Reason','Inspector',
                'Condition','Observations','Urgent (C1)','Questions answered','Next due','Signed'];
  banner(ws, 'Periodic inspections', cols.length);
  ws.addRow([]);
  ws.addRow(cols);
  styleHeader(ws, 3, cols.length);
  jobs.forEach(j => {
    const a = audit(j), p = j.pir || {};
    ws.addRow([
      j.prNo || '', j.date || '', j.customerName || '', j.address || '',
      p.category || '', p.reason || '', j.inspector || (j.sig||{}).name || '',
      a.condition || '', a.obs.length, a.urgent.length,
      a.answered + ' of ' + a.total,
      addInterval(j.date, p.intervalValue, p.intervalUnit),
      (j.sig||{}).sig ? 'Yes' : 'No'

  });
  ws.columns.forEach((c, i) => { c.width = [10,12,26,34,14,20,18,14,13,12,18,12,9][i] || 14; });
  ws.eachRow((row, n) => {
    if(n < 4) return;
    if(String(row.getCell(8).value) === 'Unsatisfactory'){
      row.getCell(8).font = { bold:true, color:{ argb:'FFB91C1C' } };
    }
    if(Number(row.getCell(10).value) > 0){
      row.getCell(10).font = { bold:true, color:{ argb:'FFB91C1C' } };
    }
  });

  /* --- Observations --- */
  const wo = wb.addWorksheet('Observations');
  const ocols = ['Date','Site / customer','Ref','Observation','Code','Meaning'];
  banner(wo, 'Observations and recommendations', ocols.length);
  wo.addRow([]); wo.addRow(ocols);
  styleHeader(wo, 3, ocols.length);
  jobs.forEach(j => {
    ((j.pir||{}).obs || []).filter(o => (o.comment||'').trim()).forEach((o, i) => {
      wo.addRow([j.date || '', j.customerName || '', o.ref || String(i+1), o.comment, o.code, PIR_CODES[o.code] || '']);
    });
  });
  wo.columns.forEach((c, i) => { c.width = [12,26,8,60,7,34][i] || 14; });
  wo.eachRow((row, n) => { if(n > 3 && String(row.getCell(5).value) === '1'){ row.font = { bold:true, color:{ argb:'FFB91C1C' } }; } });

  /* --- Question results --- */
  const wq = wb.addWorksheet('Question results');
  const qnums = pirQFlat();
  const qcols = ['Date','Site / customer'].concat(qnums.map(n => 'Q' + n));
  banner(wq, 'Answers to every question', qcols.length);
  wq.addRow([]); wq.addRow(qcols);
  styleHeader(wq, 3, qcols.length);
  jobs.forEach(j => {
    const q = (j.pir||{}).q || {};
    wq.addRow([j.date || '', j.customerName || ''].concat(qnums.map(n => q['q'+n] || '')));
  });
  wq.getColumn(1).width = 12; wq.getColumn(2).width = 26;
  qnums.forEach((n, i) => { wq.getColumn(i + 3).width = 6; });
  wq.eachRow((row, rn) => {
    if(rn < 4) return;
    row.eachCell((cell, cn) => { if(cn > 2 && cell.value === 'No'){ cell.font = { bold:true, color:{ argb:'FFB91C1C' } }; } });
  });

  /* --- Question key --- */
  const wk = wb.addWorksheet('Question key');
  banner(wk, 'What each question number means', 2);
  wk.addRow([]); wk.addRow(['Question','Text']);
  styleHeader(wk, 3, 2);
  qnums.forEach(n => wk.addRow(['Q' + n, Q_TEXT[n]]));
  wk.getColumn(1).width = 10; wk.getColumn(2).width = 80;

  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
