/* Demo records are signed, otherwise every sample inspection reads as
   unfinished. The squiggle is drawn from the id, so it is stable per record. */
function demoSignature(seedStr){
  const c = document.createElement('canvas');
  c.width = 260; c.height = 90;
  const x = c.getContext('2d');
  let s = 7;
  for(let i = 0; i < seedStr.length; i++) s = (s*31 + seedStr.charCodeAt(i)) % 2147483647;
  const rnd = () => { s = (s*1103515245 + 12345) % 2147483648; return s/2147483648; };
  x.strokeStyle = '#0f172a'; x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath();
  let px = 18, py = 62;
  x.moveTo(px, py);
  for(let i = 0; i < 6; i++){
    const nx = px + 26 + rnd()*14, ny = 50 + rnd()*20;
    x.bezierCurveTo(px + 8 + rnd()*14, py - 28 - rnd()*18, px + 18 + rnd()*14, py + 8 + rnd()*16, nx, ny);
    px = nx; py = ny;
  }
  x.stroke();
  return c.toDataURL('image/png');
}

function makeDemoJobs(n = 26){
  /* Deterministic pseudo-random, so a demo shown twice looks the same. */
  let seed = 20260810;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const jobs = [];
  for(let i = 0; i < n; i++){
    const site = DEMO_SITES[i % DEMO_SITES.length];
    const j = blankJob();
    const d = new Date();
    d.setDate(d.getDate() - Math.floor(rnd() * 420));
    j.id = 'demo-' + i;
    j.date = d.toISOString().slice(0,10);
    j.prNo = 'PR-' + (2400 + i);
    j.customerName = site[0];
    j.address = site[1];
    j.lat = site[4]; j.lng = site[5];
    j.inspector = pick(DEMO_INSPECTORS);
    const p = j.pir;
    p.category = site[2];
    p.reason = site[3];
    p.occupant = site[0];
    p.occupantAttended = rnd() > 0.4 ? 'Yes' : 'No';
    p.approxAge = (5 + Math.floor(rnd() * 35)) + ' years';
    p.entireInstall = rnd() > 0.25 ? 'Yes' : 'No';
    if(p.entireInstall === 'No') p.partialDetail = 'Distribution board DB2 and associated final circuits only.';
    p.earthing = rnd() > 0.3 ? 'TNCS' : 'TT';
    p.phase = site[2] === 'Domestic' ? 'Single Phase' : (rnd() > 0.4 ? 'Three Phase' : 'Single Phase');
    p.v1 = String(228 + Math.floor(rnd() * 12));
    if(p.phase === 'Three Phase'){ p.v2 = String(228 + Math.floor(rnd()*12)); p.v3 = String(228 + Math.floor(rnd()*12)); p.v12 = '400'; p.v23 = '400'; p.v31 = '400'; }
    p.pscc = String(1 + Math.floor(rnd() * 6)) + '.2';
    p.mainIsolation = pick(['Switch Fuse','MCB','MCCB']);
    p.nominalRating = pick(['63','80','100','125']);
    p.minIR = (rnd() > 0.85 ? (0.4 + rnd()*0.5) : (2 + rnd() * 198)).toFixed(1);
    p.maxRp = (0.05 + rnd() * 0.5).toFixed(2);
    p.maxZs = (0.2 + rnd() * 1.2).toFixed(2);
    p.zsDeviceType = pick(['B','C']); p.zsDeviceSize = pick(['16A','20A','32A','40A']);
    p.workmanship = rnd() > 0.75 ? 'Very Good' : (rnd() > 0.15 ? 'Satisfactory' : 'Poor');
    p.instContinuity = 'MFT-' + (1000 + Math.floor(rnd()*900));
    p.instIR = p.instContinuity; p.instLoop = p.instContinuity; p.instRcd = p.instContinuity;
    p.q17type = rnd() > 0.2 ? 'Mcb' : 'Fuse';
    p.rcds = [
      { id: uid(), desc:'Sockets', trip:'30', time: String(20 + Math.floor(rnd()*40)) },
      { id: uid(), desc:'Lighting', trip:'30', time: String(20 + Math.floor(rnd()*40)) }
    ];
    if(rnd() > 0.85) p.rcds.push({ id: uid(), desc:'External supply', trip:'30', time: String(310 + Math.floor(rnd()*60)) });

    /* Answer every question, with a realistic scatter of "No". */
    const failCount = Math.floor(rnd() * 4);
    const nums = pirQFlat();
    const failing = [];
    for(let f = 0; f < failCount; f++) failing.push(pick(nums));
    nums.forEach(nq => { p.q['q'+nq] = failing.indexOf(nq) > -1 ? 'No' : (rnd() > 0.94 ? 'N/A' : 'Yes'); });

    const obsN = failCount + (rnd() > 0.6 ? 1 : 0);
    p.obs = [];
    for(let o = 0; o < obsN; o++){
      const src = pick(DEMO_OBS);
      p.obs.push({ id: uid(), ref: String(o+1), comment: src[0], code: src[1] });
    }
    p.noRemedial = p.obs.length ? 'The following observations are made' : 'No remedial work is required';
    p.intervalValue = site[2] === 'Domestic' ? '10' : '3';
    p.intervalUnit = 'years';
    p.condition = p.obs.some(o => o.code === '1') ? 'Unsatisfactory' : (rnd() > 0.1 ? 'Satisfactory' : 'Unsatisfactory');
    p.certifierNo = 'CN-' + (700 + Math.floor(rnd()*200));
    j.sig = { name: j.inspector, sig: demoSignature(j.id + j.inspector), date: j.date };
    j.createdAt = j.updatedAt = new Date(j.date).toISOString();
    jobs.push(j);
  }
  return jobs.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
}

/* ================= JOB EDITOR ================= */
const TABS = ['Site','Supply','Checks','Findings','Sign off'];

function JobEditor({job, setJob, settings, customers, saveCustomers, toast, back}){
  const [tab, setTab] = useState('Site');
  const p = job.pir || {};
  const up = (patch) => setJob(Object.assign({}, job, patch, { updatedAt: nowISO() }));
  const submit = () => up({ submitted: nowISO(), sig: Object.assign({}, job.sig, { name: job.inspector, date: job.date }) });
  const [sending, setSending] = useState(false);

  /* The inspector and the person signing the declaration are the same person.
     Kept as one value so it can never be recorded two different ways. */
  const setInspector = (v) => up({ inspector: v, sig: Object.assign({}, job.sig, { name: v }) });

  /* Moving tab always returns to the top, otherwise the next tab opens
     halfway down and looks broken on a phone. */
  const goTab = (t) => {
    setTab(t);
    requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
  };
  const tabIndex = TABS.indexOf(tab);

  /* Everything standing between this record and a submission, in plain words.
     A periodic report that goes in half answered is worse than no report. */
  const blockers = (() => {
    const out = [];
    const q = audit(job);
    if(!job.customerName || !job.customerName.trim()) out.push('The site needs a name (Site tab).');
    if(!job.address || !job.address.trim()) out.push('The site needs an address (Site tab).');
    if(!p.category) out.push('Installation category is not set (Site tab).');
    if(!p.reason) out.push('Reason for inspection is not set (Site tab).');
    if(!p.entireInstall) out.push('Extent of the installation is not stated (Site tab).');
    if(!p.earthing) out.push('System earthing is not recorded (Supply tab).');
    if(!p.phase) out.push('Installation voltage is not recorded (Supply tab).');
    if(q.unanswered.length) out.push(q.unanswered.length + ' check' + (q.unanswered.length===1?'':'s') + ' unanswered: ' + q.unanswered.join(', ') + ' (Checks tab).');
    const missingObs = q.nos.length > 0 && q.obs.length === 0;
    if(missingObs) out.push('Checks answered "No" must be written up as observations (Findings tab).');
    if(!p.workmanship) out.push('Quality of workmanship is not rated (Findings tab).');
    if(!p.condition) out.push('Overall condition is not recorded.');
    if(!p.intervalValue) out.push('Re-inspection interval is not set.');
    if(!(job.sig||{}).name || !(job.sig||{}).name.trim()) out.push('The report is not attributed to anyone.');
    if(!(job.sig||{}).sig) out.push('The declaration is not signed.');
    return out;
  })();
  const setP = (patch) => up({ pir: Object.assign({}, p, patch) });
  const setQ = (n, v) => setP({ q: Object.assign({}, p.q || {}, { ['q'+n]: v }) });
  const a = audit(job);

  const addObs = () => setP({ obs: [...(p.obs||[]), { id: uid(), ref: String((p.obs||[]).length + 1), comment:'', code:'3' }] });
  const upObs = (id, patch) => setP({ obs: (p.obs||[]).map(o => o.id === id ? Object.assign({}, o, patch) : o) });
  const delObs = (id) => setP({ obs: (p.obs||[]).filter(o => o.id !== id) });
  const addRcd = () => setP({ rcds: [...(p.rcds||[]), { id: uid(), desc:'', trip:'30', time:'' }] });
  const upRcd = (id, patch) => setP({ rcds: (p.rcds||[]).map(r => r.id === id ? Object.assign({}, r, patch) : r) });
  const delRcd = (id) => setP({ rcds: (p.rcds||[]).filter(r => r.id !== id) });

  const addPhotos = async (files) => {
    const list = Array.from(files || []).slice(0, 8);
    const out = [];
    for(const f of list){
      try{ out.push({ id: uid(), data: await compressImage(f), caption:'', obsRef:'', ts: nowISO() }); }catch(e){}
    }
    if(out.length){ up({ photos: [...(job.photos||[]), ...out] }); toast(out.length + ' photo' + (out.length===1?'':'s') + ' added'); }
  };

  return (<div className="pb-28">
    {/* Sticky under the header so the tabs — and the count of checks still
        outstanding — stay reachable however far down a long tab you are. */}
    <div className="scrollx -mx-4 px-4 mb-4 sticky z-30 py-2" style={{ top:'var(--hdr)', background:'#f1f5f9' }}>
      <div className="flex gap-2 w-max">
        {TABS.map(t => {
          const flag = t === 'Checks' && a.unanswered.length > 0;
          return <button key={t} className={'tabbtn ' + (tab===t ? 'on' : 'off')} onClick={()=>goTab(t)}>
            {t}{flag && <span className="ml-1.5 text-[10px] font-bold" style={{color: tab===t ? 'var(--c3)' : '#cd7f32'}}>{a.unanswered.length}</span>}
          </button>;
        })}
      </div>
    </div>

    <div className="space-y-4">
      {tab === 'Site' && (<>
        <div className="rounded-xl border p-3 text-xs" style={{ borderColor:'#fcd9b6', background:'#fff8f1', color:'#7c4a17' }}>
          <b>Not an official Safe Electric report.</b> This records the same information for your own use. The official Periodic Inspection Report must still be completed and submitted.
        </div>
        <Section title="Report details">
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="PR No." value={job.prNo} onChange={v=>up({prNo:v})} placeholder="PR-0001"/>
            <Field label="Date of inspection" type="date" value={job.date} onChange={v=>up({date:v})} required/>
            <Field label="Inspector" value={job.inspector} onChange={setInspector} required
              hint="Also signs the declaration on the Sign off tab."/>
            <Field label="Installation approx age" value={p.approxAge} onChange={v=>setP({approxAge:v})} placeholder="e.g. 20 years"/>
          </div>
        </Section>
        <Section title="Site / customer" right={
          customers.length > 0 ? <select className="text-xs font-semibold bg-transparent" style={{color:'var(--c2)'}} value=""
            onChange={e=>{ const c = customers.find(x=>x.id===e.target.value);
              if(c) up({ customerId:c.id, customerName:c.name, address:c.address, phone:c.phone, email:c.email, lat:c.lat||'', lng:c.lng||'' }); }}>
            <option value="">Use saved site…</option>
            {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select> : null
        }>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Site / customer name" value={job.customerName} onChange={v=>up({customerName:v})} required/>
            <Field label="Occupant / trading as" value={p.occupant} onChange={v=>setP({occupant:v})}/>
            <div className="sm:col-span-2"><Field label="Address" value={job.address} onChange={v=>up({address:v})} required/></div>
            <Field label="Phone" value={job.phone} onChange={v=>up({phone:v})} inputMode="tel"/>
            <Field label="Email" value={job.email} onChange={v=>up({email:v})} type="email"/>
            <Dropdown label="Occupant in attendance?" value={p.occupantAttended} onChange={v=>setP({occupantAttended:v})} options={['Yes','No']}/>
          </div>
          <div className="mt-3 rounded-xl border border-slate-200 p-3">
            <div className="flex items-center justify-between gap-2 mb-2">
              <span className="text-[13px] font-semibold text-slate-600">Location</span>
              <button className="text-xs font-bold" style={{color:'var(--c2)'}} onClick={()=>{
                if(!navigator.geolocation) return toast('This device has no location service');
                toast('Getting location…');
                navigator.geolocation.getCurrentPosition(
                  pos => { up({ lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6) }); toast('Location captured'); },
                  err => toast(err.code === 1 ? 'Location permission refused' : 'Could not get a location'),
                  { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
                );
              }}>Use my location</button>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Field label="Latitude" value={job.lat} onChange={v=>up({lat:v})} inputMode="decimal" placeholder="51.8985"/>
              <Field label="Longitude" value={job.lng} onChange={v=>up({lng:v})} inputMode="decimal" placeholder="-8.4756"/>
            </div>
            <p className="text-xs text-slate-400 mt-2">
              Tap the button while standing at the board. Coordinates put the site on the client dashboard map and help the next
              person find it — handy when the address is "the yard behind the garage".
            </p>
          </div>
          {job.customerName && !job.customerId && (
            <button className="btn btn-o w-full mt-3 !min-h-[40px] text-sm" onClick={()=>{
              const c = { id: uid(), name: job.customerName, address: job.address, phone: job.phone, email: job.email,
                          lat: job.lat, lng: job.lng, updatedAt: nowISO() };
              saveCustomers(prev => [c, ...prev]); up({ customerId: c.id }); toast('Site saved for next time');
            }}>Save this site for next time</button>
          )}
        </Section>
        <Section title="Category and reason">
          <div className="grid sm:grid-cols-2 gap-3">
            <Dropdown label="Installation category" value={p.category} onChange={v=>setP({category:v})} options={['Domestic','Commercial','Industrial']} required/>
            <Dropdown label="Reason for inspection" value={p.reason} onChange={v=>setP({reason:v})} options={['Insurance Inspection','Safety Audit']} required/>
          </div>
          <div className="mt-3"><Field label="If other, specify" value={p.reasonOther} onChange={v=>setP({reasonOther:v})}/></div>
        </Section>
        <Section title="Extent of installation covered">
          <Dropdown label="Entire installation?" value={p.entireInstall} onChange={v=>setP({entireInstall:v})} options={['Yes','No']} required/>
          {p.entireInstall === 'No' && <div className="mt-3"><Field label="What this report refers to" value={p.partialDetail} onChange={v=>setP({partialDetail:v})} area required/></div>}
          <p className="text-xs text-slate-400 mt-2">Cables concealed within trunking, conduit or the fabric of the building have not been inspected unless stated otherwise.</p>
        </Section>
      </>)}

      {tab === 'Supply' && (<>
        <Section title="Supply characteristics">
          <div className="grid sm:grid-cols-3 gap-3">
            <Dropdown label="System earthing" value={p.earthing} onChange={v=>setP({earthing:v})} options={['TNCS','TT','TNS','IT']} required/>
            <Dropdown label="Installation voltage" value={p.phase} onChange={v=>setP({phase:v})} options={['Single Phase','Three Phase']} required/>
            <Field label="Max prospective S/C current (A)" value={p.pscc} onChange={v=>setP({pscc:v})} inputMode="decimal"/>
            <Field label="L1 (V)" value={p.v1} onChange={v=>setP({v1:v})} inputMode="decimal"/>
            {p.phase === 'Three Phase' && <Field label="L2 (V)" value={p.v2} onChange={v=>setP({v2:v})} inputMode="decimal"/>}
            {p.phase === 'Three Phase' && <Field label="L3 (V)" value={p.v3} onChange={v=>setP({v3:v})} inputMode="decimal"/>}
            {p.phase === 'Three Phase' && <Field label="L1-L2 (V)" value={p.v12} onChange={v=>setP({v12:v})} inputMode="decimal"/>}
            {p.phase === 'Three Phase' && <Field label="L2-L3 (V)" value={p.v23} onChange={v=>setP({v23:v})} inputMode="decimal"/>}
            {p.phase === 'Three Phase' && <Field label="L3-L1 (V)" value={p.v31} onChange={v=>setP({v31:v})} inputMode="decimal"/>}
            <Dropdown label="Main isolation device" value={p.mainIsolation} onChange={v=>setP({mainIsolation:v})} options={['None','Switch Fuse','MCB','MCCB']}/>
            <Field label="Nominal rating (A)" value={p.nominalRating} onChange={v=>setP({nominalRating:v})} inputMode="decimal"/>
          </div>
          <p className="text-xs text-slate-500 mt-3 mb-2">If a main RCD is used as the main isolating device:</p>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Rated current In (A)" value={p.mainRcdIn} onChange={v=>setP({mainRcdIn:v})} inputMode="decimal"/>
            <Field label="Tripping current IΔn (mA)" value={p.mainRcdIdn} onChange={v=>setP({mainRcdIdn:v})} inputMode="decimal"/>
          </div>
        </Section>
        <Section title="Summary test data">
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Min insulation resistance (MΩ)" value={p.minIR} onChange={v=>setP({minIR:v})} inputMode="decimal"
              className={parseFloat(p.minIR) > 0 && parseFloat(p.minIR) < 1 ? 'bad' : ''}/>
            <Field label="Max resistance of protective conductor (Ω)" value={p.maxRp} onChange={v=>setP({maxRp:v})} inputMode="decimal"/>
            <Field label="Max fault loop impedance (Ω)" value={p.maxZs} onChange={v=>setP({maxZs:v})} inputMode="decimal"/>
            <div className="grid grid-cols-2 gap-2">
              <Field label="Device type" value={p.zsDeviceType} onChange={v=>setP({zsDeviceType:v})} placeholder="B / C"/>
              <Field label="Device size" value={p.zsDeviceSize} onChange={v=>setP({zsDeviceSize:v})} placeholder="32A"/>
            </div>
          </div>
          {parseFloat(p.minIR) > 0 && parseFloat(p.minIR) < 1 &&
            <p className="text-xs text-red-600 font-semibold mt-2">Insulation resistance is below the 1 MΩ minimum. Raise this as an observation.</p>}
        </Section>
        <Section title="Test instrument serial numbers">
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Continuity tester" value={p.instContinuity} onChange={v=>setP({instContinuity:v})}/>
            <Field label="Insulation resistance tester" value={p.instIR} onChange={v=>setP({instIR:v})}/>
            <Field label="Loop impedance tester" value={p.instLoop} onChange={v=>setP({instLoop:v})}/>
            <Field label="RCD tester" value={p.instRcd} onChange={v=>setP({instRcd:v})}/>
          </div>
        </Section>
      </>)}

      {tab === 'Checks' && (<>
        <div className="card p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm font-bold text-slate-700">{a.answered} of {a.total} answered</span>
            {a.nos.length > 0 && <span className="chip chip-bad">{a.nos.length} answered No</span>}
          </div>
          <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
            <div className="h-full rounded-full transition-all" style={{ width: (a.answered/a.total*100) + '%', background:'var(--c2)' }}/>
          </div>
          {a.unanswered.length > 0 && (
            <p className="text-xs text-slate-400 mt-3">
              Still to answer: {a.unanswered.join(', ')}. Each one has to be answered on its own — there is no bulk "all Yes",
              because a signed report says you actually looked at every item.
            </p>
          )}
          {a.answered > 0 && (
            <button className="btn btn-g !min-h-[36px] !py-1.5 text-xs w-full mt-3"
              onClick={()=>{ if(confirm('Clear every answer on this inspection?')) setP({ q:{} }); }}>Clear all answers</button>
          )}
        </div>
        {PIR_Q.map(group => (
          <Section key={group.g} title={group.g}>
            {group.items.map(it => (
              <TriState key={it[0]} n={it[0]} label={it[1]} na={it[2]}
                value={(p.q||{})['q'+it[0]] || ''} onChange={v=>setQ(it[0], v)}/>
            ))}
            {group.g === 'Distribution board(s)' && (
              <div className="pt-3">
                <Dropdown label="17. Sub circuit isolation and overcurrent device type" value={p.q17type} onChange={v=>setP({q17type:v})} options={['Fuse','Mcb']}/>
              </div>
            )}
          </Section>
        ))}
        <Section title="20. RCDs" right={<button className="text-xs font-bold" style={{color:'var(--c2)'}} onClick={addRcd}>+ Add RCD</button>}>
          {(p.rcds||[]).length === 0 && <p className="text-sm text-slate-400">No RCDs added.</p>}
          {(p.rcds||[]).map(r => {
            const t = parseFloat(r.time);
            const bad = !isNaN(t) && t > 300;
            return (<div key={r.id} className="grid grid-cols-12 gap-2 mb-2 items-end">
              <div className="col-span-5"><Field label="Circuit description" value={r.desc} onChange={v=>upRcd(r.id,{desc:v})} placeholder="Sockets"/></div>
              <div className="col-span-3"><Field label="Trip current (mA)" value={r.trip} onChange={v=>upRcd(r.id,{trip:v})} inputMode="decimal"/></div>
              <div className="col-span-3"><Field label="Longest time (ms)" value={r.time} onChange={v=>upRcd(r.id,{time:v})} inputMode="decimal" className={bad ? 'bad' : ''}/></div>
              <div className="col-span-1"><button className="btn btn-g w-full !px-0" onClick={()=>delRcd(r.id)}>✕</button></div>
              {bad && <div className="col-span-12 text-xs text-red-600 font-semibold -mt-1">Trip time over 300 ms. Raise an observation.</div>}
            </div>);
          })}
        </Section>
      </>)}

      {tab === 'Findings' && (<>
        <Section title="Quality of workmanship">
          <Seg value={p.workmanship} onChange={v=>setP({workmanship:v})} options={['Very Good','Satisfactory','Poor']}/>
        </Section>
        <Section title="Observations" right={<button className="text-xs font-bold" style={{color:'var(--c2)'}} onClick={addObs}>+ Add observation</button>}>
          <Seg value={p.noRemedial} onChange={v=>setP({noRemedial:v})} options={['No remedial work is required','The following observations are made']}/>
          {a.nos.length > 0 && p.noRemedial === 'No remedial work is required' && (
            <p className="text-xs text-red-600 font-semibold mt-2">Questions {a.nos.join(', ')} were answered "No". These must be referred to in the observations.</p>
          )}
          {a.nos.length > 0 && (
            <div className="mt-3 rounded-xl bg-slate-50 border border-slate-200 p-3">
              <p className="text-xs font-semibold text-slate-600 mb-2">Answered "No" — tap to raise an observation:</p>
              <div className="flex flex-wrap gap-1.5">
                {a.nos.map(n => (
                  <button key={n} className="text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-600 text-left"
                    onClick={()=>setP({ obs: [...(p.obs||[]), { id: uid(), ref: String((p.obs||[]).length+1), comment: 'Q' + n + ': ' + Q_TEXT[n], code:'2' }], noRemedial:'The following observations are made' })}>
                    Q{n}
                  </button>
                ))}
              </div>
            </div>
          )}
          <div className="mt-3 space-y-3">
            {(p.obs||[]).map((o, i) => (
              <div key={o.id} className="rounded-xl border border-slate-200 p-3">
                <div className="grid grid-cols-12 gap-2 items-end">
                  <div className="col-span-3 sm:col-span-2"><Field label="Ref" value={o.ref} onChange={v=>upObs(o.id,{ref:v})} placeholder={String(i+1)}/></div>
                  <div className="col-span-6 sm:col-span-8"><Dropdown label="Code" value={o.code} onChange={v=>upObs(o.id,{code:v})} options={['1','2','3','4']}/></div>
                  <div className="col-span-3 sm:col-span-2"><button className="btn btn-d w-full !px-0" onClick={()=>delObs(o.id)}>Delete</button></div>
                  <div className="col-span-12"><Field label="Observation" value={o.comment} onChange={v=>upObs(o.id,{comment:v})} area required/></div>
                </div>
                <p className={'text-xs mt-1 font-semibold ' + (o.code === '1' ? 'text-red-600' : 'text-slate-500')}>({o.code}) {PIR_CODES[o.code]}</p>
              </div>
            ))}
          </div>
          <div className="mt-3 text-xs text-slate-500 leading-relaxed">
            (1) Requires urgent attention&nbsp; (2) Requires improvements&nbsp; (3) Requires some attention&nbsp; (4) Does not comply with current National Rules. Using (4) does not necessarily imply the installation is unsafe.
          </div>
          {a.urgent.length > 0 && (
            <div className="mt-3 rounded-lg bg-red-600 text-white text-sm font-bold p-3">
              {a.urgent.length} observation{a.urgent.length===1?'':'s'} marked "requires urgent attention". The person responsible for the installation must be notified without delay.
            </div>
          )}
        </Section>
        <Section title="Photos" right={<label className="text-xs font-bold cursor-pointer" style={{color:'var(--c2)'}}>
          + Add photos<input type="file" accept="image/*" multiple className="hidden" onChange={e=>{ addPhotos(e.target.files); e.target.value=''; }}/>
        </label>}>
          {(job.photos||[]).length === 0 && <p className="text-sm text-slate-400">No photos. Photos appear on the last page of the PDF.</p>}
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
            {(job.photos||[]).map(ph => (
              <div key={ph.id} className="rounded-xl border border-slate-200 overflow-hidden">
                <img src={ph.data} className="w-full h-28 object-cover"/>
                <div className="p-2 space-y-1.5">
                  <input className="field !min-h-[34px] !py-1 text-xs" placeholder="Caption" value={ph.caption||''}
                    onChange={e=>up({ photos: job.photos.map(x => x.id===ph.id ? Object.assign({}, x, {caption:e.target.value}) : x) })}/>
                  <div className="flex gap-1.5">
                    <input className="field !min-h-[34px] !py-1 text-xs" placeholder="Obs ref" value={ph.obsRef||''}
                      onChange={e=>up({ photos: job.photos.map(x => x.id===ph.id ? Object.assign({}, x, {obsRef:e.target.value}) : x) })}/>
                    <button className="btn btn-g !min-h-[34px] !py-1 !px-2.5 text-xs"
                      onClick={()=>up({ photos: job.photos.filter(x => x.id!==ph.id) })}>✕</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Section>
      </>)}

      {tab === 'Sign off' && (<>
        <Section title="Overall condition and re-inspection">
          <Dropdown label="Overall condition of installation" value={p.condition} onChange={v=>setP({condition:v})} options={['Satisfactory','Unsatisfactory']} required/>
          {a.urgent.length > 0 && p.condition === 'Satisfactory' && (
            <p className="text-xs text-red-600 font-semibold mt-2">An observation requires urgent attention, so this cannot be recorded as Satisfactory. The report will show Unsatisfactory.</p>
          )}
          <div className="grid grid-cols-2 gap-3 mt-3">
            <Field label="Re-inspect after not more than" value={p.intervalValue} onChange={v=>setP({intervalValue:v})} inputMode="decimal" placeholder="5"/>
            <Dropdown label="Unit" value={p.intervalUnit} onChange={v=>setP({intervalUnit:v})} options={['months','years']}/>
          </div>
          {addInterval(job.date, p.intervalValue, p.intervalUnit) && (
            <p className="text-xs text-slate-500 mt-2">Next inspection due <b>{fmtDate(addInterval(job.date, p.intervalValue, p.intervalUnit))}</b>.</p>
          )}
        </Section>

        <Section title="Declaration" chip={(job.sig||{}).sig ? <span className="chip chip-ok">Signed</span> : <span className="chip chip-open">Open</span>}>
          <p className="text-xs text-slate-500 mb-3 leading-relaxed">
            I/We are responsible for the inspection and testing of the electrical installation described in this report, and confirm to the best of my/our knowledge that the tests and observations recorded represent an accurate assessment, within the limits specified, of the condition of the electrical installation.
          </p>
          {a.unanswered.length > 0 && (
            <div className="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-900">
              <b>{a.unanswered.length} question{a.unanswered.length===1?'':'s'} still unanswered:</b> {a.unanswered.join(', ')}. All questions must be answered before signing.
            </div>
          )}
          {/* One inspector, one name. This is the same field as the Site tab —
              typing it in either place updates both. */}
          <div className="grid sm:grid-cols-2 gap-3 mb-3">
            <Field label="Inspected and tested by" value={job.inspector} onChange={setInspector} required
              hint="Same as the inspector on the Site tab."/>
            <Field label="Certifier no." value={p.certifierNo} onChange={v=>setP({certifierNo:v})}/>
          </div>
          <p className="text-xs text-slate-400 mb-3">Signed on {fmtDate(job.date)}, the date of inspection.</p>
          <SignaturePad value={(job.sig||{}).sig} onChange={v=>up({ sig: Object.assign({}, job.sig, { sig:v, name: job.inspector, date: job.date }) })}/>
        </Section>

        <Section title="Submit" chip={job.submitted ? <span className="chip chip-ok">Submitted</span> : <span className="chip chip-draft">Draft</span>}>
          {blockers.length > 0 ? (
            <div className="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200">
              <p className="text-sm font-bold text-amber-900 mb-1.5">Not ready to submit</p>
              <ul className="text-xs text-amber-900 space-y-1">
                {blockers.map((b,i) => <li key={i} className="flex gap-2"><span>•</span><span>{b}</span></li>)}
              </ul>
              <p className="text-xs text-amber-800 mt-2">
                You can still take a draft copy away with you — it will be watermarked DRAFT.
              </p>
            </div>
          ) : (
            <p className="text-sm text-slate-600 mb-3">Everything is answered, rated and signed. Ready to submit.</p>
          )}

          <button className="btn btn-a w-full mb-2" disabled={blockers.length > 0}
            onClick={()=>{ submit(); buildPirPdf(job, settings); toast('Submitted and downloaded'); }}>
            Submit &amp; download PDF
          </button>
          <div className="grid grid-cols-2 gap-2">
            <button className="btn btn-o" disabled={blockers.length > 0} onClick={()=>{ submit(); toast('Submitted'); back(); }}>Submit only</button>
            <button className="btn btn-o" disabled={blockers.length > 0 || sending} onClick={async ()=>{
              setSending(true);
              await emailToOffice(job, settings, toast);
              setSending(false);
            }}>{sending ? 'Sending…' : 'Email to office'}</button>
          </div>
          {blockers.length > 0 && (
            <button className="btn btn-g w-full mt-2 text-sm" onClick={()=>{ buildPirPdf(job, settings); toast('Draft PDF downloaded'); }}>
              Download draft copy
            </button>
          )}
          <p className="text-xs text-slate-400 mt-3">
            {DEMO ? 'Demo build — every export is watermarked.' : 'The PDF follows the layout of the Safe Electric periodic report.'}
          </p>
        </Section>

        <button className="btn btn-p w-full" onClick={back}>Back to list</button>
      </>)}

      {/* Bottom navigation. Nobody should have to scroll back to the top of a
          long tab to move on. Mirrors the tab strip, always in thumb reach. */}
      <div className="flex gap-2 pt-1 pb-2">
        {tabIndex > 0 && (

/* ================= UNLOCK ================= */
/* Typed once per device. Verified against the server before it is stored, so a
   wrong code fails here rather than silently failing to sync all day. */
function UnlockView({onDone, settings}){
  const [code, setCode] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const go = async () => {
    const k = code.trim();
    if(!k) return setErr('Enter the access code you were given.');
    setBusy(true); setErr('');
    const prev = API.key;
    API.key = k;
    try{
      await API.call('ping', {});
      API.saveKey(k);
      onDone();
    }catch(e){
      API.key = prev;
      setErr(/Invalid key/i.test(e.message) ? 'That code was not accepted.' : e.message);
      setBusy(false);
    }
  };
  return (<div className="min-h-screen flex items-center justify-center p-6 brandgrad">
    <div className="card p-6 w-full max-w-sm">
      <div className="flex items-center gap-3 mb-4">
        {settings.logo
          ? <img src={settings.logo} className="h-10 max-w-[110px] object-contain"/>
          : <div className="rounded-xl brandgrad p-1"><Mark size={30}/></div>}
        <div>
          <h1 className="font-bold text-slate-800 leading-tight">{settings.companyName}</h1>
          <p className="text-xs text-slate-400">{DEMO ? 'Demo access' : 'Periodic inspections'}</p>
        </div>
      </div>
      <p className="text-sm text-slate-500 mb-4">
        Enter the access code for this device. You only do this once — it is stored on the phone, not in the app itself.
      </p>
      <Field label="Access code" value={code} onChange={setCode}/>
      {err && <p className="text-xs text-red-600 font-semibold mt-2">{err}</p>}
      <button className="btn btn-a w-full mt-4" disabled={busy} onClick={go}>{busy ? 'Checking…' : 'Unlock'}</button>
      <button className="btn btn-g w-full mt-2 text-sm" onClick={onDone}>Work offline on this device</button>
      <p className="text-xs text-slate-400 mt-3">
        Offline mode still records everything and still makes the PDF — it just does not sync to the office.
      </p>
    </div>
  </div>);
}

/* ================= APP ROOT ================= */
function App(){
  const [settings, setSettings] = useState(() => applyBrand(store.get('settings', null)));
  const [customers, setCustomers] = useState(() => store.get('customers', []));
  const [jobs, setJobs] = useState(() => {
    const saved = store.get('jobs', null);
    if(saved && saved.length) return saved;
    return DEMO ? makeDemoJobs() : [];
  });
  const [view, setView] = useState('list');
  const [jobId, setJobId] = useState(null);
  const [toastMsg, setToastMsg] = useState('');
  const [syncState, setSyncState] = useState({ busy:false, pending: queue.list.length, last: store.get('lastSync',''), error:'' });
  const [locked, setLocked] = useState(API.configured && !API.on && !store.get('offlineChosen', false));
  const [, forceTick] = useState(0);
  const tick = () => forceTick(x => x + 1);
  const toastTimer = useRef(null);
  const toast = (m) => { setToastMsg(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(()=>setToastMsg(''), 2200); };

  /* Seven taps on the title, then the PIN, reveals the branding controls. */
  const tapRef = useRef({ n:0, t:0 });
  const secretTap = () => {
    const now = Date.now(); const r = tapRef.current;
    r.n = (now - r.t < 1200) ? r.n + 1 : 1; r.t = now;
    if(r.n < 7) return;
    r.n = 0;
    if(protechUnlocked()){ sessionStorage.removeItem('protech_unlocked'); tick(); toast('Protech mode off'); return; }
    const pin = prompt('Maintenance PIN');
    if(pin === null) return;
    if(LOCAL_PIN && pin.trim() === LOCAL_PIN){ sessionStorage.setItem('protech_unlocked','1'); tick(); setView('settings'); toast('Protech mode on'); }
    else toast('Incorrect PIN');
  };

  /* The header changes height between views, so measure it rather than guessing.
     The tab strip sticks to whatever this reports. */
  const headerRef = useRef(null);
  useEffect(()=>{
    const sync = () => {
      const h = headerRef.current && headerRef.current.offsetHeight;
      if(h) document.documentElement.style.setProperty('--hdr', h + 'px');
    };
    sync();
    window.addEventListener('resize', sync);
    return () => window.removeEventListener('resize', sync);
  });

  /* Theme variables live on the root element so PDF and UI stay in step. */
  useEffect(()=>{
    const r = document.documentElement.style;
    r.setProperty('--c1', settings.c1);
    r.setProperty('--c2', settings.c2);
    r.setProperty('--c3', settings.c3);
    const [rr,gg,bb] = hexToRgb(settings.c1);
    r.setProperty('--c1-soft', 'rgba('+rr+','+gg+','+bb+',.06)');
    document.title = (DEMO ? 'DEMO · ' : '') + (settings.companyName || 'Periodic') + ' Inspections';
    store.set('settings', settings);
  }, [settings]);

  /* Canvas read-back can be refused during the very first paint in some
     browsers, which leaves the sample records unsigned. Draw them once the page
     has settled instead. */
  useEffect(()=>{
    if(!DEMO) return;
    setJobs(prev => prev.map(j =>
      (j.sig && j.sig.sig) || !(j.sig && j.sig.name) ? j
        : Object.assign({}, j, { sig: Object.assign({}, j.sig, { sig: demoSignature(j.id + j.sig.name) }) })));
  }, []);

  useEffect(()=>{ store.set('customers', customers); }, [customers]);
  useEffect(()=>{ const t = setTimeout(()=>store.set('jobs', jobs), 400); return ()=>clearTimeout(t); }, [jobs]);

  /* A logo dropped in as cert.txt beside index.html wins, so the logo can be
     swapped later without rebuilding the app. */
  useEffect(()=>{
    fetch('cert.txt', { cache:'no-store' })
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(t => { if(t && t.trim().indexOf('data:image') === 0) setSettings(s => Object.assign({}, s, { logo: t.trim() })); })
      .catch(()=>{});
  }, []);

  /* ---- sync ---- */
  const syncNow = async () => {
    if(!API.on) return;
    setSyncState(s => Object.assign({}, s, { busy:true, error:'' }));
    try{
      const ids = queue.list;
      const toPush = jobs.filter(j => ids.indexOf(j.id) > -1);
      if(toPush.length){
        await API.call('pushJobs', { jobs: toPush.map(j => ({
          id: j.id, updatedAt: j.updatedAt, meta: jobMeta(j),
          json: Object.assign({}, j, { photos: undefined })
        })) });
        /* Photos go up one at a time: they are much larger than a job record. */
        for(const j of toPush){
          for(const ph of (j.photos || [])){
            if(ph.synced) continue;
            try{ await API.call('pushPhoto', { photo: { id: ph.id, jobId: j.id, data: ph.data, caption: ph.caption, obsRef: ph.obsRef, ts: ph.ts } }); }catch(e){}
          }
        }
        queue.clear(toPush.map(j => j.id));
      }
      if(customers.length) await API.call('pushCustomers', { customers });
      const data = await API.call('pull', {});
      /* A live demo starts empty on the server. Seed it once from the generated
         sample set so the demo behaves exactly like the real thing — multiple
         devices, real sync — without anyone typing 26 inspections. */
      if(DEMO && data && (data.jobs || []).length === 0 && !store.get('seeded', false)){
        await API.call('pushJobs', { jobs: jobs.map(x => ({
          id: x.id, updatedAt: x.updatedAt, meta: jobMeta(x),
          json: Object.assign({}, x, { photos: undefined })
        })) });
        store.set('seeded', true);
      }
      if(data && data.jobs){
        setJobs(prev => {
          const map = {};
          prev.forEach(j => { map[j.id] = j; });
          data.jobs.forEach(r => {
            if(r.deleted){ delete map[r.id]; return; }
            const local = map[r.id];
            /* Last write wins, and local photos are kept because they are not
               included in the job record itself. */
            if(!local || (r.updatedAt || '') > (local.updatedAt || '')){
              map[r.id] = Object.assign({}, r, { photos: (local && local.photos) || [] });
            }
          });
          return Object.values(map).sort((a,b) => (b.date||'').localeCompare(a.date||''));
        });
      }
      if(data && data.customers && data.customers.length) setCustomers(data.customers);
      const now = nowISO();
      store.set('lastSync', now);
      setSyncState({ busy:false, pending: queue.list.length, last: now, error:'' });
    }catch(e){
      setSyncState(s => Object.assign({}, s, { busy:false, pending: queue.list.length, error: 'Sync failed: ' + e.message }));
    }
  };

  useEffect(()=>{
    if(!API.on) return;
    syncNow();
    const iv = setInterval(()=>{ if(navigator.onLine && queue.list.length) syncNow(); }, 60000);
    const on = () => syncNow();
    window.addEventListener('online', on);
    return () => { clearInterval(iv); window.removeEventListener('online', on); };
  }, []);

  const job = jobs.find(j => j.id === jobId) || null;
  const setJob = (next) => {
    setJobs(prev => prev.map(j => j.id === next.id ? next : j));
    if(API.on){ queue.add(next.id); setSyncState(s => Object.assign({}, s, { pending: queue.list.length })); }
  };
  const newJob = (site) => {
    const j = blankJob();
    j.prNo = nextPrNo(jobs);
    if(site){
      j.customerId = site.id; j.customerName = site.name; j.address = site.address;
      j.phone = site.phone; j.email = site.email; j.pir.occupant = site.name;
      j.lat = site.lat || ''; j.lng = site.lng || '';
    }
    /* Prefer the last visit to this same site; otherwise the last job of any
       kind, which at least carries the inspector and the instrument serials. */
    const sameSite = site
      ? jobs.find(x => (site.id && x.customerId === site.id) || (x.customerName || '') === site.name)
      : null;
    carryForward(j, sameSite || jobs[0]);
    if(sameSite) toast('Details carried over from ' + fmtDate(sameSite.date));
    setJobs(prev => [j, ...prev]);
    if(API.on) queue.add(j.id);
    setJobId(j.id); setView('job');
  };
  const deleteJob = (id) => {
    const j = jobs.find(x => x.id === id);
    if(!confirm('Delete the inspection for ' + ((j && j.customerName) || 'this site') + '?')) return;
    setJobs(prev => prev.filter(x => x.id !== id));
    if(API.on) API.call('deleteJob', { id }).catch(()=>{});
  };
  const saveCustomers = (updater) => setCustomers(prev => typeof updater === 'function' ? updater(prev) : updater);

  if(locked) return <UnlockView settings={settings} onDone={()=>{ if(!API.on) store.set('offlineChosen', true); setLocked(false); if(API.on) syncNow(); }}/>;

  const headerTitle = view==='job' && job ? (job.customerName || 'Inspection')
    : view==='sites' ? 'Sites'
    : view==='settings' ? 'Settings'
    : (settings.companyName || 'Periodic Inspections');

  return (<div className="min-h-screen">
    {DEMO && <div className="demobar h-1.5"/>}
    <header ref={headerRef} className="sticky top-0 z-40 brandgrad" style={{ color: textOn(settings.c1) }}>
      <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
        {view !== 'list'
          ? <button className="text-2xl leading-none -ml-1 px-1" onClick={()=>{ setView('list'); setJobId(null); }}>‹</button>
          : (settings.logo
              ? <img src={settings.logo} className="h-9 max-w-[92px] object-contain bg-white rounded-md p-0.5"/>
              : <Mark/>)}
        <div className="min-w-0 flex-1">
          <div className="font-bold truncate leading-tight cursor-default" onClick={secretTap}>{headerTitle}</div>
          <div className="text-[11px] opacity-75 truncate">
            {view==='job' && job ? [DEMO ? 'DEMO' : 'Periodic', job.prNo, fmtDate(job.date)].filter(Boolean).join(' • ')
              : (DEMO ? 'DEMO · ' : '') + (API.on
                  ? (syncState.busy ? 'Syncing…' : syncState.pending ? syncState.pending + ' waiting to upload' : 'Synced')
                  : 'Saved on this device')}
          </div>
        </div>
        {view==='job' && job && (()=>{ const a = audit(job); return a.urgent.length
          ? <span className="chip chip-bad">Urgent</span>
          : <span className="chip chip-open">{a.answered}/{a.total}</span>; })()}
      </div>
      <div style={{height:3, background:'rgba(255,255,255,.22)'}}/>
    </header>

    {DEMO && (
      <div className="max-w-3xl mx-auto px-4 pt-3">
        <div className="rounded-xl px-3 py-2 text-xs font-semibold" style={{ background:'#fff8f1', border:'1px solid #fcd9b6', color:'#8a5220' }}>
          Demo build — the {jobs.length} inspections below are made-up sample records for fictional sites.
          {API.on ? ' They sync live, in a demo-only area of the sheet, kept apart from any real records.' : ''} Every PDF and Excel export is watermarked.
        </div>
      </div>
    )}

    <main className="max-w-3xl mx-auto px-4 pt-4">
      {view === 'list' && <JobList jobs={jobs} openJob={(id)=>{ setJobId(id); setView('job'); }} newJob={()=>newJob()} go={setView} deleteJob={deleteJob} settings={settings} toast={toast}/>}
      {view === 'sites' && <SitesView customers={customers} saveCustomers={saveCustomers} toast={toast} onNew={(c)=>newJob(c)}/>}
      {view === 'settings' && <SettingsView settings={settings} setSettings={setSettings} syncNow={syncNow} syncState={syncState} jobs={jobs} toast={toast} tick={tick}/>}
      {view === 'job' && job && <JobEditor job={job} setJob={setJob} settings={settings} customers={customers} saveCustomers={saveCustomers} toast={toast} back={()=>{ setView('list'); setJobId(null); }}/>}
      {view === 'job' && !job && <div className="card p-8 text-center text-slate-400">Inspection not found. <button className="font-bold" style={{color:'var(--c2)'}} onClick={()=>setView('list')}>Back to list</button></div>}
    </main>

    <Toast msg={toastMsg}/>
    <footer className="max-w-3xl mx-auto px-4 py-8 text-center text-[11px] text-slate-400">
      {settings.footerText || 'Periodic inspection records'} · Not an official certification platform
    </footer>
  </div>);
}

try{
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  var boot = document.getElementById('boot'); if(boot) boot.style.display = 'none';
}catch(err){ window.__err(err && err.message ? err.message : err); }
</script>
</body>
</html>
