      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data); })
      .then(function (buf) { return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); });
  }
  function show(text, bad) {
    var f = document.getElementById('f'); f.hidden = false;
    var m = document.getElementById('msg'); m.textContent = text || ''; m.className = bad ? 'bad' : '';
    var b = document.getElementById('go'); b.disabled = false; b.textContent = 'Open';
    document.getElementById('k').focus();
  }
  function tryCode(code, fromForm) {
    var b = document.getElementById('go'); b.disabled = true; b.textContent = 'Opening…';
    return open(code).then(function (html) {
      try { localStorage.setItem(SAVE, code); } catch (e) {}
      document.open(); document.write(html); document.close();
    }, function () {
      try { localStorage.removeItem(SAVE); } catch (e) {}
      show(fromForm ? 'That code is not right.' : '', !!fromForm);
    });
  }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') { show('Open this link in an up-to-date Chrome, Edge or Safari.', true); return; }
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); var v = document.getElementById('k').value.trim(); if (v) tryCode(v, true); });
  window.addEventListener('hashchange', function () { if (/[#&]k=/.test(location.hash)) location.reload(); });
  var m = /[#&]k=([^&]+)/.exec(location.hash), saved = null;
  try { saved = localStorage.getItem(SAVE); } catch (e) {}
  var code = m ? decodeURIComponent(m[1]) : saved;
  if (code) tryCode(code, false); else show();
})();
