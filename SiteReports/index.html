<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site Reports</title>
<meta name="description" content="Condition reports and routine checks, made on the phone.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reports">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<!-- config.js holds the start of the Apps Script link (written by SET_LINK.bat). Without it the app keeps everything on the phone. -->
<script src="config.js"></script>
<script>
// white until he is signed in, so the first screen never flashes dark (or the other way round)
try { document.documentElement.dataset.mode = (window.APP_CONFIG && window.APP_CONFIG.execStart && !localStorage.getItem('sr-pin')) ? 'login' : 'app'; } catch (e) { document.documentElement.dataset.mode = 'login'; }
</script>
<style>
/* Signed in, it wears Gavin's Executive Electrical look: grey-900 page, grey-800 cards with grey-700
   edges, white type, yellow-400 for buttons and anything picked. The sign in screen is plain white.
   Colour beyond that only where it means something: condition grades, priorities, pass or fault. */
:root{
  --bg:#111827; --surface:#1F2937; --surface-2:#273244; --surface-3:#374151; --line:#374151; --field:#1F2937;
  --ink:#D1D5DB; --ink-strong:#FFFFFF; --muted:#9CA3AF; --faint:#6B7280;
  --primary:#FACC15; --primary-hover:#FDE047; --primary-ink:#111827; --primary-soft:rgba(250,204,21,.12);
  --focus:#FACC15;
  --pass:#4ADE80; --pass-bg:rgba(34,197,94,.14); --fail:#F87171; --fail-bg:rgba(239,68,68,.13); --fail-line:rgba(239,68,68,.35);
  --warn:#FB923C; --warn-bg:rgba(249,115,22,.14); --na:#9CA3AF; --na-bg:rgba(156,163,175,.14); --info:#60A5FA; --info-bg:rgba(59,130,246,.15);
  --gA:#2E7D32; --gB:#E9B824; --gC:#E06A12; --gD:#C62828;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --radius:12px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --glass:rgba(31,41,55,.97);
  color-scheme:dark;
}
/* the first screen: white, nothing else */
.login,.opening.white{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F4F5; --surface-3:#ECECEE; --line:#E5E5E7; --field:#FFFFFF;
  --ink:#3A3A3C; --ink-strong:#111111; --muted:#6B6B70; --faint:#A3A3A8;
  --primary:#111111; --primary-hover:#333333; --primary-ink:#FFFFFF; --focus:#111111;
  --fail:#B42318; --fail-bg:#FDECEA; --warn:#8A5300; --warn-bg:#FFF4DB;
  color-scheme:light;
}
html[data-mode="login"],html[data-mode="login"] body{background:#FFFFFF}
*{box-sizing:border-box}
html,body{min-height:100%;background:#111827}
body{margin:0;color:var(--ink);font:16px/1.5 var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.5}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
img{max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
.grow{flex:1;min-width:0}
.block{display:block}
.strong{font-weight:700;color:var(--ink-strong)}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.pre{white-space:pre-wrap}
.y{color:var(--primary)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:12px}
.stack-xs{display:flex;flex-direction:column;gap:8px}
.row-gap{display:flex;gap:10px;align-items:center}
.wrap-row{flex-wrap:wrap}
.h-sm{font-size:17px;margin:0;color:var(--ink-strong);font-weight:700}
.err{color:var(--fail);font-weight:700;font-size:15px;margin:0}
.err-txt{color:var(--fail)}
.app{min-height:100vh;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.app.no-tabs{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main.wrap{padding-block:16px 28px}
.opening{min-height:100vh;display:grid;place-items:center;background:var(--bg)}
.note-info{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin:0;color:var(--ink)}
.login .note-info{background:var(--surface-2);border:0}

/* home title, the same treatment as his cost tracker */
.title-block{padding:22px 16px 2px;max-width:640px;margin:0 auto}
.title-block h1{font-size:24px;font-weight:900;color:#fff;margin:0;letter-spacing:-.03em;line-height:1.15}
.title-block p{margin:4px 0 0;font-size:12px;color:var(--muted);font-style:italic;font-weight:500}
.title-block p b{color:var(--primary);font-style:normal;letter-spacing:.12em;margin-right:6px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:8px;min-height:60px;padding-block:6px}
.top-title{flex:1;min-width:0}
.t1{font-size:18px;font-weight:700;color:var(--ink-strong);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.top-below{border-top:1px solid var(--line)}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink-strong)}
.icon-btn:disabled{opacity:.3}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:12px;font-weight:700;font-size:16px;line-height:1.2;text-align:center;text-decoration:none;transition:background-color .15s,border-color .15s}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--primary)}
.login .btn-ghost{background:var(--surface-2);border:0}
.btn-danger{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail-line)}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:0 14px;font-size:14.5px}
.link{color:var(--primary);font-weight:700;text-decoration:none;padding:6px 0;align-self:flex-start}
.link-muted{color:var(--muted);font-weight:500}

/* chips and badges */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.6}
.chip-pass{background:var(--pass-bg);color:var(--pass)}
.chip-fail{background:var(--fail-bg);color:var(--fail)}
.chip-warn{background:var(--warn-bg);color:var(--warn)}
.chip-na{background:var(--na-bg);color:var(--na)}
.chip-info{background:var(--info-bg);color:var(--info)}
.gb{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;font-weight:800;font-size:17px;flex:none;color:#fff}
.gb-big{width:58px;height:58px;border-radius:14px;font-size:30px}
.gb-A{background:var(--gA)} .gb-B{background:var(--gB);color:#1A1A1A} .gb-C{background:var(--gC)} .gb-D{background:var(--gD)}
.gb-X,.gb-N{background:var(--surface-3);color:var(--ink);font-size:12px;font-weight:700}
.gb-blank{background:transparent;border:1.5px dashed #4B5563;color:#6B7280}
.gb-check{background:var(--pass-bg);color:var(--pass)} .gb-check.bad{background:var(--fail-bg);color:var(--fail)}
.pri{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;flex:none}
.pri-1{background:var(--fail-bg);color:var(--fail)} .pri-2{background:var(--warn-bg);color:var(--warn)} .pri-3{background:var(--surface-3);color:var(--ink)} .pri-4{background:var(--surface-2);color:var(--muted)}
.opt{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;color:var(--faint);vertical-align:1px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field-label{font-weight:700;color:var(--muted);font-size:14px}
.field-hint{font-size:13.5px;color:var(--faint);margin:0}
.input{width:100%;min-height:52px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink-strong);font-size:16px}
textarea.input{resize:vertical;min-height:64px;line-height:1.45}
.input:focus{outline:none;border-color:var(--primary)}
.input::placeholder{color:var(--faint)}
select.input{appearance:auto}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}
.login input[type="date"]::-webkit-calendar-picker-indicator{filter:none}
.pin-in{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:22px;letter-spacing:.12em;text-align:center}
.money{position:relative}
.money-sym{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.money .input{padding-left:31px;font-variant-numeric:tabular-nums;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.toggle{display:flex;align-items:center;gap:12px;text-align:left;font-weight:700;color:var(--ink-strong);min-height:44px}
.toggle-track{width:50px;height:30px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.toggle-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.toggle.on .toggle-track{background:var(--primary)}
.toggle.on .toggle-knob{transform:translateX(20px);background:#111827}

/* segmented answers */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-btn{flex:1 1 0;min-width:84px;min-height:52px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-strong);font-weight:700;font-size:16px}
.seg-sm .seg-btn{flex:0 1 auto;min-width:0;min-height:42px;font-size:14.5px;padding:6px 13px;background:var(--bg)}
.seg-btn.sel{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.seg-btn.sel.tone-pass{border-color:var(--pass);background:var(--pass-bg);color:var(--pass)}
.seg-btn.sel.tone-fail{border-color:var(--fail);background:var(--fail-bg);color:var(--fail)}
.seg-btn.sel.tone-na{border-color:var(--na);background:var(--na-bg);color:var(--ink-strong)}

/* condition grades and priorities */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{min-height:66px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px}
.grade b{font-size:23px;line-height:1;color:var(--ink-strong);font-weight:900}
.grade span{font-size:12px;font-weight:600;color:var(--muted)}
.grade.sel b,.grade.sel span{color:#fff}
.grade.g-A.sel{background:var(--gA);border-color:var(--gA)}
.grade.g-B.sel{background:var(--gB);border-color:var(--gB)} .grade.g-B.sel b,.grade.g-B.sel span{color:#1A1A1A}
.grade.g-C.sel{background:var(--gC);border-color:var(--gC)}
.grade.g-D.sel{background:var(--gD);border-color:var(--gD)}
.pris{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pri-btn{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:9px 11px;text-align:left;display:flex;flex-direction:column;min-height:56px}
.pri-btn b{font-size:15px;color:var(--ink-strong)}
.pri-btn span{font-size:12px;color:var(--muted)}
.pri-btn.sel{border-color:var(--primary);background:var(--primary-soft)} .pri-btn.sel b{color:var(--primary)}
.pri-btn.p-1.sel{border-color:var(--fail);background:var(--fail-bg)} .pri-btn.p-1.sel b{color:var(--fail)}
.pri-btn.p-2.sel{border-color:var(--warn);background:var(--warn-bg)} .pri-btn.p-2.sel b{color:var(--warn)}

/* tab bar and foot bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px 10px;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--faint);position:relative}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--primary)}
.tab-dot{position:absolute;top:8px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--primary)}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--glass);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.footbar .row-gap .btn{flex:0 0 auto}
.footbar .row-gap .btn.grow{flex:1}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;width:calc(100% - 32px);max-width:520px;background:#F9FAFB;color:#111827;padding:13px 15px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;font-size:15px}
.toast-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:#16A34A}
.toast-warn .toast-dot{background:#EAB308}
.toast-err .toast-dot{background:#DC2626}

/* sign in (white) */
.login{min-height:100vh;background:#fff}
.login-in{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 20px 40px;display:flex;flex-direction:column;gap:24px}
.brand h1{font-size:30px;line-height:1.15;margin:16px 0 4px;color:var(--ink-strong);letter-spacing:-.02em}
.brand p{margin:0;font-size:16px}
.login .field-label{color:var(--ink-strong)}
.mark{display:block}

/* cards and lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:16px}
.card-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;min-height:62px;color:var(--ink);text-decoration:none}
button.lrow:active,a.rrow:active,button.rrow:active{background:var(--surface-3)}
.lrow-static{align-items:flex-start}
.lrow-ic{width:38px;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--primary);flex:none}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 8px}
.group-h h2{font-size:17px;margin:0;color:var(--ink-strong);font-weight:700}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink-strong);font-size:17px;margin-bottom:4px}
.hero{display:flex;align-items:center;gap:14px;width:100%;padding:18px 16px;border-radius:14px;background:var(--primary);color:var(--primary-ink);text-align:left;box-shadow:0 10px 24px rgba(250,204,21,.18)}
.hero:active{background:var(--primary-hover)}
.hero b{display:block;font-size:19px;font-weight:800}
.hero .grow > span{display:block;font-size:14px;color:#3F3A1A;font-weight:500}
.hero-ic{width:48px;height:48px;border-radius:12px;background:#111827;color:var(--primary);display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.stat h3{margin:0 0 4px;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat p{margin:0;font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1.15}
.stat p.alert{color:var(--fail)}
.syncline{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);padding:2px 2px}
.syncline i{width:9px;height:9px;border-radius:50%;flex:none;background:#6B7280}
.syncline.tone-pass i{background:#22C55E} .syncline.tone-warn i{background:#F59E0B} .syncline.tone-info i{background:#3B82F6}
.install{display:flex;align-items:center;gap:10px;border-color:var(--primary)}
.search{position:relative}
.search .input{padding-left:44px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips-pick{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14.5px;color:var(--ink)}
.pick.on{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.pick.on.bad{border-color:var(--fail);background:var(--fail-bg);color:var(--fail)}
.confirm{background:var(--primary-soft);border:1px solid rgba(250,204,21,.35);color:var(--ink-strong);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.confirm p{margin:0;font-weight:600}
.warn-card{border-color:rgba(249,115,22,.45);background:rgba(249,115,22,.07)}
.danger{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px;align-items:stretch}

/* report rows */
.rrow{display:flex;gap:12px;width:100%;padding:13px 16px;text-align:left;color:var(--ink);align-items:flex-start;text-decoration:none}
.rrow-main{flex:1;min-width:0;display:block}
.rrow-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ref{font-weight:700;font-size:12.5px;color:var(--primary);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.rrow-title{display:block;font-weight:700;color:var(--ink-strong);font-size:16px;line-height:1.3;margin-top:1px}
.rrow-chips{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}

/* survey */
.progress-in{display:flex;align-items:center;gap:12px;padding-block:9px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .25s}
.progress-txt{font-size:13px;font-weight:700;color:var(--ink-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;margin:6px 2px 9px;color:var(--ink-strong);font-weight:700}
.sec-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.els{display:flex;flex-direction:column;gap:8px}
.el{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);scroll-margin-top:130px}
.el.open{border-color:var(--primary);box-shadow:var(--shadow)}
.el.has-problem{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.el-head{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;text-align:left;min-height:58px;color:var(--muted)}
.el-name{display:block;font-weight:700;color:var(--ink-strong);font-size:16px;line-height:1.3}
.el-where{font-weight:500;color:var(--muted)}
.el-sub{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el-body{padding:12px 12px 14px;border-top:1px solid var(--line)}
.el-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.el-foot .btn-primary{flex:1;min-width:120px}
.act{border-left:3px solid var(--surface-3);padding-left:12px}
.last{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:14px;color:var(--ink)}
.last-h{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.last-h b{color:var(--ink-strong)}
.add-el{display:flex;align-items:center;gap:6px;margin:8px 2px 0;font-weight:700;color:var(--primary);font-size:14.5px;padding:8px 2px}
.profile{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.profile span{display:block;min-width:4px}
.pf-A{background:var(--gA)} .pf-B{background:var(--gB)} .pf-C{background:var(--gC)} .pf-D{background:var(--gD)}
.profile-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink)}
.profile-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.profile-key b{color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:#fff}
.tbl tr.tot td{font-weight:800;color:var(--primary);border-bottom:0}
.outcome{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.outcome b{font-size:21px;display:block;line-height:1.2;color:var(--ink-strong)}
.outcome.ok{border-color:rgba(34,197,94,.35)} .outcome.bad{border-color:var(--fail-line)}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
.meta dt{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meta dd{margin:0;color:var(--ink-strong);font-weight:600;overflow-wrap:anywhere}
.logo-prev{background:#fff;border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;min-height:70px}
.logo-prev img{max-height:60px;max-width:220px}

/* routine checks */
.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:150px}
.item.is-fail{border-color:var(--fail)}
.item.has-problem{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.item-head{display:flex;gap:10px;align-items:flex-start}
.item-label{flex:1;font-weight:700;font-size:16.5px;color:var(--ink-strong);line-height:1.35}
.item-help{margin:-6px 0 0;color:var(--muted);font-size:14.5px}
.tick{color:var(--pass);flex:none;margin-top:2px}
.item-extra{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px dashed var(--line)}
.num-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.num-wrap{position:relative;width:150px}
.num-wrap .input{padding-right:64px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:15px;pointer-events:none}
.range{font-size:13.5px;color:var(--muted);font-weight:600}
.ied{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.ied.open{border-color:var(--primary);background:var(--surface)}
.ied-head{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;color:var(--ink)}
.ied-n{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-strong);flex:none}
.ied-body{padding:4px 14px 16px}
.sec-edit-head{display:flex;gap:4px;align-items:center}
.sec-edit-head .input{font-weight:700;font-size:17px}

/* photos */
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:84px;height:84px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--bg);flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-wait{display:block;width:100%;height:100%;background:var(--bg)}
.ph-add{width:84px;height:84px;border-radius:11px;border:1.5px dashed #4B5563;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--primary);font-weight:700;font-size:12px;text-align:center;padding:6px;cursor:pointer;line-height:1.2}
.ph-add span{color:var(--ink)}
.ph-add-sm{width:64px;color:var(--muted)}
.sig-pad{display:block;width:100%;height:170px;border-radius:12px;border:1px solid var(--line);background:#FFFFFF;touch-action:none}
.sig-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* sheets and the photo viewer */
.sheet-bg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;width:100%;max-width:640px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 8px 6px 18px}
.sheet-head h2{flex:1;font-size:18px;margin:0;color:var(--ink-strong)}
.sheet-body{overflow:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 18px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lightbox{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.lb-stage{flex:1;display:grid;place-items:center;padding:12px;min-height:0}
.lb-stage img{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}
.lb-bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#111827;border-top:1px solid #1F2937}
.lb-q{color:#fff;font-weight:600;flex:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

</style>
</head>

/* ===== MONEY: commas as you type, stored without them ===== */
function cleanMoney(s) {
  let t = String(s == null ? '' : s).replace(/[^0-9.]/g, '');
  const i = t.indexOf('.');
  if (i >= 0) t = t.slice(0, i + 1) + t.slice(i + 1).replace(/\./g, '').slice(0, 2);
  return t.replace(/^0+(?=\d)/, '');
}
function groupMoney(s) {
  const t = cleanMoney(s);
  if (!t) return '';
  const [a, b] = t.split('.');
  const g = (a || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return b === undefined ? g : g + '.' + b;
}
const moneyNum = v => {
  const n = parseFloat(cleanMoney(v));
  return isNaN(n) ? 0 : n;
};

const DB = (() => {

      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');

// Draws the photo no bigger than max px, with the date and place along the bottom if asked
async function shrink(blob, max, quality, stamp) {
  const r = await loadImage(blob);
  const im = r.im, w0 = im.naturalWidth, h0 = im.naturalHeight, s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * s));
  c.height = Math.max(1, Math.round(h0 * s));
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(im, 0, 0, c.width, c.height);
  r.done();
  if (stamp) {
    const txt = new Date().toLocaleString('en-IE', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + '   ' + stamp;
    const fs = Math.max(14, Math.round(c.width / 42));

    const tw = g.measureText(txt).width;
    g.fillStyle = 'rgba(0,0,0,0.58)';
    g.fillRect(0, c.height - fs * 2, Math.min(c.width, tw + fs * 1.4), fs * 2);
    g.fillStyle = '#ffffff';

  return new Promise((res, rej) => c.toBlob(b => b ? res({ blob: b, w: c.width, h: c.height }) : rej(new Error('Could not save the photo.')), 'image/jpeg', quality || 0.8));
}

function lastConditionFor(siteId, notId) {

    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.made || 0) - (a.made || 0))[0];
  if (mine) return { no: mine.no, date: mine.date, groups: mine.groups, items: mine.items };
  return ST.lastBySite[siteId] || null;
}
function newConditionReport(site) {
  const prev = lastConditionFor(site.id);
  const lib = ST.library;
  let groups, items;
  if (prev && prev.items && prev.items.length) {
    groups = (prev.groups || lib.groups.map(g => ({ id: g.id, name: g.name, on: true }))).map(g => ({ id: g.id, name: g.name, on: g.on !== false }));
    items = prev.items.map(i => ({
      id: uid(), gid: i.gid, element: i.element, where: i.where || '', grade: i.grade === 'N' ? 'N' : '',
      note: '', action: '', priority: '', cost: '', life: '', photos: [],
      last: { grade: i.grade || '', note: i.note || '', action: i.action || '', priority: i.priority || '', no: prev.no, date: prev.date }
    }));
  } else {
    groups = lib.groups.map(g => ({ id: g.id, name: g.name, on: true }));
    items = [];
    lib.groups.forEach(g => g.items.forEach(e => items.push(blankItem(g.id, e.name))));
  }

    id: uid(), kind: 'condition', status: 'draft', siteId: site.id, site: siteSnapshot(site), demo: !!site.demo,
    date: todayISO(), started: Date.now(), weather: '', occupancy: '', access: '', cover: [], groups, items,
    overall: '', summary: '', signature: '', no: '', rev: 0, prevNo: prev ? prev.no : '', prevDate: prev ? prev.date : ''

const groupsOn = r => r.groups.filter(g => g.on !== false);

function conditionStats(r) {
  const items = itemsOn(r);

  items.forEach(i => { n[i.grade && n[i.grade] !== undefined ? i.grade : 'blank']++; });

    (r.occupancy ? ' The building was ' + r.occupancy.toLowerCase() + ' at the time.' : ''));

  if (s.rated) {

    if (s.n.B) parts.push(s.n.B + ' satisfactory');

/* ===== ROUTINE CHECKS: pass and fail logic from the maintenance checks app ===== */
function isFail(it, a) {
  if (!a) return false;
  const v = a.value;
  switch (it.type) {
    case 'passfail': return v === 'Fail';
    case 'yesno': return !!it.failOn && v === it.failOn;
    case 'number': {
      if (!has(v)) return false;
      const n = parseFloat(v);
      if (isNaN(n)) return false;
      if (has(it.min) && n < +it.min) return true;
      if (has(it.max) && n > +it.max) return true;
      return false;
    }
    case 'choice': return (it.failOptions || []).includes(v);
    default: return false;
  }
}
function isAnswered(it, a) {

  return has(a.value) && String(a.value).trim() !== '';
}

    total++;
    const a = answers[it.id];
    if (isAnswered(it, a)) answered++;
    if (isFail(it, a)) { fails++; failedItems.push(it.label); }

}

  if (has(it.min)) return `Should be ${it.min}${u} or more`;
  if (has(it.max)) return `Should be ${it.max}${u} or less`;

}

// Checks due: only a checklist that has been done at a building before, or is set for that building
function dueList() {
  const now = Date.now(), out = [];
  ST.templates.filter(t => t.active !== false).forEach(t => {
    const days = freqDays(t.frequency);
    if (!days) return;
    ST.sites.filter(s => s.active !== false).forEach(s => {
      const set = (t.locationIds || []).includes(s.id);
      const last = ST.docs.filter(d => d.kind === 'check' && d.templateId === t.id && d.siteId === s.id && d.no)
        .sort((a, b) => (b.made || 0) - (a.made || 0))[0];
      if (!last && !set) return;
      const dueAt = last ? last.made + days * DAY : now;
      const inDays = Math.ceil((dueAt - now) / DAY);
      const soon = days >= 7 ? Math.round(days * 0.2) : 0;
      const state = !last ? 'never' : inDays < 0 ? 'overdue' : inDays <= soon ? 'soon' : 'ok';
      out.push({ key: t.id + '|' + s.id, template: t, site: s, last, dueAt, inDays, state });
    });
  });

function failure(kind, msg) {
  const e = new Error(msg || kind);
  e.kind = kind;
  return e;
}
// One request. Errors carry kind: offline, pin, slow or server.
async function call(action, data, o = {}) {
  const ctl = window.AbortController ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), o.timeout || 60000) : 0;
  try {
    let res;
    try {
      res = await fetch(CONF.execStart + (o.pin || PIN) + '/exec', {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', cache: 'no-store',
        body: JSON.stringify({ action, data: data || {} }), signal: ctl ? ctl.signal : undefined
      });
    } catch (e) {
      throw await whyFailed(e);
    }
    if (!res.ok) throw failure('server', 'Google did not answer properly (' + res.status + '). Try again in a minute.');
    let out;
    try { out = await res.json(); } catch (e) { throw e && e.name === 'AbortError' ? failure('slow') : failure('server', 'Google sent back something unexpected. Try again in a minute.'); }
    if (!out || !out.ok) {
      const e = failure('server', (out && out.error) || 'Something went wrong.');
      e.code = out && out.code;
      throw e;
    }
    return out.data;
  } finally {
    clearTimeout(timer);
  }
}
// A wrong PIN comes back from Google as a 404 the page is not allowed to read, which looks just like
// having no signal. Reaching our own site tells the two apart.
async function whyFailed(e) {
  if (!navigator.onLine) return failure('offline');
  try { await fetch('manifest.webmanifest?reach=' + Date.now(), { cache: 'no-store' }); } catch (x) { return failure('offline'); }
  return failure(e && e.name === 'AbortError' ? 'slow' : 'pin');
}

let SYNCED = {}, DELQ = [], PHOTOQ = [];
async function loadSyncState() {
  const r = await Promise.all([DB.get('kv', 'synced'), DB.get('kv', 'delq'), DB.get('kv', 'photoq'), DB.get('kv', 'lastSync')]).catch(() => []);
  SYNCED = r[0] || {};
  DELQ = r[1] || [];
  PHOTOQ = r[2] || [];
  ST.sync.last = r[3] || 0;
}
const saveSyncState = () => Promise.all([DB.put('kv', SYNCED, 'synced'), DB.put('kv', DELQ, 'delq'), DB.put('kv', PHOTOQ, 'photoq'), DB.put('kv', ST.sync.last, 'lastSync')]).catch(storageFail);
function hsh(s) {
  let x = 5381;
  for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0;
  return (x >>> 0).toString(36) + '.' + s.length;
}
// fields the phone writes after a send: changing them must not make the report look unsent
const SYNC_SKIP = ['updated', 'pdfUrl', 'folderUrl', 'pdfUp', 'emailed', 'emailReq'];
function docKey(d) {
  const o = {};
  Object.keys(d).forEach(k => { if (!SYNC_SKIP.includes(k)) o[k] = d[k]; });
  return hsh(JSON.stringify(o));
}
function sharedRecords() {
  const out = [{ t: 'settings', id: 'settings', r: ST.settings }, { t: 'library', id: 'library', r: ST.library },
    { t: 'templates', id: 'templates', r: { id: 'templates', list: ST.templates, updated: ST.templatesAt || 0 } }];
  ST.sites.forEach(s => { if (!s.demo) out.push({ t: 'site', id: s.id, r: s }); });
  return out;
}
const sharedKey = x => x.t + ':' + x.id;
const dirtyShared = () => sharedRecords().filter(x => (x.r.updated || 0) > 0 && SYNCED[sharedKey(x)] !== hsh(JSON.stringify(x.r)));
function docNeeds(d) {
  // an example only goes to Google to be emailed
  if (d.demo) return !!(linked() && d.emailReq && isMade(d));
  if (isEmptyDraft(d)) return false;
  return SYNCED['doc:' + d.id] !== docKey(d) || (isMade(d) && d.pdfUp !== d.rev) || !!(d.emailReq && isMade(d));
}
function queuePhoto(id, rep) {
  PHOTOQ.push({ id, rep });
  DB.put('kv', PHOTOQ, 'photoq').catch(storageFail);
}
function photoWanted(q) {
  const d = docById(q.rep);
  return !!(d && !d.demo);
}
function countPending() {
  if (!linked()) return 0;
  ST.sync.pending = dirtyShared().length + PHOTOQ.filter(photoWanted).length + ST.docs.filter(docNeeds).length + (DELQ.length ? 1 : 0);
  return ST.sync.pending;
}
// A doc saved after a send: no new timestamp, no new send
function quietPut(d) {
  const i = ST.docs.findIndex(x => x.id === d.id);
  if (i >= 0) ST.docs[i] = d;
  changed();
  return DB.put('docs', d).catch(storageFail);
}
function forgetDoc(d) {
  if (SYNCED['doc:' + d.id]) { DELQ.push(d.id); delete SYNCED['doc:' + d.id]; saveSyncState(); }
  PHOTOQ = PHOTOQ.filter(q => q.rep !== d.id);
  DB.put('kv', PHOTOQ, 'photoq').catch(storageFail);
}
const blobToB64 = blob => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(',')[1] || '');
  fr.onerror = () => rej(fr.error);
  fr.readAsDataURL(blob);
});

/* ===== SENDING AND PULLING ===== */
let kickT = 0;
function kickSync(ms) {
  if (!linked() || !PIN) return;
  clearTimeout(kickT);
  kickT = setTimeout(() => syncNow(), ms == null ? 1500 : ms);
}
function step(t) { ST.sync.step = t; changed(); }
async function syncNow(force) {
  if (!linked() || !PIN || ST.sync.busy || !ST.ready) return;
  if (!navigator.onLine) { ST.sync.err = 'offline'; countPending(); changed(); return; }
  ST.sync.busy = true;
  ST.sync.err = '';
  changed();
  try {
    if (force || !ST.sync.pulled || Date.now() - ST.sync.pulled > 10 * 60000) { step('Checking Google'); mergePull(await call('hello', {})); }
    const sh = dirtyShared();
    if (sh.length) {
      step('Saving your sites and lists');
      const sent = sh.map(x => ({ x, key: hsh(JSON.stringify(x.r)) }));
      await call('put', { list: sh.map(x => ({ t: x.t, r: x.r })) });
      sent.forEach(s => { SYNCED[sharedKey(s.x)] = s.key; });
      await saveSyncState();
    }
    await sendPhotos();
    if (DELQ.length) {
      await call('del', { ids: DELQ });
      DELQ = [];
      await saveSyncState();
    }
    for (const d of ST.docs.filter(docNeeds)) await sendDoc(d);
    ST.sync.last = Date.now();
    await saveSyncState();
  } catch (e) {
    console.warn('sync', e);
    ST.sync.err = e.kind || 'server';
    ST.sync.msg = e.message;
  }
  ST.sync.busy = false;
  ST.sync.step = '';
  countPending();
  changed();
}
async function sendPhotos() {
  PHOTOQ = PHOTOQ.filter(photoWanted);
  let total = PHOTOQ.length, done = 0;
  while (PHOTOQ.length) {
    const batch = [];
    let size = 0;
    for (const q of PHOTOQ.slice(0, 6)) {
      const p = await getPhoto(q.id);
      if (!p || !p.blob) { batch.push({ q, gone: true }); continue; }
      const b64 = await blobToB64(p.blob);
      if (batch.length && size + b64.length > 3500000) break;
      size += b64.length;
      batch.push({ q, p, b64 });
    }
    const list = batch.filter(b => !b.gone).map(b => {
      const d = docById(b.q.rep);
      return { id: b.q.id, rep: b.q.rep, folder: (d.no || 'Draft') + ' ' + d.site.name, label: photoLabel(d, b.q.id), b64: b.b64, w: b.p.w, h: b.p.h };
    });
    step('Sending photos, ' + (done + 1) + ' of ' + total);
    if (list.length) await call('photos', { list }, { timeout: 120000 });
    const ids = batch.map(b => b.q.id);
    PHOTOQ = PHOTOQ.filter(q => !ids.includes(q.id));
    done += batch.length;
    for (const b of batch) if (b.p) { b.p.up = 1; await DB.put('photos', b.p).catch(() => {}); }
    await DB.put('kv', PHOTOQ, 'photoq').catch(storageFail);
  }
}
function carryOf(d) {
  return {
    no: d.no, date: d.date, groups: d.groups.map(g => ({ id: g.id, name: g.name, on: g.on !== false })),
    items: d.items.map(i => ({ gid: i.gid, element: i.element, where: i.where, grade: i.grade, note: String(i.note || '').slice(0, 300), action: String(i.action || '').slice(0, 200), priority: i.priority }))
  };
}
async function sendDoc(d) {
  step('Saving ' + (d.no || 'a draft') + ', ' + d.site.name);
  const key = docKey(d);
  const payload = { r: d, sum: sheetSummary(d) };
  if (isMade(d) && d.pdfUp !== d.rev) {
    // made on the phone when the report was; an example's is drawn now if it never was
    const pdf = await pdfFor(d).catch(() => null);
    if (pdf && pdf.rev === d.rev) payload.pdf = { name: pdf.name, b64: await blobToB64(pdf.blob) };
  }
  if (d.emailReq && isMade(d)) payload.email = { subject: emailSubject(d), body: emailBody(d), ...d.emailReq };
  if (isMade(d) && d.kind === 'condition' && !d.demo) payload.carry = carryOf(d);
  const res = await call('report', payload, { timeout: 150000 });
  SYNCED['doc:' + d.id] = key;
  const cur = docById(d.id);
  if (cur) {
    if (res.pdfUrl) cur.pdfUrl = res.pdfUrl;
    if (res.folderUrl) cur.folderUrl = res.folderUrl;
    if (payload.pdf) cur.pdfUp = d.rev;
    if (payload.email) {
      if (res.emailed) {
        cur.emailed = { to: payload.email.to, cc: payload.email.cc || '', at: Date.now(), rev: d.rev };
        cur.emailReq = null;
        toast((d.no || 'The report') + ' emailed to ' + payload.email.to + '.');
      } else if (res.emailError) {
        cur.emailReq = null;
        cur.emailFail = res.emailError;
        toast('The email did not go: ' + res.emailError, 'err');
      }
    }
    await quietPut(cur);
  }
  if (payload.carry) { ST.lastBySite = { ...ST.lastBySite, [d.siteId]: payload.carry }; saveKV('lastBySite'); }
  await saveSyncState();
}
function requestEmail(d, to, cc) {
  d.emailReq = { to: trim(to), cc: trim(cc), rev: d.rev, at: Date.now() };
  d.emailFail = '';
  quietPut(d);

// Newest copy wins for sites and lists; Google's numbers keep report numbers from repeating
function mergePull(d) {
  if (!d) return;
  const take = (local, remote) => remote && (remote.updated || 0) > ((local && local.updated) || 0);
  if (take(ST.settings, d.settings)) {
    ST.settings = { ...SETTINGS_SEED, ...d.settings };
    SYNCED['settings:settings'] = hsh(JSON.stringify(ST.settings));
    saveKV('settings');
  }
  if (take(ST.library, d.library)) {
    ST.library = d.library;
    SYNCED['library:library'] = hsh(JSON.stringify(ST.library));
    saveKV('library');
  }
  if (d.templates && (d.templates.updated || 0) > (ST.templatesAt || 0)) {
    ST.templates = d.templates.list || [];
    ST.templatesAt = d.templates.updated;
    SYNCED['templates:templates'] = hsh(JSON.stringify({ id: 'templates', list: ST.templates, updated: ST.templatesAt }));
    saveKV('templates');
    saveKV('templatesAt');
  }
  if (d.sites) {
    let any = false;
    d.sites.forEach(rs => {
      const i = ST.sites.findIndex(s => s.id === rs.id);
      if (i < 0 || take(ST.sites[i], rs)) {
        if (i < 0) ST.sites.push(rs); else ST.sites[i] = rs;
        SYNCED['site:' + rs.id] = hsh(JSON.stringify(rs));
        any = true;
      }
    });
    if (any) { ST.sites = [...ST.sites]; saveKV('sites'); }
  }
  if (d.maxNo) {
    const y = new Date().getFullYear(), s = ST.settings, patch = {};
    const cr = d.maxNo[(trim(s.crPrefix) || 'CR') + '-' + y], mc = d.maxNo[(trim(s.mcPrefix) || 'MC') + '-' + y];
    if (cr && +s.crNext <= cr) patch.crNext = cr + 1;
    if (mc && +s.mcNext <= mc) patch.mcNext = mc + 1;
    if (Object.keys(patch).length) {
      ST.settings = { ...ST.settings, ...patch };
      saveKV('settings');
    }
  }
  if (d.reports) {
    const local = new Set(ST.docs.map(x => x.id));
    ST.remote = d.reports.filter(r => !local.has(r.id) && r.status !== 'Deleted' && r.status !== 'Example');
    d.reports.forEach(r => {
      const x = docById(r.id);
      if (x && r.pdfUrl && !x.pdfUrl) { x.pdfUrl = r.pdfUrl; quietPut(x); }
    });
    saveKV('remote');
  }
  if (d.last) { ST.lastBySite = { ...ST.lastBySite, ...d.last }; saveKV('lastBySite'); }
  ST.sync.pulled = Date.now();
  saveSyncState();
  changed();
}

function syncLine() {
  if (!linked()) return { tone: 'na', text: 'Saved on this phone only. Google is not linked.' };
  const s = ST.sync, n = s.pending;
  if (s.busy) return { tone: 'info', text: s.step || 'Saving to Google' };
  if (s.err === 'offline') return { tone: 'warn', text: n ? 'No signal. ' + plural(n, 'thing') + ' will send by itself when you are back online.' : 'No signal. Everything is saved on the phone.' };
  if (s.err === 'pin') return { tone: 'warn', text: 'Google did not answer. If this keeps happening, sign in again in Settings.' };

function SignaturePad({ value, onChange }) {

    const c = ref.current;

    const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = Math.max(1, Math.round(r.width * dpr));
    c.height = Math.max(1, Math.round(r.height * dpr));

    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, r.width, r.height);
    g.lineWidth = 2.6;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.strokeStyle = '#111111';
    if (valueRef.current) {
      const im = new Image();
      im.onload = () => g.drawImage(im, 0, 0, r.width, r.height);
      im.src = valueRef.current;
    }

}

  return { blob: doc.output('blob'), name: reportFileName(d) };

/* ===== ROUTINE CHECK ===== */
async function buildCheckPdf(d) {
  const sum = summarise(d.sections, d.answers);
  const order = [], num = {};
  d.sections.forEach(s => s.items.forEach(it => ((d.answers[it.id] || {}).photos || []).forEach(p => { order.push({ p, it }); num[p] = order.length; })));
  const P = await loadPhotos(order.map(o => o.p));
  const brand = brandOf(d);
  const k = pdfKit({ title: d.templateName, site: d.site.name, no: d.no, rev: d.rev, from: fromLine(d), demo: d.demo, ...brand });
  const { doc, M, CW, W, C } = k;
  k.masthead(d.no, d.rev);
  k.y = 36;
  k.font('bold', 9); k.ink(C.teal); doc.text('ROUTINE CHECK', M, k.y, { baseline: 'top', charSpace: 0.9 });
  k.y += 7;
  k.font('bold', 20); k.ink(C.ink); k.y += k.lines(k.wrap(d.templateName, CW), M, k.y, 20) + 1;
  k.font('normal', 11); k.ink(C.muted); k.y += k.lines(k.wrap([d.site.name, d.asset].filter(Boolean).join(', '), CW), M, k.y, 11) + 5;
  const bad = sum.fails > 0, col = bad ? [181, 48, 42] : [58, 119, 29];
  k.fill(bad ? [251, 229, 226] : [231, 243, 216]); doc.roundedRect(M, k.y, CW, 13, 2, 2, 'F');
  k.font('bold', 12.5); k.ink(col); k.text(bad ? plural(sum.fails, 'fault') + ' found' : 'All checks passed', M + 5, k.y + 3.6);
  k.font('normal', 9); k.ink(C.body); k.text(sum.answered + ' of ' + sum.total + ' answered', W - M - 5, k.y + 4.4, { align: 'right' });
  k.y += 19;
  const facts = [['Checked by', byLine(d) || d.by], ['Date', fmtLongDate(d.date)], ['How often', d.frequency], ['Client', d.site.client || brand.org]].filter(f => trim(f[1]));
  k.table([{ w: 40, label: 'Detail' }, { w: 138, label: '' }], facts.map(f => ({ cells: [{ s: f[0], color: C.muted }, { s: f[1], color: C.ink }] })), { size: 9.4 });
  const row = it => {
    const a = d.answers[it.id] || {}, fail = isFail(it, a), txt = it.type === 'photo' ? ((a.photos || []).length ? 'Photo taken' : 'No photo') : answerText(it, a) || 'Not answered';
    const ph = (a.photos || []).map(p => num[p]).filter(Boolean);
    const extra = [it.type === 'number' ? rangeText(it) : '', trim(a.note), ph.length ? (ph.length === 1 ? 'Photo ' : 'Photos ') + listText(ph.map(String)) + '.' : ''].filter(Boolean).join('  ');
    return { cells: [{ s: it.label + (extra ? '\n' + extra : ''), color: C.ink }, { s: txt, bold: true, color: fail ? rgb(GRADES[3].fill) : txt === 'Not answered' ? C.faint : C.ink }] };
  };
  const failed = [];
  d.sections.forEach(s => s.items.forEach(it => { if (isFail(it, d.answers[it.id])) failed.push(it); }));
  if (failed.length) { k.heading(null, 'Needs attention'); k.table([{ w: 128, label: 'Check' }, { w: 50, label: 'Answer' }], failed.map(row)); }
  d.sections.forEach(s => { k.heading(null, s.title); k.table([{ w: 128, label: 'Check' }, { w: 50, label: 'Answer' }], s.items.map(row)); });
  k.heading(null, 'Sign off');
  k.para(trim(d.notes) || 'No extra notes.', 10, { color: trim(d.notes) ? C.body : C.faint });
  if (d.signature) { k.need(28); try { doc.addImage(d.signature, 'PNG', M, k.y, 60, 22, 'sig', 'FAST'); } catch (e) {} k.y += 24; k.font('normal', 8.5); k.ink(C.muted); k.text(d.by + ', ' + fmtLongDate(isoDay(new Date(d.made))), M, k.y); k.y += 8; }
  if (order.length) {
    k.heading(null, 'Photographs');
    const gw = (CW - 6) / 2, bh = 64;
    for (let i = 0; i < order.length; i += 2) {
      const pair = [order[i], order[i + 1]].filter(Boolean);
      k.need(bh + 14);
      pair.forEach((o, j) => {
        const x = M + j * (gw + 6);
        k.photoBox(P[o.p], x, k.y, gw, bh);
        k.font('normal', 8.2); k.ink(C.body); k.lines(k.wrap('Photo ' + num[o.p] + '.  ' + o.it.label, gw).slice(0, 2), x, k.y + bh + 2, 8.2);
      });
      k.y += bh + 13;
    }
  }
  k.finish();
  return { blob: doc.output('blob'), name: reportFileName(d) };
}

/* ===== THE EMAIL THAT GOES WITH IT ===== */
function emailSubject(d) { return d.no + ' ' + docTitle(d) + ', ' + d.site.name + (d.rev > 1 ? ' (revision ' + d.rev + ')' : ''); }
function emailBody(d) {
  const o = docOutcome(d), who = firstName(d.site.contact);
  const lines = [who ? 'Hello ' + who + ',' : 'Hello,', ''];
  if (d.kind === 'condition') {
    lines.push('Please find attached the condition report for ' + d.site.name + ' from my visit on ' + fmtLongDate(d.date) + '.');

    if (o.grade) lines.push('Overall condition: ' + o.label + '.');
    if (o.urgent) lines.push(plural(o.urgent, 'item needs', 'items need') + ' urgent attention.');
    if (o.cost) lines.push('Estimated cost of the recommended work: ' + euro(o.cost) + ', excluding VAT.');

    lines.push(o.fails ? plural(o.fails, 'fault was', 'faults were') + ' found. The details are in the report.' : 'All checks passed.');

function demoPhoto(label, n, portrait) {
  const w = portrait ? 900 : 1200, hgt = portrait ? 1200 : 900;
  const c = document.createElement('canvas');
  c.width = w; c.height = hgt;
  const g = c.getContext('2d'), pal = DEMO_PALETTE[n % DEMO_PALETTE.length];
  const gr = g.createLinearGradient(0, 0, 0, hgt);
  gr.addColorStop(0, pal[0]); gr.addColorStop(1, pal[1]);
  g.fillStyle = gr; g.fillRect(0, 0, w, hgt);
  g.fillStyle = 'rgba(255,255,255,.18)';
  for (let i = 0; i < 7; i++) g.fillRect((i * 173 + n * 37) % w, hgt * 0.35 + (i % 3) * 60, 120 + (i * 29) % 140, 22 + (i * 13) % 50);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(w * 0.1, hgt * 0.62); g.lineTo(w * 0.5, hgt * 0.3); g.lineTo(w * 0.9, hgt * 0.62); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, hgt - 110, w, 110);
  g.fillStyle = '#fff'; g.font = 'bold 44px Arial, sans-serif';
  g.fillText(label.slice(0, 34), 36, hgt - 50);
  g.font = '28px Arial, sans-serif';
  g.fillText('Example photo ' + n, 36, hgt - 16);
  return new Promise(res => c.toBlob(b => res({ blob: b, w, h: hgt }), 'image/jpeg', 0.82));
}
async function demoPhotoRec(label, n, rep, portrait) {

/* ===== NAVIGATION: a stack of screens, and the phone's Back button walks it ===== */
// The app keeps one spare history entry. Back uses it up; the app closes the top sheet or screen and
// puts the entry back. On the start screen with nothing open, the next Back leaves the app as usual.
const NAV = { set: null, stack: [{ name: 'home', params: {} }] };
function armBack() {
  try { if (!(history.state && history.state.app)) history.pushState({ app: true }, ''); } catch (e) {}
}
function makeNav(stack, setStack) {
  const top = stack[stack.length - 1];
  const to = s => { window.scrollTo(0, 0); NAV.stack = s; setStack(s); };
  return {
    name: top.name, params: top.params || {},
    go(name, params) { to([...NAV.stack, { name, params: params || {} }]); armBack(); },
    replace(name, params) { to([...NAV.stack.slice(0, -1), { name, params: params || {} }]); },
    back() { if (NAV.stack.length > 1) to(NAV.stack.slice(0, -1)); },
    // back to the screen underneath when it is the one wanted (with new params), otherwise a new one
    backTo(name, params) {
      const s = NAV.stack.slice(0, -1), under = s[s.length - 1];
      if (under && under.name === name && (under.params || {}).id === params.id) to([...s.slice(0, -1), { name, params }]);
      else { to([...NAV.stack, { name, params }]); armBack(); }
    },
    // a report is made: the screens that built it go, so Back from the report goes where it was started from
    finished(name, params) {
      to([...NAV.stack.filter((x, i) => i === 0 || (x.params || {}).id !== params.id), { name, params }]);
    },
    home() { to([{ name: 'home', params: {} }]); },
    tab(name) { to([{ name, params: {} }]); }
  };
}
window.addEventListener('popstate', () => {
  if (OVERLAYS.length) { OVERLAYS[OVERLAYS.length - 1](); armBack(); return; }
  if (NAV.stack.length > 1 && NAV.set) { window.scrollTo(0, 0); NAV.stack = NAV.stack.slice(0, -1); NAV.set(NAV.stack); armBack(); }

  const p = await DB.get('kv', 'pdf:' + d.id).catch(() => null);
  if (p && p.rev === d.rev && p.blob) return p;
  const built = d.kind === 'condition' ? await buildConditionPdf(d) : await buildCheckPdf(d);
  const rec = { rev: d.rev, blob: built.blob, name: built.name };
  await DB.put('kv', rec, 'pdf:' + d.id).catch(() => {});
  return rec;
}

function BrandCard() {

      const c = document.createElement('canvas');

      const g = c.getContext('2d');

      r.done();
