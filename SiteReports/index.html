<title>Site Reports</title>

<style>
html,body{margin:0;min-height:100%;background:#fff;color:#111;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 20px 40px;display:flex;flex-direction:column;gap:22px}
h1{font-size:30px;line-height:1.15;margin:14px 0 4px;letter-spacing:-.02em}
p{margin:0;color:#6B6B70}
form{display:flex;flex-direction:column;gap:12px}
label{font-weight:650;font-size:15px}
input{width:100%;box-sizing:border-box;min-height:52px;padding:12px 14px;border:1.5px solid #E5E5E7;border-radius:12px;font:22px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.12em;text-align:center;text-transform:uppercase;color:#111;background:#fff}
input:focus{outline:none;border-color:#111}
.pw{position:relative}
.pw input{padding:12px 78px 12px 16px;text-align:left;font-size:20px;letter-spacing:.08em}
.eye{position:absolute;right:6px;top:6px;bottom:6px;min-height:0;padding:0 12px;border-radius:9px;background:#F4F4F5;color:#111;font-size:14px}
button{min-height:52px;border:0;border-radius:12px;background:#111;color:#fff;font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
button:disabled{opacity:.55}
#msg{min-height:22px;font-size:15px;font-weight:650;color:#B42318}
#msg.wait{color:#6B6B70;font-weight:500}
.tip{background:#F4F4F5;border-radius:12px;padding:10px 12px;font-size:14px;color:#3A3A3C}
</style>
</head>

<main>
  <div><svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" rx="15" fill="#fff" stroke="#E4E4E4" stroke-width="2"/><path d="M15 31 32 17l17 14M19 28v19h26V28" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="m25 38 5 5 9-10" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>Site Reports</h1><p id="lead">Opening</p></div>
  <form id="f" hidden action="./" method="post">
    <input type="text" name="username" autocomplete="username" value="Site Reports" hidden tabindex="-1" aria-hidden="true">
    <label for="k">Password</label>
    <div class="pw"><input id="k" name="password" type="password" autocomplete="current-password" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" maxlength="20" placeholder="XXXX-XXXX-XXXX"><button type="button" class="eye" id="eye" aria-pressed="false">Show</button></div>
    <button id="go">Open</button>
    <div id="msg" role="status"></div>
  </form>
  <p class="tip" id="ios" hidden>On an iPhone, put it on your home screen first (Share, then Add to Home Screen), open it from there and type the password once. If your iPhone saved it, tap the box and pick Site Reports.</p>
