<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E2024">
<title>Report Studio · Wiggins &amp; Associates</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Report Studio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#1A1C20;color:#fff;font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden}
.art{position:fixed;inset:0;background:url(hero.jpg) center/cover no-repeat;opacity:.38}
.art::after{content:'';position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 50%,rgba(26,28,32,.55),#1A1C20 92%)}
.card{position:relative;width:100%;max-width:400px;text-align:center}
.logo{width:min(300px,82vw);height:auto}
.eyebrow{margin-top:34px;font:500 11px 'Cinzel',serif;letter-spacing:.34em;text-transform:uppercase;color:#E7B9B4}
h1{font:600 38px/1.05 'Cormorant Garamond',serif;margin-top:10px;letter-spacing:-.01em}
p.lead{color:#B9BDC3;font-size:15px;line-height:1.55;margin:12px 0 24px}
form{display:flex;flex-direction:column;gap:12px;text-align:left}
input[type=password]{width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:16px}
input[type=password]:focus{outline:none;border-color:#C9474A;background:rgba(255,255,255,.1)}
label{display:flex;align-items:center;gap:9px;font-size:14px;color:#B9BDC3}
label input{width:17px;height:17px;accent-color:#8F1C1D}
button{padding:14px;border:0;border-radius:10px;font:inherit;font-size:16px;font-weight:600;color:#fff;background:#8F1C1D;cursor:pointer}
button:hover{background:#A32427}
button[disabled]{opacity:.6}
.msg{min-height:20px;font-size:14px;color:#FF9C92;text-align:center}
.opening{display:none;margin-top:26px;color:#B9BDC3;font-size:15px}
.opening i{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:9px}
@keyframes s{to{transform:rotate(360deg)}}
body.auto form,body.auto p.lead{display:none}
body.auto .opening{display:block}
</style>
</head>
<body>
<div class="art" aria-hidden="true"></div>
<main class="card">
  <img class="logo" src="icons/logo-light.svg" alt="Wiggins &amp; Associates Architects">
  <div class="eyebrow">Report Studio</div>
  <h1>Private studio</h1>
  <p class="lead">Open it with your private link, or enter the password.</p>
  <form id="f" autocomplete="off">
    <input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
    <label><input type="checkbox" id="keep" checked> Remember on this computer</label>
    <button id="go" type="submit">Open Report Studio</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="opening"><i></i>Opening the studio…</div>
</main>

var ROUNDS = 600000, KEEP = 'wig.lock.v1';
function bytes(b64){ var s = atob(b64.replace(/-/g,'+').replace(/_/g,'/')), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function b64(a){ var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
var all = bytes(DATA), salt = all.slice(0, 16), iv = all.slice(16, 28), body = all.slice(28);

function remember(raw){ try { localStorage.setItem(KEEP, JSON.stringify({ salt: saltId, key: b64(raw) })); } catch (_) {} }
async function open(key){
