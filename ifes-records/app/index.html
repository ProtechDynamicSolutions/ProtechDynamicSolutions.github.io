/* ================= UNLOCK ================= */
/* Typed once per device. Verified against the server before it is stored, so a
   wrong code fails here rather than silently failing to sync all day. */
function UnlockView({onDone, settings}){
  /* Two steps, not one form. The connection code is a per-device thing that is
     done once and then never again; the name and PIN are per-person and get
     typed on a phone that has already been connected. Putting them on one
     screen made the common case — somebody signing in on a phone that is
     already connected — look like it needed three answers. */
  const [step, setStep] = useState(CONN.needed ? 'conn' : 'pin');
  const [conn, setConn] = useState('');
  const [name, setName] = useState('');
  const [pin, setPin] = useState('');
  const [trap, setTrap] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  /* When the credentials screen appeared. Sent with the sign-in so the server
     can refuse a submit that came back faster than anyone can type. */
  const opened = useRef(Date.now());

  /* Step one. Checked against the server before it is kept, so a mistyped code
     fails here rather than looking like a wrong PIN a minute later. */
  const connect = async () => {
    const t = conn.trim();
    if(t.length < 6) return setErr('Enter the last 10 characters of the link the office gave you.');
    const url = CONN.url(t);
    if(!url) return setErr('This build has no connection link set.');
    setBusy(true); setErr('');
    try{
      API.url = url;
      /* An empty sign-in: the wrong-credentials answer proves the address is
         real, which is all this step needs to establish. */
      await API.raw('ping', {}, { user:'', pin:'' });
      CONN.tail = t;
    }catch(e){
      if(/returned \d/.test(e.message) || /Failed to fetch/i.test(e.message)){
        API.url = CONN.url();
        setBusy(false);
        return setErr('That code did not reach the office. Check the last 10 characters and try again.');
      }
      /* Anything else means the script answered — the address is right. */
      CONN.tail = t;
    }
    setBusy(false); setErr('');
    opened.current = Date.now();
    setStep('pin');
  };

  /* Step two. Verified before anything is stored, so a wrong PIN fails here
     rather than silently failing to sync all day. The reply also says who you
     are and who else is on the team, which is where the inspector name and the
     share list come from. */
  const go = async () => {
    if(!name.trim()) return setErr('Enter your name or email exactly as the office has it.');
    if(!/^\d{4,}$/.test(pin.trim())) return setErr('Enter the PIN the office gave you.');
    const creds = { user: name.trim(), pin: pin.trim(), trap, dwell: Date.now() - opened.current };
    setBusy(true); setErr('');
    try{
      const res = await API.raw('ping', {}, creds);
      API.save(creds, res.owner || '', res.team || [], res.token || '');
      onDone(res.owner || '');
    }catch(e){
      setErr(e.message);
      setBusy(false);
    }
  };
  return (<div className="min-h-screen flex items-center justify-center p-6 brandgrad">
    <div className="card p-6 w-full max-w-sm">
      <div className="flex items-center gap-3 mb-4">
        {settings.logo
          ? <img src={settings.logo} alt="" style={{ height:58, width:'auto' }}/>
          : <div className="rounded-xl brandgrad p-1"><Mark size={30}/></div>}
        <div>
          <h1 className="font-bold text-slate-800 leading-tight">{settings.companyName}</h1>
          <p className="text-xs text-slate-400">Inspection &amp; test records</p>
        </div>
      </div>
      {!CONN.head && !BRAND.apiUrl ? (
        <div className="rounded-xl border p-3 text-xs" style={{ borderColor:'#fcd9b6', background:'#fff8f1', color:'#7c4a17' }}>
          This copy is not connected to a backend yet. Set <b>apiUrlHead</b> in the config block at the top of the
          file to the web-app link with its last 10 characters removed.
        </div>
      ) : step === 'conn' ? (<>
        <p className="text-sm text-slate-500 mb-4">
          First, connect this device. Enter the <b>last 10 characters</b> of the link the office gave you — once,
          and never again on this phone.
        </p>
        <Field label="Connection code" value={conn} onChange={v=>setConn(v.trim())} placeholder="10 characters"/>
        {err && <p className="text-xs text-red-600 font-semibold mt-2">{err}</p>}
        <button className="btn btn-a w-full mt-4" disabled={busy} onClick={connect}>{busy ? 'Connecting…' : 'Connect'}</button>
        <p className="text-xs text-slate-400 mt-3">
          Your name and PIN come next. Keeping the link out of the app means a copy of this page, on its own, does
          not say where your records are kept.
        </p>
      </>) : (<>
        <p className="text-sm text-slate-500 mb-4">
          Sign in with your name and PIN. You only do this once — the phone remembers it.
        </p>
        {/* Not for you. A field no human sees, so anything that fills it in
            was reading the HTML rather than looking at the page. The server is
            what acts on it — a check only the browser does is a check an
            attacker simply does not run. */}
        <input type="text" name="company_website" value={trap} onChange={e=>setTrap(e.target.value)}
          tabIndex={-1} autoComplete="off" aria-hidden="true"
          style={{ position:'absolute', left:'-9999px', width:1, height:1, opacity:0 }}/>
        <div className="space-y-3">
          <Field label="Your name or email" value={name} onChange={setName} placeholder="As the office has it"/>
          {/* No length is stated anywhere, so a longer PIN on an account that
              needs one is not something the rest of the crew ever notices. */}
          <Field label="PIN" value={pin} onChange={v=>setPin(v.replace(/\D/g,'').slice(0,16))}
            type="password" inputMode="numeric" placeholder="••••••"/>
        </div>
        {err && <p className="text-xs text-red-600 font-semibold mt-2">{err}</p>}
        <button className="btn btn-a w-full mt-4" disabled={busy} onClick={go}>{busy ? 'Checking…' : 'Sign in'}</button>
        {CONN.head && !BRAND.apiUrl && (
          <button className="text-xs font-bold w-full mt-3" style={{color:'var(--c3)'}}
            onClick={()=>{ CONN.tail = ''; API.url = CONN.url(); setErr(''); setConn(''); setStep('conn'); }}>
            Connected to the wrong link? Start again
          </button>
        )}
        <p className="text-xs text-slate-400 mt-3">
          Signing in is required — there is no way past this screen. Once you are in, the app keeps working with no
          signal and uploads when coverage returns. Forgotten your PIN? The office can change it in the sheet.
        </p>
      </>)}
    </div>
  </div>);
}

/* ================= APP ROOT ================= */
function App(){
  const [settings, setSettings] = useState(() => applyBrand(store.get('settings', null)));
  const [customers, setCustomers] = useState(() => store.get('customers', []));
  const [jobs, setJobs] = useState(() => {
    const saved = store.get('jobs', null);
    return (saved && saved.length) ? saved : [];
  });
  /* Everything typed is already written to this device within half a second, so
     a refresh never loses work. What used to be lost was your PLACE — the record
     you had open and the tab you were on — which on a 28-question inspection is
     its own kind of losing your work. Both are remembered. */
  const [view, setView] = useState(() => store.get('lastView', 'list') || 'list');
  const [jobId, setJobId] = useState(() => store.get('lastJobId', null));
  const [toastMsg, setToastMsg] = useState('');
  const [syncState, setSyncState] = useState({ busy:false, pending: queue.list.length, last: store.get('lastSync',''), error:'' });
  /* No "work offline" escape. Being signed in is what scopes a device to one
     person's records, so letting somebody past this screen without it would
     hand them an app with no owner and nothing to sync to. Once signed in the
     app works with no signal — that is a different thing from never signing in. */
  const [locked, setLocked] = useState(!API.on);
  const [, forceTick] = useState(0);
  const tick = () => forceTick(x => x + 1);
  const toastTimer = useRef(null);
  const toast = (m) => { setToastMsg(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(()=>setToastMsg(''), 2200); };

  /* Seven taps on the title, then the PIN, reveals the branding controls. */
  const tapRef = useRef({ n:0, t:0 });
  const secretTap = () => {
    const now = Date.now(); const r = tapRef.current;
    r.n = (now - r.t < 1200) ? r.n + 1 : 1; r.t = now;
    if(r.n < 7) return;
    r.n = 0;
    if(maintUnlocked()){ sessionStorage.removeItem('ifes_unlocked'); tick(); toast('Maintenance mode off'); return; }
    const pin = prompt('Maintenance PIN');
    if(pin === null) return;
    if(LOCAL_PIN && pin.trim() === LOCAL_PIN){ sessionStorage.setItem('ifes_unlocked','1'); tick(); setView('settings'); toast('Maintenance mode on'); }
    else toast('Incorrect PIN');
  };

  /* The header changes height between views, so measure it rather than guessing.
     The tab strip sticks to whatever this reports. */
  const headerRef = useRef(null);
  useEffect(()=>{
    const sync = () => {
      const h = headerRef.current && headerRef.current.offsetHeight;
      if(h) document.documentElement.style.setProperty('--hdr', h + 'px');
    };
    sync();
    window.addEventListener('resize', sync);
    return () => window.removeEventListener('resize', sync);
  });

  /* Theme variables live on the root element so PDF and UI stay in step. */
  useEffect(()=>{
    const r = document.documentElement.style;
    r.setProperty('--c1', settings.c1);
    r.setProperty('--c2', settings.c2);
    r.setProperty('--c3', settings.c3);
    const [rr,gg,bb] = hexToRgb(settings.c1);
    r.setProperty('--c1-soft', 'rgba('+rr+','+gg+','+bb+',.06)');
    document.title = (settings.companyName || 'IFES') + ' — Records';
    store.set('settings', settings);
  }, [settings]);


  useEffect(()=>{ store.set('customers', customers); }, [customers]);
  useEffect(()=>{ store.set('lastView', view); store.set('lastJobId', jobId); }, [view, jobId]);
  /* Debounced so typing does not write to storage on every keystroke — but a
     phone can kill a backgrounded tab without warning, so the pending write is
     flushed the moment the page is hidden. Without this the last few seconds of
     typing are lost exactly when somebody switches apps to take a call. */
  useEffect(()=>{ const t = setTimeout(()=>store.set('jobs', jobs), 400); return ()=>clearTimeout(t); }, [jobs]);
  useEffect(()=>{
    const flush = () => { if(document.visibilityState === 'hidden') store.set('jobs', jobs); };
    document.addEventListener('visibilitychange', flush);
    window.addEventListener('pagehide', flush);
    return () => { document.removeEventListener('visibilitychange', flush); window.removeEventListener('pagehide', flush); };
  }, [jobs]);

  /* A logo dropped in as cert.txt beside index.html wins, so the logo can be
     swapped later without rebuilding the app. */
  useEffect(()=>{
    fetch('cert.txt', { cache:'no-store' })
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(t => { if(t && t.trim().indexOf('data:image') === 0) setSettings(s => Object.assign({}, s, { logo: t.trim() })); })
      .catch(()=>{});
  }, []);

  /* ---- sync ---- */
  /* One place that knows how to send a batch up, so the ordinary queue and the
     catch-up sweep below cannot drift apart. */
  const uploadJobs = async (list) => {
    if(!list.length) return;
    await API.call('pushJobs', { jobs: list.map(j => ({
      id: j.id, updatedAt: j.updatedAt, meta: jobMeta(j),
      json: Object.assign({}, j, { photos: undefined })
    })) });
    /* Photos go up one at a time: they are much larger than a job record. */
    for(const j of list){
      for(const ph of (j.photos || [])){
        if(ph.synced) continue;
        try{ await API.call('pushPhoto', { photo: { id: ph.id, jobId: j.id, data: ph.data, caption: ph.caption, obsId: ph.obsId, ts: ph.ts } }); }catch(e){}
      }
    }
    queue.clear(list.map(j => j.id));
  };

  const syncNow = async () => {
    if(!API.on) return;
    setSyncState(s => Object.assign({}, s, { busy:true, error:'' }));
    try{
      const ids = queue.list;
      await uploadJobs(jobs.filter(j => ids.indexOf(j.id) > -1));
      if(customers.length) await API.call('pushCustomers', { customers });
      const data = await API.call('pull', {});

      /* Catch-up sweep. A record made before this device was signed in was
         never put on the upload queue, so it sat on the phone looking finished
         and never reached the sheet. Anything the server has not heard of goes
         up now — which also covers a queue lost to a cleared browser, or a
         record typed while the backend was down. Deleted records come back as
         tombstones and are therefore "known", so nothing is resurrected. */
      if(data && data.jobs){
        const known = {};
        data.jobs.forEach(r => { known[r.id] = true; });
        const strays = jobs.filter(j => !known[j.id]);
        if(strays.length){
          await uploadJobs(strays);
          toast(strays.length + ' earlier record' + (strays.length === 1 ? '' : 's') + ' uploaded');
        }
      }
      const needPhotos = [];
      if(data && data.jobs){
        setJobs(prev => {
          const map = {};
          prev.forEach(j => { map[j.id] = j; });
          data.jobs.forEach(r => {
            if(r.deleted){ delete map[r.id]; return; }
            const local = map[r.id];
            /* Last write wins, and local photos are kept because they are not
               included in the job record itself. */
            if(!local || (r.updatedAt || '') > (local.updatedAt || '')){
              /* Photos are pushed and pulled separately from the record because
                 they are far bigger than it. A record arriving from somebody
                 else has none on this device yet, so it is noted and fetched
                 below — otherwise a shared job turns up with its evidence
                 missing, which is worse than not sharing it at all. */
              if(!local) needPhotos.push(r.id);
              map[r.id] = Object.assign({}, r, { photos: (local && local.photos) || [] });
            }
          });
          return Object.values(map).sort((a,b) => (b.date||'').localeCompare(a.date||''));
        });
      }
      /* One request per new record rather than one giant pull: a job with
         a dozen photos is megabytes, and most syncs need none of it. */
      for(const id of needPhotos.slice(0, 20)){
        try{
          const got = await API.call('pullPhotos', { jobId: id });
          if(got && got.length){
            setJobs(prev => prev.map(j => j.id === id
              ? Object.assign({}, j, { photos: got.map(ph => ({
                  id: ph.id, data: ph.data, caption: ph.caption || '', obsId: ph.obsId || '', ts: ph.ts || '', synced: true })) })
              : j));
          }
        }catch(e){}
      }
      if(data && data.customers && data.customers.length) setCustomers(data.customers);
      const now = nowISO();
      store.set('lastSync', now);
      setSyncState({ busy:false, pending: queue.list.length, last: now, error:'' });
    }catch(e){
      setSyncState(s => Object.assign({}, s, { busy:false, pending: queue.list.length, error: 'Sync failed: ' + e.message }));
    }
  };

  useEffect(()=>{
    if(!API.on) return;
    syncNow();
    const iv = setInterval(()=>{ if(navigator.onLine && queue.list.length) syncNow(); }, 60000);
    const on = () => syncNow();
    window.addEventListener('online', on);
    return () => { clearInterval(iv); window.removeEventListener('online', on); };
  }, []);

  const job = jobs.find(j => j.id === jobId) || null;
  const setJob = (next) => {
    setJobs(prev => prev.map(j => j.id === next.id ? next : j));
    /* Queued whether or not the connection is up right now — the queue is what
       remembers, and a record that never got queued is a record that never
       syncs. */
    queue.add(next.id);
    setSyncState(s => Object.assign({}, s, { pending: queue.list.length }));
  };
  const newJob = (kind, site) => {
    const k = kind === 'test' ? 'test' : 'periodic';
    const j = blankJob(k);
    j.prNo = nextRecNo(jobs, k);
    if(settings.defaultInspector){ j.inspector = settings.defaultInspector; j.sig.name = settings.defaultInspector; }
    if(settings.defaultCertifierNo) j.pir.certifierNo = settings.defaultCertifierNo;
    if(site){
      j.customerId = site.id; j.customerName = site.name; j.address = site.address;
      j.phone = site.phone; j.email = site.email; j.pir.occupant = site.name;
      j.lat = site.lat || ''; j.lng = site.lng || '';
    }
    /* Prefer the last record of the same kind at the same site — that is the one
       whose circuit schedule or RCD list is worth having. Fall back to any
       record at that site, then to the last record of this kind anywhere, which
       at least carries the tester's name and the instruments. */
    const atSite = site
      ? jobs.filter(x => (site.id && x.customerId === site.id) || (x.customerName || '') === site.name)
      : [];
    const prev = atSite.find(x => kindOf(x) === k) || atSite[0] || jobs.find(x => kindOf(x) === k);
    carryForward(j, prev);
    if(prev && atSite.indexOf(prev) > -1) toast('Details carried over from ' + fmtDate(prev.date));
    setJobs(prev => [j, ...prev]);
    queue.add(j.id);
    setJobId(j.id); setView('job');
  };
  const deleteJob = (id) => {
    const j = jobs.find(x => x.id === id);
    if(!confirm('Delete the ' + KINDS[kindOf(j)].label.toLowerCase() + ' for ' + ((j && j.customerName) || 'this site') + '?')) return;
    setJobs(prev => prev.filter(x => x.id !== id));
    if(API.on) API.call('deleteJob', { id }).catch(()=>{});
  };
  const saveCustomers = (updater) => setCustomers(prev => typeof updater === 'function' ? updater(prev) : updater);

  if(locked) return <UnlockView settings={settings} onDone={(owner)=>{
    /* A personal sign-in names its holder, so the app stops asking who they are. */
    if(owner) setSettings(st => Object.assign({}, st, { defaultInspector: st.defaultInspector || owner }));
    setLocked(false);
    syncNow();
  }}/>;

  const headerTitle = view==='job' && job ? (job.customerName || 'Record')
    : view==='sites' ? 'Sites'
    : view==='settings' ? 'Settings'
    : (settings.companyName || 'Records');

  return (<div className="min-h-screen">
    <header ref={headerRef} className="sticky top-0 z-40 brandgrad" style={{ color: textOn(settings.c1) }}>
      <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
        {view !== 'list'
          ? <button className="text-2xl leading-none -ml-1 px-1" onClick={()=>{ setView('list'); setJobId(null); }}>‹</button>
          : <BrandLogo settings={settings} h={44}/>}
        <div className="min-w-0 flex-1">
          <div className="font-bold truncate leading-tight cursor-default" onClick={secretTap}>{headerTitle}</div>
          <div className="text-[11.5px] opacity-90 truncate">
            {view==='job' && job ? [KINDS[job.kind || 'periodic'].short, job.prNo, fmtDate(job.date)].filter(Boolean).join(' • ')
              : (API.on
                  ? (syncState.busy ? 'Syncing…' : syncState.pending ? syncState.pending + ' waiting to upload' : 'Synced')
                  : 'Saved on this device')}
          </div>
        </div>
        {view==='job' && job && (()=>{ const a = audit(job); return a.urgent.length
          ? <span className="chip chip-hdr-bad">Urgent</span>
          : <span className="chip chip-hdr">{a.answered}/{a.total}</span>; })()}
      </div>
      <div style={{height:3, background:'rgba(255,255,255,.22)'}}/>
    </header>


    <main className="max-w-3xl mx-auto px-4 pt-4">
      {view === 'list' && <JobList jobs={jobs} openJob={(id)=>{ setJobId(id); setView('job'); }} newJob={(k)=>newJob(k)} go={setView} deleteJob={deleteJob} settings={settings} toast={toast}/>}
      {view === 'sites' && <SitesView customers={customers} saveCustomers={saveCustomers} toast={toast} onNew={(k,c)=>newJob(k,c)}/>}
      {view === 'settings' && <SettingsView settings={settings} setSettings={setSettings} syncNow={syncNow} syncState={syncState} jobs={jobs} toast={toast} tick={tick}/>}
      {view === 'job' && job && <JobEditor job={job} setJob={setJob} settings={settings} customers={customers} saveCustomers={saveCustomers} toast={toast} back={()=>{ setView('list'); setJobId(null); }}/>}
      {view === 'job' && !job && <div className="card p-8 text-center text-slate-400">Record not found. <button className="font-bold" style={{color:'var(--c3)'}} onClick={()=>setView('list')}>Back to list</button></div>}
    </main>

    <Toast msg={toastMsg}/>
    <footer className="max-w-3xl mx-auto px-4 py-8 text-center text-[11px] text-slate-400">
      {settings.footerText || 'Electrical inspection and test records'} · Not an official certification platform
    </footer>
  </div>);
}

try{
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  var boot = document.getElementById('boot'); if(boot) boot.style.display = 'none';
}catch(err){ window.__err(err && err.message ? err.message : err); }
</script>
</body>
</html>
