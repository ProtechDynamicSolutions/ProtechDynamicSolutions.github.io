            ({c}) {PIR_CODES[c]}
          </button>
        ))}
      </div>
      {obs.code === '1' && (
        <p className="text-xs text-red-600 font-semibold mt-1.5">
          Urgent. The person responsible for the installation must be told without delay, and the whole report becomes Unsatisfactory.
        </p>
      )}
    </div>
    <PhotoStrip photos={photos} label="Evidence"
      onAdd={files=>addPhotos(files, obs.id)} onCaption={capPhoto} onDelete={delPhoto}/>
    <div className="flex items-center gap-2 pt-1">
      {showRef && <div className="w-24"><Field label="Ref" value={obs.ref} onChange={v=>upObs(obs.id,{ref:v})} placeholder={String(index+1)}/></div>}
      <button className="btn btn-d !min-h-[38px] !py-1.5 text-sm ml-auto" onClick={()=>delObs(obs.id)}>Delete observation</button>
    </div>
  </div>);
}

/* ================= SHARING =================
   A job is often two visits by two people: one does the dead tests, somebody
   else energises it and does the live ones. Handing the record over has to be
   possible without handing over a sign-in, so the record carries a list of who
   else may open it. The server is what enforces the list — this is just the
   control that sets it. */
function ShareBox({job, up, toast}){
  const team = (API.team || []).filter(n => n && n !== API.owner);
  const shared = job.sharedWith || [];
  const mine = !job.owner || !API.owner || job.owner === API.owner;
  const toggle = (n) => {
    const next = shared.indexOf(n) > -1 ? shared.filter(x => x !== n) : [...shared, n];
    up({ sharedWith: next });
    toast(shared.indexOf(n) > -1 ? 'No longer shared with ' + n : 'Shared with ' + n);
  };
  return (<Section title="Who can work on this"
    chip={shared.length ? <span className="chip" style={{ background:'rgba(0,135,200,.12)', color:'var(--c1)' }}>Shared</span> : null}>
    {!mine && (
      <p className="text-sm text-slate-600 mb-3">
        Created by <b>{job.owner}</b> and shared with you. Anything you record here goes back to the same record.
      </p>
    )}
    {!API.on ? (
      <p className="text-sm text-slate-400">Sharing needs a connection — sign in on this device to hand a job over.</p>
    ) : team.length === 0 ? (
      <p className="text-sm text-slate-400">
        Nobody else is set up yet. The office adds electricians to the Techs tab of the sheet.
      </p>
    ) : (<>
      <p className="text-xs text-slate-500 mb-2.5 leading-relaxed">
        Tick anyone who needs to open this record — the second person on a pre/post job, or whoever is covering
        for you. They can finish it and sign it; only you can delete it.
      </p>
      <div className="flex flex-wrap gap-2">
        {team.map(n => (
          <button key={n} type="button" onClick={()=>toggle(n)}
            className={'tabbtn ' + (shared.indexOf(n) > -1 ? 'on' : 'off')}>{n}</button>
        ))}
      </div>
    </>)}
  </Section>);
}

/* ================= TEST-RECORD UI ================= */
function Check({label, value, onChange}){
  return (<label className="flex items-center gap-2 text-sm text-slate-700 cursor-pointer py-1.5">
    <input type="checkbox" checked={!!value} onChange={e=>onChange(e.target.checked)}
      className="w-[18px] h-[18px] shrink-0" style={{accentColor:'var(--c2)'}}/>
    <span className="leading-tight">{label}</span>
  </label>);
}

/* Readings are checked against the limits as they are typed. Finding a bad
   insulation reading at the board is worth something; finding it a week later
   in the office is not. */
function irClass(v){
  if(!v) return '';
  const n = parseFloat(String(v).replace(/[^0-9.]/g,''));
  if(isNaN(n)) return '';
  return n < 1 ? ' bad' : n < 2 ? ' warn' : '';
}
function zsClass(zs, maxZs){
  if(!zs) return '';
  const n = parseFloat(String(zs).replace(/[^0-9.]/g,'')), m = parseFloat(maxZs);
  if(isNaN(n) || isNaN(m)) return '';
  return n > m ? ' bad' : n > m*0.8 ? ' warn' : '';
}
function rcdClass(v, limit){
  if(!v) return '';
  const n = parseFloat(String(v).replace(/[^0-9.]/g,''));
  return isNaN(n) ? '' : (n > limit ? ' bad' : '');
}

/* A meter reading is not always a plain number — "<0.01" and ">299" are real
   answers — so the field allows those and nothing else. */
function GridInput({value, onChange, cls='', ph}){
  return <input className={'gridin' + cls} inputMode="decimal" placeholder={ph} value={value || ''}
    onChange={e=>onChange(e.target.value.replace(/[^0-9.<>\-]/g, ''))}/>;
}

function CircuitCard({c, i, total, upC, dupC, delC, moveC}){
  const [open, setOpen] = useState(!c.designation);
  const sub = [c.cableType, c.cableSize && c.cableSize + ' mm²', c.device && [c.device, c.deviceType, c.amps && c.amps + 'A'].filter(Boolean).join(' ')].filter(Boolean).join(' • ');
  return (<div className="card overflow-hidden">
    <button className="w-full flex items-center justify-between gap-2 p-4 text-left" onClick={()=>setOpen(!open)}>
      <div className="flex items-center gap-3 min-w-0">
        <span className="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-white shrink-0" style={{background:'var(--c1)'}}>{c.number}</span>
        <div className="min-w-0">
          <div className="font-bold text-slate-800 truncate">{c.designation || 'New circuit'}</div>
          <div className="text-xs text-slate-500 truncate">{sub || 'Tap to fill in'}</div>
        </div>
      </div>
      <span className="text-slate-400">{open ? '▾' : '▸'}</span>
    </button>
    {open && (<div className="px-4 pb-4 space-y-3 border-t border-slate-100 pt-3">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <Field label="Circuit no" value={c.number} onChange={v=>upC({number:v})} inputMode="numeric"/>
        <Dropdown label="Designation" value={c.designation} onChange={v=>upC({designation:v})} options={SUG.designation} required/>
        <Dropdown label="Cable type" value={c.cableType} onChange={v=>upC({cableType:v})} options={SUG.cableType}/>
        <Dropdown label="Size (mm²)" value={c.cableSize} onChange={v=>upC({cableSize:v})} options={SUG.cableSize}/>
        <Field label="No. of points" value={c.points} onChange={v=>upC({points:v})} inputMode="numeric"/>
        <Dropdown label="Device" value={c.device} onChange={v=>upC({device:v})} options={SUG.device}/>
        <Dropdown label="Type / curve" value={c.deviceType} onChange={v=>upC({deviceType:v})} options={SUG.deviceType}/>
        <Dropdown label="Rating (A)" value={c.amps} onChange={v=>upC({amps:v})} options={SUG.amps}/>
      </div>
      <Field label="Circuit notes" value={c.notes} onChange={v=>upC({notes:v})} area/>
      <div className="flex flex-wrap gap-2">
        <button className="btn btn-o !min-h-[40px] !py-1.5 text-sm" onClick={dupC}>Duplicate</button>
        <button className="btn btn-g !min-h-[40px] !py-1.5 text-sm" disabled={i===0} onClick={()=>moveC(-1)}>↑</button>
        <button className="btn btn-g !min-h-[40px] !py-1.5 text-sm" disabled={i===total-1} onClick={()=>moveC(1)}>↓</button>
        <button className="btn btn-d !min-h-[40px] !py-1.5 text-sm ml-auto" onClick={delC}>Delete</button>
      </div>
    </div>)}
  </div>);
}

/* The verdict sits at the top of each card, not the bottom: it is the thing
   being recorded, and the readings are the evidence for it. */
function Verdict({value, onChange}){
  return (<div className="flex gap-1.5">
    {['Pass','Fail'].map(o => (
      <button key={o} onClick={()=>onChange(value === o ? '' : o)}
        className={'tabbtn ' + (value === o ? (o === 'Pass' ? '!bg-emerald-600 !text-white on' : '!bg-red-600 !text-white on') : 'off')}>{o}</button>
    ))}
  </div>);
}

function PreTestCard({c, upPre}){
  const irs = [c.pre.irPNE, c.pre.irPN, c.pre.ir3ph];
  const badIR = irs.some(v => v && parseFloat(String(v).replace(/[^0-9.]/g,'')) < 1);
  return (<div className="card p-4 space-y-3" style={{ borderTop:'3px solid var(--pre)' }}>
    <div className="flex items-center justify-between gap-2">
      <div className="font-bold text-slate-800 min-w-0 truncate">{c.number}. {c.designation || 'Circuit'}</div>
      <Verdict value={c.pre.pass} onChange={v=>upPre({pass:v})}/>
    </div>
    <div>
      <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Continuity (ohms) — at least one</div>
      <div className="grid grid-cols-2 gap-2">
        <label className="text-xs text-slate-500">Rp + Re<GridInput value={c.pre.rpre} onChange={v=>upPre({rpre:v})}/></label>
        <label className="text-xs text-slate-500">Re<GridInput value={c.pre.re} onChange={v=>upPre({re:v})}/></label>
      </div>
    </div>
    <div>
      <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Ring end to end (ohms)</div>
      <div className="grid grid-cols-3 gap-2">
        {[['ll','L–L'],['nn','N–N'],['ee','E–E']].map(([k,l]) => (
          <label key={k} className="text-xs text-slate-500">{l}<GridInput value={c.pre[k]} onChange={v=>upPre({[k]:v})}/></label>
        ))}
      </div>
    </div>
    <div>
      <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Insulation resistance (Mohms) — at least one</div>
      <div className="grid grid-cols-3 gap-2">
        {[['irPNE','Ph&N – E'],['irPN','Ph – N'],['ir3ph','Ph – Ph']].map(([k,l]) => (
          <label key={k} className="text-xs text-slate-500">{l}<GridInput value={c.pre[k]} onChange={v=>upPre({[k]:v})} cls={irClass(c.pre[k])}/></label>
        ))}
      </div>
      {badIR && <div className="text-xs text-red-600 font-semibold mt-1.5">Insulation reading below the 1 Mohm minimum — do not energise this circuit.</div>}
    </div>
    <div className="grid grid-cols-2 gap-2">
      <Check label="Erroneous test carried out" value={c.pre.erroneous} onChange={v=>upPre({erroneous:v})}/>
      <Check label="Polarity correct" value={c.pre.polarity} onChange={v=>upPre({polarity:v})}/>
    </div>
    <Field label="Comments" value={c.pre.comments} onChange={v=>upPre({comments:v})} area/>
  </div>);
}

function PostTestCard({c, upPost}){
  const suggested = MAXZS[(c.deviceType || '') + (c.amps || '')];
  const limit = c.post.maxZs || (suggested ? String(suggested) : '');
  const overZs = c.post.zs && limit && parseFloat(String(c.post.zs).replace(/[^0-9.]/g,'')) > parseFloat(limit);
  return (<div className="card p-4 space-y-3" style={{ borderTop:'3px solid var(--post)' }}>
    <div className="flex items-center justify-between gap-2">
      <div className="font-bold text-slate-800 min-w-0 truncate">{c.number}. {c.designation || 'Circuit'}</div>
      <Verdict value={c.post.pass} onChange={v=>upPost({pass:v})}/>
    </div>
    <div>
      <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Earth fault loop impedance (ohms)</div>
      <div className="grid grid-cols-3 gap-2">
        <label className="text-xs text-slate-500">Max Zs<GridInput value={c.post.maxZs} onChange={v=>upPost({maxZs:v})} ph={suggested ? String(suggested) : ''}/></label>
        <label className="text-xs text-slate-500">Measured Zs<GridInput value={c.post.zs} onChange={v=>upPost({zs:v})} cls={zsClass(c.post.zs, limit)}/></label>
        <label className="text-xs text-slate-500">PFC (kA)<GridInput value={c.post.pfc} onChange={v=>upPost({pfc:v})}/></label>
      </div>
      {suggested && !c.post.maxZs && (
        <button className="text-xs font-bold mt-1.5" style={{color:'var(--c3)'}} onClick={()=>upPost({maxZs:String(suggested)})}>
          Use the tabulated max Zs for {c.deviceType}{c.amps}: {suggested} ohms
        </button>
      )}
      {overZs && <div className="text-xs text-red-600 font-semibold mt-1.5">Measured Zs is above the maximum for this device.</div>}
    </div>
    <div>
      <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">RCD operating time (ms)</div>
      <div className="grid grid-cols-3 gap-2">
        <label className="text-xs text-slate-500">½ × I∆n<GridInput value={c.post.rcdHalf} onChange={v=>upPost({rcdHalf:v})}/></label>
        <label className="text-xs text-slate-500">1 × I∆n<GridInput value={c.post.rcd1} onChange={v=>upPost({rcd1:v})} cls={rcdClass(c.post.rcd1, 300)}/></label>
        <label className="text-xs text-slate-500">5 × I∆n<GridInput value={c.post.rcd5} onChange={v=>upPost({rcd5:v})} cls={rcdClass(c.post.rcd5, 40)}/></label>
      </div>
    </div>
    <div className="grid grid-cols-3 gap-1">
      <Check label="Test button" value={c.post.testBtn} onChange={v=>upPost({testBtn:v})}/>
      <Check label="Polarity" value={c.post.polarity} onChange={v=>upPost({polarity:v})}/>
      <Check label="Functional" value={c.post.functional} onChange={v=>upPost({functional:v})}/>
    </div>
    <Field label="Comments" value={c.post.comments} onChange={v=>upPost({comments:v})} area/>
  </div>);
}

/* ================= JOB EDITOR ================= */
function JobEditor({job, setJob, settings, customers, saveCustomers, toast, back}){
  /* Per record, so opening a different job does not drop you into the middle of
     a tab that means nothing for it. */
  const [tab, setTab] = useState(() => {
    const saved = store.get('lastTab_' + job.id, '');
    return (KINDS[kindOf(job)].tabs.indexOf(saved) > -1) ? saved : 'Site';
  });
  useEffect(()=>{ store.set('lastTab_' + job.id, tab); }, [tab, job.id]);
  const kind = kindOf(job);
  const K = KINDS[kind];
  const TABS = K.tabs;
  const isTest = kind === 'test';
  const p = job.pir || {};
  const tst = job.test || {};
  const circuits = tst.circuits || [];
  const up = (patch) => setJob(Object.assign({}, job, patch, { updatedAt: nowISO() }));
  /* Returns the submitted record as well as saving it, so the PDF and the email
     are built from the signed version rather than from whatever React state
     happened to be current a millisecond ago. */
  const submit = () => {
    const done = Object.assign({}, job, {
      submitted: nowISO(),
      sig: Object.assign({}, job.sig, { name: job.inspector, date: job.date }),
      updatedAt: nowISO()
    });
    setJob(done);
    return done;
  };
  const [sending, setSending] = useState('');

  /* One path out of the app: submitting always posts the report to the office.
     Downloading a copy is the only choice, because "did you remember to email
     it" is not a question anyone should have to answer at the end of a job. */
  const doSubmit = async (download) => {
    setSending(download ? 'download' : 'plain');
    const done = submit();
    if(download) buildRecordPdf(done, settings);
    await emailToOffice(done, settings, toast);
    setSending('');
    if(!download) back();
  };

  /* The inspector and the person signing the declaration are the same person.
     Kept as one value so it can never be recorded two different ways. */
  const setInspector = (v) => up({ inspector: v, sig: Object.assign({}, job.sig, { name: v }) });

  /* Moving tab always returns to the top, otherwise the next tab opens
     halfway down and looks broken on a phone. */
  const goTab = (t) => {
    setTab(t);
    requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
  };
  const tabIndex = TABS.indexOf(tab);

  /* Everything standing between this record and a submission, in plain words.
     A periodic report that goes in half answered is worse than no report. */
  const blockers = (() => {
    const out = [];
    const q = audit(job);
    if(isTest){
      if(!job.customerName || !job.customerName.trim()) out.push('The site needs a name (Site tab).');
      if(!job.address || !job.address.trim()) out.push('The site needs an address (Site tab).');
      if(!p.category) out.push('Installation category is not set (Site tab).');
      if(!tst.installType) out.push('Type of work is not set (Site tab).');
      if(!p.earthing) out.push('System earthing is not recorded (Supply tab).');
      if(!p.phase) out.push('Installation voltage is not recorded (Supply tab).');
      if(!circuits.length) out.push('No circuits have been added (Circuits tab).');
      /* The full list of gaps can run to dozens of lines on a big board, which
         nobody reads. Show the first few and count the rest. */
      const gaps = q.gaps || [];
      gaps.slice(0, 6).forEach(g => out.push(g));
      if(gaps.length > 6) out.push('…and ' + (gaps.length - 6) + ' more circuit' + (gaps.length - 6 === 1 ? '' : 's') + ' with readings outstanding.');
      if(!p.certifierNo || !p.certifierNo.trim()) out.push('Certifier number is missing (Sign off tab).');
      if(!(job.sig||{}).name || !(job.sig||{}).name.trim()) out.push('The record is not attributed to anyone.');
      if(!(job.sig||{}).sig) out.push('The declaration is not signed.');
      return out;
    }
    if(!job.customerName || !job.customerName.trim()) out.push('The site needs a name (Site tab).');
    if(!job.address || !job.address.trim()) out.push('The site needs an address (Site tab).');
    if(!p.category) out.push('Installation category is not set (Site tab).');
    if(!p.reason) out.push('Reason for inspection is not set (Site tab).');
    if(!p.entireInstall) out.push('Extent of the installation is not stated (Site tab).');
    if(!p.earthing) out.push('System earthing is not recorded (Supply tab).');
    if(!p.phase) out.push('Installation voltage is not recorded (Supply tab).');
    if(q.unanswered.length) out.push(q.unanswered.length + ' check' + (q.unanswered.length===1?'':'s') + ' unanswered: ' + q.unanswered.join(', ') + ' (Checks tab).');
    /* Every No has its own observation now, so the check is per question rather
       than "is there at least one observation somewhere". */
    const blank = (p.obs || []).filter(o => o.qn && !(o.comment || '').trim()).map(o => o.qn);
    if(blank.length) out.push('Check' + (blank.length === 1 ? '' : 's') + ' ' + blank.join(', ') +
      ' answered "No" but not written up yet — say what you found (Checks or Findings tab).');
    if(!p.workmanship) out.push('Quality of workmanship is not rated (Findings tab).');
    if(!p.condition) out.push('Overall condition is not recorded.');
    if(!p.intervalValue) out.push('Re-inspection interval is not set.');
    if(!p.certifierNo || !p.certifierNo.trim()) out.push('Certifier number is missing (Sign off tab).');
    if(!(job.sig||{}).name || !(job.sig||{}).name.trim()) out.push('The report is not attributed to anyone.');
    if(!(job.sig||{}).sig) out.push('The declaration is not signed.');
    return out;
  })();
  const setP = (patch) => up({ pir: Object.assign({}, p, patch) });
  const setT = (patch) => up({ test: Object.assign({}, tst, patch) });
  const upCircuits = (list) => setT({ circuits: list });
  const upC = (id, patch) => upCircuits(circuits.map(c => c.id === id ? Object.assign({}, c, patch) : c));
  const upPre = (id, patch) => upCircuits(circuits.map(c => c.id === id ? Object.assign({}, c, { pre: Object.assign({}, c.pre, patch) }) : c));
  const upPost = (id, patch) => upCircuits(circuits.map(c => c.id === id ? Object.assign({}, c, { post: Object.assign({}, c.post, patch) }) : c));
  /* A new circuit inherits the cable and device of the one before it. On a
     board of sockets that is right eight times out of ten, and wrong is one
     dropdown away. */
  const addCircuit = () => {
    const last = circuits[circuits.length - 1];
    const fresh = blankCircuit(last ? (parseInt(last.number, 10) || circuits.length) + 1 : 1);
    if(last){ fresh.cableType = last.cableType; fresh.cableSize = last.cableSize; fresh.device = last.device; fresh.deviceType = last.deviceType; fresh.amps = last.amps; }
    upCircuits([...circuits, fresh]);
  };
  const dupCircuit = (c) => {
    const copy = Object.assign({}, JSON.parse(JSON.stringify(c)), { id: uid(), pre: blankPre(), post: blankPost() });
    copy.number = String((parseInt(c.number, 10) || circuits.length) + 1);
    const i = circuits.findIndex(x => x.id === c.id);
    const next = circuits.slice(); next.splice(i + 1, 0, copy);
    upCircuits(next); toast('Circuit duplicated');
  };
  const delCircuit = (c) => {
    if(!confirm('Delete circuit ' + c.number + (c.designation ? ' – ' + c.designation : '') + ' and its readings?')) return;
    upCircuits(circuits.filter(x => x.id !== c.id));
  };
  const moveCircuit = (c, dir) => {
    const i = circuits.findIndex(x => x.id === c.id), j = i + dir;
    if(j < 0 || j >= circuits.length) return;
    const next = circuits.slice(); next[i] = next[j]; next[j] = c;
    upCircuits(next);
  };
  const upInst = (id, patch) => setT({ instruments: (tst.instruments || []).map(x => x.id === id ? Object.assign({}, x, patch) : x) });
  const setBond = (patch) => setT({ bonding: Object.assign({}, tst.bonding || {}, patch) });
  const setNote = (patch) => setT({ notes: Object.assign({}, tst.notes || {}, patch) });
  /* A "No" always has to end up as an observation — it is a submit blocker — so
     the app writes the stub the moment the answer is given, instead of making
     someone remember to go and do it on another tab later. */
  const setQ = (n, v) => {
    const prev = (p.q || {})['q'+n] || '';
    const q = Object.assign({}, p.q || {}, { ['q'+n]: v });
    let obs = p.obs || [];
    if(v === 'No' && !obs.some(o => o.qn === n)){
      /* A mis-tap on Yes should not cost somebody their write-up, and answering
         No again should not leave two observations for one question. An
         observation that was detached from this question is re-attached; only
         if there is none does a fresh one get made. */
      const orphan = obs.find(o => !o.qn && o.wasQn === n);
      /* Blank on purpose. Pre-filling the question text just gets signed off as
         it stands, and "Are all outlets undamaged?" is not a description of what
         is actually wrong. The question is kept as `qn` and printed on the
         report, so nothing is lost by leaving the box empty. */
      obs = orphan
        ? obs.map(o => o.id === orphan.id ? Object.assign({}, o, { qn: n, wasQn: null }) : o)
        : [...obs, { id: uid(), qn: n, ref: String(obs.length + 1), comment: '', code: '2' }];
    }
    if(prev === 'No' && v !== 'No'){
      const linked = obs.find(o => o.qn === n);
      if(linked){
        /* Changing the answer back clears the stub, but only while it is still a
           stub. Anything typed or photographed is kept and simply unlinked from
           the question — deleting somebody's work because they fixed a mis-tap
           would be unforgivable. */
        const untouched = !(linked.comment || '').trim() && !(job.photos||[]).some(ph => ph.obsId === linked.id);
        obs = untouched ? obs.filter(o => o.id !== linked.id)
                        : obs.map(o => o.id === linked.id ? Object.assign({}, o, { qn: null, wasQn: n }) : o);
      }
    }
    setP(Object.assign({ q, obs }, v === 'No' ? { noRemedial: 'The following observations are made' } : {}));
  };
  const a = audit(job);

  const addObs = () => setP({ obs: [...(p.obs||[]), { id: uid(), ref: String((p.obs||[]).length + 1), comment:'', code:'3' }] });
  const upObs = (id, patch) => setP({ obs: (p.obs||[]).map(o => o.id === id ? Object.assign({}, o, patch) : o) });
  const delObs = (id) => setP({ obs: (p.obs||[]).filter(o => o.id !== id) });
  const addRcd = () => setP({ rcds: [...(p.rcds||[]), { id: uid(), desc:'', trip:'30', time:'' }] });
  const upRcd = (id, patch) => setP({ rcds: (p.rcds||[]).map(r => r.id === id ? Object.assign({}, r, patch) : r) });
  const delRcd = (id) => setP({ rcds: (p.rcds||[]).filter(r => r.id !== id) });

  /* obsId ties a photo to the observation it is evidence for. The old free-text
     "obs ref" box meant matching photos to findings by memory back at the van,
     which is exactly the sort of thing that goes wrong. */
  const addPhotos = async (files, obsId) => {
    const list = Array.from(files || []).slice(0, 8);
    const out = [];
    for(const f of list){
      try{ out.push({ id: uid(), data: await compressImage(f), caption:'', obsId: obsId || '', ts: nowISO() }); }catch(e){}
    }
    if(out.length){ up({ photos: [...(job.photos||[]), ...out] }); toast(out.length + ' photo' + (out.length===1?'':'s') + ' added'); }
  };
  const delPhoto = (id) => up({ photos: (job.photos||[]).filter(x => x.id !== id) });
  const capPhoto = (id, caption) => up({ photos: (job.photos||[]).map(x => x.id === id ? Object.assign({}, x, { caption }) : x) });
  const photosFor = (obsId) => (job.photos||[]).filter(ph => (ph.obsId || '') === (obsId || ''));

  return (<div className="pb-28">
    {/* Sticky under the header so the tabs — and the count of checks still
        outstanding — stay reachable however far down a long tab you are. */}
    <div className="scrollx -mx-4 px-4 mb-4 sticky z-30 py-2" style={{ top:'var(--hdr)', background:'#f1f5f9' }}>
      <div className="flex gap-2 w-max">
        {TABS.map(name => {
          /* The badge counts what is outstanding on that tab: unanswered checks
             on a periodic, untested circuits on a test record. */
          const outstanding =
            (!isTest && name === 'Checks') ? a.unanswered.length
            : (isTest && name === 'Pre-test') ? circuits.filter(c => !preDone(c)).length
            : (isTest && name === 'Post-test') ? circuits.filter(c => !postDone(c)).length
            : 0;
          return <button key={name} className={'tabbtn ' + (tab===name ? 'on' : 'off')} onClick={()=>goTab(name)}>
            {name}{outstanding > 0 && (
              /* Bright blue on a navy tab was the wrong way round — a count
                 nobody can read is not a count. Solid pill, inverted per state. */
              <span className="ml-1.5 inline-flex items-center justify-center text-[10px] font-black rounded-full px-1.5 align-middle"
                style={{ minWidth:18, height:18,
                         background: tab===name ? '#ffffff' : '#b45309',
                         color: tab===name ? 'var(--c1)' : '#ffffff' }}>{outstanding}</span>
            )}
          </button>;
        })}
      </div>
    </div>

    <div className="space-y-4">
      {tab === 'Site' && (<>
        <div className="rounded-xl border p-3 text-xs" style={{ borderColor:'#fcd9b6', background:'#fff8f1', color:'#7c4a17' }}>
          <b>Not an official Safe Electric certificate.</b> This records the same information for your own use.
          The official {isTest ? 'Completion Certificate' : 'Periodic Inspection Report'} must still be completed and submitted.
        </div>
        <Section title="Record details" chip={<span className="chip" style={{ background:'var(--c1-soft)', color:'var(--c1)' }}>{K.label}</span>}>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label={isTest ? 'Record No.' : 'PR No.'} value={job.prNo} onChange={v=>up({prNo:v})} placeholder={K.prefix + '-00001'}/>
            <Field label={isTest ? 'Date of test' : 'Date of inspection'} type="date" value={job.date} onChange={v=>up({date:v})} required/>
            <Field label={isTest ? 'Tested by' : 'Inspector'} value={job.inspector} onChange={setInspector} required
              hint="Also signs the declaration on the Sign off tab."/>
            {isTest
              ? <Field label="Cert No." value={tst.certNo} onChange={v=>setT({certNo:v})}/>
              : <Field label="Installation approx age" value={p.approxAge} onChange={v=>setP({approxAge:v})} placeholder="e.g. 20 years"/>}
          </div>
        </Section>
        <Section title="Site / customer" right={
          customers.length > 0 ? <select className="text-xs font-semibold bg-transparent" style={{color:'var(--c2)'}} value=""
            onChange={e=>{ const c = customers.find(x=>x.id===e.target.value);
              if(c) up({ customerId:c.id, customerName:c.name, address:c.address, phone:c.phone, email:c.email, lat:c.lat||'', lng:c.lng||'' }); }}>
            <option value="">Use saved site…</option>
            {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select> : null
        }>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Site / customer name" value={job.customerName} onChange={v=>up({customerName:v})} required/>
            <Field label="Occupant / trading as" value={p.occupant} onChange={v=>setP({occupant:v})}/>
            <div className="sm:col-span-2"><Field label="Address" value={job.address} onChange={v=>up({address:v})} required/></div>
            <Field label="Phone" value={job.phone} onChange={v=>up({phone:v})} inputMode="tel"/>
            <Field label="Email" value={job.email} onChange={v=>up({email:v})} type="email"/>
            <Dropdown label="Occupant in attendance?" value={p.occupantAttended} onChange={v=>setP({occupantAttended:v})} options={['Yes','No']}/>
          </div>
          <div className="mt-3 rounded-xl border border-slate-200 p-3">
            <div className="flex items-center justify-between gap-2 mb-2">
              <span className="text-[13px] font-semibold text-slate-600">Location</span>
              <button className="text-xs font-bold" style={{color:'var(--c2)'}} onClick={()=>{
                if(!navigator.geolocation) return toast('This device has no location service');
                toast('Getting location…');
                navigator.geolocation.getCurrentPosition(
                  pos => { up({ lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6) }); toast('Location captured'); },
                  err => toast(err.code === 1 ? 'Location permission refused' : 'Could not get a location'),
                  { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
                );
              }}>Use my location</button>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Field label="Latitude" value={job.lat} onChange={v=>up({lat:v})} inputMode="decimal" placeholder="51.8985"/>
              <Field label="Longitude" value={job.lng} onChange={v=>up({lng:v})} inputMode="decimal" placeholder="-8.4756"/>
            </div>
            <p className="text-xs text-slate-400 mt-2">
              Tap the button while standing at the board. Coordinates put the site on the client dashboard map and help the next
              person find it — handy when the address is "the yard behind the garage".
            </p>
          </div>
          {job.customerName && !job.customerId && (
            <button className="btn btn-o w-full mt-3 !min-h-[40px] text-sm" onClick={()=>{
              const c = { id: uid(), name: job.customerName, address: job.address, phone: job.phone, email: job.email,
                          lat: job.lat, lng: job.lng, updatedAt: nowISO() };
              saveCustomers(prev => [c, ...prev]); up({ customerId: c.id }); toast('Site saved for next time');
            }}>Save this site for next time</button>
          )}
        </Section>
        {!isTest && (<Section title="Category and reason">
          <div className="grid sm:grid-cols-2 gap-3">
            <Dropdown label="Installation category" value={p.category} onChange={v=>setP({category:v})} options={['Domestic','Commercial','Industrial']} required/>
            <Dropdown label="Reason for inspection" value={p.reason} onChange={v=>setP({reason:v})} options={['Insurance Inspection','Safety Audit']} required/>
          </div>
          <div className="mt-3"><Field label="If other, specify" value={p.reasonOther} onChange={v=>setP({reasonOther:v})}/></div>
        </Section>)}
        {!isTest && (<Section title="Extent of installation covered">
          <Dropdown label="Entire installation?" value={p.entireInstall} onChange={v=>setP({entireInstall:v})} options={['Yes','No']} required/>
          {p.entireInstall === 'No' && <div className="mt-3"><Field label="What this report refers to" value={p.partialDetail} onChange={v=>setP({partialDetail:v})} area required/></div>}
          <p className="text-xs text-slate-400 mt-2">Cables concealed within trunking, conduit or the fabric of the building have not been inspected unless stated otherwise.</p>
        </Section>)}

        {/* Category is stored in the same place for both kinds, so a client
            dashboard counts one estate rather than two. */}
        {isTest && (<Section title="Installation">
          <div className="grid sm:grid-cols-2 gap-3">
            <Dropdown label="Installation category" value={p.category} onChange={v=>setP({category:v})} options={['Domestic','Commercial','Industrial']} required/>
            <Dropdown label="Type of work" value={tst.installType} onChange={v=>setT({installType:v})} options={SUG.installType} required/>
            <Field label="Distribution board ref" value={tst.dbRef} onChange={v=>setT({dbRef:v})} placeholder="DB1"/>
            <Field label="MPRN" value={tst.mprn} onChange={v=>setT({mprn:v})} inputMode="numeric"/>
            <Field label="Seal No." value={tst.sealNo} onChange={v=>setT({sealNo:v})}/>
            <Field label="Max demand (A)" value={tst.maxDemand} onChange={v=>setT({maxDemand:v})} inputMode="decimal"/>
          </div>
          <div className="mt-3"><Field label="Supply characteristic" value={tst.supplyChar} onChange={v=>setT({supplyChar:v})} placeholder="e.g. 230 V 50 Hz single phase, 63 A"/></div>
        </Section>)}
      </>)}

      {tab === 'Supply' && (<>
        <Section title="Supply characteristics">
          <div className="grid sm:grid-cols-3 gap-3">
            <Dropdown label="System earthing" value={p.earthing} onChange={v=>setP({earthing:v})} options={['TNCS','TT','TNS','IT']} required/>
            <Dropdown label="Installation voltage" value={p.phase} onChange={v=>setP({phase:v})} options={['Single Phase','Three Phase']} required/>
            <Field label="Max prospective S/C current (A)" value={p.pscc} onChange={v=>setP({pscc:v})} inputMode="decimal"/>
            <Field label="L1 (V)" value={p.v1} onChange={v=>setP({v1:v})} inputMode="decimal"/>
            {p.phase === 'Three Phase' && <Field label="L2 (V)" value={p.v2} onChange={v=>setP({v2:v})} inputMode="decimal"/>}
            {p.phase === 'Three Phase' && <Field label="L3 (V)" value={p.v3} onChange={v=>setP({v3:v})} inputMode="decimal"/>}
            {p.phase === 'Three Phase' && <Field label="L1-L2 (V)" value={p.v12} onChange={v=>setP({v12:v})} inputMode="decimal"/>}
            {p.phase === 'Three Phase' && <Field label="L2-L3 (V)" value={p.v23} onChange={v=>setP({v23:v})} inputMode="decimal"/>}
            {p.phase === 'Three Phase' && <Field label="L3-L1 (V)" value={p.v31} onChange={v=>setP({v31:v})} inputMode="decimal"/>}
            <Dropdown label="Main isolation device" value={p.mainIsolation} onChange={v=>setP({mainIsolation:v})} options={['None','Switch Fuse','MCB','MCCB']}/>
            <Field label="Nominal rating (A)" value={p.nominalRating} onChange={v=>setP({nominalRating:v})} inputMode="decimal"/>
          </div>
          <p className="text-xs text-slate-500 mt-3 mb-2">If a main RCD is used as the main isolating device:</p>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Rated current In (A)" value={p.mainRcdIn} onChange={v=>setP({mainRcdIn:v})} inputMode="decimal"/>
            <Field label="Tripping current IΔn (mA)" value={p.mainRcdIdn} onChange={v=>setP({mainRcdIdn:v})} inputMode="decimal"/>
          </div>
        </Section>
        {isTest && (<Section title="Earthing and bonding">
          <div className="grid sm:grid-cols-2 gap-3">
            {[['gas','Main bonding — gas'],['water','Main bonding — water'],['supp','Supplementary bonding'],['electrode','Electrode earthing conductor'],['other','Other bonding']].map(([k,l]) => (
              <Dropdown key={k} label={l} value={(tst.bonding||{})[k]} onChange={v=>setBond({[k]:v})} options={['Yes','No','N/A']}/>
            ))}
            <Field label="If other, what" value={(tst.bonding||{}).otherDetails} onChange={v=>setBond({otherDetails:v})}/>
          </div>
          <div className="grid sm:grid-cols-2 gap-3 mt-3">
            <Field label="Max Rp + Re (ohms)" value={tst.maxRpRe} onChange={v=>setT({maxRpRe:v})} inputMode="decimal"/>
            <Field label="Max resistance of protective conductor Re (ohms)" value={tst.maxRe} onChange={v=>setT({maxRe:v})} inputMode="decimal"/>
          </div>
        </Section>)}

        {isTest && (<Section title="Test instruments">
          <p className="text-xs text-slate-400 mb-3">A reading is only worth what the instrument behind it is worth. Calibration dates go on the record.</p>
          <div className="space-y-3">
            {(tst.instruments||[]).map(ins => (
              <div key={ins.id} className="rounded-xl border border-slate-200 p-3">
                <div className="text-[13px] font-bold text-slate-700 mb-2">{ins.use}</div>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="Make" value={ins.make} onChange={v=>upInst(ins.id,{make:v})}/>
                  <Field label="Model" value={ins.model} onChange={v=>upInst(ins.id,{model:v})}/>
                  <Field label="Serial no." value={ins.serial} onChange={v=>upInst(ins.id,{serial:v})}/>
                  <Field label="Calibration expiry" type="date" value={ins.calExpiry} onChange={v=>upInst(ins.id,{calExpiry:v})}
                    className={ins.calExpiry && ins.calExpiry < job.date ? 'bad' : ''}/>
                </div>
                {ins.calExpiry && ins.calExpiry < job.date &&
                  <p className="text-xs text-red-600 font-semibold mt-1.5">Calibration expired before the date of this test.</p>}
              </div>
            ))}
          </div>
        </Section>)}

        {!isTest && (<Section title="Summary test data">
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Min insulation resistance (MΩ)" value={p.minIR} onChange={v=>setP({minIR:v})} inputMode="decimal"
              className={parseFloat(p.minIR) > 0 && parseFloat(p.minIR) < 1 ? 'bad' : ''}/>
            <Field label="Max resistance of protective conductor (Ω)" value={p.maxRp} onChange={v=>setP({maxRp:v})} inputMode="decimal"/>
            <Field label="Max fault loop impedance (Ω)" value={p.maxZs} onChange={v=>setP({maxZs:v})} inputMode="decimal"/>
            <div className="grid grid-cols-2 gap-2">
              <Field label="Device type" value={p.zsDeviceType} onChange={v=>setP({zsDeviceType:v})} placeholder="B / C"/>
              <Field label="Device size" value={p.zsDeviceSize} onChange={v=>setP({zsDeviceSize:v})} placeholder="32A"/>
            </div>
          </div>
          {parseFloat(p.minIR) > 0 && parseFloat(p.minIR) < 1 &&
            <p className="text-xs text-red-600 font-semibold mt-2">Insulation resistance is below the 1 MΩ minimum. Raise this as an observation.</p>}
        </Section>)}
        {!isTest && (<Section title="Test instrument serial numbers">
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Continuity tester" value={p.instContinuity} onChange={v=>setP({instContinuity:v})}/>
            <Field label="Insulation resistance tester" value={p.instIR} onChange={v=>setP({instIR:v})}/>
            <Field label="Loop impedance tester" value={p.instLoop} onChange={v=>setP({instLoop:v})}/>
            <Field label="RCD tester" value={p.instRcd} onChange={v=>setP({instRcd:v})}/>
          </div>
        </Section>)}
      </>)}

      {/* ---------- test record: the board ---------- */}
      {tab === 'Circuits' && (<>
        <div className="card p-4">
          <div className="flex items-center justify-between gap-2">
            <div>
              <div className="text-sm font-bold text-slate-700">{circuits.length} circuit{circuits.length === 1 ? '' : 's'} on this board</div>
              <div className="text-xs text-slate-400">Fill the schedule in first. The two testing tabs then follow it in order.</div>
            </div>
            <button className="btn btn-a !min-h-[42px] !py-1.5 text-sm shrink-0" onClick={addCircuit}>+ Circuit</button>
          </div>
        </div>
        {circuits.length === 0 && <div className="card p-8 text-center text-slate-400 text-sm">No circuits yet. Add the first one to start the schedule.</div>}
        {circuits.map((c, i) => (
          <CircuitCard key={c.id} c={c} i={i} total={circuits.length}
            upC={patch=>upC(c.id, patch)} dupC={()=>dupCircuit(c)} delC={()=>delCircuit(c)} moveC={dir=>moveCircuit(c, dir)}/>
        ))}
        {circuits.length > 0 && <button className="btn btn-o w-full" onClick={addCircuit}>+ Add another circuit</button>}
      </>)}

      {tab === 'Pre-test' && (<>
        <div className="card p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm font-bold text-slate-700">{circuits.filter(preDone).length} of {circuits.length} circuits signed off</span>
            <span className="chip" style={{ background:'rgba(0,135,200,.12)', color:'var(--c1)' }}>Dead testing</span>
          </div>
          <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
            <div className="h-full rounded-full transition-all" style={{ width: (circuits.length ? circuits.filter(preDone).length/circuits.length*100 : 0) + '%', background:'var(--pre)' }}/>
          </div>
          <p className="text-xs text-slate-400 mt-3">Continuity, ring end to end and insulation resistance, taken with the installation dead. Readings outside the limits go red as you type them.</p>
        </div>
        {circuits.length === 0 && <div className="card p-8 text-center text-slate-400 text-sm">Add circuits on the Circuits tab first.</div>}
        {circuits.map(c => <PreTestCard key={c.id} c={c} upPre={patch=>upPre(c.id, patch)}/>)}
        {circuits.length > 0 && <ShareBox job={job} up={up} toast={toast}/>}
        {circuits.length > 0 && (
          <Section title="Pre-connection declaration" chip={(tst.sigPre||{}).sig ? <span className="chip chip-ok">Signed</span> : <span className="chip chip-open">Open</span>}>
            <p className="text-xs text-slate-500 mb-3 leading-relaxed">
              I confirm that the dead tests recorded above were carried out by me, and that on the basis of those results the installation
              described is safe to energise.
            </p>
            <div className="mb-3"><Field label="Signed by" value={(tst.sigPre||{}).name || job.inspector} onChange={v=>setT({ sigPre: Object.assign({}, tst.sigPre, { name:v }) })}/></div>
            <SignaturePad value={(tst.sigPre||{}).sig}
              onChange={v=>setT({ sigPre: Object.assign({}, tst.sigPre, { sig:v, name:(tst.sigPre||{}).name || job.inspector, date: job.date }) })}/>
            <p className="text-xs text-slate-400 mt-2">Optional. Sign it where the pre-connection results are handed over before energising.</p>
          </Section>
        )}
      </>)}

      {tab === 'Post-test' && (<>
        <div className="card p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm font-bold text-slate-700">{circuits.filter(postDone).length} of {circuits.length} circuits signed off</span>
            <span className="chip" style={{ background:'var(--c1-soft)', color:'var(--c1)' }}>Live testing</span>
          </div>
          <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
            <div className="h-full rounded-full transition-all" style={{ width: (circuits.length ? circuits.filter(postDone).length/circuits.length*100 : 0) + '%', background:'var(--post)' }}/>
          </div>
          <p className="text-xs text-slate-400 mt-3">Loop impedance, prospective fault current, RCD times and the functional checks, taken with the installation energised.</p>
        </div>
        {circuits.length === 0 && <div className="card p-8 text-center text-slate-400 text-sm">Add circuits on the Circuits tab first.</div>}
        {circuits.map(c => <PostTestCard key={c.id} c={c} upPost={patch=>upPost(c.id, patch)}/>)}
        {circuits.length > 0 && <ShareBox job={job} up={up} toast={toast}/>}
        {circuits.length > 0 && (
          <Section title="Notes">
            <div className="space-y-3">
              <Field label="General" value={(tst.notes||{}).general} onChange={v=>setNote({general:v})} area/>
              <Field label="Observations" value={(tst.notes||{}).observations} onChange={v=>setNote({observations:v})} area/>
              <Field label="Recommendations" value={(tst.notes||{}).recommendations} onChange={v=>setNote({recommendations:v})} area/>
              <Field label="Work remaining to complete" value={(tst.notes||{}).completion} onChange={v=>setNote({completion:v})} area/>
            </div>
          </Section>
        )}
        <Section title="Photos">
          <PhotoStrip photos={job.photos||[]} label="On this job"
            onAdd={files=>addPhotos(files, '')} onCaption={capPhoto} onDelete={delPhoto}/>
        </Section>
      </>)}

      {tab === 'Checks' && (<>
        <div className="card p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm font-bold text-slate-800">{a.answered} of {a.total} answered</span>
            {a.nos.length > 0 && <span className="chip chip-bad">{a.nos.length} answered No</span>}
          </div>
          <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
            <div className="h-full rounded-full transition-all" style={{ width: (a.answered/a.total*100) + '%', background:'var(--c2)' }}/>
          </div>
          {a.unanswered.length > 0 && (
            <p className="text-xs text-slate-400 mt-3">
              Still to answer: {a.unanswered.join(', ')}. Each one has to be answered on its own — there is no bulk "all Yes",
              because a signed report says you actually looked at every item.
            </p>
          )}
          {a.answered > 0 && (
            <button className="btn btn-g !min-h-[36px] !py-1.5 text-xs w-full mt-3"
              onClick={()=>{ if(confirm('Clear every answer on this inspection?')) setP({ q:{} }); }}>Clear all answers</button>
          )}
        </div>
        {PIR_Q.map(group => (
          <Section key={group.g} title={group.g}>
            {group.items.map(it => {
              const qn = it[0];
              const val = (p.q||{})['q'+qn] || '';
              const linked = (p.obs||[]).find(o => o.qn === qn);
              return (<div key={qn}>
                <TriState n={qn} label={it[1]} na={it[2]} value={val} onChange={v=>setQ(qn, v)}/>
                {/* Answered No: the write-up opens right here, camera and all.
                    Walking back to the board because the photo was forgotten is
                    the failure this is designed to prevent. */}
                {val === 'No' && linked && (
                  <div className="rounded-xl border-l-4 p-3 mb-2 fadein"
                    style={{ borderLeftColor:'#dc2626', background:'#fef7f7', borderTop:'1px solid #fde2e2', borderRight:'1px solid #fde2e2', borderBottom:'1px solid #fde2e2' }}>
                    <p className="text-xs font-bold text-red-700 mb-2.5">
                      Answered No — write it up now, while you are standing at it.
                    </p>
                    <ObsEditor obs={linked} index={(p.obs||[]).indexOf(linked)} photos={photosFor(linked.id)}
                      upObs={upObs} delObs={delObs} addPhotos={addPhotos} capPhoto={capPhoto} delPhoto={delPhoto}/>
                  </div>
                )}
              </div>);
            })}
            {group.g === 'Distribution board(s)' && (
              <div className="pt-3">
                <Dropdown label="17. Sub circuit isolation and overcurrent device type" value={p.q17type} onChange={v=>setP({q17type:v})} options={['Fuse','Mcb']}/>
              </div>
            )}
          </Section>
        ))}
        <Section title="20. RCDs" right={<button className="text-xs font-bold" style={{color:'var(--c2)'}} onClick={addRcd}>+ Add RCD</button>}>
          {(p.rcds||[]).length === 0 && <p className="text-sm text-slate-400">No RCDs added.</p>}
          {(p.rcds||[]).map(r => {
            const t = parseFloat(r.time);
            const bad = !isNaN(t) && t > 300;
            return (<div key={r.id} className="grid grid-cols-12 gap-2 mb-2 items-end">
              <div className="col-span-5"><Field label="Circuit description" value={r.desc} onChange={v=>upRcd(r.id,{desc:v})} placeholder="Sockets"/></div>
              <div className="col-span-3"><Field label="Trip current (mA)" value={r.trip} onChange={v=>upRcd(r.id,{trip:v})} inputMode="decimal"/></div>
              <div className="col-span-3"><Field label="Longest time (ms)" value={r.time} onChange={v=>upRcd(r.id,{time:v})} inputMode="decimal" className={bad ? 'bad' : ''}/></div>
              <div className="col-span-1"><button className="btn btn-g w-full !px-0" onClick={()=>delRcd(r.id)}>✕</button></div>
              {bad && <div className="col-span-12 text-xs text-red-600 font-semibold -mt-1">Trip time over 300 ms. Raise an observation.</div>}
            </div>);
          })}
        </Section>
      </>)}

      {tab === 'Findings' && (<>
        <Section title="Quality of workmanship">
          <Seg value={p.workmanship} onChange={v=>setP({workmanship:v})} options={['Very Good','Satisfactory','Poor']}/>
        </Section>
        <Section title="Observations" right={<button className="text-xs font-bold" style={{color:'var(--c2)'}} onClick={addObs}>+ Add observation</button>}>
          <Seg value={p.noRemedial} onChange={v=>setP({noRemedial:v})} options={['No remedial work is required','The following observations are made']}/>
          {a.nos.length > 0 && p.noRemedial === 'No remedial work is required' && (
            <p className="text-xs text-red-600 font-semibold mt-2">Questions {a.nos.join(', ')} were answered "No". These must be referred to in the observations.</p>
          )}
          {a.nos.length > 0 && (
            <p className="text-xs text-slate-500 mt-3">
              Questions {a.nos.join(', ')} were answered No, so an observation was opened for each. They can be finished here or
              back on the Checks tab — it is the same record either way.
            </p>
          )}
          <div className="mt-3 space-y-3">
            {(p.obs||[]).map((o, i) => (
              <div key={o.id} className="rounded-xl border border-slate-200 p-3">
                <div className="flex items-center gap-2 mb-2.5">
                  <span className="chip" style={{ background:'var(--c1-soft)', color:'var(--c1)' }}>Obs {o.ref || (i+1)}</span>
                  {o.qn && <span className="chip chip-n">From check {o.qn}</span>}
                  {photosFor(o.id).length > 0 && <span className="chip chip-n">{photosFor(o.id).length} photo{photosFor(o.id).length===1?'':'s'}</span>}
                </div>
                <ObsEditor obs={o} index={i} photos={photosFor(o.id)} showRef
                  upObs={upObs} delObs={delObs} addPhotos={addPhotos} capPhoto={capPhoto} delPhoto={delPhoto}/>
              </div>
            ))}
            {(p.obs||[]).length === 0 && <p className="text-sm text-slate-400">No observations raised.</p>}
          </div>
          <div className="mt-3 text-xs text-slate-500 leading-relaxed">
            (1) Requires urgent attention&nbsp; (2) Requires improvements&nbsp; (3) Requires some attention&nbsp; (4) Does not comply with current National Rules. Using (4) does not necessarily imply the installation is unsafe.
          </div>
          {a.urgent.length > 0 && (
            <div className="mt-3 rounded-lg bg-red-600 text-white text-sm font-bold p-3">
              {a.urgent.length} observation{a.urgent.length===1?'':'s'} marked "requires urgent attention". The person responsible for the installation must be notified without delay.
            </div>
          )}
        </Section>
        {/* Anything not tied to a finding — the board, the meter, the way in.
            Photos attached to an observation live with that observation. */}
        <Section title="General photos"
          chip={photosFor('').length ? <span className="chip chip-n">{photosFor('').length}</span> : null}>
          <p className="text-xs text-slate-400 mb-3">
            The board, the meter position, the way in — anything worth having that is not evidence for a particular finding.
          </p>
          <PhotoStrip photos={photosFor('')} label="On this site"
            onAdd={files=>addPhotos(files, '')} onCaption={capPhoto} onDelete={delPhoto}/>
        </Section>
      </>)}

      {tab === 'Sign off' && (<>
        {/* A test record's verdict is not a judgement call — it is the sum of
            the circuit verdicts, so the app states it rather than asking. */}
        {isTest && (<Section title="Result" chip={
          a.condition === 'Unsatisfactory' ? <span className="chip chip-bad">Fail</span>
          : a.condition === 'Satisfactory' ? <span className="chip chip-ok">Pass</span>
          : <span className="chip chip-open">Incomplete</span>}>
          <div className="grid grid-cols-3 gap-2 text-center">
            {[['Circuits', circuits.length, '#0f172a'],
              ['Tested', a.answered, 'var(--c3)'],
              ['Failed', a.urgent.length, a.urgent.length ? '#dc2626' : '#0f172a']].map(([l, v, col]) => (
              <div key={l} className="rounded-xl border border-slate-200 p-3">
                <div className="text-2xl font-black" style={{color:col}}>{v}</div>
                <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">{l}</div>
              </div>
            ))}
          </div>
          {a.urgent.length > 0 && (
            <div className="mt-3 rounded-lg bg-red-600 text-white text-sm font-bold p-3">
              {a.urgent.length} circuit{a.urgent.length === 1 ? '' : 's'} failed: {a.urgent.map(c => c.number).join(', ')}.
              The person responsible for the installation must be notified before it is put into service.
            </div>
          )}
          {(a.gaps || []).length === 0 && circuits.length > 0 && a.urgent.length === 0 && (
            <p className="text-sm text-slate-600 mt-3">Every circuit has a full set of readings and passed both halves of the test.</p>
          )}
        </Section>)}

        {!isTest && (<Section title="Overall condition and re-inspection">
          <Dropdown label="Overall condition of installation" value={p.condition} onChange={v=>setP({condition:v})} options={['Satisfactory','Unsatisfactory']} required/>
          {a.urgent.length > 0 && p.condition === 'Satisfactory' && (
            <p className="text-xs text-red-600 font-semibold mt-2">An observation requires urgent attention, so this cannot be recorded as Satisfactory. The report will show Unsatisfactory.</p>
          )}
          <div className="grid grid-cols-2 gap-3 mt-3">
            <Field label="Re-inspect after not more than" value={p.intervalValue} onChange={v=>setP({intervalValue:v})} inputMode="decimal" placeholder="5"/>
            <Dropdown label="Unit" value={p.intervalUnit} onChange={v=>setP({intervalUnit:v})} options={['months','years']}/>
          </div>
          {addInterval(job.date, p.intervalValue, p.intervalUnit) && (
            <p className="text-xs text-slate-500 mt-2">Next inspection due <b>{fmtDate(addInterval(job.date, p.intervalValue, p.intervalUnit))}</b>.</p>
          )}
        </Section>)}

        <ShareBox job={job} up={up} toast={toast}/>

        <Section title="Declaration" chip={(job.sig||{}).sig ? <span className="chip chip-ok">Signed</span> : <span className="chip chip-open">Open</span>}>
          <p className="text-xs text-slate-500 mb-3 leading-relaxed">
            {isTest
              ? 'I/We are responsible for the inspection, testing and construction of the electrical installation described in this record, and certify that the work covered by it has been designed, constructed, inspected and tested to the best of my/our knowledge and belief in accordance with the National Rules for Electrical Installations.'
              : 'I/We are responsible for the inspection and testing of the electrical installation described in this report, and confirm to the best of my/our knowledge that the tests and observations recorded represent an accurate assessment, within the limits specified, of the condition of the electrical installation.'}
          </p>
          {!isTest && a.unanswered.length > 0 && (
            <div className="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-900">
              <b>{a.unanswered.length} question{a.unanswered.length===1?'':'s'} still unanswered:</b> {a.unanswered.join(', ')}. All questions must be answered before signing.
            </div>
          )}
          {isTest && (a.gaps || []).length > 0 && (
            <div className="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-900">
              <b>{a.gaps.length} reading{a.gaps.length===1?'':'s'} still outstanding.</b> Every circuit needs a full set before this can be signed.
            </div>
          )}
          {/* One inspector, one name. This is the same field as the Site tab —
              typing it in either place updates both. */}
          <div className="grid sm:grid-cols-2 gap-3 mb-3">
            <Field label="Inspected and tested by" value={job.inspector} onChange={setInspector} required
              hint={'Same as the ' + (isTest ? 'tester' : 'inspector') + ' on the Site tab.'}/>
            <Field label="Certifier no." value={p.certifierNo} onChange={v=>setP({certifierNo:v})} required
              hint="Set a default in Settings and every new record starts with it filled in."/>
          </div>
          <p className="text-xs text-slate-400 mb-3">Signed on {fmtDate(job.date)}, the date of {isTest ? 'test' : 'inspection'}.</p>
          <SignaturePad value={(job.sig||{}).sig} onChange={v=>up({ sig: Object.assign({}, job.sig, { sig:v, name: job.inspector, date: job.date }) })}/>
        </Section>

        <Section title="Submit" chip={job.submitted ? <span className="chip chip-ok">Submitted</span> : <span className="chip chip-draft">Draft</span>}>
          {blockers.length > 0 ? (
            <div className="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200">
              <p className="text-sm font-bold text-amber-900 mb-1.5">Not ready to submit</p>
              <ul className="text-xs text-amber-900 space-y-1">
                {blockers.map((b,i) => <li key={i} className="flex gap-2"><span>•</span><span>{b}</span></li>)}
              </ul>
              <p className="text-xs text-amber-800 mt-2">
                You can still take a draft copy away with you — it will be watermarked DRAFT.
              </p>
            </div>
          ) : (
            <p className="text-sm text-slate-600 mb-3">Everything is answered, rated and signed. Ready to submit.</p>
          )}

          <button className="btn btn-a w-full mb-2" disabled={blockers.length > 0 || !!sending}
            onClick={()=>doSubmit(true)}>
            {sending === 'download' ? 'Submitting…' : 'Submit & download PDF'}
          </button>
          <button className="btn btn-o w-full" disabled={blockers.length > 0 || !!sending}
            onClick={()=>doSubmit(false)}>
            {sending === 'plain' ? 'Submitting…' : 'Submit'}
          </button>
          <p className="text-xs text-slate-500 mt-2.5 leading-relaxed">
            Both send the report to <b>{settings.officeEmail || 'the office'}</b>. The only difference is whether you also keep a
            copy on this phone.
            {!API.on && ' With no access code on this device the app opens your mail app with the report attached instead.'}
          </p>
          {blockers.length > 0 && (
            <button className="btn btn-g w-full mt-2 text-sm" onClick={()=>{ buildRecordPdf(job, settings); toast('Draft PDF downloaded'); }}>
              Download draft copy
            </button>
          )}
          <p className="text-xs text-slate-400 mt-3">
            {isTest
              ? 'The test record prints landscape, so a full circuit schedule fits across the page instead of being folded into a phone-width column.'
              : 'The PDF follows the layout of the Safe Electric periodic report.'}
          </p>
        </Section>

        <button className="btn btn-p w-full" onClick={back}>Back to list</button>
      </>)}

      {/* Bottom navigation. Nobody should have to scroll back to the top of a
          long tab to move on. Mirrors the tab strip, always in thumb reach. */}
      <div className="flex gap-2 pt-1 pb-2">
        {tabIndex > 0 && (
          <button className="btn btn-g flex-1 !px-2" onClick={()=>goTab(TABS[tabIndex-1])}>
            ‹ {TABS[tabIndex-1]}
          </button>
        )}
        {tabIndex < TABS.length - 1 && (
          <button className="btn btn-a flex-[1.4] !px-2" onClick={()=>goTab(TABS[tabIndex+1])}>
            Next: {TABS[tabIndex+1]} ›
          </button>
        )}
      </div>
    </div>
  </div>);
}

/* ================= LIST ================= */
/* Two big cards rather than a dropdown. Which record you are filling in changes
   every screen after this one, so it is worth a deliberate tap at the start
   instead of a setting somebody misses. */
function KindPicker({onPick, onCancel}){
  return (<div className="space-y-3 fadein">
    <div className="flex items-center justify-between">
      <h2 className="font-bold text-slate-800">What are you recording?</h2>
      <button className="text-sm font-bold text-slate-400" onClick={onCancel}>Cancel</button>
    </div>
    {Object.keys(KINDS).map(k => {
      const K = KINDS[k];
      return (<button key={k} className="kindcard" onClick={()=>onPick(k)}>
        <div className="flex items-start gap-3">
          <span className="w-11 h-11 rounded-xl brandgrad shrink-0 flex items-center justify-center text-white font-black text-[13px]">{K.prefix}</span>
          <div className="min-w-0">
            <div className="font-bold text-slate-800">{K.label}</div>
            <div className="text-xs text-slate-500 leading-relaxed mt-0.5">{K.blurb}</div>
            <div className="text-[11px] font-semibold text-slate-400 mt-1.5">{K.tabs.join('  ›  ')}</div>
          </div>
        </div>
      </button>);
    })}
  </div>);
}

function KindChip({kind}){
  const K = KINDS[kind];
  return <span className="chip" style={{ background: kind === 'test' ? 'rgba(0,135,200,.12)' : 'var(--c1-soft)', color: kind === 'test' ? 'var(--c1)' : 'var(--c1)' }}>{K.short}</span>;
}

function JobList({jobs, openJob, newJob, go, deleteJob, settings, toast}){
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [picking, setPicking] = useState(false);
  const byKind = filter === 'all' ? jobs : jobs.filter(j => kindOf(j) === filter);
  const list = byKind.filter(j => !q || ((j.customerName||'') + ' ' + (j.address||'') + ' ' + (j.prNo||'') + ' ' + (j.date||'')).toLowerCase().includes(q.toLowerCase()));
  const open = jobs.filter(j => !audit(j).complete).length;
  const urgent = jobs.reduce((n,j) => n + audit(j).urgent.length, 0);
  const counts = { all: jobs.length, periodic: jobs.filter(j => kindOf(j) === 'periodic').length, test: jobs.filter(j => kindOf(j) === 'test').length };

  return (<div className="space-y-4 pb-28">
    <div className="grid grid-cols-3 gap-2">
      <div className="card p-3 text-center">
        <div className="text-2xl font-black text-slate-800">{jobs.length}</div>
        <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Records</div>
      </div>
      <div className="card p-3 text-center">
        <div className="text-2xl font-black" style={{color:'var(--c2)'}}>{open}</div>
        <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">In progress</div>
      </div>
      <div className="card p-3 text-center">
        <div className={'text-2xl font-black ' + (urgent ? 'text-red-600' : 'text-slate-800')}>{urgent}</div>
        <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Needs action</div>
      </div>
    </div>

    {picking
      ? <KindPicker onPick={k=>{ setPicking(false); newJob(k); }} onCancel={()=>setPicking(false)}/>
      : <button className="btn btn-a w-full !py-5 text-base rounded-2xl" onClick={()=>setPicking(true)}>+ New record</button>}

    <div className="grid grid-cols-2 gap-2">
      <button className="btn btn-g rounded-xl text-sm" onClick={()=>go('sites')}>Sites</button>
      <button className="btn btn-g rounded-xl text-sm" onClick={()=>go('settings')}>Settings</button>
    </div>

    <div className="scrollx -mx-4 px-4">
      <div className="flex gap-2 w-max">
        {[['all','All'],['periodic','Periodic'],['test','Test records']].map(([k,l]) => (
          <button key={k} className={'tabbtn ' + (filter===k ? 'on' : 'off')} onClick={()=>setFilter(k)}>
            {l} <span className="ml-1 opacity-60">{counts[k]}</span>
          </button>
        ))}
      </div>
    </div>

    <input className="field" placeholder="Search by site, address, record no or date…" value={q} onChange={e=>setQ(e.target.value)}/>

    {list.length === 0 && (
      <div className="card p-8 text-center text-slate-400 text-sm">
        {jobs.length === 0 ? 'Nothing recorded yet. Tap "New record" to start.' : 'Nothing matches that.'}
      </div>
    )}
    {list.map(j => {
      const a = audit(j);
      const k = kindOf(j);
      return (<div key={j.id} className="card p-4 flex items-center justify-between gap-3">
        <button className="min-w-0 text-left flex-1" onClick={()=>openJob(j.id)}>
          <div className="flex items-center gap-2 mb-0.5 flex-wrap">
            <KindChip kind={k}/>
            {j.prNo && <span className="text-xs text-slate-400 font-semibold">{j.prNo}</span>}
            {/* Somebody else's job that has been passed to you reads very
                differently from your own, so it says so. */}
            {j.owner && API.owner && j.owner !== API.owner &&
              <span className="chip" style={{ background:'rgba(0,135,200,.14)', color:'var(--c1)' }}>From {j.owner}</span>}
            {(j.sharedWith || []).length > 0 && (!API.owner || j.owner === API.owner) &&
              <span className="chip chip-open">Shared</span>}
          </div>
          <div className="font-bold text-slate-800 truncate">{j.customerName || 'Untitled record'}</div>
          <div className="text-sm text-slate-500 truncate">
            {[j.address, fmtDate(j.date),
              k === 'test' ? a.answered + '/' + a.total + ' circuits' : a.answered + '/' + a.total + ' checks',
              k === 'test' ? (a.urgent.length ? a.urgent.length + ' failed' : '') : (a.obs.length ? a.obs.length + ' obs' : '')
             ].filter(Boolean).join(' • ')}
          </div>
        </button>
        <div className="flex items-center gap-2 shrink-0">
          {a.urgent.length > 0
            ? <span className="chip chip-bad">{k === 'test' ? 'Fail' : 'Urgent'}</span>
            : a.complete
              ? <span className={'chip ' + (a.condition === 'Unsatisfactory' ? 'chip-bad' : 'chip-ok')}>{k === 'test' ? 'Pass' : (a.condition || 'Done')}</span>
              : <span className="chip chip-open">In progress</span>}
          <button className="text-slate-300 text-lg px-1" onClick={()=>deleteJob(j.id)}>🗑</button>
        </div>
      </div>);
    })}
  </div>);
}
