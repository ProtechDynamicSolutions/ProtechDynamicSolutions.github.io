<script>
window.__err = function(msg){
  var b = document.getElementById('boot'); if(!b) return;
  b.style.display = 'flex';
  b.innerHTML = '<div style="max-width:520px;padding:24px;text-align:left"><div style="font-weight:700;color:#b91c1c;font-size:16px;margin-bottom:8px">The app could not start</div><pre style="white-space:pre-wrap;font-size:12px;color:#334155;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px">' + String(msg) + '</pre></div>';
};
window.addEventListener('error', function(e){ window.__err((e.message||'Error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
window.addEventListener('load', function(){
  var missing = [];
  if(!window.React) missing.push('React');
  if(!window.Babel) missing.push('Babel');
  if(!window.jspdf) missing.push('jsPDF');
  if(!window.ExcelJS) missing.push('ExcelJS');
  if(missing.length) window.__err('These libraries did not load: ' + missing.join(', ') + '.\nThe page needs internet access the first time it is opened.');
});
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ================= BRANDING ================= */
const BRAND = window.APP_CONFIG || {};

/* Maintenance unlock: tap the header title 7 times, enter the PIN, and the
   branding controls appear in Settings. Client-side gate only — it hides
   controls from the user, it is not protection against reading the source. */
const LOCAL_PIN = BRAND.maintPin || '';
const maintUnlocked = () => { try{ return sessionStorage.getItem('ifes_unlocked') === '1'; }catch(e){ return false; } };

/* ================= LOCAL STORAGE ================= */
/* Namespaced per company: localStorage is shared across a whole github.io
   domain, so two deployments must never collide. */
const STORE_NS = 'ifes_' + ((BRAND.companyCode || BRAND.companyName || 'app').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16)) + '_';
const memStore = {};
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(STORE_NS+k); return v ? JSON.parse(v) : fb; }catch(e){ return memStore[k] !== undefined ? memStore[k] : fb; } },
  set(k, v){ try{ localStorage.setItem(STORE_NS+k, JSON.stringify(v)); }catch(e){ memStore[k] = v; } }
};

/* ================= SMALL HELPERS ================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const nowISO = () => new Date().toISOString();
const todayInput = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-IE', {day:'2-digit', month:'short', year:'numeric'}); };
const downloadBlob = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); };
const hexToRgb = (h) => { h=(h||'#0f172a').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const luminance = (h) => { const [r,g,b]=hexToRgb(h); return (0.299*r+0.587*g+0.114*b)/255; };
const textOn = (h) => luminance(h) > 0.6 ? '#0f172a' : '#ffffff';
const argb = (h) => 'FF' + (h||'#0f172a').replace('#','').toUpperCase();
const safeName = (s) => String(s || 'record').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'record';

/* Fit an image inside a box without squashing it. */
function fitBox(natW, natH, maxW, maxH){
  if(!natW || !natH) return { w:maxW, h:maxH };
  const r = Math.min(maxW/natW, maxH/natH);
  return { w:natW*r, h:natH*r };
}

/* Add N months/years to a yyyy-mm-dd date. Used for the next-inspection date. */
function addInterval(dateStr, value, unit){
  const n = parseFloat(value);
  if(!dateStr || !n || isNaN(n)) return '';
  const d = new Date(dateStr);
  if(isNaN(d)) return '';
  if(unit === 'months') d.setMonth(d.getMonth() + Math.round(n));
  else d.setFullYear(d.getFullYear() + Math.round(n));
  return d.toISOString().slice(0,10);
}

/* ================= API (Google Apps Script) ================= */
/* The access code is NOT baked into this file. An Apps Script web app has to be
   published as "Anyone", so anything embedded in the page source is readable by
   anyone who views source. Instead the code is typed once per device and kept in
   that device's storage, which keeps it out of the deployed HTML, out of the
   repo and out of anything shared by link.
   BRAND.apiKey stays supported for a throwaway build, but the Factory leaves it
   empty by default. */

/* The address the app talks to. With apiUrlHead set, the tail is typed once per
   device and kept there — so a copy of this file, on its own, does not say where
   the backend is. Worth being clear about what that is and is not: it hides the
   address, which stops casual poking; it is one shared secret for everyone, so
   it is not per-person security and it is not what controls who can sign in.
   The Techs tab and the server checks do that. */
const CONN = {
  head: BRAND.apiUrlHead || '',
  get tail(){ return store.get('connTail', '') || ''; },
  set tail(v){ store.set('connTail', v || ''); },
  get needed(){ return !!this.head && !BRAND.apiUrl && !this.tail; },
  url(tail){
    if(BRAND.apiUrl) return BRAND.apiUrl;
    const t = (tail === undefined ? this.tail : tail).trim();
    return (this.head && t) ? this.head + t + '/exec' : '';
  }
};

const API = {
  url: CONN.url(),
  /* Two ways in. An electrician signs in with their name and a 6-digit PIN, both
     of which live in the Techs tab of the sheet and are changed there. The
     office keeps a long access code instead. */
  /* The PIN is used once, to sign in. After that the device holds a token
     derived from it, so the PIN is not on the wire all day and a lockout aimed
     at somebody's name cannot stop their phone syncing. */
  user: '', pin: '', token: '', key: '',
  /* Set from the server's reply, never chosen by the app. Blank means the
     office code, which sees everything; a name means an electrician, and the
     server sends only their own records plus anything shared with them. The app
     does no filtering of its own — filtering done in a page anyone can
     view-source is not filtering. */
  owner: '',
  team: [],
  company: (BRAND.companyCode || 'default').toLowerCase(),
  get configured(){ return !!(this.url || CONN.head); },
  get on(){ return !!(this.url && (this.key || (this.user && (this.token || this.pin)))); },
  async raw(action, payload, creds){
    const c = creds || { key: this.key, user: this.user, pin: this.pin, token: this.token };
    const c2 = creds || {};
    /* text/plain avoids a CORS preflight, which Apps Script cannot answer. */
    const res = await fetch(this.url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      /* scope says which app is asking. The records app only ever wants one
         person's work, even when that person also has dashboard access. */
      /* A token, once we have one — the PIN only travels on the sign-in itself. */
      body: JSON.stringify({ key: c.key || '', user: c.user || '',
                             pin: c.token ? '' : (c.pin || ''), token: c.token || '', scope:'own',
                             trap: c2.trap || '', dwell: c2.dwell,
                             company:this.company, action, payload: payload || {} })
    });
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Request failed');
    if(json.team) this.team = json.team;
    return json;
  },
  async call(action, payload){
    if(!this.on) throw new Error('Not signed in on this device.');
    return (await this.raw(action, payload)).data;
  },
  save(creds, owner, team, token){
    this.key = creds.key || ''; this.user = creds.user || '';
    /* The PIN itself is deliberately not kept once a token has been issued. */
    this.token = token || ''; this.pin = token ? '' : (creds.pin || '');
    this.owner = owner || ''; this.team = team || [];
    store.set('accessKey', this.key); store.set('accessUser', this.user);
    store.set('accessToken', this.token); store.set('accessPin', this.pin);
    store.set('accessOwner', this.owner); store.set('team', this.team);
  },
  forget(){
    this.key = ''; this.user = ''; this.pin = ''; this.token = ''; this.owner = ''; this.team = [];
    ['accessKey','accessUser','accessPin','accessToken','accessOwner','team'].forEach(k => store.set(k, ''));
  }
};
API.key = store.get('accessKey', '') || (BRAND.apiKey || '');
API.user = store.get('accessUser', '') || '';
API.pin = store.get('accessPin', '') || '';
API.token = store.get('accessToken', '') || '';
API.owner = store.get('accessOwner', '') || '';
API.team = store.get('team', []) || [];

/* Everything saves to the device first. A queue of changed ids is flushed to
   Apps Script whenever the network allows, so the app works with no signal. */
const queue = {
  get list(){ return store.get('queue', []); },
  add(id){ const q = this.list; if(q.indexOf(id) === -1){ q.push(id); store.set('queue', q); } },
  clear(ids){ store.set('queue', this.list.filter(x => ids.indexOf(x) === -1)); }
};

/* ================= REFERENCE DATA ================= */
/* The questions from the Safe Electric Periodic Inspection Report.
   Third value = whether N/A is an allowed answer. */
const PIR_Q = [
  { g:'Outlets & accessories', items:[
    [1,'Have all electrical outlets / accessories been inspected?', false],
    [2,'Are all outlets / accessories undamaged?', false],
    [3,'Are all live parts covered?', false],
  ]},
  { g:'Earthing / bonding', items:[
    [4,'If TNCS, is main protective conductor connected?', true],
    [5,'If present, is it the correct size?', true],
    [6,'Earth Electrode Inspection Chamber?', false],
    [7,'If yes, is earth electrode visible?', false],
    [8,'If yes, is protective tape used?', false],
    [9,'If visible, is the earthing conductor the correct size?', false],
    [10,'Is all main equipotential bonding correct?', true],
    [11,'All supplementary bonding correct and connections verified?', true],
    [12,'Protective earthing sleeved where appropriate?', true],
    [13,'Polarity and earthing of all switches / outlets correct?', false],
    [14,'All metallic switches / outlets earthed?', false],
  ]},
  { g:'Distribution board(s)', items:[
    [15,'Labelled correctly?', false],
    [16,'Located correctly?', false],
    [18,'Are all devices correctly rated for S/C and O/L?', false],
    [19,'Circuit sequence correct for P, N, +E?', false],
  ]},
  { g:'General', items:[
    [21,'Correct cable colours used at the time of installation?', false],
    [22,'Are cables in good condition?', false],
    [23,'Cables correctly selected?', false],
    [24,'Correct routing of cables in attic area?', true],
    [25,'Cables correctly installed where visible?', false],
    [26,'All excessive heating effects from luminaires avoided?', false],
    [27,'Correctly selected accessories and switches?', false],
    [28,'Are they in a good condition?', false],
    [29,'Are they correctly located?', false],
    [30,'Are they suitable for their environment?', false],
  ]},
];
const PIR_CODES = {
  '1':'Requires urgent attention',
  '2':'Requires improvements',
  '3':'Requires some attention',
  '4':'Does not comply with current National Rules'
};
const Q_TEXT = (() => { const m = {}; PIR_Q.forEach(g => g.items.forEach(i => { m[i[0]] = i[1]; })); return m; })();
const pirQFlat = () => PIR_Q.reduce((a,g)=> a.concat(g.items.map(i=>i[0])), []);

/* ================= RECORD KINDS =================
   One app, two records. Everything the two have in common — the site, the
   supply, the photos, the declaration — is stored once at the top of the job.
   Anything only one of them needs sits under `pir` or `test`. */
const KINDS = {
  periodic: {
    label:'Periodic inspection',
    short:'Periodic',
    blurb:'The 28 checks, observations and codes, the RCD table and an overall condition. For an installation already in service.',
    prefix:'PR',
    docTitle:'PERIODIC INSPECTION REPORT',
    tabs:['Site','Supply','Checks','Findings','Sign off']
  },
  test: {
    label:'Test record',
    short:'Test record',
    blurb:'A circuit schedule with pre-connection and post-connection readings, checked against the limits as you type. For new work, a rewire or an addition.',
    prefix:'TR',
    docTitle:'ELECTRICAL INSTALLATION TEST RECORD',
    tabs:['Site','Supply','Circuits','Pre-test','Post-test','Sign off']
  }
};
const kindOf = (job) => (job && job.kind === 'test') ? 'test' : 'periodic';

/* Suggestions rather than rules: every dropdown in the app keeps an
   "Other (specify)" escape hatch, because site reality always wins. */
const SUG = {
  designation: ['Supply cable','Lighting downstairs','Lighting upstairs','Sockets downstairs','Sockets upstairs',
                'Kitchen sockets','Cooker','Hob','Oven','Shower','Immersion','Water pump','Heating controls','Boiler',
                'Smoke alarms','Garage','Outside lights','Outside socket','EV charger','Ring circuit','Radial circuit',
                'Sub-main','Alarm','Air conditioning','Three phase supply'],
  cableType: ['T&E 6242Y','Singles 6491X','SWA','NYM-J','FP200','H07RN-F','Concentric','MICC','Flex'],
  cableSize: ['1.0','1.5','2.5','4.0','6.0','10.0','16.0','25.0','35.0','50.0','70.0','95.0'],
  device: ['MCB','RCBO','RCD','Fuse BS88','Fuse BS3036','Fuse BS1361','AFDD','Isolator'],
  deviceType: ['B','C','D','AC','A','F','gG','N/A'],
  amps: ['6','10','16','20','25','32','40','45','50','63','80','100','125'],
  installType: ['New installation','Rewire','Addition','Alteration','Temporary supply','Replacement board'],
  instruments: ['Insulation resistance / continuity','Earth loop impedance','RCD','Multifunction']
};

/* Maximum Zs by device type and rating, so a measured loop impedance can be
   checked as it is typed instead of back at the van. */
const MAXZS = { 'B6':7.28,'B10':4.37,'B16':2.73,'B20':2.19,'B25':1.75,'B32':1.37,'B40':1.09,'B50':0.87,'B63':0.69,
                'C6':3.64,'C10':2.19,'C16':1.37,'C20':1.09,'C25':0.87,'C32':0.68,'C40':0.55,'C50':0.44,'C63':0.35,
                'D6':1.82,'D10':1.09,'D16':0.68,'D20':0.55,'D25':0.44,'D32':0.34 };

const blankPre = () => ({ rpre:'', re:'', ll:'', nn:'', ee:'', irPNE:'', irPN:'', ir3ph:'', erroneous:false, polarity:false, pass:'', comments:'' });
const blankPost = () => ({ maxZs:'', zs:'', pfc:'', rcdHalf:'', rcd1:'', rcd5:'', testBtn:false, polarity:false, functional:false, pass:'', comments:'' });
const blankCircuit = (n) => ({ id: uid(), number: String(n || 1), designation:'', cableType:'', cableSize:'', points:'',
                               device:'', deviceType:'', amps:'', notes:'', pre: blankPre(), post: blankPost() });
const blankInstruments = () => SUG.instruments.map(n => ({ id: uid(), use:n, make:'', model:'', serial:'', calExpiry:'' }));

/* A circuit is "done" once someone has explicitly said Pass or Fail on both
   halves. Readings on their own are not a verdict. */
const preDone = (c) => !!c.pre.pass;
const postDone = (c) => !!c.post.pass;
const circuitFailed = (c) => c.pre.pass === 'Fail' || c.post.pass === 'Fail';

/* Everything blocking a test record, per circuit, in the words used on screen. */
function circuitGaps(c){
  const out = [];
  const n = 'Circuit ' + (c.number || '?') + (c.designation ? ' (' + c.designation + ')' : '');
  if(!c.designation) out.push(n + ': no designation.');
  if(!(c.pre.rpre || c.pre.re || c.pre.ll || c.pre.nn || c.pre.ee)) out.push(n + ': no continuity reading.');
  if(!(c.pre.irPNE || c.pre.irPN || c.pre.ir3ph)) out.push(n + ': no insulation resistance reading.');
  if(!c.pre.pass) out.push(n + ': pre-connection not marked Pass or Fail.');
  if(!c.post.zs) out.push(n + ': no measured Zs.');
  if(!c.post.pass) out.push(n + ': post-connection not marked Pass or Fail.');
  return out;
}

/* One audit for both kinds, so the list, the header and the dashboard can stay
   generic. The shape is the same either way; only what fills it changes. */
function audit(job){
  if(kindOf(job) === 'test') return testAudit(job);
  return pirAudit(job);
}

function testAudit(job){
  const t = job.test || {};
  const cs = t.circuits || [];
  const done = cs.filter(c => preDone(c) && postDone(c));
  const failed = cs.filter(circuitFailed);
  const gaps = cs.reduce((a, c) => a.concat(circuitGaps(c)), []);
  return {
    unanswered: cs.filter(c => !(preDone(c) && postDone(c))).map(c => c.number),
    nos: failed.map(c => c.number),
    obs: failed.map(c => ({ id:c.id, ref:c.number, code:'1',
      comment: (c.designation || 'Circuit ' + c.number) + ' failed: ' + [c.pre.comments, c.post.comments].filter(Boolean).join('; ') })),
    urgent: failed,
    answered: done.length,
    total: cs.length,
    gaps,
    condition: failed.length ? 'Unsatisfactory' : (cs.length && done.length === cs.length ? 'Satisfactory' : ''),
    complete: cs.length > 0 && gaps.length === 0 && !!((job.sig||{}).sig)
  };
}

/* Unanswered questions, "No" answers and urgent observations, in one place. */
function pirAudit(job){
  const p = job.pir || {};
  const q = p.q || {};
  const nums = pirQFlat();
  const unanswered = nums.filter(n => !q['q'+n]);
  const nos = nums.filter(n => q['q'+n] === 'No');
  const obs = (p.obs || []).filter(o => (o.comment||'').trim());
  const urgent = obs.filter(o => o.code === '1');
  return {
    unanswered, nos, obs, urgent,
    answered: nums.length - unanswered.length,
    total: nums.length,
    condition: urgent.length ? 'Unsatisfactory' : (p.condition || ''),
    complete: unanswered.length === 0 && !!p.condition && !!((job.sig||{}).sig)
  };
}

/* Record numbers run on automatically, counted separately per kind so the
   periodic reports and the test records each keep their own sequence. Still
   editable, in case a job has to match a number from elsewhere. */
function nextRecNo(jobs, kind){
  const prefix = KINDS[kind].prefix;
  let max = 0;
  (jobs || []).forEach(j => {
    if(kindOf(j) !== kind) return;
    const m = /(\d+)\s*$/.exec(j.prNo || '');
    if(m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + '-' + String(max + 1).padStart(5, '0');
}

/* Everything that does not change between visits to the same site is carried
   forward, so a repeat inspection starts most of the way filled in. The checks,
   the observations and the readings always start blank. */
const CARRY_FIELDS = ['category','reason','reasonOther','approxAge','occupant','entireInstall','partialDetail',
                      'earthing','phase','pscc','mainIsolation','nominalRating','mainRcdIn','mainRcdIdn',
                      'q17type','intervalValue','intervalUnit','certifierNo',
                      'instContinuity','instIR','instLoop','instRcd'];
function carryForward(target, prev){
  if(!prev) return target;
  const pp = prev.pir || {};
  CARRY_FIELDS.forEach(k => { if(pp[k]) target.pir[k] = pp[k]; });
  if((pp.rcds || []).length){
    target.pir.rcds = pp.rcds.map(r => ({ id: uid(), desc: r.desc, trip: r.trip, time: '' }));
  }
  /* A test record on a site already tested keeps the board it was tested at:
     the circuit schedule comes across, the readings never do. Retyping a
     22-way board because one circuit changed is how mistakes get in. */
  if(kindOf(target) === 'test' && kindOf(prev) === 'test'){
    const pt = prev.test || {};
    ['dbRef','installType','maxDemand','supplyChar','maxRpRe','maxRe','mprn'].forEach(k => { if(pt[k]) target.test[k] = pt[k]; });
    if(pt.bonding) target.test.bonding = Object.assign({}, pt.bonding);
    if((pt.instruments || []).length) target.test.instruments = pt.instruments.map(i => Object.assign({}, i, { id: uid() }));
    if((pt.circuits || []).length){
      target.test.circuits = pt.circuits.map(c => Object.assign({}, c, { id: uid(), notes:'', pre: blankPre(), post: blankPost() }));
    }
  }
  target.inspector = prev.inspector || target.inspector;
  target.sig.name = (prev.sig || {}).name || target.sig.name;
  return target;
}

function SignaturePad({value, onChange}){
  const ref = useRef(null); const drawing = useRef(false); const dirty = useRef(false);
  useEffect(()=>{
    const c = ref.current; if(!c) return;
    const scale = window.devicePixelRatio || 1;
    const w = c.offsetWidth, h = c.offsetHeight;
    c.width = w*scale; c.height = h*scale;
    const ctx = c.getContext('2d'); ctx.scale(scale, scale);
    ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f172a';
    if(value){ const img = new Image(); img.onload = ()=>ctx.drawImage(img,0,0,w,h); img.src = value; }
  },[]);
  const pos = (e) => { const r = ref.current.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const down = (e) => { drawing.current = true; const ctx = ref.current.getContext('2d'); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ref.current.setPointerCapture(e.pointerId); };
  const move = (e) => { if(!drawing.current) return; const ctx = ref.current.getContext('2d'); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); dirty.current = true; };
  const up = () => { if(drawing.current && dirty.current) onChange(ref.current.toDataURL('image/png')); drawing.current = false; };
  const clear = () => { const c = ref.current; const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); onChange(''); dirty.current = false; };
  return (<div>
    <canvas ref={ref} className="sigpad" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerLeave={up}/>
    <button type="button" className="btn btn-g mt-2 !min-h-[38px] !py-1.5 text-sm" onClick={clear}>Clear signature</button>
  </div>);
}

function compressImage(file, maxDim=1200, quality=0.68){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(Math.max(w,h) > maxDim){ const r = maxDim/Math.max(w,h); w = Math.round(w*r); h = Math.round(h*r); }
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

/* ================= PDF FURNITURE ================= */
/* The teardrop badge, bottom-left of every report page. It could never work in
   the header — it is a tall portrait badge and a header slot is short and wide,
   so it came out 24px across with its wordmark unreadable. Down here the page
   is white, so it needs no plate, and there is room to draw it at a size where
   it actually reads. Returns the width it used, so the footer text can start
   clear of it. */
function footerMark(doc, st, x, baseY, h){
  const mark = st.logoMark;
  if(!mark) return 0;
  try{
    const pr = doc.getImageProperties(mark);
    const w = pr.width / pr.height * h;
    doc.addImage(mark, 'PNG', x, baseY, w, h, undefined, 'FAST');
    return w;
  }catch(e){ return 0; }
}

/* A gradient band drawn as thin slices, so paper matches the on-screen header.
   jsPDF has no gradient fill of its own. */
function lerp(a, b, t){ return a + (b - a) * t; }
function gradBand(doc, x, y, w, h, stops){
  /* A slim per-page rule does not need as many slices as a full cover band. */
  const N = h > 18 ? 96 : 44;
  for(let i = 0; i < N; i++){
    const t = i / (N - 1);
    let a = stops[0], b = stops[stops.length - 1];
    for(let s = 0; s < stops.length - 1; s++){
      if(t >= stops[s].p && t <= stops[s+1].p){ a = stops[s]; b = stops[s+1]; break; }
    }
    const span = (b.p - a.p) || 1;
    const lt = Math.min(Math.max((t - a.p) / span, 0), 1);
    doc.setFillColor(
      Math.round(lerp(a.c[0], b.c[0], lt)),
      Math.round(lerp(a.c[1], b.c[1], lt)),
      Math.round(lerp(a.c[2], b.c[2], lt))
    );
    doc.rect(x + (w * i / N), y, w / N + 0.4, h, 'F');
  }
}
function brandStops(st){
  const c1 = hexToRgb(st.c1), c2 = hexToRgb(st.c2), c3 = hexToRgb(st.c3);
  return [{p:0, c:c1}, {p:0.38, c:c3}, {p:0.68, c:c2}, {p:1, c:c1}];
}

/* DRAFT across every page until the record is signed off. */
function stampWatermarks(doc, opts){
  const draft = !!(opts && opts.draft);
  const wide = !!(opts && opts.landscape);
  const marks = [];
  if(draft) marks.push({ text:'DRAFT', rgb:[100,116,139], op:0.12 });
  if(!marks.length) return;
  const total = doc.internal.getNumberOfPages();
  for(let i = 1; i <= total; i++){
    doc.setPage(i);
    marks.forEach((m, mi) => {
      let restore = false;
      try{ doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity:m.op })); restore = true; }
      catch(e){ /* older jsPDF: fall back to a pale colour instead of alpha */ }
      doc.setTextColor(restore ? m.rgb[0] : 226, restore ? m.rgb[1] : 232, restore ? m.rgb[2] : 240);
      doc.setFont('helvetica','bold'); doc.setFontSize(52);
      const cx = wide ? 148.5 : 105;
      for(let row = 0; row < 4; row++) doc.text(m.text, cx, 62 + row*62 + mi*22, { align:'center', angle:32 });
      if(restore){ try{ doc.restoreGraphicsState(); }catch(e){} }
    });
    /* Said in words as well as in the diagonal stamp: a stamp can be missed
       on a page printed pale, a footer line cannot. */
    if(draft){
      doc.setFont('helvetica','bold'); doc.setFontSize(7);
      doc.setTextColor(100,116,139);
      doc.text('DRAFT — NOT YET SIGNED OFF', wide ? 148.5 : 105, wide ? 205 : 292, { align:'center' });
    }
    doc.setTextColor(15,23,42);
  }
}

/* ================= PDF REPORT ================= */
function buildPirPdf(job, settings, save=true){
  const doc = new jspdf.jsPDF({ unit:'mm', format:'a4', compress:true });
  const W = 210, M = 12, BOT = 268;
  const p = job.pir || {};
  const a = audit(job);
  const rgb1 = hexToRgb(settings.c1);
  const rgb2 = hexToRgb(settings.c2);
  const onC1 = textOn(settings.c1) === '#ffffff' ? [255,255,255] : [15,23,42];
  /* jsPDF's built-in fonts cannot encode ohm or delta, so use plain words. */
  const OHM = 'ohms', MOHM = 'Mohms';

  /* Page 1 gets the full banner; later pages get a slim rule, so the report
     stops spending a fifth of every page repeating itself. */
  let firstPage = true;
  const head = () => {
    const stops = brandStops(settings);
    if(firstPage){
      firstPage = false;
      gradBand(doc, 0, 0, W, 22, stops);
      let tx = M;
      /* The knockout sits directly on the band. Only a build with no white
         version falls back to a plate. */
      const bannerLogo = settings.logoLight || settings.logo;
      if(bannerLogo){
        try{
          const pr = doc.getImageProperties(bannerLogo);
          const fit = fitBox(pr.width, pr.height, 15, 16);
          const ly = (22 - fit.h)/2;
          if(!settings.logoLight && settings.logoBox !== false){
            doc.setFillColor(255,255,255);
            doc.roundedRect(M - 2, ly - 2, fit.w + 4, fit.h + 4, 2, 2, 'F');
          }
          doc.addImage(bannerLogo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, ly, fit.w, fit.h, undefined, 'FAST');
          tx = M + fit.w + 7;
        }catch(e){}
      }
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
      doc.text('PERIODIC INSPECTION REPORT', tx, 10.6);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
      doc.text([settings.companyName, settings.regNo && ('Reg ' + settings.regNo)].filter(Boolean).join('   ·   '), tx, 15.4);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.2);
      doc.text(job.prNo || '', W - M, 10.6, { align:'right' });
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
      doc.text(fmtDate(job.date), W - M, 15.4, { align:'right' });
      doc.setTextColor(15,23,42);
      return 29;
    }
    gradBand(doc, 0, 0, W, 4, stops);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(120,133,150);
    doc.text((settings.companyName || '').toUpperCase() + '   ·   PERIODIC INSPECTION REPORT', M, 9);
    doc.text([job.prNo, fmtDate(job.date)].filter(Boolean).join('   ·   '), W - M, 9, { align:'right' });
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.2); doc.line(M, 11.5, W - M, 11.5);
    doc.setTextColor(15,23,42);
    return 18;
  };

  let y = head();

  /* At-a-glance strip: the three things anyone opening this looks for first. */
  const badge = a.condition === 'Unsatisfactory' ? [220,38,38] : a.condition === 'Satisfactory' ? [5,150,105] : [148,163,184];
  doc.setFillColor(248,250,252); doc.roundedRect(M, y - 3, W - M*2, 17, 2, 2, 'F');
  doc.setFillColor(badge[0],badge[1],badge[2]); doc.rect(M, y - 3, 1.6, 17, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(15,23,42);
  doc.text(doc.splitTextToSize(job.customerName || 'Site', 104)[0], M + 5, y + 3);
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(100,116,139);
  doc.text(doc.splitTextToSize(job.address || '', 104)[0], M + 5, y + 8);
  [
    ['CONDITION', a.condition || 'Not recorded', badge],
    ['OBSERVATIONS', String(a.obs.length) + (a.urgent.length ? ' (' + a.urgent.length + ' urgent)' : ''), a.urgent.length ? [220,38,38] : [15,23,42]],
    ['NEXT DUE', fmtDate(addInterval(job.date, p.intervalValue, p.intervalUnit)) || '—', [15,23,42]]
  ].forEach((f, i) => {
    const fx = M + 116 + i*24;
    doc.setFont('helvetica','bold'); doc.setFontSize(5.2); doc.setTextColor(148,163,184);
    doc.text(f[0], fx, y + 1);
    doc.setFontSize(6.8); doc.setTextColor(f[2][0], f[2][1], f[2][2]);
    doc.text(doc.splitTextToSize(String(f[1]), 23), fx, y + 5.5);
  });
  doc.setTextColor(15,23,42);
  y += 21;
  const room = (need) => { if(y + need > BOT){ doc.addPage(); y = head(); } };

  const tick = (x, yy, on) => {
    doc.setDrawColor(120,133,150); doc.setLineWidth(0.25);
    doc.rect(x, yy - 2.7, 3.4, 3.4);
    if(on){
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1);
      doc.text('X', x + 0.7, yy + 0.1);
      doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    }
  };
  const opts = (x, yy, list, val) => {
    let cx = x;
    doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(15,23,42);
    list.forEach(o => {
      doc.text(o, cx, yy);
      const w = doc.getTextWidth(o);
      tick(cx + w + 1.5, yy, val === o);
      cx += w + 9;
    });
  };
  const line = (label, val, x, yy, w) => {
    doc.setFontSize(7.2); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
    doc.text(label, x, yy);
    const lw = doc.getTextWidth(label);
    doc.setDrawColor(210,218,228); doc.setLineWidth(0.2);
    doc.line(x + lw + 2, yy + 0.9, x + w, yy + 0.9);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    doc.text(String(val || ''), x + lw + 3.5, yy);
    doc.setFont('helvetica','normal');
  };
  const sect = (t) => {
    room(12);
    doc.setFillColor(240,244,248); doc.rect(M, y - 4.2, W - M*2, 6.4, 'F');
    doc.setFillColor(...rgb2); doc.rect(M, y - 4.2, 1.6, 6.4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1);
    doc.text(t.toUpperCase(), M + 4, y);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    y += 8;
  };

  const COL2 = 108, HALF = 90;

  sect('Registered contractor');
  line('Name', settings.companyName, M, y, 96); line('Reg No.', settings.regNo, COL2, y, COL2+HALF); y += 7;
  line('Address', settings.address, M, y, 96); line('Phone', settings.phone, COL2, y, COL2+HALF); y += 9;

  sect('Installation details');
  line('Occupant / trading as', p.occupant || job.customerName, M, y, 96);
  line('Approx age', p.approxAge, COL2, y, COL2+HALF); y += 7;
  line('Address', job.address, M, y, 96);
  doc.setFontSize(7.2); doc.setTextColor(100,116,139);
  doc.text('Occupant in attendance?', COL2, y);
  doc.setTextColor(15,23,42);
  opts(COL2 + 40, y, ['Yes','No'], p.occupantAttended); y += 9;

  sect('Category and reason');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Installation category', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 42, y, ['Domestic','Commercial','Industrial','Other'], p.category); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Reason for inspection', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 42, y, ['Insurance Inspection','Safety Audit','Other'], p.reason); y += 6.5;
  if(p.reasonOther){ line('If other, specify', p.reasonOther, M, y, W - M); y += 7; }
  y += 2;

  sect('Extent of installation covered by this report');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Entire installation?', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 40, y, ['Yes','No'], p.entireInstall); y += 5.5;
  doc.setFontSize(6.5); doc.setTextColor(120,133,150);
  doc.text('Cables concealed within trunking, conduit, the fabric of the building or underground have not been inspected unless stated otherwise.', M, y);
  doc.setTextColor(15,23,42); y += 5;
  if(p.entireInstall === 'No'){
    doc.setFontSize(7.2);
    const ls = doc.splitTextToSize('This report refers to: ' + (p.partialDetail || ''), W - M*2);
    room(ls.length*4 + 4);
    doc.text(ls, M, y); y += ls.length*4 + 2;
  }
  y += 3;

  sect('Supply characteristics');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Type of system earthing', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 46, y, ['TNCS','TT','TNS','IT'], p.earthing); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Installation voltage', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 46, y, ['Single Phase','Three Phase'], p.phase); y += 6.5;
  const volts = [['L1',p.v1],['L2',p.v2],['L3',p.v3],['L1-L2',p.v12],['L2-L3',p.v23],['L3-L1',p.v31]].filter(v => v[1]);
  if(volts.length){
    let vx = M;
    volts.forEach(v => { line(v[0], v[1] + ' V', vx, y, vx + 26); vx += 31; });
    y += 7;
  }
  line('Max prospective S/C current (A)', p.pscc, M, y, 96);
  line('Nominal rating (A)', p.nominalRating, COL2, y, COL2+HALF); y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Main isolation / overcurrent device', M, y);
  doc.setFont('helvetica','normal');
  opts(M + 62, y, ['None','Switch Fuse','MCB','MCCB'], p.mainIsolation); y += 7;
  line('If main RCD: rated current In (A)', p.mainRcdIn, M, y, 96);
  line('Tripping current (mA)', p.mainRcdIdn, COL2, y, COL2+HALF); y += 4;

  /* ---------- the questions ----------
     Flows on from the supply section rather than starting a fresh page. A forced
     break here left the bottom half of page 1 empty for no reason. */
  y += 6;
  sect('Inspection checks');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.2); doc.setTextColor(185,28,28);
  doc.text('Any question answered "No" must be referred to in the observations section. All questions must be answered.', M, y);
  doc.setTextColor(15,23,42); y += 6;

  const q = p.q || {};
  const ANSX = W - M - 40;
  const drawQ = (n, label, na) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
    const lines = doc.splitTextToSize(n + '.   ' + label, ANSX - M - 6);
    const h = Math.max(lines.length*3.9, 5) + 2.4;
    room(h + 2);
    const val = q['q'+n] || '';
    if(val === 'No'){
      doc.setFillColor(254,242,242); doc.rect(M-1.5, y-3.4, W - M*2 + 3, h, 'F');
      doc.setDrawColor(220,38,38); doc.setLineWidth(0.7); doc.line(M-1.5, y-3.4, M-1.5, y-3.4+h);
    }
    doc.setTextColor(15,23,42);
    doc.text(lines, M + 2, y);
    let bx = ANSX;
    ['Yes','No'].concat(na ? ['N/A'] : []).forEach(o => {
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(90,103,120);
      doc.text(o, bx, y);
      tick(bx + doc.getTextWidth(o) + 1.2, y, val === o);
      bx += doc.getTextWidth(o) + 7.5;
    });
    doc.setTextColor(15,23,42);
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.15);
    doc.line(M, y - 3.4 + h, W - M, y - 3.4 + h);
    y += h;
  };

  PIR_Q.forEach(g => {
    room(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.8); doc.setTextColor(...rgb1);
    doc.text(g.g.toUpperCase(), M, y);
    doc.setTextColor(15,23,42); y += 5;
    if(g.g === 'Distribution board(s)'){
      g.items.filter(it => it[0] < 17).forEach(it => drawQ(it[0], it[1], it[2]));
      room(12);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
      doc.text('17.   Sub circuit isolation and overcurrent device type', M + 2, y);
      opts(ANSX, y, ['Fuse','Mcb'], p.q17type);
      doc.setDrawColor(232,238,244); doc.setLineWidth(0.15); doc.line(M, y + 2.2, W - M, y + 2.2);
      y += 7.4;
      g.items.filter(it => it[0] > 17).forEach(it => drawQ(it[0], it[1], it[2]));
      room(26);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
      doc.text('20.   RCDs', M + 2, y); y += 1.5;
      doc.autoTable({
        startY: y, margin:{ left: M + 2, right: M },
        head: [['Circuit description','Tripping current (mA)','Longest tripping time (ms)']],
        body: (p.rcds||[]).length ? p.rcds.map(r => [r.desc||'', r.trip||'', r.time||'']) : [['','',''],['','','']],
        theme:'grid', styles:{ fontSize:7, cellPadding:1.6, lineColor:[210,218,228], minCellHeight:6 },
        headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7, fontStyle:'bold' },
        columnStyles:{ 1:{ cellWidth:32, halign:'center' }, 2:{ cellWidth:40, halign:'center' } },
        didParseCell: function(d){
          if(d.section === 'body' && d.column.index === 2){
            const t = parseFloat(d.cell.raw);
            if(!isNaN(t) && t > 300){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
          }
        }
      });
      y = doc.lastAutoTable.finalY + 7;
    } else {
      g.items.forEach(it => drawQ(it[0], it[1], it[2]));
      y += 3;
    }
  });

  /* ---------- summary and declaration ---------- */
  y += 4;
  sect('Summary test data');
  line('Min insulation resistance (' + MOHM + ')', p.minIR, M, y, 96);
  line('Max resistance of protective conductor (' + OHM + ')', p.maxRp, COL2, y, COL2+HALF); y += 7;
  line('Max fault loop impedance (' + OHM + ')', p.maxZs, M, y, 96);
  line('Associated device type / size', [p.zsDeviceType, p.zsDeviceSize].filter(Boolean).join(' '), COL2, y, COL2+HALF); y += 9;

  sect('Quality of workmanship');
  opts(M, y, ['Very Good','Satisfactory','Poor'], p.workmanship); y += 9;

  sect('Test instrument serial numbers');
  line('Continuity tester', p.instContinuity, M, y, 96);
  line('Insulation resistance tester', p.instIR, COL2, y, COL2+HALF); y += 7;
  line('Loop impedance tester', p.instLoop, M, y, 96);
  line('RCD tester', p.instRcd, COL2, y, COL2+HALF); y += 9;

  sect('Observations and recommendations');
  opts(M, y, ['No remedial work is required','The following observations are made'], p.noRemedial); y += 6;
  const obsRows = a.obs;
  /* Four columns: which check it came from, what was asked, what was found, and
     what is being recommended. Keeping the question in its own column means the
     reader can see at a glance which of the 28 checks failed without reading
     every finding — and an observation raised by hand simply leaves it blank. */
  doc.autoTable({
    startY: y, margin:{ left:M, right:M },
    head: [['Ref','Question','What was found','Recommendation']],
    body: obsRows.length ? obsRows.map((o,i) => [
                             o.ref || String(i+1),
                             o.qn ? 'Q' + o.qn + '.  ' + (Q_TEXT[o.qn] || '') : '',
                             o.comment || '',
                             '(' + o.code + ')  ' + (PIR_CODES[o.code]||'')])
                         : [['','','',''],['','','',''],['','','','']],
    theme:'grid', styles:{ fontSize:7.2, cellPadding:1.8, lineColor:[210,218,228], minCellHeight:7, valign:'top' },
    headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7.2, fontStyle:'bold', valign:'middle' },
    columnStyles:{ 0:{ cellWidth:11, halign:'center' }, 1:{ cellWidth:56 }, 3:{ cellWidth:44 } },
    didParseCell: function(d){
      if(d.section !== 'body') return;
      if(d.column.index === 1){ d.cell.styles.textColor = [95,108,125]; d.cell.styles.fontSize = 6.8; }
      if(d.column.index === 3 && String(d.cell.raw).indexOf('(1)') === 0){
        d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold';
      }
    }
  });
  y = doc.lastAutoTable.finalY + 4;

  doc.setFontSize(6.6); doc.setTextColor(100,116,139);
  doc.text('Each observation is given one of the following numbers to indicate the action recommended:', M, y); y += 3.3;
  doc.text('(1) Requires urgent attention     (2) Requires improvements     (3) Requires some attention     (4) Does not comply with current National Rules for Electrical Installations.', M, y); y += 3.3;
  doc.text('Using (4) does not necessarily imply that the electrical installation inspected is unsafe.', M, y); y += 6;
  doc.setTextColor(15,23,42);

  if(a.urgent.length){
    room(11);
    doc.setFillColor(220,38,38); doc.rect(M, y-4, W - M*2, 7.5, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
    doc.text('URGENT ATTENTION REQUIRED. The person responsible for the installation must be notified without delay.', M + 3, y + 0.8);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); y += 11;
  }

  doc.setFontSize(7.4);
  const rec = doc.splitTextToSize('On the basis that all observations requiring urgent attention have been completed without delay, we recommend that this installation is further inspected and tested after an interval of not more than ' +
    (p.intervalValue || '____') + ' ' + (p.intervalUnit || 'years') + '.', W - M*2);
  room(rec.length*4 + 6);
  doc.text(rec, M, y); y += rec.length*4 + 5;

  sect('Overall condition of the installation');
  opts(M, y, ['Satisfactory','Unsatisfactory'], a.condition); y += 12;

  sect('Declaration');
  doc.setFontSize(6.8); doc.setTextColor(100,116,139);
  const dec = doc.splitTextToSize('I/We are responsible for the inspection and testing of the electrical installation described in this report, and confirm to the best of my/our knowledge that the tests and observations recorded represent an accurate assessment, within the limits specified, of the condition of the electrical installation.', W - M*2);
  doc.text(dec, M, y); y += dec.length*3.2 + 6;
  doc.setTextColor(15,23,42);

  const sg = job.sig || {};
  room(26);
  if(sg.sig){ try{ doc.addImage(sg.sig, 'PNG', M + 2, y - 1, 44, 15); }catch(e){} }
  const sy = y + 16;
  doc.setDrawColor(150,163,180); doc.setLineWidth(0.25);
  doc.line(M, sy, M + 62, sy);
  doc.line(M + 70, sy, M + 124, sy);
  doc.line(M + 132, sy, W - M, sy);
  doc.setFontSize(7.4); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
  doc.text((sg.name || '').toUpperCase(), M + 2, sy - 2);
  doc.text(p.certifierNo || '', M + 72, sy - 2);
  doc.text(fmtDate(sg.date || job.date), M + 134, sy - 2);
  doc.setFontSize(6.6); doc.setFont('helvetica','normal'); doc.setTextColor(120,133,150);
  doc.text('Inspected and tested by (signed)', M, sy + 3.6);
  doc.text('Certifier No.', M + 70, sy + 3.6);
  doc.text('Date', M + 132, sy + 3.6);

  /* ---------- photos ----------
     Grouped under the observation they are evidence for. A page of unlabelled
     photographs at the back of a report is worth very little; the same photos
     sitting under "Observation 2 — requires urgent attention" are the argument
     for doing the work. */
  const pics = (job.photos || []).filter(ph => ph.data);
  if(pics.length){
    const drawRow = (list) => {
      let px = M, rowH = 0;
      list.forEach(ph => {
        const w = 60, h = 45;
        if(px + w > W - M){ px = M; y += rowH + 10; rowH = 0; }
        room(h + 14);
        try{ doc.addImage(ph.data, 'JPEG', px, y, w, h, undefined, 'FAST'); }catch(e){}
        if(ph.caption){
          doc.setFontSize(6.6); doc.setTextColor(100,116,139);
          doc.text(doc.splitTextToSize(ph.caption, w).slice(0,2), px, y + h + 3.5);
          doc.setTextColor(15,23,42);
        }
        rowH = Math.max(rowH, h + 6);
        px += w + 5;
      });
      y += rowH + 8;
    };

    y += 6;
    room(70);          /* only break if a row of photos will not fit */
    sect('Photographs');

    a.obs.forEach((o, i) => {
      const mine = pics.filter(ph => ph.obsId === o.id);
      if(!mine.length) return;
      room(58);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
      doc.setTextColor(o.code === '1' ? 185 : 15, o.code === '1' ? 28 : 23, o.code === '1' ? 28 : 42);
      doc.text('Observation ' + (o.ref || (i + 1)) +
               (o.qn ? '  ·  Q' + o.qn : '') +
               '  ·  (' + o.code + ') ' + (PIR_CODES[o.code] || ''), M, y);
      doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
      y += 3.2;
      /* The question, then the finding — the same two lines as the table above,
         so a photograph is never floating free of what it is evidence for. */
      if(o.qn){
        doc.setFontSize(6.4); doc.setTextColor(130,142,158);
        doc.text(doc.splitTextToSize('Q' + o.qn + '.  ' + (Q_TEXT[o.qn] || ''), W - M*2).slice(0,1), M, y);
        y += 3;
      }
      doc.setFontSize(6.8); doc.setTextColor(100,116,139);
      const cl = doc.splitTextToSize(o.comment || '', W - M*2);
      doc.text(cl.slice(0,2), M, y);
      doc.setTextColor(15,23,42);
      y += Math.min(cl.length, 2) * 3.2 + 2.5;
      drawRow(mine);
    });

    const loose = pics.filter(ph => !ph.obsId || !a.obs.some(o => o.id === ph.obsId));
    if(loose.length){
      room(58);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
      doc.text('General', M, y);
      doc.setFont('helvetica','normal');
      y += 4;
      drawRow(loose);
    }
  }

  /* ---------- page furniture ---------- */
  const total = doc.internal.getNumberOfPages();
  for(let i=1; i<=total; i++){
    doc.setPage(i);
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.25);
    doc.line(M, 279, W - M, 279);
    const mw = footerMark(doc, settings, M, 280.5, 12);
    const fx = M + (mw ? mw + 3.5 : 0);
    doc.setFontSize(6.4); doc.setFont('helvetica','normal'); doc.setTextColor(140,152,168);
    if(settings.disclaimer !== false){
      doc.text('This report is issued for record purposes. The official Safe Electric Periodic Inspection Report must still be completed and submitted.', fx, 285);
    }
    doc.setFontSize(6.2);
    doc.text([settings.address, settings.phone, settings.email].filter(Boolean).join('   ·   '), fx, 289.5);
    doc.setTextColor(100,116,139); doc.setFont('helvetica','bold'); doc.setFontSize(6.8);
    doc.text('Page ' + i + ' of ' + total, W - M, 285, { align:'right' });
  }

  stampWatermarks(doc, { draft: !a.complete });
  if(save) doc.save((!a.complete ? 'DRAFT-' : '') + 'PIR-' + safeName(job.customerName) + '-' + (job.date || todayInput()) + '.pdf');
  return doc;
}


/* ================= TEST RECORD PDF =================
   Landscape, because a circuit schedule is a wide table and folding it into a
   portrait column is how these end up unreadable. Same banner, same section
   furniture and same colours as the periodic report, so the two look like they
   came out of the same office. */
function buildTestPdf(job, settings, save=true){
  const doc = new jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'landscape', compress:true });
  const W = 297, M = 12, BOT = 182;
  const t = job.test || {};
  const p = job.pir || {};
  const a = audit(job);
  const cs = t.circuits || [];
  const rgb1 = hexToRgb(settings.c1);
  const rgb2 = hexToRgb(settings.c2);
  const onC1 = textOn(settings.c1) === '#ffffff' ? [255,255,255] : [15,23,42];
  const OHM = 'ohms', MOHM = 'Mohms';

  let firstPage = true;
  const head = () => {
    const stops = brandStops(settings);
    if(firstPage){
      firstPage = false;
      gradBand(doc, 0, 0, W, 22, stops);
      let tx = M;
      /* The knockout sits directly on the band. Only a build with no white
         version falls back to a plate. */
      const bannerLogo = settings.logoLight || settings.logo;
      if(bannerLogo){
        try{
          const pr = doc.getImageProperties(bannerLogo);
          const fit = fitBox(pr.width, pr.height, 15, 16);
          const ly = (22 - fit.h)/2;
          if(!settings.logoLight && settings.logoBox !== false){
            doc.setFillColor(255,255,255);
            doc.roundedRect(M - 2, ly - 2, fit.w + 4, fit.h + 4, 2, 2, 'F');
          }
          doc.addImage(bannerLogo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, ly, fit.w, fit.h, undefined, 'FAST');
          tx = M + fit.w + 7;
        }catch(e){}
      }
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
      doc.text('ELECTRICAL INSTALLATION TEST RECORD', tx, 10.6);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
      doc.text([settings.companyName, settings.regNo && ('Reg ' + settings.regNo)].filter(Boolean).join('   ·   '), tx, 15.4);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.2);
      doc.text(job.prNo || '', W - M, 10.6, { align:'right' });
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
      doc.text(fmtDate(job.date), W - M, 15.4, { align:'right' });
      doc.setTextColor(15,23,42);
      return 29;
    }
    gradBand(doc, 0, 0, W, 4, stops);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(120,133,150);
    doc.text((settings.companyName || '').toUpperCase() + '   ·   ELECTRICAL INSTALLATION TEST RECORD', M, 9);
    doc.text([job.prNo, fmtDate(job.date)].filter(Boolean).join('   ·   '), W - M, 9, { align:'right' });
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.2); doc.line(M, 11.5, W - M, 11.5);
    doc.setTextColor(15,23,42);
    return 18;
  };

  let y = head();
  const room = (need) => { if(y + need > BOT){ doc.addPage(); y = head(); } };

  /* At-a-glance strip, same idea as the periodic report. */
  const badge = a.condition === 'Unsatisfactory' ? [220,38,38] : a.condition === 'Satisfactory' ? [5,150,105] : [148,163,184];
  doc.setFillColor(248,250,252); doc.roundedRect(M, y - 3, W - M*2, 17, 2, 2, 'F');
  doc.setFillColor(badge[0],badge[1],badge[2]); doc.rect(M, y - 3, 1.6, 17, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(15,23,42);
  doc.text(doc.splitTextToSize(job.customerName || 'Site', 140)[0], M + 5, y + 3);
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(100,116,139);
  doc.text(doc.splitTextToSize([job.address, t.dbRef && ('Board ' + t.dbRef)].filter(Boolean).join('   ·   '), 140)[0], M + 5, y + 8);
  [
    ['RESULT', a.condition === 'Unsatisfactory' ? 'Fail' : a.condition === 'Satisfactory' ? 'Pass' : 'Incomplete', badge],
    ['CIRCUITS', String(cs.length), [15,23,42]],
    ['FULLY TESTED', a.answered + ' of ' + cs.length, [15,23,42]],
    ['FAILED', String(a.urgent.length), a.urgent.length ? [220,38,38] : [15,23,42]]
  ].forEach((f, i) => {
    const fx = M + 158 + i*30;
    doc.setFont('helvetica','bold'); doc.setFontSize(5.2); doc.setTextColor(148,163,184);
    doc.text(f[0], fx, y + 1);
    doc.setFontSize(6.8); doc.setTextColor(f[2][0], f[2][1], f[2][2]);
    doc.text(doc.splitTextToSize(String(f[1]), 29), fx, y + 5.5);
  });
  doc.setTextColor(15,23,42);
  y += 21;

  const sect = (title) => {
    room(12);
    doc.setFillColor(240,244,248); doc.rect(M, y - 4.2, W - M*2, 6.4, 'F');
    doc.setFillColor(rgb2[0],rgb2[1],rgb2[2]); doc.rect(M, y - 4.2, 1.6, 6.4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(rgb1[0],rgb1[1],rgb1[2]);
    doc.text(title.toUpperCase(), M + 4, y);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    y += 8;
  };
  const line = (label, val, x, yy, w) => {
    doc.setFontSize(7.2); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
    doc.text(label, x, yy);
    const lw = doc.getTextWidth(label);
    doc.setDrawColor(210,218,228); doc.setLineWidth(0.2);
    doc.line(x + lw + 2, yy + 0.9, x + w, yy + 0.9);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    doc.text(String(val || ''), x + lw + 3.5, yy);
    doc.setFont('helvetica','normal');
  };
  /* Three columns across the landscape page. */
  const CW = (W - M*2 - 12) / 3;
  const CX = [M, M + CW + 6, M + (CW + 6)*2];
  const row3 = (a1, a2, a3) => {
    [a1, a2, a3].forEach((f, i) => { if(f) line(f[0], f[1], CX[i], y, CX[i] + CW); });
    y += 7;
  };

  const grid = (head, body, opts) => {
    room(20);
    doc.autoTable(Object.assign({
      startY: y, margin:{ left:M, right:M },
      head: [head], body: body,
      theme:'grid',
      styles:{ fontSize:6.6, cellPadding:1.4, lineColor:[214,222,232], overflow:'linebreak', valign:'middle' },
      headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:6.4, fontStyle:'bold', halign:'center' },
      didDrawPage: function(){ /* keep the running header on continuation pages */ }
    }, opts || {}));
    y = doc.lastAutoTable.finalY + 7;
  };

  sect('Registered contractor');
  row3(['Name', settings.companyName], ['Reg No.', settings.regNo], ['Phone', settings.phone]);
  row3(['Address', settings.address], ['Email', settings.email], ['Cert No.', t.certNo]);
  y += 2;

  sect('Installation');
  row3(['Customer', job.customerName], ['Category', p.category], ['Type of work', t.installType]);
  row3(['Address', job.address], ['Board ref', t.dbRef], ['MPRN', t.mprn]);
  row3(['Contact', [job.phone, job.email].filter(Boolean).join('  ')], ['Seal No.', t.sealNo], ['Max demand (A)', t.maxDemand]);
  if(t.supplyChar || (job.lat && job.lng)){
    row3(['Supply characteristic', t.supplyChar], (job.lat && job.lng) ? ['Location', job.lat + ', ' + job.lng] : null, null);
  }
  y += 2;

  sect('Supply characteristics, earthing and bonding');
  row3(['System earthing', p.earthing], ['Installation voltage', p.phase], ['Max prospective S/C current (A)', p.pscc]);
  const volts = [['L1',p.v1],['L2',p.v2],['L3',p.v3],['L1-L2',p.v12],['L2-L3',p.v23],['L3-L1',p.v31]].filter(v => v[1]);
  if(volts.length){
    let vx = M;
    volts.forEach(v => { line(v[0], v[1] + ' V', vx, y, vx + 30); vx += 36; });
    y += 7;
  }
  row3(['Main isolation device', p.mainIsolation], ['Nominal rating (A)', p.nominalRating],
       ['Main RCD', [p.mainRcdIn && p.mainRcdIn + ' A', p.mainRcdIdn && p.mainRcdIdn + ' mA'].filter(Boolean).join(' / ')]);
  const b = t.bonding || {};
  row3(['Bonding - gas', b.gas], ['Bonding - water', b.water], ['Supplementary bonding', b.supp]);
  row3(['Electrode earthing conductor', b.electrode],
       ['Other bonding', [b.other, b.otherDetails].filter(Boolean).join(' - ')],
       ['Max Rp+Re / Re (' + OHM + ')', [t.maxRpRe, t.maxRe].filter(Boolean).join(' / ')]);
  y += 2;

  const insRows = (t.instruments || []).filter(i => i.make || i.model || i.serial || i.calExpiry);
  if(insRows.length){
    sect('Test instruments');
    grid(['Instrument','Make / model','Serial no.','Calibration expiry'],
      insRows.map(i => [i.use, [i.make, i.model].filter(Boolean).join(' '), i.serial || '', i.calExpiry ? fmtDate(i.calExpiry) : '']),
      { columnStyles:{ 0:{ cellWidth:70 }, 1:{ cellWidth:70 }, 2:{ cellWidth:50 }, 3:{ cellWidth:45, halign:'center' } },
        didParseCell: function(d){
          if(d.section === 'body' && d.column.index === 3 && insRows[d.row.index] && insRows[d.row.index].calExpiry &&
             insRows[d.row.index].calExpiry < (job.date || '')){
            d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold';
          }
        } });
  }

  sect('Circuit schedule');
  grid(['No','Circuit designation','Cable type','mm2','Points','Device','Type','Rating (A)','Notes'],
    cs.map(c => [c.number, c.designation, c.cableType, c.cableSize, c.points, c.device, c.deviceType, c.amps, c.notes]),
    { columnStyles:{ 0:{ cellWidth:10, halign:'center' }, 1:{ cellWidth:58 }, 2:{ cellWidth:30 }, 3:{ cellWidth:14, halign:'center' },
                     4:{ cellWidth:14, halign:'center' }, 5:{ cellWidth:24 }, 6:{ cellWidth:14, halign:'center' },
                     7:{ cellWidth:18, halign:'center' } } });

  /* The two testing tables carry the colour of their tab in the app, so the
     paper and the screen agree about which half of the job you are looking at. */
  sect('Pre-connection testing (dead)');
  grid(['No','Designation','Rp+Re','Re','L-L','N-N','E-E','Ph&N-E','Ph-N','Ph-Ph','Err','Pol','Result','Comments'],
    cs.map(c => [c.number, c.designation, c.pre.rpre, c.pre.re, c.pre.ll, c.pre.nn, c.pre.ee,
                 c.pre.irPNE, c.pre.irPN, c.pre.ir3ph, c.pre.erroneous ? 'X' : '', c.pre.polarity ? 'X' : '', c.pre.pass, c.pre.comments]),
    { headStyles:{ fillColor: hexToRgb(settings.c2), textColor:[255,255,255], fontSize:6.2, fontStyle:'bold', halign:'center' },
      columnStyles:{ 0:{ cellWidth:9, halign:'center' }, 1:{ cellWidth:40 }, 2:{ cellWidth:15, halign:'center' }, 3:{ cellWidth:13, halign:'center' },
                     4:{ cellWidth:13, halign:'center' }, 5:{ cellWidth:13, halign:'center' }, 6:{ cellWidth:13, halign:'center' },
                     7:{ cellWidth:16, halign:'center' }, 8:{ cellWidth:14, halign:'center' }, 9:{ cellWidth:14, halign:'center' },
                     10:{ cellWidth:9, halign:'center' }, 11:{ cellWidth:9, halign:'center' }, 12:{ cellWidth:16, halign:'center' } },
      didParseCell: function(d){
        if(d.section !== 'body') return;
        if(d.column.index === 12 && String(d.cell.raw) === 'Fail'){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
        if(d.column.index >= 7 && d.column.index <= 9){
          const n = parseFloat(String(d.cell.raw || '').replace(/[^0-9.]/g,''));
          if(!isNaN(n) && n < 1){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
        }
      } });
  doc.setFontSize(6.2); doc.setTextColor(120,133,150);
  doc.text('Continuity and ring end-to-end values in ' + OHM + '. Insulation resistance in ' + MOHM + '; anything under 1 ' + MOHM + ' is shown in red.', M, y - 3.5);
  doc.setTextColor(15,23,42);

  sect('Post-connection testing (live)');
  grid(['No','Designation','Max Zs','Zs','PFC kA','1/2 IdN','1 IdN','5 IdN','Btn','Pol','Func','Result','Comments'],
    cs.map(c => [c.number, c.designation, c.post.maxZs, c.post.zs, c.post.pfc, c.post.rcdHalf, c.post.rcd1, c.post.rcd5,
                 c.post.testBtn ? 'X' : '', c.post.polarity ? 'X' : '', c.post.functional ? 'X' : '', c.post.pass, c.post.comments]),
    { headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:6.2, fontStyle:'bold', halign:'center' },
      columnStyles:{ 0:{ cellWidth:9, halign:'center' }, 1:{ cellWidth:40 }, 2:{ cellWidth:16, halign:'center' }, 3:{ cellWidth:15, halign:'center' },
                     4:{ cellWidth:15, halign:'center' }, 5:{ cellWidth:14, halign:'center' }, 6:{ cellWidth:13, halign:'center' },
                     7:{ cellWidth:13, halign:'center' }, 8:{ cellWidth:9, halign:'center' }, 9:{ cellWidth:9, halign:'center' },
                     10:{ cellWidth:10, halign:'center' }, 11:{ cellWidth:16, halign:'center' } },
      didParseCell: function(d){
        if(d.section !== 'body') return;
        const c = cs[d.row.index];
        if(d.column.index === 11 && String(d.cell.raw) === 'Fail'){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
        if(d.column.index === 3 && c){
          const lim = parseFloat(c.post.maxZs || MAXZS[(c.deviceType||'') + (c.amps||'')] || NaN);
          const n = parseFloat(String(d.cell.raw || '').replace(/[^0-9.]/g,''));
          if(!isNaN(n) && !isNaN(lim) && n > lim){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
        }
        if(d.column.index === 6){
          const n = parseFloat(String(d.cell.raw || '').replace(/[^0-9.]/g,''));
          if(!isNaN(n) && n > 300){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
        }
      } });
  doc.setFontSize(6.2); doc.setTextColor(120,133,150);
  doc.text('Loop impedance in ' + OHM + '. RCD operating times in ms; a 1 x IdN time over 300 ms is shown in red.', M, y - 3.5);
  doc.setTextColor(15,23,42);

  if(a.urgent.length){
    room(11);
    doc.setFillColor(220,38,38); doc.rect(M, y-4, W - M*2, 7.5, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
    doc.text('CIRCUIT' + (a.urgent.length === 1 ? '' : 'S') + ' ' + a.urgent.map(c => c.number).join(', ') +
             ' FAILED. The person responsible for the installation must be notified before it is put into service.', M + 3, y + 0.8);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); y += 11;
  }

  const notes = [['General', (t.notes||{}).general], ['Observations', (t.notes||{}).observations],
                 ['Recommendations', (t.notes||{}).recommendations], ['Work remaining', (t.notes||{}).completion]].filter(n => n[1]);
  if(notes.length){
    sect('Notes');
    grid(['','Note'], notes, { showHead:false,
      columnStyles:{ 0:{ cellWidth:40, fontStyle:'bold', fillColor:[241,245,249] } }, styles:{ fontSize:7, cellPadding:1.8, lineColor:[214,222,232] } });
  }

  sect('Declaration');
  doc.setFontSize(6.8); doc.setTextColor(100,116,139);
  const dec = doc.splitTextToSize('I/We are responsible for the inspection, testing and construction of the electrical installation described in this record, and certify that the work covered by it has been designed, constructed, inspected and tested to the best of my/our knowledge and belief in accordance with the National Rules for Electrical Installations.', W - M*2);
  room(dec.length*3.2 + 32);
  doc.text(dec, M, y); y += dec.length*3.2 + 6;
  doc.setTextColor(15,23,42);

  /* Pre-connection signature on the left where one was taken, final on the
     right. They are different promises made at different times. */
  const sg = job.sig || {}, sp = t.sigPre || {};
  const sigBlock = (x, w, label, sig, name, dateStr) => {
    if(sig){ try{ doc.addImage(sig, 'PNG', x + 2, y - 1, Math.min(50, w - 6), 15); }catch(e){} }
    const sy = y + 16;
    doc.setDrawColor(150,163,180); doc.setLineWidth(0.25);
    doc.line(x, sy, x + w, sy);
    doc.setFontSize(7.4); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
    doc.text(String(name || '').toUpperCase(), x + 2, sy - 2);
    doc.setFontSize(6.6); doc.setFont('helvetica','normal'); doc.setTextColor(120,133,150);
    doc.text(label, x, sy + 3.6);
    doc.text(fmtDate(dateStr) || '', x + w, sy + 3.6, { align:'right' });
    doc.setTextColor(15,23,42);
  };
  const halfW = (W - M*2 - 20) / 2;
  if(sp.sig || sp.name) sigBlock(M, halfW, 'Pre-connection tests, signed', sp.sig, sp.name, sp.date || job.date);
  sigBlock(M + halfW + 20, halfW, 'Inspected and tested by (signed)' + (p.certifierNo ? '   ·   Certifier No. ' + p.certifierNo : ''),
           sg.sig, sg.name || job.inspector, sg.date || job.date);
  y += 26;

  const pics = (job.photos || []).filter(ph => ph.data);
  if(pics.length){
    y += 4;
    room(70);
    sect('Photographs');
    let px = M, rowH = 0;
    pics.forEach(ph => {
      const w = 60, h = 45;
      if(px + w > W - M){ px = M; y += rowH + 10; rowH = 0; }
      room(h + 14);
      try{ doc.addImage(ph.data, 'JPEG', px, y, w, h, undefined, 'FAST'); }catch(e){}
      doc.setFontSize(6.6); doc.setTextColor(100,116,139);
      doc.text(doc.splitTextToSize(ph.caption || '', w).slice(0,2), px, y + h + 3.5);
      doc.setTextColor(15,23,42);
      rowH = Math.max(rowH, h + 6);
      px += w + 5;
    });
  }

  const total = doc.internal.getNumberOfPages();
  for(let i = 1; i <= total; i++){
    doc.setPage(i);
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.25);
    doc.line(M, 192, W - M, 192);
    const mw = footerMark(doc, settings, M, 193.5, 12);
    const fx = M + (mw ? mw + 3.5 : 0);
    doc.setFontSize(6.4); doc.setFont('helvetica','normal'); doc.setTextColor(140,152,168);
    if(settings.disclaimer !== false){
      doc.text('This record is issued for record purposes. The official Safe Electric certificate must still be completed and submitted.', fx, 198);
    }
    doc.setFontSize(6.2);
    doc.text([settings.address, settings.phone, settings.email].filter(Boolean).join('   ·   '), fx, 202.5);
    doc.setTextColor(100,116,139); doc.setFont('helvetica','bold'); doc.setFontSize(6.8);
    doc.text('Page ' + i + ' of ' + total, W - M, 198, { align:'right' });
  }

  stampWatermarks(doc, { draft: !a.complete, landscape:true });
  if(save) doc.save((!a.complete ? 'DRAFT-' : '') + 'TEST-' + safeName(job.customerName) + '-' + (job.date || todayInput()) + '.pdf');
  return doc;
}

/* One entry point, so nothing in the app has to know which builder to call. */
function buildRecordPdf(job, settings, save=true){
  return kindOf(job) === 'test' ? buildTestPdf(job, settings, save) : buildPirPdf(job, settings, save);
}

/* ================= SEND TO THE OFFICE ================= */
/* Best route by a distance: hand the PDF to Apps Script and let the server send
   it, attachment and all. It behaves the same on every phone, needs no share
   sheet, and leaves a record in the Log tab. The share sheet and mailto paths
   below are only the fallback for a device with no access code or no signal. */
async function emailViaServer(job, settings, blob){
  const b64 = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
  return API.call('emailReport', {
    subject: mailSubject(job),
    body: mailBody(job, settings),
    filename: mailFilename(job),
    fromName: settings.companyName || 'Periodic Inspections',
    pdfBase64: b64
  });
}

function mailSubject(job){
  const a = audit(job);
  return (a.complete ? '' : '[DRAFT] ')
    + KINDS[kindOf(job)].label + ' · ' + (job.customerName || 'site') + (job.prNo ? ' · ' + job.prNo : '');
}
function mailBody(job, settings){
  const a = audit(job);
  const isTest = kindOf(job) === 'test';
  return [
    KINDS[kindOf(job)].label,
    'Site: ' + (job.customerName || ''),
    'Address: ' + (job.address || ''),
    (job.lat && job.lng) ? 'Location: ' + job.lat + ', ' + job.lng : '',
    'Date: ' + fmtDate(job.date),
    (isTest ? 'Tested by: ' : 'Inspector: ') + (job.inspector || (job.sig||{}).name || ''),
    isTest
      ? 'Result: ' + (a.condition === 'Unsatisfactory' ? 'Fail' : a.condition === 'Satisfactory' ? 'Pass' : 'not complete')
      : 'Condition: ' + (a.condition || 'not recorded'),
    isTest
      ? 'Circuits: ' + a.total + ' (' + a.answered + ' fully tested' + (a.urgent.length ? ', ' + a.urgent.length + ' failed' : '') + ')'
      : 'Observations: ' + a.obs.length + (a.urgent.length ? ' (' + a.urgent.length + ' requiring urgent attention)' : ''),
    isTest ? '' : 'Next due: ' + (fmtDate(addInterval(job.date, (job.pir||{}).intervalValue, (job.pir||{}).intervalUnit)) || 'not set'),
    '',
    a.complete ? '' : 'NOTE: this is a DRAFT — the record is not signed off yet.',
    '',
    'Sent from the ' + (settings.companyName || '') + ' records app.'
  ].filter(Boolean).join('\n');
}
function mailFilename(job){
  const a = audit(job);
  return (!a.complete ? 'DRAFT-' : '') + (kindOf(job) === 'test' ? 'TEST-' : 'PIR-') + safeName(job.customerName) + '.pdf';
}

async function emailToOffice(job, settings, toast){
  const office = (settings.officeEmail || '').trim();
  const subject = mailSubject(job);
  const body = mailBody(job, settings);
  const fname = mailFilename(job);
  const blob = buildRecordPdf(job, settings, false).output('blob');

  /* Preferred path: the server sends it, with the PDF really attached. */
  if(API.on){
    try{
      const res = await emailViaServer(job, settings, blob);
      toast('Emailed to the office' + (res && res.to ? ' (' + res.to + ')' : ''));
      return;
    }catch(e){
      toast('Server send failed — falling back');
    }
  }

  try{
    const file = new File([blob], fname, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: subject, text: body });
      toast('Shared');
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;   /* user closed the share sheet */
  }

  downloadBlob(blob, fname);
  window.location.href = 'mailto:' + encodeURIComponent(office)
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body + '\n\nThe PDF has just been saved to this device — attach it to this email.');
  toast('PDF saved — attach it to the email');
}

/* ================= EXCEL EXPORT ================= */
async function buildJobsExcel(jobs, settings){
  const wb = new ExcelJS.Workbook();
  wb.creator = settings.companyName || 'IFES Electrical Services Ltd.';
  const head1 = argb(settings.c1), head2 = argb(settings.c2);

  const styleHeader = (ws, row, cols) => {
    const r = ws.getRow(row);
    r.font = { bold:true, color:{ argb:'FFFFFFFF' }, size:10 };
    r.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: head1 } };
    r.height = 20;
    r.alignment = { vertical:'middle' };
    ws.autoFilter = { from:{ row:row, column:1 }, to:{ row:row, column:cols } };
    ws.views = [{ state:'frozen', ySplit: row }];
  };
  const banner = (ws, title, cols) => {
    ws.mergeCells(1, 1, 1, cols);
    const c = ws.getCell(1,1);
    c.value = title + '   |   ' + (settings.companyName || '');
    c.font = { bold:true, size:12, color:{ argb:'FFFFFFFF' } };
    c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: head2 } };
    c.alignment = { vertical:'middle', horizontal:'left', indent:1 };
    ws.getRow(1).height = 24;
  };

  const periodics = jobs.filter(j => kindOf(j) === 'periodic');
  const tests = jobs.filter(j => kindOf(j) === 'test');

  /* --- Test records --- */
  if(tests.length){
    const wt = wb.addWorksheet('Test records');
    const tcols = ['Record No','Date','Site / customer','Address','Category','Type of work','Board ref','Tested by',
                   'Result','Circuits','Fully tested','Failed','Cert No','MPRN','Signed'];
    banner(wt, 'Electrical installation test records', tcols.length);
    wt.addRow([]); wt.addRow(tcols);
    styleHeader(wt, 3, tcols.length);
    tests.forEach(j => {
      const a = audit(j), t = j.test || {}, p = j.pir || {};
      wt.addRow([
        j.prNo || '', j.date || '', j.customerName || '', j.address || '',
        p.category || '', t.installType || '', t.dbRef || '', j.inspector || (j.sig||{}).name || '',
        a.condition === 'Unsatisfactory' ? 'Fail' : a.condition === 'Satisfactory' ? 'Pass' : 'Incomplete',
        a.total, a.answered, a.urgent.length, t.certNo || '', t.mprn || '',
        (j.sig||{}).sig ? 'Yes' : 'No'
      ]);
    });
    wt.columns.forEach((c, i) => { c.width = [12,12,26,34,13,18,11,18,12,9,12,8,12,14,8][i] || 14; });
    wt.eachRow((row, n) => {
      if(n < 4) return;
      if(String(row.getCell(9).value) === 'Fail') row.getCell(9).font = { bold:true, color:{ argb:'FFB91C1C' } };
      if(Number(row.getCell(12).value) > 0) row.getCell(12).font = { bold:true, color:{ argb:'FFB91C1C' } };
    });

    /* --- Circuits: every reading, one row per circuit --- */
    const wc = wb.addWorksheet('Circuits');
    const ccols = ['Record No','Date','Site / customer','Board','Circuit','Designation','Cable','mm2','Points','Device','Type','Rating A',
                   'Rp+Re','Re','L-L','N-N','E-E','IR Ph&N-E','IR Ph-N','IR Ph-Ph','Pre result','Pre comments',
                   'Max Zs','Zs','PFC kA','RCD 1/2','RCD 1x','RCD 5x','Post result','Post comments'];
    banner(wc, 'Circuit readings', ccols.length);
    wc.addRow([]); wc.addRow(ccols);
    styleHeader(wc, 3, ccols.length);
    tests.forEach(j => {
      const t = j.test || {};
      (t.circuits || []).forEach(c => {
        wc.addRow([
          j.prNo || '', j.date || '', j.customerName || '', t.dbRef || '',
          c.number, c.designation, c.cableType, c.cableSize, c.points, c.device, c.deviceType, c.amps,
          c.pre.rpre, c.pre.re, c.pre.ll, c.pre.nn, c.pre.ee, c.pre.irPNE, c.pre.irPN, c.pre.ir3ph, c.pre.pass, c.pre.comments,
          c.post.maxZs, c.post.zs, c.post.pfc, c.post.rcdHalf, c.post.rcd1, c.post.rcd5, c.post.pass, c.post.comments
        ]);
      });
    });
    wc.columns.forEach((c, i) => { c.width = i < 3 ? [12,12,24][i] : (i === 5 ? 26 : (i === 21 || i === 29 ? 30 : 10)); });
    wc.eachRow((row, n) => {
      if(n < 4) return;
      [21, 29].forEach(col => { if(String(row.getCell(col).value) === 'Fail') row.getCell(col).font = { bold:true, color:{ argb:'FFB91C1C' } }; });
    });
  }

  if(!periodics.length){
    const buf0 = await wb.xlsx.writeBuffer();
    return new Blob([buf0], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  /* --- Inspections --- */
  const ws = wb.addWorksheet('Inspections');
  const cols = ['PR No','Date','Site / customer','Address','Category','Reason','Inspector',
                'Condition','Observations','Urgent (C1)','Questions answered','Next due','Signed'];
  banner(ws, 'Periodic inspections', cols.length);
  ws.addRow([]);
  ws.addRow(cols);
  styleHeader(ws, 3, cols.length);
  periodics.forEach(j => {
    const a = audit(j), p = j.pir || {};
    ws.addRow([
      j.prNo || '', j.date || '', j.customerName || '', j.address || '',
      p.category || '', p.reason || '', j.inspector || (j.sig||{}).name || '',
      a.condition || '', a.obs.length, a.urgent.length,
      a.answered + ' of ' + a.total,
      addInterval(j.date, p.intervalValue, p.intervalUnit),
      (j.sig||{}).sig ? 'Yes' : 'No'
    ]);
  });
  ws.columns.forEach((c, i) => { c.width = [10,12,26,34,14,20,18,14,13,12,18,12,9][i] || 14; });
  ws.eachRow((row, n) => {
    if(n < 4) return;
    if(String(row.getCell(8).value) === 'Unsatisfactory'){
      row.getCell(8).font = { bold:true, color:{ argb:'FFB91C1C' } };
    }
    if(Number(row.getCell(10).value) > 0){
      row.getCell(10).font = { bold:true, color:{ argb:'FFB91C1C' } };
    }
  });

  /* --- Observations --- */
  const wo = wb.addWorksheet('Observations');
  const ocols = ['Date','Site / customer','Ref','Observation','Code','Meaning'];
  banner(wo, 'Observations and recommendations', ocols.length);
  wo.addRow([]); wo.addRow(ocols);
  styleHeader(wo, 3, ocols.length);
  periodics.forEach(j => {
    ((j.pir||{}).obs || []).filter(o => (o.comment||'').trim()).forEach((o, i) => {
      wo.addRow([j.date || '', j.customerName || '', o.ref || String(i+1), o.comment, o.code, PIR_CODES[o.code] || '']);
    });
  });
  wo.columns.forEach((c, i) => { c.width = [12,26,8,60,7,34][i] || 14; });
  wo.eachRow((row, n) => { if(n > 3 && String(row.getCell(5).value) === '1'){ row.font = { bold:true, color:{ argb:'FFB91C1C' } }; } });

  /* --- Question results --- */
  const wq = wb.addWorksheet('Question results');
  const qnums = pirQFlat();
  const qcols = ['Date','Site / customer'].concat(qnums.map(n => 'Q' + n));
  banner(wq, 'Answers to every question', qcols.length);
  wq.addRow([]); wq.addRow(qcols);
  styleHeader(wq, 3, qcols.length);
  periodics.forEach(j => {
    const q = (j.pir||{}).q || {};
    wq.addRow([j.date || '', j.customerName || ''].concat(qnums.map(n => q['q'+n] || '')));
  });
  wq.getColumn(1).width = 12; wq.getColumn(2).width = 26;
  qnums.forEach((n, i) => { wq.getColumn(i + 3).width = 6; });
  wq.eachRow((row, rn) => {
    if(rn < 4) return;
    row.eachCell((cell, cn) => { if(cn > 2 && cell.value === 'No'){ cell.font = { bold:true, color:{ argb:'FFB91C1C' } }; } });
  });

  /* --- Question key --- */
  const wk = wb.addWorksheet('Question key');
  banner(wk, 'What each question number means', 2);
  wk.addRow([]); wk.addRow(['Question','Text']);
  styleHeader(wk, 3, 2);
  qnums.forEach(n => wk.addRow(['Q' + n, Q_TEXT[n]]));
  wk.getColumn(1).width = 10; wk.getColumn(2).width = 80;

  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ================= OBSERVATIONS =================
   The same editor appears under a check answered "No" and again on the Findings
   tab. Writing it once means the two can never drift apart, and it is why the
   comment, the code and the photo can all be dealt with at the board without
   leaving the Checks tab. */
function PhotoStrip({photos, onAdd, onCaption, onDelete, label}){
  return (<div>
    <div className="flex items-center justify-between gap-2 mb-2">
      <span className="text-[13px] font-semibold text-slate-600">{label || 'Photos'}{photos.length ? ' (' + photos.length + ')' : ''}</span>
      <label className="text-xs font-bold cursor-pointer whitespace-nowrap" style={{color:'var(--c3)'}}>
        + Add photo
        {/* capture="environment" opens the camera straight away on a phone,
            which is the whole point of doing this at the board. */}
        <input type="file" accept="image/*" capture="environment" multiple className="hidden"
          onChange={e=>{ onAdd(e.target.files); e.target.value=''; }}/>
      </label>
    </div>
    {photos.length === 0
      ? <p className="text-xs text-slate-400">No photo yet.</p>
      : (<div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
          {photos.map(ph => (
            <div key={ph.id} className="rounded-xl border border-slate-200 overflow-hidden">
              <img src={ph.data} alt="" className="w-full h-24 object-cover"/>
              <div className="p-1.5 flex gap-1.5">
                <input className="field !min-h-[32px] !py-1 text-xs" placeholder="Caption"
                  value={ph.caption||''} onChange={e=>onCaption(ph.id, e.target.value)}/>
                <button className="btn btn-g !min-h-[32px] !py-1 !px-2 text-xs" onClick={()=>onDelete(ph.id)}>✕</button>
              </div>
            </div>
          ))}
        </div>)}
  </div>);
}

function ObsEditor({obs, index, photos, upObs, delObs, addPhotos, capPhoto, delPhoto, showRef}){
  return (<div className="space-y-3">
    {/* The question itself, not a reminder that one exists. Somebody writing
        this up an hour later should not have to go back to the Checks tab to
        remember what was being asked. */}
    {obs.qn && (
      <div className="rounded-xl px-3 py-2.5" style={{ background:'var(--c1-soft)', border:'1px solid rgba(1,54,99,.12)' }}>
        <div className="text-[10px] font-black uppercase tracking-wider mb-0.5" style={{ color:'var(--c3)' }}>
          Question {obs.qn}
        </div>
        <div className="text-[13px] font-semibold leading-snug" style={{ color:'var(--c1)' }}>{Q_TEXT[obs.qn]}</div>
        <div className="text-[11px] text-slate-500 mt-1">Answered <b>No</b>. It prints on the report exactly as above.</div>
      </div>
    )}
    <Field label="What was found" value={obs.comment} onChange={v=>upObs(obs.id, { comment:v })} area required
      placeholder={obs.qn ? 'e.g. cracked faceplate in the back store, live parts reachable' : 'What is wrong, and where'}/>
    <div>
      <span className="text-[13px] font-semibold text-slate-600 mb-1 block">Recommendation</span>
      <div className="flex flex-wrap gap-1.5">
        {['1','2','3','4'].map(c => (
          <button key={c} type="button" onClick={()=>upObs(obs.id, { code:c })}
            className={'tabbtn ' + (obs.code === c ? (c === '1' ? '!bg-red-600 !text-white on' : 'on') : 'off')}>
