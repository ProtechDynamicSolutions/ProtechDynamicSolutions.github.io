/* The book at a glance: what is left, and what each spent number went on. This
   is the record that says the numbers you paid for are accounted for. */
/* "PR-1000" to "PR-1010" means the eleven numbers in between. The prefix and the
   zero padding come from whatever was typed, so 0998 → 1002 keeps its width and
   a book with no prefix at all works the same way. */
function expandRange(from, to){
  const a = String(from || '').trim(), b = String(to || '').trim();
  if(!a) return [];
  if(!b) return [a];
  const m1 = a.match(/^(.*?)(\d+)$/), m2 = b.match(/^(.*?)(\d+)$/);
  if(!m1 || !m2) throw new Error('A range needs both ends to finish with a number.');
  if(m1[1] !== m2[1]) throw new Error('Both ends of a range need the same prefix — "' + m1[1] + '" and "' + m2[1] + '" differ.');
  const start = parseInt(m1[2], 10), end = parseInt(m2[2], 10);
  if(end < start) throw new Error('The second number is lower than the first.');
  if(end - start > 500) throw new Error('That is more than 500 numbers. Add them in smaller batches.');
  const width = m1[2].length;
  const out = [];
  for(let n = start; n <= end; n++) out.push(m1[1] + String(n).padStart(width, '0'));
  return out;
}

function AddNumbers({onAdded, onClose}){
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [list, setList] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  /* Typed-in numbers win if both boxes have something, because a list is the
     more deliberate act. */
  let preview = [];
  let previewErr = '';
  try{
    preview = list.trim()
      ? list.split(/[\s,;]+/).map(x => x.trim()).filter(Boolean)
      : expandRange(from, to);
  }catch(e){ previewErr = e.message; }

  const add = async () => {
    if(previewErr) return setErr(previewErr);
    if(!preview.length) return setErr('Nothing to add yet.');
    setBusy(true); setErr('');
    try{
      const res = await API.call('prAdd', { numbers: preview });
      onAdded(res);
    }catch(e){ setErr(e.message); setBusy(false); }
  };

  return (<div className="rounded-xl border border-slate-200 p-3 mt-3">
    <div className="flex items-center justify-between mb-2">
      <span className="text-[13px] font-semibold text-slate-700">Add numbers to the book</span>
      <button className="text-xs font-bold text-slate-400" onClick={onClose}>Cancel</button>
    </div>
    <p className="text-xs text-slate-500 mb-2.5">
      A whole pad at once: type the first and last number. Or paste a few, separated by spaces, commas or new lines.
    </p>
    <div className="flex gap-2 items-center flex-wrap mb-2">
      <input className="field !w-auto !min-h-[38px] !py-1.5" placeholder="First, e.g. PR-1000"
        value={from} onChange={e=>setFrom(e.target.value)}/>
      <span className="text-sm text-slate-400">to</span>
      <input className="field !w-auto !min-h-[38px] !py-1.5" placeholder="Last, e.g. PR-1010"
        value={to} onChange={e=>setTo(e.target.value)}/>
    </div>
    <textarea className="field text-sm" rows={2} placeholder="…or paste numbers here"
      value={list} onChange={e=>setList(e.target.value)}/>
    {previewErr
      ? <p className="text-xs text-red-600 font-semibold mt-2">{previewErr}</p>
      : preview.length > 0 && (
          <p className="text-xs text-slate-500 mt-2">
            {preview.length} number{preview.length === 1 ? '' : 's'}: <b>{preview[0]}</b>
            {preview.length > 1 && <> … <b>{preview[preview.length - 1]}</b></>}
          </p>
        )}
    {err && <p className="text-xs text-red-600 font-semibold mt-2">{err}</p>}
    <button className="btn btn-a w-full mt-3 !min-h-[40px] !py-1.5" disabled={busy || !!previewErr || !preview.length} onClick={add}>
      {busy ? 'Adding…' : 'Add ' + (preview.length || '') + ' to the book'}
    </button>
    <p className="text-xs text-slate-400 mt-2">
      Numbers already in the book are left alone, so adding the same range twice changes nothing.
    </p>
  </div>);
}

function PrBookPanel(){

const RANGES = [['all','All time'],['12m','Last 12 months'],['6m','Last 6 months'],['90d','Last 90 days']];

function App(){
  const [jobs, setJobs] = useState([]);
  const [locked, setLocked] = useState(API.configured && !API.on);
  const [loading, setLoading] = useState(!!API.on);
  const [error, setError] = useState('');
  const [range, setRange] = useState('all');
  const [kind, setKind] = useState('');
  const [cat, setCat] = useState('');
  const [cond, setCond] = useState('');
  const [insp, setInsp] = useState('');
  const [q, setQ] = useState('');
  const [sort, setSort] = useState({ key:'date', dir:-1 });
  const [detail, setDetail] = useState(null);
  const [busy, setBusy] = useState('');

  useEffect(()=>{
    document.title = (settings.clientName || settings.companyName) + ' — Records Dashboard';
  }, []);

  const load = async () => {
    if(!API.on) return;
    setLoading(true); setError('');
    try{
      const data = await API.call('pull', {});
      setJobs((data.jobs || []).filter(j => !j.deleted).sort((a,b) => (b.date||'').localeCompare(a.date||'')));
    }catch(e){ setError(e.message); }
    setLoading(false);
  };
  useEffect(()=>{ load(); }, []);

  const filtered = useMemo(()=>{
    const now = new Date();
    const cutoff = range === 'all' ? null
      : new Date(now.getFullYear(), now.getMonth() - (range === '12m' ? 12 : range === '6m' ? 6 : 3), now.getDate()).toISOString().slice(0,10);
    return jobs.filter(j => {
      if(cutoff && (j.date || '') < cutoff) return false;
      if(kind && kindOf(j) !== kind) return false;
      if(cat && (j.pir||{}).category !== cat) return false;
      if(cond && audit(j).condition !== cond) return false;
      if(insp && (j.inspector || (j.sig||{}).name || 'Unassigned') !== insp) return false;
      if(q){
        const hay = ((j.customerName||'') + ' ' + (j.address||'') + ' ' + (j.prNo||'') + ' ' + ((j.pir||{}).obs||[]).map(o=>o.comment).join(' ')).toLowerCase();
        if(!hay.includes(q.toLowerCase())) return false;
      }
      return true;
    });
  }, [jobs, range, kind, cat, cond, insp, q]);

  const a = useMemo(()=>analyse(filtered), [filtered]);
  const allCats = useMemo(()=>Array.from(new Set(jobs.map(j => (j.pir||{}).category).filter(Boolean))).sort(), [jobs]);
  const allInsp = useMemo(()=>Array.from(new Set(jobs.map(j => j.inspector || (j.sig||{}).name || 'Unassigned'))).sort(), [jobs]);

  const sorted = useMemo(()=>{
    const val = (j) => {
      const au = audit(j);
      switch(sort.key){
        case 'kind': return kindOf(j);
        case 'site': return (j.customerName || '').toLowerCase();
        case 'cat': return ((j.pir||{}).category || '').toLowerCase();
        case 'insp': return (j.inspector || (j.sig||{}).name || '').toLowerCase();
        case 'cond': return au.condition || '';
        case 'obs': return au.obs.length;
        case 'urgent': return au.urgent.length;
        case 'due': return au.nextDue || '9999';
        default: return j.date || '';
      }
    };
    return [...filtered].sort((x,y) => {
      const vx = val(x), vy = val(y);
      if(vx === vy) return 0;
      return (vx > vy ? 1 : -1) * sort.dir;
    });
  }, [filtered, sort]);

  const filterNote = [
    RANGES.find(r => r[0] === range)[1],
    kind && ('kind: ' + KINDS[kind].label.toLowerCase()),
    cat && ('category: ' + cat), cond && ('condition: ' + cond), insp && ('inspector: ' + insp), q && ('search: ' + q)
  ].filter(Boolean).join(', ');

  const th = (key, label, align) => (
    <th onClick={()=>setSort(s => ({ key, dir: s.key === key ? -s.dir : (key === 'date' ? -1 : 1) }))}
      style={{ textAlign: align || 'left', color: sort.key === key ? C2 : undefined }}>
      {label}{sort.key === key ? (sort.dir === 1 ? ' ▲' : ' ▼') : ''}
    </th>
  );

  const exportPdf = () => { setBusy('pdf'); setTimeout(()=>{ try{ buildDashboardPdf(sorted, settings, filterNote); } finally { setBusy(''); } }, 30); };
  const exportAll = () => { setBusy('all'); setTimeout(()=>{ try{ buildAllReportsPdf(sorted, settings); } finally { setBusy(''); } }, 30); };
  const exportXl = async () => {
    setBusy('xl');
    try{
      const blob = await buildWorkbook(sorted, settings);
      downloadBlob(blob, 'ifes-records-' + todayInput() + '.xlsx');
    } finally { setBusy(''); }
  };

  if(locked) return <UnlockView onDone={()=>{ setLocked(false); load(); }}/>;

  return (<div className="min-h-screen">
    <header className="noprint brandgrad" style={{ color:textOn(C1) }}>
      <div className="max-w-7xl mx-auto px-5 py-5 flex items-center gap-4 flex-wrap">
        <BrandLogo settings={settings} h={50}/>
        <div className="min-w-0 flex-1">
          <h1 className="serif text-2xl font-bold leading-tight truncate">{settings.clientName || settings.companyName}</h1>
          <p className="text-xs opacity-85">
            {BRAND.tagline || 'Inspection and test record programme'}{API.who ? '  ·  ' + API.who : ''}
          </p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button className="btn btn-a" disabled={!!busy || !sorted.length} onClick={exportPdf}>{busy==='pdf' ? 'Building…' : 'Dashboard PDF'}</button>
          <button className="btn btn-o" disabled={!!busy || !sorted.length} onClick={exportAll}>{busy==='all' ? 'Building…' : 'All reports PDF'}</button>
          <button className="btn btn-o" disabled={!!busy || !sorted.length} onClick={exportXl}>{busy==='xl' ? 'Building…' : 'Excel'}</button>
          {API.on && <button className="btn btn-o" onClick={load} disabled={loading}>{loading ? 'Loading…' : 'Refresh'}</button>}
          {API.on && <button className="btn btn-o" title="Sign out of this browser"
            onClick={()=>{ if(confirm('Sign out of this browser?')){ API.forget(); location.reload(); } }}>
            {API.who ? 'Sign out' : 'Lock'}</button>}
        </div>
      </div>
      <div style={{height:3, background:'rgba(255,255,255,.22)'}}/>
    </header>


    <main className="max-w-7xl mx-auto px-5 py-6 space-y-6">
      {error && <div className="card p-4 text-sm text-red-700 bg-red-50 border-red-200">Could not load data: {error}</div>}
      {API.backendStale && (
        <div className="card p-4 text-sm" style={{ background:'#fff8f1', borderColor:'#fcd9b6', color:'#7c4a17' }}>
          <b>The backend needs redeploying.</b> {STALE_MSG}

      {!API.on && !jobs.length && (
        <div className="card p-8 text-center">
          <h2 className="font-bold text-slate-800 text-lg mb-2">Not connected yet</h2>
          <p className="text-sm text-slate-500 max-w-md mx-auto">This dashboard has no Apps Script URL set. Put the web-app URL into <code>apiUrl</code> in the config block at the top of this file, then reload and enter the read-only view code.</p>
        </div>

      {loading && !jobs.length && <div className="card p-8 text-center text-slate-400 text-sm">Loading records…</div>}

      {jobs.length > 0 && (<>
        {/* ---- filters ---- */}
        <div className="card p-4 noprint">

                { label:'Passed', value: Math.max(a.circuitsTested - a.circuitsFailed, 0), color:'#059669' },
                { label:'Failed', value: a.circuitsFailed, color:'#dc2626' },
                { label:'Not finished', value: Math.max(a.circuitsTotal - a.circuitsTested, 0), color:'#cbd5e1' }
              ]}/>
            </div>
            <div className="card p-5 lg:col-span-2">
              <h3 className="font-bold text-slate-800 mb-1">Circuits that fail most often</h3>
              <p className="text-xs text-slate-400 mb-4">By designation, across every test record shown — where the same fault keeps coming back</p>
              {a.topFail.length
                ? <BarList color="#dc2626" rows={a.topFail}/>
                : <p className="text-sm text-slate-400 py-6 text-center">No circuit has failed in the records shown.</p>}
            </div>
          </div>
        )}

        {a.byKind.periodic > 0 && (
          <div className="grid lg:grid-cols-3 gap-5">
            <div className="card p-5">
              <h3 className="font-bold text-slate-800 mb-1">Observations by code</h3>
              <p className="text-xs text-slate-400 mb-4">What the findings are asking for</p>
              <BarList rows={['1','2','3','4'].map(c => ({ label:'(' + c + ') ' + PIR_CODES[c], value:a.byCode[c]||0, color:CODE_COLOR[c] }))}/>
            </div>
            <div className="card p-5 lg:col-span-2">
              <h3 className="font-bold text-slate-800 mb-1">Checks most often answered "No"</h3>
              <p className="text-xs text-slate-400 mb-4">Where the estate keeps falling down — the best place to spend money</p>
              <BarList color="#dc2626" rows={a.topQ.map(qq => ({ label:'Q' + qq.n + ' · ' + qq.text, value:qq.count }))}/>
            </div>
          </div>
        )}

        <div className="grid lg:grid-cols-2 gap-5">
          <div className="card p-5">
            <h3 className="font-bold text-slate-800 mb-1">Installation category</h3>
            <p className="text-xs text-slate-400 mb-4">Mix of sites covered</p>
            <Donut centerTop={a.total} centerSub="RECORDS" slices={Object.keys(a.byCat).map((k,i) => ({
              label:k, value:a.byCat[k], color:[C2, C1, C3, '#94a3b8', '#0e7490'][i % 5]
            }))}/>
          </div>
          <div className="card p-5">
            <h3 className="font-bold text-slate-800 mb-1">By inspector</h3>
            <p className="text-xs text-slate-400 mb-4">Records completed, with findings raised</p>
            <BarList rows={Object.keys(a.byInspector).sort((x,y)=>a.byInspector[y].n - a.byInspector[x].n)
              .map(k => ({ label: k + '  ·  ' + a.byInspector[k].obs + ' obs', value:a.byInspector[k].n }))}/>
          </div>
        </div>

        {/* ---- due ---- */}
        {(a.overdue.length > 0 || a.due90.length > 0) && (
          <div className="card p-5">
            <h3 className="font-bold text-slate-800 mb-1">Re-inspection due</h3>
            <p className="text-xs text-slate-400 mb-4">From periodic inspections only — a test record does not fall due again. Overdue first, then anything due in the next 90 days.</p>
            <div className="scrollx">
              <table className="data">
                <thead><tr><th>Site</th><th>Address</th><th>Last inspected</th><th>Condition</th><th>Due</th><th>Status</th></tr></thead>
                <tbody>
                  {a.overdue.concat(a.due90).map((d,i) => (
                    <tr key={i} onClick={()=>setDetail(d.job)}>
                      <td className="font-semibold text-slate-800">{d.site}</td>
                      <td className="text-slate-500">{d.address}</td>
                      <td>{fmtDate(d.date)}</td>
                      <td>{d.condition ? <span className={'chip ' + (d.condition === 'Unsatisfactory' ? 'chip-bad' : 'chip-ok')}>{d.condition}</span> : '—'}</td>
                      <td>{fmtDate(d.nextDue)}</td>
                      <td>{d.days < 0
                        ? <span className="chip chip-bad">{Math.abs(d.days)} days overdue</span>
                        : <span className="chip chip-warn">in {d.days} days</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* ---- the PR book ---- */}
        <PrBookPanel/>

        {/* ---- table ---- */}
        <div className="card p-5">
          <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
            <div>
              <h3 className="font-bold text-slate-800">Every record</h3>
              <p className="text-xs text-slate-400">Click any row for the full record</p>
            </div>
            <span className="chip chip-n">{sorted.length} shown</span>
          </div>
          <div className="scrollx">
            <table className="data">
              <thead><tr>
                {th('date','Date')}{th('kind','Type')}{th('site','Site')}{th('cat','Category')}{th('insp','By')}
                {th('cond','Result')}{th('obs','Findings','center')}{th('urgent','Urgent','center')}{th('due','Next due')}
              </tr></thead>
              <tbody>
                {sorted.map(j => {
                  const au = audit(j);
                  const k = kindOf(j);
                  const result = au.condition
                    ? (k === 'test' ? (au.condition === 'Unsatisfactory' ? 'Fail' : 'Pass') : au.condition)
                    : '';
                  return (<tr key={j.id} onClick={()=>setDetail(j)}>
                    <td className="whitespace-nowrap">{fmtDate(j.date)}</td>
                    <td><span className="chip chip-n">{KINDS[k].short}</span></td>
                    <td className="font-semibold text-slate-800">{j.customerName}<div className="text-xs font-normal text-slate-400">{[j.prNo, j.address].filter(Boolean).join(' · ')}</div></td>
                    <td>{(j.pir||{}).category || '—'}</td>
                    <td>{j.inspector || (j.sig||{}).name || '—'}</td>
                    <td>{result ? <span className={'chip ' + (au.condition === 'Unsatisfactory' ? 'chip-bad' : 'chip-ok')}>{result}</span> : <span className="chip chip-n">Open</span>}</td>
                    <td style={{textAlign:'center'}}>{k === 'test' ? (au.answered + '/' + au.total) : (au.obs.length || '—')}</td>
                    <td style={{textAlign:'center'}} className={au.urgent.length ? 'text-red-600 font-bold' : 'text-slate-300'}>{au.urgent.length || '—'}</td>
                    <td className="whitespace-nowrap">{fmtDate(au.nextDue) || '—'}</td>
                  </tr>);
                })}
                {sorted.length === 0 && <tr><td colSpan="9" className="text-center text-slate-400 py-8">Nothing matches those filters.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </>)}
    </main>

    {detail && <Detail job={detail} onClose={()=>setDetail(null)}/>}

    <footer className="max-w-7xl mx-auto px-5 py-8 text-center text-xs text-slate-400">
      {settings.companyName}{settings.regNo ? ' · Reg ' + settings.regNo : ''} · Records issued for programme management.
      They do not replace any certificate or report that must be issued through Safe Electric.

    </footer>
  </div>);
}

try{
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  var boot = document.getElementById('boot'); if(boot) boot.style.display = 'none';
}catch(err){ window.__err(err && err.message ? err.message : err); }
</script>
</body>
</html>
