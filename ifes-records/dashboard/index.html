<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const BRAND = window.APP_CONFIG || {};
const C1 = BRAND.primaryColor || '#013663';
const C2 = BRAND.accentColor || '#0087c8';
const C3 = BRAND.thirdColor  || '#02588e';

/* ================= HELPERS ================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const nowISO = () => new Date().toISOString();
const todayInput = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-IE',{day:'2-digit',month:'short',year:'numeric'}); };
const monthKey = (iso) => (iso || '').slice(0,7);
const monthLabel = (k) => { const [y,m] = k.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m,10)-1] + ' ' + y.slice(2); };
const downloadBlob = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); };
const hexToRgb = (h) => { h=(h||'#0f172a').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const luminance = (h) => { const [r,g,b]=hexToRgb(h); return (0.299*r+0.587*g+0.114*b)/255; };
const textOn = (h) => luminance(h) > 0.6 ? '#0f172a' : '#ffffff';
const argb = (h) => 'FF' + (h||'#0f172a').replace('#','').toUpperCase();
const safeName = (s) => String(s || 'record').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'record';
/* Map popups are built as HTML strings, and site names come from whatever was
   typed on site, so they get escaped before going anywhere near innerHTML. */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC_MAP[c]);
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
function fitBox(natW, natH, maxW, maxH){ if(!natW || !natH) return {w:maxW,h:maxH}; const r = Math.min(maxW/natW, maxH/natH); return { w:natW*r, h:natH*r }; }
function addInterval(dateStr, value, unit){
  const n = parseFloat(value);
  if(!dateStr || !n || isNaN(n)) return '';
  const d = new Date(dateStr); if(isNaN(d)) return '';
  if(unit === 'months') d.setMonth(d.getMonth() + Math.round(n)); else d.setFullYear(d.getFullYear() + Math.round(n));
  return d.toISOString().slice(0,10);
}

/* ================= REFERENCE DATA ================= */
const PIR_Q = [
  { g:'Outlets & accessories', items:[
    [1,'Have all electrical outlets / accessories been inspected?', false],
    [2,'Are all outlets / accessories undamaged?', false],
    [3,'Are all live parts covered?', false],
  ]},
  { g:'Earthing / bonding', items:[
    [4,'If TNCS, is main protective conductor connected?', true],
    [5,'If present, is it the correct size?', true],
    [6,'Earth Electrode Inspection Chamber?', false],
    [7,'If yes, is earth electrode visible?', false],
    [8,'If yes, is protective tape used?', false],
    [9,'If visible, is the earthing conductor the correct size?', false],
    [10,'Is all main equipotential bonding correct?', true],
    [11,'All supplementary bonding correct and connections verified?', true],
    [12,'Protective earthing sleeved where appropriate?', true],
    [13,'Polarity and earthing of all switches / outlets correct?', false],
    [14,'All metallic switches / outlets earthed?', false],
  ]},
  { g:'Distribution board(s)', items:[
    [15,'Labelled correctly?', false],
    [16,'Located correctly?', false],
    [18,'Are all devices correctly rated for S/C and O/L?', false],
    [19,'Circuit sequence correct for P, N, +E?', false],
  ]},
  { g:'General', items:[
    [21,'Correct cable colours used at the time of installation?', false],
    [22,'Are cables in good condition?', false],
    [23,'Cables correctly selected?', false],
    [24,'Correct routing of cables in attic area?', true],
    [25,'Cables correctly installed where visible?', false],
    [26,'All excessive heating effects from luminaires avoided?', false],
    [27,'Correctly selected accessories and switches?', false],
    [28,'Are they in a good condition?', false],
    [29,'Are they correctly located?', false],
    [30,'Are they suitable for their environment?', false],
  ]},
];
const PIR_CODES = { '1':'Requires urgent attention', '2':'Requires improvements', '3':'Requires some attention', '4':'Does not comply with current National Rules' };
const CODE_COLOR = { '1':'#dc2626', '2':'#d97706', '3':'#64748b', '4':C2 };
const Q_TEXT = (() => { const m = {}; PIR_Q.forEach(g => g.items.forEach(i => { m[i[0]] = i[1]; })); return m; })();
const pirQFlat = () => PIR_Q.reduce((a,g)=> a.concat(g.items.map(i=>i[0])), []);

/* Signed off = every check answered, a condition recorded, and a signature. */
/* The field app writes two kinds of record into the same sheet. Both are read
   here through one audit with one shape, so the tables, the filters and the
   charts do not each need to know which is which. */
const KINDS = {
  periodic: { label:'Periodic inspection', short:'Periodic', prefix:'PR' },
  test:     { label:'Test record',         short:'Test record', prefix:'TR' }
};
const kindOf = (job) => (job && job.kind === 'test') ? 'test' : 'periodic';
const circuitFailed = (c) => (c.pre||{}).pass === 'Fail' || (c.post||{}).pass === 'Fail';

function isSignedOff(job){
  const a = audit(job);
  if(kindOf(job) === 'test') return a.total > 0 && a.answered === a.total && !!((job.sig || {}).sig);
  return a.unanswered.length === 0 && !!(job.pir || {}).condition && !!((job.sig || {}).sig);
}

function audit(job){
  return kindOf(job) === 'test' ? testAudit(job) : pirAudit(job);
}

function testAudit(job){
  const cs = ((job.test || {}).circuits) || [];
  const done = cs.filter(c => (c.pre||{}).pass && (c.post||{}).pass);
  const failed = cs.filter(circuitFailed);
  return {
    unanswered: cs.filter(c => !((c.pre||{}).pass && (c.post||{}).pass)).map(c => c.number),
    nos: failed.map(c => c.number),
    obs: failed.map(c => ({ id:c.id, ref:c.number, code:'1',
      comment: (c.designation || 'Circuit ' + c.number) + ' failed: ' + [(c.pre||{}).comments, (c.post||{}).comments].filter(Boolean).join('; ') })),
    urgent: failed,
    answered: done.length, total: cs.length,
    circuits: cs, failed,
    condition: failed.length ? 'Unsatisfactory' : (cs.length && done.length === cs.length ? 'Satisfactory' : ''),
    nextDue: ''
  };
}

function pirAudit(job){
  const p = job.pir || {};
  const q = p.q || {};
  const nums = pirQFlat();
  const unanswered = nums.filter(n => !q['q'+n]);
  const nos = nums.filter(n => q['q'+n] === 'No');
  const obs = (p.obs || []).filter(o => (o.comment||'').trim());
  const urgent = obs.filter(o => o.code === '1');
  return { unanswered, nos, obs, urgent, answered: nums.length - unanswered.length, total: nums.length,
    circuits: [], failed: [],
    condition: urgent.length ? 'Unsatisfactory' : (p.condition || ''),
    nextDue: addInterval(job.date, p.intervalValue, p.intervalUnit) };
}

const settings = {
  companyName: BRAND.companyName || 'I.F.E.S. Electrical Services Ltd.',
  clientName: BRAND.clientName || '',
  regNo: BRAND.regNumber || '', phone: BRAND.phone || '', email: BRAND.email || '',
  website: BRAND.website || '', address: BRAND.address || '',
  logo: BRAND.logoDataUri || BRAND.logoUrl || '',
  logoLight: BRAND.logoLightUri || '',
  logoMark: BRAND.logoMarkUri || '',
  logoBox: BRAND.logoBox !== false, disclaimer: true,
  c1: C1, c2: C2, c3: C3
};

/* ================= API (read only) ================= */
/* Same reasoning as the inspection app: an Apps Script web app has to be
   published as "Anyone", so a key written into this file would be readable by
   anyone who opens the page. The view code is typed once and kept in the
   browser instead. It is read only — it cannot change or delete a thing. */
const store = {
  get(k, fb){ try{ const v = localStorage.getItem('ifesd_' + k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem('ifesd_' + k, JSON.stringify(v)); }catch(e){} }
};

/* The address the app talks to. With apiUrlHead set, the tail is typed once per
   device and kept there — so a copy of this file, on its own, does not say where
   the backend is. Worth being clear about what that is and is not: it hides the
   address, which stops casual poking; it is one shared secret for everyone, so
   it is not per-person security and it is not what controls who can sign in.
   The Techs tab and the server checks do that. */
const CONN = {
  head: BRAND.apiUrlHead || '',
  get tail(){ return store.get('connTail', '') || ''; },
  set tail(v){ store.set('connTail', v || ''); },
  get needed(){ return !!this.head && !BRAND.apiUrl && !this.tail; },
  url(tail){
    if(BRAND.apiUrl) return BRAND.apiUrl;
    const t = (tail === undefined ? this.tail : tail).trim();
    return (this.head && t) ? this.head + t + '/exec' : '';
  }
};

/* What this app needs the backend to be able to do. Raised alongside
   BACKEND_BUILD in Code.gs whenever a new action is added. */
const NEEDS_BUILD = 10;
const staleBackend = (res) => Number((res && res.build) || 0) < NEEDS_BUILD;
const STALE_MSG = 'The Apps Script backend is an older version than this app. In Apps Script: ' +
  'Deploy \u203a Manage deployments \u203a pencil \u203a Version: New version \u203a Deploy.';

const API = {
  url: CONN.url(),
  backendStale: false,
  /* Either a named person with the viewer role, or the long read-only code. */
  user: '', pin: '', token: '', key: '', who: '',
  company: (BRAND.companyCode || 'default').toLowerCase(),
  get configured(){ return !!(this.url || CONN.head); },
  get on(){ return !!(this.url && (this.key || (this.user && (this.token || this.pin)))); },
  save(creds, who, token){
    this.key = creds.key || ''; this.user = creds.user || '';
    this.token = token || ''; this.pin = token ? '' : (creds.pin || '');
    this.who = who || '';
    store.set('viewKey', this.key); store.set('viewUser', this.user);
    store.set('viewToken', this.token); store.set('viewPin', this.pin); store.set('viewWho', this.who);
  },
  forget(){
    this.key = ''; this.user = ''; this.pin = ''; this.token = ''; this.who = '';
    ['viewKey','viewUser','viewPin','viewToken','viewWho'].forEach(k => store.set(k, ''));
  },
  async raw(action, payload, creds){
    const c = creds || { key: this.key, user: this.user, pin: this.pin, token: this.token };
    const c2 = creds || {};
    const res = await fetch(this.url, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      /* scope 'all' is a request, not a grant — the server checks the role
         before it agrees, and refuses a plain electrician's login here. */
      body: JSON.stringify({ key: c.key || '', user: c.user || '',
                             pin: c.token ? '' : (c.pin || ''), token: c.token || '', scope:'all',
                             trap: c2.trap || '', dwell: c2.dwell,
                             company:this.company, action, payload: payload || {} })
    });
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Request failed');
    return json;
  },
  async call(action, payload){ return (await this.raw(action, payload)).data; }
};
API.key = store.get('viewKey', '') || (BRAND.viewKey || '');
API.user = store.get('viewUser', '') || '';
API.pin = store.get('viewPin', '') || '';
API.token = store.get('viewToken', '') || '';
API.who = store.get('viewWho', '') || '';

function analyse(jobs){
  const total = jobs.length;
  let sat = 0, unsat = 0, obsAll = [], urgent = 0;
  const byMonth = {}, byCat = {}, byInspector = {}, byCode = {'1':0,'2':0,'3':0,'4':0}, qFail = {}, sites = {};
  /* Test-record counters kept apart from the periodic ones: a failed circuit
     and a code-1 observation are both bad news, but they are not the same
     measurement and averaging them together would say nothing. */
  const byKind = { periodic:0, test:0 };
  let circuitsTotal = 0, circuitsTested = 0, circuitsFailed = 0;
  const failByDesign = {};
  jobs.forEach(j => {
    const a = audit(j), p = j.pir || {};
    const kind = kindOf(j);
    byKind[kind]++;
    if(kind === 'test'){
      circuitsTotal += a.total;
      circuitsTested += a.answered;
      circuitsFailed += a.failed.length;
      a.failed.forEach(c => {
        const d = c.designation || 'Unnamed circuit';
        failByDesign[d] = (failByDesign[d] || 0) + 1;
      });
    }
    if(a.condition === 'Satisfactory') sat++;
    else if(a.condition === 'Unsatisfactory') unsat++;
    urgent += a.urgent.length;
    /* Codes 1-4 are a periodic-report idea. A test record's "observations" are
       its failed circuits, so they are counted, but not into the code chart. */
    a.obs.forEach(o => { obsAll.push({ job:j, obs:o }); if(kind === 'periodic') byCode[o.code] = (byCode[o.code]||0) + 1; });
    const mk = monthKey(j.date);
    if(mk){
      if(!byMonth[mk]) byMonth[mk] = { total:0, sat:0, unsat:0 };
      byMonth[mk].total++;
      if(a.condition === 'Satisfactory') byMonth[mk].sat++; else if(a.condition === 'Unsatisfactory') byMonth[mk].unsat++;
    }
    const cat = p.category || 'Unspecified';
    byCat[cat] = (byCat[cat]||0) + 1;
    const insp = j.inspector || (j.sig||{}).name || 'Unassigned';
    if(!byInspector[insp]) byInspector[insp] = { n:0, obs:0 };
    byInspector[insp].n++; byInspector[insp].obs += a.obs.length;
    if(kind === 'periodic') a.nos.forEach(n => { qFail[n] = (qFail[n]||0) + 1; });
    const key = j.customerName || 'Unnamed site';
    if(!sites[key]) sites[key] = { count:0, lat:null, lng:null };
    sites[key].count++;
    const la = parseFloat(j.lat), ln = parseFloat(j.lng);
    if(!isNaN(la) && !isNaN(ln)){ sites[key].lat = la; sites[key].lng = ln; }
    /* Site-level facts always come from the most recent visit. */
    if(!sites[key].date || (j.date||'') > (sites[key].date||'')){
      Object.assign(sites[key], { date:j.date, nextDue:a.nextDue, condition:a.condition, urgent:a.urgent.length, address:j.address, job:j });
    }
  });

  /* Last 12 months, including quiet ones, so the trend line does not lie.
     Built from year/month directly: toISOString() would shift a month backwards
     during summer time and produce a duplicated bucket. */
  const months = [];
  const now = new Date();
  for(let i = 11; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    months.push(Object.assign({ key:k, label: monthLabel(k) }, byMonth[k] || { total:0, sat:0, unsat:0 }));
  }

  const today = todayInput();
  const due = Object.keys(sites).map(k => Object.assign({ site:k }, sites[k]))
    .filter(s => s.nextDue)
    .map(s => Object.assign({}, s, { days: daysBetween(today, s.nextDue) }))
    .sort((a,b) => a.days - b.days);

  const topQ = Object.keys(qFail).map(n => ({ n: Number(n), count: qFail[n], text: Q_TEXT[n] || ('Question ' + n) }))
    .sort((a,b) => b.count - a.count).slice(0, 8);

  const mapPoints = Object.keys(sites)
    .filter(k => sites[k].lat !== null && sites[k].lng !== null)
    .map(k => Object.assign({ site:k }, sites[k]));

  const topFail = Object.keys(failByDesign).map(k => ({ label:k, value:failByDesign[k] }))
    .sort((a,b) => b.value - a.value).slice(0, 8);

  return {
    total, sat, unsat, urgent,
    byKind, circuitsTotal, circuitsTested, circuitsFailed, topFail,
    obsTotal: obsAll.length, obsAll,
    satRate: pct(sat, sat + unsat),
    months, byCat, byInspector, byCode, topQ,
    mapPoints, mapMissing: Object.keys(sites).length - mapPoints.length,
    sites: Object.keys(sites).length,
    due, overdue: due.filter(d => d.days < 0), due90: due.filter(d => d.days >= 0 && d.days <= 90),
    avgObs: total ? (obsAll.length / total).toFixed(1) : '0.0'
  };
}

function Donut({slices, centerTop, centerSub, size=170}){
  const total = slices.reduce((s,x) => s + x.value, 0) || 1;
  const R = 42, C = 2*Math.PI*R;
  let acc = 0;
  return (<div className="flex items-center gap-5 flex-wrap">
    <svg viewBox="0 0 110 110" style={{width:size, height:size, flexShrink:0}}>
      <circle cx="55" cy="55" r={R} fill="none" stroke="#f1f5f9" strokeWidth="15"/>
      {slices.map((s, i) => {
        const len = (s.value/total) * C;
        const el = <circle key={i} cx="55" cy="55" r={R} fill="none" stroke={s.color} strokeWidth="15"
          strokeDasharray={len + ' ' + (C - len)} strokeDashoffset={-acc}
          transform="rotate(-90 55 55)" strokeLinecap="butt"/>;
        acc += len;
        return el;
      })}
      <text x="55" y="53" textAnchor="middle" fontSize="19" fontWeight="800" fill="#0f172a">{centerTop}</text>
      <text x="55" y="66" textAnchor="middle" fontSize="7.5" fontWeight="700" fill="#94a3b8" letterSpacing="0.5">{centerSub}</text>
    </svg>
    <div className="space-y-2 min-w-0 flex-1">
      {slices.map((s,i) => (
        <div key={i} className="flex items-center gap-2 text-sm">
          <i className="w-3 h-3 rounded-sm inline-block shrink-0" style={{background:s.color}}/>
          <span className="text-slate-600 truncate flex-1">{s.label}</span>
          <span className="font-bold text-slate-800">{s.value}</span>
          <span className="text-slate-400 text-xs w-10 text-right">{pct(s.value, total)}%</span>
        </div>
      ))}
    </div>
  </div>);
}

/* ---- Site map ----
   A real map: OpenStreetMap tiles through Leaflet, with each site plotted from
   the coordinates the electrician captured at the board. The dashboard already
   loads React and ExcelJS from a CDN, so a tile layer costs nothing extra
   architecturally. If Leaflet or the tiles cannot be reached, the markers still
   draw on a plain background and the panel says so. */
function SiteMap({points, onPick}){
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const pickRef = useRef(onPick);
  pickRef.current = onPick;
  const [tilesFailed, setTilesFailed] = useState(false);

  const colorOf = (p) => p.urgent > 0 ? '#dc2626'
    : p.condition === 'Unsatisfactory' ? '#f97316'
    : p.condition === 'Satisfactory' ? '#059669' : '#94a3b8';

  useEffect(() => {
    if(!window.L || !elRef.current || mapRef.current) return;
    const map = window.L.map(elRef.current, { scrollWheelZoom:false, attributionControl:true });
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).on('tileerror', () => setTilesFailed(true)).addTo(map);
    map.setView([53.35, -7.9], 7);
    mapRef.current = map;
    /* Leaflet measures the container on creation; inside a freshly laid-out
       card that measurement can be stale. */
    setTimeout(() => map.invalidateSize(), 60);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  useEffect(() => {
    const map = mapRef.current;
    if(!map) return;
    if(layerRef.current) layerRef.current.remove();
    const group = window.L.layerGroup().addTo(map);
    layerRef.current = group;
    if(!points.length) return;

    const maxCount = Math.max(...points.map(p => p.count));
    points.forEach(p => {
      const r = 7 + Math.sqrt(p.count / maxCount) * 9;
      const m = window.L.circleMarker([p.lat, p.lng], {
        radius: r, color: '#fff', weight: 2, fillColor: colorOf(p), fillOpacity: 0.9
      }).addTo(group);
      m.bindTooltip(p.site, { direction:'top', offset:[0,-6] });
      m.bindPopup(
        '<div style="font:600 13px Inter,sans-serif;color:#0f172a">' + esc(p.site) + '</div>' +
        '<div style="font:400 11.5px Inter,sans-serif;color:#64748b;margin-top:2px">' + esc(p.address || '') + '</div>' +
        '<div style="font:400 11.5px Inter,sans-serif;color:#334155;margin-top:6px">' +
          p.count + ' inspection' + (p.count===1?'':'s') + ' · last ' + fmtDate(p.date) + '</div>' +
        '<div style="font:700 11.5px Inter,sans-serif;margin-top:4px;color:' + colorOf(p) + '">' +
          esc(p.condition || 'Not rated') + (p.urgent ? ' · ' + p.urgent + ' urgent' : '') + '</div>' +
        '<div style="font:600 11.5px Inter,sans-serif;margin-top:8px;color:#1b3bc7;cursor:pointer" data-open="1">Open record →</div>'
      );
      m.on('popupopen', (e) => {
        const link = e.popup.getElement().querySelector('[data-open]');
        if(link) link.onclick = () => pickRef.current && pickRef.current(p.job);
      });
    });

    /* Re-measure before fitting. This effect can run before the card has
       finished laying out, and fitting against a stale container size leaves the
       pins clustered in a corner. */
    map.invalidateSize();
    const bounds = window.L.latLngBounds(points.map(p => [p.lat, p.lng]));
    map.fitBounds(bounds, { padding:[40,40], maxZoom: points.length === 1 ? 14 : 13 });
  }, [points]);

  if(!window.L){
    return <p className="text-sm text-slate-400">The map library could not be loaded. Check the connection and refresh.</p>;
  }
  if(!points.length){
    return <p className="text-sm text-slate-400">No coordinates recorded yet. Tap "Use my location" at the board and the site will appear here.</p>;
  }

  return (<div>
    <div ref={elRef} style={{ height:'440px', width:'100%', borderRadius:'12px', zIndex:0 }}
      className="border border-slate-200"/>
    {tilesFailed && (
      <p className="text-xs text-amber-700 mt-2">
        Map tiles could not be reached, so the background is blank. The pins are still in the right places.
      </p>
    )}
    <div className="flex gap-4 mt-3 text-xs text-slate-500 flex-wrap">
      <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-full inline-block" style={{background:'#059669'}}/>Satisfactory</span>
      <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-full inline-block" style={{background:'#f97316'}}/>Unsatisfactory</span>
      <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-full inline-block" style={{background:'#dc2626'}}/>Urgent finding</span>
      <span className="text-slate-400">Pin size = inspections at that site. Click a pin for the record.</span>
    </div>
  </div>);
}

/* Typed once per browser, verified before it is stored. Read only. */
function UnlockView({onDone}){
  const [name, setName] = useState('');
  const [pin, setPin] = useState('');
  const [trap, setTrap] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const opened = useRef(Date.now());
  /* Two steps. Connecting the browser is a one-off; signing in is not. */
  const [conn, setConn] = useState('');
  const [step, setStep] = useState(CONN.needed ? 'conn' : 'pin');

  const connect = async () => {
    const t = conn.trim();
    if(t.length < 6) return setErr('Enter the last 10 characters of the link the office gave you.');
    const url = CONN.url(t);
    if(!url) return setErr('This build has no connection link set.');
    setBusy(true); setErr('');
    try{
      API.url = url;
      /* An empty sign-in. Being told the credentials are wrong proves the
         address is real, which is all this step needs to establish. */
      await API.raw('ping', {}, { user:'', pin:'' });
      CONN.tail = t;
    }catch(e){
      if(/returned \d/.test(e.message) || /Failed to fetch/i.test(e.message)){
        API.url = CONN.url();
        setBusy(false);
        return setErr('That code did not reach the office. Check the last 10 characters and try again.');
      }
      CONN.tail = t;   /* the script answered, so the address is right */
    }
    setBusy(false); setErr('');
    opened.current = Date.now();
    setStep('pin');
  };

  const go = async () => {
    if(!name.trim()) return setErr('Enter your email address or the name the office has for you.');
    if(!/^\d{4,}$/.test(pin.trim())) return setErr('Enter the PIN the office gave you.');
    const creds = { user: name.trim(), pin: pin.trim(), trap, dwell: Date.now() - opened.current };
    setBusy(true); setErr('');
    try{
      /* Checked against the server before it is stored. The reply also carries
         the person's display name, so the dashboard can say who is looking. */
      const res = await API.raw('ping', {}, creds);
      API.backendStale = staleBackend(res);
      API.save(creds, res.who || '', res.token || '');
      onDone();
    }catch(e){
      setErr(e.message);
      setBusy(false);
    }
  };
  return (<div className="min-h-screen flex items-center justify-center p-6 brandgrad">
    <div className="card p-7 w-full max-w-sm">
      <div className="flex items-center gap-3 mb-5">
        {settings.logo
          ? <img src={settings.logo} alt="" style={{ height:60, width:'auto' }}/>
          : <div className="rounded-xl brandgrad p-1"><Mark size={34}/></div>}
        <div className="min-w-0">
          <h1 className="serif text-lg font-bold text-slate-800 leading-tight truncate">{settings.clientName || settings.companyName}</h1>
          <p className="text-xs text-slate-400">Inspection dashboard</p>
        </div>
      </div>
      {step === 'conn' ? (<>
        <p className="text-sm text-slate-500 mb-4">
          First, connect this browser. Enter the <b>last 10 characters</b> of the link the office gave you — once,
          and never again here.
        </p>
        <input className="field" placeholder="10 characters" value={conn}
          onChange={e=>setConn(e.target.value.trim())} onKeyDown={e=>{ if(e.key === 'Enter') connect(); }}/>
        {err && <p className="text-xs text-red-600 font-semibold mt-2">{err}</p>}
        <button className="btn btn-a w-full mt-4" disabled={busy} onClick={connect}>{busy ? 'Connecting…' : 'Connect'}</button>
        <p className="text-xs text-slate-400 mt-3">Your email and PIN come next.</p>
      </>) : (<>
        <p className="text-sm text-slate-500 mb-4">
          Sign in with your email address and PIN. The dashboard is read only — it shows and exports records, and
          cannot change or delete anything.
        </p>
        {/* Not for you. A field no human sees, so anything that fills it in
            was reading the HTML rather than looking at the page. The server is
            what acts on it — a check only the browser does is a check an
            attacker simply does not run. */}
        <input type="text" name="company_website" value={trap} onChange={e=>setTrap(e.target.value)}
          tabIndex={-1} autoComplete="off" aria-hidden="true"
          style={{ position:'absolute', left:'-9999px', width:1, height:1, opacity:0 }}/>
        <div className="space-y-3">
          <input className="field" placeholder="you@ifes.ie" value={name} onChange={e=>setName(e.target.value)}
            onKeyDown={e=>{ if(e.key === 'Enter') go(); }}/>
          {/* No length stated, so a longer PIN on an account that needs one is
              not something anybody else notices. */}
          <input className="field" type="password" inputMode="numeric" placeholder="PIN"
            value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,'').slice(0,16))}
            onKeyDown={e=>{ if(e.key === 'Enter') go(); }}/>
        </div>
        {err && <p className="text-xs text-red-600 font-semibold mt-2">{err}</p>}
        <button className="btn btn-a w-full mt-4" disabled={busy} onClick={go}>{busy ? 'Checking…' : 'Open dashboard'}</button>
        {CONN.head && !BRAND.apiUrl && (
          <button className="text-xs font-bold w-full mt-3" style={{color:C3}}
            onClick={()=>{ CONN.tail = ''; API.url = CONN.url(); setErr(''); setConn(''); setStep('conn'); }}>
            Connected to the wrong link? Start again
          </button>
        )}
        <p className="text-xs text-slate-400 mt-3">
          Stored in this browser only, so it is never part of a shared link. The office adds and removes people in
          the Techs tab of the sheet.
        </p>
      </>)}
    </div>
  </div>);
}

/* ================= PDF FURNITURE ================= */
/* A gradient band drawn as thin slices, so paper matches the on-screen header.
   jsPDF has no gradient fill of its own. */
function lerp(a, b, t){ return a + (b - a) * t; }
function gradBand(doc, x, y, w, h, stops){
  /* A slim per-page rule does not need as many slices as a full cover band. */
  const N = h > 18 ? 96 : 44;
  for(let i = 0; i < N; i++){
    const t = i / (N - 1);
    let a = stops[0], b = stops[stops.length - 1];
    for(let s = 0; s < stops.length - 1; s++){
      if(t >= stops[s].p && t <= stops[s+1].p){ a = stops[s]; b = stops[s+1]; break; }
    }
    const span = (b.p - a.p) || 1;
    const lt = Math.min(Math.max((t - a.p) / span, 0), 1);
    doc.setFillColor(
      Math.round(lerp(a.c[0], b.c[0], lt)),
      Math.round(lerp(a.c[1], b.c[1], lt)),
      Math.round(lerp(a.c[2], b.c[2], lt))
    );
    doc.rect(x + (w * i / N), y, w / N + 0.4, h, 'F');
  }
}
function brandStops(st){
  const c1 = hexToRgb(st.c1), c2 = hexToRgb(st.c2), c3 = hexToRgb(st.c3);
  return [{p:0, c:c1}, {p:0.38, c:c3}, {p:0.68, c:c2}, {p:1, c:c1}];
}

/* DRAFT on anything not signed off. */
function stampWatermarks(doc, opts){
  /* One diagonal only. DRAFT wins when both apply: two overlapping stamps made
     the page unreadable, and DRAFT is the more urgent fact on the page. */
  const draft = !!(opts && opts.draft);
  const marks = [];
  /* A proposal is never a report, so its stamp outranks DRAFT. */
  if(opts && opts.proposal) marks.push({ text:'PROPOSAL', rgb:[176,138,52], op:0.13 });
  else if(draft) marks.push({ text:'DRAFT', rgb:[100,116,139], op:0.12 });
  if(!marks.length) return;
  const total = doc.internal.getNumberOfPages();
  for(let i = 1; i <= total; i++){
    doc.setPage(i);
    marks.forEach((m, mi) => {
      let restore = false;
      try{ doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity:m.op })); restore = true; }catch(e){}
      doc.setTextColor(restore ? m.rgb[0] : 226, restore ? m.rgb[1] : 232, restore ? m.rgb[2] : 240);
      doc.setFont('helvetica','bold'); doc.setFontSize(52);
      for(let row = 0; row < 4; row++) doc.text(m.text, doc.internal.pageSize.getWidth()/2, 62 + row*62 + mi*22, { align:'center', angle:32 });
      if(restore){ try{ doc.restoreGraphicsState(); }catch(e){} }
    });
    if(draft && !(opts && opts.proposal)){
      doc.setFont('helvetica','bold'); doc.setFontSize(7);
      doc.setTextColor(100,116,139);
      doc.text('INCLUDES DRAFT RECORDS', doc.internal.pageSize.getWidth()/2, doc.internal.pageSize.getHeight() - 5, { align:'center' });
    }
    doc.setTextColor(15,23,42);
  }
}

/* ================= PDF: full periodic report ================= */
/* Renders one inspection into an existing document, so a single PDF can hold
   the whole programme. */
function renderPir(doc, job, st){
  const W = 210, M = 12, BOT = 268;
  const p = job.pir || {};
  const a = audit(job);
  const rgb1 = hexToRgb(st.c1), rgb2 = hexToRgb(st.c2);
  const onC1 = textOn(st.c1) === '#ffffff' ? [255,255,255] : [15,23,42];
  const OHM = 'ohms', MOHM = 'Mohms';

  /* Full banner on the report's first page, a slim rule after that. */
  let firstPage = true;
  const head = () => {
    const stops = brandStops(st);
    if(firstPage){
      firstPage = false;
      gradBand(doc, 0, 0, W, 22, stops);
      let tx = M;
      const bannerLogo = st.logoLight || st.logo;
      if(bannerLogo){
        try{
          const pr = doc.getImageProperties(bannerLogo);
          const fit = fitBox(pr.width, pr.height, 15, 16);
          const ly = (22 - fit.h)/2;
          if(!st.logoLight && st.logoBox !== false){
            doc.setFillColor(255,255,255);
            doc.roundedRect(M - 2, ly - 2, fit.w + 4, fit.h + 4, 2, 2, 'F');
          }
          doc.addImage(bannerLogo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, ly, fit.w, fit.h, undefined, 'FAST');
          tx = M + fit.w + 7;
        }catch(e){}
      }
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
      doc.text('PERIODIC INSPECTION REPORT', tx, 10.6);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
      doc.text([st.companyName, st.regNo && ('Reg ' + st.regNo)].filter(Boolean).join('   ·   '), tx, 15.4);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.2);
      doc.text([job.prNo, (job.pir||{}).seNumber && ('SE ' + (job.pir||{}).seNumber)].filter(Boolean).join('   ·   '),
               W - M, 10.6, { align:'right' });
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
      doc.text(fmtDate(job.date), W - M, 15.4, { align:'right' });
      doc.setTextColor(15,23,42);
      return 29;
    }
    gradBand(doc, 0, 0, W, 4, stops);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(120,133,150);
    doc.text((st.companyName || '').toUpperCase() + '   ·   PERIODIC INSPECTION REPORT', M, 9);
    doc.text([job.prNo, fmtDate(job.date)].filter(Boolean).join('   ·   '), W - M, 9, { align:'right' });
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.2); doc.line(M, 11.5, W - M, 11.5);
    doc.setTextColor(15,23,42);
    return 18;
  };

  doc.addPage();
  let y = head();

  /* At-a-glance strip, same as the on-site app produces. */
  const badge = a.condition === 'Unsatisfactory' ? [220,38,38] : a.condition === 'Satisfactory' ? [5,150,105] : [148,163,184];
  doc.setFillColor(248,250,252); doc.roundedRect(M, y - 3, W - M*2, 17, 2, 2, 'F');
  doc.setFillColor(badge[0],badge[1],badge[2]); doc.rect(M, y - 3, 1.6, 17, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(15,23,42);
  doc.text(doc.splitTextToSize(job.customerName || 'Site', 104)[0], M + 5, y + 3);
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(100,116,139);
  doc.text(doc.splitTextToSize(job.address || '', 104)[0], M + 5, y + 8);
  [
    ['CONDITION', a.condition || 'Not recorded', badge],
    ['OBSERVATIONS', String(a.obs.length) + (a.urgent.length ? ' (' + a.urgent.length + ' urgent)' : ''), a.urgent.length ? [220,38,38] : [15,23,42]],
    ['NEXT DUE', fmtDate(a.nextDue) || '—', [15,23,42]]
  ].forEach((f, i) => {
    const fx = M + 116 + i*24;
    doc.setFont('helvetica','bold'); doc.setFontSize(5.2); doc.setTextColor(148,163,184);
    doc.text(f[0], fx, y + 1);
    doc.setFontSize(6.8); doc.setTextColor(f[2][0], f[2][1], f[2][2]);
    doc.text(doc.splitTextToSize(String(f[1]), 23), fx, y + 5.5);
  });
  doc.setTextColor(15,23,42);
  y += 21;
  const room = (need) => { if(y + need > BOT){ doc.addPage(); y = head(); } };
  const tick = (x, yy, on) => {
    doc.setDrawColor(120,133,150); doc.setLineWidth(0.25);
    doc.rect(x, yy - 2.7, 3.4, 3.4);
    if(on){ doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1); doc.text('X', x+0.7, yy+0.1); doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); }
  };
  const opts = (x, yy, list, val) => {
    let cx = x;
    doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(15,23,42);
    list.forEach(o => { doc.text(o, cx, yy); const w = doc.getTextWidth(o); tick(cx + w + 1.5, yy, val === o); cx += w + 9; });
  };
  const line = (label, val, x, yy, w) => {
    doc.setFontSize(7.2); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
    doc.text(label, x, yy);
    const lw = doc.getTextWidth(label);
    doc.setDrawColor(210,218,228); doc.setLineWidth(0.2); doc.line(x + lw + 2, yy + 0.9, x + w, yy + 0.9);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    doc.text(String(val || ''), x + lw + 3.5, yy);
    doc.setFont('helvetica','normal');
  };
  const sect = (t) => {
    room(12);
    doc.setFillColor(240,244,248); doc.rect(M, y-4.2, W - M*2, 6.4, 'F');
    doc.setFillColor(...rgb2); doc.rect(M, y-4.2, 1.6, 6.4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...rgb1);
    doc.text(t.toUpperCase(), M + 4, y);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    y += 8;
  };
  const COL2 = 108, HALF = 90;

  sect('Registered contractor');
  line('Name', st.companyName, M, y, 96); line('Reg No.', st.regNo, COL2, y, COL2+HALF); y += 7;
  line('Address', st.address, M, y, 96); line('Phone', st.phone, COL2, y, COL2+HALF); y += 9;

  sect('Installation details');
  line('Occupant / trading as', p.occupant || job.customerName, M, y, 96);
  line('Approx age', p.approxAge, COL2, y, COL2+HALF); y += 7;
  line('Address', job.address, M, y, 96);
  doc.setFontSize(7.2); doc.setTextColor(100,116,139);
  doc.text('Occupant in attendance?', COL2, y);
  doc.setTextColor(15,23,42);
  opts(COL2 + 40, y, ['Yes','No'], p.occupantAttended); y += 9;

  sect('Category and reason');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Installation category', M, y);
  doc.setFont('helvetica','normal'); opts(M + 42, y, ['Domestic','Commercial','Industrial','Other'], p.category); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Reason for inspection', M, y);
  doc.setFont('helvetica','normal'); opts(M + 42, y, ['Insurance Inspection','Safety Audit','Other'], p.reason); y += 6.5;
  if(p.reasonOther){ line('If other, specify', p.reasonOther, M, y, W - M); y += 7; }
  y += 2;

  sect('Extent of installation covered by this report');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Entire installation?', M, y);
  doc.setFont('helvetica','normal'); opts(M + 40, y, ['Yes','No'], p.entireInstall); y += 5.5;
  doc.setFontSize(6.5); doc.setTextColor(120,133,150);
  doc.text('Cables concealed within trunking, conduit, the fabric of the building or underground have not been inspected unless stated otherwise.', M, y);
  doc.setTextColor(15,23,42); y += 5;
  if(p.entireInstall === 'No'){
    doc.setFontSize(7.2);
    const ls = doc.splitTextToSize('This report refers to: ' + (p.partialDetail || ''), W - M*2);
    room(ls.length*4 + 4); doc.text(ls, M, y); y += ls.length*4 + 2;
  }
  y += 3;

  sect('Supply characteristics');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Type of system earthing', M, y);
  doc.setFont('helvetica','normal'); opts(M + 46, y, ['TNCS','TT','TNS','IT'], p.earthing); y += 6.5;
  doc.setFont('helvetica','bold'); doc.text('Installation voltage', M, y);
  doc.setFont('helvetica','normal'); opts(M + 46, y, ['Single Phase','Three Phase'], p.phase); y += 6.5;
  const volts = [['L1',p.v1],['L2',p.v2],['L3',p.v3],['L1-L2',p.v12],['L2-L3',p.v23],['L3-L1',p.v31]].filter(v => v[1]);
  if(volts.length){ let vx = M; volts.forEach(v => { line(v[0], v[1] + ' V', vx, y, vx + 26); vx += 31; }); y += 7; }
  line('Max prospective S/C current (A)', p.pscc, M, y, 96);
  line('Nominal rating (A)', p.nominalRating, COL2, y, COL2+HALF); y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text('Main isolation / overcurrent device', M, y);
  doc.setFont('helvetica','normal'); opts(M + 62, y, ['None','Switch Fuse','MCB','MCCB'], p.mainIsolation); y += 7;
  line('If main RCD: rated current In (A)', p.mainRcdIn, M, y, 96);
  line('Tripping current (mA)', p.mainRcdIdn, COL2, y, COL2+HALF); y += 4;

  /* Flows on from the supply section: a forced break here left half of the
     first page empty. */
  y += 6;
  sect('Inspection checks');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.2); doc.setTextColor(185,28,28);
  doc.text('Any question answered "No" must be referred to in the observations section. All questions must be answered.', M, y);
  doc.setTextColor(15,23,42); y += 6;

  const q = p.q || {};
  const ANSX = W - M - 40;
  const drawQ = (n, label, na) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
    const lines = doc.splitTextToSize(n + '.   ' + label, ANSX - M - 6);
    const h = Math.max(lines.length*3.9, 5) + 2.4;
    room(h + 2);
    const val = q['q'+n] || '';
    if(val === 'No'){
      doc.setFillColor(254,242,242); doc.rect(M-1.5, y-3.4, W - M*2 + 3, h, 'F');
      doc.setDrawColor(220,38,38); doc.setLineWidth(0.7); doc.line(M-1.5, y-3.4, M-1.5, y-3.4+h);
    }
    doc.setTextColor(15,23,42); doc.text(lines, M + 2, y);
    let bx = ANSX;
    ['Yes','No'].concat(na ? ['N/A'] : []).forEach(o => {
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(90,103,120);
      doc.text(o, bx, y); tick(bx + doc.getTextWidth(o) + 1.2, y, val === o); bx += doc.getTextWidth(o) + 7.5;
    });
    doc.setTextColor(15,23,42);
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.15); doc.line(M, y-3.4+h, W - M, y-3.4+h);
    y += h;
  };

  PIR_Q.forEach(g => {
    room(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.8); doc.setTextColor(...rgb1);
    doc.text(g.g.toUpperCase(), M, y);
    doc.setTextColor(15,23,42); y += 5;
    if(g.g === 'Distribution board(s)'){
      g.items.filter(it => it[0] < 17).forEach(it => drawQ(it[0], it[1], it[2]));
      room(12);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
      doc.text('17.   Sub circuit isolation and overcurrent device type', M + 2, y);
      opts(ANSX, y, ['Fuse','Mcb'], p.q17type);
      doc.setDrawColor(232,238,244); doc.setLineWidth(0.15); doc.line(M, y + 2.2, W - M, y + 2.2);
      y += 7.4;
      g.items.filter(it => it[0] > 17).forEach(it => drawQ(it[0], it[1], it[2]));
      room(26);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.text('20.   RCDs', M + 2, y); y += 1.5;
      doc.autoTable({
        startY: y, margin:{ left: M + 2, right: M },
        head: [['Circuit description','Tripping current (mA)','Longest tripping time (ms)']],
        body: (p.rcds||[]).length ? p.rcds.map(r => [r.desc||'', r.trip||'', r.time||'']) : [['','',''],['','','']],
        theme:'grid', styles:{ fontSize:7, cellPadding:1.6, lineColor:[210,218,228], minCellHeight:6 },
        headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7, fontStyle:'bold' },
        columnStyles:{ 1:{ cellWidth:32, halign:'center' }, 2:{ cellWidth:40, halign:'center' } },
        didParseCell: function(d){
          if(d.section === 'body' && d.column.index === 2){
            const t = parseFloat(d.cell.raw);
            if(!isNaN(t) && t > 300){ d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold'; }
          }
        }
      });
      y = doc.lastAutoTable.finalY + 7;
    } else { g.items.forEach(it => drawQ(it[0], it[1], it[2])); y += 3; }
  });

  y += 4;
  sect('Summary test data');
  line('Min insulation resistance (' + MOHM + ')', p.minIR, M, y, 96);
  line('Max resistance of protective conductor (' + OHM + ')', p.maxRp, COL2, y, COL2+HALF); y += 7;
  line('Max fault loop impedance (' + OHM + ')', p.maxZs, M, y, 96);
  line('Associated device type / size', [p.zsDeviceType, p.zsDeviceSize].filter(Boolean).join(' '), COL2, y, COL2+HALF); y += 9;

  sect('Quality of workmanship');
  opts(M, y, ['Very Good','Satisfactory','Poor'], p.workmanship); y += 9;

  sect('Test instrument serial numbers');
  line('Continuity tester', p.instContinuity, M, y, 96);
  line('Insulation resistance tester', p.instIR, COL2, y, COL2+HALF); y += 7;
  line('Loop impedance tester', p.instLoop, M, y, 96);
  line('RCD tester', p.instRcd, COL2, y, COL2+HALF); y += 9;

  sect('Observations and recommendations');
  opts(M, y, ['No remedial work is required','The following observations are made'], p.noRemedial); y += 6;
  doc.autoTable({
    startY: y, margin:{ left:M, right:M },
    head: [['Ref No.','Comments','Recommendation']],
    body: a.obs.length ? a.obs.map((o,i) => [o.ref || String(i+1), o.comment, '(' + o.code + ')  ' + (PIR_CODES[o.code]||'')])
                       : [['','',''],['','',''],['','','']],
    theme:'grid', styles:{ fontSize:7.2, cellPadding:1.8, lineColor:[210,218,228], minCellHeight:7 },
    headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:7.2, fontStyle:'bold' },
    columnStyles:{ 0:{ cellWidth:16, halign:'center' }, 2:{ cellWidth:52 } },
    didParseCell: function(d){
      if(d.section === 'body' && d.column.index === 2 && String(d.cell.raw).indexOf('(1)') === 0){
        d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = 'bold';
      }
    }
  });
  y = doc.lastAutoTable.finalY + 4;

  doc.setFontSize(6.6); doc.setTextColor(100,116,139);
  doc.text('Each observation is given one of the following numbers to indicate the action recommended:', M, y); y += 3.3;
  doc.text('(1) Requires urgent attention     (2) Requires improvements     (3) Requires some attention     (4) Does not comply with current National Rules for Electrical Installations.', M, y); y += 3.3;
  doc.text('Using (4) does not necessarily imply that the electrical installation inspected is unsafe.', M, y); y += 6;
  doc.setTextColor(15,23,42);

  if(a.urgent.length){
    room(11);
    doc.setFillColor(220,38,38); doc.rect(M, y-4, W - M*2, 7.5, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
    doc.text('URGENT ATTENTION REQUIRED. The person responsible for the installation must be notified without delay.', M + 3, y + 0.8);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); y += 11;
  }

  doc.setFontSize(7.4);
  const rec = doc.splitTextToSize('On the basis that all observations requiring urgent attention have been completed without delay, we recommend that this installation is further inspected and tested after an interval of not more than ' +
    (p.intervalValue || '____') + ' ' + (p.intervalUnit || 'years') + '.', W - M*2);
  room(rec.length*4 + 6); doc.text(rec, M, y); y += rec.length*4 + 5;

  sect('Overall condition of the installation');
  opts(M, y, ['Satisfactory','Unsatisfactory'], a.condition); y += 12;

  sect('Declaration');
  doc.setFontSize(6.8); doc.setTextColor(100,116,139);
  const dec = doc.splitTextToSize('I/We are responsible for the inspection and testing of the electrical installation described in this report, and confirm to the best of my/our knowledge that the tests and observations recorded represent an accurate assessment, within the limits specified, of the condition of the electrical installation.', W - M*2);
  doc.text(dec, M, y); y += dec.length*3.2 + 6;
  doc.setTextColor(15,23,42);

  const sg = job.sig || {};
  room(26);
  if(sg.sig){ try{ doc.addImage(sg.sig, 'PNG', M + 2, y - 1, 44, 15); }catch(e){} }
  const sy = y + 16;
  doc.setDrawColor(150,163,180); doc.setLineWidth(0.25);
  doc.line(M, sy, M + 62, sy); doc.line(M + 70, sy, M + 124, sy); doc.line(M + 132, sy, W - M, sy);
  doc.setFontSize(7.4); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
  doc.text((sg.name || '').toUpperCase(), M + 2, sy - 2);
  doc.text(p.certifierNo || '', M + 72, sy - 2);
  doc.text(fmtDate(sg.date || job.date), M + 134, sy - 2);
  doc.setFontSize(6.6); doc.setFont('helvetica','normal'); doc.setTextColor(120,133,150);
  doc.text('Inspected and tested by (signed)', M, sy + 3.6);
  doc.text('Certifier No.', M + 70, sy + 3.6);
  doc.text('Date', M + 132, sy + 3.6);
}

/* A bundle can hold portrait periodic reports and landscape test records in the
   same file, so the footer measures the page it is actually standing on rather
   than assuming A4 portrait. */
/* Test records render landscape, matching what the field app produces, so the
   copy the client downloads and the copy the electrician handed over are the
   same document. */
function renderTest(doc, job, st){
  const W = 297, M = 12, BOT = 182;
  const t = job.test || {};
  const p = job.pir || {};
  const a = audit(job);
  const cs = t.circuits || [];
  const rgb1 = hexToRgb(st.c1), rgb2 = hexToRgb(st.c2);
  const onC1 = textOn(st.c1) === '#ffffff' ? [255,255,255] : [15,23,42];

  let firstPage = true;
  const head = () => {
    const stops = brandStops(st);
    if(firstPage){
      firstPage = false;
      gradBand(doc, 0, 0, W, 22, stops);
      let tx = M;
      const bannerLogo = st.logoLight || st.logo;
      if(bannerLogo){
        try{
          const pr = doc.getImageProperties(bannerLogo);
          const fit = fitBox(pr.width, pr.height, 15, 16);
          const ly = (22 - fit.h)/2;
          if(!st.logoLight && st.logoBox !== false){
            doc.setFillColor(255,255,255);
            doc.roundedRect(M - 2, ly - 2, fit.w + 4, fit.h + 4, 2, 2, 'F');
          }
          doc.addImage(bannerLogo, pr.fileType === 'PNG' ? 'PNG' : 'JPEG', M, ly, fit.w, fit.h, undefined, 'FAST');
          tx = M + fit.w + 7;
        }catch(e){}
      }
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
      doc.text('ELECTRICAL INSTALLATION TEST RECORD', tx, 10.6);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
      doc.text([st.companyName, st.regNo && ('Reg ' + st.regNo)].filter(Boolean).join('   ·   '), tx, 15.4);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.2);
      doc.text(job.prNo || '', W - M, 10.6, { align:'right' });
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
      doc.text(fmtDate(job.date), W - M, 15.4, { align:'right' });
      doc.setTextColor(15,23,42);
      return 29;
    }
    gradBand(doc, 0, 0, W, 4, stops);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(120,133,150);
    doc.text((st.companyName || '').toUpperCase() + '   ·   ELECTRICAL INSTALLATION TEST RECORD', M, 9);
    doc.text([job.prNo, fmtDate(job.date)].filter(Boolean).join('   ·   '), W - M, 9, { align:'right' });
    doc.setDrawColor(232,238,244); doc.setLineWidth(0.2); doc.line(M, 11.5, W - M, 11.5);
    doc.setTextColor(15,23,42);
    return 18;
  };

  doc.addPage([W, 210], 'landscape');
  let y = head();
  const room = (need) => { if(y + need > BOT){ doc.addPage([W, 210], 'landscape'); y = head(); } };

  const badge = a.condition === 'Unsatisfactory' ? [220,38,38] : a.condition === 'Satisfactory' ? [5,150,105] : [148,163,184];
  doc.setFillColor(248,250,252); doc.roundedRect(M, y - 3, W - M*2, 17, 2, 2, 'F');
  doc.setFillColor(badge[0],badge[1],badge[2]); doc.rect(M, y - 3, 1.6, 17, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(15,23,42);
  doc.text(doc.splitTextToSize(job.customerName || 'Site', 140)[0], M + 5, y + 3);
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(100,116,139);
  doc.text(doc.splitTextToSize([job.address, t.dbRef && ('Board ' + t.dbRef)].filter(Boolean).join('   ·   '), 140)[0], M + 5, y + 8);
  [
    ['RESULT', a.condition === 'Unsatisfactory' ? 'Fail' : a.condition === 'Satisfactory' ? 'Pass' : 'Incomplete', badge],
    ['CIRCUITS', String(cs.length), [15,23,42]],
    ['FULLY TESTED', a.answered + ' of ' + cs.length, [15,23,42]],
    ['FAILED', String(a.failed.length), a.failed.length ? [220,38,38] : [15,23,42]]
  ].forEach((f, i) => {
    const fx = M + 158 + i*30;
    doc.setFont('helvetica','bold'); doc.setFontSize(5.2); doc.setTextColor(148,163,184);
    doc.text(f[0], fx, y + 1);
    doc.setFontSize(6.8); doc.setTextColor(f[2][0], f[2][1], f[2][2]);
    doc.text(doc.splitTextToSize(String(f[1]), 29), fx, y + 5.5);
  });
  doc.setTextColor(15,23,42);
  y += 21;

  const sect = (title) => {
    room(12);
    doc.setFillColor(240,244,248); doc.rect(M, y - 4.2, W - M*2, 6.4, 'F');
    doc.setFillColor(rgb2[0],rgb2[1],rgb2[2]); doc.rect(M, y - 4.2, 1.6, 6.4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(rgb1[0],rgb1[1],rgb1[2]);
    doc.text(title.toUpperCase(), M + 4, y);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
    y += 8;
  };
  const line = (label, val, x, yy, w) => {
    doc.setFontSize(7.2); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
    doc.text(label, x, yy);
    const lw = doc.getTextWidth(label);
    doc.setDrawColor(210,218,228); doc.setLineWidth(0.2);
    doc.line(x + lw + 2, yy + 0.9, x + w, yy + 0.9);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    doc.text(String(val || ''), x + lw + 3.5, yy);
    doc.setFont('helvetica','normal');
  };
  const CW = (W - M*2 - 12) / 3;
  const CX = [M, M + CW + 6, M + (CW + 6)*2];
  const row3 = (a1, a2, a3) => { [a1,a2,a3].forEach((f,i) => { if(f) line(f[0], f[1], CX[i], y, CX[i] + CW); }); y += 7; };
  const grid = (head, body, opts) => {
    room(20);
    doc.autoTable(Object.assign({
      startY: y, margin:{ left:M, right:M }, head:[head], body: body, theme:'grid',
      styles:{ fontSize:6.6, cellPadding:1.4, lineColor:[214,222,232], overflow:'linebreak', valign:'middle' },
      headStyles:{ fillColor: rgb1, textColor: onC1, fontSize:6.4, fontStyle:'bold', halign:'center' }
    }, opts || {}));
    y = doc.lastAutoTable.finalY + 7;
  };

  sect('Installation');
  row3(['Customer', job.customerName], ['Category', p.category], ['Type of work', t.installType]);
  row3(['Address', job.address], ['Board ref', t.dbRef], ['MPRN', t.mprn]);
  row3(['Tested by', job.inspector || (job.sig||{}).name], ['Cert No.', t.certNo], ['Max demand (A)', t.maxDemand]);
  y += 2;

                     10:{ cellWidth:10, halign:'center' }, 11:{ cellWidth:16, halign:'center' } },
      didParseCell: function(d){

  doc.text(fmtDate(sg.date || job.date), M + 90, sy + 3.6, { align:'right' });
  doc.setTextColor(15,23,42);
  y = sy + 10;
}

/* One renderer per kind, chosen in one place. */
function renderRecord(doc, job, st){
  return kindOf(job) === 'test' ? renderTest(doc, job, st) : renderPir(doc, job, st);
}

/* The teardrop badge, bottom-left of every report page. It could never work in
   the header — it is a tall portrait badge and a header slot is short and wide,
   so it came out 24px across with its wordmark unreadable. Down here the page is
   white, so it needs no plate, and there is room to draw it at a size where it
   actually reads. Returns the width used, so the footer text starts clear of
   it. */
function footerMark(doc, st, x, baseY, h){
  const mark = st.logoMark;
  if(!mark) return 0;
  try{
    const pr = doc.getImageProperties(mark);
    const w = pr.width / pr.height * h;
    doc.addImage(mark, 'PNG', x, baseY, w, h, undefined, 'FAST');
    return w;
  }catch(e){ return 0; }
}

/* A bundle can hold portrait periodic reports and landscape test records in the
   same file, so the footer measures the page it is actually standing on rather
   than assuming A4 portrait. */
function pageFurniture(doc, st){
  const M = 12;
  const total = doc.internal.getNumberOfPages();
  for(let i=1; i<=total; i++){
    doc.setPage(i);
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.25);
    doc.line(M, H - 18, W - M, H - 18);
    const mw = footerMark(doc, st, M, H - 16.5, 12);
    const fx = M + (mw ? mw + 3.5 : 0);
    doc.setFontSize(6.4); doc.setFont('helvetica','normal'); doc.setTextColor(140,152,168);
    if(st.disclaimer !== false){
      doc.text('Issued by the contractor named above as their own record. It does not replace any certificate or report that must be issued through Safe Electric.', fx, H - 12);
    }
    doc.setFontSize(6.2);
    doc.text([st.address, st.phone, st.email].filter(Boolean).join('   ·   '), fx, H - 7.5);
    doc.setTextColor(100,116,139); doc.setFont('helvetica','bold'); doc.setFontSize(6.8);
    doc.text('Page ' + i + ' of ' + total, W - M, H - 12, { align:'right' });
  }
}

/* ================= PDF: dashboard report ================= */
function drawColumns(doc, x, y, w, h, data, colA, colB){
  const max = Math.max(1, ...data.map(d => d.total));
  const bw = w / Math.max(data.length, 1);
  doc.setDrawColor(232,238,244); doc.setLineWidth(0.2);
  [0, 0.5, 1].forEach(g => doc.line(x, y + h - g*h, x + w, y + h - g*h));
  data.forEach((d, i) => {
    const bh = (d.total / max) * h;
    const unH = d.total ? (d.unsat / d.total) * bh : 0;
    const bx = x + i*bw + bw*0.22, bwid = bw*0.56;
    doc.setFillColor(...colA); doc.rect(bx, y + h - bh, bwid, Math.max(bh - unH, 0), 'F');
    if(unH > 0){ doc.setFillColor(...colB); doc.rect(bx, y + h - unH, bwid, unH, 'F'); }
    doc.setFontSize(5.4); doc.setTextColor(150,160,175);
    doc.text(d.label.split(' ')[0], bx + bwid/2, y + h + 3.4, { align:'center' });
    if(d.total){ doc.setFontSize(5.6); doc.setTextColor(90,103,120); doc.text(String(d.total), bx + bwid/2, y + h - bh - 1.4, { align:'center' }); }
  });
  doc.setTextColor(15,23,42);
}

function drawHBars(doc, x, y, w, rows, rowH){
  const max = Math.max(1, ...rows.map(r => r.value));
  rows.forEach((r, i) => {
    const ry = y + i*rowH;
    doc.setFontSize(6.6); doc.setTextColor(70,85,105); doc.setFont('helvetica','normal');
    const label = doc.splitTextToSize(r.label, w - 14)[0];
    doc.text(label, x, ry);
    doc.setFillColor(241,245,249); doc.roundedRect(x, ry + 1.2, w - 12, 2.4, 1.2, 1.2, 'F');
    const c = hexToRgb(r.color || '#cd7f32');
    doc.setFillColor(...c);
    doc.roundedRect(x, ry + 1.2, Math.max((r.value/max) * (w - 12), 1.2), 2.4, 1.2, 1.2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.6); doc.setTextColor(15,23,42);
    doc.text(String(r.value), x + w - 10, ry + 3.4);
  });
  doc.setFont('helvetica','normal');
}

/* ================= BOOK-LAYOUT PIR ================= */
/* jsPDF's built-in helvetica has no Greek or symbol glyphs, so ohms and delta
   are spelled out. This has bitten this project twice; do not "fix" it back. */
const SE_OHM = 'ohms', SE_MOHM = 'Mohms';

/* An outlined space with a label in it, standing where artwork would go. Drawn
   rather than filled so there is never a moment where an unlicensed mark exists
   in a generated file. */
function markBox(doc, x, y, w, h, lines){
  doc.saveGraphicsState ? null : null;
  doc.setDrawColor(150, 160, 172); doc.setLineWidth(0.4);
  try{ doc.setLineDashPattern([1.2, 1.2], 0); }catch(e){}
  doc.rect(x, y, w, h);
  try{ doc.setLineDashPattern([], 0); }catch(e){}
  doc.setTextColor(140, 150, 162);
  doc.setFont('helvetica','bold'); doc.setFontSize(w > 34 ? 6 : 4.6);
  const step = w > 34 ? 4 : 3.2;
  let ty = y + h/2 - ((lines.length - 1) * step)/2 + 0.8;
  lines.forEach((l, i) => {
    doc.setFont('helvetica', i === 0 ? 'bold' : 'normal');
    doc.text(l, x + w/2, ty, { align:'center' });
    ty += step;
  });
  doc.setTextColor(20, 24, 32);
}

/* Everything that would change if Safe Electric permit their form and mark to
   be reproduced. Nothing else in renderSeForm needs to know about it.

   To switch it over once permission is in writing (see
   SAFE-ELECTRIC-PERMISSION-REQUEST.md):
     - mark:     point at the supplied artwork instead of the contractor's own
     - footNote: replace with whatever wording they require, verbatim
   If they attach conditions - only where a PR number is assigned, must be
   marked a copy - put them here too, where they apply to every page at once. */
function seBrand(st, opts){
  if(opts && opts.proposal){
    return {
      mark: '',
      placeholder: ['SAFE ELECTRIC MARK', 'would appear here', 'subject to permission'],
      footNote: 'LAYOUT PROPOSAL by ' + (st.companyName || '') + ' - submitted to Safe Electric in support of a request for ' +
        'permission to reproduce this form. Not a report, not a certificate, and not for issue to any customer.'
    };
  }
  return {
    mark: st.logo || st.logoLight || '',
    footNote: (st.companyName || '') + ' - own record of the inspection. The report of record is the numbered page in the ' +
      'Safe Electric book; this is not a Safe Electric certificate and is not issued by or on behalf of Safe Electric.'
  };
}

function renderSeForm(doc, job, st, opts){
  const W = 297, H = 210, M = 13;
  const brand = seBrand(st, opts);
  const p = job.pir || {};
  const a = audit(job);
  const q = p.q || {};
  const ink = () => doc.setTextColor(20, 24, 32);
  const grey = () => doc.setTextColor(110, 120, 132);

  const F = (size, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); };
  const T = (txt, x, y, opt) => doc.text(String(txt == null ? '' : txt), x, y, opt);

  /* A ruled line with whatever we know written on top of it, which is how the
     paper form is filled in. */
  const rule = (x, y, w) => { doc.setDrawColor(60,70,82); doc.setLineWidth(0.25); doc.line(x, y + 1.2, x + w, y + 1.2); };
  const onRule = (val, x, y, w) => {
    rule(x, y, w);
    if(val === '' || val == null) return;
    F(8.6, false); ink();
    T(doc.splitTextToSize(String(val), w - 1)[0], x + 1, y);
  };
  /* label, then the rule that follows it */
  const lineField = (label, val, x, y, w, lblSize) => {
    F(lblSize || 9, false); ink(); T(label, x, y);
    const lw = doc.getTextWidth(label) + 1.5;
    onRule(val, x + lw, y, Math.max(6, w - lw));
  };
  const box = (x, y, on) => {
    doc.setDrawColor(40,48,58); doc.setLineWidth(0.32);
    doc.rect(x, y - 3.1, 3.4, 3.4);
    if(on){ doc.setLineWidth(0.7); doc.setDrawColor(12,16,22);
      doc.line(x + 0.6, y - 1.5, x + 1.4, y - 0.5); doc.line(x + 1.4, y - 0.5, x + 2.9, y - 2.8); doc.setLineWidth(0.32); }
  };
  /* "Domestic [x]" - returns where the next option starts */
  const opt = (label, x, y, on, gap) => {
    F(9, false); ink(); T(label, x, y);
    const bx = x + doc.getTextWidth(label) + 1.6;
    box(bx, y, on);
    return bx + 3.4 + (gap == null ? 7 : gap);
  };
  /* the form says "circle answers" for system earthing */
  const circled = (label, x, y, on) => {
    F(9, false); ink(); T(label, x, y);
    const w = doc.getTextWidth(label);
    if(on){ doc.setDrawColor(12,16,22); doc.setLineWidth(0.5);
      doc.ellipse(x + w/2, y - 1.1, w/2 + 2.2, 3.2); }
    return x + w;
  };
  const heading = (txt, x, y, size) => { F(size || 9.6, true); ink(); T(txt, x, y); };

  /* Every page carries the same head and the same statement of what it is. */
  const page = (n, subtitle) => {
    doc.addPage('a4', 'landscape');
    let y = 20;
    if(brand.mark){
      try{
        const pr = doc.getImageProperties(brand.mark);
        const fit = fitBox(pr.width, pr.height, 22, 13);

      }catch(e){}
    } else if(brand.placeholder){
      markBox(doc, M, y - 9, 30, 15, brand.placeholder);
    }
    F(13.5, true); ink();
    T('Periodic Inspection Report for an Electrical Installation', W/2, y, { align:'center' });

    T('PR No:', W - M - 34, y);
    onRule(p.seNumber || '', W - M - 20, y, 20);
    if(subtitle){ y += 6.4; F(10.6, true); T(subtitle, W/2, y, { align:'center' }); }

    return y + 9;
  };

  /* the foot, on every page */
  const foot = (n) => {
    F(6.2, false); grey();

    T('PAGE ' + n + ' of 4', W - M - 30, H - 7.6);

  /* ---------------- page 1: details and supply ---------------- */
  let y = 20;
  doc.addPage('a4', 'landscape');
  if(opts && opts.proposal){

  F(10, true); T('PR No:', W - M - 34, y);

  y += 6.6;
  lineField('Address', addrL[0] || '', M, y, 112);
  lineField('Address', siteL[0] || '', RX, y, RW);
  y += 6.6;
  onRule(addrL.slice(1, 2).join(', '), M, y, 112);

  y += 6.6;
  onRule(addrL.slice(2).join(', '), M, y, 112);

  y += 7;

  {

  {

    cells.forEach(function(c){

  const qRow = (n, x, yy, wrap) => {

  lineField('Continuity Tester', p.instContinuity || '', CX, ry, W - M - CX); ry += 6.8;
  lineField('Insulation Resistance Tester', p.instIR || '', CX, ry, W - M - CX); ry += 6.8;
  lineField('Loop Impedance Tester', p.instLoop || '', CX, ry, W - M - CX); ry += 6.8;
  lineField('RCD Tester', p.instRcd || '', CX, ry, W - M - CX); ry += 8;
  doc.setFont('helvetica','bolditalic'); doc.setFontSize(9.6); ink(); T('DECLARATION', CX, ry); ry += 5.4;
  F(8.2, false);
  doc.splitTextToSize('I/We the undersigned are responsible for the inspection and testing of the electrical installation described on page 1. of this report. ' +

/* The book-layout copy, saved under the PR number it belongs to. */
function buildSeFormPdf(job, st, opts){
  const proposal = !!(opts && opts.proposal);
  const doc = new jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'landscape', compress:true });
  renderSeForm(doc, job, st, { proposal: proposal });
  doc.deletePage(1);
  const draft = !isSignedOff(job);
  stampWatermarks(doc, { draft: draft, proposal: proposal });
  const p = job.pir || {};
  if(proposal){
    doc.save('LAYOUT-PROPOSAL-for-Safe-Electric-' + (job.date || todayInput()) + '.pdf');
    return;
  }
  doc.save((draft ? 'DRAFT-' : '') + 'PIR-BOOK-' + (p.seNumber ? safeName(p.seNumber) + '-' : '') +
           safeName(job.customerName) + '-' + (job.date || todayInput()) + '.pdf');
}

function buildOneRecordPdf(job, st){
  const isTest = kindOf(job) === 'test';
  const doc = new jspdf.jsPDF({ unit:'mm', format:'a4', orientation: isTest ? 'landscape' : 'portrait', compress:true });
  renderRecord(doc, job, st);
  doc.deletePage(1);   /* the renderer opens its own first page */
  pageFurniture(doc, st);
  const draft = !isSignedOff(job);
  stampWatermarks(doc, { draft });
  doc.save((draft ? 'DRAFT-' : '') + (isTest ? 'TEST-' : 'PIR-') + safeName(job.customerName) + '-' + (job.date || todayInput()) + '.pdf');
}

/* ================= EXCEL ================= */
async function buildWorkbook(jobs, st){
  const wb = new ExcelJS.Workbook();
  wb.creator = st.companyName || 'IFES Electrical Services Ltd.';
  const a = analyse(jobs);
  const head1 = argb(st.c1), head2 = argb(st.c2);

  const banner = (ws, title, cols) => {
    ws.mergeCells(1, 1, 1, cols);
    const c = ws.getCell(1,1);
    c.value = title + '   |   ' + (st.companyName || '');
    c.font = { bold:true, size:12, color:{ argb:'FFFFFFFF' } };
    c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: head2 } };
    c.alignment = { vertical:'middle', horizontal:'left', indent:1 };
    ws.getRow(1).height = 24;
  };
  const styleHeader = (ws, row, cols) => {
    const r = ws.getRow(row);
    r.font = { bold:true, color:{ argb:'FFFFFFFF' }, size:10 };
    r.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: head1 } };
    r.height = 20; r.alignment = { vertical:'middle' };
    ws.autoFilter = { from:{ row:row, column:1 }, to:{ row:row, column:cols } };
    ws.views = [{ state:'frozen', ySplit: row }];
  };

  /* --- Summary --- */
  const wsum = wb.addWorksheet('Summary');
  banner(wsum, 'Programme summary', 4);
  wsum.addRow([]);
  const sumRows = [
    ['Records', a.total],
    ['Periodic inspections', a.byKind.periodic], ['Test records', a.byKind.test],
    ['Sites covered', a.sites],
    ['Satisfactory', a.sat], ['Unsatisfactory', a.unsat],
    ['Satisfactory rate', a.satRate + '%'],
    ['Total observations', a.obsTotal], ['Average per inspection', a.avgObs],
    ['Urgent findings', a.urgent],
    ['Circuits tested', a.circuitsTested + ' of ' + a.circuitsTotal],
    ['Circuits failed', a.circuitsFailed],
    ['Overdue for re-inspection', a.overdue.length],
    ['Due within 90 days', a.due90.length],
    ['Report generated', new Date().toLocaleString('en-IE')]
  ];
  wsum.addRow(['Measure','Value']);
  styleHeader(wsum, 3, 2);
  sumRows.forEach(r => wsum.addRow(r));
  wsum.getColumn(1).width = 32; wsum.getColumn(2).width = 20;
  wsum.addRow([]); wsum.addRow(['Observations by code','Count']);
  ['1','2','3','4'].forEach(c => wsum.addRow(['(' + c + ') ' + PIR_CODES[c], a.byCode[c] || 0]));
  wsum.addRow([]); wsum.addRow(['Checks most often answered "No"','Count']);
  a.topQ.forEach(q => wsum.addRow(['Q' + q.n + ' ' + q.text, q.count]));

  const periodics = jobs.filter(j => kindOf(j) === 'periodic');
  const tests = jobs.filter(j => kindOf(j) === 'test');

  /* --- Test records --- */
  if(tests.length){
    const wt = wb.addWorksheet('Test records');
    const tcols = ['Record No','Date','Site','Address','Category','Type of work','Board ref','Tested by',
                   'Result','Circuits','Fully tested','Failed','Cert No','MPRN','Latitude','Longitude'];
    banner(wt, 'Electrical installation test records', tcols.length);
    wt.addRow([]); wt.addRow(tcols);
    styleHeader(wt, 3, tcols.length);
    tests.forEach(j => {
      const au = audit(j), t = j.test || {}, p = j.pir || {};
      wt.addRow([j.prNo||'', j.date||'', j.customerName||'', j.address||'', p.category||'', t.installType||'', t.dbRef||'',
        j.inspector || (j.sig||{}).name || '',
        au.condition === 'Unsatisfactory' ? 'Fail' : au.condition === 'Satisfactory' ? 'Pass' : 'Incomplete',
        au.total, au.answered, au.failed.length, t.certNo||'', t.mprn||'', j.lat||'', j.lng||'']);
    });
    wt.columns.forEach((c,i) => { c.width = [12,12,28,32,13,18,11,16,12,9,12,8,12,14,11,11][i] || 14; });
    wt.eachRow((row,n) => {
      if(n < 4) return;
      if(String(row.getCell(9).value) === 'Fail') row.getCell(9).font = { bold:true, color:{argb:'FFB91C1C'} };
      if(Number(row.getCell(12).value) > 0) row.getCell(12).font = { bold:true, color:{argb:'FFB91C1C'} };
    });

    /* --- Circuits --- */
    const wc = wb.addWorksheet('Circuits');
    const ccols = ['Record No','Date','Site','Board','Circuit','Designation','Cable','mm2','Points','Device','Type','Rating A',
                   'Rp+Re','Re','L-L','N-N','E-E','IR Ph&N-E','IR Ph-N','IR Ph-Ph','Pre result','Pre comments',
                   'Max Zs','Zs','PFC kA','RCD 1/2','RCD 1x','RCD 5x','Post result','Post comments'];
    banner(wc, 'Circuit readings', ccols.length);
    wc.addRow([]); wc.addRow(ccols);
    styleHeader(wc, 3, ccols.length);
    tests.forEach(j => {
      const t = j.test || {};
      (t.circuits || []).forEach(c => {
        wc.addRow([j.prNo||'', j.date||'', j.customerName||'', t.dbRef||'',
          c.number, c.designation, c.cableType, c.cableSize, c.points, c.device, c.deviceType, c.amps,
          c.pre.rpre, c.pre.re, c.pre.ll, c.pre.nn, c.pre.ee, c.pre.irPNE, c.pre.irPN, c.pre.ir3ph, c.pre.pass, c.pre.comments,
          c.post.maxZs, c.post.zs, c.post.pfc, c.post.rcdHalf, c.post.rcd1, c.post.rcd5, c.post.pass, c.post.comments]);
      });
    });
    wc.columns.forEach((c,i) => { c.width = i < 3 ? [12,12,26][i] : (i === 5 ? 26 : (i === 21 || i === 29 ? 30 : 10)); });
    wc.eachRow((row,n) => {
      if(n < 4) return;
      [21, 29].forEach(col => { if(String(row.getCell(col).value) === 'Fail') row.getCell(col).font = { bold:true, color:{argb:'FFB91C1C'} }; });
    });
  }

  if(!periodics.length){
    const buf0 = await wb.xlsx.writeBuffer();
    return new Blob([buf0], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  /* --- Inspections --- */
  const ws = wb.addWorksheet('Inspections');
  const cols = ['PR No','Safe Electric no.','Date','Site','Address','Category','Reason','Inspector','Condition',
                'Observations','Urgent (C1)','Checks answered','Workmanship','Earthing','Next due','Latitude','Longitude'];
  banner(ws, 'Periodic inspections', cols.length);
  ws.addRow([]); ws.addRow(cols);
  styleHeader(ws, 3, cols.length);
  periodics.forEach(j => {
    const au = audit(j), p = j.pir || {};
    ws.addRow([j.prNo||'', p.seNumber||'', j.date||'', j.customerName||'', j.address||'', p.category||'', p.reason||'',
      j.inspector || (j.sig||{}).name || '', au.condition||'', au.obs.length, au.urgent.length,
      au.answered + ' of ' + au.total, p.workmanship||'', p.earthing||'', au.nextDue,
      j.lat || '', j.lng || '']);
  });
  ws.columns.forEach((c,i) => { c.width = [10,16,12,28,32,13,20,16,14,13,11,16,14,10,12,11,11][i] || 14; });
  ws.eachRow((row,n) => {
    if(n < 4) return;
    if(String(row.getCell(9).value) === 'Unsatisfactory') row.getCell(9).font = { bold:true, color:{argb:'FFB91C1C'} };
    if(Number(row.getCell(11).value) > 0) row.getCell(11).font = { bold:true, color:{argb:'FFB91C1C'} };
  });

  /* --- Observations --- */
  const wo = wb.addWorksheet('Observations');
  const ocols = ['Date','Site','Address','Ref','Observation','Code','Meaning','Raised by check'];
  banner(wo, 'Observations and recommendations', ocols.length);
  wo.addRow([]); wo.addRow(ocols);
  styleHeader(wo, 3, ocols.length);
  a.obsAll.forEach(o => wo.addRow([o.job.date||'', o.job.customerName||'', o.job.address||'',
    o.obs.ref||'', o.obs.comment, o.obs.code, PIR_CODES[o.obs.code]||'', o.obs.qn ? 'Q' + o.obs.qn : '']));
  wo.columns.forEach((c,i) => { c.width = [12,26,28,7,60,7,34,14][i] || 14; });
  wo.eachRow((row,n) => { if(n > 3 && String(row.getCell(6).value) === '1') row.font = { bold:true, color:{argb:'FFB91C1C'} }; });

  /* --- Re-inspection due --- */
  const wd = wb.addWorksheet('Re-inspection due');
  const dcols = ['Site','Address','Last inspected','Condition','Due','Days'];
  banner(wd, 'Re-inspection schedule', dcols.length);
  wd.addRow([]); wd.addRow(dcols);
  styleHeader(wd, 3, dcols.length);
  a.due.forEach(d => wd.addRow([d.site, d.address||'', d.date, d.condition||'', d.nextDue, d.days]));
  wd.columns.forEach((c,i) => { c.width = [28,30,14,14,12,10][i] || 14; });
  wd.eachRow((row,n) => { if(n > 3 && Number(row.getCell(6).value) < 0) row.font = { bold:true, color:{argb:'FFB91C1C'} }; });

  /* --- Question results --- */
  const wq = wb.addWorksheet('Question results');
  const qnums = pirQFlat();
  const qcols = ['Date','Site'].concat(qnums.map(n => 'Q' + n));
  banner(wq, 'Answers to every question', qcols.length);
  wq.addRow([]); wq.addRow(qcols);
  styleHeader(wq, 3, qcols.length);
  periodics.forEach(j => {
    const q = (j.pir||{}).q || {};
    wq.addRow([j.date||'', j.customerName||''].concat(qnums.map(n => q['q'+n] || '')));
  });
  wq.getColumn(1).width = 12; wq.getColumn(2).width = 28;
  qnums.forEach((n,i) => { wq.getColumn(i+3).width = 6; });
  wq.eachRow((row, rn) => {
    if(rn < 4) return;
    row.eachCell((cell, cn) => { if(cn > 2 && cell.value === 'No') cell.font = { bold:true, color:{argb:'FFB91C1C'} }; });
  });

  /* --- Question key --- */
  const wk = wb.addWorksheet('Question key');
  banner(wk, 'What each question number means', 2);
  wk.addRow([]); wk.addRow(['Question','Text']);
  styleHeader(wk, 3, 2);
  qnums.forEach(n => wk.addRow(['Q' + n, Q_TEXT[n]]));
  wk.getColumn(1).width = 10; wk.getColumn(2).width = 82;

  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ================= DETAIL DRAWER ================= */
/* Spending a PR number is an office action — a viewer can see the book, only an
   admin can take a number out of it, and the server enforces that rather than
   this button. */
function AssignPr({job, onAssigned}){
  const [book, setBook] = useState(null);
  const [pick, setPick] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const already = ((job.pir || {}).seNumber || '').trim();

  useEffect(()=>{
    if(!API.on || already) return;
    let live = true;
    /* The book failing to load must not stop a number being typed in — it is
       only there to offer suggestions. An empty list is set either way, so the
       form is always usable. */
    API.call('prBook', {})
      .then(b => { if(live) setBook(b || []); })
      .catch(e => { if(live){ setBook([]);
        setErr(/out of date|Unknown action/i.test(e.message)
          ? STALE_MSG + ' Until then you can still type a number, but it will not be recorded in the book.'
          : 'Could not read the book (' + e.message + '). You can still type a number.'); } });
    return () => { live = false; };
  }, [job.id, already]);

  if(already){
    return (<div className="rounded-xl border border-slate-200 p-3">
      <div className="text-xs font-semibold text-slate-500 mb-0.5">Safe Electric PR No.</div>
      <div className="text-lg font-black" style={{color:C1}}>{already}</div>
      <p className="text-xs text-slate-400 mt-1">Signed out of the book against this record. It prints on the report.</p>
    </div>);
  }

  const free = (book || []).filter(b => b.status !== 'used');
  const assign = async () => {
    const n = (pick || '').trim();
    if(!n) return setErr('Type the PR number from your book.');
    if(!window.confirm('Sign PR number ' + n + ' out against ' + (job.customerName || 'this record') + '?\n\nIt is then recorded as used and cannot be undone from here.')) return;
    setBusy(true); setErr('');
    try{
      const res = await API.call('prAssign', { prNo: n, jobId: job.id });
      onAssigned(n, res && res.addedToBook);
    }catch(e){ setErr(e.message); setBusy(false); }
  };

  return (<div className="rounded-xl border border-slate-200 p-3">
    <div className="text-xs font-semibold text-slate-500 mb-2">Safe Electric PR No. — none yet</div>
    {err && <p className="text-xs text-red-600 font-semibold mb-2">{err}</p>}
    <div className="flex gap-2 items-center flex-wrap">
      {/* Type it off the page in front of you. The list is a convenience when
          the book has been entered in advance, not a requirement. */}
      <input className="field !w-auto !min-h-[38px] !py-1.5" list="pr-free" placeholder="PR number from your book"
        value={pick} onChange={e=>setPick(e.target.value)}
        onKeyDown={e=>{ if(e.key === 'Enter') assign(); }}/>
      <datalist id="pr-free">
        {free.slice(0, 200).map(b => <option key={b.prNo} value={b.prNo}/>)}
      </datalist>
      <button className="btn btn-a !min-h-[38px] !py-1.5" disabled={busy || !pick.trim()} onClick={assign}>
        {busy ? 'Signing out…' : 'Use this number'}
      </button>
    </div>
    <p className="text-xs text-slate-400 mt-2">
      {book === null
        ? 'Type the number from the report you are filling in.'
        : free.length > 0
          ? free.length + ' number' + (free.length === 1 ? '' : 's') + ' left in the book — start typing to pick one, or type any number off the page.'
          : 'Nothing left in the book, so type the number off the page and it will be added.'}
      {' '}Signing one out records who took it and when.
    </p>
  </div>);
}

function Detail({job, onClose}){

  </div>);
}
